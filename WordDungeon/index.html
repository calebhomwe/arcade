<!DOCTYPE html>
<html lang="en">
<head>

<title>Word Dungeon</title>
<style>
  @font-face{font-family:"Fredoka";src:url("../assets/fonts/fredoka.woff2") format("woff2");font-weight:300 700;font-display:swap}
  @font-face{font-family:"Nunito";src:url("../assets/fonts/nunito.woff2") format("woff2");font-weight:400 900;font-display:swap}
/*@kidlookcss*/
/* KL css: the same surfaces as the canvas kit, for DOM panels: parchment, wood with gold trim, navy glass, glossy buttons */
:root{--kl-ink:#4a2d12;--kl-ink2:#7a5428;--kl-cream:#fff3d2;--kl-gold:#ffe7a0;--kl-goldd:#b8781a;--kl-font:"Fredoka","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;
  --kl-grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='4'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
.kl-parch,.kl-wood,.kl-glass{position:relative;font-family:var(--kl-font)}
.kl-parch::before,.kl-wood::before,.kl-glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background-image:var(--kl-grain);mix-blend-mode:overlay;opacity:.32}
.kl-parch{background:linear-gradient(180deg,#f9edcb,#efdaa9 55%,#e0c68e);border:1px solid #b88a4a;border-radius:18px;color:var(--kl-ink);
  box-shadow:0 10px 26px rgba(30,14,4,.5),inset 0 0 0 2px rgba(255,255,255,.35),inset 0 0 36px rgba(130,88,34,.42)}
.kl-wood{background:repeating-linear-gradient(180deg,rgba(255,224,176,.05) 0 1px,rgba(20,8,2,.07) 1px 3px),linear-gradient(180deg,#a2703f,#77492a 45%,#54301a);border-radius:16px;color:var(--kl-cream);
  box-shadow:inset 0 0 0 2px #e2b040,inset 0 0 0 3px #6b430a,inset 0 3px 0 4px rgba(255,236,200,.12),0 8px 20px rgba(0,0,0,.5)}
.kl-glass{background:linear-gradient(180deg,#2a4674,#132546 55%,#0b1730);border:1px solid rgba(190,215,255,.32);border-radius:16px;color:var(--kl-gold);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 18px rgba(0,0,0,.5)}
.kl-btn{font-family:var(--kl-font);font-weight:700;cursor:pointer;color:#4a2c08;border:1px solid #6b430a;border-radius:15px;padding:0 18px;min-height:48px;letter-spacing:.2px;
  background:linear-gradient(180deg,#ffe89a,#e8b338 52%,#a8721a);text-shadow:0 1px 0 rgba(255,246,214,.75);
  box-shadow:0 4px 0 #6b430a,0 8px 14px rgba(20,8,2,.45),inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 0 rgba(120,70,8,.35);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.kl-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6b430a,0 3px 8px rgba(20,8,2,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.kl-btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.kl-btn.green{color:#f4ffe8;border-color:#1d4a19;background:linear-gradient(180deg,#b7ec8c,#58ad46 52%,#2f7229);text-shadow:0 1px 1px rgba(20,60,16,.8);box-shadow:0 4px 0 #1d4a19,0 8px 14px rgba(20,8,2,.45),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(20,60,16,.35)}
.kl-btn.blue{color:#eef8ff;border-color:#173d6b;background:linear-gradient(180deg,#a6d6f8,#4a8fd0 52%,#2760a0);text-shadow:0 1px 1px rgba(10,30,70,.8);box-shadow:0 4px 0 #173d6b,0 8px 14px rgba(20,8,2,.45),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(10,30,70,.35)}
.kl-btn.coral{color:#fff4ee;border-color:#5e1d0f;background:linear-gradient(180deg,#f8b39a,#d9603f 52%,#9a3520);text-shadow:0 1px 1px rgba(70,16,6,.8);box-shadow:0 4px 0 #5e1d0f,0 8px 14px rgba(20,8,2,.45),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(70,16,6,.35)}
.kl-btn.wood{color:var(--kl-cream);border-color:#341e0b;background:linear-gradient(180deg,#b98657,#8a5a30 52%,#5a3719);text-shadow:0 1px 1px rgba(30,14,4,.8);box-shadow:0 4px 0 #341e0b,0 8px 14px rgba(20,8,2,.45),inset 0 1px 0 rgba(255,236,200,.4),inset 0 -2px 0 rgba(30,14,4,.4)}
.kl-btn.cream{border-color:#7a5a2a;background:linear-gradient(180deg,#fffaf0,#f0e2c4 52%,#d4b988);box-shadow:0 4px 0 #7a5a2a,0 8px 14px rgba(20,8,2,.4),inset 0 1px 0 #fff,inset 0 -2px 0 rgba(120,80,30,.25)}
.kl-btn.plum{color:#fbf2ff;border-color:#3b2260;background:linear-gradient(180deg,#d8b8f0,#9a64c8 52%,#623e92);text-shadow:0 1px 1px rgba(40,16,70,.8);box-shadow:0 4px 0 #3b2260,0 8px 14px rgba(20,8,2,.45),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(40,16,70,.35)}
.kl-btn:disabled,.kl-btn[disabled]{filter:grayscale(.7) brightness(.8);cursor:default;transform:none}
.kl-title{font-family:var(--kl-font);font-weight:700;background:linear-gradient(180deg,#fff4b0,#f0c040 55%,#c08a20);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 0 rgba(30,6,12,.75)) drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.kl-trough{height:12px;border-radius:8px;background:rgba(110,70,26,.32);box-shadow:inset 0 2px 3px rgba(60,30,8,.45);overflow:hidden}
.kl-trough>i{display:block;height:100%;border-radius:8px;background:linear-gradient(180deg,#b6ea86,#58ad46 60%,#3f8f3a);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.kl-trough.gold>i{background:linear-gradient(180deg,#ffe28a,#e8b338 60%,#c08a20)}
/*@end*/

  html,body{margin:0;padding:0;height:100%;background:#0b0d16;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center;font-family:"Nunito","Fredoka",system-ui,sans-serif}
  canvas{display:block;background:#0b0d16;touch-action:none}
  /* touch controls: glass discs with gold arrows, big enough for a small thumb */
  .tbtn{position:fixed;width:68px;height:68px;border-radius:50%;background:linear-gradient(180deg,rgba(42,70,116,.82),rgba(11,23,48,.86));
    border:1px solid rgba(190,215,255,.4);color:#ffe7a0;font:700 26px Fredoka,system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;z-index:10;
    bottom:max(18px,env(safe-area-inset-bottom));box-shadow:0 4px 0 rgba(6,12,28,.8),inset 0 1px 0 rgba(255,255,255,.28)}
  .tbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(6,12,28,.8);background:linear-gradient(180deg,#e8b338,#a8721a);color:#4a2c08}
  #tLeft{left:max(16px,env(safe-area-inset-left))}
  #tRight{left:calc(max(16px,env(safe-area-inset-left)) + 80px)}
  #tJump{right:max(16px,env(safe-area-inset-right));width:82px;height:82px;font-size:30px}
  @media (hover:hover) and (pointer:fine){.tbtn{display:none}}
  #tHint{right:calc(max(16px,env(safe-area-inset-right)) + 164px);bottom:max(18px,env(safe-area-inset-bottom));width:56px;height:56px;font-size:22px}
  #tScroll{right:calc(max(16px,env(safe-area-inset-right)) + 96px);width:56px;height:56px;font-size:20px}
  body.hidebtn .tbtn{display:none !important}
  #coach,#grown{position:fixed;z-index:12;font:15px/1.45 "Fredoka",system-ui,sans-serif}
  #coach{display:none;left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 24px));padding:10px 12px;gap:10px;align-items:center;box-sizing:border-box}
  #coach.show{display:flex}
  #coach b{color:#ffd76a}
  #coach .st{font-size:12px;color:#c9b98a;letter-spacing:1px}
  #coach .kl-btn{min-height:44px;padding:0 14px}
  #grown{display:none;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;padding:16px 18px;box-sizing:border-box;color:var(--kl-ink)}
  #grown.show{display:block}
  /* DOM progression strip: level, stars, coins, daily goal, achievements — always visible over the canvas */
  #wdprog{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:9;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
    font:700 13px Fredoka,system-ui,sans-serif;pointer-events:none;max-width:calc(100vw - 16px)}
  #wdprog span{background:rgba(11,23,48,.8);border:1px solid rgba(190,215,255,.42);border-radius:14px;padding:3px 10px;color:#ffe7a0;white-space:nowrap}
  #grown h2{margin:0 0 4px;color:#a03a10;font-size:22px}
  .lk-p{margin:6px 0;color:var(--kl-ink2);font-size:14px;font-weight:700}
  .lk-p b{color:var(--kl-ink)}
  .lk-next{color:#2f6d2a}
  .lk-t{width:100%;border-collapse:collapse;font-size:14px;color:var(--kl-ink)}
  .lk-t td{padding:4px;border-bottom:1px solid rgba(110,70,26,.25)}
  .lk-t td+td{text-align:right;width:56px;color:var(--kl-ink2)}
</style>
</head>
<body>
<canvas id="cv" width="960" height="540"></canvas>
<div class="tbtn" id="tLeft">◀</div>
<div class="tbtn" id="tRight">▶</div>
<div class="tbtn" id="tJump">▲</div>
<div class="tbtn" id="tScroll" role="button" aria-label="Use a hint scroll">📜</div>
<div class="tbtn" id="tHint" role="button" aria-label="Hint">?</div>
<div id="wdprog" aria-hidden="true"></div>
<div id="coach" class="kl-glass" role="status" aria-live="polite"><div style="flex:1"><div class="st" id="coachStep"></div><div id="coachText"></div></div>
  <button class="kl-btn cream" id="coachSkip">Skip</button></div>
<div id="grown" class="kl-parch" role="dialog" aria-label="For grown-ups"><h2>For grown-ups</h2>
  <div class="lk-p">what was practised, how accurate it was, and what to practise next</div>
  <div id="grownBody"></div><div style="text-align:center;margin-top:10px"><button class="kl-btn cream" id="grownBack">Back</button></div></div>
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   WORD DUNGEON: a question-locked side-scrolling platformer for young explorers.
   Doors and chests are locked by questions: jump on the letter/number runes below the
   lock in the right order. A wrong rune never hurts, it teaches. Five dungeon themes,
   stars for every floor, hero outfits, a relic collection, a daily goal.
   Single file, Canvas 2D, zero network. Everything is drawn in code with the "rich look"
   kit (KL): warm torchlight, stone, wood, gold and glass.
   ═══════════════════════════════════════════════════════════════════════ */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=960;const H=540;
/* the view is 540 tall and as wide as the screen allows, so a phone held sideways is filled, not letterboxed */
let SCALE=1,DPRW=1;
function fit(){
  const d=Math.min(devicePixelRatio||1,2),ar=innerWidth/Math.max(1,innerHeight);
  W=Math.round(Math.max(760,Math.min(1200,H*ar)));
  const s=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=Math.round(W*s)+'px';cv.style.height=Math.round(H*s)+'px';
  const bw=Math.round(W*s*d),bh=Math.round(H*s*d);
  cv.width=bw;cv.height=bh;SCALE=bw/W;DPRW=d;
  if(typeof KL!=='undefined')KL.dpr(SCALE);
  if(typeof resetSprites==='function')resetSprites();
  if(typeof placeCoach==='function')placeCoach();
}
/* ── tiny helpers ─────────────────────────────────────────────────────── */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuffleWord(chars){
  const shuffled=shuf(chars.slice());
  if(shuffled.join('')===chars.join('')){
    const different=shuffled.findIndex(ch=>ch!==shuffled[0]);
    if(different>0)[shuffled[0],shuffled[different]]=[shuffled[different],shuffled[0]];
  }
  return shuffled;
}
function mulberry32(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296;};}
const aabb=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const TAU=Math.PI*2;
const SDK=window.ArcadeSDK||null;
window.addEventListener('unhandledrejection',e=>{try{if(e.reason&&/decod|encoding/i.test(String(e.reason.message||e.reason.name||e.reason)))e.preventDefault();}catch(_){}});
const kitSfx=(n,o)=>{try{if(SDK&&SDK.sfx)SDK.sfx(n,o||{});}catch(e){}};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dayBefore=iso=>{const [y,m,d]=iso.split('-').map(Number);const t=new Date(y,m-1,d-1);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};

/* ═══════════ persistence ═══════════ */
const MKEY='worddungeon.meta.v1';
function defMeta(){return{bestMath:0,bestSpell:0,runs:0,coinsEarned:0,stars:0,hero:0,relics:[],cp:{math:1,spell:1},daily:{d:'',n:0,got:0},streak:{last:'',n:0,best:0},xp:0,badges:[],locksAllTime:0,bossesAllTime:0};}
function loadMeta(){
  const d=defMeta();
  try{const m=JSON.parse(localStorage.getItem(MKEY));
    if(m&&typeof m==='object'){
      for(const k of['bestMath','bestSpell','runs','coinsEarned','stars','hero','xp','locksAllTime','bossesAllTime'])d[k]=+m[k]||0;
      if(Array.isArray(m.badges))d.badges=m.badges.map(String).slice(0,24);
      if(Array.isArray(m.relics))d.relics=m.relics.map(Number).filter(n=>n>=0&&n<12);
      if(m.cp){d.cp.math=Math.max(1,+m.cp.math||1);d.cp.spell=Math.max(1,+m.cp.spell||1);}
      if(m.daily&&typeof m.daily==='object'){d.daily.d=String(m.daily.d||'');d.daily.n=+m.daily.n||0;d.daily.got=+m.daily.got||0;}
      if(m.streak&&typeof m.streak==='object'){d.streak.last=String(m.streak.last||'');d.streak.n=+m.streak.n||0;d.streak.best=+m.streak.best||0;}
    }}catch(e){}
  return d;
}
function saveMeta(m){try{localStorage.setItem(MKEY,JSON.stringify(m));}catch(e){}paintProg();}
/* the DOM progression strip: repainted only when its text changes */
function paintProg(){
  const el=document.getElementById('wdprog');if(!el)return;
  try{syncDaily();}catch(e){}
  const txt='Level '+wdLevel()+' · '+(meta.xp||0)+' XP|⭐ '+(meta.stars||0)+' stars|🪙 '+(meta.coinsEarned||0)+' coins earned|Daily goal '+Math.min(meta.daily.n,DAILY_GOAL)+'/'+DAILY_GOAL+(meta.daily.got?' 🎁':'')+'|Achievements '+((meta.badges||[]).length);
  if(el.dataset.t===txt)return;el.dataset.t=txt;
  el.innerHTML=txt.split('|').map(s=>'<span>'+s+'</span>').join('');
}
let meta=loadMeta();
function syncDaily(){const t=todayISO();if(meta.daily.d!==t)meta.daily={d:t,n:0,got:0};}
syncDaily();
/* explorer level and badges: honest counters kept next to the rest of the save */
const wdLevel=()=>1+Math.floor((meta.xp||0)/25);
const wdLevelPct=()=>Math.round(((meta.xp||0)%25)/25*100);
const WD_BADGES=[
  {id:'first-lock', n:'First lock opened', t:()=>(meta.locksAllTime||0)>=1},
  {id:'ten-locks',  n:'Ten locks opened',  t:()=>(meta.locksAllTime||0)>=10},
  {id:'slime-king', n:'Slime King beaten', t:()=>(meta.bossesAllTime||0)>=1},
  {id:'relic',      n:'First relic found', t:()=>(meta.relics||[]).length>=1},
  {id:'daily',      n:'Daily goal done',   t:()=>!!(meta.daily&&meta.daily.got)},
  {id:'deep',       n:'Floor 5 reached',   t:()=>Math.max(meta.cp?meta.cp.math:1,meta.cp?meta.cp.spell:1)>=5},
  {id:'wardrobe',   n:'Hero unlocked',     t:()=>(meta.stars||0)>=12}
];
function wdCheckBadges(){
  const out=[];
  for(const b of WD_BADGES){if(!(meta.badges||[]).includes(b.id)&&b.t()){(meta.badges=meta.badges||[]).push(b.id);out.push(b.n);}}
  return out;
}

/*@kidlook*/
/* KL: a small canvas "rich look" kit. Warm light, layered depth, real-feeling surfaces (wood, parchment, gold, navy glass),
   built from gradients and seeded noise, cached as sprites so a phone draws them with drawImage. No outlines-as-style. */
const KL=(function(){
  'use strict';
  const TAU=Math.PI*2, K={}, cache=new Map();
  /* a sprite cache with a ceiling: sizes that vary (bars, panels) can never grow it without limit */
  const _cset=cache.set;cache.set=function(k,v){if(this.size>=240)this.delete(this.keys().next().value);return _cset.call(this,k,v);};
  let DPR=1;
  K.cache=cache;
  K.dpr=function(d){if(d!==undefined&&d!==DPR){DPR=d;cache.clear();grainT=null;}return DPR;};
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  K.clamp=clamp;
  K.rng=function(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296;};};
  /* ---- colour ---- */
  function h2r(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
  function r2h(r,g,b){const f=v=>('0'+Math.round(clamp(v,0,255)).toString(16)).slice(-2);return'#'+f(r)+f(g)+f(b);}
  K.mix=function(a,b,t){const A=h2r(a),B=h2r(b);return r2h(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);};
  K.lit=function(h,a){return K.mix(h,'#fff3d6',a);};      /* light goes warm */
  K.dark=function(h,a){return K.mix(h,'#241a4a',a);};     /* shadow goes cool and violet, never grey */
  K.rgba=function(h,a){const c=h2r(h);return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';};
  K.make=function(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*DPR));c.height=Math.max(1,Math.round(h*DPR));const g=c.getContext('2d');g.scale(DPR,DPR);return{c,g,w,h};};
  function rp(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
  K.rp=rp;
  /* ---- grain: one small noise tile, laid over surfaces with a blend mode ---- */
  let grainT=null;
  function grainTile(){
    if(grainT)return grainT;const s=96,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d'),id=g.createImageData(s,s),R=K.rng(11);
    for(let i=0;i<s*s;i++){const v=128+(R()-.5)*110+(R()<.03?(R()-.5)*90:0);id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=255;}
    g.putImageData(id,0,0);grainT=c;return c;
  }
  K.grain=function(g,x,y,w,h,alpha,mode){g.save();g.globalCompositeOperation=mode||'overlay';g.globalAlpha=alpha;g.fillStyle=g.createPattern(grainTile(),'repeat');g.fillRect(x,y,w,h);g.restore();};
  /* ---- surfaces ---- */
  K.wood=function(g,x,y,w,h,base,seed){
    base=base||'#7b4b27';const R=K.rng(seed||3);
    const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,K.lit(base,.16));gr.addColorStop(.45,base);gr.addColorStop(1,K.dark(base,.32));g.fillStyle=gr;g.fillRect(x,y,w,h);
    g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
    const n=Math.max(10,Math.round(h/2.6));
    for(let i=0;i<n;i++){const yy=y+R()*h,amp=.6+R()*2.2,ph=R()*6,f=.006+R()*.02;
      g.strokeStyle=R()<.55?'rgba(38,18,6,'+(.05+R()*.15)+')':'rgba(255,214,160,'+(.03+R()*.08)+')';g.lineWidth=.5+R()*1.5;g.beginPath();
      for(let xx=0;xx<=w;xx+=10){const yv=yy+Math.sin(xx*f+ph)*amp;xx?g.lineTo(x+xx,yv):g.moveTo(x,yv);}g.stroke();}
    const knots=Math.round(w/200);

/* ═══════════ LEARNING KIT — age bands, teaching hints, a report for grown-ups ═══════════
   Hints teach the rule or the next step; they never hand over the answer.
   Every answer is logged against the skill it practised, so a grown-up can read
   what was practised, how accurate it was and what to practise next. */
const LEARN=(function(){
  const BANDS=[
    {id:'5-7', label:'Ages 5–7',  math:[1,2], word:[1,2]},
    {id:'7-9', label:'Ages 7–9',  math:[2,3], word:[2,3]},
    {id:'9-11',label:'Ages 9–11', math:[3,4], word:[3,5]}];
  const SPELL=['','Spelling short words','Spelling everyday words','Spelling longer words',
               'Spelling tricky words','Spelling advanced words'];
  const TIPS={
    'Adding within 20':'Start at the bigger number and count on, or make a ten first (8 + 5 = 8 + 2 + 3).',
    'Adding bigger numbers':'Add the tens, then the ones, then put the two parts together.',
    'Taking away within 20':'Count up from the smaller number to the bigger one on a number line.',
    'Taking away bigger numbers':'Take away the tens first, then the ones.',
    'Times tables to 9 × 9':'Skip-count out loud (3, 6, 9, 12…) and learn one table at a time.',
    'Times tables to 12 × 12':'Practise the 6, 7, 8 and 12 times tables; use 10 × then adjust.',
    'Dividing into equal groups':'Turn it round: 24 ÷ 6 means 6 × ? = 24.',
    'Multiply before adding':'In a two-step sum, do the × part first, then the +.',
    'Fractions of amounts':'Divide by the bottom number, then multiply by the top number.',
    'Percentages of amounts':'10% is ÷ 10, 50% is a half, 25% is a quarter.',
    'Number bonds':'Learn the pairs that make 10 by heart, then use them for 20 and 100.',
    'Checking sums (true or false)':'Work the sum out first, then compare it with the one shown.'};
  const SPELL_TIP='Say the word slowly, look at it, cover it, write it, then check it.';
  const VOW='AEIOU';
  const TEAMS={SH:'sh',CH:'ch',TH:'th',WH:'w',PH:'f',CK:'k',NG:'ng'}, SILENT={KN:'n',WR:'r'};
  const clampN=(v,a,b)=>v<a?a:v>b?b:v;

  /* ---- what a math prompt practises, and how to teach it ---- */
  function parseMath(prompt,note){
    const p=String(prompt||'').replace(/\s*=\s*\?\s*$/,'').replace(/-/g,'−').trim();
    let m;
    if((m=p.match(/^(\d+) \+ (\d+) × (\d+)$/)))return{k:'two',a:+m[1],b:+m[2],c:+m[3]};
    if((m=p.match(/^(\d+)\/(\d+) of (\d+)$/)))return{k:'frac',n:+m[1],d:+m[2],t:+m[3]};
    if((m=p.match(/^(\d+)% of (\d+)$/)))return{k:'pct',p:+m[1],t:+m[2]};
    if((m=p.match(/^(\d+) \+ \?(?: = (\d+))?$/))){
      const t=m[2]?+m[2]:+(String(note||'').match(/(\d+)/)||[0,0])[1];
      return{k:'bond',a:+m[1],t:t};}
    if((m=p.match(/^(.+) = (\d+)$/))){const inner=parseMath(m[1]);if(inner)return{k:'tf',q:inner,s:+m[2],text:m[1]};}
    if((m=p.match(/^(\d+) ([+−×÷]) (\d+)$/)))return{k:m[2],a:+m[1],b:+m[3]};
    return null;
  }
  function mathSkill(prompt,note){
    const q=parseMath(prompt,note); if(!q)return 'Mental maths';
    if(q.k==='+')return q.a+q.b<=20?'Adding within 20':'Adding bigger numbers';
    if(q.k==='−')return q.a<=20?'Taking away within 20':'Taking away bigger numbers';
    if(q.k==='×')return (q.a<=9&&q.b<=9)?'Times tables to 9 × 9':'Times tables to 12 × 12';
    if(q.k==='÷')return 'Dividing into equal groups';
    if(q.k==='two')return 'Multiply before adding';
    if(q.k==='frac')return 'Fractions of amounts';
    if(q.k==='pct')return 'Percentages of amounts';
    if(q.k==='bond')return 'Number bonds';
    return 'Checking sums (true or false)';
  }
  function skip(n,times){const s=[];for(let i=1;i<=Math.min(3,times-1);i++)s.push(n*i);return s.join(', ')+'…';}
  function mathHint(prompt,note){
    const q=parseMath(prompt,note);
    if(!q)return 'Read the question twice, then work it out one step at a time.';
    const big=Math.max(q.a,q.b),small=Math.min(q.a,q.b);
    switch(q.k){
      case '+':
        if(q.a+q.b<=20){
          if(big<10&&big+small>10)return `Make a ten: ${big} needs ${10-big} more to reach 10. Take ${10-big} from the ${small}, then add what is left on to 10.`;
          return `Number line: start at ${big} and hop ${small} to the right. Count the hops out loud.`;}
        if(small<10){const up=Math.ceil((big+1)/10)*10-big;
          return small>up?`Start at ${big}. Hop ${up} to reach ${big+up}, then hop on the other ${small-up}.`
                         :`Start at ${big} and count on ${small} more, one hop at a time.`;}
        return `Split into tens and ones: add ${Math.floor(q.a/10)*10} + ${Math.floor(q.b/10)*10} first, then ${q.a%10} + ${q.b%10}, then put them together.`;
      case '−':
        if(q.a<=20)return `Number line: start at ${q.b} and count up to ${q.a}. How many hops did you make?`;
        if(q.b<10){const down=q.a%10;
          return down&&q.b>down?`Count back from ${q.a}: hop back ${down} to reach ${q.a-down}, then hop back the other ${q.b-down}.`
                               :`Count back ${q.b} from ${q.a}, one hop at a time.`;}
        if(q.b%10===0)return `Take away ${q.b/10} tens: count back from ${q.a} in tens.`;
        return `Take away the tens first: ${q.a} − ${Math.floor(q.b/10)*10}. Then take away the ${q.b%10} ones that are left.`;
      case '×':
        if(q.a===10||q.b===10)return `Times 10: put a zero on the end of the other number.`;
        if(q.a===2||q.b===2)return `Times 2 is doubling: add ${q.a===2?q.b:q.a} to itself.`;
        if(q.a===5||q.b===5)return `Times 5 is half of times 10: work out ${q.a===5?q.b:q.a} × 10, then halve it.`;
        if(q.a===9||q.b===9){const o=q.a===9?q.b:q.a;return `Times 9: work out ${o} × 10, then take away one ${o}.`;}
        return `${q.a} × ${q.b} is ${q.b} groups of ${q.a}. Skip-count by ${q.a}: ${skip(q.a,q.b)} and stop after ${q.b} jumps.`;
      case '÷':
        return `How many groups of ${q.b} make ${q.a}? Think ${q.b} × ? = ${q.a}, or skip-count by ${q.b} until you reach ${q.a}.`;
      case 'two':
        return `Multiply first: work out ${q.b} × ${q.c}, then add ${q.a} to that.`;
      case 'frac':
        return q.n===1?`Split ${q.t} into ${q.d} equal groups. One group is the answer.`
                      :`Split ${q.t} into ${q.d} equal groups, then take ${q.n} of the groups.`;
      case 'pct':
        if(q.p===50)return `50% means half. What is half of ${q.t}?`;
        if(q.p===25)return `25% is a quarter: halve ${q.t}, then halve it again.`;
        if(q.p===75)return `75% is three quarters: find a quarter of ${q.t}, then take three of them.`;
        if(q.p===10)return `10% means one tenth: share ${q.t} into 10 equal parts (${q.t} ÷ 10).`;
        return `${q.p}% is ${q.p/10} lots of 10%. First find 10% of ${q.t} (that is ${q.t} ÷ 10), then multiply by ${q.p/10}.`;
      case 'bond':
        return q.t===10||q.t===20?`Count up from ${q.a} to ${q.t} on your fingers or a number line.`
                                 :`Count up from ${q.a} to the next ten, then on in tens to ${q.t}.`;
      case 'tf':
        return `Work out ${q.text} yourself first, then check: is it really ${q.s}?`;
    }
    return '';
  }

  /* ---- spelling: the first letter, the length, then sound-by-sound nudges ---- */
  function spellHint(word,idx,clue){
    const W=String(word).toUpperCase(), n=W.length; idx=clampN(idx|0,0,n-1);
    const c=W[idx], prev=W[idx-1]||'', so=W.slice(0,idx), tail=clue?` Clue: “${String(clue).replace('~','___')}”`:'';
    if(idx===0)return `It starts with the letter ${c} and has ${n} letters. Say the word slowly and listen to each sound.`+tail;
    const pair=prev+c;
    if(TEAMS[pair])return `After “${so}”, ${prev} teams up with the next letter to make one sound: /${TEAMS[pair]}/.`;
    if(SILENT[pair])return `The ${prev} is silent here: the sound you hear is /${SILENT[pair]}/.`;
    if(prev==='Q')return `Rule: the letter Q nearly always has the same vowel straight after it, and together they say /kw/.`;
    if(c===prev)return `After “${so}”, the same letter comes again: this word has a double letter here.`;
    if(c==='E'&&idx===n-1)return `Last letter: it is a silent e at the end. It makes the vowel before it say its name.`;
    if(VOW.includes(c)&&VOW.includes(prev))return `After “${so}”, another vowel joins in: two vowels team up to make one sound here.`;
    if(VOW.includes(c)||(c==='Y'&&idx===n-1))return `After “${so}” comes a vowel sound (a, e, i, o, u${c==='Y'?' or y':''}). Say “${so.toLowerCase()}…” slowly: which vowel do you hear?`;
    return `After “${so}” comes a consonant. Say “${so.toLowerCase()}…” slowly and listen for the next sound. ${n-idx} letter${n-idx>1?'s':''} to go.`;
  }

  /* ---- the record ---- */
  function create(key){
    let R={bands:{},skills:{},missWords:[],sessions:0,answered:0,correct:0,since:new Date().toISOString().slice(0,10)};
    try{const s=JSON.parse(localStorage.getItem(key));if(s&&typeof s==='object')R=Object.assign(R,s);}catch(e){}
    let S={skills:{},answered:0,correct:0,missWords:[]};   /* this session */
    const save=()=>{try{localStorage.setItem(key,JSON.stringify(R));}catch(e){}};
    const bump=(o,skill,ok)=>{const s=o[skill]||(o[skill]={r:0,w:0});ok?s.r++:s.w++;};
    const api={
      BANDS,
      band(){return BANDS.find(b=>b.id===R.band)||null;},
      bandIndex(){const i=BANDS.findIndex(b=>b.id===R.band);return i<0?0:i;},
      setBand(id){R.band=id;save();},
      /* a tier inside the band: the band's easiest tier plus the ramp, capped at the band's hardest */
      tier(kind,ramp){const b=BANDS[api.bandIndex()],r=kind==='word'?b.word:b.math;return clampN(r[0]+(ramp|0),r[0],r[1]);},
      startSession(){S={skills:{},answered:0,correct:0,missWords:[]};R.sessions++;save();},
      note(skill,ok,word){
        bump(R.skills,skill,ok);bump(S.skills,skill,ok);
        R.answered++;S.answered++;if(ok){R.correct++;S.correct++;}
        if(word&&!ok){const w=String(word).toLowerCase();
          if(!S.missWords.includes(w))S.missWords.push(w);
          R.missWords=[w].concat(R.missWords.filter(x=>x!==w)).slice(0,12);}
        if(word&&ok)R.missWords=R.missWords.filter(x=>x!==String(word).toLowerCase());
        save();
      },
      noteMath(prompt,ok,note){api.note(mathSkill(prompt,note),ok);},
      noteSpell(level,ok,word){api.note(SPELL[clampN(level|0,1,5)],ok,word);},
      session(){return S;},
      /* the grown-up report: {lines:[...], next:'...'} for this session and all time */
      report(scope){
        const src=scope==='session'?S:R, rows=Object.keys(src.skills).map(k=>{const s=src.skills[k];
          return{skill:k,n:s.r+s.w,acc:Math.round(100*s.r/Math.max(1,s.r+s.w))};}).sort((a,b)=>b.n-a.n);
        const acc=Math.round(100*src.correct/Math.max(1,src.answered));
        let weak=rows.filter(r=>r.n>=3).sort((a,b)=>a.acc-b.acc)[0]||rows.slice().sort((a,b)=>a.acc-b.acc)[0];
        let next;
        if(!rows.length)next='Play a round to start the record.';
        else if(weak&&weak.acc<85)next=`${weak.skill} (${weak.acc}% right). ${TIPS[weak.skill]||SPELL_TIP}`;
        else{const bi=api.bandIndex();
          next=bi<BANDS.length-1&&src.answered>=10?`Everything practised is 85% or better: try ${BANDS[bi+1].label} next.`
                                                   :'Keep going at this level: accuracy is strong.';}
        const words=(scope==='session'?S.missWords:R.missWords).slice(0,8);
        return{rows,acc,answered:src.answered,correct:src.correct,next,words,
               sessions:R.sessions,since:R.since,band:BANDS[api.bandIndex()].label};
      },
      /* plain HTML, styled by each game */
      reportHTML(scope){
        const r=api.report(scope), esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
        if(!r.answered)return `<p class="lk-p">No answers yet${scope==='session'?' this round':''}. Play a round and the report fills in.</p>`;
        return `<p class="lk-p"><b>${r.answered}</b> answer${r.answered>1?'s':''}, <b>${r.acc}%</b> right`+
          (scope==='session'?'':` · ${r.sessions} round${r.sessions>1?'s':''} since ${esc(r.since)} · level ${esc(r.band)}`)+`</p>`+
          `<table class="lk-t">${r.rows.slice(0,8).map(x=>`<tr><td>${esc(x.skill)}</td><td>${x.n}</td><td>${x.acc}%</td></tr>`).join('')}</table>`+
          (r.words.length?`<p class="lk-p">Words to practise: <b>${r.words.map(esc).join(', ')}</b></p>`:'')+
          `<p class="lk-p lk-next">Practise next: ${esc(r.next)}</p>`;
      },
      mathSkill,mathHint,spellHint,SPELL,
    };
    return api;
  }
  return{create,mathSkill,mathHint,spellHint,BANDS};
})();

/* ═══════════ QUESTION CORE (lifted from Spell & Maths Galaxy) ═══════════ */

const word=lv=>{const w=pick(WORDS[clamp(lv,1,5)]);return{t:w[0],h:w[1]};};
function clueSentence(w,idx){
  const masked=w.t.split('').map((c,i)=>i<idx?c:'·').join('');
  const s=w.h.replace('~',masked);
  return s.charAt(0).toUpperCase()+s.slice(1);
}
/* one-line teaching hints, shown after a miss */
function hintFor(op,a,b){
  switch(op){
    case '+': return `start at ${a}, count on ${b} more`;
    case '−': return `count up from ${b} to ${a}`;
    case '×': return `${b} groups of ${a} — or ${a} groups of ${b}`;
    case '÷': return `how many ${b}s make ${a}?`;
    default: return '';
  }
}
function qMath(d){
  let a,b,op,ans,sp,mn,mx,hint='';
  if(d===1){op=Math.random()<.5?'+':'−';a=rint(1,10);b=rint(1,10);if(op==='−'&&b>a)[a,b]=[b,a];
            ans=op==='+'?a+b:a-b;sp=4;mn=0;mx=20;}
  else if(d===2){const r=Math.random();
    if(r<.34){op='+';a=rint(5,30);b=rint(5,30);ans=a+b;sp=7;mn=0;mx=64;}
    else if(r<.68){op='−';a=rint(10,45);b=rint(1,a);ans=a-b;sp=7;mn=0;mx=45;}
    else{op='×';a=rint(2,9);b=rint(2,9);ans=a*b;sp=8;mn=0;mx=90;}}
  else if(d===3){const r=Math.random();
    if(r<.25){op='+';a=rint(25,99);b=rint(25,99);ans=a+b;sp=14;mn=0;mx=200;}
    else if(r<.5){op='−';a=rint(40,99);b=rint(10,a);ans=a-b;sp=14;mn=0;mx=99;}
    else if(r<.78){op='×';a=rint(3,12);b=rint(3,12);ans=a*b;sp=12;mn=0;mx=150;}
    else{op='÷';b=rint(2,9);ans=rint(2,12);a=b*ans;sp=6;mn=0;mx=20;}}
  else{ /* tier 4: two-step, fractions of a quantity, percentages */
    const r=Math.random();
    if(r<.4){const b1=rint(2,9),b2=rint(2,9); a=rint(3,18); ans=a+b1*b2;
      return{prompt:`${a} + ${b1} × ${b2}`,hint:`${b1} × ${b2} = ${b1*b2}, then ${a} + ${b1*b2}`,
             answer:String(ans)};}
    if(r<.7){const den=pick([2,3,4,5]); const num=pick([1,1,1,2,3].filter(n=>n<den));
      const T=den*rint(3,12); ans=T/den*num;
      return{prompt:`${num}/${den} of ${T}`,hint:`divide ${T} by ${den} (bottom), then times by ${num} (top)`,
             answer:String(ans)};}
    const p=pick([10,20,25,50,75]), T=pick([20,40,60,80,100,200]);
    ans=T/100*p;
    return{prompt:`${p}% of ${T}`,hint:`${p}% of ${T} = ${T} ÷ 100 × ${p}`,answer:String(ans)};}
  hint=hintFor(op,a,b);
  return{prompt:`${a} ${op} ${b}`,hint,answer:String(ans)};
}
/* build a lock question for the current mode+level.
   {prompt, hint, answer, chars} — chars are the rune glyphs to lay out. */
function makeQuestion(mode,level){
  const d=LK.tier('math',Math.floor((level-1)/2));   /* the age band sets the range; depth ramps inside it */
  if(mode==='math'){
    const q=qMath(d);
    const need=q.answer.split('');
    const chars=[...need];
    const digs='0123456789';
    let guard=0;
    while(chars.length<Math.max(5,need.length+2)&&guard++<60){
      const g=digs[rint(0,9)];
      if(!need.includes(g))chars.push(g);
    }
    return{prompt:q.prompt+' = ?',hint:q.hint,answer:q.answer,chars:shuf(chars),kind:'math',raw:q.prompt};
  }
  const wt=LK.tier('word',Math.floor((level-1)/2));
  const w=word(wt);
  return{prompt:clueSentence(w,0),hint:'rebuild the word from the sentence clue',
         answer:w.t,chars:shuffleWord(w.t.split('')),word:w,kind:'spell',tier:wt};
}


/* ═══ spelling variants: an Australian/British spelling is shown, the common US spelling is accepted too ═══
   spellAdv(word, idx, ch) tells how many letters of the word a tapped letter completes: 0 = wrong, 1 = right,
   2 = right, and it is the US spelling that leaves out the "u" of -our (neighbour: n-e-i-g-h-b-o-r).
   A letter swap such as grey/gray is accepted the same way. */
const OUR_WORDS=/^(neighbour|colour|favourite|honour|humour|labour|harbour|flavour|behaviour|rumour|savour|vapour)$/;
const US_SUB={grey:{2:'a'},greyhound:{2:'a'}};
function spellAdv(word,idx,ch){
  word=String(word).toLowerCase();ch=String(ch).toLowerCase();
  if(word[idx]===ch)return 1;
  if(OUR_WORDS.test(word)&&word[idx]==='u'&&word[idx-1]==='o'&&word[idx+1]===ch)return 2;
  const s=US_SUB[word];if(s&&s[idx]===ch)return 1;
  return 0;
}

const AU={ctx:null,on:true,
  init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
         if(this.ctx&&this.ctx.state!=='running'){try{this.ctx.resume();}catch(e){}}},
  note(f,d=.15,type='square',v=.06,delay=0){
    if(!this.on||!this.ctx||(SDK&&SDK.muted))return;
    try{const c=this.ctx,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
      o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+.02);
      g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);}catch(e){}},
  jump(){this.note(300,.12,'triangle',.06);},
  djump(){this.note(420,.12,'triangle',.06);},
  coin(){this.note(880,.08,'triangle',.06);this.note(1320,.1,'triangle',.05,.06);kitSfx('coin',{volume:.5});},
  good(){this.note(392,.12,'triangle',.08);this.note(523,.16,'triangle',.07,.08);},
  bad(){this.note(196,.26,'sine',.07);this.note(147,.3,'sine',.06,.08);},
  stomp(){this.note(180,.1,'square',.07);this.note(90,.15,'square',.05,.05);kitSfx('pop',{volume:.6});},
  hurt(){this.note(140,.25,'sawtooth',.06);kitSfx('hurt',{volume:.5});},
  unlock(){[392,494,587,784].forEach((f,i)=>this.note(f,.2,'triangle',.07,i*.09));kitSfx('unlock',{volume:.7});},
  die(){[330,262,196,131].forEach((f,i)=>this.note(f,.25,'triangle',.06,i*.14));}
};

function bindTouchBtn(el,code){
  if(!el)return;
  const on=e=>{e.preventDefault();if(!keys[code])onKeyPress(code);keys[code]=true;AU.init();};
  const off=e=>{e.preventDefault();keys[code]=false;};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
}

function makeLevel(n){
  G.solids=[];G.coinsArr=[];G.torches=[];G.slimes=[];G.locks=[];G.hazards=[];G.particles=[];G.boss=null;
  G.trapCount=0;G.hurtCount=0;G.keys=0;G.safe={x:250,y:GY-40};
  const R=mulberry32(G.runSeed+n*7919);
  if(n%4===0){ /* boss arena */
    G.level_w=1300;addFloor(G.solids,0,G.level_w);
    G.torches.push({x:120,y:GY-10},{x:G.level_w-120,y:GY-10},{x:G.level_w/2,y:GY-10});
    G.player=newPlayer(80,GY-40);
    G.boss={x:G.level_w-260,y:GY-88,w:96,h:88,hp:3,maxhp:3,vy:0,hop:0,dir:-1,enrage:0,q:null,runes:[],idx:0,timer:18,anim:0,deadT:0};
    bossQuestion();return;
  }
  const nsec=n<=2?1:2+Math.min(2,Math.floor(n/4));
  const padStart=260+nsec*SECW,PAD=1300;
  G.level_w=padStart+PAD;
  addFloor(G.solids,0,330);
  const c={coins:G.coinsArr,torches:G.torches,hazards:G.hazards};
  const used=[];
  for(let i=0;i<nsec;i++){
    let t=Math.floor(R()*TEMPLATES.length),guard=0;while(used.includes(t)&&guard++<8)t=Math.floor(R()*TEMPLATES.length);
    used.push(t);TEMPLATES[t](G.solids,R,260+i*SECW,c);
  }
  addFloor(G.solids,padStart,G.level_w);
  G.torches.push({x:padStart+70,y:GY-10},{x:padStart+640,y:GY-10},{x:G.level_w-200,y:GY-10});
  const nsl=1+Math.min(3,Math.floor(n/2));
  for(let i=0;i<nsl;i++){const sx=380+R()*(G.level_w-1900);G.slimes.push({x:sx,y:GY-30,w:34,h:28,dir:R()<.5?-1:1,x0:sx-120,x1:sx+120,dead:false,squash:0});}
  G.locks.push(makeLock('chest',padStart+560,padStart+60,n));
  G.locks.push(makeLock('door',padStart+1120,padStart+660,n));
  G.exit={x:G.level_w-110,y:GY-92,w:60,h:92};
  G.player=newPlayer(250,GY-40);
}
function bossQuestion(){
  const b=G.boss;b.q=makeQuestion(G.mode,G.level);b.idx=0;
  const chars=b.q.chars,n=chars.length,total=Math.min(n*58,700),startX=(G.level_w-total)/2;
  b.runes=chars.map((ch,i)=>({x:startX+i*(total/n),y:GY-14,w:Math.min(40,total/n-6),h:14,ch,used:false,glow:0,pressed:false,reveal:false,spikeT:0}));
  b.timer=18;
}

/* ═══════════ flow control ═══════════ */
function startRun(mode,floor){
  G.mode=mode;G.level=Math.max(1,floor||1);G.startFloor=G.level;G.hp=5;G.coins=0;G.keys=0;G.scrolls=1;G.runStars=0;G.bossWins=0;
  LK.startSession();closeGrown();
  G.runSeed=(Math.random()*1e9)|0;
  G.phase='play';meta.runs++;saveMeta(meta);
  makeLevel(G.level);
}
const bestKey=()=>G.mode==='math'?'bestMath':'bestSpell';
function bankBest(){if(G.level>meta[bestKey()]){meta[bestKey()]=G.level;saveMeta(meta);}}
function levelClear(){
  bankBest();
  const stars=G.hurtCount===0?3:G.hurtCount<=1?2:1;
  G.lastStars=stars;G.runStars+=stars;meta.stars+=stars;
  if(G.level%4===0){meta.cp[G.mode]=Math.max(meta.cp[G.mode],G.level+1);G.banner={t:3,txt:'Checkpoint saved!'};}
  syncDaily();
  const t=todayISO();if(meta.streak.last!==t){meta.streak.n=(meta.streak.last===dayBefore(t))?meta.streak.n+1:1;meta.streak.last=t;meta.streak.best=Math.max(meta.streak.best,meta.streak.n);}
  saveMeta(meta);G.phase='shop';kitSfx(stars>=2?'levelup':'win',{volume:.8});
}
function nextLevel(){G.level++;G.phase='play';makeLevel(G.level);}
function retryFloor(){G.hp=5;G.phase='play';makeLevel(G.level);}
function die(){
  if(G.phase!=='play')return;
  G.player.dead=true;AU.die();bankBest();G.phase='gameover';
}
function hurt(n){
  const p=G.player;
  if(!p||p.inv>0||G.phase!=='play')return false;
  G.hp-=(n||1);p.inv=1.6;G.hurtCount++;if(!RM.matches)G.shake=.3;
  AU.hurt();
  for(let i=0;i<10;i++)G.particles.push({x:p.x+p.w/2,y:p.y+p.h/2,vx:(Math.random()-.5)*260,vy:-Math.random()*220,t:.6,c:'#e0605a',s:3});
  if(G.hp<=0)die();
  return true;
}

/* ═══════════ rune logic (shared by locks and the boss) ═══════════ */
function onRune(owner,rune){
  if(rune.used||rune.spikeT>0)return;
  const solved=owner.solved===true||(owner===G.boss&&owner.hp<=0);
  if(solved)return;
  const need=owner.q.answer[owner.idx];
  if(need===undefined)return;
  const adv=owner.q.kind==='spell'?spellAdv(owner.q.answer,owner.idx,rune.ch):(rune.ch===need?1:0);
  if(adv>0){
    rune.used=true;rune.glow=1;owner.idx+=adv;AU.good();
    for(let i=0;i<8;i++)G.particles.push({x:rune.x+rune.w/2,y:rune.y,vx:(Math.random()-.5)*180,vy:-Math.random()*200,t:.6,c:'#ffe88a',s:3});
    if(owner.idx>=owner.q.answer.length){noteAnswer(owner.q,true);runeComplete(owner);}
    else if(owner.q.kind==='spell')owner.q.prompt=clueSentence(owner.q.word,owner.idx);
  }else{
    /* a wrong rune never costs a heart: it wobbles, a hint teaches, and the sequence starts again */
    G.trapCount++;rune.spikeT=1.0;AU.bad();
    noteAnswer(owner.q,false);
    toast(owner.q.kind==='spell'?LK.spellHint(owner.q.word.t,owner.idx,owner.q.word.h):(owner.q.hint||'look at the clue again'));
    owner.idx=0;
    for(const r of owner.runes){r.used=false;r.glow=0;}
    if(owner.q.kind==='spell')owner.q.prompt=clueSentence(owner.q.word,0);
    if(owner===G.boss){owner.enrage=1.0;owner.timer=Math.max(8,owner.timer);}
  }
}
function runeComplete(owner){
  owner.idx=owner.q.answer.length;
  if(owner===G.boss){bossHit();return;}
  owner.solved=true;AU.unlock();
  syncDaily();meta.daily.n++;
  meta.locksAllTime=(meta.locksAllTime||0)+1;meta.xp=(meta.xp||0)+2;
  const nb=wdCheckBadges();for(const n of nb){G.banner={t:2.6,txt:'Achievement: '+n};}
  if(meta.daily.n>=DAILY_GOAL&&!meta.daily.got){meta.daily.got=1;meta.stars++;G.coins+=20;G.banner={t:3,txt:'Daily goal done! +1 star, +20 coins'};}
  saveMeta(meta);
  const bx=owner.x+owner.w/2;for(let i=0;i<24;i++)G.particles.push({x:bx,y:GY-owner.h*.6,vx:(Math.random()-.5)*380,vy:-Math.random()*380,t:1,c:i%3?'#ffd75e':'#fff6b0',s:4});
  if(owner.kind==='door'){G.keys++;say('The door opens. You got the KEY!',2.5);}
  else{
    const gain=8+Math.floor(Math.random()*7);G.coins+=gain;meta.coinsEarned+=gain;
    let msg='The chest spills '+gain+' coins!';
    if(Math.random()<.5){const free=RELICS.map((r,i)=>i).filter(i=>!meta.relics.includes(i));if(free.length){const id=pick(free);meta.relics.push(id);meta.stars++;G.newRelic=id;msg='A relic! '+RELICS[id].n;G.banner={t:3,txt:'New relic: '+RELICS[id].n+' '+RELICS[id].e};}}
    say(msg,2.6);saveMeta(meta);
  }
}
function bossHit(){
  const b=G.boss;b.hp--;AU.unlock();say('The king reels!',1.6);
  if(b.hp<=0){
    const gain=25;G.coins+=gain;meta.coinsEarned+=gain;meta.bossesAllTime=(meta.bossesAllTime||0)+1;meta.xp=(meta.xp||0)+6;saveMeta(meta);G.bossWins++;
    const nb2=wdCheckBadges();if(nb2.length)say('Achievement: '+nb2[0],2.4);
    say('SLIME KING falls! +'+gain+' coins',3);b.deadT=1.2;
    for(let i=0;i<40;i++)G.particles.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:(Math.random()-.5)*420,vy:-Math.random()*380,t:1.1,c:i%2?'#5cc85c':'#a6f0a6',s:4});
  }else bossQuestion();
}

/* ═══════════ key presses ═══════════ */
function onKeyPress(code){
  if(code==='Slash'||code==='NumpadDivide'){showHint();return;}
  if(G.phase==='menu'){
    if(document.getElementById('grown').classList.contains('show')){if(code==='Enter'||code==='KeyG')closeGrown();return;}
    if(G.menuTab!=='main'){if(code==='Escape'||code==='Enter')G.menuTab='main';return;}
    if(code==='Digit1'||code==='Numpad1')startRun('math');
    else if(code==='Digit2'||code==='Numpad2')startRun('spell');
    else if(code==='KeyH'||code==='KeyI')G.howto=!G.howto;
    else if(code==='KeyB'){LK.setBand(LK.BANDS[(LK.bandIndex()+1)%LK.BANDS.length].id);}
    else if(code==='KeyT')coachStart();
    else if(code==='KeyG')openGrown();
    return;
  }
  if(G.phase==='gameover'){if(code==='Enter'||code==='Space'||code==='KeyR')retryFloor();else if(code==='Escape')G.phase='menu';return;}
  if(G.phase==='shop'){
    if(code==='Digit1'||code==='Numpad1')buyItem('heart');
    else if(code==='Digit2'||code==='Numpad2')buyItem('scroll');
    else if(code==='Enter'||code==='Space'||code==='KeyE')nextLevel();
    return;
  }
  if(G.phase==='play'&&code==='KeyH'&&G.scrolls>0){
    const tgt=activeLock()||G.boss;
    if(tgt&&tgt.idx<tgt.q.answer.length){
      G.scrolls--;const need=tgt.q.answer[tgt.idx];
      for(const r of tgt.runes)if(r.ch===need&&!r.used)r.reveal=true;
      say('Hint scroll: the next rune glows!',2);
    }else say('No active lock to divine',1.5);
  }
}
function activeLock(){for(const L of G.locks)if(!L.solved)return L;return null;}
function buyItem(what){
  if(what==='heart'&&G.coins>=12&&G.hp<7){G.coins-=12;G.hp++;say('Bought a heart',1.6);AU.coin();}
  else if(what==='scroll'&&G.coins>=6){G.coins-=6;G.scrolls++;say('Bought a hint scroll',1.6);AU.coin();}
  else AU.bad();
}

/* ═══════════ update ═══════════ */
function physics(dt){
  const p=G.player;
  const dir=(rightDown()?1:0)-(leftDown()?1:0),target=dir*270;
  p.vx+=(target-p.vx)*Math.min(1,dt*14);
  if(dir!==0)p.face=dir;
  const jp=jumpDown();
  if(jp&&!prevJump){
    if(p.onG){p.vy=-660;p.jumps=1;p.onG=false;p.squash=-.25;AU.jump();}
    else if(p.jumps<2){p.vy=-600;p.jumps=2;AU.djump();for(let i=0;i<6;i++)G.particles.push({x:p.x+p.w/2,y:p.y+p.h,vx:(Math.random()-.5)*140,vy:60,t:.4,c:'#cfd6ee',s:3});}
  }
  prevJump=jp;
  const wasG=p.onG;
  p.vy+=1900*dt;if(p.vy>900)p.vy=900;
  const walls=[...G.solids];
  for(const L of G.locks)if(L.kind==='door'&&!L.solved)walls.push({x:L.x,y:GY-150,w:L.w,h:150,type:'doorwall'});
  p.x+=p.vx*dt;
  for(const s of walls){if(aabb(p,s)){if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;p.vx=0;}}
  p.x=clamp(p.x,0,G.level_w-p.w);
  p.y+=p.vy*dt;p.onG=false;
  for(const s of walls){if(aabb(p,s)){if(p.vy>0){p.y=s.y-p.h;p.onG=true;p.jumps=0;if(p.vy>300)p.squash=.3;p.vy=0;}else if(p.vy<0){p.y=s.y+s.h;p.vy=0;}}}
  if(p.onG&&!G.hazards.some(hz=>Math.abs(p.x-hz.x-hz.w/2)<hz.w/2+90)&&p.x>40)G.safe={x:p.x,y:p.y};
  /* falling into a pit costs a heart, then you are set back on safe ground: never a run-ending fall */
  if(p.y>H+80){hurt(1);if(G.phase==='play'){p.x=G.safe.x;p.y=G.safe.y-10;p.vy=0;p.vx=0;p.inv=1.6;}return;}
  if(p.inv>0)p.inv-=dt;
  if(p.squash!==0)p.squash+=(0-p.squash)*Math.min(1,dt*12);
  p.anim+=dt*Math.abs(p.vx)*.05;

  const foot={x:p.x+4,y:p.y+p.h-2,w:p.w-8,h:8};
  const owners=[...G.locks];
  if(G.boss&&G.boss.hp>0)owners.push(G.boss);
  for(const owner of owners){
    if(owner!==G.boss&&owner.solved)continue;
    for(const r of owner.runes){
      const hit=aabb(foot,r);
      if(hit&&!r.pressed){r.pressed=true;onRune(owner,r);}else if(!hit&&r.pressed)r.pressed=false;
      if(r.spikeT>0)r.spikeT-=dt;
      if(r.glow>0)r.glow-=dt*1.5;
    }
  }
  for(const hz of G.hazards){if(aabb(foot,hz)){if(hurt(1))p.vy=-420;}}
  for(const c of G.coinsArr){
    if(!c.taken&&aabb(p,{x:c.x-12,y:c.y-12,w:24,h:24})){
      c.taken=true;G.coins++;AU.coin();
      for(let i=0;i<6;i++)G.particles.push({x:c.x,y:c.y,vx:(Math.random()-.5)*180,vy:-Math.random()*200,t:.5,c:'#ffe066',s:3});
    }
  }
  for(const s of G.slimes){
    if(s.dead)continue;
    s.x+=s.dir*46*dt;
    if(s.x<s.x0){s.x=s.x0;s.dir=1;}
    if(s.x+s.w>s.x1){s.x=s.x1-s.w;s.dir=-1;}
    if(aabb(p,{x:s.x,y:s.y-2,w:s.w,h:s.h})){
      if(p.vy>140&&p.y+p.h-s.y<26){s.dead=true;s.squash=.4;AU.stomp();p.vy=-480;p.jumps=1;
        for(let i=0;i<12;i++)G.particles.push({x:s.x+s.w/2,y:s.y,vx:(Math.random()-.5)*240,vy:-Math.random()*200,t:.6,c:i%2?'#5cc85c':'#a6f0a6',s:4});
      }else hurt(1);
    }
  }
  if(G.exit&&aabb(p,G.exit)){
    if(G.keys>0){G.keys=0;levelClear();}
    else say('LOCKED: open the rune door for the key',1.4);
  }
  updateBoss(dt);
}
function updateBoss(dt){
  const b=G.boss,p=G.player;
  if(!b)return;
  if(b.hp<=0){if(b.deadT>0){b.deadT-=dt;if(b.deadT<=0)levelClear();}return;}
  b.anim+=dt;b.hop-=dt;
  if(b.hop<=0){b.hop=b.enrage>0?1.1:1.8;b.vy=-380;b.dir=p.x>b.x?1:-1;}
  b.vy+=1500*dt;b.x+=b.dir*(b.enrage>0?130:70)*dt;b.y+=b.vy*dt;
  if(b.y>GY-b.h){b.y=GY-b.h;b.vy=0;}
  b.x=clamp(b.x,60,G.level_w-b.w-60);
  if(b.enrage>0)b.enrage-=dt;
  b.timer-=dt;
  if(b.timer<=0){
    toast(b.q.hint||'Too slow! The sequence starts again.');b.idx=0;b.timer=18;
    for(const r of b.runes){r.used=false;r.glow=0;}
    if(b.q.kind==='spell')b.q.prompt=clueSentence(b.q.word,0);b.enrage=1.0;
  }
  if(aabb(p,b))hurt(1);
}

/* ═══════════ sprites (painted once, stamped) ═══════════ */
function resetSprites(){brickCache.clear();bgTiles.clear();vig=null;}
const brickCache=new Map(),bgTiles=new Map();let vig=null;
function brickTile(th){
  const key=th.name,hit=brickCache.get(key);if(hit&&hit.k===KL.dpr())return hit;
  const m=KL.make(80,40),g=m.g,R=KL.rng(th.at*31+7);
  for(let r=0;r<2;r++){const off=r*20;for(let c=-1;c<3;c++){const x=c*40+off-(off?0:0),y=r*20,bw=40,bh=20;
    const base=KL.mix(th.wall[0],th.wall[1],.25+R()*.5);const gr=g.createLinearGradient(0,y,0,y+bh);gr.addColorStop(0,KL.lit(base,.12));gr.addColorStop(1,KL.dark(base,.18));g.fillStyle=gr;g.fillRect(x+1,y+1,bw-2,bh-2);
    g.fillStyle='rgba(255,236,200,.16)';g.fillRect(x+1,y+1,bw-2,2);g.fillStyle='rgba(8,4,12,.28)';g.fillRect(x+1,y+bh-3,bw-2,2);
    for(let i=0;i<3;i++){g.fillStyle='rgba(255,255,255,'+(.03+R()*.05)+')';g.beginPath();g.ellipse(x+4+R()*(bw-8),y+4+R()*(bh-8),2+R()*4,1+R()*2,0,0,TAU);g.fill();}}}
  g.strokeStyle='rgba(6,4,10,.55)';g.lineWidth=1.4;
  for(let r=0;r<=2;r++){g.beginPath();g.moveTo(0,r*20);g.lineTo(80,r*20);g.stroke();}
  for(let r=0;r<2;r++){const off=r*20;for(let c=0;c<3;c++){g.beginPath();g.moveTo(c*40+off,r*20);g.lineTo(c*40+off,r*20+20);g.stroke();}}
  KL.grain(g,0,0,80,40,.2,'overlay');
  const s={c:m.c,k:KL.dpr()};brickCache.set(key,s);return s;
}
function bgTile(th){
  const key=th.name,hit=bgTiles.get(key);if(hit)return hit;
  const w=520,m=KL.make(w,H),g=m.g,R=KL.rng(th.at*13+3);
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,th.back[0]);gr.addColorStop(1,th.back[1]);g.fillStyle=gr;g.fillRect(0,0,w,H);
  /* distant arches and pillars, lit softly from the torches */
  for(let i=0;i<2;i++){const cx=130+i*260;
    const pg=g.createLinearGradient(cx-26,0,cx+26,0);pg.addColorStop(0,KL.rgba(th.wall[1],.55));pg.addColorStop(.5,KL.rgba(th.wall[0],.5));pg.addColorStop(1,KL.rgba(th.wall[1],.6));g.fillStyle=pg;g.fillRect(cx-24,90,48,H);
    g.fillStyle=KL.rgba(th.wall[0],.45);g.fillRect(cx-32,80,64,16);g.beginPath();g.moveTo(cx+24,110);g.quadraticCurveTo(cx+130,10,cx+236,110);g.lineTo(cx+236,130);g.quadraticCurveTo(cx+130,40,cx+24,130);g.closePath();g.fill();}
  for(let i=0;i<7;i++){g.fillStyle='rgba(255,255,255,'+(.02+R()*.03)+')';g.beginPath();g.ellipse(R()*w,R()*H,30+R()*60,10+R()*20,0,0,TAU);g.fill();}
  KL.grain(g,0,0,w,H,.14,'overlay');
  const s={c:m.c,w};bgTiles.set(key,s);return s;
}
function vignette(){
  if(vig&&vig.w===W&&vig.k===KL.dpr())return vig.c;
  const m=KL.make(W,H),g=m.g,gr=g.createRadialGradient(W/2,H*.55,H*.35,W/2,H*.5,Math.max(W,H)*.68);gr.addColorStop(0,'rgba(4,2,10,0)');gr.addColorStop(1,'rgba(4,2,10,.4)');g.fillStyle=gr;g.fillRect(0,0,W,H);
  vig={c:m.c,w:W,k:KL.dpr()};return vig.c;
}

/* ═══════════ render: helpers ═══════════ */
const INK='#4a2d12',INK2='#7a5428',CREAM='#fff3d2',GOLDT='#ffe7a0';
function T(s,x,y,px,col,align,weight,mode){KL.text(ctx,s,x,y,px,col,align||'left',weight||700,'Fredoka,system-ui,sans-serif',mode);}
function txt(s,x,y,size,col,align,bold){T(s,x,y,size,col,align,bold?700:600,'plain');}
function emo(s,x,y,px,align){ctx.font=Math.round(px)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillStyle='#000';ctx.fillText(s,x,y);}
const panelC=(kind,x,y,w,h,o)=>KL.drawPanel(ctx,kind,x,y,Math.ceil(w/8)*8,Math.ceil(h/8)*8,o);
function btnC(id,x,y,w,h,tone,label,fn,size){
  hit(x,y,w,h+5,fn);const pressed=pressId===id&&G.time-pressT<.14;
  KL.drawButton(ctx,tone,x,y+(pressed?2:0),w,h,pressed);
  T(label,x+w/2,y+h/2+(pressed?3:1),size||Math.min(24,h*.42),tone==='cream'?INK:CREAM,'center',700,tone==='cream'?'engrave':undefined);
}
let pressId='',pressT=0;
function starShape(x,y,r,col,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);ctx.beginPath();for(let i=0;i<10;i++){const rad=i%2?r*.47:r,a=-Math.PI/2+i*Math.PI/5;ctx[i?'lineTo':'moveTo'](Math.cos(a)*rad,Math.sin(a)*rad);}ctx.closePath();
  const gr=ctx.createLinearGradient(-r,-r,r,r);gr.addColorStop(0,'#fff6b8');gr.addColorStop(.45,col||'#f4c236');gr.addColorStop(1,'#b87a12');ctx.fillStyle=gr;ctx.fill();ctx.lineWidth=Math.max(1,r*.07);ctx.strokeStyle='rgba(120,70,8,.75)';ctx.stroke();ctx.restore();}
function drawHeart(x,y,s,full){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(0,8);ctx.bezierCurveTo(-12,-2,-8,-12,0,-6);ctx.bezierCurveTo(8,-12,12,-2,0,8);ctx.closePath();
  const gr=ctx.createRadialGradient(-3,-4,1,0,0,12);if(full){gr.addColorStop(0,'#ff9aa8');gr.addColorStop(.5,'#e0405a');gr.addColorStop(1,'#8a1a30');}else{gr.addColorStop(0,'#4a3a44');gr.addColorStop(1,'#241820');}
  ctx.fillStyle=gr;ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='rgba(40,8,16,.7)';ctx.stroke();
  if(full){ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.ellipse(-4,-4,2.4,1.4,-.6,0,TAU);ctx.fill();}ctx.restore();
}

function drawSolid(s,th,camX){
  const x0=s.x-camX;if(x0+s.w<-40||x0>W+40)return;
  const t=brickTile(th),vx0=Math.max(0,Math.floor((Math.max(s.x,camX-40)-s.x)/80)),vx1=Math.ceil((Math.min(s.x+s.w,camX+W+40)-s.x)/80);
  ctx.save();ctx.beginPath();ctx.rect(x0,s.y,s.w,s.h);ctx.clip();
  for(let ry=0;ry*40<s.h;ry++)for(let rx=vx0;rx<vx1;rx++)ctx.drawImage(t.c,x0+rx*80,s.y+ry*40,80,40);
  if(s.type==='plat'||s.type==='floor'||s.type==='block'){const tg=ctx.createLinearGradient(0,s.y,0,s.y+10);tg.addColorStop(0,KL.rgba(th.glow,.28));tg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=tg;ctx.fillRect(x0,s.y,s.w,10);}
  if(s.type==='floor'||s.type==='block'){const bg=ctx.createLinearGradient(0,s.y+20,0,s.y+s.h);bg.addColorStop(0,'rgba(4,2,10,0)');bg.addColorStop(1,'rgba(4,2,10,.55)');ctx.fillStyle=bg;ctx.fillRect(x0,s.y,s.w,s.h);}
  ctx.restore();
  if(s.type==='plat'){const sg=ctx.createLinearGradient(0,s.y+s.h,0,s.y+s.h+12);sg.addColorStop(0,'rgba(4,2,10,.45)');sg.addColorStop(1,'rgba(4,2,10,0)');ctx.fillStyle=sg;ctx.fillRect(x0,s.y+s.h,s.w,12);}
  ctx.fillStyle='rgba(255,240,210,.25)';ctx.fillRect(x0,s.y,s.w,1.6);
}
function drawTorch(t,tt,th){
  const x=t.x-G.camX;
  const fl=Math.sin(tt*11+t.x)*3;
  const gg=ctx.createRadialGradient(x,t.y-34,2,x,t.y-34,150);gg.addColorStop(0,KL.rgba(th.glow,.36));gg.addColorStop(1,KL.rgba(th.glow,0));ctx.fillStyle=gg;ctx.fillRect(x-150,t.y-184,300,300);
  const wg=ctx.createLinearGradient(x-4,0,x+4,0);wg.addColorStop(0,'#7a5228');wg.addColorStop(1,'#3a2210');ctx.fillStyle=wg;ctx.fillRect(x-4,t.y-28,8,28);
  ctx.fillStyle='#3a3f4a';ctx.fillRect(x-8,t.y-32,16,6);
  const fg=ctx.createRadialGradient(x,t.y-40+fl*.3,1,x,t.y-40,13);fg.addColorStop(0,'#fffbe0');fg.addColorStop(.35,'#ffc860');fg.addColorStop(1,'rgba(255,120,30,0)');ctx.fillStyle=fg;
  ctx.beginPath();ctx.ellipse(x,t.y-40+fl*.4,6+fl*.3,13-fl*.4,0,0,TAU);ctx.fill();
}
function drawRune(r,need,tt,th){
  const x=r.x-G.camX,active=r.used||r.glow>0,hot=r.reveal&&!r.used&&need&&r.ch===need;
  /* a carved stone plate with a glowing rim, and the letter floating above it on a small glass tablet */
  const wob=r.spikeT>0?Math.sin(tt*40)*2:0;
  const sg=ctx.createLinearGradient(0,r.y,0,r.y+r.h);sg.addColorStop(0,active?'#6a9a6a':'#8a8fa2');sg.addColorStop(1,active?'#2a5a34':'#4a4f62');ctx.fillStyle=sg;
  ctx.beginPath();ctx.roundRect?ctx.roundRect(x,r.y+wob,r.w,r.h,4):ctx.rect(x,r.y+wob,r.w,r.h);ctx.fill();
  ctx.strokeStyle=hot?`rgba(255,240,120,${.5+.5*Math.sin(tt*8)})`:active?'rgba(160,255,160,.9)':'rgba(255,255,255,.28)';ctx.lineWidth=hot?3:1.6;ctx.strokeRect(x+1,r.y+1+wob,r.w-2,r.h-2);
  if(active)KL.glow(ctx,x+r.w/2,r.y-6,42,'#8aff9a',.5*Math.max(.3,r.glow));
  const ty=r.y-34+(r.spikeT>0?-4:0);
  panelC('glass',x+r.w/2-15,ty,30,28,{r:8,shadow:false});
  T(r.ch,x+r.w/2,ty+15,18,active?'#b8ffb8':GOLDT,'center',700);
  if(hot)KL.glow(ctx,x+r.w/2,ty+14,40,'#fff08a',.5);
}
function bubbleC(cx,cy,line1,need){
  ctx.font='700 16px Fredoka,system-ui,sans-serif';
  const tw=ctx.measureText(line1).width,w=Math.min(W-30,tw+34),x=clamp(cx,w/2+8,W-w/2-8);
  let lines=[line1];
  if(tw+34>w){lines=[];let ln='';for(const wd of line1.split(' ')){const t=ln?ln+' '+wd:wd;if(ctx.measureText(t).width>w-30&&ln){lines.push(ln);ln=wd;}else ln=t;}if(ln)lines.push(ln);}
  const h=20+lines.length*20+(need!==undefined?22:0);
  panelC('parch',x-w/2,cy-h/2,w,h,{r:12,gold:true});
  lines.forEach((l,i)=>T(l,x,cy-h/2+18+i*20,16,INK,'center',700,'engrave'));
  if(need!==undefined)T('next rune: '+need,x,cy+h/2-14,14,'#2f7a3a','center',700,'engrave');
}
function drawLock(L,tt,th){
  const x=L.x-G.camX;
  if(L.kind==='door'){
    if(L.solved){ctx.fillStyle='rgba(20,12,4,.35)';ctx.fillRect(x+4,GY-150,L.w-8,150);ctx.fillStyle='#3a2410';ctx.fillRect(x-4,GY-158,8,158);ctx.fillRect(x+L.w-4,GY-158,8,158);}
    else{
      KL.drawPanel(ctx,'wood',x,GY-150,L.w,150,{r:8,gold:false});
      ctx.fillStyle='#2a2a34';for(const yy of[GY-120,GY-50])ctx.fillRect(x+2,yy,L.w-4,8);
      ctx.fillStyle='#e2b040';ctx.beginPath();ctx.arc(x+L.w/2,GY-88,11,0,TAU);ctx.fill();ctx.fillStyle='#4a2c08';ctx.fillRect(x+L.w/2-2.5,GY-90,5,12);
      T('?',x+L.w/2,GY-128,26,GOLDT,'center',700);
    }
  }else{
    const y=GY-L.h;
    KL.drawPanel(ctx,'wood',x,y+8,L.w,L.h-8,{r:8,gold:!L.solved});
    const lg=ctx.createLinearGradient(0,y-2,0,y+14);lg.addColorStop(0,L.solved?'#8a6a3a':'#a8783c');lg.addColorStop(1,L.solved?'#4a3418':'#6a4522');ctx.fillStyle=lg;
    ctx.beginPath();ctx.moveTo(x+2,y+14);ctx.quadraticCurveTo(x+L.w/2,y-(L.solved?18:6),x+L.w-2,y+14);ctx.closePath();ctx.fill();
    if(!L.solved){ctx.fillStyle='#e2b040';ctx.fillRect(x+L.w/2-5,y+14,10,13);ctx.fillStyle='#4a2c08';ctx.fillRect(x+L.w/2-1.5,y+18,3,6);}
    else{KL.glow(ctx,x+L.w/2,y+10,50,'#ffd75e',.5);}
  }
  if(!L.solved){
    const label=L.kind==='door'?'Locked door: ':'Locked chest: ';
    let q=L.q.prompt;
    if(L.q.kind==='math')q+='  ['+L.q.answer.slice(0,L.idx)+'·'.repeat(L.q.answer.length-L.idx)+']';
    bubbleC(x+L.w/2,GY-(L.kind==='door'?200:110),label+q,L.q.answer[L.idx]);
  }
  for(const r of L.runes)drawRune(r,L.q.answer[L.idx],tt,th);
}
function drawHeroSprite(g,x,y,face,anim,onG,vx,hero,inv,squash,big){
  g.save();g.translate(x,y);
  const H0=HEROES[hero]||HEROES[0],sq=squash||0;
  g.translate(12,34);g.scale(1+sq*.4,1-sq*.4);g.translate(-12,-34);
  const f=face>0?1:-1;
  const lg=Math.sin(anim*8)*(onG&&Math.abs(vx)>20?4:0);
  const grad=(c0,c1,x0,y0,x1,y1)=>{const gr=g.createLinearGradient(x0,y0,x1,y1);gr.addColorStop(0,c0);gr.addColorStop(1,c1);return gr;};
  /* cape */
  g.fillStyle=grad(KL.lit(H0.cape,.2),KL.dark(H0.cape,.3),0,10,0,34);g.beginPath();g.moveTo(12-f*4,10);g.quadraticCurveTo(12-f*(18+Math.abs(vx)*.03),20,12-f*(14+Math.abs(vx)*.03),32+lg*.3);g.lineTo(12-f*2,30);g.closePath();g.fill();
  g.fillStyle=grad('#5a4a6a','#2a2038',0,18,0,34);g.fillRect(4,18+Math.max(0,lg),7,16-Math.max(0,lg));g.fillRect(13,18+Math.max(0,-lg),7,16-Math.max(0,-lg));
  g.fillStyle=grad('#8a5a30','#3a2210',0,30,0,36);g.fillRect(3,31+Math.max(0,lg),9,4);g.fillRect(12,31+Math.max(0,-lg),9,4);
  g.fillStyle=grad(KL.lit(H0.tunic,.25),KL.dark(H0.tunic,.3),0,6,0,24);g.beginPath();g.moveTo(3,20);g.quadraticCurveTo(2,8,8,6);g.lineTo(16,6);g.quadraticCurveTo(22,8,21,20);g.closePath();g.fill();
  g.fillStyle='#e2b040';g.fillRect(3,16,18,3);
  const hg=g.createRadialGradient(10,4,1,12,4,9);hg.addColorStop(0,'#fbd8b8');hg.addColorStop(1,'#d69a76');g.fillStyle=hg;g.beginPath();g.arc(12,4,8.5,0,TAU);g.fill();
  g.fillStyle='#2b1d1a';g.beginPath();g.ellipse(12+f*3,3,1.4,2,0,0,TAU);g.ellipse(12+f*-1.6,3,1.4,2,0,0,TAU);g.fill();
  g.strokeStyle='#8a4a3a';g.lineWidth=1;g.beginPath();g.arc(12+f*.8,6,2.6,.3,Math.PI-.3);g.stroke();
  if(H0.hat==='helm'){g.fillStyle=grad('#dfe6f0','#8a94a8',0,-6,0,4);g.beginPath();g.moveTo(3,4);g.quadraticCurveTo(3,-8,12,-8);g.quadraticCurveTo(21,-8,21,4);g.lineTo(16,2);g.lineTo(8,2);g.closePath();g.fill();g.fillStyle='#c8384f';g.fillRect(10,-14,4,8);}
  else if(H0.hat==='hood'){g.fillStyle=grad('#4f9a5a','#2c5a34',0,-8,0,6);g.beginPath();g.moveTo(2,7);g.quadraticCurveTo(0,-9,12,-9);g.quadraticCurveTo(24,-9,22,7);g.quadraticCurveTo(12,0,2,7);g.fill();}
  else if(H0.hat==='wizard'){g.fillStyle=grad('#8a6ae0','#3a2a80',0,-26,0,2);g.beginPath();g.moveTo(1,2);g.quadraticCurveTo(6,-12,14,-26);g.quadraticCurveTo(18,-12,23,2);g.closePath();g.fill();g.fillStyle='#ffe066';g.beginPath();g.arc(10,-8,1.6,0,TAU);g.fill();}
  else if(H0.hat==='crown'){g.fillStyle=grad('#fff0a0','#b8781a',0,-12,0,0);g.beginPath();g.moveTo(3,-1);g.lineTo(2,-12);g.lineTo(7,-6);g.lineTo(12,-14);g.lineTo(17,-6);g.lineTo(22,-12);g.lineTo(21,-1);g.closePath();g.fill();}
  else{g.fillStyle=grad('#4a5a9a','#1a2450',0,-8,0,4);g.beginPath();g.moveTo(3,3);g.quadraticCurveTo(3,-9,12,-9);g.quadraticCurveTo(21,-9,21,3);g.closePath();g.fill();starShape0(g,12,-4,4,'#ffd23f');}
  /* the torch in hand */
  g.fillStyle='#6a4426';g.fillRect(f>0?20:-4,10,4,10);g.fillStyle='#ffc860';g.beginPath();g.ellipse(f>0?22:-2,8,3,5,0,0,TAU);g.fill();
  g.restore();
}
function starShape0(g,x,y,r,col){g.fillStyle=col;g.beginPath();for(let i=0;i<10;i++){const rad=i%2?r*.45:r,a=-Math.PI/2+i*Math.PI/5;g[i?'lineTo':'moveTo'](x+Math.cos(a)*rad,y+Math.sin(a)*rad);}g.closePath();g.fill();}
function drawPlayer(p,tt){
  const x=p.x-G.camX;
  if(p.inv>0&&!RM.matches&&Math.floor(p.inv*12)%2)return;
  if(p.inv>0&&RM.matches)ctx.globalAlpha=.55;
  ctx.fillStyle='rgba(4,2,10,.35)';ctx.beginPath();ctx.ellipse(x+12,p.y+35,13,3.4,0,0,TAU);ctx.fill();
  ctx.save();ctx.translate(x+12,p.y+34);ctx.scale(1.4,1.4);ctx.translate(-12,-34);
  drawHeroSprite(ctx,0,0,p.face,p.anim,p.onG,p.vx,meta.hero,p.inv,p.squash);ctx.restore();
  ctx.globalAlpha=1;
}
function drawSlime(s,tt){
  if(s.dead)return;
  const x=s.x-G.camX,sq=s.squash>0?s.squash:0,h=s.h*(1-sq),w=s.w*(1+sq),y=s.y+(s.h-h),wob=Math.sin(tt*6+s.x0)*2;
  ctx.fillStyle='rgba(4,2,10,.3)';ctx.beginPath();ctx.ellipse(x+w/2,s.y+s.h,w*.55,3,0,0,TAU);ctx.fill();
  const gr=ctx.createRadialGradient(x+w*.35,y+h*.3,2,x+w/2,y+h/2,w*.7);gr.addColorStop(0,'#c8f8c0');gr.addColorStop(.45,'#5cc85c');gr.addColorStop(1,'#2a7a34');ctx.fillStyle=gr;
  ctx.beginPath();ctx.moveTo(x,y+h);ctx.quadraticCurveTo(x-3,y+h*.2+wob,x+w/2,y);ctx.quadraticCurveTo(x+w+3,y+h*.2+wob,x+w,y+h);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(x+w*.34,y+h*.3,w*.12,h*.1,-.5,0,TAU);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x+w*.36,y+h*.56,4.2,5,0,0,TAU);ctx.ellipse(x+w*.64,y+h*.56,4.2,5,0,0,TAU);ctx.fill();
  ctx.fillStyle='#1c2a1c';ctx.beginPath();ctx.arc(x+w*.36+s.dir*1,y+h*.58,2.2,0,TAU);ctx.arc(x+w*.64+s.dir*1,y+h*.58,2.2,0,TAU);ctx.fill();
}
function drawCoin(c,tt){
  if(c.taken)return;
  const x=c.x-G.camX,ph=Math.sin(tt*5+c.x*.05),sc=Math.abs(Math.cos(tt*2+c.x*.03))*.5+.5;
  ctx.save();ctx.translate(x,c.y+ph*2);ctx.scale(sc,1);
  const gr=ctx.createRadialGradient(-2,-3,1,0,0,10);gr.addColorStop(0,'#fff6b8');gr.addColorStop(.6,'#f0b830');gr.addColorStop(1,'#a8721a');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,9,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(120,70,8,.6)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,0,6.4,0,TAU);ctx.stroke();ctx.restore();
  if(!RM.matches&&Math.sin(tt*3+c.x)>.96){ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(x+5,c.y-6,1.8,0,TAU);ctx.fill();}
}

  }

function drawBoss(tt,th){
  const b=G.boss;if(!b)return;
  const x=b.x-G.camX;
  if(b.hp<=0&&b.deadT<=0)return;
  const shrink=b.hp<=0?Math.max(0,b.deadT/1.2):1,w=b.w*shrink,h=b.h*shrink,y=b.y+(b.h-h);
  ctx.fillStyle='rgba(4,2,10,.3)';ctx.beginPath();ctx.ellipse(x+w/2,GY,w*.6,5,0,0,TAU);ctx.fill();
  const gr=ctx.createRadialGradient(x+w*.35,y+h*.3,4,x+w/2,y+h/2,w*.7);
  if(b.enrage>0){gr.addColorStop(0,'#ffb8a8');gr.addColorStop(.5,'#e0503c');gr.addColorStop(1,'#8a1c1c');}else{gr.addColorStop(0,'#c8f8c0');gr.addColorStop(.5,'#5cc85c');gr.addColorStop(1,'#256a2e');}
  ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(x,y+h);ctx.quadraticCurveTo(x-6+w*.15,y+h*.2,x+w/2,y);ctx.quadraticCurveTo(x+w+6-w*.15,y+h*.2,x+w,y+h);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.ellipse(x+w*.36,y+h*.33,w*.15,h*.1,-.5,0,TAU);ctx.fill();
  const cg=ctx.createLinearGradient(0,y-20,0,y);cg.addColorStop(0,'#fff0a0');cg.addColorStop(1,'#b8781a');ctx.fillStyle=cg;
  ctx.beginPath();ctx.moveTo(x+w*.3,y+2);ctx.lineTo(x+w*.3,y-14);ctx.lineTo(x+w*.4,y-4);ctx.lineTo(x+w*.5,y-20);ctx.lineTo(x+w*.6,y-4);ctx.lineTo(x+w*.7,y-14);ctx.lineTo(x+w*.7,y+2);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x+w*.36,y+h*.5,9,11,0,0,TAU);ctx.ellipse(x+w*.64,y+h*.5,9,11,0,0,TAU);ctx.fill();
  ctx.fillStyle='#1c2a1c';ctx.beginPath();ctx.arc(x+w*.36+b.dir*2.5,y+h*.53,4.6,0,TAU);ctx.arc(x+w*.64+b.dir*2.5,y+h*.53,4.6,0,TAU);ctx.fill();
  for(let i=0;i<b.maxhp;i++)drawHeart(x+w*.3+i*22,y-34,.9,i<b.hp);
  if(b.hp>0){
    let q=b.q.prompt;
    if(b.q.kind==='math')q+='  ['+b.q.answer.slice(0,b.idx)+'·'.repeat(b.q.answer.length-b.idx)+']';
    bubbleC(x+w/2,y-88,'The king asks: '+q,b.q.answer[b.idx]);
    T(Math.ceil(b.timer)+'s',x+w/2,y-56,14,b.timer<5?'#ff9a8a':'#cdd',"center",700);
    for(const r of b.runes)drawRune(r,b.q.answer[b.idx],tt,th);
  }
}
function drawHUD(th){

/* ═══════════ main loop ═══════════ */
let last=performance.now(),fpsT=0,fpsN=0,errOnce=false;
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  G.time+=dt;G.frames++;fpsT+=dt;fpsN++;
  if(fpsT>=1){G.fps=Math.round(fpsN/fpsT);fpsT=0;fpsN=0;}
  try{
    if(G.phase==='play'){physics(dt);G.camX=clamp(G.player.x-W*.4,0,Math.max(0,G.level_w-W));}
    if(G.hintT>0)G.hintT-=dt;
    if(G.msgT>0)G.msgT-=dt;
    if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
    if(G.shake>0)G.shake=Math.max(0,G.shake-dt*1.8);
    for(let i=G.particles.length-1;i>=0;i--){const p=G.particles[i];p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=700*dt;if(p.t<=0)G.particles.splice(i,1);}
    if(G.particles.length>260)G.particles.splice(0,G.particles.length-260);
    for(const s of G.slimes)if(s.squash>0)s.squash-=dt;
    render(G.time);
    watchPhase();coachAdvance();
  }catch(err){if(!errOnce){errOnce=true;try{console.error('Word Dungeon frame error: '+(err&&err.stack||err));}catch(e){}}}
  requestAnimationFrame(frame);
}

/* ═══════════ arcade glue: taps, hints, grown-up report, first-run coach ═══════════ */
function canvasTap(cx,cy){
  try{
    const r=cv.getBoundingClientRect(),x=(cx-r.left)*W/r.width,y=(cy-r.top)*H/r.height;
    for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){kitSfx('button',{volume:.5});h.fn();return;}}
  }catch(err){/* a tap must never be lost to an audio or draw hiccup */}
  AU.init();   // wake audio after the tap has been routed, never before: input must not depend on sound
}
let lastTapT=0;
cv.addEventListener('pointerdown',e=>{lastTapT=performance.now();canvasTap(e.clientX,e.clientY);});
/* some engines deliver touch events without a synthesised pointer event: route those too, de-duplicated */
cv.addEventListener('touchstart',e=>{if(performance.now()-lastTapT>350){lastTapT=performance.now();const t=e.changedTouches[0];if(t)canvasTap(t.clientX,t.clientY);}},{passive:true});
cv.addEventListener('click',e=>{if(performance.now()-lastTapT>350){lastTapT=performance.now();canvasTap(e.clientX,e.clientY);}});
function sdkState(o){try{window.ArcadeSDK&&ArcadeSDK.state(o);}catch(e){}}
function noteAnswer(q,ok){
  if(q.kind==='math')LK.noteMath(q.raw||q.prompt,ok);
  else LK.noteSpell(q.tier||1,ok,q.word.t);
}
function currentHint(){
  if(G.phase==='play'){
    const t=activeLock()||(G.boss&&G.boss.hp>0?G.boss:null);
    if(t&&t.q){
      const q=t.q,far=t!==G.boss&&G.player&&t.runes[0]&&G.player.x<t.runes[0].x-520;
      const lead=far?'Head right to the '+(t.kind==='door'?'rune door':'locked chest')+'. ':'';
      if(q.kind==='math'){
        const n=q.answer.length,sofar=q.answer.slice(0,t.idx);
        return lead+LK.mathHint(q.raw||q.prompt)+(n>1?' The answer has '+n+' digits'+(t.idx?' and you have "'+sofar+'" so far.':'; jump them left to right.'):'');
      }
      return lead+LK.spellHint(q.word.t,t.idx,q.word.h);
    }
    if(G.keys>0)return 'You hold the key: walk right into the EXIT door.';
    return 'Stomp slimes from above and keep heading right to the exit.';
  }
  if(G.phase==='shop')return 'A hint scroll (6 coins) lights up the next stone of a lock; a heart (12 coins) heals one. Then go down.';
  if(G.phase==='gameover')return 'Try the floor again: your stars and coins are kept. FOR GROWN-UPS shows what to practise.';
  return 'Pick your age, then tap Maths or Spelling. Beat a boss to save a checkpoint.';
}
function showHint(){const t=currentHint();toast(t);G.hintT=8;return t;}
function bindTap(el,fn){el.addEventListener('pointerdown',e=>{e.preventDefault();AU.init();fn();});}
bindTap(document.getElementById('tHint'),showHint);
bindTap(document.getElementById('tScroll'),()=>onKeyPress('KeyH'));
let lastPhase='';
function watchPhase(){
  paintProg();
  if(G.phase===lastPhase)return;
  const was=lastPhase;lastPhase=G.phase;closeGrown();
  document.body.classList.toggle('hidebtn',G.phase!=='play');
  if(G.phase==='menu')sdkState({scene:'title'});
  else if(G.phase==='play'&&was!=='play')sdkState({scene:'play',score:G.level});
  else if(G.phase==='gameover')sdkState({scene:'over',score:G.level,outcome:'rest',stars:G.runStars});
  else if(G.phase==='shop')sdkState({scene:'over',score:G.level,outcome:'floor cleared',stars:G.lastStars});
}

  (G.phase==='gameover'?'<p class="lk-p">All-time report: For grown-ups on the title screen.</p>':'');
  document.getElementById('grown').classList.add('show');document.getElementById('grownBack').focus();}
function closeGrown(){document.getElementById('grown').classList.remove('show');}
document.getElementById('grownBack').addEventListener('click',closeGrown);

const COACH=[
  {t:()=>touchUI?'Move with <b>◀ ▶</b> and jump with <b>▲</b> (tap it twice to double-jump).':'Move with <b>← →</b> (or A D) and jump with <b>↑</b>, W or Space. Jump twice for a double jump.',done:()=>G.player&&G.player.x>330},
  {t:()=>'Head right. The <b>locked chest</b> at the far end asks a question.',done:()=>{const L=G.locks[0];return !L||L.solved||(G.player&&G.player.x>L.runes[0].x-240);}},
  {t:()=>'Jump on the stones <b>in order</b> to spell the answer. A wrong stone just shows a hint. Stuck? Tap <b>'+(touchUI?'?':'/')+'</b>.',done:()=>{const L=G.locks[0];return !L||L.solved;}},
  {t:()=>'Open the <b>rune door</b> the same way, take the <b>KEY</b>, then walk into the <b>EXIT</b>.',done:()=>G.phase==='shop'},
];
let coachIx=-1;
function coachStart(){if(G.phase!=='play')startRun(G.mode||'math');coachIx=0;coachPaint();}
function coachEnd(){coachIx=-1;coachPaint();try{localStorage.setItem('wd_tut','1');}catch(e){}try{window.ArcadeSDK&&ArcadeSDK.event('tutorial-done');}catch(e){}}
function placeCoach(){if(coachIx<0)return;const el=document.getElementById('coach'),r=cv.getBoundingClientRect(),h=el.offsetHeight;el.style.top=(r.top+58*r.height/H)+'px';}
function coachPaint(){
  const el=document.getElementById('coach');
  if(coachIx<0||coachIx>=COACH.length||G.phase==='menu'){el.classList.remove('show');return;}
  document.getElementById('coachStep').textContent='TUTORIAL · '+(coachIx+1)+' OF '+COACH.length;
  document.getElementById('coachText').innerHTML=COACH[coachIx].t();
  el.classList.add('show');placeCoach();
}
function coachAdvance(){
  if(coachIx<0)return;
  if(G.phase==='menu'||G.phase==='gameover'){coachIx=-1;coachPaint();return;}
  const was=coachIx;
  while(coachIx<COACH.length&&COACH[coachIx].done())coachIx++;
  if(coachIx>=COACH.length)coachEnd();else if(was!==coachIx)coachPaint();
}
document.getElementById('coachSkip').addEventListener('click',coachEnd);
const _startRun=startRun;
startRun=function(mode,floor){_startRun(mode,floor);let seen=false;try{seen=localStorage.getItem('wd_tut')==='1';}catch(e){}if(!seen&&coachIx<0){coachIx=0;coachPaint();}};

addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,120));
fit();
if(window.ArcadeSDK)ArcadeSDK.init({orientation:'landscape',
  pauseButton:'tr',
  onRestart(){startRun(G.mode||'math',G.startFloor||1);},
  onExit(){G.phase='menu';G.menuTab='main';coachIx=-1;coachPaint();closeGrown();},
  onTutorial:coachStart,
  onHint(){return currentHint();},
});
watchPhase();
requestAnimationFrame(frame);
try{document.fonts&&document.fonts.load('700 20px Fredoka');}catch(e){}

/* ═══════════ debug hook (drives tools/playtest.py) ═══════════ */
window.__dungeon_debug={
  wipe(){try{localStorage.removeItem(MKEY);}catch(e){}meta=loadMeta();syncDaily();},
  start(mode,floor){startRun(mode||'math',floor||1);},
  addStars(n){meta.stars+=n;saveMeta(meta);},
  state(){
    const p=G.player||{};
    const lock=G.locks.find(l=>l.kind==='door')||null,chest=G.locks.find(l=>l.kind==='chest')||null;
    const anyLock=activeLock()||(G.boss&&G.boss.hp>0?G.boss:null);
    return{phase:G.phase,mode:G.mode,level:G.level,hp:G.hp,coins:G.coins,keys:G.keys,
      scrolls:G.scrolls,px:p.x||0,py:p.y||0,vy:p.vy||0,onG:!!p.onG,jumps:p.jumps||0,
      levelW:G.level_w,trapCount:G.trapCount,hintToast:G.hintToast,hintT:G.hintT,W,
      gate:{doorSolved:lock?lock.solved:null,chestSolved:chest?chest.solved:null,
            prompt:anyLock?anyLock.q.prompt:null,answer:anyLock?anyLock.q.answer:null,idx:anyLock?anyLock.idx:null,
            runes:anyLock?anyLock.runes.map(r=>({ch:r.ch,used:r.used})):null},
      boss:G.boss?{hp:G.boss.hp,prompt:G.boss.q?G.boss.q.prompt:null,answer:G.boss.q?G.boss.q.answer:null,idx:G.boss.idx,runes:G.boss.runes.map(r=>({ch:r.ch,used:r.used}))}:null,
      slimesAlive:G.slimes.filter(s=>!s.dead).length,coinsTaken:G.coinsArr.filter(c=>c.taken).length,coinsTotal:G.coinsArr.length,fps:G.fps,time:G.time,
      stars:meta.stars,lastStars:G.lastStars,hits:hits.map(h=>({x:Math.round(h.x),y:Math.round(h.y),w:Math.round(h.w),h:Math.round(h.h)}))};
  },
  meta(){return{...meta};},
  teleport(x,y){if(G.player){G.player.x=x;G.player.y=y;G.player.vy=0;}},
  pressRune(i){const owner=activeLock()||(G.boss&&G.boss.hp>0?G.boss:null);if(!owner||!owner.runes[i])return false;onRune(owner,owner.runes[i]);return true;},
  hurt(n){hurt(n||1);},
  slimePos(){const s=G.slimes.find(s=>!s.dead);return s?{x:s.x,y:s.y}:null;},
  coinPos(){const c=G.coinsArr.find(c=>!c.taken);return c?{x:c.x,y:c.y}:null;},
  goto(n){G.level=n;makeLevel(n);G.phase='play';},
  buy(what){buyItem(what);},
  nextLevel(){nextLevel();},
  retry(){retryFloor();},
  useScroll(){onKeyPress('KeyH');}
};

</script>
