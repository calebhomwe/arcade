<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0d12;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:monospace}
  canvas{image-rendering:pixelated;background:#0b0d12;max-width:100vw;max-height:100vh}
  .tbtn{position:fixed;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.12);

    border:2px solid #8899bb;border-radius:10px}

<body>
<canvas id="cv" width="960" height="540"></canvas>
<div class="tbtn" id="tLeft">◀</div>
<div class="tbtn" id="tRight">▶</div>

  <button class="dbtn" id="coachSkip">SKIP</button></div>
<div id="grown" role="dialog" aria-label="For grown-ups"><h2>FOR GROWN-UPS</h2>
  <div class="lk-p" style="color:#99a">what was practised, how accurate it was, and what to practise next</div>
  <div id="grownBody"></div><div style="text-align:center;margin-top:10px"><button class="dbtn go" id="grownBack">BACK</button></div></div>
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   WORD DUNGEON — a question-locked side-scrolling platformer.
   Sibling of Spell & Maths Galaxy (swarm lane DUNG). Single file, Canvas 2D,
   zero network, all art procedural, boots on file://.
   Doors and chests are LOCKED by questions: jump on the letter/number runes
   below the lock in the right order. Wrong rune = spike trap + teaching hint.
   ═══════════════════════════════════════════════════════════════════════ */

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=960, H=540;
/* crisp: the backing store follows the CSS size × min(devicePixelRatio, 2); drawing stays in 960×540 units */
let SCALE=1;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H),d=Math.min(devicePixelRatio||1,2);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  const bw=Math.round(W*s*d),bh=Math.round(H*s*d);
  if(cv.width!==bw||cv.height!==bh){cv.width=bw;cv.height=bh;}
  SCALE=bw/W; if(typeof placeStrip==='function')placeStrip();}
addEventListener('resize',fit); fit();

/* ── tiny helpers ─────────────────────────────────────────────────────── */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mulberry32(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296;};}
const aabb=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

/* ═══════════ LEARNING KIT — age bands, teaching hints, a report for grown-ups ═══════════
   Hints teach the rule or the next step; they never hand over the answer.
   Every answer is logged against the skill it practised, so a grown-up can read
   what was practised, how accurate it was and what to practise next. */
const LEARN=(function(){
  const BANDS=[
    {id:'5-7', label:'Ages 5–7',  math:[1,2], word:[1,2]},
    {id:'7-9', label:'Ages 7–9',  math:[2,3], word:[2,3]},
    {id:'9-11',label:'Ages 9–11', math:[3,4], word:[3,5]}];
  const SPELL=['','Spelling short words','Spelling everyday words','Spelling longer words',
               'Spelling tricky words','Spelling advanced words'];
  const TIPS={
    'Adding within 20':'Start at the bigger number and count on, or make a ten first (8 + 5 = 8 + 2 + 3).',
    'Adding bigger numbers':'Add the tens, then the ones, then put the two parts together.',
    'Taking away within 20':'Count up from the smaller number to the bigger one on a number line.',
    'Taking away bigger numbers':'Take away the tens first, then the ones.',
    'Times tables to 9 × 9':'Skip-count out loud (3, 6, 9, 12…) and learn one table at a time.',
    'Times tables to 12 × 12':'Practise the 6, 7, 8 and 12 times tables; use 10 × then adjust.',
    'Dividing into equal groups':'Turn it round: 24 ÷ 6 means 6 × ? = 24.',
    'Multiply before adding':'In a two-step sum, do the × part first, then the +.',
    'Fractions of amounts':'Divide by the bottom number, then multiply by the top number.',
    'Percentages of amounts':'10% is ÷ 10, 50% is a half, 25% is a quarter.',
    'Number bonds':'Learn the pairs that make 10 by heart, then use them for 20 and 100.',
    'Checking sums (true or false)':'Work the sum out first, then compare it with the one shown.'};
  const SPELL_TIP='Say the word slowly, look at it, cover it, write it, then check it.';
  const VOW='AEIOU';
  const TEAMS={SH:'sh',CH:'ch',TH:'th',WH:'w',PH:'f',CK:'k',NG:'ng'}, SILENT={KN:'n',WR:'r'};
  const clampN=(v,a,b)=>v<a?a:v>b?b:v;

  /* ---- what a math prompt practises, and how to teach it ---- */
  function parseMath(prompt,note){
    const p=String(prompt||'').replace(/\s*=\s*\?\s*$/,'').replace(/-/g,'−').trim();
    let m;
    if((m=p.match(/^(\d+) \+ (\d+) × (\d+)$/)))return{k:'two',a:+m[1],b:+m[2],c:+m[3]};
    if((m=p.match(/^(\d+)\/(\d+) of (\d+)$/)))return{k:'frac',n:+m[1],d:+m[2],t:+m[3]};
    if((m=p.match(/^(\d+)% of (\d+)$/)))return{k:'pct',p:+m[1],t:+m[2]};
    if((m=p.match(/^(\d+) \+ \?(?: = (\d+))?$/))){
      const t=m[2]?+m[2]:+(String(note||'').match(/(\d+)/)||[0,0])[1];
      return{k:'bond',a:+m[1],t:t};}
    if((m=p.match(/^(.+) = (\d+)$/))){const inner=parseMath(m[1]);if(inner)return{k:'tf',q:inner,s:+m[2],text:m[1]};}
    if((m=p.match(/^(\d+) ([+−×÷]) (\d+)$/)))return{k:m[2],a:+m[1],b:+m[3]};
    return null;
  }
  function mathSkill(prompt,note){
    const q=parseMath(prompt,note); if(!q)return 'Mental maths';
    if(q.k==='+')return q.a+q.b<=20?'Adding within 20':'Adding bigger numbers';
    if(q.k==='−')return q.a<=20?'Taking away within 20':'Taking away bigger numbers';
    if(q.k==='×')return (q.a<=9&&q.b<=9)?'Times tables to 9 × 9':'Times tables to 12 × 12';
    if(q.k==='÷')return 'Dividing into equal groups';
    if(q.k==='two')return 'Multiply before adding';
    if(q.k==='frac')return 'Fractions of amounts';
    if(q.k==='pct')return 'Percentages of amounts';
    if(q.k==='bond')return 'Number bonds';
    return 'Checking sums (true or false)';
  }
  function skip(n,times){const s=[];for(let i=1;i<=Math.min(3,times-1);i++)s.push(n*i);return s.join(', ')+'…';}
  function mathHint(prompt,note){
    const q=parseMath(prompt,note);
    if(!q)return 'Read the question twice, then work it out one step at a time.';
    const big=Math.max(q.a,q.b),small=Math.min(q.a,q.b);
    switch(q.k){
      case '+':
        if(q.a+q.b<=20){
          if(big<10&&big+small>10)return `Make a ten: ${big} needs ${10-big} more to reach 10. Take ${10-big} from the ${small}, then add what is left on to 10.`;
          return `Number line: start at ${big} and hop ${small} to the right. Count the hops out loud.`;}
        if(small<10){const up=Math.ceil((big+1)/10)*10-big;
          return small>up?`Start at ${big}. Hop ${up} to reach ${big+up}, then hop on the other ${small-up}.`
                         :`Start at ${big} and count on ${small} more, one hop at a time.`;}
        return `Split into tens and ones: add ${Math.floor(q.a/10)*10} + ${Math.floor(q.b/10)*10} first, then ${q.a%10} + ${q.b%10}, then put them together.`;
      case '−':
        if(q.a<=20)return `Number line: start at ${q.b} and count up to ${q.a}. How many hops did you make?`;
        if(q.b<10){const down=q.a%10;
          return down&&q.b>down?`Count back from ${q.a}: hop back ${down} to reach ${q.a-down}, then hop back the other ${q.b-down}.`
                               :`Count back ${q.b} from ${q.a}, one hop at a time.`;}
        if(q.b%10===0)return `Take away ${q.b/10} tens: count back from ${q.a} in tens.`;
        return `Take away the tens first: ${q.a} − ${Math.floor(q.b/10)*10}. Then take away the ${q.b%10} ones that are left.`;
      case '×':
        if(q.a===10||q.b===10)return `Times 10: put a zero on the end of the other number.`;
        if(q.a===2||q.b===2)return `Times 2 is doubling: add ${q.a===2?q.b:q.a} to itself.`;
        if(q.a===5||q.b===5)return `Times 5 is half of times 10: work out ${q.a===5?q.b:q.a} × 10, then halve it.`;
        if(q.a===9||q.b===9){const o=q.a===9?q.b:q.a;return `Times 9: work out ${o} × 10, then take away one ${o}.`;}
        return `${q.a} × ${q.b} is ${q.b} groups of ${q.a}. Skip-count by ${q.a}: ${skip(q.a,q.b)} and stop after ${q.b} jumps.`;
      case '÷':
        return `How many groups of ${q.b} make ${q.a}? Think ${q.b} × ? = ${q.a}, or skip-count by ${q.b} until you reach ${q.a}.`;
      case 'two':
        return `Multiply first: work out ${q.b} × ${q.c}, then add ${q.a} to that.`;
      case 'frac':
        return q.n===1?`Split ${q.t} into ${q.d} equal groups. One group is the answer.`
                      :`Split ${q.t} into ${q.d} equal groups, then take ${q.n} of the groups.`;
      case 'pct':
        if(q.p===50)return `50% means half. What is half of ${q.t}?`;
        if(q.p===25)return `25% is a quarter: halve ${q.t}, then halve it again.`;
        if(q.p===75)return `75% is three quarters: find a quarter of ${q.t}, then take three of them.`;
        if(q.p===10)return `10% means one tenth: share ${q.t} into 10 equal parts (${q.t} ÷ 10).`;
        return `${q.p}% is ${q.p/10} lots of 10%. First find 10% of ${q.t} (that is ${q.t} ÷ 10), then multiply by ${q.p/10}.`;
      case 'bond':
        return q.t===10||q.t===20?`Count up from ${q.a} to ${q.t} on your fingers or a number line.`
                                 :`Count up from ${q.a} to the next ten, then on in tens to ${q.t}.`;
      case 'tf':
        return `Work out ${q.text} yourself first, then check: is it really ${q.s}?`;
    }
    return '';
  }

  /* ---- spelling: the first letter, the length, then sound-by-sound nudges ---- */
  function spellHint(word,idx,clue){
    const W=String(word).toUpperCase(), n=W.length; idx=clampN(idx|0,0,n-1);
    const c=W[idx], prev=W[idx-1]||'', so=W.slice(0,idx), tail=clue?` Clue: “${String(clue).replace('~','___')}”`:'';
    if(idx===0)return `It starts with the letter ${c} and has ${n} letters. Say the word slowly and listen to each sound.`+tail;
    const pair=prev+c;
    if(TEAMS[pair])return `After “${so}”, ${prev} teams up with the next letter to make one sound: /${TEAMS[pair]}/.`;
    if(SILENT[pair])return `The ${prev} is silent here: the sound you hear is /${SILENT[pair]}/.`;
    if(prev==='Q')return `Rule: the letter Q nearly always has the same vowel straight after it, and together they say /kw/.`;
    if(c===prev)return `After “${so}”, the same letter comes again: this word has a double letter here.`;
    if(c==='E'&&idx===n-1)return `Last letter: it is a silent e at the end. It makes the vowel before it say its name.`;
    if(VOW.includes(c)&&VOW.includes(prev))return `After “${so}”, another vowel joins in: two vowels team up to make one sound here.`;
    if(VOW.includes(c)||(c==='Y'&&idx===n-1))return `After “${so}” comes a vowel sound (a, e, i, o, u${c==='Y'?' or y':''}). Say “${so.toLowerCase()}…” slowly: which vowel do you hear?`;
    return `After “${so}” comes a consonant. Say “${so.toLowerCase()}…” slowly and listen for the next sound. ${n-idx} letter${n-idx>1?'s':''} to go.`;
  }

  /* ---- the record ---- */
  function create(key){
    let R={bands:{},skills:{},missWords:[],sessions:0,answered:0,correct:0,since:new Date().toISOString().slice(0,10)};
    try{const s=JSON.parse(localStorage.getItem(key));if(s&&typeof s==='object')R=Object.assign(R,s);}catch(e){}
    let S={skills:{},answered:0,correct:0,missWords:[]};   /* this session */
    const save=()=>{try{localStorage.setItem(key,JSON.stringify(R));}catch(e){}};
    const bump=(o,skill,ok)=>{const s=o[skill]||(o[skill]={r:0,w:0});ok?s.r++:s.w++;};
    const api={
      BANDS,
      band(){return BANDS.find(b=>b.id===R.band)||null;},
      bandIndex(){const i=BANDS.findIndex(b=>b.id===R.band);return i<0?1:i;},
      setBand(id){R.band=id;save();},
      /* a tier inside the band: the band's easiest tier plus the ramp, capped at the band's hardest */
      tier(kind,ramp){const b=BANDS[api.bandIndex()],r=kind==='word'?b.word:b.math;return clampN(r[0]+(ramp|0),r[0],r[1]);},
      startSession(){S={skills:{},answered:0,correct:0,missWords:[]};R.sessions++;save();},
      note(skill,ok,word){
        bump(R.skills,skill,ok);bump(S.skills,skill,ok);
        R.answered++;S.answered++;if(ok){R.correct++;S.correct++;}
        if(word&&!ok){const w=String(word).toLowerCase();
          if(!S.missWords.includes(w))S.missWords.push(w);
          R.missWords=[w].concat(R.missWords.filter(x=>x!==w)).slice(0,12);}
        if(word&&ok)R.missWords=R.missWords.filter(x=>x!==String(word).toLowerCase());
        save();
      },
      noteMath(prompt,ok,note){api.note(mathSkill(prompt,note),ok);},
      noteSpell(level,ok,word){api.note(SPELL[clampN(level|0,1,5)],ok,word);},
      session(){return S;},
      /* the grown-up report: {lines:[...], next:'...'} for this session and all time */
      report(scope){
        const src=scope==='session'?S:R, rows=Object.keys(src.skills).map(k=>{const s=src.skills[k];
          return{skill:k,n:s.r+s.w,acc:Math.round(100*s.r/Math.max(1,s.r+s.w))};}).sort((a,b)=>b.n-a.n);
        const acc=Math.round(100*src.correct/Math.max(1,src.answered));
        let weak=rows.filter(r=>r.n>=3).sort((a,b)=>a.acc-b.acc)[0]||rows.slice().sort((a,b)=>a.acc-b.acc)[0];
        let next;
        if(!rows.length)next='Play a round to start the record.';
        else if(weak&&weak.acc<85)next=`${weak.skill} (${weak.acc}% right). ${TIPS[weak.skill]||SPELL_TIP}`;
        else{const bi=api.bandIndex();
          next=bi<BANDS.length-1&&src.answered>=10?`Everything practised is 85% or better: try ${BANDS[bi+1].label} next.`
                                                   :'Keep going at this level: accuracy is strong.';}
        const words=(scope==='session'?S.missWords:R.missWords).slice(0,8);
        return{rows,acc,answered:src.answered,correct:src.correct,next,words,
               sessions:R.sessions,since:R.since,band:BANDS[api.bandIndex()].label};
      },
      /* plain HTML, styled by each game */
      reportHTML(scope){
        const r=api.report(scope), esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
        if(!r.answered)return `<p class="lk-p">No answers yet${scope==='session'?' this round':''}. Play a round and the report fills in.</p>`;
        return `<p class="lk-p"><b>${r.answered}</b> answer${r.answered>1?'s':''}, <b>${r.acc}%</b> right`+
          (scope==='session'?'':` · ${r.sessions} round${r.sessions>1?'s':''} since ${esc(r.since)} · level ${esc(r.band)}`)+`</p>`+
          `<table class="lk-t">${r.rows.slice(0,8).map(x=>`<tr><td>${esc(x.skill)}</td><td>${x.n}</td><td>${x.acc}%</td></tr>`).join('')}</table>`+
          (r.words.length?`<p class="lk-p">Words to practise: <b>${r.words.map(esc).join(', ')}</b></p>`:'')+
          `<p class="lk-p lk-next">Practise next: ${esc(r.next)}</p>`;
      },
      mathSkill,mathHint,spellHint,SPELL,
    };
    return api;
  }
  return{create,mathSkill,mathHint,spellHint,BANDS};
})();
const LK=LEARN.create('wd_learn');
const RM=matchMedia('(prefers-reduced-motion: reduce)');   /* no hurt-blink, no title pulse */

/* ═══════════ QUESTION CORE (lifted from Spell & Maths Galaxy) ═══════════ */
/* words — grade-tiered bank, sentence-context clues. ~ is the masked word. */
const WORDS={
 1:[['cat','the ~ says meow'],['dog','the ~ says woof'],['sun','the ~ lights the day'],
    ['hat','she wore a ~ on her head'],['bus','we rode the ~ to town'],['fish','a ~ swims in water'],
    ['frog','a green ~ jumps and croaks'],['bird','a ~ has feathers and wings'],
    ['cake','we ate birthday ~'],['star','each ~ burns far away'],['moon','the ~ circles the earth'],
    ['tree','a ~ has leaves and branches'],['duck','the ~ says quack'],['ship','a ~ crosses the sea'],
    ['milk','the cat drank ~'],['book','she read a ~ at night'],['door','he knocked on the ~'],
    ['king','the ~ wore a golden crown'],['ring','a diamond ~ on her finger'],
    ['road','the ~ goes over the hill'],['snow','cold white ~ fell all night'],
    ['bear','the big ~ slept all winter'],['nest','eggs rest in a ~'],
    ['rain','~ fell from the grey clouds'],['boat','they sailed a small ~'],
    ['farm','cows and sheep live on a ~'],['goat','the ~ ate the grass'],
    ['jump','you ~ over the log'],['lamp','turn on the ~ to read'],
    ['leaf','a red ~ fell from the tree'],['pond','ducks swim on the ~'],
    ['sock','one ~ is missing again'],['wing','each bird has a left and right ~'],
    ['wood','the fire is made of ~']],
 2:[['garden','flowers grow in the ~'],['bridge','the train crossed the ~'],
    ['monkey','a ~ climbs and swings'],['orange','an ~ is a round citrus fruit'],
    ['purple','~ is red mixed with blue'],['school','you learn at ~'],
    ['pencil','you write with a ~'],['tiger','a ~ is a big striped cat'],
    ['planet','earth is a ~'],['castle','knights lived in a ~'],
    ['engine','the ~ makes the ship move'],['flower','a ~ opens in the sun'],
    ['dolphin','a ~ is a clever sea animal'],['rocket','a ~ climbs out of the sky'],
    ['brother','my ~ is older than me'],['chair','sit on the ~ at the desk'],
    ['cheese','the mouse ate the ~'],['chicken','the ~ laid an egg'],
    ['circle','draw a ~ with no corners'],['dinner','~ is the evening meal'],
    ['eleven','ten plus one is ~'],['family','my ~ is big and loud'],
    ['forest','wolves live deep in the ~'],['friend','a ~ shares with you'],
    ['honey','bees make sweet ~'],['horse','she rides her ~ daily'],
    ['island','an ~ is land in the sea'],['jacket','wear a ~ when it is cold'],
    ['kitchen','soup cooks in the ~'],['library','borrow books from the ~'],
    ['market','fruit is sold at the ~'],['morning','the ~ comes after night'],
    ['mountain','climb the tall ~'],['picture','paint a ~ of the sea'],
    ['shadow','your ~ follows the sun'],['thunder','~ rumbles after lightning'],

const word=lv=>{const w=pick(WORDS[clamp(lv,1,5)]);return{t:w[0],h:w[1]};};
function clueSentence(w,idx){
  const masked=w.t.split('').map((c,i)=>i<idx?c:'·').join('');
  const s=w.h.replace('~',masked);
  return s.charAt(0).toUpperCase()+s.slice(1);
}
/* one-line teaching hints, shown after a miss */
function hintFor(op,a,b){
  switch(op){
    case '+': return `start at ${a}, count on ${b} more`;
    case '−': return `count up from ${b} to ${a}`;
    case '×': return `${b} groups of ${a} — or ${a} groups of ${b}`;
    case '÷': return `how many ${b}s make ${a}?`;
    default: return '';
  }
}
function qMath(d){
  let a,b,op,ans,sp,mn,mx,hint='';
  if(d===1){op=Math.random()<.5?'+':'−';a=rint(1,10);b=rint(1,10);if(op==='−'&&b>a)[a,b]=[b,a];
            ans=op==='+'?a+b:a-b;sp=4;mn=0;mx=20;}
  else if(d===2){const r=Math.random();
    if(r<.34){op='+';a=rint(5,30);b=rint(5,30);ans=a+b;sp=7;mn=0;mx=64;}
    else if(r<.68){op='−';a=rint(10,45);b=rint(1,a);ans=a-b;sp=7;mn=0;mx=45;}
    else{op='×';a=rint(2,9);b=rint(2,9);ans=a*b;sp=8;mn=0;mx=90;}}
  else if(d===3){const r=Math.random();
    if(r<.25){op='+';a=rint(25,99);b=rint(25,99);ans=a+b;sp=14;mn=0;mx=200;}
    else if(r<.5){op='−';a=rint(40,99);b=rint(10,a);ans=a-b;sp=14;mn=0;mx=99;}
    else if(r<.78){op='×';a=rint(3,12);b=rint(3,12);ans=a*b;sp=12;mn=0;mx=150;}
    else{op='÷';b=rint(2,9);ans=rint(2,12);a=b*ans;sp=6;mn=0;mx=20;}}
  else{ /* tier 4: two-step, fractions of a quantity, percentages */
    const r=Math.random();
    if(r<.4){const b1=rint(2,9),b2=rint(2,9); a=rint(3,18); ans=a+b1*b2;
      return{prompt:`${a} + ${b1} × ${b2}`,hint:`${b1} × ${b2} = ${b1*b2}, then ${a} + ${b1*b2}`,
             answer:String(ans)};}
    if(r<.7){const den=pick([2,3,4,5]); const num=pick([1,1,1,2,3].filter(n=>n<den));
      const T=den*rint(3,12); ans=T/den*num;
      return{prompt:`${num}/${den} of ${T}`,hint:`divide ${T} by ${den} (bottom), then times by ${num} (top)`,
             answer:String(ans)};}
    const p=pick([10,20,25,50,75]), T=pick([20,40,60,80,100,200]);
    ans=T/100*p;
    return{prompt:`${p}% of ${T}`,hint:`${p}% of ${T} = ${T} ÷ 100 × ${p}`,answer:String(ans)};}
  hint=hintFor(op,a,b);
  return{prompt:`${a} ${op} ${b}`,hint,answer:String(ans)};
}
/* build a lock question for the current mode+level.
   {prompt, hint, answer, chars} — chars are the rune glyphs to lay out. */
function makeQuestion(mode,level){
  const d=LK.tier('math',Math.floor((level-1)/2));   /* the age band sets the range; depth ramps inside it */
  if(mode==='math'){
    const q=qMath(d);
    const need=q.answer.split('');
    const chars=[...need];
    const digs='0123456789';
    let guard=0;
    while(chars.length<Math.max(5,need.length+2)&&guard++<60){
      const g=digs[rint(0,9)];
      if(!need.includes(g))chars.push(g);
    }
    return{prompt:q.prompt+' = ?',hint:q.hint,answer:q.answer,chars:shuf(chars),kind:'math',raw:q.prompt};
  }
  const wt=LK.tier('word',Math.floor((level-1)/2));
  const w=word(wt);
  return{prompt:clueSentence(w,0),hint:'rebuild the word from the sentence clue',
         answer:w.t,chars:shuf(w.t.split('')),word:w,kind:'spell',tier:wt};
}

/* ═══════════ audio (WebAudio, synthesized) ═══════════ */
const AU={ctx:null,on:true,
  init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
         if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  note(f,d=.15,type='square',v=.06,delay=0){
    if(!this.on||!this.ctx)return;
    const c=this.ctx,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);
    g.gain.exponentialRampToValueAtTime(.0008,t+d);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);},
  jump(){this.note(300,.12,'square',.05);},
  djump(){this.note(420,.12,'square',.05);},
  coin(){this.note(880,.08,'square',.05);this.note(1320,.1,'square',.04,.06);},
  good(){this.note(392,.12,'triangle',.07);this.note(523,.16,'triangle',.06,.08);},
  bad(){this.note(110,.3,'sawtooth',.06);},
  stomp(){this.note(180,.1,'square',.07);this.note(90,.15,'square',.05,.05);},
  hurt(){this.note(140,.25,'sawtooth',.07);},
  unlock(){[392,494,587,784].forEach((f,i)=>this.note(f,.2,'triangle',.06,i*.09));},
  die(){[330,262,196,131].forEach((f,i)=>this.note(f,.25,'sawtooth',.06,i*.14));}
};

/* touch controls: left/right/jump zones, mirror the keys{} state so all
   existing keyboard-driven logic (movement, edge-triggered jump, menu/shop
   confirm) works unchanged for touch. */
function bindTouchBtn(el,code){
  if(!el)return;
  const on=e=>{e.preventDefault();if(!keys[code])onKeyPress(code);keys[code]=true;AU.init();};
  const off=e=>{e.preventDefault();keys[code]=false;};
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('pointerleave',off);
}

function makeLock(kind,drawX,runeX,level){
  const q=makeQuestion(G.mode,level);
  const n=q.chars.length, tw=28, gap=3;
  const runes=q.chars.map((ch,i)=>({x:runeX+i*(tw+gap),y:GY-14,w:tw,h:14,ch,
                                    used:false,glow:0,pressed:false,reveal:false,spikeT:0}));
  return{x:drawX,kind,q,runes,idx:0,solved:false,w:56,h:kind==='door'?150:44};
}

function makeLevel(n){
  G.solids=[];G.coinsArr=[];G.torches=[];G.slimes=[];G.locks=[];G.hazards=[];G.particles=[];G.boss=null;
  G.trapCount=0;
  const R=mulberry32(G.runSeed+n*7919);
  if(n%4===0){ /* ── boss arena ── */
    G.level_w=1300;
    addFloor(G.solids,0,G.level_w);
    G.torches.push({x:120,y:GY-10},{x:G.level_w-120,y:GY-10},{x:G.level_w/2,y:GY-10});
    G.player=newPlayer(80,GY-40);
    G.boss={x:G.level_w-260,y:GY-88,w:96,h:88,hp:3,maxhp:3,vy:0,hop:0,dir:-1,enrage:0,
            q:null,runes:[],idx:0,timer:14,anim:0,deadT:0};
    bossQuestion();
    return;
  }
  const nsec=3+Math.min(2,Math.floor(n/3));       /* 3..5 sections, grows with depth */
  const padStart=260+nsec*SECW;
  const PAD=1300;                                  /* locked antechamber end pad */
  G.level_w=padStart+PAD;
  addFloor(G.solids,0,260);                        /* start ledge */
  const c={coins:G.coinsArr,torches:G.torches,hazards:G.hazards};
  const used=[];
  for(let i=0;i<nsec;i++){
    let t=Math.floor(R()*TEMPLATES.length);
    let guard=0; while(used.includes(t)&&guard++<8)t=Math.floor(R()*TEMPLATES.length);
    used.push(t);
    TEMPLATES[t](G.solids,R,260+i*SECW,c);
  }
  addFloor(G.solids,padStart,G.level_w);           /* end pad */
  G.torches.push({x:padStart+70,y:GY-10},{x:padStart+640,y:GY-10},{x:G.level_w-200,y:GY-10});
  /* patrolling slimes */
  const nsl=2+Math.min(3,Math.floor(n/2));
  for(let i=0;i<nsl;i++){
    const sx=380+R()*(G.level_w-1900);
    G.slimes.push({x:sx,y:GY-30,w:34,h:28,dir:R()<.5?-1:1,x0:sx-120,x1:sx+120,dead:false,squash:0});
  }
  /* locked antechamber: chest lock, then the key door, then the exit */
  G.locks.push(makeLock('chest',padStart+560,padStart+60,n));
  G.locks.push(makeLock('door',padStart+1120,padStart+660,n));
  /* exit door at the far right */
  G.exit={x:G.level_w-110,y:GY-92,w:60,h:92};
  G.player=newPlayer(60,GY-40);
}
function bossQuestion(){
  const b=G.boss;
  b.q=makeQuestion(G.mode,G.level);
  b.idx=0;
  const chars=b.q.chars,n=chars.length;
  const total=Math.min(n*58,700);
  const startX=(G.level_w-total)/2;
  b.runes=chars.map((ch,i)=>({x:startX+i*(total/n),y:GY-14,w:total/n-6,h:14,ch,
                              used:false,glow:0,pressed:false,reveal:false,spikeT:0}));
  b.timer=14;
}

function startRun(mode){
  G.mode=mode;G.level=1;G.hp=3;G.coins=0;G.keys=0;G.scrolls=1;
  LK.startSession(); closeGrown();
  G.runSeed=(Math.random()*1e9)|0;
  G.phase='play';
  meta.runs++;saveMeta(meta);
  makeLevel(1);
}
function bestKey(){return G.mode==='math'?'bestMath':'bestSpell';}
function bankBest(){if(G.level>meta[bestKey()]){meta[bestKey()]=G.level;saveMeta(meta);}}
function levelClear(){
  bankBest();
  G.phase='shop';
}
function nextLevel(){
  G.level++;
  G.phase='play';
  makeLevel(G.level);
}
function die(){
  if(G.phase!=='play')return;
  G.player.dead=true;
  AU.die();
  bankBest();
  G.phase='gameover';
}
function hurt(n){
  const p=G.player;
  if(!p||p.inv>0||G.phase!=='play')return false;
  G.hp-=(n||1);p.inv=1.4;
  AU.hurt();
  for(let i=0;i<10;i++)G.particles.push({x:p.x+p.w/2,y:p.y+p.h/2,vx:(Math.random()-.5)*260,vy:-Math.random()*220,t:.6,c:'#c33'});
  if(G.hp<=0)die();
  return true;
}

/* ═══════════ rune logic (shared by locks and the boss) ═══════════ */
function onRune(owner,rune){
  if(rune.used||rune.spikeT>0)return;
  const solved=owner.solved===true||(owner===G.boss&&owner.hp<=0);
  if(solved)return;
  const need=owner.q.answer[owner.idx];
  if(need===undefined)return;
  if(rune.ch===need){
    rune.used=true;rune.glow=1;owner.idx++;
    AU.good();
    for(let i=0;i<6;i++)G.particles.push({x:rune.x+rune.w/2,y:rune.y,vx:(Math.random()-.5)*160,vy:-Math.random()*180,t:.5,c:'#7f7'});
    if(owner.idx>=owner.q.answer.length){noteAnswer(owner.q,true);runeComplete(owner);}
    else if(owner.q.kind==='spell')owner.q.prompt=clueSentence(owner.q.word,owner.idx);
  }else{
    /* wrong rune: spike trap pops + teaching hint, sequence resets */
    G.trapCount++;
    rune.spikeT=1.2;
    AU.bad();
    noteAnswer(owner.q,false);
    toast(owner.q.kind==='spell'?LK.spellHint(owner.q.word.t,owner.idx,owner.q.word.h):(owner.q.hint||'look at the clue again'));
    owner.idx=0;
    for(const r of owner.runes){r.used=false;r.glow=0;}
    if(owner.q.kind==='spell')owner.q.prompt=clueSentence(owner.q.word,0);
    if(owner===G.boss){owner.enrage=1.6;owner.timer=Math.max(6,owner.timer);}
    else hurt(1);
  }
}
function runeComplete(owner){
  owner.idx=owner.q.answer.length;
  if(owner===G.boss){bossHit();return;}
  owner.solved=true;
  AU.unlock();
  if(owner.kind==='door'){
    G.keys++;say('the door yields a KEY',2.5);
  }else{
    const gain=8+Math.floor(Math.random()*7);
    G.coins+=gain;meta.coinsEarned+=gain;saveMeta(meta);
    say('the chest spills '+gain+' coins',2.5);
  }
}
function bossHit(){
  const b=G.boss;
  b.hp--;AU.unlock();
  say('the king reels!',1.6);
  if(b.hp<=0){
    const gain=25;G.coins+=gain;meta.coinsEarned+=gain;saveMeta(meta);
    G.bossWins++;
    say('SLIME KING falls! +'+gain+' coins',3);
    b.deadT=1.2;
    for(let i=0;i<40;i++)G.particles.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:(Math.random()-.5)*420,vy:-Math.random()*380,t:1.1,c:i%2?'#4c4':'#8c8'});
  }else{
    bossQuestion();
  }
}

/* ═══════════ key presses ═══════════ */
function onKeyPress(code){
  if(code==='Slash'||code==='NumpadDivide'){showHint();return;}
  if(G.phase==='menu'){
    if(document.getElementById('grown').classList.contains('show')){if(code==='Enter'||code==='KeyG')closeGrown();return;}
    if(code==='Digit1'||code==='Numpad1')startRun('math');
    else if(code==='Digit2'||code==='Numpad2')startRun('spell');
    else if(code==='KeyH'||code==='KeyI')G.howto=!G.howto;
    else if(code==='KeyB'){LK.setBand(LK.BANDS[(LK.bandIndex()+1)%LK.BANDS.length].id);paintStrip();}
    else if(code==='KeyT')coachStart();
    else if(code==='KeyG')openGrown();
    return;
  }
  if(G.phase==='gameover'){
    if(code==='Enter'||code==='Space'||code==='KeyR')G.phase='menu';
    return;
  }
  if(G.phase==='shop'){
    if(code==='Digit1'||code==='Numpad1')buyItem('heart');
    else if(code==='Digit2'||code==='Numpad2')buyItem('scroll');
    else if(code==='Enter'||code==='Space'||code==='KeyE')nextLevel();
    return;
  }
  if(G.phase==='play'&&code==='KeyH'&&G.scrolls>0){
    const tgt=activeLock()||G.boss;
    if(tgt&&tgt.idx<tgt.q.answer.length){
      G.scrolls--;
      const need=tgt.q.answer[tgt.idx];
      for(const r of tgt.runes)if(r.ch===need&&!r.used)r.reveal=true;
      say('hint scroll: the next rune glows',2);
    }else say('no active lock to divine',1.5);
  }
}
function activeLock(){
  for(const L of G.locks)if(!L.solved)return L;
  return null;
}
function buyItem(what){
  if(what==='heart'&&G.coins>=12&&G.hp<5){G.coins-=12;G.hp++;say('bought a heart',1.6);AU.coin();}
  else if(what==='scroll'&&G.coins>=6){G.coins-=6;G.scrolls++;say('bought a hint scroll',1.6);AU.coin();}
  else AU.bad();
}

/* ═══════════ update ═══════════ */
function physics(dt){
  const p=G.player;
  /* horizontal */
  const dir=(rightDown()?1:0)-(leftDown()?1:0);
  const target=dir*270;
  p.vx+=(target-p.vx)*Math.min(1,dt*14);
  if(dir!==0)p.face=dir;
  /* jump + double jump (edge-triggered) */
  const jp=jumpDown();
  if(jp&&!prevJump){
    if(p.onG){p.vy=-660;p.jumps=1;p.onG=false;AU.jump();}
    else if(p.jumps<2){p.vy=-600;p.jumps=2;AU.djump();
      for(let i=0;i<6;i++)G.particles.push({x:p.x+p.w/2,y:p.y+p.h,vx:(Math.random()-.5)*140,vy:60,t:.4,c:'#aab'});}
  }
  prevJump=jp;
  p.vy+=1900*dt;if(p.vy>900)p.vy=900;
  /* the door lock adds a solid wall while locked */
  const walls=[...G.solids];
  for(const L of G.locks)if(L.kind==='door'&&!L.solved)
    walls.push({x:L.x,y:GY-150,w:L.w,h:150,type:'doorwall'});
  /* move X */
  p.x+=p.vx*dt;
  for(const s of walls){
    if(aabb(p,s)){
      if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;
      p.vx=0;
    }
  }
  p.x=clamp(p.x,0,G.level_w-p.w);
  /* move Y */
  p.y+=p.vy*dt;
  p.onG=false;
  for(const s of walls){
    if(aabb(p,s)){
      if(p.vy>0){p.y=s.y-p.h;p.onG=true;p.jumps=0;p.vy=0;}
      else if(p.vy<0){p.y=s.y+s.h;p.vy=0;}
    }
  }
  /* fell off the world */
  if(p.y>H+80){die();return;}
  if(p.inv>0)p.inv-=dt;
  p.anim+=dt*Math.abs(p.vx)*.05;

  /* rune tiles: trigger once per contact */
  const foot={x:p.x+4,y:p.y+p.h-2,w:p.w-8,h:8};
  const owners=[...G.locks];
  if(G.boss&&G.boss.hp>0)owners.push(G.boss);
  for(const owner of owners){
    if(owner!==G.boss&&owner.solved)continue;
    for(const r of owner.runes){
      const hit=aabb(foot,r);
      if(hit&&!r.pressed){r.pressed=true;onRune(owner,r);}
      else if(!hit&&r.pressed)r.pressed=false;
      if(r.spikeT>0){
        r.spikeT-=dt;
        if(hit&&hurt(1))r.spikeT=0;   /* standing in the popped trap stings */
      }
      if(r.glow>0)r.glow-=dt*1.5;
    }
  }

  /* static spikes */
  for(const hz of G.hazards){
    if(aabb(foot,hz)){if(hurt(1))p.vy=-420;}
  }

  /* coins */
  for(const c of G.coinsArr){
    if(!c.taken&&aabb(p,{x:c.x-10,y:c.y-10,w:20,h:20})){
      c.taken=true;G.coins++;AU.coin();
      for(let i=0;i<5;i++)G.particles.push({x:c.x,y:c.y,vx:(Math.random()-.5)*180,vy:-Math.random()*200,t:.5,c:'#fd4'});
    }
  }

  /* slimes */
  for(const s of G.slimes){
    if(s.dead)continue;
    s.x+=s.dir*46*dt;
    if(s.x<s.x0){s.x=s.x0;s.dir=1;}
    if(s.x+s.w>s.x1){s.x=s.x1-s.w;s.dir=-1;}
    if(aabb(p,{x:s.x,y:s.y-2,w:s.w,h:s.h})){
      if(p.vy>140&&p.y+p.h-s.y<26){   /* stomp from above */
        s.dead=true;s.squash=.4;AU.stomp();
        p.vy=-480;p.jumps=1;
        for(let i=0;i<10;i++)G.particles.push({x:s.x+s.w/2,y:s.y,vx:(Math.random()-.5)*240,vy:-Math.random()*200,t:.6,c:'#4c4'});
      }else hurt(1);
    }
  }

  /* exit door */
  if(G.exit&&aabb(p,G.exit)){
    if(G.keys>0){G.keys=0;levelClear();}
    else say('LOCKED — find the key beyond the rune door',1.4);
  }

  updateBoss(dt);
}

function updateBoss(dt){
  const b=G.boss,p=G.player;
  if(!b)return;
  if(b.hp<=0){
    if(b.deadT>0){
      b.deadT-=dt;
      if(b.deadT<=0)levelClear();
    }
    return;
  }
  b.anim+=dt;
  /* the king hops toward you */
  b.hop-=dt;
  if(b.hop<=0){b.hop=b.enrage>0?.9:1.5;b.vy=-380;b.dir=p.x>b.x?1:-1;}
  b.vy+=1500*dt;
  b.x+=b.dir*(b.enrage>0?170:95)*dt;
  b.y+=b.vy*dt;
  if(b.y>GY-b.h){b.y=GY-b.h;b.vy=0;}
  b.x=clamp(b.x,60,G.level_w-b.w-60);
  if(b.enrage>0)b.enrage-=dt;
  /* question timer */
  b.timer-=dt;
  if(b.timer<=0){
    toast(b.q.hint||'too slow! the sequence resets');
    b.idx=0;b.timer=14;
    for(const r of b.runes){r.used=false;r.glow=0;}
    if(b.q.kind==='spell')b.q.prompt=clueSentence(b.q.word,0);
    b.enrage=1.2;
  }
  /* contact hurts */
  if(aabb(p,b))hurt(1);
}

/* ═══════════ render ═══════════ */
function txt(s,x,y,size,col,align,bold){
  ctx.fillStyle=col;ctx.font=(bold?'bold ':'')+size+'px monospace';
  ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.fillText(s,x,y);
}
function drawBricks(x,y,w,h,base){
  ctx.fillStyle=base;ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;
  const bw=40,bh=20;
  ctx.beginPath();
  for(let ry=1;ry<h/bh;ry++){
    ctx.moveTo(x,y+ry*bh);ctx.lineTo(x+w,y+ry*bh);
    const off=(ry%2)*bw/2;
    for(let rx=0;rx<w/bw+1;rx++){
      const bx=x+rx*bw-off;
      ctx.moveTo(bx,y+ry*bh);ctx.lineTo(bx,y+ry*bh+bh);
    }
  }
  ctx.stroke();
}
function drawTorch(t,tt){
  const x=t.x-G.camX;
  ctx.fillStyle='#543';ctx.fillRect(x-3,t.y-26,6,26);
  const fl=Math.sin(tt*11+t.x)*3;
  const g=ctx.createRadialGradient(x,t.y-32,2,x,t.y-32,90);
  g.addColorStop(0,'rgba(255,180,80,.32)');g.addColorStop(1,'rgba(255,150,50,0)');
  ctx.fillStyle=g;ctx.fillRect(x-90,t.y-120,180,170);
  ctx.fillStyle='#f95';ctx.beginPath();
  ctx.ellipse(x,t.y-32+fl*.4,5+fl,10-fl,0,0,7);ctx.fill();
  ctx.fillStyle='#fd7';ctx.beginPath();
  ctx.ellipse(x,t.y-31,3,5,0,0,7);ctx.fill();
}
function drawRune(r,need,tt){
  const x=r.x-G.camX;
  const active=r.used||r.glow>0;
  const hot=r.reveal&&!r.used&&need&&r.ch===need;
  ctx.fillStyle=r.spikeT>0?'#7a2':active?'#2a5a2a':'#3a3f4c';
  ctx.fillRect(x,r.y,r.w,r.h);
  ctx.strokeStyle=active?'#7f7':'#666';ctx.lineWidth=1.5;
  if(hot)ctx.strokeStyle=`rgba(255,255,80,${.5+.5*Math.sin(tt*8)})`;
  ctx.strokeRect(x+1,r.y+1,r.w-2,r.h-2);
  ctx.fillStyle=active?'#9f9':'#dde';ctx.font='bold 15px monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(r.ch,x+r.w/2,r.y-11);
  if(r.spikeT>0){
    ctx.fillStyle='#ccc';
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.moveTo(x+6+i*(r.w-12)/3,r.y);
      ctx.lineTo(x+10+i*(r.w-12)/3,r.y-22);
      ctx.lineTo(x+14+i*(r.w-12)/3,r.y);
      ctx.fill();
    }
  }
}
function bubble(cx,cy,line1,need){
  ctx.font='15px monospace';
  const w=ctx.measureText(line1).width+28;
  const x=clamp(cx,w/2+6,W-w/2-6);
  ctx.fillStyle='rgba(12,14,22,.92)';ctx.strokeStyle='#8899bb';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(x-w/2,cy-26,w,52,8);ctx.fill();ctx.stroke();
  txt(line1,x,cy-13,15,'#ffd27f','left');
  if(need!==undefined)
    txt('next rune needed: '+need,x,cy+8,12,'#7f7','left');
}
function drawLock(L,tt){
  const x=L.x-G.camX;
  if(L.kind==='door'){
    if(L.solved){
      ctx.fillStyle='rgba(60,50,30,.25)';ctx.fillRect(x,GY-150,L.w,150);
      ctx.fillStyle='#543';ctx.fillRect(x-6,GY-158,8,158);ctx.fillRect(x+L.w-2,GY-158,8,158);
    }else{
      drawBricks(x,GY-150,L.w,150,'#4a3b2c');
      ctx.fillStyle='#2c2418';ctx.fillRect(x+8,GY-120,L.w-16,80);
      ctx.fillStyle='#c9a227';ctx.beginPath();ctx.arc(x+L.w/2,GY-108,7,0,7);ctx.fill();
      ctx.fillStyle='#000';ctx.fillRect(x+L.w/2-2,GY-108,4,8);
      txt('?',x+L.w/2,GY-40,26,'#c9a227','center',true);
    }
  }else{ /* chest */
    const y=GY-L.h;
    ctx.fillStyle=L.solved?'#6a5530':'#7a5a2e';ctx.fillRect(x,y,L.w,L.h);
    ctx.fillStyle=L.solved?'#3a2f18':'#5a4020';ctx.fillRect(x,y,L.w,10);
    ctx.strokeStyle='#c9a227';ctx.lineWidth=2;ctx.strokeRect(x+2,y+2,L.w-4,L.h-4);
    if(!L.solved){ctx.fillStyle='#c9a227';ctx.fillRect(x+L.w/2-4,y+L.h/2-5,8,10);}
  }
  if(!L.solved){
    const label=L.kind==='door'?'LOCKED DOOR — ':'LOCKED CHEST — ';
    let q=L.q.prompt;
    if(L.q.kind==='math')q+='  ['+L.q.answer.slice(0,L.idx)+'·'.repeat(L.q.answer.length-L.idx)+']';
    bubble(x+L.w/2,GY-(L.kind==='door'?186:96),label+q,L.q.answer[L.idx]);
  }
  for(const r of L.runes)drawRune(r,L.q.answer[L.idx],tt);
}
function drawPlayer(p,tt){
  const x=p.x-G.camX;
  if(p.inv>0&&!RM.matches&&Math.floor(p.inv*12)%2)return;   /* reduced motion: no 12 Hz blink */
  if(p.inv>0&&RM.matches)ctx.globalAlpha=.55;
  ctx.fillStyle='#ccd3e0';ctx.fillRect(x,p.y,24,18);            /* tabard */
  ctx.fillStyle='#8899cc';ctx.fillRect(x+2,p.y+2,20,6);
  ctx.fillStyle='#e8e0d0';ctx.fillRect(x+(p.face>0?14:2),p.y+6,8,8); /* helm visor */
  ctx.fillStyle='#a33';ctx.fillRect(x+10,p.y-6,4,8);            /* plume */
  const lg=Math.sin(p.anim*8)*(p.onG&&Math.abs(p.vx)>20?4:0);
  ctx.fillStyle='#5a6b95';
  ctx.fillRect(x+3,p.y+18+Math.max(0,lg),8,16-Math.max(0,lg));
  ctx.fillRect(x+13,p.y+18+Math.max(0,-lg),8,16-Math.max(0,-lg));
  ctx.fillStyle='#543';ctx.fillRect(x+(p.face>0?24:-6),p.y+8,6,4); /* torch */
  ctx.globalAlpha=1;
}
function drawSlime(s,tt){
  if(s.dead)return;
  const x=s.x-G.camX;
  const sq=s.squash>0?s.squash:0;
  const h=s.h*(1-sq),w=s.w*(1+sq);
  const y=s.y+(s.h-h);
  const wob=Math.sin(tt*6+s.x0)*2;
  ctx.fillStyle='#3f9d3f';
  ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2,h/2+wob*.1,0,0,7);ctx.fill();
  ctx.fillStyle='#7fd77f';
  ctx.beginPath();ctx.ellipse(x+w/2,y+h*.4,w/3,h/3,0,0,7);ctx.fill();
  ctx.fillStyle='#111';
  ctx.fillRect(x+w/2-7,y+h/2-3,4,5);ctx.fillRect(x+w/2+3,y+h/2-3,4,5);
}
function drawCoin(c,tt){
  if(c.taken)return;
  const x=c.x-G.camX;
  const ph=Math.sin(tt*5+c.x*.05);
  ctx.fillStyle='#c9a227';ctx.beginPath();ctx.ellipse(x,c.y+ph*2,7,9,0,0,7);ctx.fill();

function drawHazard(hz){

function drawExitDoor(tt){
  const e=G.exit,x=e.x-G.camX;

function drawBoss(tt){

  ctx.quadraticCurveTo(x-6+w*.15,y+h*.2,x+w/2,y);

  ctx.fillStyle='rgba(255,255,255,.25)';
  ctx.beginPath();ctx.ellipse(x+w*.38,y+h*.35,w*.14,h*.12,0,0,7);ctx.fill();
  ctx.fillStyle='#c9a227';
  ctx.beginPath();
  ctx.moveTo(x+w*.3,y-2);ctx.lineTo(x+w*.38,y-16);ctx.lineTo(x+w*.46,y-2);
  ctx.lineTo(x+w*.54,y-18);ctx.lineTo(x+w*.62,y-2);ctx.lineTo(x+w*.7,y-14);ctx.lineTo(x+w*.74,y-2);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff5';
  ctx.fillRect(x+w*.32,y+h*.3,8,10);ctx.fillRect(x+w*.58,y+h*.3,8,10);
  ctx.fillStyle='#000';ctx.fillRect(x+w*.32+(b.dir>0?3:0),y+h*.33,4,6);ctx.fillRect(x+w*.58+(b.dir>0?3:0),y+h*.33,4,6);

function drawHUD(){

  txt(String(G.coins),W-196,20,16,'#ffd75e');
  txt('scrolls '+G.scrolls+' [H]',W-104,20,13,'#8ab');
  txt((G.mode==='math'?'MATH':'SPELLING')+'  ·  DEPTH '+G.level+(G.level%4===0?' — BOSS':''),W/2,20,15,'#dde','center',true);
  txt('best: '+meta[bestKey()],W/2,38,12,'#889');
  if(G.keys>0)txt('KEY HELD',34,46,13,'#ffd75e','center',true);
  if(G.hintT>0&&G.hintToast){
    ctx.font='15px monospace';
    const lines=wrapText('HINT — '+G.hintToast,620).slice(0,3), bh=20+lines.length*20;
    ctx.fillStyle='rgba(20,26,16,.94)';ctx.strokeStyle='#7f7';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(W/2-330,H-36-bh,660,bh,10);ctx.fill();ctx.stroke();
    lines.forEach((l,i)=>txt(l,W/2,H-36-bh+20+i*20,15,'#af7','center'));
  }
  if(G.msgT>0)txt(G.msg,W/2,70,17,'#ffd27f','center',true);
}
function drawMenu(tt){
  ctx.fillStyle='#0b0d12';ctx.fillRect(0,0,W,H);
  drawBricks(0,0,W,H,'#141824');
  for(const t of [{x:140,y:470},{x:820,y:470}])drawTorch(t,tt);
  const sc=RM.matches?1:1+Math.sin(tt*2)*.02;
  ctx.save();ctx.translate(W/2,110);ctx.scale(sc,sc);
  txt('WORD DUNGEON',0,0,56,'#ffd75e','center',true);
  ctx.restore();
  txt('doors and chests are locked by questions —',W/2,158,16,'#99a','center');
  txt('jump the runes in the right order to open them',W/2,180,16,'#99a','center');
  const card=(x,label,desc,best,key)=>{
    ctx.fillStyle='#1b2130';ctx.strokeStyle='#4a5578';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(x,230,220,150,12);ctx.fill();ctx.stroke();
    txt(label,x+110,276,24,'#ffd75e','center',true);
    txt(desc,x+110,312,13,'#99a','center');
    txt('best depth: '+best,x+110,342,13,'#7f7','center');
    txt('press '+key+' or tap',x+110,366,13,'#dde','center');
    hit(x,230,220,150,()=>startRun(key==='1'?'math':'spell'));
  };
  card(200,'MATH','arithmetic runes + − × ÷',meta.bestMath,'1');
  card(540,'SPELLING','rebuild the clue word',meta.bestSpell,'2');
  if(G.howto){
    ctx.fillStyle='rgba(10,12,18,.96)';ctx.strokeStyle='#8899bb';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(140,70,680,410,12);ctx.fill();ctx.stroke();
    const lines=['HOW TO PLAY',
      '','A / D or arrows — move','W / SPACE — jump (press twice to double-jump)',
      '','Locked doors + chests show a question.','Letter/number runes lie on the floor.',
      'Jump on them IN ORDER to spell the answer.',
      '','Wrong rune: a spike trap pops and you lose a heart —',
      'but a teaching hint appears. The sequence resets.',
      '','Stomp slimes from above. Dodge their sides.',
      'Reach the EXIT door with the key to descend.',
      'Every 4th depth: the SLIME KING asks 3 rapid questions.',
      '','H — hint scroll (lights the next rune) · / — free hint',
      'shop: 1 heart, 2 scroll · B age band · G grown-ups'];
    lines.forEach((l,i)=>txt(l,W/2,104+i*22,i===0?20:14,i===0?'#ffd75e':'#ccd','center',i===0));
    txt('press H to close',W/2,466,12,'#889','center');
  }else if(stripBelow){
    /* the band and help buttons sit under the canvas (portrait phones); otherwise they sit right here */
    txt('age band: '+LK.BANDS[LK.bandIndex()].label,W/2,420,14,'#7f7','center');
  }
  txt('runs: '+meta.runs+'   coins earned: '+meta.coinsEarned,W/2,508,12,'#667','center');
}
function drawShop(tt){
  ctx.fillStyle='rgba(8,10,14,.85)';ctx.fillRect(0,0,W,H);
  txt('DEPTH '+G.level+' CLEARED',W/2,80,30,'#ffd75e','center',true);
  txt('a merchant carts his wares between the stones…',W/2,116,14,'#99a','center');
  const row=(y,name,cost,note,key)=>{
    ctx.fillStyle='#1b2130';ctx.strokeStyle='#4a5578';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(230,y,500,64,10);ctx.fill();ctx.stroke();
    txt(key+'.  '+name,260,y+24,18,'#dde');
    txt(note,260,y+46,13,'#889');
    txt(cost+' coins',700,y+32,16,G.coins>=cost?'#ffd75e':'#665','right',true);
    hit(230,y,500,64,()=>buyItem(key==='1'?'heart':'scroll'));
  };
  row(160,'heart',12,'heal one heart (max 5)','1');
  row(240,'hint scroll',6,'reveals the next rune of a lock [H]','2');
  ctx.fillStyle='#1b2130';ctx.strokeStyle='#7f7';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(230,330,500,56,10);ctx.fill();ctx.stroke();
  txt('ENTER — descend to depth '+(G.level+1)+((G.level+1)%4===0?'  (BOSS!)':''),W/2,358,17,'#af7','center',true);
  hit(230,330,500,56,()=>nextLevel());
  txt('coins: '+G.coins+'   hearts: '+G.hp+'   scrolls: '+G.scrolls,W/2,140,15,'#ffd75e','center');
}
function drawGameOver(tt){
  ctx.fillStyle='rgba(8,6,6,.86)';ctx.fillRect(0,0,W,H);
  txt('YOU FELL',W/2,180,48,'#e55','center',true);
  txt('the dungeon keeps depth '+G.level+' of you',W/2,236,16,'#99a','center');
  txt('best '+G.mode+' depth: '+meta[bestKey()],W/2,272,16,'#7f7','center');
  txt('ENTER — back to the gate',W/2,330,17,'#dde','center');
  hit(W/2-200,310,400,40,()=>{G.phase='menu';});
  const r=LK.report('session');
  if(r.answered)txt('this run: '+r.answered+' answers, '+r.acc+'% right',W/2,366,14,'#99a','center');
}
function render(tt){
  ctx.setTransform(SCALE,0,0,SCALE,0,0); hits=[];
  if(G.phase==='menu'){drawMenu(tt);return;}
  if(G.phase==='shop'){drawShop(tt);return;}
  if(G.phase==='gameover'){drawGameOver(tt);return;}
  ctx.fillStyle='#1a2030';ctx.fillRect(0,0,W,H);
  drawBricks(-((G.camX*.4)%80),0,W+160,H,'#232b3f');
  ctx.fillStyle='rgba(0,0,0,.14)';ctx.fillRect(0,0,W,H);
  for(const s of G.solids){
    const x=s.x-G.camX;
    if(x+s.w<-40||x>W+40)continue;
    drawBricks(x,s.y,s.w,s.h,s.type==='plat'?'#3d4a6b':'#46537a');
  }
  for(const hz of G.hazards){const x=hz.x-G.camX;if(x>-400&&x<W+40)drawHazard(hz);}
  for(const t of G.torches){const x=t.x-G.camX;if(x>-100&&x<W+100)drawTorch(t,tt);}
  for(const c of G.coinsArr){const x=c.x-G.camX;if(x>-30&&x<W+30)drawCoin(c,tt);}
  for(const s of G.slimes){const x=s.x-G.camX;if(x>-60&&x<W+60)drawSlime(s,tt);}
  drawExitDoor(tt);
  for(const L of G.locks)drawLock(L,tt);
  drawBoss(tt);
  drawPlayer(G.player,tt);
  for(const p of G.particles){
    ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,p.t);
    ctx.fillRect(p.x-G.camX-2,p.y-2,4,4);ctx.globalAlpha=1;
  }
  drawHUD();
}

/* ═══════════ main loop ═══════════ */
let last=performance.now(),fpsT=0,fpsN=0;
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  G.time+=dt;G.frames++;
  fpsT+=dt;fpsN++;
  if(fpsT>=1){G.fps=Math.round(fpsN/fpsT);fpsT=0;fpsN=0;}
  if(G.phase==='play'){
    physics(dt);
    G.camX=clamp(G.player.x-W*.38,0,Math.max(0,G.level_w-W));
  }
  if(G.hintT>0)G.hintT-=dt;
  if(G.msgT>0)G.msgT-=dt;
  for(let i=G.particles.length-1;i>=0;i--){
    const p=G.particles[i];p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=700*dt;
    if(p.t<=0)G.particles.splice(i,1);
  }
  for(const s of G.slimes)if(s.squash>0)s.squash-=dt;
  render(G.time);
  watchPhase(); coachAdvance();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);


/* ═══════════ arcade glue: taps, hints, age bands, grown-up report, first-run coach ═══════════ */
let hits=[];
function hit(x,y,w,h,fn){hits.push({x,y,w,h,fn});}
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)*W/r.width, y=(e.clientY-r.top)*H/r.height;
  for(const h of hits)if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){AU.init();h.fn();return;}
});
function wrapText(t,maxW){
  const words=String(t).split(' '),out=[];let line='';
  for(const w of words){const tryL=line?line+' '+w:w; if(ctx.measureText(tryL).width>maxW&&line){out.push(line);line=w;}else line=tryL;}
  if(line)out.push(line); return out;
}
function sdkState(o){try{window.ArcadeSDK&&ArcadeSDK.state(o);}catch(e){}}
function noteAnswer(q,ok){
  if(q.kind==='math')LK.noteMath(q.raw||q.prompt,ok);
  else LK.noteSpell(q.tier||1,ok,q.word.t);
}
/* a hint that teaches the step in front of the player, never the answer */
function currentHint(){
  if(G.phase==='play'){
    const t=activeLock()||(G.boss&&G.boss.hp>0?G.boss:null);
    if(t&&t.q){
      const q=t.q, far=t!==G.boss&&G.player&&t.runes[0]&&G.player.x<t.runes[0].x-520;
      const lead=far?'Head right to the '+(t.kind==='door'?'rune door':'locked chest')+'. ':'';
      if(q.kind==='math'){
        const n=q.answer.length, sofar=q.answer.slice(0,t.idx);
        return lead+LK.mathHint(q.raw||q.prompt)+(n>1?' The answer has '+n+' digits'+(t.idx?' and you have "'+sofar+'" so far.':'; jump them left to right.'):'');
      }
      return lead+LK.spellHint(q.word.t,t.idx,q.word.h);
    }
    if(G.keys>0)return 'You hold the key: walk right into the EXIT door.';
    return 'Stomp slimes from above and keep heading right to the exit.';
  }
  if(G.phase==='shop')return 'A hint scroll (6 coins) lights up the next rune of a lock; a heart (12 coins) heals one. Then descend.';
  if(G.phase==='gameover')return 'Back to the gate and try again. FOR GROWN-UPS shows which questions to practise.';
  return 'Pick an age band, then press 1 for Math or 2 for Spelling (or tap a card).';
}
function showHint(){const t=currentHint();toast(t);G.hintT=8;return t;}
bindTap(document.getElementById('tHint'),showHint);
bindTap(document.getElementById('tScroll'),()=>onKeyPress('KeyH'));
function bindTap(el,fn){el.addEventListener('pointerdown',e=>{e.preventDefault();AU.init();fn();});}

/* menu, shop and game-over controls as real buttons */
const strip=document.getElementById('strip');
function btn(label,fn,cls){const b=document.createElement('button');b.className='dbtn'+(cls?' '+cls:'');b.textContent=label;
  b.addEventListener('click',e=>{e.stopPropagation();AU.init();fn();});return b;}
function row(kids){const r=document.createElement('div');r.className='row';kids.forEach(k=>r.appendChild(k));return r;}
let stripBelow=false;
function paintStrip(){
  strip.innerHTML='';
  const ph=G.phase;
  if(ph==='menu'){
    const cur=LK.bandIndex();
    strip.appendChild(row(LK.BANDS.map((b,i)=>{const el=btn(b.label.toUpperCase(),()=>{LK.setBand(b.id);paintStrip();},i===cur?'on':'');
      el.setAttribute('aria-pressed',String(i===cur));return el;})));
    strip.appendChild(row([btn('HOW TO PLAY',()=>{G.howto=!G.howto;}),btn('TUTORIAL',coachStart),btn('FOR GROWN-UPS',openGrown)]));
  }else if(ph==='gameover'){
    strip.appendChild(row([btn('BACK TO THE GATE',()=>{G.phase='menu';},'go'),btn('FOR GROWN-UPS',openGrown)]));
  }else if(ph==='shop'){
    strip.appendChild(row([btn('HEART · 12',()=>buyItem('heart')),btn('SCROLL · 6',()=>buyItem('scroll')),btn('DESCEND ▶',()=>nextLevel(),'go')]));
  }
  strip.classList.toggle('show',!!strip.children.length);
  placeStrip();
}
function placeStrip(){
  const strip=document.getElementById('strip');
  if(!strip.classList.contains('show'))return;
  const r=cv.getBoundingClientRect(), h=strip.offsetHeight;
  stripBelow=innerHeight-r.bottom>=h+16;
  /* shop rows are drawn (and tappable) on the canvas; its buttons only show where there is room below */
  if(G.phase==='shop'&&!stripBelow){strip.classList.remove('show');return;}
  strip.style.top=(stripBelow?r.bottom+8:r.top+(G.phase==='gameover'?392:396)*r.height/H)+'px';
}
let lastPhase='';
function watchPhase(){
  if(G.phase===lastPhase)return;
  const was=lastPhase; lastPhase=G.phase; paintStrip(); closeGrown();
  if(G.phase==='menu')sdkState({scene:'title'});
  else if(G.phase==='play'&&was!=='play')sdkState({scene:'play',score:G.level});
  else if(G.phase==='gameover')sdkState({scene:'over',score:G.level,outcome:'fell'});
  else if(G.phase==='shop')sdkState({scene:'over',score:G.level,outcome:'depth cleared'});
}
function openGrown(){document.getElementById('grownBody').innerHTML=LK.reportHTML(G.phase==='gameover'?'session':'all')+
  (G.phase==='gameover'?'<p class="lk-p" style="color:#889">All-time report: FOR GROWN-UPS on the title screen.</p>':'');
  document.getElementById('grown').classList.add('show');document.getElementById('grownBack').focus();}
function closeGrown(){document.getElementById('grown').classList.remove('show');}
document.getElementById('grownBack').addEventListener('click',closeGrown);

/* first-run coach: learn the verbs by doing them; skippable, replayable */
const touchUI=matchMedia('(pointer: coarse)').matches;
const COACH=[
  {t:()=>touchUI?'Move with <b>◀ ▶</b> and jump with <b>▲</b> (tap it twice to double-jump).':'Move with <b>← →</b> (or A D) and jump with <b>↑</b>, W or Space. Jump twice for a double jump.',
   done:()=>G.player&&G.player.x>330},
  {t:()=>'Head right. The <b>locked chest</b> at the far end asks a question.',
   done:()=>{const L=G.locks[0];return !L||L.solved||(G.player&&G.player.x>L.runes[0].x-240);}},
  {t:()=>'Jump on the runes <b>in order</b> to spell the answer. A wrong rune pops spikes and shows a hint. Stuck? Press <b>'+(touchUI?'?':'/')+'</b> for a hint.',
   done:()=>{const L=G.locks[0];return !L||L.solved;}},
  {t:()=>'Open the <b>rune door</b> the same way, take the <b>KEY</b>, then walk into the <b>EXIT</b>.',
   done:()=>G.phase==='shop'},
];
let coachIx=-1;
function coachStart(){if(G.phase!=='play')startRun(G.mode||'math');coachIx=0;coachPaint();}
function coachEnd(){coachIx=-1;coachPaint();try{localStorage.setItem('wd_tut','1');}catch(e){}try{window.ArcadeSDK&&ArcadeSDK.event('tutorial-done');}catch(e){}}
function coachPaint(){
  const el=document.getElementById('coach');
  if(coachIx<0||coachIx>=COACH.length||G.phase==='menu'){el.classList.remove('show');return;}
  document.getElementById('coachStep').textContent='TUTORIAL · '+(coachIx+1)+' OF '+COACH.length;
  document.getElementById('coachText').innerHTML=COACH[coachIx].t();
  el.classList.add('show');
  const r=cv.getBoundingClientRect(), h=el.offsetHeight;
  el.style.top=(r.top>=h+16?r.top-h-8:r.top+54*r.height/H)+'px';
}
function coachAdvance(){
  if(coachIx<0)return;
  if(G.phase==='menu'||G.phase==='gameover'){coachIx=-1;coachPaint();return;}
  const was=coachIx;
  while(coachIx<COACH.length&&COACH[coachIx].done())coachIx++;
  if(coachIx>=COACH.length)coachEnd();else if(was!==coachIx)coachPaint();
}
document.getElementById('coachSkip').addEventListener('click',coachEnd);
addEventListener('resize',()=>{if(coachIx>=0)coachPaint();});
const _startRun=startRun;
startRun=function(mode){_startRun(mode);let seen=false;try{seen=localStorage.getItem('wd_tut')==='1';}catch(e){}if(!seen&&coachIx<0){coachIx=0;coachPaint();}};

if(window.ArcadeSDK)ArcadeSDK.init({
  pauseButton:'tr',
  onRestart(){startRun(G.mode||'math');},
  onExit(){G.phase='menu';coachIx=-1;coachPaint();closeGrown();},
  onTutorial:coachStart,
  onHint(){return currentHint();},
});
watchPhase();

/* ═══════════ debug hook (drives tools/playtest.py) ═══════════ */
window.__dungeon_debug={
  wipe(){try{localStorage.removeItem(MKEY);}catch(e){}meta=loadMeta();},
  start(mode){startRun(mode||'math');},
  state(){
    const p=G.player||{};
    const lock=G.locks.find(l=>l.kind==='door')||null;
    const chest=G.locks.find(l=>l.kind==='chest')||null;
    const anyLock=activeLock()||(G.boss&&G.boss.hp>0?G.boss:null);
    return{phase:G.phase,mode:G.mode,level:G.level,hp:G.hp,coins:G.coins,keys:G.keys,
      scrolls:G.scrolls,px:p.x||0,py:p.y||0,vy:p.vy||0,onG:!!p.onG,jumps:p.jumps||0,
      levelW:G.level_w,trapCount:G.trapCount,
      hintToast:G.hintToast,hintT:G.hintT,
      gate:{doorSolved:lock?lock.solved:null,chestSolved:chest?chest.solved:null,
            prompt:anyLock?anyLock.q.prompt:null,answer:anyLock?anyLock.q.answer:null,
            idx:anyLock?anyLock.idx:null,
            runes:anyLock?anyLock.runes.map(r=>({ch:r.ch,used:r.used})):null},
      boss:G.boss?{hp:G.boss.hp,prompt:G.boss.q?G.boss.q.prompt:null,
                   answer:G.boss.q?G.boss.q.answer:null,idx:G.boss.idx,
                   runes:G.boss.runes.map(r=>({ch:r.ch,used:r.used}))}:null,
      slimesAlive:G.slimes.filter(s=>!s.dead).length,
      coinsTaken:G.coinsArr.filter(c=>c.taken).length,
      coinsTotal:G.coinsArr.length,fps:G.fps,time:G.time};
  },
  meta(){return{...meta};},
  teleport(x,y){if(G.player){G.player.x=x;G.player.y=y;G.player.vy=0;}},
  pressRune(i){
    const owner=activeLock()||(G.boss&&G.boss.hp>0?G.boss:null);
    if(!owner||!owner.runes[i])return false;
    onRune(owner,owner.runes[i]);
    return true;
  },
  hurt(n){hurt(n||1);},
  slimePos(){const s=G.slimes.find(s=>!s.dead);return s?{x:s.x,y:s.y}:null;},
  coinPos(){const c=G.coinsArr.find(c=>!c.taken);return c?{x:c.x,y:c.y}:null;},
  goto(n){G.level=n;makeLevel(n);G.phase='play';},
  buy(what){buyItem(what);},
  nextLevel(){nextLevel();},
  useScroll(){onKeyPress('KeyH');}
};
