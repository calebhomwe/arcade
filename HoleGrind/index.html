<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../assets/arcade-sdk.js"></script>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/jsm/"}}</script>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<link rel="stylesheet" href="./gk.css">
<title>HOLE GRIND</title>
<style>
  :root{ --ink:#07132a; --gold:#ffd35c; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#3f6fa8;color:#fff;font-family:var(--gk-body);overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
  /* A canvas is a REPLACED element: with width:auto, `inset:0` does NOT stretch it --
     it keeps its 300x150 intrinsic size and the whole game renders into a postage
     stamp in the top-left. Explicit viewport units are required. */
  #game,#hudc{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
  #hudc{pointer-events:none;z-index:2}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
  #fx .pop{position:absolute;left:0;top:0;font:900 20px/1 var(--gk-body);color:#fff;letter-spacing:.01em;
    -webkit-text-stroke:3px rgba(7,19,42,.75);paint-order:stroke fill;text-shadow:0 3px 8px rgba(0,0,0,.4);white-space:nowrap;will-change:transform,opacity}
  #fx .pop.big{font-size:28px;color:var(--gold)}
  #fx .tag{position:absolute;left:0;top:0;font:900 13px/1 var(--gk-body);letter-spacing:.08em;padding:3px 9px;border-radius:8px;
    background:linear-gradient(180deg,rgba(40,78,134,.92),rgba(11,28,58,.95));color:#fff;white-space:nowrap;border:1.5px solid var(--gold2);text-shadow:0 1px 0 rgba(0,0,0,.6)}
  #fx .tag.you{color:#bfe0ff;border-color:#86c6ff}
  #loading{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;font:800 13px/1 var(--gk-body);letter-spacing:.3em;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.7)}
  .layer{display:none}
  .layer.on{display:flex}
  .codes-on{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(150px + env(safe-area-inset-top,0px));z-index:6;font:900 13px/1 var(--gk-body);letter-spacing:.14em;color:#3b2814;
    background:linear-gradient(#ffe38c,#f0b33a);border:2px solid #7a4a08;border-radius:8px;padding:5px 9px;pointer-events:none}
  .codes-on[hidden]{display:none}
  /* HUD: time, quota bar with three stars, score, size of the hole and what it can eat next */
  #hudd{display:none}
  #hudd.on{display:flex}
  #hudd .gk-score{text-align:left;margin:0;font-size:clamp(40px,12vw,56px)}
  :root{--gk-tt:176px}
  .gk-size{width:min(68%,260px);align-self:flex-start;padding:7px 12px 8px;border-radius:12px;pointer-events:none;font:800 15px/1.1 var(--gk-body);
    background:linear-gradient(180deg,rgba(40,78,134,.93),rgba(11,28,58,.95));border:2px solid var(--line);box-shadow:inset 0 0 0 1.5px rgba(240,179,58,.7),0 6px 12px rgba(0,0,0,.35)}
  .gk-size .l{display:flex;justify-content:space-between;gap:10px;align-items:baseline;text-shadow:0 1px 0 rgba(0,0,0,.6)}
  .gk-size .l b{font:900 22px/1 var(--gk-body);color:#9be566}
  .gk-size .l span{color:#d3def2;font-size:14px;text-align:right}
  .gk-size .pb{height:9px;margin-top:6px;border-radius:5px;background:#0a1730;border:1.5px solid var(--line);overflow:hidden}
  .gk-size .pb i{display:block;height:100%;width:0;background:linear-gradient(#c6f59a,var(--g2))}
  .gk-lv{gap:6px}
  .gk-lv .gk-mini{width:44px;margin:0}
  #coach{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:8;width:min(400px,calc(100vw - 28px));
    text-align:center;pointer-events:none;display:none;padding:12px 16px 12px;border-radius:16px;
    background:linear-gradient(180deg,rgba(40,78,134,.96),rgba(11,28,58,.97));border:2px solid var(--line);box-shadow:inset 0 0 0 1.5px rgba(240,179,58,.78),0 12px 24px rgba(0,0,0,.45)}
  #coach.on{display:block}
  #coach h2{margin:0 0 3px;font:900 13px/1 var(--gk-body);letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
  #coach .big{font:900 22px/1.1 var(--gk-body);letter-spacing:.04em;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.6)}
  #coach .sub{margin:6px 0 0;font:700 14px/1.3 var(--gk-body);color:#d3def2}
  #coach button{pointer-events:auto;margin-top:8px}
  .demo{position:relative;width:200px;height:56px;margin:8px auto 0}
  .demo .h{position:absolute;left:12px;top:10px;width:36px;height:36px;border-radius:50%;
    background:radial-gradient(#000 55%,#14203a);box-shadow:0 0 0 3px rgba(255,211,92,.9);animation:hgSteer 2.6s ease-in-out infinite}
  .demo .c{position:absolute;top:22px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c8,#f0b33a);animation:hgGulp 2.6s linear infinite}
  .demo .c1{left:80px}.demo .c2{left:120px;animation-delay:.35s}.demo .c3{left:160px;animation-delay:.7s}
  @keyframes hgSteer{0%{left:12px}80%,100%{left:156px}}
  @keyframes hgGulp{0%,20%{opacity:1;transform:scale(1)}40%,100%{opacity:0;transform:scale(.2)}}
  /* hub */
  #hub .gk-pick .mid{min-width:190px}
  #hub .gk-pick .lv{font-size:clamp(28px,8.5vw,36px)}
  #hub .info{font:800 13px/1.2 var(--gk-body);color:#e8eefb;text-shadow:0 2px 3px rgba(0,0,0,.8);letter-spacing:.04em}
  #hub .info.lock{color:#ffd35c}
  html body #arcade-sdk-btn{position:fixed;width:44px;height:44px;border-radius:12px;background:linear-gradient(180deg,rgba(40,78,134,.95),rgba(11,28,58,.97));
    border:2px solid #050d1f;box-shadow:inset 0 0 0 1.5px rgba(240,179,58,.78);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;min-height:0}
  @media (prefers-reduced-motion:reduce){ .demo .h,.demo .c{animation:none} }
</style>
</head>
<body class="gk">
<canvas id="game"></canvas>
<canvas id="hudc"></canvas>
<div id="fx"></div>
<div id="loading">LOADING THE CITY…</div>
<div class="codes-on" id="codesOn" hidden>CODES ON · NOT SAVED</div>

<div class="gk-hud" id="hudd">
  <div class="gk-row">
    <span class="gk-chip" id="timeChip"></span>
    <div id="qbar" style="flex:1;min-width:0"></div>
    <span style="width:50px;flex:none"></span>
  </div>
  <div class="gk-row" style="justify-content:flex-start;gap:10px">
    <div class="gk-score gk-out" id="scoreBig">0</div>
    <span class="gk-chip dim" id="rivChip"></span>
  </div>
  <div class="gk-size" id="sizeP"><div class="l"><b id="sizeV">9.0</b><span id="nextT"></span></div><div class="pb"><i id="sizeBar"></i></div></div>
</div>

<div id="coach" role="status" aria-live="polite">
  <h2 id="coachKick">FIRST DROP</h2>
  <div class="big" id="coachBig">STEER THE HOLE</div>
  <div class="demo" id="coachDemo" aria-hidden="true"><i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="h"></i></div>
  <div class="sub" id="coachText"></div>
  <button class="gk-btn xs dark" id="coachSkip">SKIP</button>
</div>

<div class="gk-screen layer on" id="hub">
  <div class="gk-tb"><span class="gk-chip" id="coinChip"></span><span class="gk-chip gk-lv" id="lvChip"></span></div>
  <h1 class="gk-logo">Hole<span class="l2">Grind</span></h1>
  <div id="districts" class="gk-pick"></div>
  <div class="gk-goals row" id="dgoals"></div>
  <button class="gk-btn green wide throb" id="btnPlay" type="button">DROP IN</button>
  <div class="gk-menu"><button class="gk-btn sm dark" id="btnUp" type="button"></button><button class="gk-btn sm dark" id="btnSkins" type="button"></button></div>
  <div id="dailyHost"></div>
  <div class="gk-menu"><button class="gk-btn xs dark" id="btnGfx" type="button" aria-label="Graphics quality">GRAPHICS: HIGH</button><button class="gk-btn xs dark" id="btnWipe" type="button">WIPE SAVE</button></div>
</div>

<div class="gk-screen dim layer" id="over">
  <div class="gk-card">
    <div class="gk-head" id="ovHead"><h2 id="ovTitle">RUN OVER</h2></div>
    <div class="gk-stars" id="ovStars"></div>
    <div><div class="gk-big gk-out" id="ovScore">0</div><div class="gk-cap">Score <span class="gk-newbest gk-hidden" id="ovNew">NEW BEST</span></div></div>
    <div class="gk-stat" id="ovStats"></div>
    <div class="gk-goals card" id="ovGoals"></div>
    <div id="ovProg" class="gk-note"></div>
    <button class="gk-btn green wide" id="btnAgain" type="button"></button>
    <div class="gk-menu"><button class="gk-btn sm dark" id="btnHub" type="button"></button></div>
  </div>
</div>

<div class="gk-screen dim layer" id="pause">
  <div class="gk-card">
    <div class="gk-head"><h2>PAUSED</h2></div>
    <p>Nothing is uploading anywhere. Take your time.</p>
    <button class="gk-btn green wide" id="btnResume" type="button">RESUME</button>
    <button class="gk-btn sm dark" id="btnQuit" type="button">ABANDON RUN</button>
  </div>
</div>

<script type="module">
/* ------------------------------------------------------------------ *
 * HOLE GRIND: hole.io-style absorb-and-grow grinder, in 3D.
 * The simulation runs on a flat 2400 x 2400 "px" map (1 px = 10 cm); hole3d.js draws it as a
 * toon-shaded Kenney city (three.js, vendored). Meta-progression in localStorage.
 * ------------------------------------------------------------------ */
import { HoleWorld, REDUCED } from './hole3d.js';
import * as THREE from 'three';
import { GK } from './gk.js';

//// ---------- tuning ----------
const BASE_R      = 9;      // starting hole radius (px, world space)
const GROW        = 1.15;   // r = sqrt(BASE^2 + mass*GROW)  -> area-linear growth
const BASE_SPEED  = 250;    // px/s (3D camera sits closer than the old top-down view, so it is slower)
const RUN_TIME    = 90;     // seconds before upgrades
const ARENA       = 2400;   // square world side
const EAT_RATIO   = 1.00;   // obj is edible when obj.r < hole.r * EAT_RATIO
const M           = 0.1;    // metres per px
const BLOCK = 400, ROAD = 80, WALK = 25;   // city grid: a road every 40 m, 8 m wide, 2.5 m sidewalks

// prop tiers: name, radius, mass, colour, and the Kenney models that stand in for it
const TIERS = [
  {n:"coin",   r:5,  m:2,    c:"#ffd75e", mods:["coin"]},
  {n:"cone",   r:8,  m:6,    c:"#ff8b3d", mods:["cone","cone2","cone"]},
  {n:"bench",  r:12, m:18,   c:"#a97b4f", mods:["bench","planter","bench","lamp"]},
  {n:"tree",   r:18, m:45,   c:"#4ea86a", mods:["treeOak","treeDef","treeDet","treeS","treeL","pineR","treeOakD"]},
  {n:"car",    r:26, m:120,  c:"#e05a63", mods:["sedan","taxi","suv","hatch","police","van"]},
  {n:"truck",  r:38, m:320,  c:"#4a90e2", mods:["delivery","truck","ambulance","firetruck","garbage"]},
  {n:"house",  r:55, m:850,  c:"#c9c4b4", mods:["houseA","houseB","houseC","houseD","houseF","houseH","houseK","houseM"]},
  {n:"tower",  r:80, m:2200, c:"#8e96ad", mods:["towerA","towerC","towerE","towerG","skyA","skyB","skyC","skyE"]},
];

// district look: ground palette and sky (golden hour, natural colours; the ground textures are CC0 ambientCG, tinted per district)
const DISTRICTS = [
  {n:"SUBURB",    cost:0,     rivals:1, dens:1.00, top:5, mult:1.00, tint:"#1b2a1f", tag:"Quiet streets, big lawns",
   look:{lawn:"#9cc26f", lawn2:"#8db462", walk:"#ddd0b6", road:"#67635f", line:"#f4ead0", lot:"#a9c982", sky:["#3f6fa8","#f3c58e"], glow:"#ffb464", hemi:0.85, sun:3.0, tint:0.55}},
  {n:"DOWNTOWN",  cost:900,   rivals:2, dens:1.15, top:6, mult:1.35, tint:"#1b2130", tag:"Traffic and tall glass",
   look:{lawn:"#cdbf9f", lawn2:"#c2b491", walk:"#e6d9bf", road:"#575a63", line:"#ffd97a", lot:"#d8ccb0", sky:["#4a6fa0","#f0cfa8"], glow:"#ffbe78", hemi:0.85, sun:3.0, tint:0.5}},
  {n:"HARBOUR",   cost:4500,  rivals:3, dens:1.25, top:7, mult:1.75, tint:"#152730", tag:"Docks, trucks and salt air",
   look:{lawn:"#b3bfb2", lawn2:"#a7b3a6", walk:"#d9d3c0", road:"#5a636d", line:"#f4ead0", lot:"#bfcabd", sky:["#2f7fb0","#d8ecf0"], glow:"#fff0b8", hemi:0.9, sun:2.8, tint:0.5}},
  {n:"SKYLINE",   cost:18000, rivals:4, dens:1.35, top:8, mult:2.30, tint:"#251c2e", tag:"Rooftop dusk, rival hunters",
   look:{lawn:"#a49aa8", lawn2:"#998fa0", walk:"#cfc4cf", road:"#4a4858", line:"#ffcf80", lot:"#b0a6b6", sky:["#2a2f6a","#f0a070"], glow:"#ff9a5a", hemi:0.8, sun:2.9, tint:0.55}},
  {n:"THE VOID",  cost:60000, rivals:5, dens:1.50, top:8, mult:3.20, tint:"#241a1a", tag:"No rules. Everything bites.",
   look:{lawn:"#5b4f78", lawn2:"#54486f", walk:"#8a7fa6", road:"#2b273a", line:"#c69bff", lot:"#665a84", sky:["#150f36","#6a3a8a"], glow:"#c08aff", hemi:0.75, sun:2.2, tint:0.7}},
];
const STAR_AT = [0.5, 1.0, 1.8];   // a district run earns a star at half the quota, at the quota (cleared) and at 1.8x

const UPGRADES = [
  {id:"size", ic:"ball",  t:"WIDE MOUTH",  max:10, cost:i=>120*Math.pow(1.55,i),
   d:"Start each run bigger.",            f:i=>`+${(i*7)}% start radius`},
  {id:"speed", ic:"bolt", t:"SLIPSTREAM",  max:10, cost:i=>140*Math.pow(1.55,i),
   d:"Move faster across the map.",       f:i=>`+${(i*6)}% speed`},
  {id:"time", ic:"clock",  t:"OVERTIME",    max:10, cost:i=>200*Math.pow(1.6,i),
   d:"Longer runs, more to swallow.",     f:i=>`+${i*6}s run time`},
  {id:"pull", ic:"magnet",  t:"GRAVITY WELL",max:8,  cost:i=>180*Math.pow(1.6,i),
   d:"Drags nearby edible props in.",     f:i=>`+${i*12}% pull range`},
  {id:"greed", ic:"coin", t:"GREED",       max:10, cost:i=>250*Math.pow(1.65,i),
   d:"More coins banked per run.",        f:i=>`+${i*18}% coins`},
  {id:"digest", ic:"heart",t:"DIGESTION",   max:8,  cost:i=>300*Math.pow(1.7,i),
   d:"Each prop feeds you more mass.",    f:i=>`+${i*5}% mass gain`},
];
const RIVAL_NAMES = ["VORTEX","GULP","MAW","ABYSS","CHOMPY","SINKHOLE","NOMAD","PIT"];

//// ---------- save ----------
const SAVE_KEY = "holegrind.save.v2";
const FRESH = () => ({
  coins:0, xp:0, best:0, runs:0, totalScore:0,
  up:{size:0,speed:0,time:0,pull:0,greed:0,digest:0},
  unlocked:[0], district:0, cleared:[], stars:{}
});
let save = FRESH();

//// ---------- arcade wiring, codes, graphics quality, reduced motion ----------
const SDK = window.ArcadeSDK || null;
const sdk = (fn,a)=>{ try{ if(SDK) SDK[fn](a); }catch(e){} };
const sfx = n=>{ try{ if(SDK && SDK.sfx) SDK.sfx(n); }catch(e){} };
const cheated = ()=>!!(SDK && SDK.cheated);
const RM = {matches: REDUCED};
const COARSE = window.matchMedia ? matchMedia("(pointer: coarse)").matches : false;
// Codes turn the session into a sandbox: nothing is written to the real save until a reload.
const CHEAT = {ghost:false, big:false};
let GFX = "high";
try{ const g=localStorage.getItem("holegrind.gfx"); GFX = g==="low" ? "low" : g==="high" ? "high" : "auto"; }catch(e){ GFX="auto"; }
let tut = 0;   // first-run coach: 0 off, 1 steer, 2 grow tip
let tutEaten = 0, tutMoved = 0, coachT = null;

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const o = JSON.parse(raw);
      save = Object.assign(FRESH(), o);
      save.up = Object.assign(FRESH().up, o.up||{});
      if(!Array.isArray(save.unlocked)||!save.unlocked.length) save.unlocked=[0];
      if(!Array.isArray(save.cleared)) save.cleared=[];
      if(!save.stars || typeof save.stars!=='object') save.stars={};
    }
  }catch(e){ save = FRESH(); }
}
function persist(){
  if(cheated()) return;   // a codes-on session never overwrites the real save
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){}
}
const playerLevel = () => 1 + Math.floor(Math.sqrt(save.xp/900));
const xpInto  = () => save.xp - 900*Math.pow(playerLevel()-1,2);
const xpNeed  = () => 900*(Math.pow(playerLevel(),2)-Math.pow(playerLevel()-1,2));

//// ---------- progression on top of the save: hole styles, daily goal, stars ----------
const SKINS = [
  { id:'azure',  name:'Azure',   css:'radial-gradient(circle,#050a14 46%,#a9d6ff 50%,#4a94e8 62%,#050a14 64%)', color:'#7fb8ff', cost:0 },
  { id:'amber',  name:'Amber',   css:'radial-gradient(circle,#140e02 46%,#fff2a8 50%,#f0a81c 62%,#140e02 64%)', color:'#f2b544', cost:{ stars:3 } },
  { id:'jade',   name:'Jade',    css:'radial-gradient(circle,#04140c 46%,#a6f0c8 50%,#2fae72 62%,#04140c 64%)', color:'#48c78e', cost:{ coins:400 } },
  { id:'ruby',   name:'Ruby',    css:'radial-gradient(circle,#160406 46%,#ffb0b0 50%,#d8384a 62%,#160406 64%)', color:'#e5533f', cost:{ coins:900 } },
  { id:'violet', name:'Violet',  css:'radial-gradient(circle,#0a0716 46%,#d3b8ff 50%,#7444e8 62%,#0a0716 64%)', color:'#a78bfa', cost:{ stars:8 } },
  { id:'ghost',  name:'Ghost',   css:'radial-gradient(circle,#0b0d12 46%,#ffffff 50%,#b8c0d0 62%,#0b0d12 64%)', color:'#e8ecf4', cost:{ coins:2500 } },
  { id:'rainbow',name:'Rainbow', css:'radial-gradient(circle,#0a0716 46%,transparent 50%),conic-gradient(#ff5a6e,#ffd23f,#5cec8c,#3fa8ff,#b48bff,#ff5a6e)', color:'#ff7ad0', rainbow:true, cost:{ streak:3 } },
  { id:'ember',  name:'Ember',   css:'radial-gradient(circle,#160a04 46%,#ffd08a 50%,#ff7a1a 62%,#160a04 64%)', color:'#fb923c', pulse:true, cost:{ stars:12 } },
  { id:'crown',  name:'Crown',   css:'radial-gradient(circle,#140e02 46%,#fff6c8 50%,#ffc94a 62%,#140e02 64%)', color:'#ffd35c', cost:{ stars:15 } },
];
const PROG = GK.progress('holegrind', {
  perWorld: 1, worlds: [{name:'District'}], skins: SKINS, dailyReward: 150,
  daily: [
    { id:'score', icon:'trophy', text:n=>'Score '+n+' points in total', targets:[6000, 15000, 30000] },
    { id:'eat',   icon:'gem',    text:n=>'Swallow '+n+' things',         targets:[120, 220, 360] },
    { id:'runs',  icon:'flag',   text:n=>'Finish '+n+' runs',            targets:[2, 3, 4] },
    { id:'cars',  icon:'bolt',   text:n=>'Swallow '+n+' cars or trucks', targets:[8, 14, 22] },
  ],
});
GK.hooks.sfx = n => { try{ sfx(n==='levelup'?'levelup':n==='coin'?'coin':n==='buzz'?'error':'tap'); }catch(e){} };
let skinNow = SKINS[0];
function applySkin(){ skinNow = PROG.current() || SKINS[0]; }
function starsTotal(){ let n=0; for(const k in save.stars) n += save.stars[k]|0; return n; }
function starsFor(quotaFrac){ let n=0; for(const f of STAR_AT) if(quotaFrac>=f) n++; return n; }

//// ---------- 3D stage + HUD canvas ----------
const cv = document.getElementById("game");
const W3 = new HoleWorld(cv, {quality:GFX});
GFX = W3.quality;   // "auto" starts on Low when WebGL runs on the CPU
const hudCv = document.getElementById("hudc"), ctx = hudCv.getContext("2d");
let VW=1280, VH=720, DPR=1, ready=false, SAB=0;
try{ const pr=document.createElement('div'); pr.style.cssText='position:fixed;bottom:0;height:env(safe-area-inset-bottom,0px);visibility:hidden'; document.body.appendChild(pr); SAB=pr.offsetHeight||0; pr.remove(); }catch(e){}
function resize(){
  DPR = GFX==="low" ? 1 : Math.min(2, window.devicePixelRatio||1);
  VW = hudCv.clientWidth || window.innerWidth;
  VH = hudCv.clientHeight|| window.innerHeight;
  hudCv.width = Math.round(VW*DPR); hudCv.height = Math.round(VH*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  W3.resize();
}
addEventListener("resize", resize);

//// ---------- input ----------
const keys = Object.create(null);
let mouseDown=false, mouseX=0, mouseY=0;
addEventListener("keydown", e=>{
  keys[e.code]=true;
  // with the arcade SDK, P and Esc open its pause menu instead (it catches them first)
  if(e.code==="Escape" && !SDK){ togglePause(); }
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
});
addEventListener("keyup", e=>{ keys[e.code]=false; });
cv.addEventListener("mousedown", e=>{mouseDown=true;mouseX=e.clientX;mouseY=e.clientY;});
addEventListener("mouseup",   ()=>{mouseDown=false;});
addEventListener("mousemove", e=>{mouseX=e.clientX;mouseY=e.clientY;});
cv.addEventListener("touchstart", e=>{mouseDown=true;const t=e.touches[0];mouseX=t.clientX;mouseY=t.clientY;e.preventDefault();},{passive:false});
cv.addEventListener("touchmove",  e=>{const t=e.touches[0];mouseX=t.clientX;mouseY=t.clientY;e.preventDefault();},{passive:false});
addEventListener("touchend",  ()=>{mouseDown=false;});
addEventListener("blur", ()=>{ for(const k in keys) keys[k]=false; mouseDown=false; });

//// ---------- run state ----------
const R = {
  on:false, paused:false, over:false, demo:false, t:0, timeLeft:0, district:0,
  hole:null, props:[], rivals:[], score:0, eaten:0,
  wave:0, endReason:"", cam:{x:0,y:0,z:1}, shake:0, autopilot:false, apTarget:null,
  lots:[], pulse:0, squash:0, tierSeen:0
};
const rnd  = (a,b)=>a+Math.random()*(b-a);
const clamp= (v,a,b)=>v<a?a:v>b?b:v;
const pick = a=>a[(Math.random()*a.length)|0];
const radiusFor = m => Math.sqrt(BASE_R*BASE_R + m*GROW);

function upLvl(id){ return save.up[id]|0; }
function startMass(){ // mass equivalent of the size upgrade
  const r = BASE_R*(1+upLvl("size")*0.07)*(CHEAT.big?3:1);
  return Math.max(0,(r*r-BASE_R*BASE_R)/GROW);
}
function moveSpeed(h){
  // Big holes MUST slow down hard. Sweep area grows with r while prey mass grows with
  // r^2, so without this the run goes cubic and one 90s run banks a whole district.
  const slow = 1/(1+Math.max(0,h.r-BASE_R)*0.030);
  return BASE_SPEED*(1+upLvl("speed")*0.06)*slow*(1+(playerLevel()-1)*0.01);
}
function pullRange(h){ return h.r*(2.20 + upLvl("pull")*0.22) + 26; }
function massGain(){ return 1 + upLvl("digest")*0.05; }

function makeHole(x,y,mass,isPlayer){
  return {x,y,mass,r:radiusFor(mass),isPlayer,vx:0,vy:0,
          hue:isPlayer?0:Math.floor(rnd(0,360)),dead:false,tx:0,ty:0,think:0};
}

//// ---------- city layout: blocks, lots, roads ----------
// Every 400 px there is a road; each block between roads has a sidewalk ring and 2 x 2 lots.
const NB = ARENA/BLOCK;
function makeLots(){
  const L=[]; const inner = BLOCK-ROAD-WALK*2, half = inner/2;
  for(let bx=0;bx<NB;bx++) for(let by=0;by<NB;by++){
    const x0 = bx*BLOCK+ROAD/2+WALK, y0 = by*BLOCK+ROAD/2+WALK;
    for(let i=0;i<2;i++) for(let j=0;j<2;j++)
      L.push({x:x0+half*(i+0.5), y:y0+half*(j+0.5), half:half/2, by:null});
  }
  return L;
}
function lotAt(x,y){
  for(const l of R.lots) if(Math.abs(x-l.x)<l.half && Math.abs(y-l.y)<l.half) return l;
  return null;
}
function lotBusy(l){ return l.by && !l.by.gone; }
function roadSpot(pad){
  // a point on a road lane, facing along it
  const horiz = Math.random()<0.5, line = 1+((Math.random()*(NB-1))|0);
  const along = rnd(pad, ARENA-pad), lane = (Math.random()<0.5?-1:1)*ROAD*0.24;
  return horiz ? {x:along, y:line*BLOCK+lane, rot: lane>0?0:Math.PI, axis:0, dir:lane>0?1:-1}
               : {x:line*BLOCK+lane, y:along, rot: lane>0?-Math.PI/2:Math.PI/2, axis:1, dir:lane>0?-1:1};
}
function walkSpot(){
  // a point on a sidewalk ring, inside a block
  const bx=(Math.random()*NB)|0, by=(Math.random()*NB)|0;
  const x0=bx*BLOCK+ROAD/2, y0=by*BLOCK+ROAD/2, inner=BLOCK-ROAD, s=rnd(0,inner), k=WALK*0.5;
  switch((Math.random()*4)|0){
    case 0: return {x:x0+s, y:y0+k, rot:0};
    case 1: return {x:x0+s, y:y0+inner-k, rot:Math.PI};
    case 2: return {x:x0+k, y:y0+s, rot:Math.PI/2};
    default:return {x:x0+inner-k, y:y0+s, rot:-Math.PI/2};
  }
}
function lotSpot(pad){
  // somewhere inside a lot that has no building on it
  for(let tries=0;tries<12;tries++){
    const l = pick(R.lots); if(lotBusy(l)) continue;
    return {x:l.x+rnd(-l.half+pad,l.half-pad), y:l.y+rnd(-l.half+pad,l.half-pad), rot:rnd(0,6.283)};
  }
  return walkSpot();
}
function buildingLot(){
  // a free lot, preferring one with nothing bigger than a bench on it
  let fallback=null;
  for(let tries=0;tries<40;tries++){
    const l = pick(R.lots); if(lotBusy(l)) continue;
    let clutter=false;
    for(const p of R.props){ if(!p.gone && p.tier>=3 && Math.abs(p.x-l.x)<l.half && Math.abs(p.y-l.y)<l.half){ clutter=true; break; } }
    if(!clutter) return l;
    fallback = fallback || l;
  }
  return fallback;
}

function spawnProp(d, forceTier){
  const D = DISTRICTS[d];
  let ti;
  if(forceTier!=null) ti = forceTier;
  else{
    // weighted toward small; district raises the ceiling
    const top = D.top;
    ti = Math.min(top-1, Math.floor(Math.pow(Math.random(), 1.9)*top));
  }
  const T = TIERS[ti];
  const pad = T.r+20;
  let s, lot=null;
  if(ti>=6){ lot = buildingLot(); s = lot ? {x:lot.x, y:lot.y, rot:((Math.random()*4)|0)*Math.PI/2} : lotSpot(0); }
  else if(ti>=4) s = roadSpot(pad);
  else if(ti===3) s = Math.random()<0.6 ? walkSpot() : lotSpot(T.r);
  else if(ti===0) s = Math.random()<0.5 ? roadSpot(pad) : lotSpot(T.r);
  else s = Math.random()<0.55 ? walkSpot() : lotSpot(T.r);
  const p = {x:clamp(s.x,pad,ARENA-pad), y:clamp(s.y,pad,ARENA-pad), tier:ti, r:T.r, m:T.m,
          c:T.c, rot:s.rot, fall:0, gone:false, mod:pick(T.mods), drop:0, spd:0, axis:s.axis|0, dir:s.dir||0, wob:rnd(0,6.28)};
  if(lot) lot.by = p;
  if(ti===4||ti===5) p.spd = rnd(18,34)*(Math.random()<0.25?0:1);   // cars drive along their lane; some are parked
  return p;
}

function beginRun(d, forceTut){
  R.demo = false;
  startSim(d);
  showLayer(null);
  coachHide();
  let seen=false; try{ seen=!!localStorage.getItem("holegrind.tut"); }catch(e){}
  if(forceTut===true || !seen) coachShow();
  hudTags();
  sdk("state",{scene:"play"});
  sfx("go");
}
function startSim(d){
  R.district = clamp(d,0,DISTRICTS.length-1);
  const D = DISTRICTS[R.district];
  R.on=true; R.paused=false; R.over=false; R.t=0; R.wave=0;
  R.timeLeft = RUN_TIME + upLvl("time")*6;
  R.score=0; R.eaten=0; R.carsEaten=0; R.endReason=""; hudReset(); R.apTarget=null; R.pulse=0; R.squash=0;
  R.hole = makeHole(ARENA/2, ARENA/2, R.demo?0:startMass(), true);
  R.tierSeen = tierIndexFor(R.hole.r);
  R.lots = makeLots();
  R.props.length=0;
  const n = Math.round(760*D.dens);
  for(let i=0;i<n;i++) R.props.push(spawnProp(R.district));
  R.rivals.length=0;
  for(let i=0;i<D.rivals;i++){
    const a = (i/D.rivals)*Math.PI*2 + rnd(0,1);
    const rv = makeHole(ARENA/2+Math.cos(a)*700, ARENA/2+Math.sin(a)*700, startMass()*0.75, false);
    rv.name = RIVAL_NAMES[(i+R.district*2)%RIVAL_NAMES.length];
    R.rivals.push(rv);
  }
  R.cam.x=R.hole.x; R.cam.y=R.hole.y; R.cam.z=zoomFor(R.hole.r);
  if(ready) dressCity();
  labels();
}
// the hub runs a quiet demo round behind the menu: an autopilot hole in the chosen district
function startDemo(){
  R.demo = true; R.autopilot = true;
  startSim(save.unlocked.includes(save.district)?save.district:0);
}

function zoomFor(r){ return clamp(30/(r*0.55+19), 0.40, 1.30); }
function tierIndexFor(r){ let i=0; for(let k=0;k<TIERS.length;k++) if(TIERS[k].r<r*EAT_RATIO) i=k; return i; }

function endRun(reason){
  if(R.over) return;
  if(R.demo){ startDemo(); return; }
  R.over=true; R.on=false; R.endReason=reason;
  coachHide();
  const D = DISTRICTS[R.district];
  const coins = Math.floor(R.score*0.075*D.mult*(1+upLvl("greed")*0.18));
  const xp    = Math.floor(R.score*0.25*D.mult);
  save.coins += coins; save.xp += xp; save.runs++; save.totalScore += R.score;
  const pb = !cheated() && R.score > save.best; if(pb) save.best = R.score;
  // clearing = beating the district quota unlocks the next one for purchase view
  const quota = districtQuota(R.district);
  const clr = R.score >= quota;
  if(clr && !save.cleared.includes(R.district)) save.cleared.push(R.district);
  persist();
  showOver({coins,xp,pb,clr,quota});
  sfx(reason==="swallowed" ? "lose" : (clr||pb) ? "win" : "reward");
  sdk("state",{scene:"over",score:R.score});
}
function districtQuota(d){ return Math.round(25000*Math.pow(2.8,d)); }

//// ---------- simulation ----------
function absorb(h, mass, isPlayerGain){
  h.mass += mass*(h.isPlayer?massGain():1);
  h.r = radiusFor(h.mass);
}
let sfxT = 0;
function swallowFx(h, p){
  const x=p.x*M, z=p.y*M;
  W3.burst(x, 0.3, z, p.c, Math.min(GFX==="low"?5:12, 3+p.tier*2), 4+p.tier*1.2, 0.18+p.tier*0.06);
  if(h.isPlayer && !R.demo){
    R.pulse = 1; R.squash = Math.min(1, R.squash + 0.3 + p.tier*0.1);
    floater("+"+Math.round(p.m*4*DISTRICTS[R.district].mult), x, z, p.tier>=4);
    if(sfxT<=0){ sfx(p.tier===0?"coin":p.tier>=6?"explode":p.tier>=4?"hit":"pop"); sfxT = 0.07; }
  }
}

function steerHole(h, dt, tx, ty, spd){
  const dx=tx-h.x, dy=ty-h.y, d=Math.hypot(dx,dy);
  if(d>1){ h.vx = dx/d*spd; h.vy = dy/d*spd; } else { h.vx*=0.6; h.vy*=0.6; }
  h.x = clamp(h.x + h.vx*dt, h.r, ARENA-h.r);
  h.y = clamp(h.y + h.vy*dt, h.r, ARENA-h.r);
}

function eatPass(h, dt){
  const pr = h.isPlayer ? pullRange(h) : h.r*1.15;
  for(let i=0;i<R.props.length;i++){
    const p=R.props[i];
    if(p.gone) continue;
    const dx=h.x-p.x, dy=h.y-p.y, d=Math.hypot(dx,dy);
    const edible = p.r < h.r*EAT_RATIO;
    if(!edible){
      // too big: it wobbles on the rim (drawn), nothing else
      if(h.isPlayer && d < h.r + p.r) p.shiver = 0.25;
      continue;
    }
    if(p.fall>0){
      if(p.eater!==h) continue;
      p.fall += dt*3.2;
      p.x += dx*dt*6; p.y += dy*dt*6;
      if(p.fall>=1){
        p.gone=true;
        absorb(h,p.m);
        if(h.isPlayer){
          if(!R.demo){ R.score += Math.round(p.m*4*DISTRICTS[R.district].mult); R.eaten++; if(p.tier===4||p.tier===5) R.carsEaten++; }
          swallowFx(h,p);
          if(!RM.matches && !R.demo) R.shake = Math.min(9, R.shake + 0.6 + p.tier*0.35);   // reduced motion: no shake
          if(tut===1 && ++tutEaten>=3) coachGrow();
        }
      }
      continue;
    }
    if(d < h.r*0.95 + p.r*0.20){ p.fall = 0.01; p.eater = h; continue; }
    if(h.isPlayer && d < pr){ // gravity well drag
      const f = (1 - d/pr) * 260 * dt;
      p.x += dx/d*f; p.y += dy/d*f;
    }
  }
}

function rivalThink(h, dt){
  h.think -= dt;
  if(h.think<=0 || (Math.abs(h.tx-h.x)<12 && Math.abs(h.ty-h.y)<12)){
    h.think = rnd(0.4,1.1);
    // hunt the player when clearly bigger, else nearest edible cluster
    const P=R.hole;
    if(P && !P.dead && !R.demo && h.r > P.r*1.08 && Math.hypot(P.x-h.x,P.y-h.y) < 900){
      h.tx=P.x; h.ty=P.y;
    }else{
      let best=null,bd=1e9;
      for(let i=0;i<R.props.length;i+=3){
        const p=R.props[i];
        if(p.gone||p.r>=h.r) continue;
        const d=Math.hypot(p.x-h.x,p.y-h.y)/(1+p.m*0.02);
        if(d<bd){bd=d;best=p;}
      }
      if(best){h.tx=best.x;h.ty=best.y;}
      else{h.tx=rnd(0,ARENA);h.ty=rnd(0,ARENA);}
    }
  }
  steerHole(h, dt, h.tx, h.ty, BASE_SPEED*0.86*(1/(1+Math.max(0,h.r-BASE_R)*0.030)));
  eatPass(h, dt);
}

// Rival size is GOVERNED, not free-running. Letting rivals eat their way up on their
// own made them 60% bigger than the player inside 8s in every district, so every run
// degenerated into being hunted from second one. Instead each rival converges on a
// fixed fraction of the player's mass: SUBURB rivals stay harmless so the mechanic can
// be learned, and later districts push the fraction past 1.0 so they genuinely hunt.
function rivalScale(dt){
  for(let i=0;i<R.rivals.length;i++){
    const rv=R.rivals[i];
    const want = Math.max(0, R.hole.mass*(R.demo?0.6:(0.72 + R.district*0.14 + i*0.05)));
    // clamp DOWN hard, converge UP smoothly -- a rival that swallowed a bus used to
    // spike 25% over its cap for a second and eat the player in the tutorial district.
    if(rv.mass > want) rv.mass = want;
    else rv.mass += (want-rv.mass)*Math.min(1, dt*0.6);
    if(rv.mass<0) rv.mass=0;
    rv.r = radiusFor(rv.mass);
  }
}

function holeVsHole(dt){
  const all=[R.hole].concat(R.rivals).filter(h=>h&&!h.dead);
  for(let i=0;i<all.length;i++) for(let j=i+1;j<all.length;j++){
    const a=all[i], b=all[j];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    const big = a.r>=b.r?a:b, small = a.r>=b.r?b:a;
    if(big.r > small.r*1.05 && d < big.r*0.85){
      if(small.isPlayer && (CHEAT.ghost || R.demo)) continue;   // GHOSTHOLE: rivals slide right over you
      small.dead=true;
      absorb(big, small.mass*0.7);
      W3.burst(small.x*M, 0.4, small.y*M, "#ffffff", 22, 8, 0.3);
      if(small.isPlayer){ endRun("swallowed"); }
      else if(big.isPlayer){
        R.score += Math.round(small.mass*6*DISTRICTS[R.district].mult);
        if(!RM.matches) R.shake = 10; toast("RIVAL SWALLOWED"); sfx("explode");
        floater("+"+Math.round(small.mass*6*DISTRICTS[R.district].mult), small.x*M, small.y*M, true);
      }
    }
  }
  R.rivals = R.rivals.filter(h=>!h.dead);
  labels();
}

function playerInput(){
  if(R.demo) return autoTarget();
  let ix=0, iy=0;
  if(keys.KeyA||keys.ArrowLeft) ix-=1;
  if(keys.KeyD||keys.ArrowRight)ix+=1;
  if(keys.KeyW||keys.ArrowUp)   iy-=1;
  if(keys.KeyS||keys.ArrowDown) iy+=1;
  if(ix||iy){
    const l=Math.hypot(ix,iy);
    return {x:R.hole.x+ix/l*400, y:R.hole.y+iy/l*400};
  }
  if(mouseDown){
    // steer toward the ground point under the pointer
    const g = W3.pick(mouseX, mouseY);
    if(g) return {x:g.x/M, y:g.z/M};
  }
  if(R.autopilot) return autoTarget();
  return null;
}
function autoTarget(){
  // COMMIT to one target until it is swallowed or becomes invalid. Re-picking the
  // nearest prop every frame makes the hole orbit a moving centroid and eat almost
  // nothing -- that bug made the autopilot look like the game was broken.
  let best = R.apTarget;
  const stale = !best || best.gone || best.r >= R.hole.r*EAT_RATIO ||
                Math.hypot(best.x-R.hole.x, best.y-R.hole.y) > 900;
  if(stale){
    best=null; let bd=1e9;
    for(const p of R.props){
      if(p.gone||p.r>=R.hole.r*EAT_RATIO) continue;
      const d=Math.hypot(p.x-R.hole.x,p.y-R.hole.y)/(1+p.m*0.05);
      if(d<bd){bd=d;best=p;}
    }
    R.apTarget = best;
  }
  // dodge anything clearly bigger than us
  for(const rv of R.rivals){
    const d=Math.hypot(rv.x-R.hole.x,rv.y-R.hole.y);
    if(rv.r>R.hole.r*1.12 && d < rv.r*3.5+70){
      const ax=(R.hole.x-rv.x)/(d||1), ay=(R.hole.y-rv.y)/(d||1);
      return {x:clamp(R.hole.x+ax*500,120,ARENA-120), y:clamp(R.hole.y+ay*500,120,ARENA-120)};
    }
  }
  if(best) return {x:best.x,y:best.y};
  return null;
}

function step(dt){
  sfxT -= dt;
  if(!R.on || R.paused || R.over) return;
  R.t += dt;
  if(tut!==1 && !R.demo) R.timeLeft -= dt;   // the clock waits while the first-run card teaches steering
  if(R.demo && R.t>70) { startDemo(); return; }
  if(R.timeLeft<=0){ R.timeLeft=0; endRun("time"); return; }

  const h=R.hole;
  const tgt = playerInput();
  if(tgt) steerHole(h, dt, tgt.x, tgt.y, moveSpeed(h)*(R.demo?0.7:1));
  else { h.vx*=0.85; h.vy*=0.85; h.x+=h.vx*dt; h.y+=h.vy*dt; }
  eatPass(h, dt);

  for(const rv of R.rivals) rivalThink(rv, dt);
  rivalScale(dt);
  holeVsHole(dt);
  if(!R.on) return;

  // growing into a new tier is a moment: say what you can eat now
  const ti = tierIndexFor(h.r);
  if(ti>R.tierSeen){
    R.tierSeen = ti;
    if(!R.demo && ti>=1){ toast("NOW YOU CAN SWALLOW "+plural(TIERS[ti].n).toUpperCase(), "gem"); sfx("levelup"); R.pulse=1;
      W3.burst(h.x*M, 0.2, h.y*M, "#8fc1ff", GFX==="low"?10:26, 7, 0.22); }
  }

  // escalating difficulty: waves of progressively bigger props, and rivals fed
  const wantWave = Math.floor(R.t/12);
  if(wantWave>R.wave){
    R.wave = wantWave;
    const D=DISTRICTS[R.district];
    const lift = Math.min(D.top-1, 1+Math.floor(R.wave*0.7));
    for(let i=0;i<26;i++){ const p=spawnProp(R.district, Math.min(D.top-1, lift - (Math.random()<0.45?1:0))); p.drop=1+Math.random()*0.6; R.props.push(p); }
    if(R.wave%2===0 && !R.demo){ toast("WAVE "+R.wave+" — BIGGER PREY"); sfx("whoosh"); }
  }
  // keep the field stocked
  let alive=0; for(const p of R.props) if(!p.gone) alive++;
  if(alive < 420*DISTRICTS[R.district].dens){
    for(let i=0;i<70;i++){ const p=spawnProp(R.district); p.drop=0.6+Math.random(); R.props.push(p); }
  }
  if(R.props.length>1400) R.props = R.props.filter(p=>!p.gone);

  // traffic: cars and trucks roll along their lane and turn round at the edge of the map
  for(const p of R.props){
    if(p.gone) continue;
    if(p.drop>0) p.drop = Math.max(0, p.drop-dt*2.2);
    if(p.shiver>0) p.shiver -= dt;
    if(p.spd && p.fall===0){
      const v = p.spd*p.dir*dt;
      if(p.axis===0){ p.x += v; if(p.x<60||p.x>ARENA-60){ p.dir*=-1; p.rot+=Math.PI; p.x=clamp(p.x,60,ARENA-60); } }
      else { p.y += v; if(p.y<60||p.y>ARENA-60){ p.dir*=-1; p.rot+=Math.PI; p.y=clamp(p.y,60,ARENA-60); } }
    }
  }

  // camera
  const z = zoomFor(h.r);
  R.cam.z += (z-R.cam.z)*Math.min(1,dt*2.2);
  R.cam.x += (h.x-R.cam.x)*Math.min(1,dt*7);
  R.cam.y += (h.y-R.cam.y)*Math.min(1,dt*7);
  R.shake = Math.max(0, R.shake-dt*14);
  R.pulse = Math.max(0, R.pulse-dt*2.5);
  R.squash = Math.max(0, R.squash-dt*3.5);
}

//// ---------- 3D drawing ----------
const WHITE = new THREE.Color(1,1,1);
const holeCol = new THREE.Color();
function propY(p){
  // waves drop in from the sky and bounce
  if(p.drop>0){ const t=p.drop; return t>0.25 ? (t-0.25)*(t-0.25)*60 : Math.sin(t/0.25*Math.PI)*0.4; }
  return 0;
}
function drawProps(time){
  W3.begin();
  const fx=R.cam.x*M, fz=R.cam.y*M, rr=W3.drawRadius(), rr2=rr*rr;
  for(const p of R.props){
    if(p.gone) continue;
    const x=p.x*M, z=p.y*M, dx=x-fx, dz=z-fz;
    if(dx*dx+dz*dz > rr2) continue;
    const s = W3.scaleFor(p.mod, p.r*M*0.86);
    let y = propY(p), ang=0, tx=0, tz=0, sy=1, yaw=p.rot;
    if(p.tier===0){ yaw = time*2.4 + p.wob; y += 0.25 + Math.sin(time*3+p.wob)*0.12; }
    if(p.fall>0 && p.eater){
      const hx=p.eater.x*M, hz=p.eater.y*M;
      tx = hx-x; tz = hz-z; ang = Math.min(1.4, p.fall*1.6);
      y = -Math.pow(p.fall,1.6)*(W3.heightOf(p.mod,s)+p.r*M*1.2);
    } else if(p.shiver>0 && !RM.matches){
      ang = Math.sin(time*40+p.wob)*0.05; tx=1; tz=0.3;
    } else if(p.drop>0 && p.drop<0.25){ sy = 1-Math.sin(p.drop/0.25*Math.PI)*0.25; }
    if(p.tier===7) sy *= Math.min(1, 3.4*p.r*M*0.86/Math.max(1,W3.heightOf(p.mod,s)));
    W3.put(p.mod, x, y, z, yaw, s, sy, tx, tz, ang, null);
  }
  W3.end();
}
function drawHoles(){
  const all=[R.hole].concat(R.rivals);
  W3.setHoleCount(all.length);
  all.forEach((h,i)=>{
    if(h.isPlayer){
      if(skinNow.rainbow && !RM.matches) holeCol.setHSL((performance.now()/2800)%1,0.9,0.62);
      else if(skinNow.pulse && !RM.matches) holeCol.set(skinNow.color).offsetHSL(0,0,Math.sin(performance.now()/330)*0.1);
      else holeCol.set(skinNow.color);
    } else holeCol.setHSL(h.hue/360,0.7,0.6);
    W3.setHole(i, h.x*M, h.y*M, h.r*M, holeCol, h.isPlayer?R.pulse:0, h.isPlayer?R.squash:0);
  });
}
// the camera sits behind and above the hole; it pulls back as the hole grows
function camDist(){
  // vis = metres of ground across the shorter side of the screen
  const vis = 30*(1.25/R.cam.z), a = VW/Math.max(1,VH), half = W3.fov/2*Math.PI/180;
  const across = a<1 ? vis/a : vis;          // portrait: the vertical fov has to cover more
  return Math.min(across, vis*1.9)/(2*Math.tan(half))*0.92;
}

const fxEl = document.getElementById("fx");
const pops = [];
function floater(text, x, z, big){

function stepPops(dt){

//// ---------- city dressing: ground tile, border and skyline ----------
const TEX = {};   // asphalt, grass, paving (ambientCG, CC0), filled as they load
['asphalt','grass','paving'].forEach(n=>{ const im=new Image(); im.onload=()=>{ TEX[n]=im; if(ready){ dressedFor=-1; dressCity(); } }; im.src='tex/'+n+'.jpg'; });
// a real texture, tinted towards the district colour so the palette stays but the grain is real
function texFill(g, name, x, y, w, h, tint, mix, scale){
  const im=TEX[name];
  if(!im){ g.fillStyle=tint; g.fillRect(x,y,w,h); return; }
  const pat=g.createPattern(im,'repeat');
  if(pat && pat.setTransform){ try{ pat.setTransform(new DOMMatrix().scale(scale)); }catch(e){} }
  g.fillStyle=pat; g.fillRect(x,y,w,h);
  g.globalAlpha=mix; g.fillStyle=tint; g.fillRect(x,y,w,h); g.globalAlpha=1;
}
function paintTile(look){
  return (g, P)=>{
    const k=P/BLOCK;   // texture px per sim px
    texFill(g,'asphalt',0,0,P,P,look.road,look.tint,P/1024);
    // asphalt grain
    for(let i=0;i<P*P/90;i++){ g.fillStyle=`rgba(${Math.random()<.5?255:0},${Math.random()<.5?255:0},${Math.random()<.5?255:0},0.035)`; g.fillRect(Math.random()*P,Math.random()*P,2,2); }
    const r=ROAD/2*k, w=WALK*k;
    // sidewalk slab with joints
    texFill(g,'paving',r,r,P-2*r,P-2*r,look.walk,look.tint*0.8,P/2048);
    g.strokeStyle="rgba(0,0,0,.10)"; g.lineWidth=Math.max(1,P/512);
    for(let x=r;x<P-r;x+=w){ g.beginPath(); g.moveTo(x,r); g.lineTo(x,r+w); g.moveTo(x,P-r-w); g.lineTo(x,P-r); g.stroke(); }
    for(let y=r;y<P-r;y+=w){ g.beginPath(); g.moveTo(r,y); g.lineTo(r+w,y); g.moveTo(P-r-w,y); g.lineTo(P-r,y); g.stroke(); }
    // kerb shadow
    g.strokeStyle="rgba(0,0,0,.22)"; g.lineWidth=Math.max(2,P/300); g.strokeRect(r,r,P-2*r,P-2*r);
    // lawn or plaza inside, split into 4 lots by paths
    const i0=r+w, inner=P-2*i0;
    texFill(g,'grass',i0,i0,inner,inner,look.lawn,look.tint,P/1400);
    for(let i=0;i<inner*inner/60;i++){ g.fillStyle=Math.random()<0.5?look.lawn2:"rgba(255,255,255,.05)"; g.fillRect(i0+Math.random()*inner,i0+Math.random()*inner,3,3); }
    g.fillStyle=look.lot; const pw=Math.max(3,P/110);
    g.fillRect(i0+inner/2-pw/2,i0,pw,inner); g.fillRect(i0,i0+inner/2-pw/2,inner,pw);
    g.strokeStyle="rgba(0,0,0,.08)"; g.lineWidth=Math.max(1,P/400);
    for(let i=0;i<2;i++) for(let j=0;j<2;j++){ const q=inner/2; g.strokeRect(i0+i*q+q*0.12,i0+j*q+q*0.12,q*0.76,q*0.76); }
    // lane markings: dashed centre line on the tile edges, zebra crossings at the corners
    g.fillStyle=look.line;
    const dash=P/20, lw=Math.max(2,P/260);
    for(let s=r+dash*0.5;s<P-r-dash;s+=dash*2){ g.fillRect(s,0,dash,lw/2); g.fillRect(s,P-lw/2,dash,lw/2); g.fillRect(0,s,lw/2,dash); g.fillRect(P-lw/2,s,lw/2,dash); }
    g.globalAlpha=0.9; const zw=Math.max(3,P/120);
    for(const [cx,cy] of [[0,0],[P,0],[0,P],[P,P]]){
      for(let s=-r+zw;s<r-zw;s+=zw*2){
        g.fillRect(cx+(cx?-r-w*0.9:r), cy+s-zw/2, w*0.9, zw);   // across the vertical road
        g.fillRect(cx+s-zw/2, cy+(cy?-r-w*0.9:r), zw, w*0.9);
      }
    }
    g.globalAlpha=1;
  };
}
let dressedFor = -1;
function dressCity(){
  const D=DISTRICTS[R.district], L=D.look;
  W3.setSky(L.sky[0], L.sky[1]);
  W3.hemi.intensity = L.hemi; W3.sun.intensity = L.sun; document.querySelector('meta[name=theme-color]').setAttribute('content', L.sky[0]);
  if(dressedFor===R.district*10+(GFX==="low"?1:0)) return;
  dressedFor = R.district*10+(GFX==="low"?1:0);
  W3.setGround(0, 0, ARENA*M, BLOCK*M, paintTile(L), 140);
  W3.clearStatics();
  // barrier ring along the map edge
  const bar=[]; const bs=W3.scaleFor("barrier",1.2);
  for(let s=0;s<=ARENA*M;s+=2.6){ bar.push({x:s,z:-0.8,s:bs,yaw:0},{x:s,z:ARENA*M+0.8,s:bs,yaw:0},{x:-0.8,z:s,s:bs,yaw:Math.PI/2},{x:ARENA*M+0.8,z:s,s:bs,yaw:Math.PI/2}); }
  W3.addStatic("barrier", bar, false);
  // skyline beyond the edge: towers and houses that frame the map (decoration, out of reach)
  const ring={}; const ids=["skyA","skyB","skyC","skyE","towerA","towerC","towerE","towerG","houseA","houseC","houseF","houseK"];
  const A=ARENA*M;
  for(let side=0;side<4;side++) for(let s=-60;s<A+60;s+=16){
    for(let row=0;row<3;row++){
      if(Math.random()<0.2) continue;
      const id = row===0 ? pick(ids.slice(8)) : pick(ids.slice(0,8));
      const off = 22+row*18+rnd(-3,3), sc=W3.scaleFor(id, 6+row*1.5);
      const t = side===0?{x:s,z:-off}:side===1?{x:s,z:A+off}:side===2?{x:-off,z:s}:{x:A+off,z:s};
      t.s=sc; t.yaw=[0,Math.PI,Math.PI/2,-Math.PI/2][side]+Math.PI;
      (ring[id]=ring[id]||[]).push(t);
    }
  }
  for(const id in ring) W3.addStatic(id, ring[id], true);
  // street lamps at the block corners
  const lamps=[]; const ls=W3.scaleFor("lamp",0.5);
  for(let bx=0;bx<NB;bx++) for(let by=0;by<NB;by++){
    const x0=(bx*BLOCK+ROAD/2+6)*M, y0=(by*BLOCK+ROAD/2+6)*M, x1=((bx+1)*BLOCK-ROAD/2-6)*M, y1=((by+1)*BLOCK-ROAD/2-6)*M;
    lamps.push({x:x0,z:y0,s:ls,yaw:Math.PI*0.75},{x:x1,z:y1,s:ls,yaw:-Math.PI*0.25});
  }
  W3.addStatic("lamp", lamps, true);
}

function updateHud(dt){

function drawMinimap(){
  const pad=12, ms=104, mx=VW-ms-pad, my=VH-ms-pad-SAB;
  const g=ctx.createLinearGradient(0,my,0,my+ms); g.addColorStop(0,'rgba(34,80,140,.92)'); g.addColorStop(1,'rgba(8,20,44,.94)');
  ctx.fillStyle=g; rr(mx,my,ms,ms,12); ctx.fill();
  ctx.strokeStyle='rgba(240,179,58,.85)'; ctx.lineWidth=2; rr(mx+1,my+1,ms-2,ms-2,11); ctx.stroke();
  ctx.save(); rr(mx+3,my+3,ms-6,ms-6,9); ctx.clip();
  const k=ms/ARENA;
  ctx.strokeStyle="rgba(255,255,255,.09)"; ctx.lineWidth=1;
  for(let i=1;i<NB;i++){ ctx.beginPath(); ctx.moveTo(mx+i*BLOCK*k,my); ctx.lineTo(mx+i*BLOCK*k,my+ms); ctx.moveTo(mx,my+i*BLOCK*k); ctx.lineTo(mx+ms,my+i*BLOCK*k); ctx.stroke(); }
  for(const rv of R.rivals){ ctx.fillStyle=`hsl(${rv.hue},70%,62%)`;
    ctx.beginPath(); ctx.arc(mx+rv.x*k,my+rv.y*k,Math.max(2.5,rv.r*k*2),0,6.283); ctx.fill(); }
  ctx.fillStyle="#ffd35c"; ctx.strokeStyle="#07132a"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(mx+R.hole.x*k,my+R.hole.y*k,Math.max(3,R.hole.r*k*2),0,6.283); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function rr(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

let orbit = 0;
function render(dt, time){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,VW,VH);
  if(!ready || !R.hole) return;
  drawProps(time);
  drawHoles();
  let pitch=1.05, yaw=0, dist=camDist();
  if(R.demo || !R.on){ orbit += dt*0.06; yaw = Math.sin(orbit)*0.9; pitch = 0.88; dist*=1.15; }
  W3.view(R.cam.x*M, R.cam.y*M + (R.demo?0:dist*0.04), dist, pitch, yaw, R.shake*0.05);
  W3.render(dt);
  stepPops(dt); stepTags();
  if(R.on && !R.over && !R.demo) drawMinimap();
  updateHud(dt);
}

//// ---------- loop ----------
let last=performance.now(), fps=0, fAcc=0, fT=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  fAcc++; fT+=dt; if(fT>=1){ fps=fAcc/fT; fAcc=0; fT=0; }
  step(dt);
  render(dt, now/1000);
  requestAnimationFrame(frame);
}

    PROG.refreshUnlocks(); PROG.save(); persist();
  }
  const swallowed = R.endReason==="swallowed";
  $("ovHead").className='gk-head '+(swallowed?'lose':ns>0?'win':'');
  $("ovTitle").textContent = swallowed ? "SWALLOWED" : ns>0 ? "DISTRICT RUN" : "TIME UP";
  GK.stars($("ovStars"), ns, {animate:ns>0});
  $("ovScore").textContent='0'; GK.countUp($("ovScore"), R.score, 800, fmt);
  $("ovNew").classList.toggle('gk-hidden', !res.pb);
  const stat=(i,v,l)=>'<div><b>'+ic(i)+'<span>'+v+'</span></b><span>'+l+'</span></div>';
  $("ovStats").innerHTML = stat('coin','+'+fmt(res.coins),'Coins')+stat('bolt','+'+fmt(res.xp),'XP')+stat('gem',R.eaten,'Swallowed');
  $("ovGoals").innerHTML = [0,1,2].map(k=>'<div class="g'+(ns>k?' done':'')+'">'+ic(ns>k?'star':'starOff')+'<span>'+(k===1?'Clear the quota':'Score')+'</span><span class="n">'+fmt(Math.round(q*STAR_AT[k]))+'</span></div>').join('');
  const nxt = DISTRICTS[R.district+1];
  $("ovProg").textContent = (swallowed ? "A rival hole got bigger than you and took the whole map with it. " : "Everything you swallowed is banked. ")+
    "Final size "+R.hole.r.toFixed(1)+". "+(nxt&&!save.unlocked.includes(R.district+1) ? nxt.n+" costs "+fmt(nxt.cost)+" coins. " : "")+
    (cheated()?"CODES ON: nothing from this session is saved.":"");
  $("btnAgain").innerHTML = ic('replay')+'RUN AGAIN'; $("btnHub").innerHTML = ic('home')+'HUB';
  showLayer("over"); hudTags(); labels();
  renderHub();
  if(ns>0||res.pb) setTimeout(()=>GK.confetti(innerWidth/2, innerHeight*0.35, res.pb?70:45), 350);
  if(res.coins>0) setTimeout(()=>GK.fly({x:innerWidth/2,y:innerHeight*0.5}, $("ovStats").firstElementChild, Math.min(8,2+Math.floor(res.coins/40)), 'coin'), 700);
  PROG.takeNewSkins().forEach((sk,k)=>setTimeout(()=>GK.toast('New hole style: '+sk.name+'<small>Open Holes on the hub to use it</small>',{icon:'gift'}), 1500+k*900));
}

$("btnPlay").onclick  = ()=>{
  const i=selDistrict, d=DISTRICTS[i];
  if(save.unlocked.includes(i)){ save.district=i; persist(); beginRun(i); return; }
  if(save.coins>=d.cost){ save.coins-=d.cost; save.unlocked.push(i); save.district=i; persist(); toast(d.n+" UNLOCKED","lock"); sfx("unlock"); GK.confetti(innerWidth/2, innerHeight*0.5, 60); renderHub(); if(R.demo) startDemo(); }
  else { toast("NEED "+fmt(d.cost-save.coins)+" MORE COINS","coin"); sfx("error"); }
};
$("btnUp").onclick = openUpgrades; $("btnSkins").onclick = openSkins; $("coinChip").onclick = openUpgrades;
$("btnAgain").onclick = ()=>beginRun(save.district);
$("btnHub").onclick   = ()=>toHub();
function toHub(){
  if(R.on && !R.over && !R.demo){ R.paused=false; endRun("time"); }   // same as ABANDON RUN: what you swallowed is banked
  coachHide(); renderHub(); showLayer("hub"); hudTags();
  startDemo();
  sdk("state",{scene:"title"});
}
function paintGfx(){ $("btnGfx").textContent = "GRAPHICS: "+GFX.toUpperCase(); }
$("btnGfx").onclick = ()=>{
  GFX = GFX==="high" ? "low" : "high";
  try{ localStorage.setItem("holegrind.gfx", GFX); }catch(e){}
  W3.setQuality(GFX); paintGfx(); resize(); if(ready) dressCity();
  sfx("tap");
};
paintGfx();
function hudTags(){ $("codesOn").hidden = !(cheated() && R.on && !R.over && !R.demo); }

//// ---------- first-run coach card: teaches steering by doing it ----------
function coachShow(){
  tut=1; tutEaten=0; clearTimeout(coachT);
  $("coachKick").textContent="FIRST DROP"; $("coachBig").textContent="STEER THE HOLE";
  $("coachText").textContent = COARSE ? "Hold a finger on the screen and the hole rolls toward it. Swallow 3 things smaller than you."
                                       : "Hold the mouse button, or use WASD / arrows, to roll the hole. Swallow 3 things smaller than you.";
  $("coachDemo").style.display=""; $("coachSkip").style.display="";
  $("coach").classList.add("on");
}
function coachGrow(){
  tut=2; clearTimeout(coachT);
  try{ localStorage.setItem("holegrind.tut","1"); }catch(e){}
  sdk("event","tutorial-done");
  $("coachKick").textContent="NICE — THE CLOCK IS RUNNING"; $("coachBig").textContent="GROW, THEN GO BIGGER";
  $("coachText").textContent="Every bite makes you wider. NEXT (top left) says what you can swallow next. Stay away from rival holes bigger than you.";
  $("coachDemo").style.display="none"; $("coachSkip").style.display="none";
  coachT=setTimeout(coachHide, 4200);
}
function coachHide(){ tut=0; clearTimeout(coachT); $("coach").classList.remove("on"); }
$("coachSkip").onclick = ()=>{ coachHide(); try{ localStorage.setItem("holegrind.tut","1"); }catch(e){} };

//// ---------- hint: where the food is and what to avoid ----------
function compass(dx,dy){
  const a=Math.atan2(dy,dx), dirs=["east","south-east","south","south-west","west","north-west","north","north-east"];
  return dirs[(Math.round(a/(Math.PI/4))+8)%8];
}
function hint(){
  if(!R.on || R.over || R.demo) return "Pick a district you have unlocked, buy upgrades with your coins, then DROP IN. Beat the district quota to clear it.";
  const h=R.hole;
  for(const rv of R.rivals){ const d=Math.hypot(rv.x-h.x,rv.y-h.y);
    if(rv.r>h.r*1.05 && d<rv.r*4+160) return "A rival bigger than you ("+rv.name+") is close to the "+compass(rv.x-h.x,rv.y-h.y)+". Roll the other way and eat small props until you outgrow it."; }
  let best=null, bd=1e9;
  for(const p of R.props){ if(p.gone||p.r>=h.r*EAT_RATIO) continue;
    const d=Math.hypot(p.x-h.x,p.y-h.y)/(1+p.m*0.02); if(d<bd){bd=d;best=p;} }
  let next=null; for(const T of TIERS) if(T.r>=h.r*EAT_RATIO){ next=T; break; }
  if(best) return "Good food: a "+TIERS[best.tier].n+" to the "+compass(best.x-h.x,best.y-h.y)+"."+(next?" Grow to "+next.r+" to start swallowing "+next.n+"s.":" You can swallow everything now.");
  return "Nothing edible nearby: head for the middle of the map, where the waves of new props land.";
}

//// ---------- codes (the arcade's Codes box): a sandbox that is never saved ----------
const CODES = {BLACKHOLE:"Start every run three times as wide", GHOSTHOLE:"Rival holes can't swallow you",
               MONEYPIT:"+50,000 coins to spend (this session only)", UNLOCKALL:"Every district unlocked (this session only)"};
function code(c){
  c=String(c||"").toUpperCase(); if(!CODES[c]) return {ok:false};
  if(c==="BLACKHOLE"){ CHEAT.big=true; if(R.on&&!R.over&&!R.demo&&R.hole&&R.hole.mass<startMass()){ R.hole.mass=startMass(); R.hole.r=radiusFor(R.hole.mass); } }
  if(c==="GHOSTHOLE") CHEAT.ghost=true;
  if(c==="MONEYPIT") save.coins+=50000;
  if(c==="UNLOCKALL") DISTRICTS.forEach((d,i)=>{ if(!save.unlocked.includes(i)) save.unlocked.push(i); });
  setTimeout(()=>{ renderHub(); hudTags(); toast("CODES ON — THIS SESSION IS NOT SAVED","lock"); },0);
  return {ok:true, message:CODES[c]};
}
$("btnResume").onclick= ()=>togglePause();
$("btnQuit").onclick  = ()=>{ R.paused=false; endRun("time"); };
$("btnWipe").onclick  = ()=>{
  if(!confirm("Wipe your whole Hole Grind save (coins, upgrades, districts, stars)?")) return;
  save=FRESH(); PROG.d.stars=save.stars; persist(); selDistrict=null; renderHub(); toast("SAVE WIPED");
};

//// ---------- debug handle (headless harness drives this) ----------
window.__DEBUG = {
  get state(){
    return {
      running:R.on&&!R.demo, demo:R.demo, over:R.over, paused:R.paused, t:+R.t.toFixed(2),
      timeLeft:+R.timeLeft.toFixed(2), district:R.district,
      holeR: R.hole?+R.hole.r.toFixed(2):0, holeMass: R.hole?+R.hole.mass.toFixed(1):0,
      x:R.hole?Math.round(R.hole.x):0, y:R.hole?Math.round(R.hole.y):0,
      score:R.score, eaten:R.eaten, wave:R.wave,
      props:R.props.filter(p=>!p.gone).length,
      edible:R.hole?R.props.filter(p=>!p.gone&&p.r<R.hole.r).length:0,
      tooBig:R.hole?R.props.filter(p=>!p.gone&&p.r>=R.hole.r).length:0,
      rivals:R.rivals.length, biggestRival:R.rivals.reduce((a,b)=>Math.max(a,b.r),0),
      nearest: (()=>{ if(!R.hole) return -1; let b=1e9;
        for(const p of R.props){ if(p.gone||p.r>=R.hole.r*EAT_RATIO) continue;
          const d=Math.hypot(p.x-R.hole.x,p.y-R.hole.y); if(d<b)b=d; }
        return b>1e8?-1:+b.toFixed(1); })(),
      fps:Math.round(fps), autopilot:R.autopilot, endReason:R.endReason,
      coins:save.coins, best:save.best, runs:save.runs, level:playerLevel(),
      unlocked:save.unlocked.slice(), up:Object.assign({},save.up), gfx:GFX, ready
    };
  },
  start:(d)=>beginRun(d==null?save.district:d),
  autopilot:(v)=>{ R.autopilot = v!==false; return R.autopilot; },
  moveTo:(x,y)=>{ R.hole.x=clamp(x,0,ARENA); R.hole.y=clamp(y,0,ARENA); },
  grant:(c)=>{ save.coins+=c; persist(); renderHub(); return save.coins; },
  buy:(id)=>buyUpgrade(id),
  unlock:(i)=>{ if(!save.unlocked.includes(i)) save.unlocked.push(i);
                save.district=i; persist(); renderHub(); return save.unlocked.slice(); },
  feed:(m)=>{ absorb(R.hole,m); return +R.hole.r.toFixed(1); },
  end:()=>endRun("time"),
  wipe:()=>{ save=FRESH(); PROG.d.stars=save.stars; persist(); renderHub(); },
  tiers:TIERS, districts:DISTRICTS, upgrades:UPGRADES.map(u=>u.id),
  saveKey:SAVE_KEY
};

//// ---------- boot ----------
load(); PROG.d.stars = save.stars; PROG.refreshUnlocks(); applySkin(); resize(); renderHub(); startDemo(); requestAnimationFrame(frame);
W3.load("models/city.glb").then(()=>{ ready=true; dressedFor=-1; dressCity(); $("loading").remove(); })
  .catch(e=>{ $("loading").textContent="Could not load the city models. Reload to try again."; });

//// ---------- Caleb's Arcade: restart, exit, tutorial, hints and codes go through the SDK ----------
if(SDK) ArcadeSDK.init({pauseKeys:"p+esc",
  onRestart:()=>{ const d = (R.on||R.over)&&!R.demo ? R.district : save.district; coachHide(); beginRun(d); },
  onExit:toHub, onTutorial:()=>beginRun(save.district,true), onHint:hint, onCheat:code});
sdk("state",{scene:"title"});
</script>
