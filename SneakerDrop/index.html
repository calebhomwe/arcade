<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SneakerDrop - Hype Market Tycoon</title>
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;background:#05060a;overflow:hidden;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:#eaf0ff;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;box-shadow:0 0 0 1px #1b2333,0 24px 80px rgba(0,0,0,.85);background:#0a0d16;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  #ui{position:absolute;inset:0;pointer-events:none;}
  #ui button{pointer-events:auto;font-family:inherit;-webkit-appearance:none;appearance:none;}
  #startBtn{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);
    width:70%;min-height:64px;border:0;border-radius:16px;cursor:pointer;
    background:linear-gradient(180deg,#ffe066,#ffa31a);color:#2a1700;font-weight:800;
    font-size:clamp(15px,4.4vh,26px);letter-spacing:1.5px;
    box-shadow:0 8px 0 #a35f00,0 14px 30px rgba(0,0,0,.55);}
  #startBtn:active{transform:translate(-50%,-50%) translateY(4px);box-shadow:0 4px 0 #a35f00;}
  #sndRow{position:absolute;left:0;right:0;bottom:4%;display:flex;gap:10px;justify-content:center;}
  #ui .mini{background:#121a2c;color:#9fb0d0;border:1px solid #26334d;border-radius:10px;
    padding:10px 16px;font-size:13px;font-weight:700;min-height:44px;cursor:pointer;}
  .hide{display:none !important;}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="ui">
    <div id="titleUI">
      <button id="startBtn">TAP TO START</button>
      <div id="sndRow"><button class="mini" id="sndBtn">SOUND: ON</button></div>
    </div>
  </div>
</div></div>
<script>
"use strict";
(function(){
/* =====================================================================
   SneakerDrop - a sneaker-resale market sim.
   hype calendar -> snipe a drop -> hold or flip into a live bid auction
   -> reinvest in storage / grading / verified-seller reputation.
   Deterministic seeds; score = profit per week.
   ===================================================================== */

/* ---------------- persistence (ONE key, never throws) --------------- */
var SKEY='sneakerdrop_save';
function loadSave(){try{var r=localStorage.getItem(SKEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function putSave(o){try{localStorage.setItem(SKEY,JSON.stringify(o));}catch(e){}}
var SAVE=loadSave()||{};

/* ---------------- deterministic rng -------------------------------- */
function mulberry32(a){var t=a>>>0;return function(){t=(t+0x6D2B79F5)>>>0;var x=t;x=Math.imul(x^(x>>>15),1|x);x=(x+Math.imul(x^(x>>>7),61|x))^x;return ((x^(x>>>14))>>>0)/4294967296;};}

/* ---------------- constants ---------------------------------------- */
var LW=540,LH=960,FIXED=1/60,WEEKS=10,START_CASH=800;
var TIER={
  CORE:{c:'#93a0b8',hype:0.30,speed:0.85,tc:10,mul:1.0},
  RARE:{c:'#3fa9ff',hype:0.55,speed:1.00,tc:25,mul:1.0},
  HYPE:{c:'#ff8f2e',hype:0.80,speed:1.15,tc:45,mul:1.0},
  GRAIL:{c:'#ffd23f',hype:1.15,speed:1.30,tc:70,mul:1.0}};
var BRANDS={
  VOLTA:{n:'VOLTA',c1:'#16233f',c2:'#3fd8ff',heat:1.00},
  KODA:{n:'KODA',c1:'#2a1c14',c2:'#ff6a3d',heat:1.00},
  RIVET:{n:'RIVET',c1:'#1c2a1e',c2:'#d9c37c',heat:1.00},
  HALO:{n:'HALO',c1:'#2a1030',c2:'#ff7fd0',heat:1.00}};
var BK=['VOLTA','KODA','RIVET','HALO'];
var MODELS=[
  {id:'aeroflux',n:'AEROFLUX 1',b:'VOLTA',t:'CORE',retail:120,base:108,vol:0.9,hi:0.25,sole:0.9,acc:'#3fd8ff'},
  {id:'photon',n:'PHOTON RACER',b:'VOLTA',t:'RARE',retail:180,base:268,vol:1.15,hi:0.10,sole:1.15,acc:'#5ce1ff'},
  {id:'novacage',n:'NOVA CAGE',b:'VOLTA',t:'HYPE',retail:245,base:430,vol:1.35,hi:0.75,sole:1.00,acc:'#7af0ff'},
  {id:'eclipse',n:'ECLIPSE ZERO',b:'VOLTA',t:'GRAIL',retail:340,base:620,vol:1.5,hi:0.90,sole:1.20,acc:'#a6fbff'},
  {id:'district',n:'DISTRICT LOW',b:'KODA',t:'CORE',retail:100,base:96,vol:0.85,hi:0.15,sole:0.80,acc:'#ff6a3d'},
  {id:'block',n:'CONCRETE BLOCK',b:'KODA',t:'RARE',retail:155,base:232,vol:1.1,hi:0.50,sole:1.00,acc:'#ff8b5e'},
  {id:'nightbus',n:'NIGHTBUS 88',b:'KODA',t:'HYPE',retail:225,base:405,vol:1.3,hi:0.80,sole:0.95,acc:'#ffb37a'},
  {id:'yarddog',n:'YARD DOG',b:'RIVET',t:'CORE',retail:110,base:118,vol:0.9,hi:0.35,sole:1.05,acc:'#d9c37c'},
  {id:'gantry',n:'GANTRY MID',b:'RIVET',t:'RARE',retail:165,base:252,vol:1.1,hi:0.30,sole:1.05,acc:'#e8d79a'},
  {id:'ironwood',n:'IRONWOOD GT',b:'RIVET',t:'HYPE',retail:250,base:455,vol:1.3,hi:0.60,sole:1.25,acc:'#f4e6b4'},
  {id:'royale',n:'COURT ROYALE',b:'HALO',t:'CORE',retail:130,base:142,vol:0.95,hi:0.60,sole:0.85,acc:'#ff7fd0'},
  {id:'vellum',n:'VELLUM HIGH',b:'HALO',t:'RARE',retail:190,base:292,vol:1.15,hi:0.85,sole:0.90,acc:'#ff9fdc'},
  {id:'static',n:'STATIC BLOOM',b:'HALO',t:'HYPE',retail:215,base:376,vol:1.35,hi:0.45,sole:1.10,acc:'#ffc0ea'},
  {id:'aureum',n:'AUREUM 24K',b:'HALO',t:'GRAIL',retail:340,base:620,vol:1.5,hi:0.95,sole:1.00,acc:'#ffe9a3'}];
var MIDX={};for(var mi=0;mi<MODELS.length;mi++)MIDX[MODELS[mi].id]=mi;

var UPG={
  storage:{n:'STORAGE UNIT',d:'+2 pairs of shelf space',base:260,mult:1.85,max:3},
  grade:{n:'GRADING BENCH',d:'Cheaper fees, better grades',base:300,mult:1.90,max:3},
  rep:{n:'VERIFIED SELLER',d:'+5% top bids, -1% fees',base:200,mult:2.00,max:5}};

/* ---------------- audio: lazy, built on first play ------------------ */
var SFX=(function(){
  var BASE='audio/',VOICES=3;
  var BANK={snipe_win:'snipe_win.mp3',snipe_miss:'snipe_miss.mp3',bid:'bid.mp3',
            sold:'sold.mp3',cashout:'cashout.mp3',hype_riser:'hype_riser.mp3',bed:'shop_bed.mp3'};
  var pools={},bed=null;
  function voices(n){
    var p=pools[n];if(p)return p;
    var els=[],i;
    for(i=0;i<VOICES;i++){(function(){var a=new Audio();a.preload='none';a.volume=0.001;
      a.addEventListener('error',function(){pools[n].failed=true;},{once:true});
      a.addEventListener('loadeddata',function(){pools[n].loaded=true;},{once:true});
      els.push(a);})();}
    return (pools[n]={els:els,i:0,failed:false,loaded:false});
  }
  function play(n,o){
    o=o||{};
    try{
      var p=voices(n);if(p.failed)return;
      var a=p.els[p.i];p.i=(p.i+1)%p.els.length;
      if(a.getAttribute('src')!==BASE+BANK[n])a.src=BASE+BANK[n];
      try{a.pause();if(a.readyState>0)a.currentTime=0;}catch(e2){}
      var j=(o.jitter===undefined)?0.05:o.jitter;
      a.playbackRate=Math.max(0.25,Math.min(4,(o.rate||1)*(1+(Math.random()*2-1)*j)));
      a.volume=Math.max(0,Math.min(1,(o.vol===undefined?0.8:o.vol)*(o.gain===undefined?1:o.gain)));
      var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});
    }catch(e){}
  }
  function music(on,vol){
    try{
      if(!on){if(bed)bed.pause();return;}
      if(!bed){bed=new Audio();bed.preload='none';bed.loop=true;bed.volume=0;bed.src=BASE+BANK.bed;}
      bed.volume=Math.max(0,Math.min(1,vol));
      var pr=bed.play();if(pr&&pr.catch)pr.catch(function(){});
    }catch(e){}
  }
  function stats(){var o={},n;for(n in BANK){var p=pools[n];o[n]=p?(p.failed?'failed':(p.loaded?'loaded':'pending')):'idle';}return o;}
  return {play:play,music:music,stats:stats,ready:function(n){var p=pools[n];return p?!!p.loaded:null;}};
})();
window.__SFX=SFX;
var AU={
  on:(SAVE.snd===undefined?true:!!SAVE.snd),
  gain:function(){return this.on?1:0;},
  win:function(){SFX.play('snipe_win',{vol:0.9,gain:this.gain()});},
  miss:function(){SFX.play('snipe_miss',{vol:0.85,gain:this.gain()});},
  bid:function(n){SFX.play('bid',{vol:0.7,gain:this.gain(),rate:1+Math.min(n||0,14)*0.035,jitter:0.02});},
  sold:function(){SFX.play('sold',{vol:0.95,gain:this.gain()});},
  cash:function(){SFX.play('cashout',{vol:0.9,gain:this.gain()});},
  riser:function(){SFX.play('hype_riser',{vol:0.75,gain:this.gain(),jitter:0.0});},
  bed:function(on){SFX.music(this.on&&on!==false,0.20);}
};

/* ---------------- canvas / layout ---------------------------------- */
var wrap=document.getElementById('wrap'),stage=document.getElementById('stage'),
    cv=document.getElementById('cv'),ctx=cv.getContext('2d'),
    titleUI=document.getElementById('titleUI'),
    startBtn=document.getElementById('startBtn'),sndBtn=document.getElementById('sndBtn'),
    ui=document.getElementById('ui');
/* The 540x960 world keeps its own coordinate space; the canvas now covers the whole
   viewport and the world is drawn centred inside it, so the phone's letterbox bands and
   the desktop side gutters become designed space instead of dead black. */
var scale=1,shakeX=0,shakeY=0,cssW=0,cssH=0;
var DPR=1,VW=540,VH=960,gs=1,offX=0,offY=0,WIDE=false;
var RM=(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
var SHAKEK=RM?0:1,PARTK=RM?0.35:1;

function resize(){
  var aw=Math.max(240,window.innerWidth),ah=Math.max(320,window.innerHeight);
  DPR=Math.min(2.5,window.devicePixelRatio||1);
  VW=aw;VH=ah;
  gs=Math.min(aw/LW,ah/LH);
  offX=(aw-LW*gs)/2;offY=(ah-LH*gs)/2;
  WIDE=(offX>=260);                        // only fill gutters when there is real room
  cssW=aw;cssH=ah;
  stage.style.width=aw+'px';stage.style.height=ah+'px';
  cv.width=Math.round(aw*DPR);cv.height=Math.round(ah*DPR);
  cv.style.width=aw+'px';cv.style.height=ah+'px';
  scale=gs*DPR;
  /* the DOM overlay rides the world rect, so buttons stay on their canvas art */
  ui.style.left=offX+'px';ui.style.top=offY+'px';
  ui.style.width=Math.round(LW*gs)+'px';ui.style.height=Math.round(LH*gs)+'px';
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120);});

/* ---------------- drawing helpers ---------------------------------- */
function rr(g,x,y,w,h,r){
  if(w<0){x+=w;w=-w;}if(h<0){y+=h;h=-h;}
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
function shade(hex,amt){
  var c=hex.replace('#','');if(c.length===3)c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  var r=parseInt(c.substr(0,2),16),g2=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  function cl(v){return Math.max(0,Math.min(255,Math.round(v)));}
  if(amt>0){r=cl(r+(255-r)*amt);g2=cl(g2+(255-g2)*amt);b=cl(b+(255-b)*amt);}
  else{r=cl(r*(1+amt));g2=cl(g2*(1+amt));b=cl(b*(1+amt));}
  return 'rgb('+r+','+g2+','+b+')';
}
var FONT='"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif';
function tx(g,s,x,y,size,col,align,weight){
  /* at 0.75 scale an authored 11px caption lands at ~8px; on a desktop viewport lift the
     small end of the scale so the market's numbers are readable without zooming */
  if(WIDE&&size<=13)size=Math.round(size*1.25);
  g.font=(weight||700)+' '+size+'px '+FONT;
  g.fillStyle=col;g.textAlign=align||'left';g.textBaseline='middle';g.fillText(s,x,y);
}
function money(v){var n=Math.round(v);var neg=n<0;n=Math.abs(n);var s=String(n),out='',c=0,i;
  for(i=s.length-1;i>=0;i--){out=s.charAt(i)+out;c++;if(c%3===0&&i>0)out=','+out;}
  return (neg?'-$':'$')+out;}
function moneyK(v){var n=Math.round(v);if(Math.abs(n)>=10000)return (n<0?'-$':'$')+(Math.abs(n)/1000).toFixed(1)+'k';return money(n);}

/* ---------------- particles / pops (pre-allocated) ------------------ */
var P_MAX=320,parts=[],pcur=0,pi;
for(pi=0;pi<P_MAX;pi++)parts.push({live:false,x:0,y:0,vx:0,vy:0,life:0,max:1,col:'#fff',size:3,grav:700});
function spawn(x,y,vx,vy,life,col,size,grav){
  var p=parts[pcur];pcur=(pcur+1)%P_MAX;
  p.live=true;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=life;p.max=life;p.col=col;
  p.size=size;(p.grav=grav===undefined?700:grav);
}
function burst(x,y,n,col,spd,life,size){
  n=Math.round(n*PARTK);
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,s=spd*(0.35+Math.random());
    spawn(x,y,Math.cos(a)*s,Math.sin(a)*s,life*(0.6+Math.random()*0.7),col,size*(0.6+Math.random()*0.9));
  }
}
var pops=[];
function pop(x,y,text,col,size){pops.push({x:x,y:y,t:text,c:col,s:size||20,life:1.25,max:1.25});if(pops.length>24)pops.shift();}

/* ---------------- state -------------------------------------------- */
var S={phase:'title',seed:0,over:false};
function dailySeed(){var d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function newRun(seed){
  seed=seed>>>0;
  S={
    phase:'market',seed:seed,over:false,
    day:1,week:1,cash:START_CASH,
    up:{storage:0,grade:0,rep:0},
    storage:3,rep:0,
    inv:[],
    attempted:false,attempts:0,hits:0,flips:0,
    streak:0,bestStreak:0,bestFlip:0,worstFlip:0,earned:0,
    ticker:[],prices:[],
    trauma:0,timeScale:1,stopT:0,simT:0,
    snipe:null,auction:null,pairSel:-1,shopMsg:'',shopMsgT:0,scroll:0,scrollTarget:0,
    confirm:false,summary:null,flash:0,flashCol:'#ff3355'
  };
  S.rngM=mulberry32((seed^0x9E3779B9)>>>0);
  S.rngA=mulberry32((seed^0x85EBCA6B)>>>0);
  S.rngS=mulberry32((seed^0xC2B2AE35)>>>0);
  BRANDS.VOLTA.heat=1.0;BRANDS.KODA.heat=1.0;BRANDS.RIVET.heat=1.0;BRANDS.HALO.heat=1.0;
  S.models=[];
  for(var i=0;i<MODELS.length;i++){
    var m=MODELS[i];
    S.models.push({i:i,id:m.id,n:m.n,b:m.b,t:m.t,retail:m.retail,base:m.base,vol:m.vol,hi:m.hi,sole:m.sole,acc:m.acc,
      price:m.base*(0.94+S.rngM()*0.10),hype:0,hist:[]});
  }
  S.cal=buildCal(S.rngM);
  for(var k=0;k<S.models.length;k++){
    S.models[k].hist.push(S.models[k].price);
    for(var z=0;z<9;z++){S.models[k].hist.unshift(S.models[k].price*(1-0.01*z));}
    S.models[k].hist.reverse();
  }
  applyDayEvents(0,0);
  marketTick();
  buildTicker();
  titleUI.classList.add('hide');
}
function sModel(mid){return S.models[MIDX[mid]];}
function heat(b){return BRANDS[b].heat;}
function fair(m){return m.base*(0.55+0.45*heat(m.b));}
function marketValue(m,grade){
  var mul=grade==='S'?1.5:grade==='A'?1.25:grade==='B'?1.08:1.0;
  return m.price*mul;
}
function heldValue(it){return marketValue(sModel(it.mid),it.grade)*0.92;}
function netWorth(){var v=S.cash,i;for(i=0;i<S.inv.length;i++)v+=heldValue(S.inv[i]);return v;}
function elapsedWeeks(){return Math.max(1,(S.week-1)+(S.day-1)/7);}
function scorePerWeek(){return (netWorth()-START_CASH)/elapsedWeeks();}

/* ---------------- calendar ----------------------------------------- */
function pickModel(rng){
  var w=[5,5,5,3,3,2,2,2,0.8];
  var total=0,i;for(i=0;i<MODELS.length;i++)total+=w[i]||1;
  var r=rng()*total;
  for(i=0;i<MODELS.length;i++){r-=(w[i]||1);if(r<=0)return MODELS[i];}
  return MODELS[0];
}
function buildCal(rng){
  var cal=[],w,d,i,j;
  for(w=0;w<WEEKS;w++){var wk=[];for(d=0;d<7;d++)wk.push([]);cal.push(wk);}
  cal[0][0].push({kind:'DROP',mid:'photon',done:false});
  cal[0][1].push({kind:'DROP',mid:'district',done:false});
  for(w=0;w<WEEKS;w++){
    var days=[0,1,2,3,4,5,6];
    for(i=6;i>0;i--){j=Math.floor(rng()*(i+1));var t=days[i];days[i]=days[j];days[j]=t;}
    var nd=2+Math.floor(rng()*3);
    // one drop per model per week: no duplicate silhouettes on the calendar
    var used={},d0,kk0;
    for(d0=0;d0<7;d0++)for(kk0=0;kk0<cal[w][d0].length;kk0++)if(cal[w][d0][kk0].kind==='DROP')used[cal[w][d0][kk0].mid]=1;
    for(i=0;i<nd&&i<7;i++){
      var di=days[i],has=false,kk;
      for(kk=0;kk<cal[w][di].length;kk++)if(cal[w][di][kk].kind==='DROP')has=true;
      if(has)continue;
      var pm=null,guard=0;
      while(guard++<40){var cand=pickModel(rng);if(!used[cand.id]){pm=cand;break;}}
      if(!pm)continue;
      used[pm.id]=1;
      cal[w][di].push({kind:'DROP',mid:pm.id,done:false});
    }
    var nn=1+Math.floor(rng()*2);
    for(i=0;i<nn;i++){
      var di2=days[4+(i%3)];
      if(cal[w][di2].length>0)continue;
      var r=rng(),m=pickModel(rng);
      if(r<0.34)cal[w][di2].push({kind:'HYPE',mid:m.id,done:false,amt:0.35+rng()*0.45});
      else if(r<0.68)cal[w][di2].push({kind:'RESTOCK',mid:m.id,done:false,amt:0.26+rng()*0.32});
      else cal[w][di2].push({kind:(rng()<0.5?'HEAT':'COLD'),brand:BK[Math.floor(rng()*4)],done:false,amt:0.12+rng()*0.10});
    }
  }
  return cal;
}
function evDay(w,d){if(!S.cal[w]||!S.cal[w][d])return [];return S.cal[w][d];}
function todayEvents(){return evDay(S.week-1,S.day-1);}
function todayDrop(){var e=todayEvents(),i;for(i=0;i<e.length;i++)if(e[i].kind==='DROP'&&!e[i].done)return e[i];return null;}
function applyDayEvents(w,d){
  var evs=evDay(w,d),i;
  for(i=0;i<evs.length;i++){
    var e=evs[i];
    if(e.kind==='DROP'){var m=sModel(e.mid);m.hype+=TIER[m.t].hype*(0.75+S.rngM()*0.55);}
    else if(e.kind==='HYPE'){sModel(e.mid).hype+=(e.amt||0.4);}
    else if(e.kind==='RESTOCK'){sModel(e.mid).hype-=(e.amt||0.3);if(sModel(e.mid).hype<-0.35)sModel(e.mid).hype=-0.35;}
    else if(e.kind==='HEAT'){BRANDS[e.brand].heat=Math.min(1.6,BRANDS[e.brand].heat+(e.amt||0.15));}
    else if(e.kind==='COLD'){BRANDS[e.brand].heat=Math.max(0.60,BRANDS[e.brand].heat-(e.amt||0.15));}
  }
}
function marketTick(){
  for(var i=0;i<S.models.length;i++){
    var m=S.models[i];
    m.hype*=0.90;if(Math.abs(m.hype)<0.002)m.hype=0;
    var target=fair(m)*(1+m.hype);
    var drift=(S.rngM()-0.5)*0.045*m.vol;
    m.price+=(target-m.price)*0.22+m.price*drift;
    if(m.price<8)m.price=8;
    m.hist.push(m.price);
    while(m.hist.length>26)m.hist.shift();
  }
}
function buildTicker(){
  var arr=[],i;
  for(i=0;i<S.models.length;i++){
    var m=S.models[i],h=m.hist;
    var prev=h.length>2?h[h.length-2]:m.price;
    arr.push({id:m.id,d:(m.price-prev)/Math.max(1,prev)});
  }
  arr.sort(function(a,b){return Math.abs(b.d)-Math.abs(a.d);});
  S.ticker=arr.slice(0,3);
}
function weekRoll(){
  for(var i=0;i<BK.length;i++){
    var b=BK[i];
    BRANDS[b].heat=Math.max(0.60,Math.min(1.6,BRANDS[b].heat+(S.rngM()-0.5)*0.16));
  }
}
function advanceDay(){
  if(S.over||S.phase==='over')return;
  // defensive: never let a stale modal block the day loop (headless/debug drivers)
  if(S.phase==='snipe'&&S.snipe)finishSnipe();
  if(S.phase==='auction'&&S.auction){if(!S.auction.done)hammer();closeAuction();}
  if(S.phase==='pair'||S.phase==='shop'||S.phase==='confirm')S.phase='market';
  S.day++;
  if(S.day>7){S.day=1;S.week++;weekRoll();}
  if(S.week>WEEKS){endRun(false);return;}
  applyDayEvents(S.week-1,S.day-1);
  marketTick();
  S.attempted=false;
  buildTicker();
  S.scrollTarget=0;
  // anti-softlock: broke and empty-handed earns a pawn-shop shift, never a dead end
  if(S.cash<60&&S.inv.length===0){S.cash+=45;pop(270,520,'PAWN SHOP SHIFT  +$45','#ffd23f',22);}
}

/* ---------------- snipe mini-game ----------------------------------- */
function openSnipe(mid){
  var m=sModel(mid);
  if(!m)return;
  if(S.attempted){ flash('#ff3355'); blocked('ONE SNIPE PER DAY'); return; }
  if(S.inv.length>=S.storage){flash('#ff3355');blocked('STORAGE FULL - FLIP OR UPGRADE');return;}
  if(S.cash<m.retail){flash('#ff3355');blocked('NOT ENOUGH CASH - ' + money(m.retail) + ' NEEDED');return;}
  var rng=S.rngS;
  S.snipe={mid:mid,pos:0,dir:1,t:0,count:1.6,go:false,zone:0.30+rng()*0.40,widen:1+(S.streak>=3?0.25:0),
    speed:TIER[m.t].speed*(0.92+rng()*0.16),result:null,resT:0,locked:false};
  S.phase='snipe';
  AU.riser();
  trauma(0.18);
}
function snipeGrade(d){
  var z=S.snipe.zone,wide=S.snipe.widen;
  if(d<0.050*wide)return 'PERFECT';
  if(d<0.110*wide)return 'GREAT';
  if(d<0.190*wide)return 'GOOD';
  return 'MISS';
}
function lockSnipe(force){
  var sn=S.snipe;if(!sn||sn.locked)return;
  if(force){
    if(force==='PERFECT')sn.pos=sn.zone;
    else if(force==='GREAT')sn.pos=sn.zone+0.055*sn.widen;
    else if(force==='GOOD')sn.pos=sn.zone+0.12*sn.widen;
    else sn.pos=sn.zone+0.30;
  }
  var d=Math.abs(sn.pos-sn.zone),g=snipeGrade(d);
  sn.locked=true;sn.result=g;sn.resT=0;
  S.attempted=true;S.attempts++;
  var m=sModel(sn.mid);
  var cx=90+sn.pos*360,cy=560;
  if(g==='MISS'){
    AU.miss();trauma(0.42);flash('#ff3355');burst(cx,cy,14,'#ff5a6e',260,0.6,3);
    pop(270,470,'MISSED','#ff7a8a',30);
    S.streak=0;
  }else{
    S.hits++;S.streak++;if(S.streak>S.bestStreak)S.bestStreak=S.streak;
    S.cash-=m.retail;
    AU.win();
    var power=g==='PERFECT'?1:g==='GREAT'?0.7:0.45;
    trauma(0.30+power*0.45);
    hitstop(g==='PERFECT'?0.09:0.05);
    burst(cx,cy,Math.round(16+power*26),TIER[m.t].c,300+power*220,0.8,3.6);
    pop(270,470,g,'#ffe066',32);
    if(S.streak>=3)pop(270,510,'STREAK x'+S.streak,'#7af0ff',20);
  }
}
function finishSnipe(){
  var sn=S.snipe;if(!sn)return;
  if(sn.result==='MISS'){S.snipe=null;S.phase='market';return;}
  var m=sModel(sn.mid);
  if(S.inv.length<S.storage)S.inv.push({mid:sn.mid,buy:m.retail,grade:'',graded:false,basis:m.retail,day:S.day+((S.week-1)*7),id:Math.floor(S.simT*1000)+'_'+S.inv.length});
  S.snipe=null;S.phase='market';
}

/* ---------------- auction ------------------------------------------- */
var BIDDERS=['kicks_kaz','SOLEja','deadstock_d','pumpqueen','retro_ray','mintbox','hype_hana','crepeking','boxfresh','lowball_lou'];
function openAuction(idx){
  if(idx<0||idx>=S.inv.length)return;
  var it=S.inv[idx],m=sModel(it.mid);
  var base=marketValue(m,it.grade);
  var floor=base*0.72,peak=base*(0.96+0.06*S.up.rep+Math.min(0.28,m.hype*0.18));
  var dur=7.4,bids=[],n=12+Math.floor(S.rngA()*6),i;
  for(i=0;i<n;i++){
    var t=(i+1)/n*dur*0.84;
    var u=n>1?i/(n-1):0;
    var amt=(floor+(peak-floor)*Math.pow(u,0.85))*(1+(S.rngA()-0.5)*0.05);
    bids.push({t:t,amt:amt,who:BIDDERS[Math.floor(S.rngA()*BIDDERS.length)],kind:'bid'});
  }
  var finale=S.rngA()<0.55?'bump':'dip';
  if(finale==='bump'){
    bids.push({t:dur*0.90,amt:peak*(1.05+S.rngA()*0.07),who:BIDDERS[Math.floor(S.rngA()*BIDDERS.length)],kind:'bid'});
  }else{
    var pk=bids[bids.length-1].amt;
    bids.push({t:dur*0.88,amt:pk*(0.76+S.rngA()*0.07),who:'OUTBID_RETRACT',kind:'retract'});
    bids.push({t:dur*0.96,amt:pk*(0.84+S.rngA()*0.07),who:BIDDERS[Math.floor(S.rngA()*BIDDERS.length)],kind:'bid'});
  }
  S.auction={idx:idx,mid:it.mid,it:it,dur:dur,t:0,bids:bids,top:base*0.70,who:'',list:[],done:false,
    sale:0,net:0,profit:0,t0:S.simT,lastIdx:-1,feeFinal:0,peak:peak,base:base};
  S.phase='auction';
  AU.riser();
  trauma(0.25);
}
function auctionFee(){return Math.max(0.05,0.10-0.01*S.up.rep);}
function hammer(){
  var A=S.auction;if(!A||A.done)return;
  A.done=true;
  A.sale=Math.max(1,A.top);
  A.feeFinal=A.sale*auctionFee();
  A.net=A.sale-A.feeFinal;
  A.profit=A.net-A.it.basis;
  if(A.profit>0){AU.cash();pop(270,430,'+'+money(A.profit),'#7dffa8',34);trauma(0.5);hitstop(0.08);
    burst(270,470,30,'#7dffa8',340,0.9,4);}
  else{AU.sold();pop(270,430,money(A.profit),'#ff7a8a',34);trauma(0.6);flash('#ff3355');
    burst(270,470,22,'#ff5a6e',260,0.8,3.6);}
  AU.sold();
  S.flips++;
  if(A.profit>S.bestFlip)S.bestFlip=A.profit;
  if(A.profit<S.worstFlip)S.worstFlip=A.profit;
  S.earned+=A.profit;
}
function closeAuction(){
  var A=S.auction;if(!A)return;
  if(!A.done){hammer();return;}
  S.cash+=A.net;
  S.inv.splice(A.idx,1);
  S.auction=null;S.phase='market';
  if(S.cash<0)S.cash=0;
}

/* ---------------- upgrades / run end -------------------------------- */
function upCost(k){var u=UPG[k],lvl=S.up[k];return Math.round(u.base*Math.pow(u.mult,lvl));}
function buyUpgrade(k){
  var u=UPG[k],lvl=S.up[k];
  if(lvl>=u.max){S.shopMsg='MAXED';S.shopMsgT=1.4;return;}
  var c=upCost(k);
  if(S.cash<c){S.shopMsg='NOT ENOUGH CASH';S.shopMsgT=1.4;flash('#ff3355');return;}
  S.cash-=c;S.up[k]=lvl+1;
  if(k==='storage')S.storage=3+2*S.up.storage;
  if(k==='rep')S.rep=S.up.rep;
  S.shopMsg=u.n+' UPGRADED';S.shopMsgT=1.4;
  AU.cash();trauma(0.25);burst(270,300,18,'#7af0ff',260,0.7,3);
}
function gradeFee(m){return Math.round((30+TIER[m.t].tc)*(1-0.15*S.up.grade));}
function gradePair(idx){
  var it=S.inv[idx];if(!it)return;
  /* the pop says why in every phase; the shop-line duplicate was noise */
  if(it.graded){flash('#ff3355');blocked('ALREADY GRADED');return;}
  var m=sModel(it.mid),f=gradeFee(m);
  if(S.cash<f){flash('#ff3355');blocked('GRADING FEE ' + money(f) + ' - NOT ENOUGH CASH');return;}
  S.cash-=f;it.graded=true;it.basis+=f;
  var r=S.rngS(),pS=0.08+0.045*S.up.grade,pA=0.27+0.035*S.up.grade;
  it.grade=r<pS?'S':(r<pS+pA?'A':'B');
  AU.cash();hitstop(0.05);trauma(0.3);
  pop(270,360,'GRADE '+it.grade,'#ffd23f',32);
  burst(270,380,20,'#ffd23f',240,0.8,3.4);
}
function endRun(cashed){
  S.over=true;S.phase='over';
  S.summary={score:scorePerWeek(),weeks:elapsedWeeks(),net:netWorth()-START_CASH,
    worth:netWorth(),best:S.bestFlip,worst:S.worstFlip,flips:S.flips,
    acc:S.attempts?Math.round(S.hits/S.attempts*100):0,streak:S.bestStreak};
  if(SAVE.best===undefined||S.summary.score>SAVE.best){SAVE.best=S.summary.score;SAVE.bestSeed=S.seed;}
  SAVE.runs=(SAVE.runs||0)+1;
  SAVE.lastSeed=S.seed;
  putSave(SAVE);
  AU.bed(false);
  AU.cash();trauma(0.5);
}
function rankOf(v){
  if(v<0)return 'BAG HOLDER';
  if(v<40)return 'PART-TIME RESELLER';
  if(v<90)return 'SOLE BROKER';
  if(v<170)return 'HYPE ARCHITECT';
  if(v<300)return 'MARKET MAKER';
  return 'DROP GOD';
}

function spark(x,y,w,h,hist,col){
  ctx.save();
  rr(ctx,x,y,w,h,6);ctx.fillStyle='rgba(255,255,255,.05)';ctx.fill();
  if(hist.length>1){
    var mn=1e9,mx=-1e9,i;for(i=0;i<hist.length;i++){if(hist[i]<mn)mn=hist[i];if(hist[i]>mx)mx=hist[i];}
    if(mx-mn<0.001)mx=mn+1;
    ctx.beginPath();
    for(i=0;i<hist.length;i++){
      var px=x+3+(i/(hist.length-1))*(w-6),py=y+h-5-((hist[i]-mn)/(mx-mn))*(h-10);
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.strokeStyle=col;ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.stroke();
    var lx=x+w-3,ly=y+h-5-((hist[hist.length-1]-mn)/(mx-mn))*(h-10);

}

/* ---------------- update ------------------------------------------- */
function update(dt){
  S.simT+=dt;
  S.trauma=Math.max(0,S.trauma-dt*1.6);
  if(S.stopT>0){S.stopT-=dt;if(S.stopT<=0)S.timeScale=1;}
  S.flash=Math.max(0,S.flash-dt*2.4);
  if(S.shopMsgT>0)S.shopMsgT-=dt;
  S.scroll+=(S.scrollTarget-S.scroll)*Math.min(1,dt*12);
  var sh=S.trauma*S.trauma*15*SHAKEK;
  shakeX=(Math.sin(S.simT*61.3)+Math.sin(S.simT*37.7))*sh*0.5;
  shakeY=(Math.cos(S.simT*53.1)+Math.sin(S.simT*29.3))*sh*0.5;
  for(var i=0;i<P_MAX;i++){
    var p=parts[i];if(!p.live)continue;
    p.life-=dt;
    if(p.life<=0){p.live=false;continue;}
    p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.99;
  }
  for(var j=pops.length-1;j>=0;j--){
    pops[j].life-=dt;
    if(pops[j].life<=0)pops.splice(j,1);
  }
  if(S.phase==='snipe'&&S.snipe){
    var sn=S.snipe;
    if(sn.count>0){sn.count-=dt;if(sn.count<=0){sn.count=0;sn.t=0;}}
    else if(!sn.locked){
      sn.t+=dt*sn.speed;
      var ph=sn.t%2;
      sn.pos=ph<1?ph:2-ph;
      if(sn.pos>1)sn.pos=1;
      if(sn.pos<0)sn.pos=0;
    }else{
      sn.resT+=dt;
      if(sn.resT>1.5&&sn.result==='MISS')finishSnipe();
    }
  }
  if(S.phase==='auction'&&S.auction){
    var A=S.auction;
    if(!A.done){
      A.t+=dt;
      while(A.lastIdx+1<A.bids.length&&A.bids[A.lastIdx+1].t<=A.t){
        A.lastIdx++;
        var b=A.bids[A.lastIdx];
        A.top=b.amt;A.who=b.who;
        A.list.push(b);
        if(b.kind==='retract'){flash('#ff3355');trauma(0.45);burst(380,420,18,'#ff5a6e',240,0.6,3);
          pop(270,470,'RETRACTED','#ff8a98',22);}
        else{AU.bid(A.lastIdx);trauma(0.12+0.02*A.lastIdx);
          if(A.lastIdx%2===0)burst(120,420,6,'#7dffa8',160,0.5,2.6);}
      }
      if(A.t>=A.dur)hammer();
    }
  }
}
var acc=0,last=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=(ts-last)/1000;last=ts;
  if(dt>0.25)dt=0.25;
  acc+=dt*S.timeScale;
  var steps=0;
  while(acc>=FIXED&&steps<5){update(FIXED);acc-=FIXED;steps++;}
  if(steps>=5)acc=0;
  render();
}

/* ---------------- input --------------------------------------------- */
function toLocal(e){
  var r=cv.getBoundingClientRect();
  var s=Math.min(r.width/LW,r.height/LH);
  var ox=(r.width-LW*s)/2, oy=(r.height-LH*s)/2;
  return {x:(e.clientX-r.left-ox)/s,y:(e.clientY-r.top-oy)/s};
}
function findHot(p){
  for(var i=HOT.length-1;i>=0;i--){
    var h=HOT[i];
    if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h)return h;
  }
  return null;
}
var downPt=null,downHot=null;
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();

  var h=findHot(p);
  downPt={x:p.x,y:p.y,t:performance.now()};downHot=h;
  if(h&&!h.opt.late&&h.fn)h.fn();
  if(!h){
    if(S.phase==='pair'||S.phase==='shop'||S.phase==='confirm'){S.phase='market';}
    downPt=null;downHot=null;
  }
},{passive:false});
cv.addEventListener('pointermove',function(e){
  if(!downPt)return;
  var p=toLocal(e);

    if(S.phase==='market'){
      var maxS=Math.max(0,S.inv.length*64-198);
      S.scroll=Math.max(0,Math.min(maxS,S.scroll+dy));
      S.scrollTarget=S.scroll;
    }

  }
},{passive:false});
cv.addEventListener('pointerup',function(e){
  if(!downPt)return;
  var p=toLocal(e);
  var moved=Math.abs(p.x-downPt.x)+Math.abs(p.y-downPt.y);
  if(downHot&&downHot.opt.late&&moved<12&&downHot.fn)downHot.fn();
  downPt=null;downHot=null;

window.addEventListener('wheel',function(e){

window.addEventListener('keydown',function(e){
  var k=e.key;
  if(S.phase==='title'){if(k===' '||k==='Enter'||k==='ArrowRight'){e.preventDefault();startGame();}return;}
  if(k===' '||k==='Enter'){
    e.preventDefault();
    if(S.phase==='snipe'){if(S.snipe&&!S.snipe.locked&&S.snipe.count<=0)lockSnipe();}
    else if(S.phase==='auction'){hammer();}
    else if(S.phase==='market'){advanceDay();}
    else if(S.phase==='over'){restartRun(S.seed);}
    else if(S.phase==='confirm'){endRun(true);}
    else if(S.phase==='shop'){S.phase='market';}
    else if(S.phase==='pair'){S.phase='market';}
    return;
  }
  if(k==='ArrowDown'||k==='ArrowUp'){
    e.preventDefault();
    if(S.phase==='market'&&S.inv.length){
      S.pairSel=(S.pairSel+(k==='ArrowDown'?1:-1)+S.inv.length)%S.inv.length;
      S.scrollTarget=Math.max(0,Math.min(Math.max(0,S.inv.length*64-198),S.pairSel*64-80));
    }
    return;
  }
  if(k==='ArrowRight'){e.preventDefault();if(S.phase==='market')advanceDay();return;}
  if(k==='ArrowLeft'){e.preventDefault();if(S.phase==='auction')hammer();return;}
  if(k==='s'||k==='S'){if(S.phase==='market')S.phase='shop';else if(S.phase==='shop')S.phase='market';return;}
  if(k==='Escape'){if(S.phase==='pair'||S.phase==='shop'||S.phase==='confirm')S.phase='market';}

  newRun(seed);
  AU.bed(true);
  setTimeout(function(){titleUI.classList.add('hide');},30);
}

/* ---------------- boot ---------------------------------------------- */
resize();
newRun(dailySeed());
S.phase='title';S.over=false;
titleUI.classList.remove('hide');
sndBtn.textContent='SOUND: '+(AU.on?'ON':'OFF');
requestAnimationFrame(frame);

/* ---------------- debug hook ---------------------------------------- */
window.__DEBUG={
  seed:function(){return S.seed;},
  state:function(){return {phase:S.phase,week:S.week,day:S.day,cash:Math.round(S.cash),
    net:Math.round(netWorth()-START_CASH),worth:Math.round(netWorth()),
    inv:S.inv.length,storage:S.storage,rep:S.rep,streak:S.streak,
    score:+(scorePerWeek().toFixed(2)),over:S.over,seed:S.seed,
    models:S.models.length,weeks:WEEKS,audio:SFX.stats()};},
  start:function(seed){newRun(seed===undefined?dailySeed():seed);return S.seed;},
  grant:function(n){S.cash+=n;return S.cash;},
  market:function(){return S.models.map(function(m){return {id:m.id,n:m.n,t:m.t,b:m.b,
    retail:m.retail,price:+m.price.toFixed(2),fair:+fair(m).toFixed(2),hype:+m.hype.toFixed(3),
    heat:+heat(m.b).toFixed(3)};});},
  calendar:function(){return S.cal.map(function(w){return w.map(function(evs){
    return evs.map(function(e){return e.kind+':'+(e.mid||e.brand)+(e.done?'*':'');});});});},
  today:function(){return todayEvents().map(function(e){return {kind:e.kind,mid:e.mid,brand:e.brand,done:!!e.done};});},
  inventory:function(){return S.inv.map(function(it,i){return {i:i,mid:it.mid,grade:it.grade,
    buy:it.buy,basis:it.basis,value:+marketValue(sModel(it.mid),it.grade).toFixed(2)};});},
  snipe:function(mid){if(!mid){var d=todayDrop();mid=d?d.mid:null;}if(mid)openSnipe(mid);return S.phase;},
  lock:function(force){lockSnipe(force);return S.snipe?S.snipe.result:null;},
  finishSnipe:function(){finishSnipe();},
  flip:function(i){openAuction(i===undefined?0:i);return S.phase;},
  hammer:function(){hammer();return S.auction?S.auction.profit:null;},
  closeAuction:function(){closeAuction();},
  nextDay:function(n){n=n||1;for(var i=0;i<n;i++){if(!S.over)advanceDay();}return {week:S.week,day:S.day};},
  shopBuy:function(k){buyUpgrade(k);return S.up;},
  gradePair:function(i){gradePair(i);return S.inv[i]?S.inv[i].grade:null;},
  cashOut:function(){endRun(true);return S.summary;},
  shareCard:saveCard,
  hotRect:function(id){for(var i=0;i<HOT.length;i++){if(HOT[i].id===id)return {x:HOT[i].x,y:HOT[i].y,w:HOT[i].w,h:HOT[i].h};}return null;},
  view:function(){return {gs:gs,offX:offX,offY:offY};},
  setSound:setSound
};
})();
</script>
</body>
</html>
