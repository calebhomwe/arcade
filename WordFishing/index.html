<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../assets/arcade-sdk.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1f5f7a">
<link rel="icon" href="data:,">
<title>FISHING FOR WORDS</title>
<style>
  @font-face{font-family:"Fredoka";src:url("../assets/fonts/fredoka.woff2") format("woff2");font-weight:300 700;font-display:swap}
  @font-face{font-family:"Nunito";src:url("../assets/fonts/nunito.woff2") format("woff2");font-weight:400 900;font-display:swap}
/*@kidlookcss*/
/* KL css: the same surfaces as the canvas kit, for DOM panels: parchment, wood with gold trim, navy glass, glossy buttons */
:root{--kl-ink:#4a2d12;--kl-ink2:#7a5428;--kl-cream:#fff3d2;--kl-gold:#ffe7a0;--kl-goldd:#b8781a;--kl-font:"Fredoka","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;
  --kl-grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='4'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
.kl-parch,.kl-wood,.kl-glass{position:relative;font-family:var(--kl-font)}
.kl-parch::before,.kl-wood::before,.kl-glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background-image:var(--kl-grain);mix-blend-mode:overlay;opacity:.32}
.kl-parch{background:linear-gradient(180deg,#f9edcb,#efdaa9 55%,#e0c68e);border:1px solid #b88a4a;border-radius:18px;color:var(--kl-ink);
  box-shadow:0 10px 26px rgba(30,14,4,.5),inset 0 0 0 2px rgba(255,255,255,.35),inset 0 0 36px rgba(130,88,34,.42)}
.kl-wood{background:repeating-linear-gradient(180deg,rgba(255,224,176,.05) 0 1px,rgba(20,8,2,.07) 1px 3px),linear-gradient(180deg,#a2703f,#77492a 45%,#54301a);border-radius:16px;color:var(--kl-cream);
  box-shadow:inset 0 0 0 2px #e2b040,inset 0 0 0 3px #6b430a,inset 0 3px 0 4px rgba(255,236,200,.12),0 8px 20px rgba(0,0,0,.5)}
.kl-glass{background:linear-gradient(180deg,#2a4674,#132546 55%,#0b1730);border:1px solid rgba(190,215,255,.32);border-radius:16px;color:var(--kl-gold);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 18px rgba(0,0,0,.5)}
.kl-btn{font-family:var(--kl-font);font-weight:700;cursor:pointer;color:#4a2c08;border:1px solid #6b430a;border-radius:15px;padding:0 18px;min-height:48px;letter-spacing:.2px;
  background:linear-gradient(180deg,#ffe89a,#e8b338 52%,#a8721a);text-shadow:0 1px 0 rgba(255,246,214,.75);
  box-shadow:0 4px 0 #6b430a,0 8px 14px rgba(20,8,2,.45),inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 0 rgba(120,70,8,.35);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.kl-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6b430a,0 3px 8px rgba(20,8,2,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.kl-btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.kl-btn.green{color:#f4ffe8;border-color:#1d4a19;background:linear-gradient(180deg,#b7ec8c,#58ad46 52%,#2f7229);text-shadow:0 1px 1px rgba(20,60,16,.8);box-shadow:0 4px 0 #1d4a19,0 8px 14px rgba(20,8,2,.45),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(20,60,16,.35)}
.kl-btn.blue{color:#eef8ff;border-color:#173d6b;background:linear-gradient(180deg,#a6d6f8,#4a8fd0 52%,#2760a0);text-shadow:0 1px 1px rgba(10,30,70,.8);box-shadow:0 4px 0 #173d6b,0 8px 14px rgba(20,8,2,.45),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(10,30,70,.35)}
.kl-btn.coral{color:#fff4ee;border-color:#5e1d0f;background:linear-gradient(180deg,#f8b39a,#d9603f 52%,#9a3520);text-shadow:0 1px 1px rgba(70,16,6,.8);box-shadow:0 4px 0 #5e1d0f,0 8px 14px rgba(20,8,2,.45),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(70,16,6,.35)}
.kl-btn.wood{color:var(--kl-cream);border-color:#341e0b;background:linear-gradient(180deg,#b98657,#8a5a30 52%,#5a3719);text-shadow:0 1px 1px rgba(30,14,4,.8);box-shadow:0 4px 0 #341e0b,0 8px 14px rgba(20,8,2,.45),inset 0 1px 0 rgba(255,236,200,.4),inset 0 -2px 0 rgba(30,14,4,.4)}
.kl-btn.cream{border-color:#7a5a2a;background:linear-gradient(180deg,#fffaf0,#f0e2c4 52%,#d4b988);box-shadow:0 4px 0 #7a5a2a,0 8px 14px rgba(20,8,2,.4),inset 0 1px 0 #fff,inset 0 -2px 0 rgba(120,80,30,.25)}
.kl-btn.plum{color:#fbf2ff;border-color:#3b2260;background:linear-gradient(180deg,#d8b8f0,#9a64c8 52%,#623e92);text-shadow:0 1px 1px rgba(40,16,70,.8);box-shadow:0 4px 0 #3b2260,0 8px 14px rgba(20,8,2,.45),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(40,16,70,.35)}
.kl-btn:disabled,.kl-btn[disabled]{filter:grayscale(.7) brightness(.8);cursor:default;transform:none}
.kl-title{font-family:var(--kl-font);font-weight:700;background:linear-gradient(180deg,#fff4b0,#f0c040 55%,#c08a20);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 0 rgba(30,6,12,.75)) drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.kl-trough{height:12px;border-radius:8px;background:rgba(110,70,26,.32);box-shadow:inset 0 2px 3px rgba(60,30,8,.45);overflow:hidden}
.kl-trough>i{display:block;height:100%;border-radius:8px;background:linear-gradient(180deg,#b6ea86,#58ad46 60%,#3f8f3a);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.kl-trough.gold>i{background:linear-gradient(180deg,#ffe28a,#e8b338 60%,#c08a20)}
/*@end*/

  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#123a52;overscroll-behavior:none;
    font-family:"Nunito","Fredoka",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
  .hidden{display:none !important}
  .ovr{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
    overflow:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,rgba(6,16,32,0) 0,rgba(6,16,32,.25) 40%,rgba(6,16,32,.5) 100%);color:#fff3d2}
  .ovr>*{flex:none}
  .logo{font-size:clamp(36px,11vw,52px);line-height:.95;text-align:center;margin-top:4px}
  .logo small{display:block;font-size:.42em;letter-spacing:.14em;text-transform:uppercase;margin:2px 0}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .chips b{font-family:var(--kl-font);font-size:17px;padding:8px 14px;border-radius:999px;min-height:20px}
  .pondpick{display:flex;align-items:center;gap:10px;width:min(100%,380px);box-sizing:border-box;padding:10px}
  .pondpick .arr{min-width:48px;min-height:48px;padding:0;font-size:18px}
  .pcard{flex:1;text-align:center;min-width:0}
  .pname{font-family:var(--kl-font);font-weight:700;font-size:20px;line-height:1.15}
  .psub{font-size:14px;color:var(--kl-ink2);margin:2px 0 6px;font-weight:700}
  .playrow{display:flex;gap:12px;width:min(100%,380px)}
  .play{flex:1;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:20px;border-radius:20px;letter-spacing:.3px}
  .play em{font-style:normal;font-size:30px;line-height:1.05;letter-spacing:2px}
  .play span{font-size:17px}
  .icons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,380px)}
  .ic{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;min-height:64px;border-radius:16px;font-size:13px;line-height:1.1}
  .ic i{font-style:normal;font-size:24px;line-height:1.1}
  .bands{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .bands button{min-height:44px;font-size:15px;padding:0 14px}
  .bands button.on{filter:none}
  .bands button:not(.on){opacity:.72}
  .daily{width:min(100%,380px);box-sizing:border-box;padding:10px 14px;font-size:15px}
  .daily b{font-family:var(--kl-font);font-size:16px}
  .daily .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .de-card{width:min(100%,400px);box-sizing:border-box;padding:16px 16px 14px;text-align:center}
  .de-card h2{font-family:var(--kl-font);font-size:28px;margin:0 0 4px;color:#a03a10}
  .de-card p{margin:4px 0;font-size:16px;color:var(--kl-ink2);font-weight:700}
  .starsbig{font-size:52px;line-height:1;letter-spacing:6px;margin:4px 0 2px}
  .starsbig .on{color:#f2b628;text-shadow:0 2px 0 #8a5a0a,0 0 14px rgba(255,200,60,.7)}
  .starsbig .off{color:rgba(110,70,26,.3)}
  .de-stats{display:flex;gap:8px;justify-content:center;margin:8px 0}
  .de-stats div{flex:1;background:rgba(110,70,26,.12);border-radius:12px;padding:6px 4px}
  .de-stats b{display:block;font-family:var(--kl-font);font-size:24px;color:var(--kl-ink)}
  .de-stats span{font-size:12px;letter-spacing:.06em;color:var(--kl-ink2);font-weight:800}
  .newfish{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
  .newfish figure{margin:0;text-align:center;font-size:12px;font-weight:800;color:var(--kl-ink2)}
  .btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .btnrow .kl-btn{min-width:96px}
  .panel-h{font-family:var(--kl-font);font-size:22px;margin:0;text-align:center}
  .bookwrap,.shopwrap{width:min(100%,420px);box-sizing:border-box;padding:12px}
  .tabs{display:flex;gap:6px;justify-content:center;margin:8px 0}
  .tabs button{min-width:48px;min-height:48px;padding:0;font-size:22px}
  .tabs button.on{filter:none;box-shadow:0 1px 0 #6b430a,0 0 0 3px #fff3d2,0 4px 10px rgba(0,0,0,.4)}
  .bookgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .fcard{background:rgba(255,250,236,.55);border-radius:12px;padding:6px 4px 8px;text-align:center;min-height:98px;box-shadow:inset 0 0 0 1px rgba(150,100,40,.35)}
  .fcard canvas{width:100%;height:56px;display:block}
  .fcard b{display:block;font-family:var(--kl-font);font-size:14px;color:var(--kl-ink);line-height:1.15}
  .fcard span{font-size:12px;color:var(--kl-ink2);font-weight:800}
  .shopgrid{display:grid;grid-template-columns:1fr;gap:8px;margin:8px 0}
  .gear{display:flex;align-items:center;gap:10px;background:rgba(255,250,236,.5);border-radius:14px;padding:8px 10px;box-shadow:inset 0 0 0 1px rgba(150,100,40,.35)}
  .gear i{font-style:normal;font-size:30px}
  .gear div{flex:1;min-width:0}
  .gear b{display:block;font-family:var(--kl-font);font-size:16px;color:var(--kl-ink)}
  .gear span{font-size:13px;color:var(--kl-ink2);font-weight:700}
  .gear .kl-btn{min-height:44px;font-size:14px;padding:0 12px}
  .hatgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .hatgrid button{display:flex;flex-direction:column;align-items:center;padding:6px 2px;min-height:82px;font-size:12px;line-height:1.1}
  .hatgrid canvas{width:56px;height:44px;display:block}
  .hatgrid .sel{outline:3px solid #fff3d2;outline-offset:1px}
  #hintBtn{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:9;width:56px;height:56px;padding:0;font-size:26px;border-radius:50%}
  #coach{position:fixed;left:50%;top:190px;transform:translateX(-50%);z-index:9;width:min(440px,calc(100vw - 24px));box-sizing:border-box;padding:10px 12px;font-size:15px;line-height:1.4;display:flex;gap:10px;align-items:center;font-family:var(--kl-font)}
  #coach b{color:#ffd76a}
  #coach small{display:block;font-size:12px;color:#c9b98a;letter-spacing:1px}
  #coach button{flex:none;min-height:44px;padding:0 14px}
  .lk{background:rgba(110,70,26,.1);border-radius:12px;padding:8px 12px;margin-top:10px;text-align:left}
  .lk h3{margin:0 0 4px;font-size:14px;color:var(--kl-ink);letter-spacing:.06em;font-family:var(--kl-font)}
  .lk-p{font-size:14px;color:var(--kl-ink2);margin:4px 0;font-weight:700;max-width:none;text-align:left}
  .lk-p b{color:var(--kl-ink)}
  .lk-next{color:#2f6d2a}
  .lk-t{width:100%;border-collapse:collapse;font-size:14px;color:var(--kl-ink)}
  .lk-t td{padding:3px 4px;border-bottom:1px solid rgba(110,70,26,.25)}
  .lk-t td+td{text-align:right;width:56px;color:var(--kl-ink2)}
  @media (min-aspect-ratio:13/10) and (max-height:520px){
    .ovr{display:grid;grid-template-columns:1fr 1fr;align-content:center;justify-items:center;column-gap:18px;row-gap:8px}
    .logo{grid-column:1;font-size:clamp(28px,7vh,40px);margin:0}.chips{grid-column:1}.pondpick{grid-column:1}
    .playrow,.icons,.bands,.daily{grid-column:2}
    .playrow{grid-row:1/span 1}
    .play{min-height:60px}.ic{min-height:54px}
    #dayend .de-card,#book .bookwrap,#shop .shopwrap,#grown .de-card{grid-column:1/span 2}
  }
  @media (prefers-reduced-motion:reduce){.kl-btn{transition:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="menu" class="ovr">
  <div class="logo kl-title"><span>Fishing</span><small>for</small><span>Words</span></div>
  <div class="chips"><b class="kl-glass" id="c-stars">⭐ 0</b><b class="kl-glass" id="c-coins">🪙 0</b><b class="kl-glass" id="c-streak">🔥 0</b></div>
  <div class="pondpick kl-parch">
    <button id="pond-l" class="kl-btn wood arr" aria-label="Previous pond">◀</button>
    <div class="pcard"><div class="pname" id="pond-name"></div><div class="psub" id="pond-sub"></div><div class="kl-trough gold" id="pond-bar"><i style="width:0"></i></div></div>
    <button id="pond-r" class="kl-btn wood arr" aria-label="Next pond">▶</button>
  </div>
  <div class="playrow">
    <button id="btn-spell" class="kl-btn green play"><em>ABC</em><span>Spell</span></button>
    <button id="btn-math" class="kl-btn blue play"><em>123</em><span>Maths</span></button>
  </div>
  <div class="icons">
    <button id="btn-book" class="kl-btn cream ic"><i>📖</i><span>Fish book</span></button>
    <button id="btn-shop" class="kl-btn cream ic"><i>🛒</i><span>Shop</span></button>
    <button id="btn-tut" class="kl-btn cream ic"><i>❓</i><span>How to fish</span></button>
    <button id="btn-grown" class="kl-btn cream ic"><i>👪</i><span>Grown-ups</span></button>
  </div>
  <div id="m-bands" class="bands" role="group" aria-label="Age band"></div>
  <div id="m-daily" class="daily kl-parch"></div>
</div>

<div id="dayend" class="ovr hidden">
  <div class="de-card kl-parch">
    <h2 id="de-title">Trip complete!</h2>
    <div id="de-stars" class="starsbig"></div>
    <p id="de-line"></p>
    <div class="de-stats">
      <div><b id="de-earn">0</b><span>COINS</span></div>
      <div><b id="de-kept">0</b><span>GOOD CATCHES</span></div>
      <div><b id="de-coins">0</b><span>COIN BANK</span></div>
    </div>
    <div id="de-new" class="newfish"></div>
    <div id="de-daily"></div>
    <div class="lk" id="de-report"><h3>FOR GROWN-UPS: THIS TRIP</h3><div id="de-report-body"></div></div>
    <div class="btnrow">
      <button id="btn-nextday" class="kl-btn green">Next trip</button>
      <button id="btn-shop2" class="kl-btn wood">Shop</button>
      <button id="btn-menu" class="kl-btn cream">Home</button>
    </div>
  </div>
</div>

<div id="book" class="ovr hidden" role="dialog" aria-label="Fish book">
  <div class="bookwrap kl-parch">
    <h2 class="panel-h">Fish book <span id="bk-count"></span></h2>
    <div class="tabs" id="bk-tabs"></div>
    <div class="bookgrid" id="bk-grid"></div>
    <div class="btnrow"><button id="bk-back" class="kl-btn cream">Back</button></div>
  </div>
</div>

<div id="shop" class="ovr hidden" role="dialog" aria-label="Shop">
  <div class="shopwrap kl-parch">
    <h2 class="panel-h">Shop <span id="sh-coins"></span></h2>
    <div class="shopgrid" id="sh-gear"></div>
    <h2 class="panel-h" style="font-size:18px;margin-top:6px">Hats</h2>
    <div class="hatgrid" id="sh-hats"></div>
    <div class="btnrow"><button id="sh-back" class="kl-btn cream">Back</button></div>
  </div>
</div>

<div id="grown" class="ovr hidden" role="dialog" aria-label="For grown-ups">
  <div class="de-card kl-parch">
    <h2>For grown-ups</h2>
    <p>What has been practised, how accurate it was, and what to practise next.</p>
    <div class="lk" id="grown-body"></div>
    <div class="btnrow"><button id="grown-back" class="kl-btn cream">Back</button></div>
  </div>
</div>

<button id="hintBtn" class="kl-btn hidden" aria-label="Hint">💡</button>
<div id="coach" class="kl-glass hidden" role="status" aria-live="polite"><div style="flex:1"><small id="coach-step"></small><span id="coach-text"></span></div>
  <button id="coach-skip" class="kl-btn cream">Skip</button></div>

<script>
"use strict";
/* ============================================================ FISHING FOR WORDS
   Cast to the fish you want, tap the strike ring, keep the fish that has the next
   letter (or the weight that answers the sum). Five waters to unlock, a Fish Book
   of thirty species, a wardrobe of hats, gear to buy, a daily goal and a streak.
   Single file, zero network, Canvas 2D + DOM, everything drawn in code with a small
   "rich look" kit (KL): warm light, layered depth, wood, parchment, gold, glass.
   Question core: tiered generators + grade-tiered sentence-clue word bank with
   one-line teaching hints. Nothing here punishes a wrong answer: it teaches.
   ========================================================================= */
const METakey = "wordfishing_meta_v1";
const QUOTA = {spell:2, math:4};                 // words per trip / correct keeps per trip
const BAIT_TRIP = [16,20,24];                    // bucket tier -> bait per trip
const ROD_WIN    = [28,40,54];                   // rod tier -> strike ring half-window (px, generous for small fingers)
const ROD_NAME   = ["Bamboo Rod","Fibreglass Rod","Golden Rod"];
const LURE_NAME  = ["Plain Worm","Sparkle Bait","Golden Bait"];
const BUCKET_NAME= ["Tin Can","Wooden Pail","Big Barrel"];
const LURE_REACH = [92,120,150];                 // px: how far a fish will swim to your bait
const RARITY_MULT = {common:1, rare:2, legendary:5};
const RING_SPEED = [46,60,78];                   // by age band: ring closing speed (px/s)
const DAILY_GOAL = 8;

const RM = matchMedia("(prefers-reduced-motion: reduce)");
const R  = (a,b)=>a+Math.random()*(b-a);
const RI = (a,b)=>Math.floor(R(a,b+1));
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const pick = arr=>arr[Math.floor(Math.random()*arr.length)];
function shuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function lerp(a,b,t){ return a+(b-a)*t; }
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const easeOutCubic=t=>1-Math.pow(1-t,3);
const TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dayBefore=iso=>{const [y,m,d]=iso.split('-').map(Number);const t=new Date(y,m-1,d-1);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};
/* a sound-effect call that can never throw */
const SDK=window.ArcadeSDK||null;
window.addEventListener('unhandledrejection',e=>{try{if(e.reason&&/decod|encoding/i.test(String(e.reason.message||e.reason.name||e.reason)))e.preventDefault();}catch(_){}});
function kit(name,o){ try{ if(SDK&&SDK.sfx) SDK.sfx(name,o||{}); }catch(e){} }
function buzz(ms){ try{ if(navigator.vibrate&&!RM.matches) navigator.vibrate(ms); }catch(e){} }

/* ═══════════ meta progress (localStorage): the old keys stay, new ones are added ═══════════ */
function defMeta(){ return {coins:0, bestDay:0, words:0, mathCorrect:0, casts:0, trophies:[], gear:{rod:0,lure:0,bucket:0},
  stars:0, pond:0, hat:0, hats:[0], book:{}, daily:{d:'',n:0,got:0}, streak:{last:'',n:0,best:0}, trips:0, voice:1}; }
function loadMeta(){
  const d = defMeta();
  try { const m = JSON.parse(localStorage.getItem(METakey));
    if (m && typeof m==="object"){
      for (const k of ["coins","bestDay","words","mathCorrect","casts","stars","pond","hat","trips"]) d[k] = +m[k]||0;
      if (Array.isArray(m.trophies)) d.trophies = m.trophies.slice(-30);
      if (m.gear) for (const k of ["rod","lure","bucket"]) d.gear[k] = clamp(+m.gear[k]||0,0,2);
      if (Array.isArray(m.hats)) d.hats = m.hats.map(Number).filter(n=>n>=0&&n<6);
      if (!d.hats.includes(0)) d.hats.push(0);
      if (m.book && typeof m.book==="object") d.book = m.book;
      if (m.daily && typeof m.daily==="object"){ d.daily.d=String(m.daily.d||''); d.daily.n=+m.daily.n||0; d.daily.got=+m.daily.got||0; }
      if (m.streak && typeof m.streak==="object"){ d.streak.last=String(m.streak.last||''); d.streak.n=+m.streak.n||0; d.streak.best=+m.streak.best||0; }
      d.voice = m.voice===0?0:1;
    } } catch(e){}
  return d;
}
function saveMeta(m){ try { localStorage.setItem(METakey, JSON.stringify(m)); } catch(e){} }
let meta = loadMeta();
function syncDaily(){ const t=todayISO(); if (meta.daily.d!==t) meta.daily={d:t,n:0,got:0}; }
syncDaily();

/* KL: a small canvas "rich look" kit. Warm light, layered depth, real-feeling surfaces (wood, parchment, gold, navy glass),

const KL=(function(){
  'use strict';
  const TAU=Math.PI*2, K={}, cache=new Map();

  const _cset=cache.set;cache.set=function(k,v){if(this.size>=240)this.delete(this.keys().next().value);return _cset.call(this,k,v);};

  K.panel=function(kind,w,h,o){

    if(o.shadow!==false){g.save();g.shadowColor='rgba(28,14,6,.5)';g.shadowBlur=14;g.shadowOffsetY=6;g.fillStyle='#000';rp(g,0,0,w,h,r);g.fill();g.restore();}

/* ═══════════ LEARNING KIT — age bands, teaching hints, a report for grown-ups ═══════════
   Hints teach the rule or the next step; they never hand over the answer.
   Every answer is logged against the skill it practised, so a grown-up can read
   what was practised, how accurate it was and what to practise next. */
const LEARN=(function(){
  const BANDS=[
    {id:'5-7', label:'Ages 5–7',  math:[1,2], word:[1,2]},
    {id:'7-9', label:'Ages 7–9',  math:[2,3], word:[2,3]},
    {id:'9-11',label:'Ages 9–11', math:[3,4], word:[3,5]}];
  const SPELL=['','Spelling short words','Spelling everyday words','Spelling longer words',
               'Spelling tricky words','Spelling advanced words'];
  const TIPS={
    'Adding within 20':'Start at the bigger number and count on, or make a ten first (8 + 5 = 8 + 2 + 3).',
    'Adding bigger numbers':'Add the tens, then the ones, then put the two parts together.',
    'Taking away within 20':'Count up from the smaller number to the bigger one on a number line.',
    'Taking away bigger numbers':'Take away the tens first, then the ones.',
    'Times tables to 9 × 9':'Skip-count out loud (3, 6, 9, 12…) and learn one table at a time.',
    'Times tables to 12 × 12':'Practise the 6, 7, 8 and 12 times tables; use 10 × then adjust.',
    'Dividing into equal groups':'Turn it round: 24 ÷ 6 means 6 × ? = 24.',
    'Multiply before adding':'In a two-step sum, do the × part first, then the +.',
    'Fractions of amounts':'Divide by the bottom number, then multiply by the top number.',
    'Percentages of amounts':'10% is ÷ 10, 50% is a half, 25% is a quarter.',
    'Number bonds':'Learn the pairs that make 10 by heart, then use them for 20 and 100.',
    'Checking sums (true or false)':'Work the sum out first, then compare it with the one shown.'};
  const SPELL_TIP='Say the word slowly, look at it, cover it, write it, then check it.';
  const VOW='AEIOU';
  const TEAMS={SH:'sh',CH:'ch',TH:'th',WH:'w',PH:'f',CK:'k',NG:'ng'}, SILENT={KN:'n',WR:'r'};
  const clampN=(v,a,b)=>v<a?a:v>b?b:v;

  /* ---- what a math prompt practises, and how to teach it ---- */
  function parseMath(prompt,note){
    const p=String(prompt||'').replace(/\s*=\s*\?\s*$/,'').replace(/-/g,'−').trim();
    let m;
    if((m=p.match(/^(\d+) \+ (\d+) × (\d+)$/)))return{k:'two',a:+m[1],b:+m[2],c:+m[3]};
    if((m=p.match(/^(\d+)\/(\d+) of (\d+)$/)))return{k:'frac',n:+m[1],d:+m[2],t:+m[3]};
    if((m=p.match(/^(\d+)% of (\d+)$/)))return{k:'pct',p:+m[1],t:+m[2]};
    if((m=p.match(/^(\d+) \+ \?(?: = (\d+))?$/))){
      const t=m[2]?+m[2]:+(String(note||'').match(/(\d+)/)||[0,0])[1];
      return{k:'bond',a:+m[1],t:t};}
    if((m=p.match(/^(.+) = (\d+)$/))){const inner=parseMath(m[1]);if(inner)return{k:'tf',q:inner,s:+m[2],text:m[1]};}
    if((m=p.match(/^(\d+) ([+−×÷]) (\d+)$/)))return{k:m[2],a:+m[1],b:+m[3]};
    return null;
  }
  function mathSkill(prompt,note){
    const q=parseMath(prompt,note); if(!q)return 'Mental maths';
    if(q.k==='+')return q.a+q.b<=20?'Adding within 20':'Adding bigger numbers';
    if(q.k==='−')return q.a<=20?'Taking away within 20':'Taking away bigger numbers';
    if(q.k==='×')return (q.a<=9&&q.b<=9)?'Times tables to 9 × 9':'Times tables to 12 × 12';
    if(q.k==='÷')return 'Dividing into equal groups';
    if(q.k==='two')return 'Multiply before adding';
    if(q.k==='frac')return 'Fractions of amounts';
    if(q.k==='pct')return 'Percentages of amounts';
    if(q.k==='bond')return 'Number bonds';
    return 'Checking sums (true or false)';
  }
  function skip(n,times){const s=[];for(let i=1;i<=Math.min(3,times-1);i++)s.push(n*i);return s.join(', ')+'…';}
  function mathHint(prompt,note){
    const q=parseMath(prompt,note);
    if(!q)return 'Read the question twice, then work it out one step at a time.';
    const big=Math.max(q.a,q.b),small=Math.min(q.a,q.b);
    switch(q.k){
      case '+':
        if(q.a+q.b<=20){
          if(big<10&&big+small>10)return `Make a ten: ${big} needs ${10-big} more to reach 10. Take ${10-big} from the ${small}, then add what is left on to 10.`;
          return `Number line: start at ${big} and hop ${small} to the right. Count the hops out loud.`;}
        if(small<10){const up=Math.ceil((big+1)/10)*10-big;
          return small>up?`Start at ${big}. Hop ${up} to reach ${big+up}, then hop on the other ${small-up}.`
                         :`Start at ${big} and count on ${small} more, one hop at a time.`;}
        return `Split into tens and ones: add ${Math.floor(q.a/10)*10} + ${Math.floor(q.b/10)*10} first, then ${q.a%10} + ${q.b%10}, then put them together.`;
      case '−':
        if(q.a<=20)return `Number line: start at ${q.b} and count up to ${q.a}. How many hops did you make?`;
        if(q.b<10){const down=q.a%10;
          return down&&q.b>down?`Count back from ${q.a}: hop back ${down} to reach ${q.a-down}, then hop back the other ${q.b-down}.`
                               :`Count back ${q.b} from ${q.a}, one hop at a time.`;}
        if(q.b%10===0)return `Take away ${q.b/10} tens: count back from ${q.a} in tens.`;
        return `Take away the tens first: ${q.a} − ${Math.floor(q.b/10)*10}. Then take away the ${q.b%10} ones that are left.`;
      case '×':
        if(q.a===10||q.b===10)return `Times 10: put a zero on the end of the other number.`;
        if(q.a===2||q.b===2)return `Times 2 is doubling: add ${q.a===2?q.b:q.a} to itself.`;
        if(q.a===5||q.b===5)return `Times 5 is half of times 10: work out ${q.a===5?q.b:q.a} × 10, then halve it.`;
        if(q.a===9||q.b===9){const o=q.a===9?q.b:q.a;return `Times 9: work out ${o} × 10, then take away one ${o}.`;}
        return `${q.a} × ${q.b} is ${q.b} groups of ${q.a}. Skip-count by ${q.a}: ${skip(q.a,q.b)} and stop after ${q.b} jumps.`;
      case '÷':
        return `How many groups of ${q.b} make ${q.a}? Think ${q.b} × ? = ${q.a}, or skip-count by ${q.b} until you reach ${q.a}.`;
      case 'two':
        return `Multiply first: work out ${q.b} × ${q.c}, then add ${q.a} to that.`;
      case 'frac':
        return q.n===1?`Split ${q.t} into ${q.d} equal groups. One group is the answer.`
                      :`Split ${q.t} into ${q.d} equal groups, then take ${q.n} of the groups.`;
      case 'pct':
        if(q.p===50)return `50% means half. What is half of ${q.t}?`;
        if(q.p===25)return `25% is a quarter: halve ${q.t}, then halve it again.`;
        if(q.p===75)return `75% is three quarters: find a quarter of ${q.t}, then take three of them.`;
        if(q.p===10)return `10% means one tenth: share ${q.t} into 10 equal parts (${q.t} ÷ 10).`;
        return `${q.p}% is ${q.p/10} lots of 10%. First find 10% of ${q.t} (that is ${q.t} ÷ 10), then multiply by ${q.p/10}.`;
      case 'bond':
        return q.t===10||q.t===20?`Count up from ${q.a} to ${q.t} on your fingers or a number line.`
                                 :`Count up from ${q.a} to the next ten, then on in tens to ${q.t}.`;
      case 'tf':
        return `Work out ${q.text} yourself first, then check: is it really ${q.s}?`;
    }
    return '';
  }

  /* ---- spelling: the first letter, the length, then sound-by-sound nudges ---- */
  function spellHint(word,idx,clue){
    const W=String(word).toUpperCase(), n=W.length; idx=clampN(idx|0,0,n-1);
    const c=W[idx], prev=W[idx-1]||'', so=W.slice(0,idx), tail=clue?` Clue: “${String(clue).replace('~','___')}”`:'';
    if(idx===0)return `It starts with the letter ${c} and has ${n} letters. Say the word slowly and listen to each sound.`+tail;
    const pair=prev+c;
    if(TEAMS[pair])return `After “${so}”, ${prev} teams up with the next letter to make one sound: /${TEAMS[pair]}/.`;
    if(SILENT[pair])return `The ${prev} is silent here: the sound you hear is /${SILENT[pair]}/.`;
    if(prev==='Q')return `Rule: the letter Q nearly always has the same vowel straight after it, and together they say /kw/.`;
    if(c===prev)return `After “${so}”, the same letter comes again: this word has a double letter here.`;
    if(c==='E'&&idx===n-1)return `Last letter: it is a silent e at the end. It makes the vowel before it say its name.`;
    if(VOW.includes(c)&&VOW.includes(prev))return `After “${so}”, another vowel joins in: two vowels team up to make one sound here.`;
    if(VOW.includes(c)||(c==='Y'&&idx===n-1))return `After “${so}” comes a vowel sound (a, e, i, o, u${c==='Y'?' or y':''}). Say “${so.toLowerCase()}…” slowly: which vowel do you hear?`;
    return `After “${so}” comes a consonant. Say “${so.toLowerCase()}…” slowly and listen for the next sound. ${n-idx} letter${n-idx>1?'s':''} to go.`;
  }

  /* ---- the record ---- */
  function create(key){
    let R={bands:{},skills:{},missWords:[],sessions:0,answered:0,correct:0,since:new Date().toISOString().slice(0,10)};
    try{const s=JSON.parse(localStorage.getItem(key));if(s&&typeof s==='object')R=Object.assign(R,s);}catch(e){}
    let S={skills:{},answered:0,correct:0,missWords:[]};   /* this session */
    const save=()=>{try{localStorage.setItem(key,JSON.stringify(R));}catch(e){}};
    const bump=(o,skill,ok)=>{const s=o[skill]||(o[skill]={r:0,w:0});ok?s.r++:s.w++;};
    const api={
      BANDS,
      band(){return BANDS.find(b=>b.id===R.band)||null;},
      bandIndex(){const i=BANDS.findIndex(b=>b.id===R.band);return i<0?0:i;},
      setBand(id){R.band=id;save();},
      /* a tier inside the band: the band's easiest tier plus the ramp, capped at the band's hardest */
      tier(kind,ramp){const b=BANDS[api.bandIndex()],r=kind==='word'?b.word:b.math;return clampN(r[0]+(ramp|0),r[0],r[1]);},
      startSession(){S={skills:{},answered:0,correct:0,missWords:[]};R.sessions++;save();},
      note(skill,ok,word){
        bump(R.skills,skill,ok);bump(S.skills,skill,ok);
        R.answered++;S.answered++;if(ok){R.correct++;S.correct++;}
        if(word&&!ok){const w=String(word).toLowerCase();
          if(!S.missWords.includes(w))S.missWords.push(w);
          R.missWords=[w].concat(R.missWords.filter(x=>x!==w)).slice(0,12);}
        if(word&&ok)R.missWords=R.missWords.filter(x=>x!==String(word).toLowerCase());
        save();
      },
      noteMath(prompt,ok,note){api.note(mathSkill(prompt,note),ok);},
      noteSpell(level,ok,word){api.note(SPELL[clampN(level|0,1,5)],ok,word);},
      session(){return S;},
      /* the grown-up report: {lines:[...], next:'...'} for this session and all time */
      report(scope){
        const src=scope==='session'?S:R, rows=Object.keys(src.skills).map(k=>{const s=src.skills[k];
          return{skill:k,n:s.r+s.w,acc:Math.round(100*s.r/Math.max(1,s.r+s.w))};}).sort((a,b)=>b.n-a.n);
        const acc=Math.round(100*src.correct/Math.max(1,src.answered));
        let weak=rows.filter(r=>r.n>=3).sort((a,b)=>a.acc-b.acc)[0]||rows.slice().sort((a,b)=>a.acc-b.acc)[0];
        let next;
        if(!rows.length)next='Play a round to start the record.';
        else if(weak&&weak.acc<85)next=`${weak.skill} (${weak.acc}% right). ${TIPS[weak.skill]||SPELL_TIP}`;
        else{const bi=api.bandIndex();
          next=bi<BANDS.length-1&&src.answered>=10?`Everything practised is 85% or better: try ${BANDS[bi+1].label} next.`
                                                   :'Keep going at this level: accuracy is strong.';}
        const words=(scope==='session'?S.missWords:R.missWords).slice(0,8);
        return{rows,acc,answered:src.answered,correct:src.correct,next,words,
               sessions:R.sessions,since:R.since,band:BANDS[api.bandIndex()].label};
      },
      /* plain HTML, styled by each game */
      reportHTML(scope){
        const r=api.report(scope), esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
        if(!r.answered)return `<p class="lk-p">No answers yet${scope==='session'?' this round':''}. Play a round and the report fills in.</p>`;
        return `<p class="lk-p"><b>${r.answered}</b> answer${r.answered>1?'s':''}, <b>${r.acc}%</b> right`+
          (scope==='session'?'':` · ${r.sessions} round${r.sessions>1?'s':''} since ${esc(r.since)} · level ${esc(r.band)}`)+`</p>`+
          `<table class="lk-t">${r.rows.slice(0,8).map(x=>`<tr><td>${esc(x.skill)}</td><td>${x.n}</td><td>${x.acc}%</td></tr>`).join('')}</table>`+
          (r.words.length?`<p class="lk-p">Words to practise: <b>${r.words.map(esc).join(', ')}</b></p>`:'')+
          `<p class="lk-p lk-next">Practise next: ${esc(r.next)}</p>`;
      },
      mathSkill,mathHint,spellHint,SPELL,
    };
    return api;
  }
  return{create,mathSkill,mathHint,spellHint,BANDS};
})();

/* ═══════════ math generators — tiered, with teaching hints ═══════════ */
function opts(ans,spread,min,max,n=3){
  const s=new Set([ans]); let g=0;
  while(s.size<n+1&&g++<400){const v=ans+RI(-spread,spread); if(v!==ans&&v>=min&&v<=max)s.add(v);}
  let b=1; while(s.size<n+1){ if(ans+b<=max)s.add(ans+b); if(s.size<n+1&&ans-b>=min)s.add(ans-b); b++; }
  return shuf([...s]);
}
function hintFor(op,a,b){
  switch(op){
    case '+': return 'start at '+a+', count on '+b+' more';
    case '−': return 'count up from '+b+' to '+a;
    case '×': return b+' groups of '+a+' — or '+a+' groups of '+b;
    case '÷': return 'how many '+b+'s make '+a+'?';
    default: return '';
  }
}
function qQuick(d){
  let a,b,op,ans,sp,mn,mx,hint='';
  if(d===1){op=Math.random()<.5?'+':'−';a=RI(1,10);b=RI(1,10);if(op==='−'&&b>a){const t=a;a=b;b=t;}
            ans=op==='+'?a+b:a-b;sp=4;mn=0;mx=20;}
  else if(d===2){const r=Math.random();
    if(r<.34){op='+';a=RI(5,30);b=RI(5,30);ans=a+b;sp=7;mn=0;mx=64;}
    else if(r<.68){op='−';a=RI(10,45);b=RI(1,a);ans=a-b;sp=7;mn=0;mx=45;}
    else{op='×';a=RI(2,9);b=RI(2,9);ans=a*b;sp=8;mn=0;mx=90;}}
  else if(d===3){const r=Math.random();
    if(r<.25){op='+';a=RI(25,99);b=RI(25,99);ans=a+b;sp=14;mn=0;mx=200;}
    else if(r<.5){op='−';a=RI(40,99);b=RI(10,a);ans=a-b;sp=14;mn=0;mx=99;}
    else if(r<.78){op='×';a=RI(3,12);b=RI(3,12);ans=a*b;sp=12;mn=0;mx=150;}
    else{op='÷';b=RI(2,9);ans=RI(2,12);a=b*ans;sp=6;mn=0;mx=20;}}
  else{ /* tier 4: two-step, fractions of a quantity, percentages */
    const r=Math.random();
    if(r<.4){ const b1=RI(2,9),b2=RI(2,9); a=RI(3,18); ans=a+b1*b2;
      return{prompt:a+' + '+b1+' × '+b2,note:'multiply first, then add',
             hint:b1+' × '+b2+' = '+(b1*b2)+', then '+a+' + '+(b1*b2),
             answer:String(ans),gates:opts(ans,15,0,Math.max(120,ans+20)).map(String)}; }
    if(r<.7){ const den=pick([2,3,4,5]); const num=pick([1,1,1,2,3].filter(n=>n<den));
      const T=den*RI(3,12); ans=T/den*num;
      return{prompt:num+'/'+den+' of '+T,note:'take the fraction of the whole',
             hint:'divide '+T+' by '+den+' (bottom), then times by '+num+' (top)',
             answer:String(ans),gates:opts(ans,Math.max(4,Math.round(ans*.3)),0,ans*2+6).map(String)}; }
    const p=pick([10,20,25,50,75]), T=pick([20,40,60,80,100,200]);
    ans=T/100*p;
    return{prompt:p+'% of '+T,note:'take the percentage of the whole',
           hint:p+'% of '+T+' = '+T+' ÷ 100 × '+p,
           answer:String(ans),gates:opts(ans,Math.max(6,Math.round(ans*.35)),0,ans*2+10).map(String)};
  }
  hint=hintFor(op,a,b);
  return{prompt:a+' '+op+' '+b,note:'',hint,answer:String(ans),gates:opts(ans,sp,mn,mx).map(String)};
}

/* ═══════════ game state ═══════════ */
const LK = LEARN.create("wf_learn");

const tierFor = ()=> LK.tier(mode==="spell" ? "word" : "math", Math.floor((day-1)/3));
const needLetter = ()=> word ? (word.t[wordIdx]||"").toUpperCase() : "";
const answerNow = ()=> question ? question.answer : "";

const fishValue = r=> RARITY_MULT[r] || 1;

/* ═══════════ the school ═══════════ */
function labelPool(){
  if (mode==="spell" && word){
    const need = needLetter(), letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').filter(c=>c!==need);
    const remain = word.t.slice(wordIdx+1).toUpperCase().split('').filter(c=>c!==need);
    return {need, others: shuf(remain.concat(shuf(letters))).slice(0,14)};
  }
  const ans = String(answerNow()), gates = (question ? question.gates : []).filter(g=>String(g)!==ans);
  return {need: ans, others: shuf(gates.concat(opts(+ans, Math.max(4,Math.round(+ans*.3)), 0, +ans*2+8, 6).map(String).filter(g=>g!==ans)))};
}
function makeFish(label, fromEdge){
  const pi = meta.pond, si = RI(0,5), rar = rollRarity(), size = fishSize()*(0.9+Math.random()*.25);
  const minX = fishMinX();
  return { x: fromEdge ? (Math.random()<.5 ? VW+40 : minX-30) : R(minX, VW-50), y: R(WL+ 62*U, VH-70*U), vx: R(14,34)*(Math.random()<.5?-1:1), vy:0,
    label:String(label), ph:R(0,6), size, rarity:rar, sp:si, pi, state:"swim", born:0, tw:R(0,6) };
}
function rollRarity(){
  const l = meta.gear.lure, leg = 0.02 + l*0.04, rare = 0.12 + l*0.05, x = Math.random();
  return x < leg ? "legendary" : x < leg+rare ? "rare" : "common";
}
function refreshSchool(keepPos){
  const {need, others} = labelPool(), N = SCHOOL_N();
  const labels = [need, need].concat(others).slice(0,N);
  const old = keepPos ? school : [];
  school = [];
  for (let i=0;i<labels.length;i++){
    const f = makeFish(labels[i], false);
    if (old[i]){ f.x = old[i].x; f.y = old[i].y; f.vx = old[i].vx; }
    f.born = ambT; school.push(f);
  }
  /* spread them so no two labels sit on top of each other */
  for (let k=0;k<30;k++) for (let i=0;i<school.length;i++) for (let j=i+1;j<school.length;j++){
    const a=school[i], b=school[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy), min=fishSize()*1.5;
    if (d<min){ const push=(min-d)/2+.5, ux=dx/(d||1), uy=dy/(d||1); a.x+=ux*push; a.y+=uy*push*.6; b.x-=ux*push; b.y-=uy*push*.6; }
  }
  for (const f of school){ f.x=clamp(f.x,fishMinX(),VW-50); f.y=clamp(f.y,WL+56*U,VH-70*U); }
}
function ensureNeeded(){
  const need = String(needNow());
  const have = school.filter(f=>f.label===need && f.state==="swim").length;
  for (let k=have;k<2;k++){ const cand = school.filter(f=>f.label!==need && f.state==="swim"); if (cand.length) pick(cand).label = need; }
}

function newWord(){ wordTier = tierFor(); const w = pick(WORDS[wordTier]); word = {t:w[0], h:w[1]}; wordIdx = 0; tilePop = []; if (meta.voice) say("Spell the word. "+w[1].replace('~','blank')+"."); }
function newQuestion(){ mathTier = tierFor(); question = qQuick(mathTier); if (meta.voice) say("What is "+question.prompt.replace('−','minus').replace('×','times').replace('÷','divided by').replace('+','plus')+"? Catch the fish with the answer."); }
function startTrip(m, first){
  mode = m || mode; LK.startSession(); answeredToday = 0;
  if (first) day = 1;
  baitMax = BAIT_TRIP[meta.gear.bucket]; bait = baitMax;
  wordsDone = 0; mathCorrect = 0; dayEarnings = 0; dayKept = 0; dayMistakes = 0; dayNew = []; hint = ""; toast = ""; hookedFish = null; target = null; parts = []; ripples = []; flies = [];
  if (mode==="spell") newWord(); else newQuestion();

}
function startDay(m){ startTrip(m, true); }
function nextDay(){ day++; startTrip(mode, false); }

const quotaDone = ()=> mode==="spell" ? wordsDone>=QUOTA.spell : mathCorrect>=QUOTA.math;

/* ═══════════ casting, nibbling, striking ═══════════ */
function castTo(x, y){
  if (phase!=="ready") return;
  if (y < WL+34*U){ setToast("Tap the water, near a fish!", 1.6, "#fff3d2"); return; }
  hook.x = clamp(x, dockW+24*U, VW-22*U); hook.y = clamp(y, WL+46*U, VH-56*U);
  bobber = {x:hook.x, y:WL+7*U, t:0}; castT = 0; swing = 0; phase = "casting"; drySpell = 0;
  kit('whoosh',{volume:.7}); beep(240,.16,"sine",.08,620);
}
function pickTarget(){
  const reach = LURE_REACH[meta.gear.lure]*U*1.0 + 14*U; let best=null, bd=1e9;
  for (const f of school){ if (f.state!=="swim") continue; const d=Math.hypot(f.x-hook.x, f.y-hook.y); if (d<bd){ bd=d; best=f; } }
  return best && bd<=reach ? best : null;
}
function landBobber(){
  bobber.x = hook.x; bobber.y = WL+7*U; splash(hook.x, WL+6*U, 10); ripple(hook.x, WL+6*U); kit('splash',{volume:.7});
  phase = "waiting"; waitT = 0; nibbleT = 0; target = pickTarget();
  if (target){ target.state = "approach"; }
}
function reelBack(msg){
  if (target && target.state!=="hooked") target.state = "swim"; target = null;
  setToast(msg, 1.8, "#fff3d2"); phase = "ready"; drySpell++;
}
function biteNow(){
  if (phase!=="waiting") return;
  phase = "strike"; ring = {r:112*U, target:26*U, closing:true, early:0}; kit('tick',{volume:.8}); beep(880,.09,"square",.07); buzz(20);
}
function tapStrike(){
  if (phase!=="strike") return;
  const win = ROD_WIN[meta.gear.rod]*U, d = ring.r - ring.target;
  if (Math.abs(d) <= win){ const perfect = Math.abs(d) < 9*U; hookFish(perfect); }
  else if (d > win){ /* too early: the ring starts again, nothing is lost */
    ring.r = 112*U; ring.early++; setToast("Wait for the ring to reach the gold circle", 1.5, "#fff3d2"); kit('tap',{volume:.5});
  }
}
function missCast(msg){
  if (target){ target.state = "swim"; target.vx = (Math.random()<.5?-1:1)*R(34,52); target.x += 6; }
  target = null; setToast(msg, 1.8, "#fff3d2"); phase = "result"; resultT = .7; lastResult = {ok:false, msg};
  meta.casts++; saveMeta(meta);
}
function hookFish(perfect){
  const f = target || pickTarget() || school[0];
  if (dbgForce){ f.label = dbgForce; dbgForce = null; }
  if (dbgRarity){ f.rarity = dbgRarity; dbgRarity = null; }
  const sp = PONDS[f.pi].fish[f.sp];
  hookedFish = { label:String(f.label), rarity:f.rarity, species:f.sp, pi:f.pi, name:(rarityTag(f.rarity)+" "+sp[0]).trim(), correct:String(f.label)===String(needNow()), size:f.size, fromX:hook.x, fromY:hook.y, perfect:!!perfect, ref:f };
  f.state = "hooked"; phase = "hooked"; hookT = 0; target = null; shake = RM.matches?0:4;
  splash(hook.x, WL+8*U, 18); ripple(hook.x, WL+6*U); kit('collect',{volume:.7}); buzz(30);
}
function decideKeep(keepIt){
  if (phase!=="hooked" || !hookedFish || hookT<.7) return;
  const f = hookedFish; hookedFish = null;
  const idx = school.indexOf(f.ref); if (idx>=0) school.splice(idx,1);
  const rightCall = keepIt === f.correct;
  if (mode==="spell" && word) LK.noteSpell(wordTier, rightCall, word.t); else if (question) LK.noteMath(question.prompt, rightCall, question.note);
  answeredToday++; meta.casts++;
  let celebrate = 0;
  if (!keepIt){
    /* letting a fish go costs nothing: a right call is praised, a wrong one is explained */
    if (f.correct){ setToast("That was the one we needed! Next time, keep it.", 2.4, "#fff3d2"); lastResult = {ok:false, msg:"released the needed fish"}; }
    else { setToast("Good eye! That one was not it.", 1.8, "#b8f0a8"); lastResult = {ok:true, msg:"good release"}; kit('correct',{volume:.6}); }
  } else {
    bait--;
    if (f.correct){
      keepFx(f); dayKept++; meta.daily.n++; dayEarnings += (mode==="spell"?2:6)*fishValue(f.rarity)+(f.perfect?1:0);
      const key = 'p'+f.pi+'s'+f.species, b = meta.book[key] || (meta.book[key]={n:0,gold:0});
      if (b.n===0) dayNew.push({pi:f.pi, si:f.species, rar:f.rarity}); b.n++; if (f.rarity==="legendary") b.gold = 1;
      if (f.rarity==="legendary") meta.trophies.push({name:f.name, label:f.label, day, mode}), meta.trophies = meta.trophies.slice(-30);
      if (mode==="spell"){
        tilePop[wordIdx] = 1; wordIdx++;
        if (wordIdx >= word.t.length){
          wordsDone++; meta.words++; const bonus = 10*wordTier; dayEarnings += bonus; celebrate = 2.6; celebrateT = 2.6;
          setToast(word.t.toUpperCase()+"!  +"+bonus+" coins", 2.4, "#ffe7a0"); say(word.t+". "+word.t.split('').join(', ')+". "+word.t+"!");
          kit('win',{volume:.8}); confetti(VW/2, L.boardY+40, 40);
          if (wordsDone < QUOTA.spell) newWord();
        } else setToast("Yes! "+f.label+" fits!", 1.4, "#b8f0a8");
      } else {
        mathCorrect++; meta.mathCorrect++; celebrate = 1.4; setToast("Yes! "+f.label+" is the answer!", 1.6, "#b8f0a8"); celebrateT = 1.4;
        if (mathCorrect < QUOTA.math) newQuestion();
      }
      kit('correct',{volume:.8}); beep(523,.1,"triangle",.12); setTimeout(()=>beep(784,.16,"triangle",.12),90); lastResult = {ok:true, label:f.label};
    } else {
      dayMistakes++; kit('tap',{volume:.6}); beep(190,.26,"sine",.1,120);
      hint = mode==="spell" ? ("We need the letter "+needLetter()+" next. This fish has "+f.label+". "+LK.spellHint(word.t,wordIdx,word.h))
                            : ("This fish weighs "+f.label+". "+(question.note?question.note+": ":"")+(question.hint||""));
      hintT = 7; setToast("Not this one, that is "+f.label+". Try again!", 2.2, "#ffd9a0"); lastResult = {ok:false, label:f.label, wrongKeep:true};
      shake = RM.matches?0:5;
    }
  }
  syncDaily(); saveMeta(meta);
  refreshLabelsAfter();
  phase = "result"; resultT = celebrate ? Math.max(.9,celebrate*.7) : .9;
}
function refreshLabelsAfter(){
  const {need, others} = labelPool();
  const nf = makeFish("?", true); nf.born = ambT; school.push(nf);
  let k = 0; for (const f of school){ if (f.label==="?") f.label = String(others[k++ % others.length]); }
  const swimmers = school.filter(f=>f.state==="swim"), want = String(need), have = swimmers.filter(f=>f.label===want).length;
  if (have<2) for (const f of shuf(swimmers.filter(x=>x.label!==want)).slice(0,2-have)) f.label = want;
}
function finishCast(){
  if (celebrateT>0) return;
  if (quotaDone() || bait<=0){ endTrip(); return; }
  phase = "ready"; ensureNeeded();
}
function starsFor(){
  if (quotaDone()) return dayMistakes<=2 ? 3 : 2;
  return dayKept>=3 ? 1 : 0;
}
function endTrip(){
  const done = quotaDone(), stars = starsFor(), before = meta.stars;
  meta.coins += dayEarnings; if (dayEarnings>meta.bestDay) meta.bestDay = dayEarnings; meta.stars += stars; meta.trips++;
  syncDaily(); let gift = 0; if (meta.daily.n>=DAILY_GOAL && !meta.daily.got){ meta.daily.got = 1; meta.coins += 25; meta.stars += 1; gift = 25; }
  const t = todayISO(); if (meta.streak.last !== t){ meta.streak.n = (meta.streak.last===dayBefore(t)) ? meta.streak.n+1 : 1; meta.streak.last = t; meta.streak.best = Math.max(meta.streak.best, meta.streak.n); }
  const unlockedP = pondsOpen() > (function(){ let n=0; for (let i=0;i<PONDS.length;i++) if (before>=PONDS[i].at) n=i+1; return Math.max(1,n); })();
  saveMeta(meta); phase = "dayend"; kit(stars>=2?'levelup':'win',{volume:.8}); beep(523,.16,"triangle",.1); setTimeout(()=>beep(659,.16,"triangle",.1),120); setTimeout(()=>beep(784,.24,"triangle",.1),240);
  $("de-title").textContent = done ? "Trip complete!" : (bait<=0 ? "Out of bait, good try!" : "Trip over");
  $("de-stars").innerHTML = [0,1,2].map(i=>'<span class="'+(i<stars?'on':'off')+'">★</span>').join('');
  $("de-line").textContent = done ? (mode==="spell" ? "You spelled "+wordsDone+" word"+(wordsDone>1?"s":"")+"!" : "You found every answer!") : "The sun is setting. Fill the sign next time!";
  $("de-earn").textContent = dayEarnings; $("de-kept").textContent = dayKept; $("de-coins").textContent = meta.coins;
  const nf = $("de-new"); nf.innerHTML = "";
  for (const n of dayNew){ const fig = document.createElement("figure"), cnv = document.createElement("canvas"); cnv.width = 110*DPR; cnv.height = 66*DPR; cnv.style.width="110px"; cnv.style.height="66px"; fig.appendChild(cnv);
    const cap = document.createElement("span"); cap.textContent = "New! "+PONDS[n.pi].fish[n.si][0]; fig.appendChild(cap); nf.appendChild(fig); const c2 = cnv.getContext("2d"); c2.scale(DPR,DPR); const sp = fishSprite(n.pi,n.si,n.rar,26); c2.drawImage(sp.c,55-sp.ox*.9,33-sp.oy*.9,sp.w*.9,sp.h*.9); }
  const extra = []; if (gift) extra.push("Daily goal done! +25 coins and a bonus star"); else extra.push("Daily goal: "+Math.min(DAILY_GOAL,meta.daily.n)+"/"+DAILY_GOAL+" fish");
  if (unlockedP) extra.push("New water unlocked: "+PONDS[pondsOpen()-1].name+"!");
  const hu = HATS.findIndex((h,i)=>meta.stars>=h.at && before<h.at && i>0); if (hu>=0) extra.push("New hat unlocked: "+HATS[hu].name+"!");
  $("de-daily").innerHTML = extra.map(t=>'<p>'+t+'</p>').join('');
  $("de-report-body").innerHTML = LK.reportHTML("session");
  showOverlay("dayend"); sdkState({scene:"over", score:dayEarnings, outcome: done ? "trip complete" : "trip over", stars});
}

/* ═══════════ effects ═══════════ */
function addPart(p){ if (parts.length<240) parts.push(p); }
function splash(x,y,n){ n=Math.round(n*(RM.matches?.4:1)); for (let i=0;i<n;i++){ const a=-Math.PI/2+(Math.random()-.5)*1.6, v=R(60,190); addPart({k:'drop',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:.7+Math.random()*.4,s:R(1.6,3.4)}); } }
function ripple(x,y){ if (ripples.length<8) ripples.push({x,y,t:0}); }
function confetti(x,y,n){ n=Math.round(n*(RM.matches?.3:1)); for (let i=0;i<n;i++){ const a=Math.random()*TAU, v=R(80,300); addPart({k:'conf',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,t:1.3+Math.random()*.6,s:R(3,6),c:pick(['#f4c440','#e05a78','#4aa0d8','#5cb85c','#a070d0','#fff4d8']),r:Math.random()*TAU,vr:R(-9,9)}); } }
function keepFx(f){
  /* the fish flies to the sign; coins pop out */
  if (flies.length<12) flies.push({x:VW/2, y:cardBox().y+110*U, t:0, dur:.7, sp:f.species, pi:f.pi, rar:f.rarity, size:f.size, tx: tileX(mode==="spell"?wordIdx:0), ty:L.boardY+L.boardH*.42});
  for (let i=0;i<8;i++) addPart({k:'coin',x:VW/2,y:cardBox().y+110*U,vx:R(-120,120),vy:R(-200,-60),t:.9,s:R(4,6)});
  if (f.rarity==="legendary") confetti(VW/2, cardBox().y+90*U, 30);
}
function setToast(t, secs, col){ toast = t; toastT = secs||1.8; toastCol = col||"#fff3d2"; }
function beep(freq, dur, type, vol, slideTo){
  try { const a = audio(); if (!a) return; if (SDK && SDK.muted) return;
    const o=a.createOscillator(), g=a.createGain(), t=a.currentTime; o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02); } catch(e){}
}
let actx = null;
function audio(){ try { if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; actx = new AC(); } if (actx.state!=="running" && actx.resume) actx.resume(); return actx; } catch(e){ return null; } }
window.addEventListener("pointerdown", ()=>audio(), {once:true});
window.addEventListener("keydown", ()=>audio(), {once:true});
/* the sign reads the word aloud, on devices that have a voice */
let voiceOK=false, voiceObj=null;
function findVoice(){ try{ if(!window.speechSynthesis) return false; const v=speechSynthesis.getVoices(); if(!v.length) return false; voiceOK=true; voiceObj=v.find(x=>/^en[-_]/i.test(x.lang)&&/female|samantha|karen|moira|tessa|zira/i.test(x.name))||v.find(x=>/^en/i.test(x.lang))||null; return true; }catch(e){ return false; } }
try{ if (window.speechSynthesis) speechSynthesis.onvoiceschanged = findVoice; }catch(e){} findVoice();
function say(t){ if (!meta.voice||!voiceOK||(SDK&&SDK.muted)) return; try{ const u=new SpeechSynthesisUtterance(t); u.rate=.86; u.pitch=1.12; if(voiceObj) u.voice=voiceObj; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
function hush(){ try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }

/* ═══════════ layout of the sign and cards ═══════════ */
const L = {boardX:0,boardY:0,boardW:0,boardH:0};
let layoutPulse = 0;
function layoutBoard(){
  const top = SAFE.t;
  L.boardW = Math.min(VW-20, WIDE?400:420);
  L.boardH = (mode==="spell" ? 116 : 92) * (WIDE ? Math.min(1,U*1.05) : 1);
  L.boardX = WIDE ? Math.max((VW-L.boardW)/2, dockW+24*U) : (VW-L.boardW)/2;
  L.boardY = top + (WIDE ? 8 : 56);
}
function tileMetrics(){
  const n = word ? word.t.length : 1, pic = word && EMOJI[word.t] ? 54 : 0, avail = L.boardW - 28 - pic;
  const tw = clamp(Math.floor(avail/n)-4, 20, 46), th = Math.round(tw*1.16), total = n*(tw+4)-4;
  const x0 = L.boardX + 14 + pic + (avail-total)/2, y0 = L.boardY + 12;
  return {n,tw,th,x0,y0,pic};
}
function tileX(i){ const m = tileMetrics(); return m.x0 + i*(m.tw+4) + m.tw/2; }
function cardBox(){ const w=Math.min(VW-28, 340), h=Math.min(VH-SAFE.t-SAFE.b-40, 350*Math.min(1.1,U)), x=(VW-w)/2, y=Math.max(SAFE.t+10,(VH-h)/2-10); return {x,y,w,h}; }

/* ═══════════ input ═══════════ */
function screenPt(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function hitRect(r,x,y){ return r && x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h; }
cv.addEventListener("pointerdown", e=>{
  e.preventDefault(); audio();
  const p = screenPt(e);
  if (phase==="hooked"){
    if (hitRect(keepBtn,p.x,p.y)) return decideKeep(true);
    if (hitRect(relBtn,p.x,p.y)) return decideKeep(false);
    return;
  }
  if (phase==="ready") castTo(p.x, p.y);
  else if (phase==="strike") tapStrike();
  else if (phase==="waiting" && !target) { /* impatient: cast again somewhere else */ reelBack("Try tapping right next to a fish"); }
});
cv.addEventListener("contextmenu", e=>e.preventDefault());
window.addEventListener("keydown", e=>{
  const k = e.key.toLowerCase();
  if (k===" "){ e.preventDefault(); if (phase==="ready"){ const f=school.find(x=>String(x.label)===String(needNow())&&x.state==="swim")||school[0]; if (f) castTo(f.x,f.y); } else if (phase==="strike") tapStrike(); }
  if (phase==="hooked"){ if (k==="k") decideKeep(true); if (k==="r") decideKeep(false); }
});

/* ═══════════ update ═══════════ */
function update(dt){
  frames++; fpsT += dt; if (fpsT>=1){ fps=frames; frames=0; fpsT=0; }
  if (phase!=="menu" && phase!=="dayend") matchT += dt;
  if (!RM.matches) ambT += dt; else ambT += 0;
  if (swing>0) swing = Math.max(0, swing - dt*2.2);
  if (shake>0) shake = Math.max(0, shake - dt*18);
  if (toastT>0) toastT -= dt; if (hintT>0) hintT -= dt; if (celebrateT>0){ celebrateT -= dt; if (celebrateT<=0 && phase==="result" && resultT<=0) finishCast(); }
  coachTick(dt);
  if (phase==="casting"){ castT += dt/.55; swing = Math.sin(clamp(castT,0,1)*Math.PI)*1.0; if (castT>=1) landBobber(); }
  if (phase==="waiting"){
    waitT += dt; bobber.t += dt;
    if (target){
      const dx=hook.x-target.x, dy=hook.y-target.y, d=Math.hypot(dx,dy);
      if (target.state==="approach"){ const sp=Math.min(d, 96*dt); target.x += dx/(d||1)*sp; target.y += dy/(d||1)*sp; target.vx = dx<0?-20:20;
        if (d<14*U){ target.state="nibble"; nibbleT=0; } }
      else if (target.state==="nibble"){ nibbleT += dt; bobber.y = WL+7*U + Math.sin(nibbleT*30)*1.6*U; if (nibbleT>.65) biteNow(); }
      if (waitT>4.2 && phase==="waiting") reelBack("That fish is shy. Try another one!");
    } else if (waitT>1.1) reelBack("No fish there. Tap right next to a fish!");
  }
  if (phase==="strike"){
    ring.r -= dt*RING_SPEED[bandIx()]*U*1.0; bobber.t += dt;
    if (ring.r < ring.target - ROD_WIN[meta.gear.rod]*U) missCast("Too slow, it swam off. Try again!");
  }
  if (phase==="hooked") hookT += dt;
  if (phase==="result"){ resultT -= dt; if (resultT<=0 && celebrateT<=0) finishCast(); }
  /* fish swim: gentle drift, turn at the edges, keep clear of the dock */
  {
    const yMin = WL+50*U, yMax = VH-64*U;
    for (const f of school){
      f.ph += dt*2.2; f.tw += dt*7;
      if (f.state==="swim"){
        f.x += f.vx*dt; f.y += Math.sin(f.ph*.5)*8*dt;
        if (f.x<fishMinX()){ f.x=fishMinX(); f.vx=Math.abs(f.vx); } if (f.x>VW-46){ f.x=VW-46; f.vx=-Math.abs(f.vx); }
        f.y = clamp(f.y, yMin, yMax);
      }
    }
  }
  for (let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.t-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.k==='bubble'?-14:440)*dt; if (p.k==='conf'){ p.r+=p.vr*dt; } if (p.t<=0||p.y>VH+30) parts.splice(i,1); }
  for (let i=ripples.length-1;i>=0;i--){ ripples[i].t += dt; if (ripples[i].t>1.2) ripples.splice(i,1); }
  for (let i=flies.length-1;i>=0;i--){ const f=flies[i]; f.t += dt/f.dur; if (f.t>=1){ flies.splice(i,1); for (let k=0;k<10;k++) addPart({k:'coin',x:f.tx,y:f.ty,vx:R(-90,90),vy:R(-160,-40),t:.8,s:R(3,5)}); } }
  if (!RM.matches && parts.length<200 && Math.random()<dt*2.4 && phase!=="menu") addPart({k:'bubble',x:R(fishMinX(),VW-20),y:VH-R(20,80),vx:R(-6,6),vy:R(-30,-14),t:R(2.4,4.2),s:R(1.6,3.2)});
}

/* ═══════════ drawing ═══════════ */
const INK='#4a2d12', INK2='#7a5428', CREAM='#fff3d2', GOLDT='#ffe7a0';
function T(s,x,y,px,col,align,weight,mode){ KL.text(ctx,s,x,y,px,col,align||'center',weight||700,'Fredoka,system-ui,sans-serif',mode); }

function emo(s,x,y,px,align){ ctx.font=Math.round(px)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.textAlign=align||'center'; ctx.textBaseline='middle'; ctx.fillStyle='#000'; ctx.fillText(s,x,y); }
function wrapText(str, maxW, px, weight){ ctx.font=(weight||700)+' '+px+'px Nunito,system-ui,sans-serif'; const words=String(str).split(' '), out=[]; let line='';
  for (const w of words){ const t=line?line+' '+w:w; if (ctx.measureText(t).width>maxW && line){ out.push(line); line=w; } else line=t; } if (line) out.push(line); return out; }

  if (!bg || bgKey!==key){
    if (bgWant!==key){ bgWant=key; const pi=meta.pond, w=VW, h=VH, wl=WL, u=U; setTimeout(()=>{ if (bgWant===key){ try{ bg=paintPond(pi,w,h,wl,u); dockW=bg._dockW||140; bgKey=key; }catch(e){ console.error('paintPond: '+(e&&e.stack||e)); } } },0); }
    if (!bg){ const g=ctx.createLinearGradient(0,0,0,VH); g.addColorStop(0,'#8fc4e6'); g.addColorStop(WL/VH,'#e8f0dc'); g.addColorStop(WL/VH+.001,'#3f8f92'); g.addColorStop(1,'#0f3448'); ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH); return; }

function drawWater(){
  const t = ambT, pi = meta.pond;

  ctx.save(); ctx.strokeStyle = pi===4 ? 'rgba(200,220,255,.26)' : 'rgba(255,255,255,.3)'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(0,WL+1);

  const nxt = PONDS[open]; const bar = $("pond-bar").firstElementChild;
  if (nxt){ const prev = PONDS[open-1].at, k = clamp((meta.stars-prev)/(nxt.at-prev),0,1); bar.style.width = Math.max(6,k*100)+"%"; $("pond-bar").title = "Next water: "+nxt.name+" at "+nxt.at+" stars"; $("pond-sub").textContent += "  ·  next water at "+nxt.at+" ⭐"; }
  else bar.style.width = "100%";
  $("btn-spell").disabled = $("btn-math").disabled = false;
  $("m-daily").innerHTML = '<div class="row"><b>Daily goal: catch '+DAILY_GOAL+' fish</b><span>'+Math.min(DAILY_GOAL,meta.daily.n)+'/'+DAILY_GOAL+(meta.daily.got?' 🎁':'')+'</span></div><div class="kl-trough '+(meta.daily.got?'gold':'')+'"><i style="width:'+Math.max(4,Math.min(1,meta.daily.n/DAILY_GOAL)*100)+'%"></i></div>'
    +'<div style="margin-top:6px;font-size:14px;font-weight:800;color:var(--kl-ink2)">🔥 '+meta.streak.n+' day'+(meta.streak.n===1?'':'s')+' in a row'+(meta.streak.best>meta.streak.n?' · best '+meta.streak.best:'')+'</div>';
}
function cyclePond(d){ const n = PONDS.length; meta.pond = (meta.pond+d+n)%n; if (meta.pond>=pondsOpen()){ /* locked waters can be looked at, but not fished */ } saveMeta(meta); bg=null; bgWant=""; refreshMenu(); kit('swap',{volume:.6}); }
$("pond-l").addEventListener("click", ()=>cyclePond(-1));
$("pond-r").addEventListener("click", ()=>cyclePond(1));
function tryStart(m){ if (meta.pond>=pondsOpen()){ setToast("This water opens at "+PONDS[meta.pond].at+" stars", 2, "#fff3d2"); meta.pond = pondsOpen()-1; bg=null; bgWant=""; refreshMenu(); return; } audio(); kit('button',{volume:.7}); startDay(m); }
$("btn-spell").addEventListener("click", ()=>tryStart("spell"));
$("btn-math").addEventListener("click", ()=>tryStart("math"));
$("btn-nextday").addEventListener("click", ()=>{ audio(); nextDay(); });
$("btn-menu").addEventListener("click", toTitle);
$("btn-shop2").addEventListener("click", ()=>{ buildShop(); showOverlay("shop"); shopBack = "dayend"; });
let shopBack = "menu";
$("btn-shop").addEventListener("click", ()=>{ buildShop(); showOverlay("shop"); shopBack = "menu"; });
$("sh-back").addEventListener("click", ()=>showOverlay(shopBack));
$("btn-book").addEventListener("click", ()=>{ openBook(meta.pond); showOverlay("book"); });
$("bk-back").addEventListener("click", ()=>showOverlay("menu"));
function buildShop(){
  $("sh-coins").textContent = "🪙 "+meta.coins;
  const host = $("sh-gear"); host.innerHTML = "";
  for (const it of SHOP){
    const tier = meta.gear[it.key], row = document.createElement("div"); row.className = "gear";
    row.innerHTML = '<i>'+it.ico+'</i><div><b>'+it.names[tier]+'</b><span>'+it.desc(tier)+'</span></div>';
    const btn = document.createElement("button"); btn.className = "kl-btn green";
    if (tier>=2){ btn.textContent = "Maxed"; btn.disabled = true; btn.className = "kl-btn cream"; }
    else { const cost = it.costs[tier+1]; btn.textContent = it.names[tier+1]+" · "+cost+"🪙"; btn.id = "buy-"+it.key; if (meta.coins<cost) btn.disabled = true;
      btn.addEventListener("click", ()=>{ if (meta.coins>=cost && meta.gear[it.key]<2){ meta.coins -= cost; meta.gear[it.key]++; saveMeta(meta); kit('reward',{volume:.7}); const dc=$("de-coins"); if (dc) dc.textContent=meta.coins; buildShop(); } }); }
    row.appendChild(btn); host.appendChild(row);
  }
  const hg = $("sh-hats"); hg.innerHTML = ""; const open = hatsOpen();
  HATS.forEach((h,i)=>{
    const b = document.createElement("button"); b.className = "kl-btn "+(meta.hat===i?"gold":"cream")+(meta.hat===i?" sel":""); b.disabled = !open[i];
    const c = document.createElement("canvas"); c.width = 56*DPR; c.height = 44*DPR; b.appendChild(c); const g2 = c.getContext("2d"); g2.scale(DPR,DPR); if (!open[i]) g2.globalAlpha = .35; drawHat(g2, i, 28, 34, 1.1, 0);
    const s = document.createElement("span"); s.textContent = open[i] ? h.name : "🔒 "+h.at+" ⭐"; b.appendChild(s);
    b.addEventListener("click", ()=>{ meta.hat = i; if (!meta.hats.includes(i)) meta.hats.push(i); saveMeta(meta); kit('collect',{volume:.6}); buildShop(); });
    hg.appendChild(b);
  });
}
function openBook(pi){
  meta.pond = clamp(pi,0,PONDS.length-1);
  const tabs = $("bk-tabs"); tabs.innerHTML = ""; const open = pondsOpen(); let total = 0, have = 0;
  PONDS.forEach((P,i)=>{ P.fish.forEach((f,j)=>{ total++; const b = meta.book['p'+i+'s'+j]; if (b&&b.n>0) have++; });
    const t = document.createElement("button"); t.className = "kl-btn "+(i===pi?"gold on":"cream"); t.textContent = i<open ? P.emoji : "🔒"; t.setAttribute("aria-label", P.name);
    t.addEventListener("click", ()=>openBook(i)); tabs.appendChild(t); });
  $("bk-count").textContent = have+"/"+total;
  const grid = $("bk-grid"); grid.innerHTML = ""; const P = PONDS[pi];
  P.fish.forEach((f,j)=>{
    const rec = meta.book['p'+pi+'s'+j], seen = rec && rec.n>0;
    const card = document.createElement("div"); card.className = "fcard";
    const c = document.createElement("canvas"); c.width = 100*DPR; c.height = 56*DPR; card.appendChild(c);
    const g2 = c.getContext("2d"); g2.scale(DPR,DPR); const sp = fishSprite(pi,j,rec&&rec.gold?'legendary':'common',24);
    if (pi<open){ if (seen){ g2.drawImage(sp.c,50-sp.ox*.95,28-sp.oy*.95,sp.w*.95,sp.h*.95); }
      else { const tmp = document.createElement("canvas"); tmp.width = sp.c.width; tmp.height = sp.c.height; const tg = tmp.getContext("2d"); tg.drawImage(sp.c,0,0); tg.globalCompositeOperation = "source-in"; tg.fillStyle = "#3b2a18"; tg.fillRect(0,0,tmp.width,tmp.height); g2.globalAlpha = .55; g2.drawImage(tmp,50-sp.ox*.95,28-sp.oy*.95,sp.w*.95,sp.h*.95); } }
    const nm = document.createElement("b"); nm.textContent = seen ? f[0] : "???"; card.appendChild(nm);
    const ct = document.createElement("span"); ct.textContent = pi>=open ? "🔒 opens at "+P.at+" ⭐" : seen ? ("caught "+rec.n+(rec.gold?" · golden ★":"")) : "not found yet"; card.appendChild(ct);
    grid.appendChild(card);
  });
}
$("btn-grown").addEventListener("click", ()=>{ $("grown-body").innerHTML = LK.reportHTML("all"); showOverlay("grown"); $("grown-back").focus(); });
$("grown-back").addEventListener("click", ()=>showOverlay("menu"));

/* ═══════════ arcade glue: hints, age bands, grown-up report, first-run coach ═══════════ */
const COARSE = matchMedia("(pointer: coarse)").matches;
function sdkState(o){ try{ window.ArcadeSDK && ArcadeSDK.state(o); }catch(e){} }
function toTitle(){ phase="menu"; hookedFish=null; target=null; coachEnd(false); hush(); showOverlay("menu"); renderBands(); sdkState({scene:"title"}); }
function currentHint(){
  if (phase==="menu") return "Pick your age, then ABC Spell or 123 Maths. Stars open new waters, hats and fish.";
  if (phase==="dayend") return "The report shows what to practise; Next trip carries on at the same level.";
  if (phase==="strike") return "Tap the moment the gold ring meets the green circle.";
  if (phase==="hooked") return mode==="spell" && word ? "Keep it only if the letter on the fish is "+needLetter()+"." : "Keep it only if its weight is the answer.";
  const t = mode==="spell" && word ? LK.spellHint(word.t, wordIdx, word.h) : question ? LK.mathHint(question.prompt, question.note) : "";
  return (phase==="ready" ? "Tap the water right next to a fish with the right "+(mode==="spell"?"letter":"weight")+". " : "")+t;
}
function showHint(){ const t = currentHint(); if (phase!=="menu" && phase!=="dayend"){ hint = t; hintT = 9; } return t; }
$("hintBtn").addEventListener("click", e=>{ e.stopPropagation(); showHint(); });
window.addEventListener("keydown", e=>{ if (e.key==="h"||e.key==="H") showHint(); });
function renderBands(){
  const box = $("m-bands"); box.innerHTML = ""; const cur = LK.bandIndex();
  LK.BANDS.forEach((b,i)=>{ const el = document.createElement("button"); el.className = "kl-btn "+(i===cur?"gold on":"cream"); el.textContent = b.label; el.setAttribute("aria-pressed", String(i===cur));
    el.addEventListener("click", ()=>{ LK.setBand(b.id); renderBands(); kit('tap',{volume:.5}); }); box.appendChild(el); });
}
renderBands();

const COACH = [
  {t:()=> mode==="spell" ? "<b>Tap the water</b> right next to a fish showing the <b>letter we need</b>." : "<b>Tap the water</b> right next to the fish that <b>weighs the answer</b>.", done:()=>phase!=="ready"},
  {t:()=> "The bobber dips: a <b>gold ring</b> closes in. "+(COARSE?"Tap":"Tap")+" when it meets the <b>green circle</b>.", done:()=>phase==="hooked"||phase==="result"||answeredToday>0},
  {t:()=> mode==="spell" ? "<b>Keep</b> the fish if it has the <b>next letter</b>. Otherwise, <b>let it go</b>." : "<b>Keep</b> the fish if its <b>weight is the answer</b>. Otherwise, <b>let it go</b>.", done:()=>answeredToday>0},
  {t:()=> "Fill the sign before the bait runs out. Stuck? Tap <b>💡</b>.", done:()=>coachT>7},
];
let coachIx = -1, coachT = 0;
function coachPaint(){
  const el = $("coach");
  if (coachIx<0 || coachIx>=COACH.length || phase==="menu" || phase==="dayend"){ el.classList.add("hidden"); return; }
  $("coach-step").textContent = "HOW TO FISH · "+(coachIx+1)+" OF "+COACH.length;
  $("coach-text").innerHTML = COACH[coachIx].t();
  layoutBoard(); el.style.top = Math.round(L.boardY+L.boardH+10)+"px";
  el.classList.remove("hidden");
}
function coachStart(){ if (phase==="menu"||phase==="dayend") startDay(mode); coachIx = 0; coachT = 0; coachPaint(); }
function coachEnd(done){ const was = coachIx>=0; coachIx = -1; coachPaint();
  if (was && done!==false){ try{ localStorage.setItem("wf_tut","1"); }catch(e){} try{ window.ArcadeSDK && ArcadeSDK.event("tutorial-done"); }catch(e){} } }
function coachMaybe(){ let seen=false; try{ seen = localStorage.getItem("wf_tut")==="1"; }catch(e){} if (!seen && coachIx<0){ coachIx = 0; coachT = 0; coachPaint(); } }
function coachTick(dt){
  if (coachIx<0) return;
  if (coachIx===COACH.length-1) coachT += dt;
  const was = coachIx;
  while (coachIx<COACH.length && COACH[coachIx].done()){ coachIx++; coachT = 0; }
  if (coachIx>=COACH.length) coachEnd(); else if (was!==coachIx) coachPaint();
}
$("coach-skip").addEventListener("click", e=>{ e.stopPropagation(); coachEnd(); });
$("btn-tut").addEventListener("click", ()=>{ meta.pond = Math.min(meta.pond,pondsOpen()-1); coachStart(); });

if (window.ArcadeSDK) ArcadeSDK.init({
  pauseButton: "tr",
  onRestart: restartDay,
  onExit: toTitle,
  onTutorial: coachStart,
  onHint(){ return showHint(); },
});

/* ═══════════ debug hook (playtest gate) ═══════════ */
window.__fish_debug = {
  version: "2.0",
  start(m){ startDay(m==="math"?"math":"spell"); },
  nextDay(){ nextDay(); },
  wipe(){ meta = defMeta(); saveMeta(meta); try{ localStorage.removeItem("wf_tut"); }catch(e){} refreshMenu(); },
  meta(){ return JSON.parse(JSON.stringify(meta)); },
  addStars(n){ meta.stars += n; saveMeta(meta); refreshMenu(); },
  addCoins(n){ meta.coins += n; saveMeta(meta); },
  state(){
    return {
      phase, mode, day, bait, baitMax, castsUsed:baitMax-bait, castsLeft:bait,
      word: word?word.t:null, wordIdx, needLetter:needLetter(), wordsDone,
      prompt: question?question.prompt:null, answer:answerNow(), mathCorrect,
      coins: meta.coins, stars: meta.stars, gear:{...meta.gear}, quotaDone: quotaDone(),
      hint, hintT:+hintT.toFixed(2), toast, hooked: hookedFish?{label:hookedFish.label,rarity:hookedFish.rarity,correct:hookedFish.correct}:null,
      lastResult, ringR:+ring.r.toFixed(1), dayEarnings, trophies: meta.trophies.length, fps, time:+matchT.toFixed(1), pond:meta.pond,
      fish: school.map(f=>({label:f.label,x:Math.round(f.x),y:Math.round(f.y),state:f.state,rarity:f.rarity})),
      keepBtn, relBtn,
      overlayVisible: ["menu","dayend","book","shop","grown"].find(id=>!$(id).classList.contains("hidden")) || null,
    };
  },
  cast(x,y){ if (phase==="ready") castTo(x,y); return phase; },
  castAtNeeded(){ const f = school.find(x=>String(x.label)===String(needNow())&&x.state==="swim"); if (f&&phase==="ready"){ castTo(f.x,f.y); return true; } return false; },
  biteNow(){ if (phase==="waiting"){ if (!target){ target = school.find(x=>x.state==="swim"); if (target){ target.state="nibble"; hook.x=target.x; hook.y=target.y; } } biteNow(); } },
  tap(){ if (phase==="strike") tapStrike(); else if (phase==="ready") { const f=school[0]; if (f) castTo(f.x,f.y); } },
  perfect(){ if (phase!=="strike") return false; ring.r = ring.target; tapStrike(); return true; },
  autoCatch(){ if (phase!=="ready") return false; if (!this.castAtNeeded()) return false; castT = 1; landBobber(); if (target){ nibbleT = 1; biteNow(); ring.r = ring.target; tapStrike(); return true; } return false; },
  finishHook(){ hookT = 1; },
  keep(){ hookT = Math.max(hookT,.8); decideKeep(true); },
  release(){ hookT = Math.max(hookT,.8); decideKeep(false); },
  force(kind,val){ dbgForce = kind==="rarity" ? null : String(val); if (kind==="rarity") dbgRarity = String(val); },
  forceRarity(r){ dbgRarity = String(r); },
  buy(item){ const b = $("buy-"+item); if (b && !b.disabled){ b.click(); return true; } return false; },
  speed(x){ TS = clamp(x,0.25,6); },
  endTrip(){ if (phase!=="menu"&&phase!=="dayend") endTrip(); },
  openBook(i){ openBook(i||0); showOverlay("book"); },
  openShop(){ buildShop(); showOverlay("shop"); },
  setPond(i){ meta.pond = clamp(i,0,PONDS.length-1); bg=null; bgWant=""; },
};
/* the title has a living pond behind it */
(function initMenuScene(){
  resize(); mode = "spell";
  for (let i=0;i<SCHOOL_N();i++){ const f = makeFish(pick("ABCDEGHKLMNOPRSTW".split('')), false); f.born = -5; school.push(f); }
  showOverlay("menu"); sdkState({scene:"title"});
  requestAnimationFrame(frame);
})();

</script>
