<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="../assets/arcade-sdk.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2e9d8">
<title>Field Station</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23f2e9d8'/><rect x='18' y='18' width='64' height='64' fill='none' stroke='%23b8543a' stroke-width='8'/><circle cx='50' cy='50' r='14' fill='%23241f28'/></svg>">
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<div id="coach" role="dialog" aria-modal="true" aria-label="How it works"><div id="coachSpot"></div><div id="coachCard">
  <div class="kicker" id="coachK"></div><p id="coachT"></p>
  <div class="row"><button class="btn ghost" id="coachSkip">Skip</button><button class="btn go" id="coachGo">Next</button></div></div></div>

<script type="module">
import { $, el, Progress, Sound, toast, THEMES, applyTheme } from './js/core.js';

/* ── module registry ──────────────────────────────────────
   Each game is an ES module exporting { meta, start(root, api) }.
   Loaded lazily so the hub stays instant.                    */
const MODULES = [
  { id:'circuit',  file:'./js/games/circuit.js',
    title:'Circuit Bay', subject:'sci', years:'Y7–9',
    topic:'Electricity · series, parallel, V = I × R',
    blurb:'Build real circuits on a node lattice. A nodal-analysis solver computes every voltage and current — bulbs are only as bright as the physics allows.' },

  { id:'etymon',   file:'./js/games/etymon.js',
    title:'Signal Room', subject:'eng', years:'Y5–9',
    topic:'Vocabulary · Greek & Latin morphemes',
    blurb:'Assemble words from roots, prefixes and suffixes. Then decode words you have never seen — the whole point of knowing morphemes.' },

  { id:'particles',file:'./js/games/particles.js',
    title:'Particle Chamber', subject:'sci', years:'Y7–8',
    topic:'States of matter · kinetic theory',
    blurb:'A live molecular-dynamics simulation. Heat it, cool it, squeeze it. Melting and boiling are things you cause, not facts you memorise.' },

  { id:'punctuation', file:'./js/games/punctuation.js',
    title:'Log Office', subject:'eng', years:'Y5–8',
    topic:'Punctuation · meaning and ambiguity',
    blurb:'Station logs arrive unpunctuated. Place the marks — and watch the sentence mean two completely different things depending where the comma lands.' },

  { id:'reaction', file:'./js/games/reaction.js',
    title:'Reaction Bench', subject:'sci', years:'Y8–9',
    topic:'Chemical equations · conservation of mass',
    blurb:'Balance equations with live atom-count bars on both sides. You can see conservation of mass happening rather than being told about it.' },

  { id:'foodweb',  file:'./js/games/foodweb.js',
    title:'Ecology Deck', subject:'sci', years:'Y6–9',
    topic:'Ecosystems · food webs, trophic cascades',
    blurb:'A population model with real feedback. Remove one species and watch the collapse ripple through the web three levels away.' },

  { id:'syntax',   file:'./js/games/syntax.js',
    title:'Drafting Room', subject:'eng', years:'Y5–9',
    topic:'Grammar · clauses and sentence structure',
    blurb:'Build sentences from clause blocks against a brief: fronted adverbial, relative clause, complex sentence. Grammar as construction, not labelling.' }
];

const FIG = {
  circuit:`<svg viewBox="0 0 200 100"><g fill="none" stroke="#241f28" stroke-width="2.5">
    <path d="M20 30h50M100 30h80M20 30v40M20 70h160v-40"/><circle cx="85" cy="30" r="15"/>
    <path d="M75 20l20 20M75 40l20-20"/></g>
    <rect x="55" y="62" width="6" height="16" fill="#241f28"/><rect x="66" y="56" width="6" height="28" fill="#241f28"/>
    <circle cx="85" cy="30" r="22" fill="#c98b32" opacity=".25"/></svg>`,
  etymon:`<svg viewBox="0 0 200 100"><g font-family="Archivo Black" font-size="19" fill="#241f28">
    <rect x="14" y="34" width="52" height="32" fill="none" stroke="#6b4258" stroke-width="2.5"/><text x="24" y="56" fill="#6b4258">bio</text>
    <rect x="72" y="34" width="46" height="32" fill="none" stroke="#241f28" stroke-width="2.5"/><text x="82" y="56">log</text>
    <rect x="124" y="34" width="46" height="32" fill="none" stroke="#b8543a" stroke-width="2.5"/><text x="134" y="56" fill="#b8543a">ist</text>
    </g><path d="M14 78h156" stroke="#241f28" stroke-width="2"/></svg>`,
  particles:`<svg viewBox="0 0 200 100"><rect x="12" y="12" width="176" height="76" fill="none" stroke="#241f28" stroke-width="2.5"/>
    <g fill="#3f5c6b">${Array.from({length:22},(_,i)=>`<circle cx="${22+((i*37)%156)}" cy="${24+((i*53)%56)}" r="5"/>`).join('')}</g>
    <g stroke="#b8543a" stroke-width="2"><path d="M40 76l14-12M96 30l16 10M150 66l-14-14"/></g></svg>`,
  punctuation:`<svg viewBox="0 0 200 100"><g font-family="Newsreader" font-size="46" fill="#241f28">
    <text x="20" y="62">Let’s eat</text></g>
    <text x="132" y="62" font-family="Newsreader" font-size="46" fill="#b8543a">,</text>
    <path d="M20 74h150" stroke="#241f28" stroke-width="2"/>
    <text x="20" y="92" font-family="Archivo" font-size="11" fill="#4a4150">one comma, two meanings</text></svg>`,
  reaction:`<svg viewBox="0 0 200 100"><g font-family="Archivo Black" font-size="17" fill="#241f28">
    <text x="16" y="46">CH₄ + 2O₂</text><text x="118" y="46">CO₂</text></g>
    <path d="M100 40h14M108 34l7 6-7 6" stroke="#b8543a" stroke-width="2.5" fill="none"/>
    <g><rect x="16" y="58" width="34" height="9" fill="#5f7d5a"/><rect x="16" y="70" width="34" height="9" fill="#5f7d5a"/>
    <rect x="118" y="58" width="34" height="9" fill="#5f7d5a"/><rect x="118" y="70" width="34" height="9" fill="#5f7d5a"/></g></svg>`,
  foodweb:`<svg viewBox="0 0 200 100"><g stroke="#241f28" stroke-width="2" fill="none">
    <path d="M40 78L70 46M100 78L70 46M70 46L120 30M160 74L120 30M120 30L100 78"/></g>
    <g fill="#5f7d5a"><circle cx="40" cy="78" r="9"/><circle cx="100" cy="78" r="9"/><circle cx="160" cy="74" r="9"/></g>
    <circle cx="70" cy="46" r="10" fill="#c98b32"/><circle cx="120" cy="30" r="11" fill="#b8543a"/></svg>`,
  syntax:`<svg viewBox="0 0 200 100">
    <rect x="12" y="26" width="64" height="26" fill="#6b4258"/><rect x="82" y="26" width="46" height="26" fill="#241f28"/>
    <rect x="134" y="26" width="54" height="26" fill="none" stroke="#241f28" stroke-width="2.5" stroke-dasharray="5 4"/>
    <g font-family="Archivo" font-size="9" font-weight="700" fill="#f2e9d8" letter-spacing="1">
      <text x="20" y="43">ADVERBIAL</text><text x="90" y="43">MAIN</text></g>
    <text x="140" y="43" font-family="Archivo" font-size="9" font-weight="700" fill="#241f28">SUB?</text>
    <path d="M12 66h176" stroke="#241f28" stroke-width="2"/>
    <path d="M12 74h120" stroke="#b8543a" stroke-width="2"/></svg>`
};

/* ── arcade layer: year bands, scenes, hints, coach, grown-up report ── */
const sdk = (fn, a) => { try { if (window.ArcadeSDK) ArcadeSDK[fn](a); } catch (e) {} };
const yearsOf = m => { const n = m.years.match(/\d+/g).map(Number); return [n[0], n[n.length - 1]]; };
const BANDS = [ { id:'all', label:'All years', lo:5, hi:9 }, { id:'y56', label:'Y5–6', lo:5, hi:6 },
                { id:'y78', label:'Y7–8', lo:7, hi:8 }, { id:'y9', label:'Y9', lo:9, hi:9 } ];
let band = (() => { try { const b = localStorage.getItem('fieldstation.band'); return BANDS.some(x => x.id === b) ? b : 'all'; } catch (e) { return 'all'; } })();
const inBand = m => { const B = BANDS.find(x => x.id === band), [lo, hi] = yearsOf(m); return hi >= B.lo && lo <= B.hi; };
let current = null, hintFn = null;
function nextModule() {
  const list = MODULES.filter(inBand);
  return list.slice().sort((a, b) => Progress.moduleScore(a.id) - Progress.moduleScore(b.id))[0] || MODULES[0];
}
function hubHint() {
  const m = nextModule(), pct = Progress.moduleScore(m.id);
  const skills = Progress.all().skills, weak = Object.keys(skills).sort((a, b) => skills[a] - skills[b])[0];
  return `Try ${m.title} next (${m.topic}): it is ${pct ? pct + '% certified' : 'not started yet'}.` +
    (weak && skills[weak] < 50 ? ` Your weakest skill so far is ${weak.split('/')[1] || weak} (${Math.round(skills[weak])}%).` : '');
}

/* ── hub ─────────────────────────────────────────────────── */
function hudStrip() {
  const d = Progress.daily();
  const badges = Progress.badgeLabels();
  return el('div', { class:'panel', style:'margin-top:14px;padding:12px 16px', id:'hud' },
    el('div', { style:'display:flex;flex-wrap:wrap;gap:10px;align-items:center' },
      el('span', { class:'tag', style:'background:var(--ink);color:var(--paper);border-color:var(--ink)' },
        `Level ${Progress.level()} · ${Progress.xp()} XP`),
      el('span', { class:'bar', style:'width:110px;display:inline-block' }, el('i', { style:`width:${Progress.levelPct()}%` })),
      el('span', { class:'tag' }, `⭐ ${Progress.stars()} stars`),
      el('span', { class:'tag' }, `🪙 ${Progress.coins()} coins`),
      el('span', { class:'tag ' + (d.done ? '' : '') , style: d.done ? 'background:#5f7d5a;color:#f2e9d8;border-color:#5f7d5a' : '' },
        `Daily goal: ${Math.min(d.correct, d.goal)}/${d.goal} correct${d.done ? ' · bonus paid' : ''}`),
      badges.length ? el('span', { class:'tag', style:'border-style:dashed' }, `Achievements: ${badges.length} — ${badges.join(', ')}`)
                    : el('span', { class:'tag', style:'border-style:dashed' }, 'Achievements: earn your first answer badge today')));
}

function renderHub() {
  const db = Progress.all();
  Progress.rollDaily();
  const done = MODULES.filter(m => Progress.moduleScore(m.id) >= 100).length;
  const app = $('#app');
  app.replaceChildren();
  current = null; hintFn = null;
  sdk('state', { scene:'title', level: Progress.level(), stars: Progress.stars() });

  const head = el('div', { class:'masthead' },
    el('div', {},
      el('div', { class:'kicker' }, 'Northern Reach Field Station · Curriculum Wing'),
      el('h1', { class:'h1', style:'margin-top:6px' }, 'Field Station'),
      el('div', { class:'rule' }),
      el('p', { class:'lede' },
        'Seven instruments. Each one only works if you understand what it is doing — ' +
        'there is no answer to guess, because you are operating the thing itself.')),
    el('div', { style:'text-align:right' },
      el('div', { class:'kicker' }, 'Station record'),
      el('div', { style:'font-family:var(--display);font-size:1.5rem;margin-top:4px' },
        `${done}/${MODULES.length} certified`),
      el('div', { class:'note', style:'margin-top:2px' },
        `${db.totalRight} correct · ${db.streak} day streak`),
      el('div', { class:'note', style:'margin-top:2px' },
        `Level ${Progress.level()} · ⭐ ${Progress.stars()} stars · 🪙 ${Progress.coins()} coins`),
      el('button', { class:'btn go', id:'playNext', style:'margin-top:10px', onclick: () => open(nextModule()) },
        'Play · ' + nextModule().title)));
  app.append(head);
  app.append(hudStrip());

  app.append(el('div', { class:'bandrow', id:'bandRow', role:'group', 'aria-label':'Year group' },
    el('span', { class:'lbl' }, 'Year group'),
    BANDS.map(B => el('button', { class:'chip' + (B.id === band ? ' on' : ''), 'aria-pressed': String(B.id === band),
      onclick: () => { band = B.id; try { localStorage.setItem('fieldstation.band', band); } catch (e) {} renderHub(); } }, B.label))));

  /* Station shop: earned coins buy notebook themes; certifications unlock the premium ones. */
  const owned = Progress.ownedThemes(), using = Progress.theme();
  app.append(el('div', { class:'panel', id:'shop', style:'margin-top:18px' },
    el('h3', {}, 'Station shop · themes'),
    el('div', { class:'note' }, 'Coins are earned by answering questions and clearing the daily goal. Certified instruments unlock the premium notebooks.'),
    el('div', { class:'row', style:'margin-top:10px' },
      THEMES.map(t => {
        const isOwned = owned.includes(t.id), isInUse = using === t.id;
        const dots = el('span', { style:'display:inline-flex;gap:3px;margin-left:6px;vertical-align:-2px' },
          Object.values(t.vars).slice(0, 4).map(c => el('i', { style:`display:inline-block;width:11px;height:11px;border:1.5px solid var(--line);background:${c};border-radius:50%` })));
        const state = isInUse ? 'In use' : isOwned ? 'Owned' : t.req && Progress.certifiedCount() < t.req ? `🔒 certify ${t.req}` : `🪙 ${t.price}`;
        return el('button', { class:'chip' + (isInUse ? ' on' : ''), 'aria-pressed': String(isInUse),
          onclick: () => {
            const r = Progress.buyTheme(t.id);
            if (!r.ok) { toast(r.why, 'err'); Sound.no(); return; }
            toast(r.bought ? `${t.label} unlocked and applied!` : `${t.label} applied`, r.bought ? 'win' : '');
            Sound.click(); renderHub();
          } }, t.label + ' — ' + state, dots);
      }))));

  const grid = el('div', { class:'grid' });
  MODULES.filter(inBand).forEach(m => {
    const pct = Progress.moduleScore(m.id);
    const fig = el('div', { class:'fig' });
    fig.innerHTML = FIG[m.id];                       // static author-authored SVG
    const card = el('button', { class:'card mod', onclick: () => open(m) },
      fig,
      el('div', { class:'body' },
        el('div', { class:'h2' }, m.title),
        el('div', { class:'note', style:'margin-top:4px;color:var(--rust);font-weight:700;font-size:.75rem' }, m.topic),
        el('p', {}, m.blurb),
        el('div', { class:'meta' },
          el('span', { class:'tag ' + m.subject }, m.subject === 'sci' ? 'Science' : 'English'),
          el('span', { class:'tag' }, m.years),
          pct >= 100 ? el('span', { class:'tag', style:'background:#5f7d5a;color:#f2e9d8;border-color:#5f7d5a' }, 'Certified') : ''),
        el('div', { class:'bar' }, el('i', { style:`width:${pct}%` }))));
    grid.append(card);
  });
  app.append(grid);

  app.append(el('div', { class:'panel', style:'margin-top:26px' },
    el('h3', {}, 'Skill map'),
    skillMap(),
    el('div', { style:'margin-top:14px', class:'row' },
      el('button', { class:'btn', id:'reportBtn', onclick: showReport }, 'Report for grown-ups'),
      el('button', { class:'btn ghost', onclick: () => coachStart() }, 'How it works'),
      el('button', { class:'btn ghost', onclick: () => {
        if (confirm('Erase all station records?')) { Progress.reset(); renderHub(); }
      }}, 'Reset record'))));
  let seen = false; try { seen = localStorage.getItem('fieldstation.tut') === '1'; } catch (e) {}
  if (!seen) setTimeout(() => { if (!current && !COACH) coachStart(); }, 400);
}

/* A plain progress report a parent or teacher can read (and print): per instrument and per skill. */
function showReport() {
  const db = Progress.all(), app = $('#app');
  const total = db.totalRight + db.totalWrong, acc = total ? Math.round(db.totalRight / total * 100) : 0;
  const skills = Object.entries(db.skills).sort((a, b) => b[1] - a[1]);
  const lvl = p => p >= 100 ? 'Certified' : p >= 75 ? 'Advanced' : p >= 50 ? 'Proficient' : p >= 25 ? 'Practised' : p >= 1 ? 'Started' : 'Not started';
  app.replaceChildren(
    el('div', { class:'gamebar' },
      el('button', { class:'btn ghost', onclick: renderHub }, '← Station'),
      el('div', {}, el('div', { class:'kicker' }, 'For parents and teachers'), el('div', { class:'h2', style:'margin-top:2px' }, 'Progress report'))),
    el('div', { class:'panel report' },
      el('h3', {}, 'Summary'),
      el('p', { class:'note' }, `${db.totalRight} correct and ${db.totalWrong} missed answers (${acc}% accuracy) · ${db.streak} day streak · ` +
        `${MODULES.filter(m => Progress.moduleScore(m.id) >= 100).length} of ${MODULES.length} instruments certified.`),
      el('h3', { style:'margin-top:16px' }, 'Instruments'),
      el('table', {}, el('tr', {}, el('th', {}, 'Instrument'), el('th', {}, 'Years'), el('th', {}, 'Level'), el('th', {}, 'Done')),
        MODULES.map(m => { const p = Progress.moduleScore(m.id);
          return el('tr', {}, el('td', {}, m.title + ' — ' + m.topic), el('td', {}, m.years), el('td', {}, lvl(p)), el('td', {}, p + '%')); })),
      el('h3', { style:'margin-top:16px' }, 'Skills (mastery estimate, mistakes count double)'),
      skills.length ? el('table', {}, skills.map(([k, v]) => el('tr', {}, el('td', {}, k.replace('/', ' · ')), el('td', {}, Math.round(v) + '%'))))
                    : el('p', { class:'note' }, 'No graded attempts yet.'),
      el('p', { class:'note', style:'margin-top:12px' }, skills.length ? `Next step: ${hubHint()}` : 'Next step: open any instrument; every graded answer lands here.'),
      el('div', { class:'row noprint', style:'margin-top:14px' },
        el('button', { class:'btn', onclick: () => print() }, 'Print'),
        el('button', { class:'btn ghost', onclick: renderHub }, 'Back to station'))));
  scrollTo(0, 0);
}

/* first-visit coach marks on the station */
let COACH = null;
const COACH_STEPS = [
  { sel:'.grid .mod', k:'1 / 3 · Instruments', t:'Each card is an instrument. Open one and operate it: there is no answer to guess, and every wrong answer explains why.' },
  { sel:'#bandRow', k:'2 / 3 · Year group', t:'Pick your year group to show the instruments made for it. The Play button opens the one you have done least.' },
  { sel:'#reportBtn', k:'3 / 3 · Progress', t:'Every graded answer updates the skill map. Grown-ups can open the report, and Hint (in the pause menu) helps on any question.' }
];
function coachStart() {
  if (current) renderHub();
  COACH = { i:0 }; $('#coach').classList.add('on'); coachPaint(); sdk('event', 'tutorial-start');
}
function coachPaint() {
  if (!COACH) return;
  const st = COACH_STEPS[COACH.i], e = document.querySelector(st.sel);
  if (e) e.scrollIntoView({ block:'center' });
  const r = e ? e.getBoundingClientRect() : { left:0, top:0, width:0, height:0 };
  const sp = $('#coachSpot'), cc = $('#coachCard');
  Object.assign(sp.style, { left:(r.left - 6) + 'px', top:(r.top - 6) + 'px', width:(r.width + 12) + 'px', height:(r.height + 12) + 'px' });
  $('#coachK').textContent = st.k; $('#coachT').textContent = st.t;
  $('#coachGo').textContent = COACH.i === COACH_STEPS.length - 1 ? 'Start' : 'Next';
  const low = r.top + r.height / 2 > innerHeight * 0.5;
  cc.style.top = low ? '16px' : 'auto'; cc.style.bottom = low ? 'auto' : '16px';
}
function coachEnd(done) {
  if (!COACH) return; COACH = null; $('#coach').classList.remove('on');
  try { localStorage.setItem('fieldstation.tut', '1'); } catch (e) {}
  if (done) sdk('event', 'tutorial-done');
}
$('#coachGo').onclick = () => { if (!COACH) return; COACH.i++; COACH.i >= COACH_STEPS.length ? coachEnd(true) : coachPaint(); };
$('#coachSkip').onclick = () => coachEnd();
addEventListener('resize', () => { if (COACH) coachPaint(); });

function skillMap() {
  const skills = Progress.all().skills;
  const keys = Object.keys(skills).sort((a, b) => skills[b] - skills[a]);
  if (!keys.length) return el('p', { class:'note' },
    'Nothing recorded yet. Every graded attempt in any instrument lands here, tracked per skill.');
  return el('div', {},
    keys.map(k => el('div', { style:'margin-bottom:9px' },
      el('div', { style:'display:flex;justify-content:space-between;font-size:.8rem;font-weight:700' },
        el('span', {}, k), el('span', {}, Math.round(skills[k]) + '%')),
      el('div', { class:'bar', style:'margin-top:3px' },
        el('i', { style:`width:${skills[k]}%;background:${skills[k] > 70 ? '#5f7d5a' : skills[k] > 35 ? '#c98b32' : '#b8543a'}` })))));
}

/* ── loader ──────────────────────────────────────────────── */
async function open(m) {
  coachEnd();
  current = m; hintFn = null;
  Sound.init();
  const app = $('#app');
  app.replaceChildren(el('p', { class:'note' }, 'Opening ' + m.title + '…'));
  const visit = Progress.visit(m.id);          // XP for starting a shift at an instrument
  if (visit) {
    let msg = `Shift started · +${visit.xp} XP`;
    if (visit.leveled) msg += ` · Level ${Progress.level()}!`;
    for (const b of visit.newBadges) msg += ` · New achievement: ${b}`;
    toast(msg);
  }
  try {
    const mod = await import(m.file);
    app.replaceChildren();
    const bar = el('div', { class:'gamebar' },
      el('button', { class:'btn ghost', onclick: renderHub }, '← Station'),
      el('div', {},
        el('div', { class:'kicker' }, m.topic),
        el('div', { class:'h2', style:'margin-top:2px' }, m.title)),
      el('div', { class:'spacer' }),
      el('span', { class:'tag ' + m.subject }, m.subject === 'sci' ? 'Science' : 'English'),
      el('span', { class:'tag' }, m.years));
    app.append(bar);
    const d = Progress.daily();
    app.append(el('div', { id:'hud', class:'note', style:'display:flex;gap:8px;flex-wrap:wrap;margin:8px 2px' },
      el('span', { class:'tag', style:'background:var(--ink);color:var(--paper);border-color:var(--ink)' }, `Level ${Progress.level()}`),
      el('span', { class:'tag' }, `⭐ ${Progress.stars()} stars`),
      el('span', { class:'tag' }, `🪙 ${Progress.coins()} coins`),
      el('span', { class:'tag', style: d.done ? 'background:#5f7d5a;color:#f2e9d8;border-color:#5f7d5a' : '' },
        `Daily goal: ${Math.min(d.correct, d.goal)}/${d.goal} correct`)));
    const root = el('div');
    app.append(root);
    mod.start(root, {
      record: (skill, ok) => Progress.record(m.id + '/' + skill, ok),
      complete: pct => { Progress.setModule(m.id, pct); },
      setHint: fn => { hintFn = fn; },                               // each instrument keeps its current hint fresh
      done: pct => sdk('state', { scene:'over', score: pct, level: Progress.level(), stars: Progress.stars() }),  // the instrument's end-of-run screen
      toast, Sound, home: renderHub
    });
    scrollTo(0, 0);
    sdk('state', { scene:'play', level: Progress.level(), stars: Progress.stars() });
  } catch (err) {
    app.replaceChildren(
      el('button', { class:'btn ghost', onclick: renderHub }, '← Station'),
      el('div', { class:'panel', style:'margin-top:16px' },
        el('h3', {}, 'Instrument offline'),
        el('p', { class:'note' }, String(err && err.message || err))));
  }
}

/* Anti-slop: the first screen is the GAME, not the instrument menu.
   Boot straight into the weakest instrument (its live sandbox, motion and all);
   the gamebar's "← Station" button still reaches the hub to switch instruments. */
try { open(nextModule()); } catch (e) { renderHub(); }
applyTheme(Progress.theme());
addEventListener('pointerdown', () => Sound.init(), { once:true });
if (window.ArcadeSDK) ArcadeSDK.init({
  onRestart: () => { if (current) open(current); else open(nextModule()); },   // run the current instrument again from its first item
  onExit: renderHub,
  onTutorial: coachStart,
  onHint: () => { try { return hintFn ? hintFn() : hubHint(); } catch (e) { return hubHint(); } }
});
</script>
</body>
