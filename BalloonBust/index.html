<!DOCTYPE html>
<html lang="en">

<title>Balloon Bust</title>
<style>
  @font-face{font-family:"Fredoka";src:url("../assets/fonts/fredoka.woff2") format("woff2");font-weight:300 700;font-display:swap}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#5d88b8;overscroll-behavior:none;
    font-family:"Fredoka","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  #c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
  #safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  /* the arcade's pause button, dressed as a gold-trimmed navy glass disc */
  html body #arcade-sdk-btn{width:46px;height:46px;border-radius:50%;background:linear-gradient(180deg,#2a4674,#0e1c38);
    border:2px solid #e2b040;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 3px 8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}
  html body #arcade-sdk-btn rect{fill:#ffe7a0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<script>
"use strict";
/*@kidlook*/
/* KL: a small canvas "rich look" kit. Warm light, layered depth, real-feeling surfaces (wood, parchment, gold, navy glass),
   built from gradients and seeded noise, cached as sprites so a phone draws them with drawImage. No outlines-as-style. */
const KL=(function(){
  'use strict';
  const TAU=Math.PI*2, K={}, cache=new Map();
  /* a sprite cache with a ceiling: sizes that vary (bars, panels) can never grow it without limit */
  const _cset=cache.set;cache.set=function(k,v){if(this.size>=240)this.delete(this.keys().next().value);return _cset.call(this,k,v);};
  let DPR=1;
  K.cache=cache;
  K.dpr=function(d){if(d!==undefined&&d!==DPR){DPR=d;cache.clear();grainT=null;}return DPR;};
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  K.clamp=clamp;
  K.rng=function(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296;};};
  /* ---- colour ---- */
  function h2r(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
  function r2h(r,g,b){const f=v=>('0'+Math.round(clamp(v,0,255)).toString(16)).slice(-2);return'#'+f(r)+f(g)+f(b);}
  K.mix=function(a,b,t){const A=h2r(a),B=h2r(b);return r2h(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);};
  K.lit=function(h,a){return K.mix(h,'#fff3d6',a);};      /* light goes warm */
  K.dark=function(h,a){return K.mix(h,'#241a4a',a);};     /* shadow goes cool and violet, never grey */
  K.rgba=function(h,a){const c=h2r(h);return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';};
  K.make=function(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*DPR));c.height=Math.max(1,Math.round(h*DPR));const g=c.getContext('2d');g.scale(DPR,DPR);return{c,g,w,h};};
  function rp(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
  K.rp=rp;
  /* ---- grain: one small noise tile, laid over surfaces with a blend mode ---- */
  let grainT=null;
  function grainTile(){
    if(grainT)return grainT;const s=96,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d'),id=g.createImageData(s,s),R=K.rng(11);
    for(let i=0;i<s*s;i++){const v=128+(R()-.5)*110+(R()<.03?(R()-.5)*90:0);id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=255;}
    g.putImageData(id,0,0);grainT=c;return c;
  }
  K.grain=function(g,x,y,w,h,alpha,mode){g.save();g.globalCompositeOperation=mode||'overlay';g.globalAlpha=alpha;g.fillStyle=g.createPattern(grainTile(),'repeat');g.fillRect(x,y,w,h);g.restore();};
  /* ---- surfaces ---- */
  K.wood=function(g,x,y,w,h,base,seed){
    base=base||'#7b4b27';const R=K.rng(seed||3);
    const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,K.lit(base,.16));gr.addColorStop(.45,base);gr.addColorStop(1,K.dark(base,.32));g.fillStyle=gr;g.fillRect(x,y,w,h);
    g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
    const n=Math.max(10,Math.round(h/2.6));
    for(let i=0;i<n;i++){const yy=y+R()*h,amp=.6+R()*2.2,ph=R()*6,f=.006+R()*.02;
      g.strokeStyle=R()<.55?'rgba(38,18,6,'+(.05+R()*.15)+')':'rgba(255,214,160,'+(.03+R()*.08)+')';g.lineWidth=.5+R()*1.5;g.beginPath();
      for(let xx=0;xx<=w;xx+=10){const yv=yy+Math.sin(xx*f+ph)*amp;xx?g.lineTo(x+xx,yv):g.moveTo(x,yv);}g.stroke();}
    const knots=Math.round(w/200);
    for(let k=0;k<knots;k++){const kx=x+R()*w,ky=y+h*(.25+R()*.5),kr=3+R()*5;const kg=g.createRadialGradient(kx,ky,0,kx,ky,kr*2);kg.addColorStop(0,K.rgba('#2a1206',.55));kg.addColorStop(.5,K.rgba('#3a1c0a',.25));kg.addColorStop(1,K.rgba('#3a1c0a',0));g.fillStyle=kg;g.beginPath();g.ellipse(kx,ky,kr*2.4,kr*1.1,0,0,TAU);g.fill();}
    g.restore();K.grain(g,x,y,w,h,.16,'overlay');
  };
  K.parch=function(g,x,y,w,h,seed,tone){
    const R=K.rng(seed||5);tone=tone||'#f1e0b8';
    const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,K.lit(tone,.32));gr.addColorStop(1,K.dark(tone,.08));g.fillStyle=gr;g.fillRect(x,y,w,h);
    g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
    for(let i=0;i<Math.round(w*h/2600);i++){const sx=x+R()*w,sy=y+R()*h,sr=8+R()*26,sg=g.createRadialGradient(sx,sy,0,sx,sy,sr);sg.addColorStop(0,'rgba(150,105,45,'+(.04+R()*.07)+')');sg.addColorStop(1,'rgba(150,105,45,0)');g.fillStyle=sg;g.beginPath();g.arc(sx,sy,sr,0,TAU);g.fill();}
    for(let i=0;i<Math.round(w*h/900);i++){const fx=x+R()*w,fy=y+R()*h,a=R()*TAU,l=3+R()*9;g.strokeStyle=R()<.5?'rgba(120,80,30,.07)':'rgba(255,250,230,.12)';g.lineWidth=.6;g.beginPath();g.moveTo(fx,fy);g.lineTo(fx+Math.cos(a)*l,fy+Math.sin(a)*l);g.stroke();}
    const e=Math.min(22,Math.min(w,h)*.22),edge=(x0,y0,x1,y1,rx,ry,rw,rh)=>{const eg=g.createLinearGradient(x0,y0,x1,y1);eg.addColorStop(0,'rgba(110,68,22,.38)');eg.addColorStop(1,'rgba(110,68,22,0)');g.fillStyle=eg;g.fillRect(rx,ry,rw,rh);};
    edge(x,0,x+e,0,x,y,e,h);edge(x+w,0,x+w-e,0,x+w-e,y,e,h);edge(0,y,0,y+e,x,y,w,e);edge(0,y+h,0,y+h-e,x,y+h-e,w,e);
    g.restore();K.grain(g,x,y,w,h,.22,'multiply');
  };
  K.glass=function(g,x,y,w,h){
    const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'#26406a');gr.addColorStop(.55,'#122444');gr.addColorStop(1,'#0b1730');g.fillStyle=gr;g.fillRect(x,y,w,h);
    const gl=g.createLinearGradient(0,y,0,y+h*.5);gl.addColorStop(0,'rgba(190,215,255,.28)');gl.addColorStop(1,'rgba(190,215,255,0)');g.fillStyle=gl;g.fillRect(x,y,w,h*.5);
    K.grain(g,x,y,w,h,.10,'overlay');
  };
  /* a panel: rounded, lit from above-left, with a soft drop shadow. kind: parch | wood | plank | glass */
  K.panel=function(kind,w,h,o){
    o=o||{};const r=o.r!=null?o.r:Math.min(20,h*.22),pad=o.shadow===false?3:16,key='P|'+kind+'|'+Math.round(w)+'|'+Math.round(h)+'|'+r+'|'+(o.tone||'')+'|'+(o.gold?1:0)+'|'+DPR;
    const hit=cache.get(key);if(hit)return hit;
    const m=K.make(w+pad*2,h+pad*2),g=m.g;g.translate(pad,pad);
    if(o.shadow!==false){g.save();g.shadowColor='rgba(28,14,6,.5)';g.shadowBlur=14;g.shadowOffsetY=6;g.fillStyle='#000';rp(g,0,0,w,h,r);g.fill();g.restore();}
    g.save();rp(g,0,0,w,h,r);g.clip();
    if(kind==='parch')K.parch(g,0,0,w,h,w+h,o.tone);
    else if(kind==='wood')K.wood(g,0,0,w,h,o.tone||'#7b4b27',w*3+h);
    else if(kind==='plank')K.wood(g,0,0,w,h,o.tone||'#a8703c',w+h*7);
    else K.glass(g,0,0,w,h);
    /* bevel: light on the top-left edge, shade on the bottom-right */
    const bv=g.createLinearGradient(0,0,0,h);bv.addColorStop(0,'rgba(255,240,205,.34)');bv.addColorStop(.06,'rgba(255,240,205,0)');bv.addColorStop(.92,'rgba(20,8,2,0)');bv.addColorStop(1,'rgba(20,8,2,.34)');g.fillStyle=bv;g.fillRect(0,0,w,h);
    g.restore();
    /* trim */
    if(o.gold||kind==='glass'||kind==='wood'){
      const tg=g.createLinearGradient(0,0,w,h);tg.addColorStop(0,'#fff0b0');tg.addColorStop(.35,'#e2b040');tg.addColorStop(.7,'#a8741c');tg.addColorStop(1,'#f2cf6a');
      g.lineWidth=kind==='glass'?2:2.6;g.strokeStyle=tg;rp(g,1.4,1.4,w-2.8,h-2.8,r);g.stroke();
      g.lineWidth=1;g.strokeStyle='rgba(60,30,6,.55)';rp(g,.3,.3,w-.6,h-.6,r);g.stroke();
    }else{g.lineWidth=1.4;g.strokeStyle=kind==='parch'?'rgba(122,80,30,.65)':'rgba(30,14,4,.6)';rp(g,.7,.7,w-1.4,h-1.4,r);g.stroke();}
    const s={c:m.c,pad,w,h};cache.set(key,s);return s;
  };
  K.drawPanel=function(g,kind,x,y,w,h,o){const s=K.panel(kind,w,h,o);g.drawImage(s.c,x-s.pad,y-s.pad,w+s.pad*2,h+s.pad*2);};
  /* a glossy button. tone: gold | green | blue | coral | wood | cream */
  const TONES={gold:['#ffe89a','#e8b338','#a8721a','#6b430a'],green:['#b7ec8c','#58ad46','#2f7229','#1d4a19'],blue:['#a6d6f8','#4a8fd0','#2760a0','#173d6b'],
    coral:['#f8b39a','#d9603f','#9a3520','#5e1d0f'],wood:['#b98657','#8a5a30','#5a3719','#341e0b'],cream:['#fffaf0','#f0e2c4','#c4a878','#7a5a2a'],plum:['#d8b8f0','#9a64c8','#623e92','#3b2260']};
  K.button=function(tone,w,h,pressed){
    const T=TONES[tone]||TONES.gold,r=Math.min(h*.36,22),pad=8,key='B|'+tone+'|'+Math.round(w)+'|'+Math.round(h)+'|'+(pressed?1:0)+'|'+DPR,hit=cache.get(key);if(hit)return hit;
    const lip=pressed?2:Math.max(3,h*.08),m=K.make(w+pad*2,h+pad*2+lip),g=m.g;g.translate(pad,pad);
    if(!pressed){g.save();g.shadowColor='rgba(20,10,4,.45)';g.shadowBlur=9;g.shadowOffsetY=5;g.fillStyle='#000';rp(g,0,lip,w,h,r);g.fill();g.restore();}
    g.fillStyle=T[3];rp(g,0,lip,w,h,r);g.fill();
    const yy=pressed?lip*.6:0;
    const gr=g.createLinearGradient(0,yy,0,yy+h);gr.addColorStop(0,T[0]);gr.addColorStop(.5,T[1]);gr.addColorStop(1,T[2]);g.fillStyle=gr;rp(g,0,yy,w,h,r);g.fill();
    g.save();rp(g,0,yy,w,h,r);g.clip();
    const sh=g.createLinearGradient(0,yy,0,yy+h*.55);sh.addColorStop(0,'rgba(255,255,255,.55)');sh.addColorStop(1,'rgba(255,255,255,.04)');g.fillStyle=sh;rp(g,w*.04,yy+h*.05,w*.92,h*.46,r*.8);g.fill();
    const bt=g.createLinearGradient(0,yy+h*.6,0,yy+h);bt.addColorStop(0,'rgba(255,255,255,0)');bt.addColorStop(1,'rgba(255,255,255,.16)');g.fillStyle=bt;g.fillRect(0,yy+h*.6,w,h*.4);
    g.restore();K.grain(g,0,yy,w,h,.06,'overlay');
    g.lineWidth=1.6;g.strokeStyle=K.rgba(T[3],.85);rp(g,.8,yy+.8,w-1.6,h-1.6,r);g.stroke();
    g.lineWidth=1;g.strokeStyle='rgba(255,246,214,.55)';rp(g,2.2,yy+2.2,w-4.4,h-4.4,r-1.4);g.stroke();
    const s={c:m.c,pad,lip};cache.set(key,s);return s;
  };
  K.drawButton=function(g,tone,x,y,w,h,pressed){const s=K.button(tone,w,h,pressed);g.drawImage(s.c,x-s.pad,y-s.pad,w+s.pad*2,h+s.pad*2+s.lip);};
  /* text with a soft engraved feel: a dark drop under light text, or a light lip under dark text */
  K.text=function(g,s,x,y,px,col,align,weight,font,mode){
    g.font=(weight||700)+' '+Math.round(px)+'px '+(font||'Fredoka,system-ui,sans-serif');g.textAlign=align||'center';g.textBaseline='middle';
    if(mode==='engrave'){g.fillStyle='rgba(255,246,214,.7)';g.fillText(s,x,y+Math.max(1,px*.045));g.fillStyle=col;g.fillText(s,x,y);}
    else if(mode==='plain'){g.fillStyle=col;g.fillText(s,x,y);}
    else{g.fillStyle='rgba(30,14,4,.62)';g.fillText(s,x,y+Math.max(1.2,px*.07));g.fillStyle=col;g.fillText(s,x,y);}
  };
  /* ---- sky, light, cloud ---- */
  K.sky=function(g,w,h,stops){const gr=g.createLinearGradient(0,0,0,h);stops.forEach(s=>gr.addColorStop(s[0],s[1]));g.fillStyle=gr;g.fillRect(0,0,w,h);};
  K.glow=function(g,x,y,r,col,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,K.rgba(col,a));gr.addColorStop(.3,K.rgba(col,a*.45));gr.addColorStop(1,K.rgba(col,0));g.save();g.globalCompositeOperation='screen';g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);g.restore();};
  K.rays=function(g,x,y,len,n,a,col,seed,spread,dir){
    const R=K.rng(seed||9);g.save();g.globalCompositeOperation='screen';
    for(let i=0;i<n;i++){const ang=(dir||Math.PI*.5)+(R()-.5)*(spread||1.5),wd=.03+R()*.07,gr=g.createRadialGradient(x,y,0,x,y,len);gr.addColorStop(0,K.rgba(col,a*(.5+R()*.5)));gr.addColorStop(1,K.rgba(col,0));g.fillStyle=gr;
      g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(ang-wd)*len,y+Math.sin(ang-wd)*len);g.lineTo(x+Math.cos(ang+wd)*len,y+Math.sin(ang+wd)*len);g.closePath();g.fill();}
    g.restore();
  };
  /* a cumulus cloud sprite: soft-edged puffs, lit from above, shaded and flat underneath. warm 0..1 pushes light and shade toward sunset */
  K.cloud=function(wid,seed,warm,dark){
    wid=Math.round(wid);const key='C|'+wid+'|'+seed+'|'+(warm||0)+'|'+(dark||0)+'|'+DPR,hit=cache.get(key);if(hit)return hit;
    const w=wid,h=Math.round(wid*.42),m=K.make(w,h),g=m.g,R=K.rng(seed||1);warm=warm||0;dark=dark||0;
    const litC=K.mix(K.mix('#ffffff','#fff1d6',warm),'#8a8aa8',dark*.7),midC=K.mix(K.mix('#eef2f8','#ffe0c8',warm),'#66668a',dark*.7),shC=K.mix(K.mix('#a9bad8','#dca4a0',warm),'#34345a',dark*.6);
    const N=Math.round(w/3.4),base=h*.74;
    for(let i=0;i<N;i++){const t=R(),dome=Math.pow(Math.sin(t*Math.PI),.8),cx=w*.06+t*w*.88,cy=base-R()*dome*h*.62,r=(.055+R()*.085)*w*(.5+dome*.8);
      const gr=g.createRadialGradient(cx-r*.25,cy-r*.38,r*.05,cx,cy,r);gr.addColorStop(0,K.rgba(litC,.95));gr.addColorStop(.5,K.rgba(midC,.7));gr.addColorStop(1,K.rgba(shC,0));g.fillStyle=gr;g.beginPath();g.arc(cx,cy,r,0,TAU);g.fill();}
    g.globalCompositeOperation='source-atop';const bs=g.createLinearGradient(0,h*.3,0,base);bs.addColorStop(0,K.rgba(shC,0));bs.addColorStop(1,K.rgba(shC,.55));g.fillStyle=bs;g.fillRect(0,0,w,h);
    g.globalCompositeOperation='destination-in';const fl=g.createLinearGradient(0,base-h*.06,0,base+h*.16);fl.addColorStop(0,'rgba(0,0,0,1)');fl.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=fl;g.fillRect(0,0,w,h);
    const s={c:m.c,w,h};cache.set(key,s);return s;
  };
  /* ---- land ---- */
  /* a mountain ridge, hazed into the distance. o: {top,bot,snow,seed,rough,haze} */
  K.ridge=function(g,w,base,amp,o){
    const R=K.rng(o.seed||2),ph=[R()*9,R()*9,R()*9,R()*9,R()*9],pts=[];
    for(let x=-10;x<=w+10;x+=6){let v=0;for(let k=0;k<5;k++)v+=(1-Math.abs(Math.sin(x*(.0035+.0055*k)*(o.rough||1)+ph[k])))*amp/(1.2+k*1.1);v=v*.62+Math.sin(x*.05+ph[0])*amp*.02;pts.push([x,base-v]);}
    g.save();g.beginPath();g.moveTo(-10,base+amp);pts.forEach(p=>g.lineTo(p[0],p[1]));g.lineTo(w+10,base+amp);g.closePath();
    const gr=g.createLinearGradient(0,base-amp,0,base+amp*.4);gr.addColorStop(0,o.top);gr.addColorStop(1,o.bot);g.fillStyle=gr;g.fill();g.clip();
    if(o.snow){const sg=g.createLinearGradient(0,base-amp,0,base-amp*.55);sg.addColorStop(0,'rgba(255,250,246,.95)');sg.addColorStop(1,'rgba(255,250,246,0)');g.fillStyle=sg;g.fillRect(0,base-amp,w,amp*.5);}
    /* light from the left: a warm rim on rising slopes, cool shade on falling ones */
    for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],up=b[1]<a[1];g.strokeStyle=up?K.rgba('#fff0c8',.16):K.rgba('#1c1a48',.12);g.lineWidth=5;g.beginPath();g.moveTo(a[0],a[1]+3);g.lineTo(b[0],b[1]+3);g.stroke();}
    K.grain(g,0,base-amp,w,amp*1.4,.12,'overlay');
    const hz=g.createLinearGradient(0,base-amp*.2,0,base+amp*.4);hz.addColorStop(0,K.rgba(o.haze||'#dfe6f0',0));hz.addColorStop(1,K.rgba(o.haze||'#dfe6f0',.75));g.fillStyle=hz;g.fillRect(0,base-amp,w,amp*1.6);
    g.restore();
  };
  K.hill=function(g,w,h,base,amp,seed,c0,c1,o){
    o=o||{};const R=K.rng(seed),ph=[R()*9,R()*9,R()*9];g.save();g.beginPath();g.moveTo(0,h);
    for(let x=0;x<=w+8;x+=6)g.lineTo(x,base+Math.sin(x*(o.f||.006)+ph[0])*amp+Math.sin(x*(o.f||.006)*2.3+ph[1])*amp*.35+Math.sin(x*.03+ph[2])*amp*.06);
    g.lineTo(w,h);g.closePath();const gr=g.createLinearGradient(0,base-amp,0,base+amp*2.4);gr.addColorStop(0,c0);gr.addColorStop(1,c1);g.fillStyle=gr;g.fill();g.clip();

  const sub=(A,B)=>{a=A;b=B;ans=a-b;prompt=`${a} − ${b} = ?`;hint=`start at ${a} and count back ${b}`;say=`${a} minus ${b}. What is left?`;};
  const missing=(A,T)=>{a=A;b=T;ans=T-A;prompt=`${a} + ? = ${T}`;hint=`count up from ${a} to ${T}`;say=`${a} plus what makes ${T}?`;};
  if(lv===1){const A=rint(0,4);add(A,rint(1,5-A));}
  else if(lv===2){const A=rint(1,9);add(A,rint(1,Math.min(9,10-A)));}
  else if(lv===3){if(Math.random()<.6){const A=rint(1,9);add(A,rint(1,10-A));}else{const A=rint(3,10);sub(A,rint(1,A-1));}}
  else if(lv===4){
    const r=Math.random();
    if(r<.4){const A=rint(4,14);add(A,rint(2,Math.min(9,20-A)));}
    else if(r<.75){const A=rint(8,20);sub(A,rint(2,Math.min(9,A-1)));}
    else{const T=pick([10,20]);missing(rint(1,T-1),T);}
    nOpt=3;
  }else{
    const r=Math.random();
    if(r<.35){const T=rint(6,20);missing(rint(1,T-2),T);}
    else if(r<.7){const A=rint(11,20);sub(A,rint(3,Math.min(9,A-2)));}
    else{const A=rint(5,10);add(A,A);hint=`double ${A}: ${A} and ${A} again`;note='doubles';}
    nOpt=3;
  }
  return{kind:'math',prompt,note,hint,say,answer:String(ans),opts:numOpts(ans,lv<3?3:4,0,20,nOpt).map(String)};
}

const AU={ctx:null,
  init(){try{if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(C)this.ctx=new C();}
    if(this.ctx&&this.ctx.state!=='running')this.ctx.resume();}catch(e){this.ctx=null;}},
  note(f,d,type,v,delay){
    if(!this.ctx||(SDK&&SDK.muted))return;
    try{const c=this.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
      o.type=type||'sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v||.1,t+.02);
      g.gain.exponentialRampToValueAtTime(.0008,t+d);
      o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);}catch(e){}
  },
  boop(){this.note(300,.22,'sine',.09);this.note(240,.3,'sine',.07,.07);},
  ding(step){const w=WORLDS[meta.world]||WORLDS[0];const s=w.scale[step%w.scale.length]+12*Math.floor(step/w.scale.length);
    this.note(523.25*Math.pow(2,s/12),.34,'triangle',.11);this.note(1046.5*Math.pow(2,s/12),.22,'sine',.04,.02);},
  fanfare(){[0,4,7,12,16].forEach((s,i)=>this.note(392*Math.pow(2,s/12),.4,'triangle',.1,i*.13));}
};
let musicT=0,musicStep=0;
function musicTick(dt){
  if(!AU.ctx||(SDK&&SDK.muted))return;
  const w=WORLDS[meta.world]||WORLDS[0];

  if(musicT<=0){
    musicT=w.tempo*(0.9+Math.random()*.2);

    const s=w.scale[st%w.scale.length]-12;

    if(musicStep%4===0)AU.note(523.25*Math.pow(2,(w.scale[0]-24)/12),1.3,'sine',.03);
  }
}

let drift=[],driftWorld=-1;
function buildDrift(idx){
  driftWorld=idx;drift=[];const R=KL.rng(99+idx);
  const clouds=(n,warm,dark,yA,yB,wMin,wMax,speed)=>{for(let i=0;i<n;i++)drift.push({k:'cloud',sp:KL.cloud((wMin+R()*(wMax-wMin))*U,i+idx*10+3,warm,dark),x:R()*(W+200)-100,y:H*(yA+R()*(yB-yA)),v:(speed*(.6+R()*.8))*U});};
  const fall=(n,cols,kind)=>{for(let i=0;i<n;i++)drift.push({k:kind,x:R()*W,y:R()*H,v:(12+R()*20)*U,c:pick(cols),r:R()*TAU,vr:(R()-.5)*3,ph:R()*6,s:(3+R()*3)*U});};
  if(idx===0){clouds(5,.85,0,.05,.34,110,190,7);for(let i=0;i<3;i++)drift.push({k:'bird',x:R()*W,y:H*(.1+R()*.25),v:(22+R()*14)*U,ph:R()*6,s:(7+R()*4)*U,c:'#3b4256'});
    for(let i=0;i<4;i++)drift.push({k:'butterfly',x:R()*W,y:H*(.8+R()*.12),ph:R()*6,c:pick(['#f08aa8','#f4b040','#8ac8f0','#c8a0f0']),s:(6+R()*3)*U});}
  else if(idx===1){clouds(5,.25,0,.05,.32,120,200,6);fall(26,['#f8c4d4','#fbd8e2','#f2a0ba','#ffffff'],'petal');}
  else if(idx===2){clouds(4,1,.05,.06,.34,130,210,5);for(let i=0;i<3;i++)drift.push({k:'bird',x:R()*W,y:H*(.12+R()*.3),v:(20+R()*14)*U,ph:R()*6,s:(7+R()*4)*U,c:'#fff3e6'});}
  else if(idx===3){clouds(4,.9,0,.05,.32,120,200,6);fall(24,['#d9682f','#e8a030','#b8442a','#f0c04a','#c8702a'],'leaf');}
  else{clouds(2,0,.5,.06,.26,120,180,3);fall(44,['#ffffff','#e8f0ff','#d0e0ff'],'snow');
    for(let i=0;i<16;i++)drift.push({k:'twinkle',x:R()*W,y:R()*H*.55,ph:R()*6,s:(1.4+R()*2)*U});drift.push({k:'shoot',x:-100,y:0,t:4+R()*5,life:0});}
}
function drawDrift(dt){
  const t=state.t,anim=!RM.matches;
  for(const d of drift){
    switch(d.k){
      case 'cloud':if(anim){d.x+=d.v*dt;if(d.x>W+20)d.x=-d.sp.w-20;}cx.drawImage(d.sp.c,d.x,d.y,d.sp.w,d.sp.h);break;
      case 'bird':{if(anim){d.x+=d.v*dt;if(d.x>W+30)d.x=-30;}const fl=Math.sin(t*7+d.ph)*.55;cx.strokeStyle=d.c;cx.lineWidth=2.2*U;cx.lineCap='round';
        cx.beginPath();cx.moveTo(d.x-d.s,d.y+fl*d.s);cx.quadraticCurveTo(d.x-d.s*.4,d.y-d.s*.5,d.x,d.y);cx.quadraticCurveTo(d.x+d.s*.4,d.y-d.s*.5,d.x+d.s,d.y+fl*d.s);cx.stroke();break;}
      case 'butterfly':{const bx=d.x+Math.sin(t*.7+d.ph)*40*U+(anim?t*8*U:0),by=d.y+Math.sin(t*1.3+d.ph)*14*U,fl=Math.abs(Math.sin(t*9+d.ph));
        const x=((bx%(W+60))+W+60)%(W+60)-30;const gr=cx.createRadialGradient(x,by,0,x,by,d.s);gr.addColorStop(0,KL.lit(d.c,.5));gr.addColorStop(1,d.c);cx.fillStyle=gr;
        cx.beginPath();cx.ellipse(x-d.s*.5*fl,by,d.s*.5*fl+1,d.s*.7,-.4,0,TAU);cx.ellipse(x+d.s*.5*fl,by,d.s*.5*fl+1,d.s*.7,.4,0,TAU);cx.fill();break;}
      case 'petal':case 'leaf':case 'snow':{
        if(anim){d.y+=d.v*dt;d.x+=Math.sin(t*.8+d.ph)*14*dt*U+(d.k==='snow'?4:10)*dt*U;d.r+=d.vr*dt;if(d.y>H+10){d.y=-10;d.x=Math.random()*W;}if(d.x>W+10)d.x=-10;}
        cx.save();cx.translate(d.x,d.y);cx.rotate(d.r);
        if(d.k==='snow'){const gr=cx.createRadialGradient(0,0,0,0,0,d.s);gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(1,'rgba(255,255,255,0)');cx.fillStyle=gr;cx.beginPath();cx.arc(0,0,d.s,0,TAU);cx.fill();}
        else{const gr=cx.createLinearGradient(-d.s,0,d.s,0);gr.addColorStop(0,KL.lit(d.c,.3));gr.addColorStop(1,KL.dark(d.c,.25));cx.fillStyle=gr;cx.beginPath();cx.ellipse(0,0,d.s*(d.k==='leaf'?1.2:1),d.s*.6*(.5+.5*Math.abs(Math.cos(t*2+d.ph))),0,0,TAU);cx.fill();}
        cx.restore();break;}
      case 'twinkle':{const a=.3+.7*Math.abs(Math.sin(t*(anim?1.4:0)+d.ph));cx.globalAlpha=a;starDot(cx,d.x,d.y,d.s*1.3,'#fff8d8');cx.globalAlpha=1;break;}
      case 'shoot':{if(!anim)break;d.t-=dt;if(d.t<=0){d.x=Math.random()*W*.7+W*.25;d.y=Math.random()*H*.25;d.t=6+Math.random()*7;d.life=.9;}
        if(d.life>0){d.life-=dt;d.x-=260*U*dt;d.y+=140*U*dt;const gr=cx.createLinearGradient(d.x,d.y,d.x+60*U,d.y-32*U);gr.addColorStop(0,'rgba(255,255,255,'+clamp(d.life,0,1)+')');gr.addColorStop(1,'rgba(255,255,255,0)');cx.strokeStyle=gr;cx.lineWidth=2.4*U;cx.lineCap='round';cx.beginPath();cx.moveTo(d.x,d.y);cx.lineTo(d.x+60*U,d.y-32*U);cx.stroke();}break;}
    }
  }
}
function starDot(g,x,y,r,col){g.fillStyle=col;g.beginPath();for(let i=0;i<8;i++){const rad=i%2?r*.4:r,a=-Math.PI/2+i*Math.PI/4;g[i?'lineTo':'moveTo'](x+Math.cos(a)*rad,y+Math.sin(a)*rad);}g.closePath();g.fill();}
function drawWorldBG(dt){
  const w=meta.world,key=w+'|'+W+'x'+H+'|'+DPR;
  if(!bgCache||bgKey!==key){
    /* paint on the next frame so the first frame is never held up; a soft sky shows meanwhile */
    if(bgWant!==key){bgWant=key;setTimeout(()=>{if(bgWant===key){bgCache=paintWorldRich(w,W,H,U);bgKey=key;buildDrift(w);}},0);}
    if(!bgCache){cx.fillStyle='#6f9fd0';cx.fillRect(0,0,W,H);return;}
  }
  cx.drawImage(bgCache,0,0,W,H);
  if(driftWorld!==w)buildDrift(w);
  drawDrift(dt);
}

/* ═══════════ animals: lit, softly shaded sticker portraits ═══════════ */
function ov(c,x,y,rx,ry,fill,line){
  c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);
  if(fill){
    if(fill[0]==='#'){const g=c.createRadialGradient(x-rx*.36,y-ry*.42,Math.min(rx,ry)*.08,x,y,Math.max(rx,ry)*1.12);g.addColorStop(0,KL.lit(fill,.34));g.addColorStop(.6,fill);g.addColorStop(1,KL.dark(fill,.34));c.fillStyle=g;}
    else c.fillStyle=fill;
    c.fill();}
  if(line){c.lineWidth=Math.max(.8,line[1]*.45);c.strokeStyle=fill&&fill[0]==='#'?KL.rgba(KL.dark(fill,.55),.5):'rgba(60,30,40,.4)';c.stroke();}
}
function drawAnimal(c,id,x,y,r,gold){
  const a=id%ANIMALS.length,ol='#4a2c34',lw=Math.max(1.6,r*.05);
  const eye=(ex,ey,er)=>{ov(c,ex,ey,er,er*1.12,'#2b1d33');ov(c,ex+er*.32,ey-er*.4,er*.36,er*.36,'#ffffff');ov(c,ex-er*.3,ey+er*.4,er*.16,er*.16,'rgba(255,255,255,.55)');};
  const nose=(nx,ny,nr,col)=>{ov(c,nx,ny,nr,nr*.75,col||'#3b2630');ov(c,nx-nr*.25,ny-nr*.25,nr*.3,nr*.2,'rgba(255,255,255,.5)');};
  const cheeks=()=>{ov(c,x-r*.55,y+r*.22,r*.16,r*.1,'rgba(255,120,150,.42)');ov(c,x+r*.55,y+r*.22,r*.16,r*.1,'rgba(255,120,150,.42)');};
  const smile=(sy,sw)=>{c.strokeStyle=ol;c.lineWidth=lw;c.lineCap='round';c.beginPath();c.arc(x,y+sy,sw,.2,Math.PI-.2);c.stroke();};
  const ear=(ex,ey,rx,ry,col,inner,rot)=>{c.save();c.translate(ex,ey);c.rotate(rot||0);ov(c,0,0,rx,ry,col,[ol,lw]);if(inner)ov(c,0,ry*.1,rx*.55,ry*.6,inner);c.restore();};
  const tri=(ex,ey,sz,col,inner,rot)=>{c.save();c.translate(ex,ey);c.rotate(rot||0);c.beginPath();c.moveTo(-sz*.7,sz*.5);c.lineTo(0,-sz);c.lineTo(sz*.7,sz*.5);c.closePath();
    const g=c.createLinearGradient(-sz*.7,-sz,sz*.7,sz*.5);g.addColorStop(0,KL.lit(col,.3));g.addColorStop(1,KL.dark(col,.32));c.fillStyle=g;c.fill();c.lineWidth=lw*.6;c.strokeStyle=KL.rgba(KL.dark(col,.55),.5);c.lineJoin='round';c.stroke();
    if(inner){c.beginPath();c.moveTo(-sz*.38,sz*.35);c.lineTo(0,-sz*.45);c.lineTo(sz*.38,sz*.35);c.closePath();c.fillStyle=inner;c.fill();}c.restore();};
  c.save();
  if(gold)KL.glow(c,x,y,r*1.5,'#ffd23f',.55);
  /* a soft contact shadow under the head */
  c.fillStyle='rgba(60,30,50,.16)';c.beginPath();c.ellipse(x+r*.05,y+r*.98,r*.8,r*.14,0,0,TAU);c.fill();
  const skin={Cat:'#f0a84c',Dog:'#d9a066',Bunny:'#f2ecf8',Bear:'#a86e42',Panda:'#f6f6f2',Fox:'#ec7f38',Frog:'#66c060',Owl:'#a97a4b',Chick:'#f6d84a',Pig:'#f4aabd',Mouse:'#c4c4d2',Lion:'#eeb440',
    Koala:'#aab2c0',Tiger:'#ee9a38',Monkey:'#a4683c',Penguin:'#34405f',Duck:'#f8eb9a',Sheep:'#f5f1ea',Cow:'#f8f8f4',Elephant:'#a9b8cf',Unicorn:'#faf6ff',Dragon:'#6ccb70',Robot:'#c0ccdc',Alien:'#86d886'}[ANIMALS[a]];
  switch(ANIMALS[a]){
    case 'Cat':tri(x-r*.62,y-r*.72,r*.36,skin,'#f6c6c0',-.25);tri(x+r*.62,y-r*.72,r*.36,skin,'#f6c6c0',.25);break;
    case 'Fox':tri(x-r*.6,y-r*.78,r*.4,skin,'#fff6ee',-.2);tri(x+r*.6,y-r*.78,r*.4,skin,'#fff6ee',.2);break;
    case 'Tiger':ear(x-r*.68,y-r*.62,r*.24,r*.24,skin,'#fff0d0');ear(x+r*.68,y-r*.62,r*.24,r*.24,skin,'#fff0d0');break;
    case 'Dog':ear(x-r*.85,y-r*.15,r*.24,r*.5,'#7e5228',null,.25);ear(x+r*.85,y-r*.15,r*.24,r*.5,'#7e5228',null,-.25);break;
    case 'Bunny':ear(x-r*.36,y-r*1.05,r*.2,r*.6,skin,'#f6b6cc',-.12);ear(x+r*.36,y-r*1.05,r*.2,r*.6,skin,'#f6b6cc',.12);break;
    case 'Bear':case 'Lion':case 'Panda':{const ec=ANIMALS[a]==='Panda'?'#2b2b30':(ANIMALS[a]==='Lion'?'#d88a1a':'#94602f'),ei=ANIMALS[a]==='Panda'?null:'#e6b487';ear(x-r*.68,y-r*.66,r*.25,r*.25,ec,ei);ear(x+r*.68,y-r*.66,r*.25,r*.25,ec,ei);break;}
    case 'Mouse':ear(x-r*.7,y-r*.55,r*.36,r*.36,skin,'#f6b0c2');ear(x+r*.7,y-r*.55,r*.36,r*.36,skin,'#f6b0c2');break;
    case 'Koala':ear(x-r*.78,y-r*.5,r*.4,r*.4,skin,'#f0eaf0');ear(x+r*.78,y-r*.5,r*.4,r*.4,skin,'#f0eaf0');break;
    case 'Monkey':ear(x-r*.95,y+r*.02,r*.28,r*.28,skin,'#eec49a');ear(x+r*.95,y+r*.02,r*.28,r*.28,skin,'#eec49a');break;
    case 'Pig':tri(x-r*.6,y-r*.7,r*.3,skin,'#f08aa8',-.4);tri(x+r*.6,y-r*.7,r*.3,skin,'#f08aa8',.4);break;
    case 'Cow':ear(x-r*.92,y-r*.2,r*.3,r*.16,'#2b2b30',null,-.3);ear(x+r*.92,y-r*.2,r*.3,r*.16,'#2b2b30',null,.3);tri(x-r*.35,y-r*.85,r*.16,'#efe0b0',null,-.2);tri(x+r*.35,y-r*.85,r*.16,'#efe0b0',null,.2);break;
    case 'Sheep':ear(x-r*.85,y-r*.05,r*.28,r*.16,'#3a3a3e',null,.3);ear(x+r*.85,y-r*.05,r*.28,r*.16,'#3a3a3e',null,-.3);break;

function stickerSprite(id,size,locked){
  const sz=Math.round(size),key='ST|'+id+'|'+sz+'|'+(locked?1:0)+'|'+DPR,hit=KL.cache.get(key);if(hit)return hit;
  const pad=Math.ceil(sz*.16),tot=sz+pad*2,m=KL.make(tot,tot),g=m.g,gold=id>=ANIMALS.length;
  g.translate(pad,pad);
  if(locked){
    const p=KL.panel('glass',sz,sz,{r:sz*.16});g.drawImage(p.c,-p.pad,-p.pad,sz+p.pad*2,sz+p.pad*2);
    g.globalAlpha=.32;drawAnimal(g,id,sz/2,sz/2+sz*.03,sz*.29,false);g.globalAlpha=1;
    g.fillStyle='rgba(12,24,52,.55)';rr(g,2,2,sz-4,sz-4,sz*.14);g.fill();
    KL.text(g,'?',sz/2,sz/2+sz*.02,sz*.38,'#ffe7a0','center',700);
  }else{
    const p=KL.panel('parch',sz,sz,{r:sz*.16,tone:gold?'#f6e29a':CARD_TONE[id%CARD_TONE.length],gold:gold});g.drawImage(p.c,-p.pad,-p.pad,sz+p.pad*2,sz+p.pad*2);
    drawAnimal(g,id,sz/2,sz/2+sz*(gold?.1:.04),sz*(gold?.27:.31),gold);
  }
  const sp={c:m.c,tot,pad,sz};KL.cache.set(key,sp);return sp;
}
function drawSticker(c,id,x,y,size,opt){
  opt=opt||{};const sp=stickerSprite(id,size,!!opt.locked);
  c.save();c.translate(x,y);if(opt.wob)c.rotate(opt.wob);
  c.drawImage(sp.c,-sp.tot/2,-sp.tot/2,sp.tot,sp.tot);
  if(id>=ANIMALS.length&&!opt.locked&&!RM.matches){
    const tw=opt.t||0,r=sp.sz/2;
    for(let i=0;i<3;i++){const k=.5+.5*Math.sin(tw*4+i*2.1);starDot(c,Math.cos(i*2.1+.6)*r*.95,Math.sin(i*2.1+.6)*r*.85,r*.1*(.4+k),'#fff4a8');}
  }
  c.restore();
}

/* ═══════════ the mascot: Bibi the chick, pilot of the blimp ═══════════ */
function drawBibi(c,x,y,s,mood,t){
  c.save();c.translate(x,y);
  const bob=Math.sin(t*3)*s*.03;c.translate(0,bob);
  const cheer=mood==='cheer'||mood==='win';
  if(cheer){c.translate(0,-Math.abs(Math.sin(t*12))*s*.1);}
  const wingCol='#f2c93a';
  ov(c,-s*.92,s*.1,s*.24,s*.16,wingCol,['#7a4a10',1]);
  c.save();c.translate(s*.85,s*.1);c.rotate(cheer?-1.1:.2);ov(c,0,0,s*.24,s*.16,wingCol,['#7a4a10',1]);c.restore();
  ov(c,0,0,s,s*.92,'#f8dc52',['#7a4a10',1]);
  ov(c,-s*.3,-s*.34,s*.32,s*.18,'rgba(255,255,255,.4)');
  /* aviator goggles pushed up on the head */
  const gg=c.createLinearGradient(0,-s*.55,0,-s*.3);gg.addColorStop(0,'#8a5a30');gg.addColorStop(1,'#5a3719');c.fillStyle=gg;rr(c,-s*.78,-s*.52,s*1.56,s*.2,s*.09);c.fill();
  for(const sx of[-1,1]){const lg=c.createRadialGradient(sx*s*.34-s*.08,-s*.1,s*.02,sx*s*.34,-s*.02,s*.32);lg.addColorStop(0,'#f2fbff');lg.addColorStop(1,'#9cc4dc');c.fillStyle=lg;c.beginPath();c.ellipse(sx*s*.34,-s*.02,s*.3,s*.3,0,0,TAU);c.fill();c.lineWidth=s*.07;c.strokeStyle='#b58a3c';c.stroke();}
  const look=mood==='oops'?0:(Math.sin(t*.8)*s*.04),blink=(Math.sin(t*1.7)>.985&&mood==='idle')?.2:1;
  ov(c,-s*.34+look,-s*.02,s*.13,s*.15*blink,'#2b1d33');ov(c,s*.34+look,-s*.02,s*.13,s*.15*blink,'#2b1d33');
  ov(c,-s*.3+look,-s*.07,s*.045,s*.045,'#fff');ov(c,s*.38+look,-s*.07,s*.045,s*.045,'#fff');
  c.fillStyle='#f0942a';c.strokeStyle='#7a4a10';c.lineWidth=1;
  if(cheer){c.beginPath();c.moveTo(-s*.2,s*.3);c.lineTo(s*.2,s*.3);c.lineTo(0,s*.62);c.closePath();c.fill();c.stroke();ov(c,0,s*.4,s*.09,s*.07,'#c8384f');}
  else if(mood==='oops'){c.beginPath();c.moveTo(-s*.16,s*.36);c.lineTo(s*.16,s*.36);c.lineTo(0,s*.2);c.closePath();c.fill();c.stroke();}
  else{c.beginPath();c.moveTo(-s*.18,s*.28);c.lineTo(s*.18,s*.28);c.lineTo(0,s*.5);c.closePath();c.fill();c.stroke();}
  ov(c,-s*.62,s*.26,s*.14,s*.09,'rgba(240,110,130,.5)');ov(c,s*.62,s*.26,s*.14,s*.09,'rgba(240,110,130,.5)');
  if(mood==='oops')ov(c,s*.72,-s*.42,s*.06,s*.1,'#8fd8ff');
  c.restore();
}

/* ═══════════ particles, floaters, flying stars ═══════════ */
const MAXP=320;
function addPart(p){if(state.parts.length<MAXP)state.parts.push(p);}
function burst(x,y,col,good,n,noRing){
  const cols=good||CHEAT.party?['#f4c440','#e05a78','#4aa0d8','#5cb85c','#a070d0','#fff4d8']:['#fff4d8',col];
  n=Math.round((n||(good?22:7))*(CHEAT.party?2:1)*(RM.matches?.3:1));
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,v=90+Math.random()*(good?260:100),shard=i%3===0;
    addPart({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-90,rot:Math.random()*TAU,vr:(Math.random()-.5)*14,
      s:(shard?6:4)+Math.random()*5,col:shard?col:pick(cols),t:.9+Math.random()*.7,max:1.6,kind:shard?'shard':(i%4===1?'star':'conf'),g:520});
  }
  if(!RM.matches&&!noRing)state.pops.push({x,y,r:10,t:.35,col});
}
function floatText(x,y,txt,col,size){if(state.floaters.length<14)state.floaters.push({x,y,txt,col,t:1.3,size:size||30});}
function flyStar(x,y){
  if(state.flies.length>60)return;
  const tx=(SAFE.l+12+26)*U,ty=(SAFE.t+10)*U+21*U;
  state.flies.push({x,y,sx:x,sy:y,tx,ty,t:0,dur:.55+Math.random()*.2,cx:x+(Math.random()-.5)*160,cy:Math.min(y,ty)-60});
}

/* ═══════════ flow ═══════════ */
function newQuestion(){
  const m=state.mode,lv=meta.lv[m];
  let q,tries=0;
  do{q=makeQ(m,lv);tries++;}while(state.q&&q.prompt===state.q.prompt&&q.answer===state.q.answer&&tries<6);
  state.q=q;state.questions++;state.hint='';state.hintT=0;state.qWrong=0;
  spawnBalloonsFor(q);
  speak(q.say);
}
/* on a tall phone the blimp hangs across the top; on a wide screen it sits on the left */

function ratingOf(n){return n>=11?3:n>=7?2:n>=3?1:0;}
function endRound(){
  if(state.phase!=='playing')return;
  state.phase='over';state.endT=state.t;state.tut=0;state.shown=state.stars;state.revealT=0;state.revealOn=false;state.banner=null;state.hintT=0;
  const rating=ratingOf(state.correct);state.rating=rating;
  const before=meta.totalStars;state.reveals=[];

    syncDaily();

    meta.daily.n+=state.correct;
    let bonus=0;
    if(dailyBefore<GOAL_POPS&&meta.daily.n>=GOAL_POPS&&!meta.daily.got){meta.daily.got=1;bonus+=10;state.dailyGift=10;}
    const t=todayISO();if(state.correct>0&&!meta.days.includes(t)){meta.days.push(t);meta.days=meta.days.slice(-60);}
    const wk=weekDays(t),stamps=wk.filter(d=>meta.days.includes(d)).length,mon=mondayOf(t);
    if(stamps>=5&&meta.chestWeek!==mon){meta.chestWeek=mon;bonus+=20;state.chest=20;}
    meta.totalStars+=state.stars+bonus;
    meta.bestStreak=Math.max(meta.bestStreak,state.bestStreak);

    const sb=stickersOf(before),sa=stickersOf(meta.totalStars);

    const wb=worldsOf(before),wa=worldsOf(meta.totalStars);

    saveMeta();

    state.earnedStickers.forEach(id=>state.reveals.push({type:'sticker',id}));
    if(state.worldUnlocked>=0)state.reveals.push({type:'world',idx:state.worldUnlocked});

function toMenu(){state.phase='menu';state.tut=0;state.balloons=[];state.reveals=[];hush();sdk('state',{scene:'title'});}

const CODES={PARTY:'Party mode: rainbow confetti on every pop',BIGBALLOON:'Giant balloons, easier to tap',SLOWSKY:'Balloons float up at half speed'};

function levelBanner(txt){state.banner={txt,t:2.2};}
function popBalloon(b,forceRight){
  if(!b||b.dead)return;
  const isRight=forceRight!==undefined?forceRight:b.correct;
  if(b.golden){ /* bonus balloon: pure joy, three stars */
    state.balloons.splice(state.balloons.indexOf(b),1);
    state.stars+=3;burst(b.x,b.y,'#e8b02a',true,30);
    for(let i=0;i<3;i++)flyStar(b.x,b.y);floatText(b.x,b.y-b.r,'+3 golden!','#ffe7a0',32);
    sfx('coin');sfx('reward');AU.ding(6);buzz(20);state.bump=1;state.mood='cheer';state.moodT=1.2;state.shake=RM.matches?0:3;return;
  }

    state.streak++;state.correct++;state.runOK++;state.failRun=0;state.popsRound++;

    floatText(b.x,b.y-b.r*.4,'+'+got,'#ffe7a0',36);
    sfx('pop',{rate:.95+Math.min(.5,state.streak*.04)});
    if(state.combo>old){levelBanner('x'+state.combo+' combo!');sfx('combo');buzz([15,30,15]);state.shake=RM.matches?0:5;}
    AU.ding(Math.min(state.streak-1,13));
    buzz(12);state.pulse=1;state.mood='cheer';state.moodT=1.1;
    if(state.tut===1){state.tut=2;state.tutT=3;try{localStorage.setItem(TUTKEY,'1');}catch(e){}sdk('event','tutorial-done');}
    for(const o of state.balloons)if(o!==b&&!o.dead){o.dead=true;o.fade=1;o.away=true;burst(o.x,o.y,o.hue,false,5,true);}
    /* the adaptive ladder: six in a row and the questions get a bit harder */
    const m=state.mode;

}

  if(state.phase!=='playing')return;

/* ═══════════ update ═══════════ */
function update(dt){
  state.t+=dt;state.buttons=[];
  if(state.moodT>0){state.moodT-=dt;if(state.moodT<=0)state.mood='idle';}
  if(state.bump>0)state.bump=Math.max(0,state.bump-dt*4);
  if(state.pulse>0)state.pulse=Math.max(0,state.pulse-dt*6);
  if(state.shake>0)state.shake=Math.max(0,state.shake-dt*22);
  if(state.helpT>0)state.helpT-=dt;
  if(state.banner){state.banner.t-=dt;if(state.banner.t<=0)state.banner=null;}
  if(state.albumWob>0)state.albumWob=Math.max(0,state.albumWob-dt*1.6);
  if(state.worldFlash>0)state.worldFlash-=dt;
  if(state.phase==='playing'){
    musicTick(dt);
    state.time-=dt;
    if(state.time<=0){state.time=0;endRound();return;}
    if(state.hintT>0)state.hintT-=dt;
    if(state.tut===2){state.tutT-=dt;if(state.tutT<=0)state.tut=0;}
    if(state.nextQ&&state.t>=state.nextQ){state.balloons=[];state.nextQ=0;newQuestion();}
    /* now and then a golden bonus balloon floats by */
    state.goldenT-=dt;
    if(state.goldenT<=0&&!state.nextQ&&state.tut===0){
      state.goldenT=rint(14,22);
      if(state.balloons.filter(b=>!b.dead).length>0&&!state.balloons.some(b=>b.golden)){
        const r=clamp(Math.min(W,H*.9)*.1,32,54),L=LQ();
        state.balloons.push({x:Math.random()<.5?Math.max(L.laneL,W*.2)+r:W-r-14*U,y:H+r*1.5,r,rise:SPEEDS[state.speed].rise*1.25,txt:'',correct:false,golden:true,gold:true,hue:'#e8b02a',sway:Math.random()*TAU,wig:0,rot:0,dead:false,fade:1});
      }
    }
    const lim=LQ().limit;
    for(const b of state.balloons){
      if(b.dead){b.fade-=dt*(b.away?2.6:5);if(b.away)b.y-=b.rise*dt*1.6;continue;}
      b.y-=b.rise*dt;b.sway+=dt*1.4;
      if(b.wig>0)b.wig=Math.max(0,b.wig-dt*1.4);
      if(b.y<lim-b.r*.4){
        if(b.golden){b.dead=true;b.fade=0;}
        else{b.y=H+b.r*1.4;b.x=clamp(b.x+(Math.random()*80-40),b.r+8,W-b.r-8);}
      }
    }
    state.balloons=state.balloons.filter(b=>!(b.dead&&b.fade<=0));
  }
  for(let i=state.parts.length-1;i>=0;i--){
    const c=state.parts[i];c.t-=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.vy+=(c.g||380)*dt;c.rot+=c.vr*dt;c.vx*=.992;
    if(c.t<=0||c.y>H+40)state.parts.splice(i,1);
  }
  for(let i=state.pops.length-1;i>=0;i--){const p=state.pops[i];p.t-=dt;p.r+=300*dt;if(p.t<=0)state.pops.splice(i,1);}
  for(let i=state.floaters.length-1;i>=0;i--){const f=state.floaters[i];f.t-=dt;f.y-=46*dt;if(f.t<=0)state.floaters.splice(i,1);}
  for(let i=state.flies.length-1;i>=0;i--){
    const f=state.flies[i];f.t+=dt/f.dur;
    if(f.t>=1){state.shown=Math.min(state.stars,state.shown+1);state.bump=1;state.flies.splice(i,1);if(state.t-state.coinAt>.14){state.coinAt=state.t;sfx('coin',{volume:.4,rate:1+Math.random()*.25});}}
  }
  if(state.phase==='playing'&&state.flies.length===0&&state.shown<state.stars&&!state.nextQ)state.shown=state.stars;
}

/* ═══════════ drawing helpers: the surfaces come from KL ═══════════ */
const INK='#4a2d12',INK2='#7a5428',CREAM='#fff3d2',GOLDTXT='#ffe7a0';

function goldStar(x,y,r,rot,glow){

function pillG(x,y,w,h){panel('glass',x,y,w,h,{r:h/2});}
function stack(items,top,bottom,gap){
  const n=items.length,avail=bottom-top,sumP=items.reduce((a,i)=>a+i.pref,0),sumM=items.reduce((a,i)=>a+i.min,0);
  let g=gap,hs;
  if(sumP+gap*(n-1)<=avail){hs=items.map(i=>i.pref);g=gap+Math.min(18,(avail-sumP-gap*(n-1))/Math.max(1,n-1));}
  else{g=gap*.6;const t=clamp((avail-g*(n-1)-sumM)/Math.max(1,sumP-sumM),0,1);hs=items.map(i=>i.min+t*(i.pref-i.min));}
  const out=[];let y=top;

  return out;

/* ── the blimp: a cream fabric envelope on a warm wooden gondola ── */
function blimpSprite(style,w,h){
  const key='BLIMP|'+style+'|'+Math.round(w)+'|'+Math.round(h)+'|'+DPR,hit=KL.cache.get(key);if(hit)return hit;
  const padX=Math.ceil(w*.14),padY=Math.ceil(h*.4),m=KL.make(w+padX*2,h+padY*2),g=m.g;g.translate(padX,padY);
  const rad=h*.45,burg=style==='burgundy';
  /* tail fins */
  const fin=g.createLinearGradient(0,-h*.5,0,h*.5);fin.addColorStop(0,burg?'#c0505a':'#b8483c');fin.addColorStop(1,burg?'#6a2030':'#6e2a22');g.fillStyle=fin;

    button('s_'+k,rx+i*(sw+sg),sp.y,sw,sp.h,on?'gold':'cream',()=>{state.speed=k;meta.speed=k;saveMeta();},(bx,by,bw,bh)=>{
      emo(SPEEDS[k].emoji,bx+bh*.55,by+bh/2+1,bh*.5);T(SPEEDS[k].label,bx+bh*.9+(bw-bh*.9)/2-4,by+bh/2+1,clamp(bh*.32,14,18),on?'#4a2c08':INK,'center',700,'engrave');
    });
  });
  /* the daily goal: a parchment card with a wooden progress trough and this week's stamps */
  const d=R.daily;syncDaily();
  panel('parch',lx,d.y,colW,d.h,{r:16*U,gold:true});
  const done=meta.daily.n>=GOAL_POPS;
  emo(done?'🎁':'🎯',lx+28*U,d.y+d.h*.3,d.h*.28);
  T(done?'Daily goal done! Come back tomorrow':`Pop ${GOAL_POPS} balloons today`,lx+50*U,d.y+d.h*.3,clamp(d.h*.2,14,18),INK,'left',700,'engrave');
  const gk=clamp(meta.daily.n/GOAL_POPS,0,1),gbx=lx+16*U,gby=d.y+d.h*.5,gbw=colW-32*U,gbh=Math.max(8,d.h*.13);
  cx.fillStyle='rgba(110,70,26,.3)';rr(cx,gbx,gby,gbw,gbh,gbh/2);cx.fill();
  if(gk>0){const pg=cx.createLinearGradient(gbx,0,gbx+gbw,0);pg.addColorStop(0,done?'#f4c440':'#8ad060');pg.addColorStop(1,done?'#d88a20':'#4fb060');cx.fillStyle=pg;rr(cx,gbx,gby,Math.max(gbh,gbw*gk),gbh,gbh/2);cx.fill();}
  T(Math.min(GOAL_POPS,meta.daily.n)+'/'+GOAL_POPS,gbx+gbw,gby-gbh*.9,13,INK2,'right',600,'engrave');
  const wk=weekDays(todayISO()),td=todayISO(),sr=Math.min(11*U,(colW-30*U)/14),sy=d.y+d.h-sr-6*U;
  wk.forEach((day,i)=>{const px=lx+colW/2+(i-3)*sr*2.5,played=meta.days.includes(day),isT=day===td;
    cx.fillStyle=played?'rgba(240,190,50,.95)':'rgba(110,70,26,.22)';cx.beginPath();cx.arc(px,sy,sr,0,TAU);cx.fill();
    cx.lineWidth=isT?2.4:1;cx.strokeStyle=isT?'#a03a10':'rgba(110,70,26,.5)';cx.stroke();
    if(played)starDot(cx,px,sy,sr*.7,'#fff8d0');});
  /* album */
  const al=R.album,have=stickersOf(meta.totalStars);
  button('album',rx,al.y,colW,al.h,'plum',()=>{state.phase='album';state.albumScroll=0;state.albumSel=-1;},(bx,by,bw,bh)=>{
    emo('📒',bx+bh*.6,by+bh/2+1,bh*.5);T('Sticker Album',bx+bh*1.1,by+bh*(have<STICKER_COUNT?.36:.5),clamp(bh*.34,16,24),CREAM,'left',700);
    if(have<STICKER_COUNT)T(`${STARS_PER_STICKER-(meta.totalStars%STARS_PER_STICKER)} more ⭐ for a new one`,bx+bh*1.1,by+bh*.72,clamp(bh*.24,12,15),CREAM,'left',600);
    T(have+'/'+STICKER_COUNT,bx+bw-16*U,by+bh/2+1,clamp(bh*.34,15,22),GOLDTXT,'right',700);
  });
}
function drawMenu(){
  drawWorldBG(FDT);
  if(state.worldFlash>0){cx.fillStyle='rgba(255,246,220,'+state.worldFlash+')';cx.fillRect(0,0,W,H);}
  drawMenuLayout();
}
const albumHits=[];
function drawAlbum(){
  drawWorldBG(FDT);
  cx.fillStyle='rgba(30,16,6,.42)';cx.fillRect(0,0,W,H);
  const top=SAFE.t+10*U;
  const cols=W<420?4:W<700?5:8,pad=14*U,cell=Math.min(96*U,(W-pad*2-8*U)/cols),gap=(W-pad*2-cols*cell)/Math.max(1,cols-1);
  const per=ANIMALS.length,rows=Math.ceil(per/cols),headH=top+72*U,rowH=cell+14*U,secH=34*U+rows*rowH+16*U;
  state.albumMax=Math.max(0,secH*2+10*U-(H-headH-SAFE.b));
  state.albumScroll=clamp(state.albumScroll,-state.albumMax,0);
  albumHits.length=0;
  const have=stickersOf(meta.totalStars);
  cx.save();cx.beginPath();cx.rect(0,headH-8,W,H-headH+8);cx.clip();
  const oy=headH+state.albumScroll;
  for(let sec=0;sec<2;sec++){
    const st=oy+sec*secH;
    T(sec?'Golden stickers':'Animal stickers',W/2,st+12*U,18*U,sec?GOLDTXT:CREAM,'center',700);
    for(let k=0;k<per;k++){
      const i=sec*per+k,r=Math.floor(k/cols),c=k%cols;
      const x=pad+c*(cell+gap)+cell/2,y=st+34*U+r*rowH+cell/2;
      if(y<-cell||y>H+cell)continue;
      const locked=i>=have;
      const wob=(state.albumSel===i)?Math.sin(state.t*30)*.12*state.albumWob:0;
      drawSticker(cx,i,x,y,cell*.94,{locked,wob,t:state.t});
      if(!locked)albumHits.push({id:i,x:x-cell/2,y:y-cell/2,w:cell,h:cell});
      if(locked&&i===have)T((STARS_PER_STICKER-(meta.totalStars%STARS_PER_STICKER))+'⭐',x,y+cell*.34,13*U,GOLDTXT,'center',700);
    }
  }
  cx.restore();
  panel('wood',-10,-10,W+20,headH+2,{r:0,gold:false,shadow:true});
  button('back',SAFE.l+12*U,top,100*U,46*U,'cream',()=>{state.phase='menu';},(bx,by,bw,bh)=>T('◀ Back',bx+bw/2,by+bh/2+1,18*U,INK,'center',700,'engrave'));
  T('Sticker Album',W/2+30*U,top+23*U,clamp(24*U,18,30),GOLDTXT,'center',700);
  T(have+' of '+STICKER_COUNT+' found',W/2+30*U,top+50*U,15*U,CREAM,'center',600);
  if(have===0)T('Pop balloons: 10 ⭐ = your first sticker!',W/2,headH+70*U,17*U,CREAM,'center',700);
  if(state.albumSel>=0)T(stickerName(state.albumSel),W/2,H-SAFE.b-28*U,26*U,GOLDTXT,'center',700);
}
function drawResults(){
  drawWorldBG(FDT);
  cx.fillStyle='rgba(30,16,6,.22)';cx.fillRect(0,0,W,H);
  const el=state.t-state.endT;
  const pw=Math.min(W-24*U,440*U),ph=Math.min(H-SAFE.t-SAFE.b-24*U,(WIDE?H*.92:560*U)),px=(W-pw)/2,py=clamp((H-ph)/2,SAFE.t+8,H);
  const pop=easeOutBack(clamp(el*3,0,1));
  cx.save();cx.translate(W/2,py+ph/2);cx.scale(pop,pop);cx.translate(-W/2,-(py+ph/2));
  panel('parch',px,py,pw,ph,{r:28*U,gold:true});
  const cxm=W/2,heads=['Good try!','Nice one!','Super popping!','AMAZING!'],rating=state.rating;
  if(WIDE)drawBibi(cx,px+pw*.14,py+ph*.36,ph*.13,rating>=2?'win':'idle',state.t);else drawBibi(cx,cxm,py+62*U,44*U,rating>=2?'win':'cheer',state.t);
  T(heads[rating],cxm,py+(WIDE?ph*.1:132*U),clamp(34*U,22,40),'#a03a10','center',700,'engrave');
  const sy=py+(WIDE?ph*.3:190*U),ss=WIDE?ph*.11:34*U;
  for(let i=0;i<3;i++){
    const on=i<rating,delay=.5+i*.35,k=on?easeOutBack(clamp((el-delay)*3,0,1)):1,sx=cxm+(i-1)*ss*2.5;
    cx.save();cx.translate(sx,sy);cx.scale(k,k);
    if(on)goldStar(0,0,ss,(i-1)*.15,true);else{cx.globalAlpha=.55;cx.fillStyle='rgba(110,70,26,.35)';cx.beginPath();for(let j=0;j<10;j++){const rad=j%2?ss*.4:ss*.86,a=-Math.PI/2+j*Math.PI/5;cx[j?'lineTo':'moveTo'](Math.cos(a)*rad,Math.sin(a)*rad);}cx.closePath();cx.fill();}
    cx.restore();
    if(on&&el>delay&&el<delay+.05)sfx('coin',{rate:1+i*.2,volume:.6});
  }
  const lines=[['⭐',`${state.stars} star${state.stars===1?"":"s"}`],['🎯',`${state.correct} right pop${state.correct===1?"":"s"}`],['🔥',`best streak ${state.bestStreak}`]];
  const ly=py+(WIDE?ph*.5:250*U),lh=WIDE?ph*.11:34*U;
  lines.forEach((l,i)=>{emo(l[0],cxm-90*U,ly+i*lh,clamp(lh*.7,18,26));T(l[1],cxm-64*U,ly+i*lh+1,clamp(lh*.55,17,24),INK,'left',700,'engrave');});
  const dy=ly+lines.length*lh+6*U,gk=clamp(meta.daily.n/GOAL_POPS,0,1),gbw=pw-64*U,gbx=cxm-gbw/2,dn=meta.daily.n>=GOAL_POPS;
  T(dn?'Daily goal done! 🎁':`Daily goal: ${Math.min(GOAL_POPS,meta.daily.n)}/${GOAL_POPS}`,cxm,dy,clamp(15*U,13,17),INK2,'center',700,'engrave');
  cx.fillStyle='rgba(110,70,26,.3)';rr(cx,gbx,dy+14*U,gbw,10*U,5*U);cx.fill();
  {const pg=cx.createLinearGradient(gbx,0,gbx+gbw,0);pg.addColorStop(0,dn?'#f4c440':'#8ad060');pg.addColorStop(1,dn?'#d88a20':'#4fb060');cx.fillStyle=pg;rr(cx,gbx,dy+14*U,Math.max(10*U,gbw*gk),10*U,5*U);cx.fill();}
  const have=stickersOf(meta.totalStars);
  if(have<STICKER_COUNT)T(`${STARS_PER_STICKER-(meta.totalStars%STARS_PER_STICKER)} more ⭐ for the next sticker`,cxm,dy+42*U,clamp(15*U,13,17),INK,'center',600,'engrave');
  cx.restore();
  if(el>1.4&&state.revealIdx>=state.reveals.length){
    const bw2=Math.min(200*U,(pw-40*U)/2),bh2=WIDE?46*U:58*U,by2=py+ph-bh2-18*U;
    button('again',cxm-bw2-6*U,by2,bw2,bh2,'green',()=>startRound(state.mode,state.speed),(bx,by,bw,bh)=>T('Play again',bx+bw/2,by+bh/2+1,clamp(bh*.38,17,24),CREAM,'center',700));
    button('home',cxm+6*U,by2,bw2,bh2,'blue',()=>toMenu(),(bx,by,bw,bh)=>T('Home',bx+bw/2,by+bh/2+1,clamp(bh*.38,17,24),CREAM,'center',700));
  }
  if(state.reveals.length&&state.revealIdx===0&&el>1.8&&!state.revealOn)startReveal();
  drawRevealCard();
}
function drawRevealCard(){
  if(state.phase!=='over'||state.revealIdx>=state.reveals.length||!state.revealOn)return;
  const r=state.reveals[state.revealIdx],el=state.t-state.revealT,k=easeOutBack(clamp(el*3,0,1));
  cx.fillStyle='rgba(20,10,4,'+(.6*clamp(el*4,0,1))+')';cx.fillRect(0,0,W,H);
  const cw=Math.min(W-30*U,380*U),ch=Math.min(H-SAFE.t-SAFE.b-30*U,WIDE?H*.9:440*U),x=(W-cw)/2,y=(H-ch)/2;
  cx.save();cx.translate(W/2,H/2);cx.scale(k,k);cx.translate(-W/2,-H/2);
  panel('parch',x,y,cw,ch,{r:28*U,gold:true});
  cx.save();cx.beginPath();rr(cx,x+4,y+4,cw-8,ch-8,26*U);cx.clip();
  cx.translate(W/2,y+ch*.4);cx.rotate(state.t*.4);
  for(let i=0;i<12;i++){cx.rotate(TAU/12);const rg=cx.createLinearGradient(0,0,cw*1.1,0);rg.addColorStop(0,'rgba(255,214,90,.34)');rg.addColorStop(1,'rgba(255,214,90,0)');cx.fillStyle=rg;cx.beginPath();cx.moveTo(0,0);cx.lineTo(cw*1.1,-cw*.09);cx.lineTo(cw*1.1,cw*.09);cx.closePath();cx.fill();}
  cx.restore();
  let title='',sub='';const py=y+ch*.4;
  if(r.type==='sticker'){title='New sticker!';sub=stickerName(r.id);drawSticker(cx,r.id,W/2,py,Math.min(cw*.62,ch*.42),{t:state.t,wob:Math.sin(state.t*5)*.05});}
  else if(r.type==='world'){const w=WORLDS[r.idx];title='New place unlocked!';sub=w.name;emo(w.emoji,W/2,py,Math.min(cw*.4,ch*.3));}
  else if(r.type==='level'){title='Level up!';sub=({count:'Count Pop',math:'Math Pop',spell:'Word Pop'})[r.mode]+' level '+r.lv;goldStar(W/2,py,Math.min(cw*.28,ch*.2),Math.sin(state.t*3)*.1,true);T(String(r.lv),W/2,py+4,Math.min(cw*.2,ch*.14),'#fff6e0','center',700);}
  else if(r.type==='gift'){title='Daily goal done!';sub='+'+r.n+' bonus star'+(r.n===1?'':'s');emo('🎁',W/2,py,Math.min(cw*.4,ch*.3));}
  else{title='Week chest!';sub='+'+r.n+' bonus star'+(r.n===1?'':'s');emo('🧰',W/2,py,Math.min(cw*.4,ch*.3));}
  T(title,W/2,y+ch*.14,clamp(30*U,22,36),'#a03a10','center',700,'engrave');
  T(sub,W/2,y+ch*.74,clamp(28*U,20,34),INK,'center',700,'engrave');
  if(el>.8)T('Tap to keep going',W/2,y+ch-26*U,clamp(16*U,14,18),INK2,'center',600,'engrave');
  cx.restore();
}
function render(dt){
  cx.clearRect(0,0,W,H);
  cx.save();
  if(state.shake>0){cx.translate((Math.random()-.5)*state.shake,(Math.random()-.5)*state.shake);}
  if(state.phase==='menu')drawMenu();
  else if(state.phase==='album')drawAlbum();
  else if(state.phase==='playing'){
    drawWorldBG(FDT);
    drawBalloons();
    const LL=LQ();drawBlimp(LL.cx,LL.cy,LL.w,LL.h,state.q,state.t,'cream');
    drawHUD();drawHintCard();drawTutorial();
  }else drawResults();
  cx.restore();
  if(state.phase!=='menu'&&state.phase!=='album')drawFx();
  else if(state.parts.length)drawFx();
}

/* ═══════════ main loop ═══════════ */
let last=performance.now(),fpsN=0,fpsT=0,fps=60,errOnce=false;
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;FDT=dt;
  fpsN++;fpsT+=dt;if(fpsT>=1){fps=fpsN;fpsN=0;fpsT=0;}
  try{update(dt);render(dt);}catch(err){ /* a hiccup must never freeze the scene, but it is reported once */ if(!errOnce){errOnce=true;try{console.error('BalloonBust frame error: '+(err&&err.stack||err));}catch(e){}} }
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
try{document.fonts&&document.fonts.load('700 20px Fredoka');}catch(e){}

/* ═══════════ test hook ═══════════ */
window.__bb_debug={
  wipe(){try{localStorage.removeItem(LSKEY);localStorage.removeItem(TUTKEY);localStorage.removeItem('bb_prog');}catch(e){}meta=loadMeta();syncDaily();writeProg();},
  start:startRound,
  state(){return{
    phase:state.phase,mode:state.mode,speed:state.speed,time:state.time,stars:state.stars,streak:state.streak,
    bestStreak:state.bestStreak,combo:state.combo,prompt:state.q?state.q.prompt:'',hint:state.hint,hintShown:state.hintT>0,
    balloons:state.balloons.filter(b=>!b.dead).map(b=>({x:Math.round(b.x),y:Math.round(b.y),txt:b.txt,correct:b.correct,golden:!!b.golden})),
    questions:state.questions,correct:state.correct,wrong:state.wrong,newStickers:state.earnedStickers.length,
    reveals:state.reveals.length,revealIdx:state.revealIdx,rating:state.rating,world:meta.world,fps,parts:state.parts.length,
    buttons:state.buttons.map(b=>({id:b.id,x:Math.round(b.x),y:Math.round(b.y),w:Math.round(b.w),h:Math.round(b.h)}))
  };},
  meta(){return{...meta,stickers:stickersOf(meta.totalStars),worlds:worldsOf(meta.totalStars)};},
  addStars(n){meta.totalStars+=n;saveMeta();},
  popCorrect(){const b=state.balloons.find(x=>x.correct&&!x.dead);if(b)popBalloon(b,true);return !!b;},
  popWrong(){const b=state.balloons.find(x=>!x.correct&&!x.dead);if(b)popBalloon(b,false);return !!b;},
  endRound,toMenu,openAlbum(){state.phase='album';},setWorld(i){meta.world=i;bgCache=null;},
  dismissReveals(){state.revealIdx=state.reveals.length;state.revealOn=true;}
};

/* ═══════════ Caleb's Arcade: restart, exit, tutorial, hints and codes go through the SDK ═══════════ */
if(SDK)ArcadeSDK.init({pauseKeys:'p+esc',
  onRestart:()=>startRound(state.mode,state.speed),
  onExit:toMenu,
  onTutorial:()=>startRound(state.mode,state.speed,true),
  onHint:hint,onCheat:code,
  onPause:()=>{try{if(window.speechSynthesis)speechSynthesis.pause();}catch(e){}},
  onResume:()=>{try{if(window.speechSynthesis)speechSynthesis.resume();}catch(e){}}});
sdk('state',{scene:'title'});

</script>
