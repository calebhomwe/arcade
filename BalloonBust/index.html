"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   BALLOON BUST — a calm popping game for ages 4 to 8.
   A blimp asks a question (count them, add them, spell the missing word) and
   answer balloons float up. Pop the right one. Nothing ever ends a round early.
   Five sky worlds unlock as you collect stars, 48 stickers fill an album, the
   game learns your level, and a daily goal + weekly stamps give a reason to
   come back tomorrow. Single file. Canvas 2D. Zero network. Art is drawn in code.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── tiny utils ─────────────────────────────────────────────────────── */
const TAU=Math.PI*2;
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const easeOutCubic=t=>1-Math.pow(1-t,3);
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mulberry(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296;};}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
const FONT='"Fredoka","Arial Rounded MT Bold","Nunito",system-ui,sans-serif';
const EMO='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const F=(px,w)=>`${w||600} ${Math.round(px)}px ${FONT}`;
const FE=px=>`${Math.round(px)}px ${EMO}`;
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function mondayOf(iso){const [y,m,d]=iso.split('-').map(Number);const t=new Date(y,m-1,d);const dow=(t.getDay()+6)%7;
  const s=new Date(y,m-1,d-dow);return s.getFullYear()+'-'+String(s.getMonth()+1).padStart(2,'0')+'-'+String(s.getDate()).padStart(2,'0');}
function weekDays(iso){const [y,m,d]=mondayOf(iso).split('-').map(Number);const out=[];
  for(let i=0;i<7;i++){const s=new Date(y,m-1,d+i);out.push(s.getFullYear()+'-'+String(s.getMonth()+1).padStart(2,'0')+'-'+String(s.getDate()).padStart(2,'0'));}return out;}

/* ═══════════ QUESTION CORE: counting, sums, spelling ═══════════ */

/* words: [word, sentence with ~ where the word goes, picture, [two look-alike misspellings for level 3]] */
const WORDS=[
  /* level 1: three letters */
  ['cat','the ~ says meow','🐱'],['dog','the ~ says woof','🐶'],['sun','the ~ lights the day','☀️'],
  ['hat','she wore a ~ on her head','🎩'],['bus','we rode the ~ to town','🚌'],['pig','the ~ rolls in the mud','🐷'],
  ['cow','the ~ gives us milk','🐄'],['hen','the ~ laid an egg','🐔'],['bed','I sleep in my ~ at night','🛏️'],
  ['cup','she drank from a ~','☕'],['egg','the hen sat on an ~','🥚'],['fox','the red ~ ran into the woods','🦊'],
  ['map','we read the ~ to find the way','🗺️'],['pen','write your name with a ~','🖊️'],['jam','I like ~ on my toast','🍓'],
  ['bat','the ~ flies at night','🦇'],['box','the toy is in the ~','📦'],['net','he caught a fish in a ~','🥅'],
  /* level 2: four letters */
  ['fish','a ~ swims in water','🐟'],['frog','a green ~ jumps and croaks','🐸'],['bird','a ~ has feathers and wings','🐦'],
  ['cake','we ate birthday ~','🎂'],['star','each ~ shines at night','⭐'],['moon','the ~ glows in the night sky','🌙'],
  ['tree','a ~ has leaves and branches','🌳'],['duck','the ~ says quack','🦆'],['ship','a ~ sails across the sea','🚢'],
  ['milk','the cat drank ~','🥛'],['book','she read a ~ at night','📖'],['door','he knocked on the ~','🚪'],
  ['foot','put your sock on your ~','🦶'],['hand','wash your ~ before eating','✋'],['king','the ~ wore a golden crown','🤴'],
  ['ring','a shiny ~ on her finger','💍'],['snow','cold white ~ fell all night','❄️'],['bear','the big ~ slept all winter','🐻'],
  ['rain','~ fell from the grey clouds','🌧️'],['boat','they sailed a small ~','⛵'],['goat','the ~ ate the grass','🐐'],
  ['lamp','turn on the ~ to read','💡'],['leaf','a red ~ fell from the tree','🍃'],['sock','one ~ is missing again','🧦'],
  ['kite','we flew a ~ in the wind','🪁'],['ball','kick the ~ to me','⚽'],['bell','ring the ~ at the door','🔔'],
  ['corn','the farmer grew yellow ~','🌽'],['drum','she hit the ~ with a stick','🥁'],['gift','a birthday ~ with a bow','🎁'],
  ['lion','the ~ has a big mane','🦁'],['shoe','put a ~ on your foot','👟'],['wolf','the ~ howls at the moon','🐺'],
  /* level 3: five letters, spelling look-alikes */
  ['apple','an ~ is a red fruit','🍎',['aple','appel']],['house','we live in a ~','🏠',['hause','howse']],
  ['horse','a ~ can run very fast','🐴',['hors','horce']],['tiger','a ~ has orange and black stripes','🐯',['tigar','tigre']],
  ['zebra','a ~ has black and white stripes','🦓',['zebbra','zeebra']],['snake','a ~ slides on the ground','🐍',['snaik','snak']],
  ['river','the ~ flows to the sea','🌊',['rivver','rivar']],['cloud','a white ~ floats in the sky','☁️',['clowd','cloude']],
  ['plane','a ~ flies in the sky','✈️',['planne','plaen']],['train','a ~ runs on tracks','🚂',['trane','trian']],
  ['sheep','the ~ has soft wool','🐑',['sheap','shepe']],['mouse','the ~ ate the cheese','🐭',['mowse','mouce']],
  ['water','we drink cold ~','💧',['watter','wauter']],['bread','toast is made from ~','🍞',['braed','bredd']],
  ['smile','she has a big ~','😊',['smyle','smial']],['green','grass is ~','🟢',['gren','grean']],
  ['table','we eat at the ~','🍽️',['tabel','tayble']],['chair','sit on the ~','🪑',['chaer','chiar']],
  ['clock','the ~ tells the time','🕐',['clok','cloc']],['beach','we played on the sandy ~','🏖️',['beatch','bech']],
  ['happy','I feel ~ when I play','😀',['hapy','happee']],['pizza','I ate a slice of ~','🍕',['piza','peetza']]
];
const WORDSET=new Set(WORDS.map(w=>w[0]));
const WLEN=w=>w[0].length<=3?1:w[0].length===4?2:3;
function mask(w){return w[0]+' '+'_ '.repeat(w.length-1).trim();}
function qSpell(lv){
  lv=clamp(lv,1,3);
  const pool=WORDS.filter(w=>WLEN(w)===lv);
  const w=pick(pool), ans=w[0];
  let opts;
  if(lv>=3&&w[3]){opts=[ans,w[3][0],w[3][1]];}
  else{
    const others=shuf(pool.filter(x=>x[0]!==ans&&x[0][0]!==ans[0])).slice(0,lv>=2?3:2).map(x=>x[0]);
    opts=[ans,...others];
  }
  return{kind:'spell',word:ans,pic:w[2]||'',sentence:w[1],masked:mask(ans),
         prompt:w[1].replace('~',mask(ans)),
         hint:`it starts with “${ans[0]}” and has ${ans.length} letters`,
         answer:ans,opts:shuf(opts),
         say:'Which word fits? '+w[1].replace('~','blank')+'. It starts with '+ans[0]+'.'};
}
function numOpts(ans,spread,min,max,n){
  const s=new Set([ans]);let g=0;
  while(s.size<n+1&&g++<400){const v=ans+rint(-spread,spread);if(v!==ans&&v>=min&&v<=max)s.add(v);}
  let b=1;while(s.size<n+1&&b<40){if(ans+b<=max)s.add(ans+b);if(s.size<n+1&&ans-b>=min)s.add(ans-b);b++;}
  return shuf([...s]);
}
const SAY_NUM=n=>String(n);
function qMath(lv){
  lv=clamp(lv,1,5);
  let a,b,ans,prompt,note='',hint,say,nOpt=2;
  const add=(A,B)=>{a=A;b=B;ans=a+b;prompt=`${a} + ${b} = ?`;hint=`start at ${a} and count on ${b} more`;say=`${a} plus ${b}. What does it make?`;};
  const sub=(A,B)=>{a=A;b=B;ans=a-b;prompt=`${a} − ${b} = ?`;hint=`start at ${a} and count back ${b}`;say=`${a} minus ${b}. What is left?`;};
  const missing=(A,T)=>{a=A;b=T;ans=T-A;prompt=`${a} + ? = ${T}`;hint=`count up from ${a} to ${T}`;say=`${a} plus what makes ${T}?`;};
  if(lv===1){const A=rint(0,4);add(A,rint(1,5-A));}
  else if(lv===2){const A=rint(1,9);add(A,rint(1,Math.min(9,10-A)));}
  else if(lv===3){if(Math.random()<.6){const A=rint(1,9);add(A,rint(1,10-A));}else{const A=rint(3,10);sub(A,rint(1,A-1));}nOpt=2;}
  else if(lv===4){
    const r=Math.random();
    if(r<.4){const A=rint(4,14);add(A,rint(2,Math.min(9,20-A)));}
    else if(r<.75){const A=rint(8,20);sub(A,rint(2,Math.min(9,A-1)));}
    else{const T=pick([10,20]);missing(rint(1,T-1),T);}
    nOpt=3;
  }else{
    const r=Math.random();
    if(r<.35){const T=rint(6,20);missing(rint(1,T-2),T);}
    else if(r<.7){const A=rint(11,20);sub(A,rint(3,Math.min(9,A-2)));}
    else{const A=rint(6,12);add(A,A);hint=`double ${a}: ${a} and ${a} again`;note='doubles';}
    nOpt=3;
  }
  return{kind:'math',prompt,note,hint,say,answer:String(ans),opts:numOpts(ans,lv<3?3:4,0,20,nOpt).map(String)};
}
const COUNT_ITEMS=['🍎','⭐','🐥','🍪','🌸','🚗','🐟','🎈','🍓','🦋'];
function qCount(lv){
  lv=clamp(lv,1,3);
  const max=lv===1?5:lv===2?8:10, n=rint(1,max), item=pick(COUNT_ITEMS);
  const nOpt=lv===3?3:2;
  return{kind:'count',n,item,prompt:'How many?',note:'',hint:'touch and count them one by one',say:'How many '+'are there? Count them.',
         answer:String(n),opts:numOpts(n,2,1,Math.max(6,max),nOpt).map(String)};
}
const MAXLV={count:3,math:5,spell:3};
function makeQ(mode,lv){return mode==='count'?qCount(lv):mode==='spell'?qSpell(lv):qMath(lv);}

/* ═══════════ worlds, animals, names ═══════════ */
const WORLDS=[
  {id:'meadow',name:'Sunny Meadow',at:0,emoji:'🌼',scale:[0,2,4,7,9,11,12],tempo:.62},
  {id:'candy', name:'Candy Clouds', at:40,emoji:'🍭',scale:[0,2,4,7,9,12,14],tempo:.7},
  {id:'beach', name:'Sunset Beach', at:120,emoji:'🏖️',scale:[0,3,5,7,10,12,15],tempo:.8},

const ANIMALS=['Cat','Dog','Bunny','Bear','Panda','Fox','Frog','Owl','Chick','Pig','Mouse','Lion',
               'Koala','Tiger','Monkey','Penguin','Duck','Sheep','Cow','Elephant','Unicorn','Dragon','Robot','Alien'];

const stickerName=i=>(i>=ANIMALS.length?'Golden ':'')+ANIMALS[i%ANIMALS.length];

/* ═══════════ persistence ═══════════ */
const LSKEY='balloonbust_v1', TUTKEY='balloonbust_tut';
const GOAL_POPS=12;
function defMeta(){return{totalStars:0,bestStreak:0,rounds:0,pops:0,world:0,voice:1,mode:'math',speed:'normal',
  lv:{count:1,math:1,spell:1},best:{},daily:{d:'',n:0,got:0},days:[],chestWeek:'',lastWorldSeen:0};}
function loadMeta(){
  const d=defMeta();
  try{const m=JSON.parse(localStorage.getItem(LSKEY)||'{}');
    d.totalStars=+m.totalStars||0;d.bestStreak=+m.bestStreak||0;d.rounds=+m.rounds||0;d.pops=+m.pops||0;
    d.world=clamp(+m.world||0,0,WORLDS.length-1);d.voice=m.voice===0?0:1;
    if(['count','math','spell'].includes(m.mode))d.mode=m.mode;
    if(['chill','normal','zoom'].includes(m.speed))d.speed=m.speed;
    if(m.lv)for(const k of ['count','math','spell'])d.lv[k]=clamp(+m.lv[k]||1,1,MAXLV[k]);
    if(m.best&&typeof m.best==='object')d.best=m.best;
    if(m.daily&&typeof m.daily==='object'){d.daily.d=String(m.daily.d||'');d.daily.n=+m.daily.n||0;d.daily.got=+m.daily.got||0;}
    if(Array.isArray(m.days))d.days=m.days.filter(x=>typeof x==='string').slice(-60);
    d.chestWeek=String(m.chestWeek||'');d.lastWorldSeen=+m.lastWorldSeen||0;
  }catch(e){}
  return d;
}
let meta=loadMeta();
function saveMeta(){try{localStorage.setItem(LSKEY,JSON.stringify(meta));}catch(e){}}
const stickersOf=stars=>Math.min(STICKER_COUNT,Math.floor(stars/STARS_PER_STICKER));

/* ═══════════ audio: a music box that follows the sky, made in code ═══════════ */
const AU={ctx:null,
  init(){try{if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(C)this.ctx=new C();}
    if(this.ctx&&this.ctx.state!=='running')this.ctx.resume();}catch(e){this.ctx=null;}},
  note(f,d,type,v,delay){
    if(!this.ctx||(SDK&&SDK.muted))return;
    try{const c=this.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
      o.type=type||'sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v||.1,t+.02);
      g.gain.exponentialRampToValueAtTime(.0008,t+d);
      o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);}catch(e){}
  },
  boop(){this.note(300,.22,'sine',.09);this.note(240,.3,'sine',.07,.07);},
  ding(step){const w=WORLDS[meta.world]||WORLDS[0];const s=w.scale[step%w.scale.length]+12*Math.floor(step/w.scale.length);
    this.note(523.25*Math.pow(2,s/12),.34,'triangle',.11);this.note(1046.5*Math.pow(2,s/12),.22,'sine',.04,.02);},
  fanfare(){[0,4,7,12,16].forEach((s,i)=>this.note(392*Math.pow(2,s/12),.4,'triangle',.1,i*.13));}
};
let musicT=0,musicStep=0;
function musicTick(dt){
  if(!AU.ctx||(SDK&&SDK.muted))return;
  const w=WORLDS[meta.world]||WORLDS[0];
  musicT-=dt;
  if(musicT<=0){
    musicT=w.tempo*(0.9+Math.random()*.2);
    const arp=[0,2,4,2,5,3,4,1];const st=arp[musicStep++%arp.length];
    const s=w.scale[st%w.scale.length]-12;
    AU.note(523.25*Math.pow(2,s/12),.9,'sine',.028);
    if(musicStep%4===0)AU.note(523.25*Math.pow(2,(w.scale[0]-24)/12),1.3,'sine',.03);
  }
}

/* ═══════════ speech: the blimp reads the question aloud ═══════════ */
const SPEECH={voice:false,obj:null};
function findVoice(){
  try{if(!window.speechSynthesis)return false;const v=speechSynthesis.getVoices();if(!v.length)return false;
    SPEECH.voice=true;SPEECH.obj=v.find(x=>/^en[-_]/i.test(x.lang)&&/female|samantha|karen|moira|tessa|zira/i.test(x.name))||v.find(x=>/^en/i.test(x.lang))||null;return true;}catch(e){return false;}
}
function speak(txt){
  if(!meta.voice||!SPEECH.voice||!window.speechSynthesis)return;
  if(SDK&&SDK.muted)return;
  try{const u=new SpeechSynthesisUtterance(txt);u.rate=.86;u.pitch=1.15;u.volume=.95;
    if(SPEECH.obj)u.voice=SPEECH.obj;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}
function hush(){try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}}
try{if(window.speechSynthesis)speechSynthesis.onvoiceschanged=findVoice;}catch(e){}
findVoice();

/* ═══════════ balloon sprites (drawn once, stamped every frame) ═══════════ */
function balloonSprite(hue,r,gold){

  g.bezierCurveTo(bw*.94,-bh*.78,bw*.42,-bh,0,-bh);
  g.bezierCurveTo(-bw*.42,-bh,-bw*.94,-bh*.78,-bw,-bh*.12);
  g.bezierCurveTo(-bw*1.12,bh*.35,-bw*.35,bh*.86,0,bh);g.closePath();
  const grd=g.createRadialGradient(-bw*.35,-bh*.4,bw*.08,-bw*.1,-bh*.05,bh*1.25);
  if(gold){grd.addColorStop(0,'#fffbe0');grd.addColorStop(.35,'#ffe066');grd.addColorStop(1,'#e59a00');}
  else{grd.addColorStop(0,'#ffffff');grd.addColorStop(.22,hue[1]);grd.addColorStop(1,hue[0]);}
  g.fillStyle=grd;g.fill();
  g.lineWidth=2.5;g.strokeStyle=gold?'#b87400':'rgba(70,30,90,.35)';g.stroke();

function drawWorldBG(dt){

/* ═══════════ the mascot: Bibi the chick, pilot of the blimp ═══════════ */

  ov(c,-s*.3+look,-s*.07,s*.045,s*.045,'#fff');ov(c,s*.38+look,-s*.07,s*.045,s*.045,'#fff');
  /* beak */

  else if(mood==='oops'){c.beginPath();c.moveTo(-s*.16,s*.36);c.lineTo(s*.16,s*.36);c.lineTo(0,s*.2);c.closePath();c.fill();c.stroke();}

/* ═══════════ particles, floaters, flying stars ═══════════ */
const MAXP=360;
function addPart(p){if(state.parts.length<MAXP)state.parts.push(p);}
function burst(x,y,hue,good,n,noRing){
  const cols=good||CHEAT.party?['#ffd23f','#ff5f8f','#3fbcf5','#4fd68a','#a279ff','#ffffff']:['#ffffff',hue[1]];
  n=Math.round((n||(good?22:7))*(CHEAT.party?2:1)*(RM.matches?.3:1));
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,v=90+Math.random()*(good?260:100),shard=i%3===0;
    addPart({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-90,rot:Math.random()*TAU,vr:(Math.random()-.5)*14,
      s:(shard?6:4)+Math.random()*5,col:shard?hue[0]:pick(cols),t:.9+Math.random()*.7,max:1.6,kind:shard?'shard':(i%4===1?'star':'conf'),g:520});
  }
  if(!RM.matches&&!noRing)state.pops.push({x,y,r:10,t:.35,col:hue[0]});
}
function floatText(x,y,txt,col,size){if(state.floaters.length<14)state.floaters.push({x,y,txt,col,t:1.3,size:size||30});}
function flyStar(x,y){
  if(state.flies.length>60)return;
  const tx=(60+SAFE.l)*U,ty=(SAFE.t+34)*U;
  state.flies.push({x,y,sx:x,sy:y,tx,ty,t:0,dur:.55+Math.random()*.2,cx:x+(Math.random()-.5)*160,cy:Math.min(y,ty)-60});
}

/* ═══════════ flow ═══════════ */
function newQuestion(){
  const m=state.mode,lv=meta.lv[m];
  let q,tries=0;
  do{q=makeQ(m,lv);tries++;}while(state.q&&q.prompt===state.q.prompt&&q.answer===state.q.answer&&tries<6);
  state.q=q;state.questions++;state.hint='';state.hintT=0;state.qWrong=0;
  spawnBalloonsFor(q);
  speak(q.say);
  state.pulseQ=0;
}
function spawnBalloonsFor(q){
  state.balloons=[];
  const rise=SPEEDS[state.speed].rise,n=q.opts.length;
  const L=LQ();
  const r=(WIDE?clamp(H*.13,36,56):clamp(W*.125,40,66))*(CHEAT.big?1.4:1);
  const lanes=shuf([...Array(n).keys()]);
  const cxl=(L.laneL+L.laneR)/2,span=WIDE?(L.laneR-L.laneL-r*2):W*L.lane;
  q.opts.forEach((txt,i)=>{
    const col=PALETTE[(colorIdx++)%PALETTE.length];
    const laneX=cxl+(n>1?(lanes[i]/(n-1)-.5)*span:0);
    state.balloons.push({
      x:clamp(laneX+(Math.random()*24-12),r+8,W-r-8),
      y:i===0?Math.max(L.limit+r*1.5,Math.round(H*.74)):H+r+(i-1)*(r*2.3+Math.random()*30),
      r,rise:rise*(.88+Math.random()*.24)*(CHEAT.slow?.5:1)*(state.tut===1?.7:1),
      txt:String(txt),correct:String(txt)===String(q.answer),hue:col,sway:Math.random()*TAU,wig:0,rot:0,sq:0,gold:false,dead:false,fade:1,born:state.t
    });
  });
}
function startRound(mode,speed,withTutorial){
  if(mode)state.mode=mode;if(speed)state.speed=speed;
  meta.mode=state.mode;meta.speed=state.speed;saveMeta();
  AU.init();hush();
  let seen=false;try{seen=localStorage.getItem(TUTKEY)==='1';}catch(e){}
  state.tut=(withTutorial===true||!seen)?1:0;state.tutT=0;
  state.phase='playing';
  state.time=ROUND_LEN;state.stars=0;state.shown=0;state.streak=0;state.bestStreak=0;state.combo=1;
  state.correct=0;state.wrong=0;state.questions=0;state.qWrong=0;state.runOK=0;state.failRun=0;
  state.balloons=[];state.parts=[];state.floaters=[];state.flies=[];state.pops=[];
  state.nextQ=0;state.hint='';state.hintT=0;state.banner=null;state.levelUps=0;state.goldenT=9;state.popsRound=0;
  state.earnedStickers=[];state.worldUnlocked=-1;state.dailyGift=0;state.chest=0;state.reveals=[];state.revealIdx=0;
  state.q=null;state.mood='idle';state.helpT=0;state.revealOn=false;
  newQuestion();
  sdk('state',{scene:'play'});
}
function ratingOf(n){return n>=11?3:n>=7?2:n>=3?1:0;}
function endRound(){
  if(state.phase!=='playing')return;
  state.phase='over';state.endT=state.t;state.tut=0;state.shown=state.stars;state.revealT=0;state.revealOn=false;
  const rating=ratingOf(state.correct);state.rating=rating;
  const before=meta.totalStars;state.reveals=[];
  if(!cheated()){
    syncDaily();
    const dailyBefore=meta.daily.n;
    meta.daily.n+=state.correct;
    let bonus=0;
    if(dailyBefore<GOAL_POPS&&meta.daily.n>=GOAL_POPS&&!meta.daily.got){meta.daily.got=1;bonus+=10;state.dailyGift=10;}
    const t=todayISO();if(state.correct>0&&!meta.days.includes(t)){meta.days.push(t);meta.days=meta.days.slice(-60);}
    const wk=weekDays(t),stamps=wk.filter(d=>meta.days.includes(d)).length,mon=mondayOf(t);
    if(stamps>=5&&meta.chestWeek!==mon){meta.chestWeek=mon;bonus+=20;state.chest=20;}
    meta.totalStars+=state.stars+bonus;
    meta.bestStreak=Math.max(meta.bestStreak,state.bestStreak);
    meta.rounds++;meta.pops+=state.correct;
    const bk=state.mode;if((meta.best[bk]||0)<state.correct)meta.best[bk]=state.correct;
    const sb=stickersOf(before),sa=stickersOf(meta.totalStars);
    for(let i=sb;i<sa;i++)state.earnedStickers.push(i);
    const wb=worldsOf(before),wa=worldsOf(meta.totalStars);
    if(wa>wb){state.worldUnlocked=wa-1;}
    saveMeta();
    if(state.levelUps>0)state.reveals.push({type:'level',mode:state.mode,lv:meta.lv[state.mode]});
    state.earnedStickers.forEach(id=>state.reveals.push({type:'sticker',id}));
    if(state.worldUnlocked>=0)state.reveals.push({type:'world',idx:state.worldUnlocked});
    if(state.dailyGift)state.reveals.push({type:'gift',n:state.dailyGift});
    if(state.chest)state.reveals.push({type:'chest',n:state.chest});
  }
  AU.fanfare();sfx(rating>=2?'win':'levelup');
  hush();
  sdk('state',{scene:'over',score:state.stars,stars:rating});
}
function toMenu(){state.phase='menu';state.tut=0;state.balloons=[];state.reveals=[];hush();sdk('state',{scene:'title'});}
function hint(){
  if(state.phase!=='playing'||!state.q)return 'Pick Count Pop, Math Pop or Word Pop, then tap the balloon that answers the blimp.';
  state.hint=state.q.hint;state.hintT=5;
  return 'Hint: '+state.q.hint+'.';
}
const CODES={PARTY:'Party mode: rainbow confetti on every pop',BIGBALLOON:'Giant balloons, easier to tap',SLOWSKY:'Balloons float up at half speed'};
function code(c){
  c=String(c||'').toUpperCase();if(!CODES[c])return{ok:false};
  if(c==='PARTY')CHEAT.party=true;
  if(c==='BIGBALLOON'){CHEAT.big=true;for(const b of state.balloons){b.r*=1.4;}spriteCache.clear();}
  if(c==='SLOWSKY'){CHEAT.slow=true;for(const b of state.balloons)b.rise*=.5;}
  return{ok:true,message:CODES[c]};
}
function levelBanner(txt){state.banner={txt,t:2.2};}
function popBalloon(b,forceRight){
  if(!b||b.dead)return;
  const isRight=forceRight!==undefined?forceRight:b.correct;
  if(b.golden){ /* bonus balloon: pure joy, three stars */
    state.balloons.splice(state.balloons.indexOf(b),1);
    state.stars+=3;burst(b.x,b.y,['#ffc933','#fff0a3'],true,30);
    for(let i=0;i<3;i++)flyStar(b.x,b.y);floatText(b.x,b.y-b.r,'+3 golden!','#b87400',32);
    sfx('coin');sfx('reward');AU.ding(6);buzz(20);state.bump=1;state.mood='cheer';state.moodT=1.2;state.shake=RM.matches?0:3;return;
  }
  if(isRight){
    b.dead=true;b.fade=0;
    state.streak++;state.correct++;state.runOK++;state.failRun=0;state.popsRound++;
    state.bestStreak=Math.max(state.bestStreak,state.streak);
    const old=state.combo;state.combo=comboMult(state.streak);
    const got=state.combo;state.stars+=got;
    burst(b.x,b.y,b.hue,true);
    for(let i=0;i<got;i++)flyStar(b.x+(Math.random()-.5)*30,b.y+(Math.random()-.5)*30);
    floatText(b.x,b.y-b.r*.4,'+'+got,'#ff8a00',36);
    sfx('pop',{rate:.95+Math.min(.5,state.streak*.04)});
    if(state.combo>old){levelBanner('x'+state.combo+' combo!');sfx('combo');buzz([15,30,15]);state.shake=RM.matches?0:5;}
    AU.ding(Math.min(state.streak-1,13));
    buzz(12);state.pulse=1;state.mood='cheer';state.moodT=1.1;
    if(state.tut===1){state.tut=2;state.tutT=3;try{localStorage.setItem(TUTKEY,'1');}catch(e){}sdk('event','tutorial-done');}
    for(const o of state.balloons)if(o!==b&&!o.dead){o.dead=true;o.fade=1;o.away=true;burst(o.x,o.y,o.hue,false,5,true);}
    /* the adaptive ladder: six in a row and the questions get a bit harder */
    const m=state.mode;
    if(state.runOK>=6&&meta.lv[m]<MAXLV[m]&&!cheated()){meta.lv[m]++;state.runOK=0;state.levelUps++;saveMeta();levelBanner('Level up! Level '+meta.lv[m]);sfx('levelup');AU.fanfare();}
    state.nextQ=state.t+.95;
  }else{
    /* a gentle wobble: the balloon stays, a hint shows, nothing is lost but the streak */
    state.wrong++;state.qWrong++;state.streak=0;state.combo=1;state.failRun++;state.runOK=Math.max(0,state.runOK-2);
    b.wig=1;b.miss=(b.miss||0)+1;state.mood='oops';state.moodT=1.6;
    state.hint=state.q.hint;state.hintT=4.5;
    floatText(b.x,b.y-b.r*.4,'Try another!','#6a3fa0',24);
    AU.boop();sfx('tap',{volume:.6});buzz(8);
    if(state.failRun>=4&&meta.lv[state.mode]>1&&!cheated()){meta.lv[state.mode]--;state.failRun=0;state.runOK=0;saveMeta();}
    /* after a few misses, the right balloon gets a friendly sparkle (never a code, just help) */
    if(state.qWrong>=2){state.helpT=6;}
  }
}

/* ═══════════ input ═══════════ */
function ptFromEvt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function hitButton(p){for(let i=state.buttons.length-1;i>=0;i--){const b=state.buttons[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return b;}return null;}
function onDown(e){
  e.preventDefault();
  AU.init();
  const p=ptFromEvt(e);
  /* reward reveals swallow taps until they are all seen */
  if(state.phase==='over'&&state.revealIdx<state.reveals.length){
    if(state.revealOn&&state.t-state.revealT>.5){state.revealIdx++;state.revealT=state.t;if(state.revealIdx<state.reveals.length)startReveal();}
    return;
  }
  const btn=hitButton(p);
  if(btn){state.press={id:btn.id,until:state.t+.16};sfx('button',{volume:.6});btn.fn(p);return;}
  if(state.phase==='album'){state.drag={y:p.y,s:state.albumScroll,moved:0};return;}
  if(state.phase==='menu')return;
  if(state.phase!=='playing')return;
  /* the blimp reads the question again when tapped */
  {const L=LQ();if(state.q&&Math.abs(p.y-L.cy)<L.h/2&&Math.abs(p.x-L.cx)<L.w/2){speak(state.q.say);state.mood='cheer';state.moodT=.6;}}
  /* topmost balloon under the finger: a big forgiving radius */
  for(let i=state.balloons.length-1;i>=0;i--){
    const b=state.balloons[i];if(b.dead)continue;
    const bx=b.x+Math.sin(b.sway)*8,by=b.y;
    const dx=p.x-bx,dy=p.y-by;const rad=b.r+20;
    if(dx*dx+dy*dy<rad*rad){b.wig=RM.matches?0:1;popBalloon(b);return;}
  }
}
function onMove(e){
  if(!state.drag)return;const p=ptFromEvt(e);const dy=p.y-state.drag.y;state.drag.moved=Math.max(state.drag.moved,Math.abs(dy));
  state.albumScroll=clamp(state.drag.s+dy,-state.albumMax,0);
}
function onUp(e){
  if(state.drag){ /* a tap (not a drag) on a sticker in the album */
    if(state.drag.moved<8&&state.phase==='album'){const p=ptFromEvt(e);for(const s of albumHits){if(p.x>=s.x&&p.x<=s.x+s.w&&p.y>=s.y&&p.y<=s.y+s.h){albumTap(s.id);break;}}}
    state.drag=null;
  }
}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:true});
cv.addEventListener('pointerup',onUp,{passive:true});
cv.addEventListener('pointercancel',()=>{state.drag=null;},{passive:true});
cv.addEventListener('wheel',e=>{if(state.phase==='album'){state.albumScroll=clamp(state.albumScroll-e.deltaY,-state.albumMax,0);e.preventDefault();}},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('webglcontextlost',e=>e.preventDefault());
/* keyboard: 1 / 2 / 3 pick Count, Math or Word Pop, Enter plays; in a round 1-4 pop the balloons counted from the left */
let keyMode=false;
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(state.phase==='menu'){
    if(k==='1')startRound('count',state.speed);else if(k==='2')startRound('math',state.speed);else if(k==='3')startRound('spell',state.speed);
    else if(k==='Enter'||k===' '){e.preventDefault();startRound(state.mode,state.speed);}
    else if(k==='ArrowLeft')changeWorld(-1);else if(k==='ArrowRight')changeWorld(1);
    else if(k==='a'||k==='A')state.phase='album';
  }else if(state.phase==='playing'){
    const n=parseInt(k,10);
    if(n>=1&&n<=9){keyMode=true;const live=state.balloons.filter(b=>!b.dead).sort((a,b)=>a.x-b.x);if(live[n-1]){AU.init();popBalloon(live[n-1]);}}
  }else if(state.phase==='album'){if(k==='Escape'||k==='Enter'){state.phase='menu';}}
  else if(state.phase==='over'){
    if(state.revealIdx<state.reveals.length){if((k==='Enter'||k===' ')&&state.revealOn&&state.t-state.revealT>.5){state.revealIdx++;state.revealT=state.t;if(state.revealIdx<state.reveals.length)startReveal();}}
    else if(k==='Enter'||k===' '){e.preventDefault();startRound(state.mode,state.speed);}
  }
});
function changeWorld(d){
  const n=worldsOf(meta.totalStars);let w=meta.world+d;if(w<0)w=n-1;if(w>=n)w=0;
  if(w!==meta.world){meta.world=w;saveMeta();bgCache=null;state.worldFlash=.5;sfx('swap');}
}
function albumTap(id){
  const have=stickersOf(meta.totalStars);
  if(id<have){state.albumSel=id;state.albumWob=1;speak(stickerName(id));sfx('collect');}
}
function startReveal(){
  const r=state.reveals[state.revealIdx];if(!r)return;
  state.revealT=state.t;state.revealOn=true;
  const w=W/2,h=H*.4;
  for(let i=0;i<40;i++){const a=Math.random()*TAU,v=120+Math.random()*320;addPart({x:w,y:h,vx:Math.cos(a)*v,vy:Math.sin(a)*v-140,rot:Math.random()*TAU,vr:(Math.random()-.5)*12,s:5+Math.random()*6,col:pick(['#ffd23f','#ff5f8f','#3fbcf5','#4fd68a','#a279ff','#fff']),t:1.6,max:1.6,kind:i%3?'conf':'star',g:380});}

/* ═══════════ update ═══════════ */
function update(dt){
  state.t+=dt;state.buttons=[];
  if(state.moodT>0){state.moodT-=dt;if(state.moodT<=0)state.mood='idle';}
  if(state.bump>0)state.bump=Math.max(0,state.bump-dt*4);
  if(state.pulse>0)state.pulse=Math.max(0,state.pulse-dt*6);
  if(state.shake>0)state.shake=Math.max(0,state.shake-dt*22);
  if(state.helpT>0)state.helpT-=dt;
  if(state.banner){state.banner.t-=dt;if(state.banner.t<=0)state.banner=null;}
  if(state.albumWob>0)state.albumWob=Math.max(0,state.albumWob-dt*1.6);
  if(state.worldFlash>0)state.worldFlash-=dt;
  if(state.phase==='playing'){
    musicTick(dt);
    state.time-=dt;
    if(state.time<=0){state.time=0;endRound();return;}
    if(state.hintT>0)state.hintT-=dt;
    if(state.tut===2){state.tutT-=dt;if(state.tutT<=0)state.tut=0;}
    if(state.nextQ&&state.t>=state.nextQ){state.balloons=[];state.nextQ=0;newQuestion();}
    /* now and then a golden bonus balloon floats by */
    state.goldenT-=dt;
    if(state.goldenT<=0&&!state.nextQ&&state.tut===0){
      state.goldenT=rint(14,22);
      if(state.balloons.filter(b=>!b.dead).length>0&&!state.balloons.some(b=>b.golden)){
        const r=clamp(Math.min(W,H*.9)*.1,32,54),L=LQ();
        state.balloons.push({x:Math.random()<.5?Math.max(L.laneL,W*.2)+r:W-r-14*U,y:H+r*1.5,r,rise:SPEEDS[state.speed].rise*1.25,txt:'',correct:false,golden:true,gold:true,hue:['#ffc933','#fff0a3'],sway:Math.random()*TAU,wig:0,rot:0,dead:false,fade:1});
      }
    }
    const lim=LQ().limit;
    for(const b of state.balloons){
      if(b.dead){b.fade-=dt*(b.away?2.6:5);if(b.away)b.y-=b.rise*dt*1.6;continue;}
      b.y-=b.rise*dt;b.sway+=dt*1.4;
      if(b.wig>0)b.wig=Math.max(0,b.wig-dt*1.4);
      if(b.y<lim-b.r*.4){
        if(b.golden){b.dead=true;b.fade=0;}
        else{b.y=H+b.r*1.4;b.x=clamp(b.x+(Math.random()*80-40),b.r+8,W-b.r-8);}
      }
    }
    state.balloons=state.balloons.filter(b=>!(b.dead&&b.fade<=0));
  }
  for(let i=state.parts.length-1;i>=0;i--){
    const c=state.parts[i];c.t-=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.vy+=(c.g||380)*dt;c.rot+=c.vr*dt;c.vx*=.992;
    if(c.t<=0||c.y>H+40)state.parts.splice(i,1);
  }
  for(let i=state.pops.length-1;i>=0;i--){const p=state.pops[i];p.t-=dt;p.r+=300*dt;if(p.t<=0)state.pops.splice(i,1);}
  for(let i=state.floaters.length-1;i>=0;i--){const f=state.floaters[i];f.t-=dt;f.y-=46*dt;if(f.t<=0)state.floaters.splice(i,1);}
  for(let i=state.flies.length-1;i>=0;i--){
    const f=state.flies[i];f.t+=dt/f.dur;
    if(f.t>=1){state.shown=Math.min(state.stars,state.shown+1);state.bump=1;state.flies.splice(i,1);if(state.t-(state.coinAt||0)>.14){state.coinAt=state.t;sfx('coin',{volume:.4,rate:1+Math.random()*.25});}}
  }
  if(state.phase==='playing'&&state.flies.length===0&&state.shown<state.stars&&!state.nextQ)state.shown=state.stars;
}

function stack(items,top,bottom,gap){
  const n=items.length,avail=bottom-top,sumP=items.reduce((a,i)=>a+i.pref,0),sumM=items.reduce((a,i)=>a+i.min,0);
  let g=gap,hs;
  if(sumP+gap*(n-1)<=avail){hs=items.map(i=>i.pref);g=gap+Math.min(18,(avail-sumP-gap*(n-1))/Math.max(1,n-1));}
  else{g=gap*.6;const t=clamp((avail-g*(n-1)-sumM)/Math.max(1,sumP-sumM),0,1);hs=items.map(i=>i.min+t*(i.pref-i.min));}
  const out=[];let y=top;
  for(let i=0;i<n;i++){out.push({y,h:hs[i]});y+=hs[i]+g;}
  return out;
}

  }else if(r.type==='world'){
    const w=WORLDS[r.idx];title='New sky unlocked!';sub=w.name;
    emo(w.emoji,W/2,py,Math.min(cw*.4,ch*.3));
  }else if(r.type==='level'){
    title='Level up!';sub=({count:'Count Pop',math:'Math Pop',spell:'Word Pop'})[r.mode]+' level '+r.lv;
    drawStarShape(W/2,py,Math.min(cw*.28,ch*.2),'#ffd23f',Math.sin(state.t*3)*.1,true);txt(String(r.lv),W/2,py+4,Math.min(cw*.2,ch*.14),'#fff','center',700,['#b86e00',8]);
  }else if(r.type==='gift'){
    title='Daily goal done!';sub='+'+r.n+' bonus stars';emo('🎁',W/2,py,Math.min(cw*.4,ch*.3));
  }else{
    title='Week chest!';sub='+'+r.n+' bonus stars';emo('🧰',W/2,py,Math.min(cw*.4,ch*.3));
  }
  txt(title,W/2,y+ch*.14,clamp(30*U,22,36),'#c93d6f','center',700);
  txt(sub,W/2,y+ch*.74,clamp(28*U,20,34),'#5a2f8a','center',700);
  if(el>.8)txt('Tap to keep going',W/2,y+ch-26*U,clamp(16*U,14,18),'#7a5fb0','center',600);
  cx.restore();
}
function render(dt){
  cx.clearRect(0,0,W,H);
  cx.save();
  if(state.shake>0){cx.translate((Math.random()-.5)*state.shake,(Math.random()-.5)*state.shake);}
  if(state.phase==='menu')drawMenu();
  else if(state.phase==='album')drawAlbum();
  else if(state.phase==='playing'){
    drawWorldBG(FDT);
    drawBalloons();
    const LL=LQ();drawBlimp(LL.cx,LL.cy,LL.w,LL.h,state.q,state.t);
    drawHUD();drawHintCard();drawTutorial();
  }else drawResults();
  cx.restore();
  if(state.phase!=='menu'&&state.phase!=='album')drawFx();
  else if(state.parts.length)drawFx();
}

/* ═══════════ main loop ═══════════ */
let last=performance.now(),fpsN=0,fpsT=0,fps=60,errOnce=false;
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;FDT=dt;
  fpsN++;fpsT+=dt;if(fpsT>=1){fps=fpsN;fpsN=0;fpsT=0;}
  try{update(dt);render(dt);}catch(err){ /* a hiccup must never freeze the sky, but it is reported once */ if(!errOnce){errOnce=true;try{console.error('BalloonBust frame error: '+(err&&err.stack||err));}catch(e){}} }
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
try{document.fonts&&document.fonts.load('700 20px Fredoka');}catch(e){}

/* ═══════════ test hook ═══════════ */
window.__bb_debug={
  wipe(){try{localStorage.removeItem(LSKEY);localStorage.removeItem(TUTKEY);}catch(e){}meta=loadMeta();syncDaily();},
  start:startRound,
  state(){return{
    phase:state.phase,mode:state.mode,speed:state.speed,time:state.time,stars:state.stars,streak:state.streak,
    bestStreak:state.bestStreak,combo:state.combo,prompt:state.q?state.q.prompt:'',hint:state.hint,hintShown:state.hintT>0,
    balloons:state.balloons.filter(b=>!b.dead).map(b=>({x:Math.round(b.x),y:Math.round(b.y),txt:b.txt,correct:b.correct,golden:!!b.golden})),
    questions:state.questions,correct:state.correct,wrong:state.wrong,newStickers:state.earnedStickers.length,
    reveals:state.reveals.length,revealIdx:state.revealIdx,rating:state.rating,world:meta.world,fps,parts:state.parts.length,
    buttons:state.buttons.map(b=>({id:b.id,x:Math.round(b.x),y:Math.round(b.y),w:Math.round(b.w),h:Math.round(b.h)}))
  };},
  meta(){return{...meta,stickers:stickersOf(meta.totalStars),worlds:worldsOf(meta.totalStars)};},
  addStars(n){meta.totalStars+=n;saveMeta();},
  popCorrect(){const b=state.balloons.find(x=>x.correct&&!x.dead);if(b)popBalloon(b,true);return !!b;},
  popWrong(){const b=state.balloons.find(x=>!x.correct&&!x.dead);if(b)popBalloon(b,false);return !!b;},
  endRound,toMenu,openAlbum(){state.phase='album';},setWorld(i){meta.world=i;bgCache=null;},
  dismissReveals(){state.revealIdx=state.reveals.length;state.revealOn=true;}
};

/* ═══════════ Caleb's Arcade: restart, exit, tutorial, hints and codes go through the SDK ═══════════ */
if(SDK)ArcadeSDK.init({pauseKeys:'p+esc',
  onRestart:()=>startRound(state.mode,state.speed),
  onExit:toMenu,
  onTutorial:()=>startRound(state.mode,state.speed,true),
  onHint:hint,onCheat:code,
  onPause:()=>{try{if(window.speechSynthesis)speechSynthesis.pause();}catch(e){}},
  onResume:()=>{try{if(window.speechSynthesis)speechSynthesis.resume();}catch(e){}}});
sdk('state',{scene:'title'});
</script>
