<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CRITTER RUSH</title>
        <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { overflow: hidden; background: #87CEEB; font-family: 'Arial Black', Arial, sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; }
        #titleScreen { background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); }
        #titleScreen h1 { font-size: clamp(2.1rem, 10.5vw, 6rem); color: #FFD700; text-shadow: 6px 6px 0 #FF4500, 10px 10px 0 rgba(0,0,0,0.5); letter-spacing: 8px; transform: rotate(-5deg); margin-bottom: 20px; }
        #titleScreen p { color: white; font-size: 1.4rem; text-shadow: 2px 2px 0 #333; margin: 8px; }
        .btn { font-size: 2.2rem; padding: 16px 50px; background: #FFD700; border: none; border-radius: 50px; color: #333; font-weight: bold; cursor: pointer; box-shadow: 0 8px 0 #B8860B; margin: 20px; transition: transform 0.1s; pointer-events: auto; }
        .btn:hover { transform: translateY(-4px); }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #B8860B; }
        #charSelect { display: flex; gap: 20px; margin: 20px; flex-wrap: wrap;
    justify-content: center; max-width: calc(100% - 40px); }
        .charBtn { width: 100px; height: 100px; border-radius: 20px; border: 4px solid white; background: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        .charBtn:hover { border-color: #FFD700; transform: scale(1.1); }
        .charBtn.selected { border-color: #FFD700; background: rgba(255,215,0,0.4); }
        #hud { position: absolute; top: 10px; left: 10px; color: white; font-size: 1.4rem; text-shadow: 2px 2px 0 #333; display: none; }
        #progressBar { width: 300px; height: 20px; background: rgba(0,0,0,0.5); border-radius: 10px; margin-top: 10px; position: relative; }
        #progressBar .marker { position: absolute; width: 14px; height: 14px; border-radius: 50%; top: 3px; transform: translateX(-7px); border: 2px solid white; }
        #itemSlot { position: absolute; bottom: 30px; right: 30px; width: 80px; height: 80px; background: rgba(0,0,0,0.6); border-radius: 20px; border: 4px solid white; display: none; align-items: center; justify-content: center; font-size: 2.5rem; cursor: pointer; pointer-events: auto; }
        #itemSlot:hover { background: rgba(0,0,0,0.8); }
        #timer { position: absolute; top: 10px; right: 10px; font-size: 2rem; color: white; text-shadow: 2px 2px 0 #333; display: none; }
        #muteBtn { position: absolute; bottom: 30px; left: 30px; width: 50px; height: 50px; background: rgba(0,0,0,0.6); border-radius: 50%; border: 3px solid white; color: white; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; }
        #resultScreen { background: rgba(0,0,0,0.7); display: none; }
        #resultScreen h2 { font-size: 4rem; color: #FFD700; text-shadow: 4px 4px 0 #FF4500; }
        #resultScreen .place { font-size: 2rem; color: white; margin: 10px; }
        #touchControls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; pointer-events: none; }
        .touchBtn { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.3); border: 3px solid white; margin: 0 10px; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; color: white; pointer-events: auto; }
        @media (pointer: coarse) { #touchControls { display: block; } }
/* Narrow screens: the title was 6rem with 8px tracking (547px wide) and the character row was
   4x100px + 3x20px gaps (460px), so both overflowed a 390px viewport and the page scrolled sideways. */
@media (max-width: 560px) {
  /* On a touch device the keyboard hint is both useless and overlapping the on-screen controls. */
  #titleScreen p { display: none; }
  #titleScreen h1 { letter-spacing: 2px; }
  #charSelect { gap: 10px; margin: 12px; }
  .charBtn { width: 72px; height: 72px; border-width: 3px; }
  .charBtn svg { width: 46px; height: 46px; }
  #titleScreen p { font-size: 1rem; }
}
        .nameTag { position: absolute; transform: translate(-50%, -100%); background: rgba(0,0,0,0.7); color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; white-space: nowrap; pointer-events: none; }
        /* A badge lifted clear of a neighbour still reads as attached to its racer via this stem. */
        .nameTag.lifted::after { content: ''; position: absolute; left: 50%; top: 100%; width: 2px; height: var(--stem, 0px); margin-left: -1px; background: currentColor; opacity: 0.7; border-radius: 1px; }
        #countdownDisplay { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); font-size: 8rem; color: #FFD700; text-shadow: 6px 6px 0 #FF4500, 10px 10px 0 rgba(0,0,0,0.5); display: none; z-index: 10; }
        .impactPop { position: absolute; font-size: 3.5rem; font-weight: 900; color: #FF4500; text-shadow: 3px 3px 0 #FFF, -2px -2px 0 #FFF, 2px -2px 0 #FFF, -2px 2px 0 #FFF; transform: translate(-50%, -50%); pointer-events: none; z-index: 20; animation: popAnim 0.6s ease-out forwards; }
        @keyframes popAnim { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1) translateY(-60px); opacity: 0; } }
    </style>
</head>
<body>
    <div id="ui">
        <div id="titleScreen" class="screen">
            <h1>CRITTER RUSH</h1>
            <p>Race to the finish! Use weapons to slow rivals!</p>
            <div id="charSelect">
                <button class="charBtn selected" data-char="fox" aria-label="Fox" title="Fox"><svg viewBox="0 0 64 64" width="62" height="62" aria-hidden="true"><polygon points="13,24 19,4 31,18" fill="#f4762a"/><polygon points="51,24 45,4 33,18" fill="#f4762a"/><polygon points="18,21 21,10 27,18" fill="#2a2a2a"/><polygon points="46,21 43,10 37,18" fill="#2a2a2a"/><ellipse cx="32" cy="37" rx="20" ry="18" fill="#f4762a"/><ellipse cx="32" cy="43" rx="12" ry="9" fill="#fff0dc"/><circle cx="25" cy="34" r="3.2" fill="#2a2a2a"/><circle cx="39" cy="34" r="3.2" fill="#2a2a2a"/><ellipse cx="32" cy="42" rx="3.6" ry="2.6" fill="#2a2a2a"/></svg></button>
                <button class="charBtn" data-char="rabbit" aria-label="Rabbit" title="Rabbit"><svg viewBox="0 0 64 64" width="62" height="62" aria-hidden="true"><ellipse cx="22" cy="12" rx="6" ry="14" fill="#fdf6e3"/><ellipse cx="42" cy="12" rx="6" ry="14" fill="#fdf6e3"/><ellipse cx="22" cy="13" rx="3" ry="9" fill="#ffb3c6"/><ellipse cx="42" cy="13" rx="3" ry="9" fill="#ffb3c6"/><ellipse cx="32" cy="37" rx="20" ry="18" fill="#fdf6e3"/><ellipse cx="32" cy="43" rx="12" ry="9" fill="#ffffff"/><circle cx="25" cy="34" r="3.2" fill="#2a2a2a"/><circle cx="39" cy="34" r="3.2" fill="#2a2a2a"/><ellipse cx="32" cy="42" rx="3.6" ry="2.6" fill="#2a2a2a"/></svg></button>
                <button class="charBtn" data-char="cat" aria-label="Cat" title="Cat"><svg viewBox="0 0 64 64" width="62" height="62" aria-hidden="true"><polygon points="13,24 19,4 31,18" fill="#9aa4ad"/><polygon points="51,24 45,4 33,18" fill="#9aa4ad"/><polygon points="18,21 21,10 27,18" fill="#ffb3c6"/><polygon points="46,21 43,10 37,18" fill="#ffb3c6"/><ellipse cx="32" cy="37" rx="20" ry="18" fill="#9aa4ad"/><ellipse cx="32" cy="43" rx="12" ry="9" fill="#e8edf1"/><circle cx="25" cy="34" r="3.2" fill="#2a2a2a"/><circle cx="39" cy="34" r="3.2" fill="#2a2a2a"/><ellipse cx="32" cy="42" rx="3.6" ry="2.6" fill="#2a2a2a"/></svg></button>
                <button class="charBtn" data-char="bear" aria-label="Bear" title="Bear"><svg viewBox="0 0 64 64" width="62" height="62" aria-hidden="true"><circle cx="17" cy="17" r="9" fill="#8b5a2b"/><circle cx="47" cy="17" r="9" fill="#8b5a2b"/><circle cx="17" cy="17" r="4.5" fill="#6b4420"/><circle cx="47" cy="17" r="4.5" fill="#6b4420"/><ellipse cx="32" cy="37" rx="20" ry="18" fill="#8b5a2b"/><ellipse cx="32" cy="43" rx="12" ry="9" fill="#c89b6a"/><circle cx="25" cy="34" r="3.2" fill="#2a2a2a"/><circle cx="39" cy="34" r="3.2" fill="#2a2a2a"/><ellipse cx="32" cy="42" rx="3.6" ry="2.6" fill="#2a2a2a"/></svg></button>
            </div>
            <button id="playBtn" class="btn">PLAY</button>
            <p>Space/W/↑: Jump (double) | S/↓: Slide | F/Shift: Use Item</p>
        </div>
        <div id="hud">
            <div id="position">1st</div>
            <div id="progressBar"></div>
        </div>
        <div id="timer">0:00</div>
        <div id="itemSlot" title="Use item"></div>
        <div id="muteBtn">🔊</div>
        <div id="resultScreen" class="screen">
            <h2 id="resultTitle">YOU WIN!</h2>
            <div id="resultPlaces"></div>
            <button id="restartBtn" class="btn">RESTART</button>
            <button id="btnShare" class="btn" style="font-size:1.3rem;padding:12px 34px;margin:6px">SAVE THE RACE CARD</button>
        </div>
        <div id="touchControls">
            <div class="touchBtn" id="touchJump">⬆</div>
            <div class="touchBtn" id="touchSlide">⬇</div>
            <div class="touchBtn" id="touchItem">⚡</div>
        </div>
        <div id="countdownDisplay"></div>
    </div>
    <script src="vendor/three.classic.js"></script>
<script>

        // --- Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 120, 300);
        const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(0, 5, 26);
        camera.lookAt(0, 3, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // --- Lights ---
        const sunLight = new THREE.DirectionalLight(0xfff5e0, 1.5);
        sunLight.position.set(10, 30, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 200;
        sunLight.shadow.camera.left = -60;
        sunLight.shadow.camera.right = 60;
        sunLight.shadow.camera.top = 30;
        sunLight.shadow.camera.bottom = -10;
        scene.add(sunLight);
        const ambient = new THREE.AmbientLight(0x9fc4e8, 1.15);   // sky bounce; nothing may read as black
        scene.add(ambient);
        const fillLight = new THREE.DirectionalLight(0xbfe3ff, 0.75);
        fillLight.position.set(-10, 10, -10);
        scene.add(fillLight);

        // --- Audio ---
        let audioCtx = null;
        let muted = false;
        const soundCache = {};
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            soundCache.noise = buffer;
            startMusic();
        }
        function playTone(freq, duration, type = 'sine', volume = 0.2, delay = 0) {
            if (muted || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume, audioCtx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + delay);
            osc.stop(audioCtx.currentTime + delay + duration);
        }
        function playNoise(duration, volume = 0.2, delay = 0) {
            if (muted || !audioCtx) return;
            const source = audioCtx.createBufferSource();
            source.buffer = soundCache.noise;
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1000;
            gain.gain.setValueAtTime(volume, audioCtx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
            source.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            source.start(audioCtx.currentTime + delay);
            source.stop(audioCtx.currentTime + delay + duration);
        }
        function playJump() { playTone(300, 0.2, 'square', 0.15); playTone(600, 0.15, 'square', 0.1, 0.05); }
        function playLand() { playNoise(0.1, 0.2); playTone(100, 0.1, 'sine', 0.2); }
        function playHit() { playNoise(0.2, 0.4); playTone(200, 0.2, 'sawtooth', 0.3); }
        function playItem() { playTone(800, 0.1, 'square', 0.2); playTone(1200, 0.15, 'square', 0.15, 0.1); }
        function playUse() { playTone(400, 0.2, 'sawtooth', 0.2); playNoise(0.3, 0.2, 0.05); }
        function playCountdown(n) { playTone(n === 0 ? 1000 : 500, 0.3, 'square', 0.3); }
        function playFinish() { [523, 659, 784, 1047].forEach((f, i) => playTone(f, 0.3, 'triangle', 0.3, i * 0.15)); playNoise(0.5, 0.2, 0.5); }
        function playCheer() { playNoise(1.5, 0.3); playTone(600, 0.5, 'sine', 0.2, 0.2); playTone(800, 0.5, 'sine', 0.2, 0.4); }

        // --- Music system (scheduled with audioCtx.currentTime) ---
        let musicTimer = null;
        let musicStep = 0;
        let musicNextTime = 0;
        const MELODY = [523, 659, 784, 659, 523, 587, 698, 587];
        const BASS = [220, 220, 262, 262, 294, 294, 330, 330];
        function startMusic() {
            if (!audioCtx || musicTimer) return;
            musicStep = 0;
            musicNextTime = audioCtx.currentTime + 0.1;
            musicTimer = setInterval(scheduleMusic, 100);
        }
        function scheduleMusic() {
            if (!audioCtx || muted) return;
            const leaderX = Math.max(...racers.map(r => r.x));
            const finalStretch = leaderX > TRACK_LENGTH * 0.8;
            const tempo = finalStretch ? 0.18 : 0.24;
            while (musicNextTime < audioCtx.currentTime + 0.5) {
                const step = musicStep % 8;
                const bassFreq = BASS[step];
                const melFreq = MELODY[step];
                playTone(bassFreq, tempo * 0.8, 'triangle', finalStretch ? 0.14 : 0.1, musicNextTime - audioCtx.currentTime);
                playTone(melFreq * 2, tempo * 0.5, 'square', finalStretch ? 0.08 : 0.05, musicNextTime - audioCtx.currentTime);
                playTone(melFreq * 4, tempo * 0.3, 'sine', finalStretch ? 0.05 : 0.03, musicNextTime - audioCtx.currentTime);
                if (step % 2 === 0) playNoise(0.05, 0.04, musicNextTime - audioCtx.currentTime);
                musicNextTime += tempo;
                musicStep++;
            }
        }

        // --- Game state ---
        let phase = 'title';
        let raceTime = 0;
        let playerPlace = 0;
        let finished = false;
        let selectedChar = 'fox';
        let keys = {};
        let jumpBuffer = 0;
        let coyoteTime = 0;
        let canDoubleJump = true;
        let isGrounded = true;
        let isSliding = false;
        let slideTimer = 0;
        let stunTimer = 0;
        let invulnTimer = 0;
        let item = null;
        let playerSpeedBoost = 0;
        let screenShake = 0;
        let hitStop = 0;
        let countdown = 3;
        let countdownTimer = 0;
        let bestTime = localStorage.getItem('critterBest') || null;

        // --- Track constants ---
        const TRACK_LENGTH = 900;
        const BASE_SPEED = 14;
        const PLAYER_SPEED = BASE_SPEED + 2.5;

        // --- Daily seed (DeepcutMine convention) ---
        // The hub launches cabinets with ?seed=<uint32>. Seed the RACE TRACK / world
        // layout only (scenery, obstacles, crates, clouds, hills). Racer stats, AI,
        // particles, camera shake and item drops keep Math.random. Without ?seed= the
        // seed stays random, so normal play is unchanged.
        const URLSEED = (function(){ try{ var m = /[?&]seed=(\d+)/.exec(location.search); return m ? (parseInt(m[1],10)>>>0) : null; }catch(e){ return null; } })();
        let _rng = URLSEED === null ? ((Math.random()*4294967296)>>>0) : URLSEED;
        const _seedVal = _rng;
        function rnd(){
            _rng = (_rng + 0x6D2B79F5) | 0;
            let t = Math.imul(_rng ^ (_rng >>> 15), 1 | _rng);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        }
        let _worldSig = [];

        // --- Ground height function ---
        function groundY(x) {
            return Math.sin(x * 0.08) * 0.8 + Math.sin(x * 0.03 + 1.3) * 0.5 + Math.cos(x * 0.02) * 0.3;
        }

        // --- Racer definitions ---
        const RACER_DEFS = [
            { name: 'Fox', color: 0xff6b35, char: 'fox', skill: 0.8 },
            { name: 'Rabbit', color: 0x9b59b6, char: 'rabbit', skill: 0.6 },
            { name: 'Cat', color: 0x2ecc71, char: 'cat', skill: 0.7 },
            { name: 'Bear', color: 0x8b4513, char: 'bear', skill: 0.5 }
        ];

        // --- Create racers ---
        const racers = [];
        const racerGroup = new THREE.Group();
        scene.add(racerGroup);

        function buildCritter(kind) {
            const g = new THREE.Group();
            const mat = (c, rough = 0.75) => new THREE.MeshStandardMaterial({ color: c, roughness: rough });

            const SPEC = {
                fox:    { body: 0xf4762a, belly: 0xfff0dc, muzzle: 0xfff0dc, ear: 0xf4762a, earIn: 0x2a2a2a,
                          nose: 0x2a2a2a, limb: 0xd9561a, foot: 0x2a2a2a, width: 1.00, tail: 'bushy' },
                rabbit: { body: 0xfdf6e3, belly: 0xffffff, muzzle: 0xffffff, ear: 0xfdf6e3, earIn: 0xffb3c6,
                          nose: 0xff8fab, limb: 0xece3cc, foot: 0xd9cfb6, width: 0.92, tail: 'puff' },
                cat:    { body: 0x9aa4ad, belly: 0xe8edf1, muzzle: 0xe8edf1, ear: 0x9aa4ad, earIn: 0xffb3c6,
                          nose: 0xff8fab, limb: 0x7f8a94, foot: 0x5f6a74, width: 0.90, tail: 'long' },
                bear:   { body: 0x8b5a2b, belly: 0xc89b6a, muzzle: 0xe8c9a0, ear: 0x8b5a2b, earIn: 0x6b4420,
                          nose: 0x1a1a1a, limb: 0x74491f, foot: 0x4a2f14, width: 1.22, tail: 'none' },
            };
            const s = SPEC[kind] || SPEC.fox;
            const W = s.width;

            const bodyMat = mat(s.body), bellyMat = mat(s.belly), limbMat = mat(s.limb);
            const footMat = mat(s.foot), muzzleMat = mat(s.muzzle);

            const legs = [];
            for (const side of [-1, 1]) {
                const hip = new THREE.Group();
                hip.position.set(0, 0.92, side * 0.24 * W);

                const thigh = new THREE.Mesh(new THREE.CapsuleGeometry(0.16 * W, 0.36, 4, 8), limbMat);
                thigh.position.y = -0.26;
                hip.add(thigh);

                const knee = new THREE.Group();
                knee.position.y = -0.52;
                const shin = new THREE.Mesh(new THREE.CapsuleGeometry(0.14 * W, 0.30, 4, 8), limbMat);
                shin.position.y = -0.22;
                knee.add(shin);
                const foot = new THREE.Mesh(new THREE.SphereGeometry(0.20 * W, 10, 8), footMat);
                foot.scale.set(1.5, 0.6, 1.0);
                foot.position.set(0.10, -0.40, 0);
                knee.add(foot);
                hip.add(knee);

                g.add(hip);
                legs.push(hip);
            }

            const torso = new THREE.Mesh(new THREE.SphereGeometry(0.52, 14, 12), bodyMat);
            torso.scale.set(0.92 * W, 1.28, 0.88 * W);
            torso.position.y = 1.52;
            g.add(torso);

            const belly = new THREE.Mesh(new THREE.SphereGeometry(0.40, 12, 10), bellyMat);
            belly.scale.set(0.72 * W, 1.02, 0.60);
            belly.position.set(0.16, 1.46, 0);
            g.add(belly);

            const arms = [];
            for (const side of [-1, 1]) {
                const shoulder = new THREE.Group();
                shoulder.position.set(0, 1.92, side * 0.46 * W);
                const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.13 * W, 0.34, 4, 8), limbMat);
                upper.position.y = -0.26;
                shoulder.add(upper);
                const paw = new THREE.Mesh(new THREE.SphereGeometry(0.16 * W, 10, 8), footMat);
                paw.position.y = -0.50;
                shoulder.add(paw);
                g.add(shoulder);
                arms.push(shoulder);
            }

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.50, 16, 14), bodyMat);
            head.scale.set(1.0 * W, 0.96, 0.94 * W);
            head.position.y = 2.42;
            g.add(head);

            const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 10), muzzleMat);
            muzzle.scale.set(1.25, 0.78, 0.86);
            muzzle.position.set(0.40, 2.30, 0);
            g.add(muzzle);

            const nose = new THREE.Mesh(new THREE.SphereGeometry(0.085, 8, 8), mat(s.nose, 0.4));
            nose.position.set(0.68, 2.36, 0);
            g.add(nose);

            if (kind === 'rabbit') {
                const teeth = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.14, 0.16), mat(0xffffff, 0.4));
                teeth.position.set(0.58, 2.18, 0);
                g.add(teeth);
            }

            for (const side of [-1, 1]) {
                const white = new THREE.Mesh(new THREE.SphereGeometry(0.155, 10, 10), mat(0xffffff, 0.3));
                white.position.set(0.26, 2.52, side * 0.30 * W);
                g.add(white);
                const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.085, 8, 8), mat(0x1a1a1a, 0.2));
                pupil.position.set(0.37, 2.52, side * 0.34 * W);
                g.add(pupil);
                const glint = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 6),
                    new THREE.MeshBasicMaterial({ color: 0xffffff }));
                glint.position.set(0.42, 2.58, side * 0.36 * W);
                g.add(glint);
            }

            const ears = [];
            for (const side of [-1, 1]) {
                const ear = new THREE.Group();
                ear.position.set(-0.02, 2.78, side * 0.26 * W);
                let outer, inner;
                if (kind === 'rabbit') {
                    outer = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.70, 4, 8), mat(s.ear));
                    outer.position.y = 0.44;
                    inner = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.52, 4, 8), mat(s.earIn));
                    inner.position.set(0.06, 0.44, 0);
                } else if (kind === 'bear') {
                    outer = new THREE.Mesh(new THREE.SphereGeometry(0.19, 10, 8), mat(s.ear));
                    outer.position.y = 0.12;
                    inner = new THREE.Mesh(new THREE.SphereGeometry(0.10, 8, 8), mat(s.earIn));
                    inner.position.set(0.08, 0.12, 0);
                } else {
                    const h = kind === 'fox' ? 0.62 : 0.42;
                    outer = new THREE.Mesh(new THREE.ConeGeometry(0.19, h, 8), mat(s.ear));
                    outer.position.y = h * 0.5;
                    inner = new THREE.Mesh(new THREE.ConeGeometry(0.10, h * 0.6, 8), mat(s.earIn));
                    inner.position.set(0.06, h * 0.45, 0);
                }
                ear.add(outer);
                ear.add(inner);
                ear.userData.baseRot = -0.10 + side * 0.40;
                ear.rotation.z = ear.userData.baseRot;
                g.add(ear);
                ears.push(ear);
            }

            const tailParts = [];
            if (s.tail !== 'none') {
                const tail = new THREE.Group();
                tail.position.set(-0.44, 1.42, 0);
                if (s.tail === 'bushy') {
                    for (let i = 0; i < 3; i++) {
                        const puff = new THREE.Mesh(new THREE.SphereGeometry(0.30 - i * 0.045, 10, 8),
                            mat(i === 2 ? 0xfff0dc : s.body));
                        puff.position.set(-0.20 * i, -0.10 * i, 0);
                        tail.add(puff);
                    }
                } else if (s.tail === 'puff') {
                    const puff = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), mat(0xffffff));
                    tail.add(puff);
                } else {
                    for (let i = 0; i < 5; i++) {
                        const seg = new THREE.Mesh(new THREE.SphereGeometry(0.115 - i * 0.012, 8, 6),
                            mat(i % 2 ? 0x7f8a94 : s.body));
                        seg.position.set(-0.17 * (i + 1), 0.12 * i * i * 0.32, 0);
                        tail.add(seg);
                    }
                }
                g.add(tail);
                tailParts.push(tail);
            }

            if (kind === 'cat') {
                for (let i = 0; i < 3; i++) {
                    const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.26, 0.52), mat(0x6d777f));
                    stripe.position.set(-0.24 + i * 0.16, 1.82 - i * 0.16, 0);
                    g.add(stripe);
                }
            }
            if (kind === 'fox') {
                for (const side of [-1, 1]) {
                    const ruff = new THREE.Mesh(new THREE.SphereGeometry(0.17, 8, 8), mat(0xfff0dc));
                    ruff.scale.set(0.8, 1.1, 0.7);
                    ruff.position.set(0.10, 2.30, side * 0.42 * W);
                    g.add(ruff);
                }
            }

            const shadow = new THREE.Mesh(
                new THREE.CircleGeometry(0.75 * W, 14),
                new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25, depthWrite: false })
            );
            shadow.rotation.x = -Math.PI / 2;
            shadow.position.y = 0.02;
            g.add(shadow);

            g.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
            shadow.castShadow = false;

            g.userData.limbs = legs;
            g.userData.arms = arms;
            g.userData.tail = tailParts;
            g.userData.ears = ears;
            g.userData.shadow = shadow;
            return g;
        }

        RACER_DEFS.forEach((def, i) => {
            const mesh = buildCritter(def.char);
            const zOff = (i === 0) ? 1.8 : (i === 1 ? 0.6 : (i === 2 ? -0.6 : -1.8));
            mesh.position.set(i * 3, groundY(i * 3), zOff);
            mesh.scale.set(kindScale(def.char), kindScale(def.char), kindScale(def.char));
            racerGroup.add(mesh);
            racers.push({
                name: def.name,
                color: def.color,
                mesh: mesh,
                x: 7 - i,
                y: groundY(i * 3),
                vy: 0,
                speed: BASE_SPEED * (0.9 + Math.random() * 0.2),
                isPlayer: i === 0,
                isGrounded: true,
                canDoubleJump: true,
                stunTimer: 0,
                invulnTimer: 0,
                item: null,
                skill: def.skill,
                finishTime: 0,
                finished: false,
                slideTimer: 0,
                isSliding: false,
                runPhase: Math.random() * Math.PI * 2,
                zOffset: zOff,
                speedBoost: 0,
                mudTimer: 0,
                baseSpeed: def.isPlayer ? 0 : BASE_SPEED * (0.94 + Math.random() * 0.12) * (0.92 + def.skill * 0.18),
                shield: false
            });
        });

        function kindScale(kind) {
            if (kind === 'bear') return 1.35;
            if (kind === 'rabbit') return 1.25;
            if (kind === 'fox') return 1.2;
            return 1.15;
        }

        const player = racers[0];
        player.speed = PLAYER_SPEED;
        player.baseSpeed = PLAYER_SPEED;

        const nameTagEls = [];
        const tagRects = [];   // scratch list of this frame's placed badge rects (avoids per-frame allocation)
        racers.forEach(r => {
            const el = document.createElement('div');
            el.className = 'nameTag';
            el.textContent = r.name;
            el.style.color = '#' + r.color.toString(16).padStart(6, '0');
            document.body.appendChild(el);
            nameTagEls.push(el);
        });

        // --- Track building ---
        const trackGroup = new THREE.Group();
        scene.add(trackGroup);

        const groundStep = 0.5;
        const groundSegCount = Math.floor((TRACK_LENGTH + 60) / groundStep);
        const groundVertices = [];
        const groundIndices = [];
        const groundColors = [];
        const grassTop = new THREE.Color(0x4CAF50);
        const dirtSide = new THREE.Color(0x8B5A2B);
        const Z_FAR = -34, Z_NEAR = 12;
        const DIRT_BAND = 1.6, SKIRT = 60;
        const dirtDeep = new THREE.Color(0x5c3a1c);
        for (let i = 0; i <= groundSegCount; i++) {
            const x = -20 + i * groundStep;
            const yTop = groundY(x);
            groundVertices.push(x, yTop, Z_FAR);
            groundVertices.push(x, yTop, Z_NEAR);
            groundVertices.push(x, yTop - DIRT_BAND, Z_NEAR);
            groundVertices.push(x, yTop - SKIRT, Z_NEAR);
            groundColors.push(grassTop.r, grassTop.g, grassTop.b);
            groundColors.push(grassTop.r, grassTop.g, grassTop.b);
            groundColors.push(dirtSide.r, dirtSide.g, dirtSide.b);
            groundColors.push(dirtDeep.r, dirtDeep.g, dirtDeep.b);
            if (i < groundSegCount) {
                const b = i * 4, n = (i + 1) * 4;
                groundIndices.push(b + 0, b + 1, n + 1, b + 0, n + 1, n + 0);
                groundIndices.push(b + 1, b + 2, n + 2, b + 1, n + 2, n + 1);
                groundIndices.push(b + 2, b + 3, n + 3, b + 2, n + 3, n + 2);
            }
        }
        const groundGeo = new THREE.BufferGeometry();
        groundGeo.setAttribute('position', new THREE.Float32BufferAttribute(groundVertices, 3));
        groundGeo.setAttribute('color', new THREE.Float32BufferAttribute(groundColors, 3));
        groundGeo.setIndex(groundIndices);
        groundGeo.computeVertexNormals();
        const groundMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, side: THREE.DoubleSide });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.receiveShadow = true;
        trackGroup.add(ground);

        // Dirt patches
        for (let i = 0; i < 20; i++) {
            const x = rnd() * TRACK_LENGTH;
            const dirt = new THREE.Mesh(
                new THREE.CircleGeometry(1.5, 8),
                new THREE.MeshStandardMaterial({ color: 0x8B4513 })
            );
            dirt.rotation.x = -Math.PI / 2;
            dirt.position.set(x, groundY(x) + 0.05, (rnd() - 0.5) * 4);
            trackGroup.add(dirt);
        }

        // Grass tufts (denser)
        for (let i = 0; i < 200; i++) {
            const x = rnd() * TRACK_LENGTH;
            const tuft = new THREE.Mesh(
                new THREE.ConeGeometry(0.2, 0.5, 4),
                new THREE.MeshStandardMaterial({ color: 0x2E8B57 })
            );
            tuft.position.set(x, groundY(x) + 0.25, (rnd() - 0.5) * 6);
            trackGroup.add(tuft);
        }

        // Checkered finish line
        const finishGroup = new THREE.Group();
        for (let i = 0; i < 4; i++) {
            for (let j = 0; j < 2; j++) {
                const tile = new THREE.Mesh(
                    new THREE.BoxGeometry(0.5, 0.1, 0.5),
                    new THREE.MeshStandardMaterial({ color: (i + j) % 2 === 0 ? 0xffffff : 0x000000 })
                );
                tile.position.set(TRACK_LENGTH, groundY(TRACK_LENGTH) + 0.05, -1.5 + j * 1 + i * 0.5);
                finishGroup.add(tile);
            }
        }
        trackGroup.add(finishGroup);

        // Finish gantry (proper checkered banner)
        const gantryMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
        const gantryLeft = new THREE.Mesh(new THREE.BoxGeometry(0.5, 5, 0.5), gantryMat);
        gantryLeft.position.set(TRACK_LENGTH, groundY(TRACK_LENGTH) + 2.5, -3);
        trackGroup.add(gantryLeft);
        const gantryRight = gantryLeft.clone();
        gantryRight.position.z = 3;
        trackGroup.add(gantryRight);
        const gantryTop = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 6.5), gantryMat);
        gantryTop.position.set(TRACK_LENGTH, groundY(TRACK_LENGTH) + 5, 0);
        trackGroup.add(gantryTop);
        const bannerGroup = new THREE.Group();
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 2; j++) {
                const tile = new THREE.Mesh(
                    new THREE.BoxGeometry(0.5, 0.5, 0.1),
                    new THREE.MeshStandardMaterial({ color: (i + j) % 2 === 0 ? 0xffffff : 0x000000 })
                );
                tile.position.set(i * 0.5 - 1.75, j * 0.5 - 0.25, 0);
                bannerGroup.add(tile);
            }
        }
        bannerGroup.position.set(TRACK_LENGTH, groundY(TRACK_LENGTH) + 4, 0);
        trackGroup.add(bannerGroup);

        // Obstacles
        const obstacleGroup = new THREE.Group();
        scene.add(obstacleGroup);
        const crateGroup = new THREE.Group();
        scene.add(crateGroup);

        function createObstacle(type, x) {
            let mesh;
            if (type === 'rock') {
                mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.8), new THREE.MeshStandardMaterial({ color: 0x808080, roughness: 0.8 }));
                mesh.position.set(x, groundY(x) + 0.5, (rnd() - 0.5) * 3);
                mesh.scale.y = 0.6;
            } else if (type === 'log') {
                mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 2, 8), new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
                mesh.position.set(x, groundY(x) + 0.5, (rnd() - 0.5) * 3);
                mesh.rotation.z = Math.PI / 2;
            } else if (type === 'branch') {
                mesh = new THREE.Mesh(new THREE.BoxGeometry(2, 0.3, 0.3), new THREE.MeshStandardMaterial({ color: 0x4a2f1b }));
                mesh.position.set(x, groundY(x) + 1.8, (rnd() - 0.5) * 3);
            } else if (type === 'pipe') {
                mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 2, 8), new THREE.MeshStandardMaterial({ color: 0xff6600 }));
                mesh.position.set(x, groundY(x) + 1.5, (rnd() - 0.5) * 3);
                mesh.rotation.z = Math.PI / 2;
            } else if (type === 'spike') {
                const group = new THREE.Group();
                for (let i = 0; i < 3; i++) {
                    const spike = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 8), new THREE.MeshStandardMaterial({ color: 0x888888 }));
                    spike.position.set(i - 1, groundY(x) + 0.4, 0);
                    group.add(spike);
                }
                group.position.set(x, 0, (rnd() - 0.5) * 3);
                mesh = group;
            } else if (type === 'mud') {
                mesh = new THREE.Mesh(new THREE.CircleGeometry(1.5, 8), new THREE.MeshStandardMaterial({ color: 0x5D4E37 }));
                mesh.rotation.x = -Math.PI / 2;
                mesh.position.set(x, groundY(x) + 0.02, (rnd() - 0.5) * 3);
            } else if (type === 'mushroom') {
                mesh = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 8), new THREE.MeshStandardMaterial({ color: 0xff0000 }));
                mesh.position.set(x, groundY(x) + 0.8, (rnd() - 0.5) * 3);
                mesh.scale.set(1, 0.6, 1);
                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 0.8, 8), new THREE.MeshStandardMaterial({ color: 0xffddcc }));
                stem.position.set(x, groundY(x) + 0.4, mesh.position.z);
                obstacleGroup.add(stem);
            } else if (type === 'gap') {
                // A flat pure-black quad read as a smear on the grass rather than a hole.
                // Build a sunken pit instead: earth walls, a dark floor, and dirt rim lips
                // so the edges are legible and you can see it coming.
                const pit = new THREE.Group();
                const wallMat = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 1 });
                const floorMat = new THREE.MeshStandardMaterial({ color: 0x3d2614, roughness: 1 });
                const floor = new THREE.Mesh(new THREE.BoxGeometry(3, 0.3, 6), floorMat);
                floor.position.y = -2.2;
                pit.add(floor);
                for (const sx of [-1.5, 1.5]) {            // end walls
                    const w = new THREE.Mesh(new THREE.BoxGeometry(0.35, 2.3, 6), wallMat);
                    w.position.set(sx, -1.1, 0);
                    pit.add(w);
                }
                const back = new THREE.Mesh(new THREE.BoxGeometry(3, 2.3, 0.35), wallMat);
                back.position.set(0, -1.1, -2.9);
                pit.add(back);
                for (const sx of [-1.6, 1.6]) {            // raised dirt rims
                    const lip = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.3, 6),
                        new THREE.MeshStandardMaterial({ color: 0x8B5A2B, roughness: 1 }));
                    lip.position.set(sx, 0.12, 0);
                    pit.add(lip);
                }
                pit.position.set(x, groundY(x), 0);
                pit.userData.isGap = true;
                mesh = pit;
            } else if (type === 'boulder') {
                mesh = new THREE.Mesh(new THREE.SphereGeometry(1.2, 10, 8), new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.9 }));
                mesh.position.set(x, groundY(x) + 1.2, (rnd() - 0.5) * 3);
                mesh.userData.rolling = true;
                mesh.userData.rollDir = rnd() < 0.5 ? -1 : 1;
            }
            if (mesh) {
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData.type = type;
                obstacleGroup.add(mesh);
            }
        }

        const obstacleTypes = ['rock', 'log', 'branch', 'pipe', 'spike', 'mud', 'mushroom', 'gap', 'boulder'];
        let lastObstacleX = 5;
        // Racers start at x = 4..7. Obstacles used to begin at x = 10, so a rolling boulder
        // could sit on the start line and flatten half the field before anyone accelerated.
        // Give the pack a clean run-up, and keep boulders/pits out of the opening stretch.
        const FIRST_OBSTACLE_X = 38;
        for (let x = FIRST_OBSTACLE_X; x < TRACK_LENGTH - 15; x += 8 + rnd() * 6) {
            let type = obstacleTypes[Math.floor(rnd() * obstacleTypes.length)];
            if (x < 70 && (type === 'boulder' || type === 'gap')) type = 'rock';
            if ((type === 'branch' || type === 'pipe') && x - lastObstacleX < 10) x += 5;
            if (type === 'gap' && x - lastObstacleX < 12) x += 4;
            createObstacle(type, x);
            lastObstacleX = x;
        }

        // Crates
        for (let x = 15; x < TRACK_LENGTH - 10; x += 15 + rnd() * 10) {
            const crate = new THREE.Mesh(
                new THREE.BoxGeometry(1, 1, 1),
                new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0x442200 })
            );
            crate.position.set(x, groundY(x) + 1.0, (rnd() - 0.5) * 2);
            crate.castShadow = true;
            const questionMark = new THREE.Mesh(
                new THREE.SphereGeometry(0.3, 8, 8),
                new THREE.MeshStandardMaterial({ color: 0xffffff })
            );
            questionMark.position.y = 0.8;
            crate.add(questionMark);
            crate.userData.type = 'crate';
            crateGroup.add(crate);
        }

        // Dense roadside dressing
        const treeColors = [0x228B22, 0x2E8B57, 0x3CB371, 0x32CD32];
        for (let i = 0; i < 120; i++) {
            const x = rnd() * TRACK_LENGTH;
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3 + rnd() * 0.3, 0.4 + rnd() * 0.3, 1.5 + rnd() * 2, 6), new THREE.MeshStandardMaterial({ color: 0x8d5a3b }));
            trunk.position.y = 0.75 + rnd() * 1;
            tree.add(trunk);
            const canopy = new THREE.Mesh(new THREE.ConeGeometry(0.8 + rnd() * 0.8, 1.5 + rnd() * 1.5, 8), new THREE.MeshStandardMaterial({ color: treeColors[Math.floor(rnd() * treeColors.length)] }));
            canopy.position.y = 2 + rnd() * 1.5;
            tree.add(canopy);
            tree.position.set(x, groundY(x), -5 - rnd() * 8);
            tree.scale.set(0.8 + rnd() * 0.8, 0.8 + rnd() * 0.8, 0.8 + rnd() * 0.8);
            trackGroup.add(tree);
        }
        for (let i = 0; i < 80; i++) {
            const x = rnd() * TRACK_LENGTH;
            const bush = new THREE.Mesh(new THREE.SphereGeometry(0.4 + rnd() * 0.3, 6, 6), new THREE.MeshStandardMaterial({ color: treeColors[Math.floor(rnd() * treeColors.length)] }));
            bush.position.set(x, groundY(x) + 0.3, -3 - rnd() * 6);
            bush.scale.y = 0.6;
            trackGroup.add(bush);
        }
        const flowerColors = [0xff69b4, 0xff4500, 0xffd700, 0xff1493, 0xda70d6];
        for (let i = 0; i < 150; i++) {
            const x = rnd() * TRACK_LENGTH;
            const flower = new THREE.Mesh(
                new THREE.SphereGeometry(0.15 + rnd() * 0.1, 6, 6),
                new THREE.MeshStandardMaterial({ color: flowerColors[Math.floor(rnd() * flowerColors.length)] })
            );
            flower.position.set(x, groundY(x) + 0.2, (rnd() - 0.5) * 10);
            trackGroup.add(flower);
        }
        for (let i = 0; i < 60; i++) {
            const x = rnd() * TRACK_LENGTH;
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.3 + rnd() * 0.4), new THREE.MeshStandardMaterial({ color: 0x999999 }));
            rock.position.set(x, groundY(x) + 0.2, (rnd() - 0.5) * 8);
            rock.scale.y = 0.5;
            trackGroup.add(rock);
        }
        for (let x = 5; x < TRACK_LENGTH; x += 8) {
            const fence = new THREE.Mesh(
                new THREE.BoxGeometry(2, 0.8, 0.15),
                new THREE.MeshStandardMaterial({ color: 0xDEB887 })
            );
            fence.position.set(x, groundY(x) + 0.4, -5.5);
            trackGroup.add(fence);
        }
        for (let i = 0; i < 10; i++) {
            const x = 20 + i * 90;
            const sign = new THREE.Group();
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 2, 6), new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
            pole.position.y = 1;
            sign.add(pole);
            const board = new THREE.Mesh(new THREE.BoxGeometry(1, 0.6, 0.1), new THREE.MeshStandardMaterial({ color: 0xCCCCCC }));
            board.position.y = 1.8;
            sign.add(board);
            sign.position.set(x, groundY(x), -4.5);
            trackGroup.add(sign);
        }
        for (let i = 1; i < 9; i++) {
            const x = i * 100;
            const marker = new THREE.Group();
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2, 6), new THREE.MeshStandardMaterial({ color: 0x888888 }));
            pole.position.y = 1;
            marker.add(pole);
            const board = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.1), new THREE.MeshStandardMaterial({ color: 0xFFFFFF }));
            board.position.y = 2;
            marker.add(board);
            marker.position.set(x, groundY(x), -4);
            trackGroup.add(marker);
        }

        // Clouds (clustered puffs)
        const cloudGroup = new THREE.Group();
        scene.add(cloudGroup);
        for (let i = 0; i < 70; i++) {
            const cloud = new THREE.Group();
            const puffCount = 3 + Math.floor(rnd() * 4);
            for (let j = 0; j < puffCount; j++) {
                const puff = new THREE.Mesh(
                    new THREE.SphereGeometry(1 + rnd() * 1.5, 8, 8),
                    new THREE.MeshBasicMaterial({ color: 0xfdfeff, transparent: true, opacity: 0.92 })
                );
                puff.position.set(j * 1.5 - puffCount * 0.5, rnd() * 0.5, rnd() * 0.5);
                puff.scale.y = 0.5;
                cloud.add(puff);
            }
            cloud.position.set(rnd() * (TRACK_LENGTH + 80) - 40, 9 + rnd() * 8, -15 - rnd() * 25);
            cloud.scale.set(1 + rnd() * 1.5, 1, 1);
            cloudGroup.add(cloud);
        }

        // Parallax hills (3 ranks, progressively hazier)
        const hillGroup = new THREE.Group();
        scene.add(hillGroup);
        const hillColors = [new THREE.Color(0x2E8B57), new THREE.Color(0x66BB6A), new THREE.Color(0xA5D6A7)];
        const hillOpacities = [0.6, 0.4, 0.25];
        // These must stand UP facing the camera. Rotated flat (-PI/2) they were discs lying
        // on the ground, seen edge-on from a side camera and therefore invisible. They also
        // only spanned x -40..380 of a 900-unit track, so the back half had no backdrop.
        for (let d = 0; d < 3; d++) {
            const count = Math.ceil(TRACK_LENGTH / 55) + 4;
            for (let i = 0; i < count; i++) {
                const r = 26 + rnd() * 16;
                const hill = new THREE.Mesh(
                    new THREE.CircleGeometry(r, 20),
                    new THREE.MeshBasicMaterial({ color: hillColors[d], transparent: true,
                                                 opacity: hillOpacities[d], depthWrite: false })
                );
                // sink the centre below the horizon so only the crown shows above the grass
                hill.position.set(i * 55 - 60 + rnd() * 20,
                                  -r + 5 - d * 1.5,
                                  -30 - d * 18);
                hillGroup.add(hill);
            }
        }

        // Daily-seed: snapshot the generated track/layout so __DEBUG.worldHash() is stable
        // even as boulders roll and clouds drift during the race.
        (function(){
            const groups = [trackGroup, obstacleGroup, crateGroup, cloudGroup, hillGroup];
            for (const grp of groups) {
                grp.children.forEach(o => {
                    _worldSig.push(o.position.x, o.position.y, o.position.z, o.scale.x, o.scale.y, o.scale.z);
                    if (o.userData && o.userData.rollDir) _worldSig.push(o.userData.rollDir);
                });
            }
        })();
        // --- Projectiles ---
        const projectileGroup = new THREE.Group();
        scene.add(projectileGroup);

        // --- Particles ---
        const particleGroup = new THREE.Group();
        scene.add(particleGroup);

        function spawnDust(x, y, z, color = 0x8B7355) {
            const geo = new THREE.SphereGeometry(0.1, 4, 4);
            const mat = new THREE.MeshBasicMaterial({ color });
            for (let i = 0; i < 5; i++) {
                const p = new THREE.Mesh(geo, mat);
                p.position.set(x + (Math.random() - 0.5) * 0.5, y + 0.2, z + (Math.random() - 0.5) * 0.5);
                p.userData.vel = new THREE.Vector3((Math.random() - 0.5) * 2, Math.random() * 2, (Math.random() - 0.5) * 2);
                p.userData.life = 1;
                particleGroup.add(p);
            }
        }

        function spawnSpark(x, y, z) {
            const geo = new THREE.SphereGeometry(0.08, 4, 4);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            for (let i = 0; i < 8; i++) {
                const p = new THREE.Mesh(geo, mat);
                p.position.set(x, y, z);
                const angle = Math.random() * Math.PI * 2;
                p.userData.vel = new THREE.Vector3(Math.cos(angle) * 5, Math.random() * 5, Math.sin(angle) * 5);
                p.userData.life = 0.5;
                particleGroup.add(p);
            }
        }

        function spawnConfetti(x, y, z) {
            const geo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff];
            for (let i = 0; i < 30; i++) {
                const mat = new THREE.MeshBasicMaterial({ color: colors[Math.floor(Math.random() * colors.length)] });
                const p = new THREE.Mesh(geo, mat);
                p.position.set(x, y, z);
                p.userData.vel = new THREE.Vector3((Math.random() - 0.5) * 10, Math.random() * 8, (Math.random() - 0.5) * 10);
                p.userData.life = 2;
                p.userData.rot = new THREE.Vector3(Math.random() * 5, Math.random() * 5, Math.random() * 5);
                particleGroup.add(p);
            }
        }

        function spawnImpactPop(x, y, text) {
            // Cap concurrent pops. They self-remove after 700ms, but a hit that re-fires
            // every frame piled dozens of them onto the page at once.
            if (document.querySelectorAll('.impactPop').length >= 6) return;
            const el = document.createElement('div');
            el.className = 'impactPop';
            el.textContent = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 700);
        }

        // --- Power-ups ---
        const ITEM_TYPES = ['lightning', 'glove', 'saw', 'mine', 'boost', 'shield'];

        function randomItem() {
            return ITEM_TYPES[Math.floor(Math.random() * ITEM_TYPES.length)];
        }

        function useItem(racer) {
            if (!racer.item) return;
            const itemType = racer.item;
            racer.item = null;
            if (racer.isPlayer) item = null;
            playUse();
            if (racer.isPlayer) updateItemSlot();

            if (itemType === 'lightning') {
                racers.forEach(r => {
                    if (r.x > racer.x && !r.finished) {
                        r.stunTimer = 1.5;
                        spawnSpark(r.x, groundY(r.x) + 2, 0);
                        r.invulnTimer = 2.1;
                    }
                });
                screenShake = 0.5;
                hitStop = 0.07;
                playHit();
            } else if (itemType === 'glove') {
                const proj = new THREE.Mesh(
                    new THREE.SphereGeometry(0.4, 8, 8),
                    new THREE.MeshStandardMaterial({ color: 0xff0000 })
                );
                proj.position.set(racer.x + 2, groundY(racer.x) + 1, racer.zOffset);
                proj.userData.vel = new THREE.Vector3(25, 0, 0);
                proj.userData.type = 'glove';
                projectileGroup.add(proj);
            } else if (itemType === 'saw') {
                const proj = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.5, 0.5, 0.2, 16),
                    new THREE.MeshStandardMaterial({ color: 0xcccccc })
                );
                proj.position.set(racer.x + 2, groundY(racer.x) + 0.5, racer.zOffset);
                proj.userData.vel = new THREE.Vector3(20, 0, 0);
                proj.userData.type = 'saw';
                projectileGroup.add(proj);
            } else if (itemType === 'mine') {
                const mine = new THREE.Mesh(
                    new THREE.SphereGeometry(0.5, 8, 8),
                    new THREE.MeshStandardMaterial({ color: 0x333333 })
                );
                mine.position.set(racer.x - 1, groundY(racer.x) + 0.5, racer.zOffset);
                mine.userData.type = 'mine';
                projectileGroup.add(mine);
            } else if (itemType === 'boost') {
                racer.speedBoost = 5;
                screenShake = 0.3;
                spawnConfetti(racer.x, groundY(racer.x) + 2, 0);
            } else if (itemType === 'shield') {
                racer.shield = true;
            }
        }

        // --- AI logic ---
        function updateAI(racer, dt) {
            if (racer.finished || racer.stunTimer > 0) return;
            // Positive when this racer is behind the player: catch up. Negative when
            // ahead: ease off, so the pack stays together and the finish stays tense.
            racer.rubber = (player.x - racer.x) * 0.05;

            obstacleGroup.children.forEach(obs => {
                if (Math.abs(obs.position.x - racer.x) < 1.5 && Math.abs(obs.position.z) < 2) {
                    const type = obs.userData.type;
                    if (type === 'rock' || type === 'log' || type === 'spike' || type === 'mushroom' || type === 'boulder') {
                        if (racer.isGrounded) {
                            racer.vy = 8;
                            racer.isGrounded = false;
                            racer.canDoubleJump = true;
                            if (Math.random() < 0.05) {
                                racer.stunTimer = 0.5;
                                racer.invulnTimer = 1.1;
                            }
                        }
                    } else if (type === 'gap') {
                        if (racer.isGrounded && Math.abs(racer.x - obs.position.x) < 2) {
                            racer.vy = 9;
                            racer.isGrounded = false;
                            racer.canDoubleJump = true;
                        }
                    } else if (type === 'branch' || type === 'pipe') {
                        if (Math.random() < 0.9) {
                            racer.isSliding = true;
                            racer.slideTimer = 0.5;
                        } else {
                            racer.stunTimer = 0.8;
                            racer.invulnTimer = 1.4;
                        }
                    } else if (type === 'mud') {
                        racer.mudTimer = 1.2;
                    }
                }
            });

            if (racer.item && Math.random() < 0.02) {
                useItem(racer);
            }

            crateGroup.children.forEach(crate => {
                if (Math.abs(crate.position.x - racer.x) < 1.2 && !racer.item) {
                    racer.item = randomItem();
                    crateGroup.remove(crate);
                    playItem();
                    if (racer.isPlayer) updateItemSlot();
                }
            });
        }

        // --- Physics update ---
        function updateRacerPhysics(racer, dt) {
            if (racer.finished) return;
            if (racer.stunTimer > 0) {
                racer.stunTimer -= dt;
                racer.speed = 0;
                return;
            }
            if (racer.invulnTimer > 0) racer.invulnTimer -= dt;
            if (racer.mudTimer > 0) racer.mudTimer -= dt;
            const base = racer.baseSpeed || (racer.isPlayer ? PLAYER_SPEED : BASE_SPEED);
            racer.speed = Math.max(2, base * (racer.mudTimer > 0 ? 0.55 : 1)
                * (racer.speedBoost > 0 ? 1.6 : 1) + (racer.isPlayer ? 0 : (racer.rubber || 0)));

            if (!racer.isGrounded) {
                racer.vy -= 20 * dt;
                racer.y += racer.vy * dt;
                const groundAtX = groundY(racer.x);
                if (racer.y <= groundAtX) {
                    racer.y = groundAtX;
                    racer.isGrounded = true;
                    racer.canDoubleJump = true;
                    spawnDust(racer.x, racer.y, 0);
                    if (racer.isPlayer) playLand();
                }
            } else {
                racer.y = groundY(racer.x);
            }

            if (racer.isSliding) {
                racer.slideTimer -= dt;
                if (racer.slideTimer <= 0) racer.isSliding = false;
            }

            if (racer.speedBoost > 0) {
                racer.speedBoost -= dt;
                racer.x += racer.speedBoost * dt;
            }

            racer.x += racer.speed * dt;

            if (racer.x >= TRACK_LENGTH) {
                racer.x = TRACK_LENGTH;
                if (!racer.finished) {
                    racer.finished = true;
                    racer.finishTime = raceTime;
                    if (racer.isPlayer) {
                        finished = true;
                        playerPlace = racers.filter(r => r.finished && r.finishTime <= racer.finishTime).length;
                        showResult();
                        playFinish();
                        playCheer();
                        spawnConfetti(racer.x, racer.y + 2, 0);
                    }
                }
            }

            racer.mesh.position.x = racer.x;
            racer.mesh.position.y = racer.y;
            racer.mesh.position.z = racer.zOffset;

            const speedFactor = Math.min(racer.speed / PLAYER_SPEED, 1.5);
            const bob = racer.isGrounded ? Math.sin(racer.runPhase * 2) * 0.1 * speedFactor : 0;
            racer.mesh.position.y += bob;
            racer.mesh.rotation.x = 0;
            racer.mesh.rotation.z = racer.isGrounded ? -0.10 * speedFactor : -0.05;
            racer.mesh.rotation.z = racer.isSliding ? 0.3 : 0;

            if (racer.isGrounded && !racer.isSliding) {
                racer.runPhase += dt * 12 * speedFactor;
                racer.mesh.userData.limbs.forEach((limb, i) => {
                    const swing = Math.sin(racer.runPhase + i * Math.PI);
                    limb.rotation.z = swing * 0.95;
                    limb.children[1].rotation.z = -Math.max(0, -swing) * 0.9;
                });
                racer.mesh.userData.arms.forEach((arm, i) => {
                    arm.rotation.z = Math.sin(racer.runPhase + i * Math.PI + Math.PI) * 0.85;
                });
                racer.mesh.userData.tail.forEach(t => {
                    t.rotation.z = Math.sin(racer.runPhase * 0.8 - 0.9) * 0.35;
                });
                racer.mesh.userData.ears.forEach((ear, i) => {
                    ear.rotation.z = (ear.userData.baseRot || -0.10) + Math.sin(racer.runPhase * 0.8 - 1.2 + i * 0.4) * 0.26;
                });
            } else {
                racer.mesh.userData.limbs.forEach((limb, i) => {
                    limb.rotation.z = i === 0 ? 0.5 : -0.35;
                    limb.children[1].rotation.z = -0.5;
                });
                racer.mesh.userData.arms.forEach((arm, i) => { arm.rotation.z = i === 0 ? -0.9 : -0.6; });
            }

            if (racer.stunTimer > 0) {
                racer.mesh.rotation.z = Math.sin(racer.stunTimer * 10) * 0.2;
                racer.mesh.rotation.x = 0;
                racer.mesh.userData.limbs.forEach(limb => { limb.rotation.z = 0.5; limb.children[1].rotation.z = 0; });
                racer.mesh.userData.arms.forEach(arm => arm.rotation.z = -1.4);
                if (!racer.mesh.userData.starGroup) {
                    const starGroup = new THREE.Group();
                    for (let i = 0; i < 5; i++) {
                        const star = new THREE.Mesh(
                            new THREE.SphereGeometry(0.15, 4, 4),
                            new THREE.MeshBasicMaterial({ color: 0xffdd00 })
                        );
                        star.position.set(Math.cos(i * 1.256) * 0.8, 2.2, Math.sin(i * 1.256) * 0.8);
                        starGroup.add(star);
                    }
                    racer.mesh.userData.starGroup = starGroup;
                    racer.mesh.add(starGroup);
                }
                racer.mesh.userData.starGroup.rotation.y += dt * 3;
            } else if (racer.mesh.userData.starGroup) {
                racer.mesh.remove(racer.mesh.userData.starGroup);
                delete racer.mesh.userData.starGroup;
            }

            if (racer.mesh.userData.shadow) {
                racer.mesh.userData.shadow.position.y = 0.02;
            }
        }

        // --- Player input ---
        function handlePlayerInput(dt) {
            if (phase !== 'racing' || player.finished) return;
            // Single source of truth: player.stunTimer is decremented in
            // updateRacerPhysics. The old module-level stunTimer/invulnTimer pair shadowed
            // it and drifted out of sync.
            if (player.stunTimer > 0) return;

            if ((keys['Space'] || keys['KeyW'] || keys['ArrowUp'] || jumpBuffer > 0) && (player.isGrounded || coyoteTime > 0)) {
                player.vy = 9;
                player.isGrounded = false;
                player.canDoubleJump = true;
                jumpBuffer = 0;
                coyoteTime = 0;
                playJump();
                spawnDust(player.x, player.y, 0);
            } else if ((keys['Space'] || keys['KeyW'] || keys['ArrowUp'] || jumpBuffer > 0) && player.canDoubleJump) {
                player.vy = 8;
                player.canDoubleJump = false;
                jumpBuffer = 0;
                playJump();
                spawnDust(player.x, player.y, 0);
            }

            if (keys['KeyS'] || keys['ArrowDown']) {
                if (!player.isSliding) {
                    player.isSliding = true;
                    player.slideTimer = 0.5;
                }
            } else {
                player.isSliding = false;
            }

            if (keys['KeyF'] || keys['ShiftLeft'] || keys['ShiftRight']) {
                if (item) {
                    useItem(player);
                    keys['KeyF'] = false;
                    keys['ShiftLeft'] = false;
                    keys['ShiftRight'] = false;
                }
            }

            if (player.isGrounded) coyoteTime = 0.1;
            else coyoteTime -= dt;
            jumpBuffer -= dt;
        }

        // --- Camera ---
        function updateCamera() {
            const targetX = player.x + 3;
            const airLift = Math.max(0, player.y - groundY(player.x) - 2) * 0.5;
            const targetY = groundY(player.x) + 3.9 + airLift;
            camera.position.x += (targetX - camera.position.x) * 0.12;
            camera.position.y += (targetY - camera.position.y) * 0.12;
            camera.position.z = 26;
            camera.lookAt(camera.position.x, camera.position.y, 0);

            if (screenShake > 0) {
                camera.position.x += (Math.random() - 0.5) * screenShake * 2;
                camera.position.y += (Math.random() - 0.5) * screenShake * 2;
                screenShake *= 0.9;
            }
        }

        // --- HUD ---
        function updateHUD() {
            document.getElementById('position').textContent = playerPlace + ['st', 'nd', 'rd', 'th'][Math.min(playerPlace - 1, 3)];
            const progressBar = document.getElementById('progressBar');
            progressBar.innerHTML = '';
            racers.forEach(r => {
                const marker = document.createElement('div');
                marker.className = 'marker';
                marker.style.left = (r.x / TRACK_LENGTH * 100) + '%';
                marker.style.background = '#' + r.color.toString(16).padStart(6, '0');
                if (r.isPlayer) marker.style.borderColor = '#FFD700';
                progressBar.appendChild(marker);
            });
            document.getElementById('timer').textContent = raceTime.toFixed(1);
        }

        function updateItemSlot() {
            const slot = document.getElementById('itemSlot');
            if (item) {
                slot.style.display = 'flex';
                const icons = { lightning: '⚡', glove: '🥊', saw: '⚙️', mine: '💣', boost: '🔥', shield: '🛡️' };
                slot.textContent = icons[item] || '?';
            } else {
                slot.style.display = 'none';
            }
        }

        // --- Countdown ---
        function startCountdown() {
            phase = 'countdown';
            countdown = 3;
            countdownTimer = 0;
            playCountdown(3);
            const cd = document.getElementById('countdownDisplay');
            cd.style.display = 'block';
            cd.textContent = '3';
        }

        function updateCountdown(dt) {
            countdownTimer += dt;
            const cd = document.getElementById('countdownDisplay');
            if (countdownTimer >= 1) {
                countdown--;
                countdownTimer = 0;
                playCountdown(countdown);
                if (countdown < 0) {
                    phase = 'racing';
                    cd.style.display = 'none';
                    playCountdown(0);
                } else {
                    cd.textContent = countdown === 0 ? 'GO!' : countdown;
                }
            }
        }

        // --- Result ---
        function showResult() {
            phase = 'finished';
            document.getElementById('resultScreen').style.display = 'flex';
            const places = document.getElementById('resultPlaces');
            places.innerHTML = '';
            const finishers = racers.filter(r => r.finished)
                                    .sort((a, b) => a.finishTime - b.finishTime);
            const stillRacing = racers.filter(r => !r.finished).sort((a, b) => b.x - a.x);
            const sorted = [...finishers, ...stillRacing];
            const leadX = sorted[0] ? sorted[0].x : 0;
            sorted.forEach((r, i) => {
                const div = document.createElement('div');
                div.className = 'place';
                const result = r.finished
                    ? `${r.finishTime.toFixed(1)}s`
                    : `${Math.max(0, Math.round(leadX - r.x))}m behind`;
                div.textContent = `${i + 1}. ${r.name} - ${result}`;
                if (r.isPlayer) div.style.color = '#FFD700';
                places.appendChild(div);
            });
            playerPlace = sorted.findIndex(r => r.isPlayer) + 1;
            // updateHUD stops running once we leave the racing phase, so the position
            // readout kept showing the last in-race value behind the results card.
            const suffix = ['th', 'st', 'nd', 'rd'][playerPlace] || 'th';
            document.getElementById('position').textContent = playerPlace + suffix;
            if (playerPlace === 1) {
                document.getElementById('resultTitle').textContent = 'YOU WIN! 🏆';
                if (!bestTime || raceTime < bestTime) {
                    localStorage.setItem('critterBest', raceTime);
                    bestTime = raceTime;
                }
            } else {
                document.getElementById('resultTitle').textContent = `PLACE ${playerPlace}`;
            }
        }

        // --- Main loop ---
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            if (hitStop > 0) {
                hitStop -= dt;
                renderer.render(scene, camera);
                return;
            }

            // Iterate backwards over the live children array (no per-frame array-copy
            // allocation from a spread) and use addScaledVector (in-place) instead of
            // clone().multiplyScalar() (which allocated a new Vector3 per particle per
            // frame) - removing during a backward loop is safe without a copy.
            for (let i = particleGroup.children.length - 1; i >= 0; i--) {
                const p = particleGroup.children[i];
                p.userData.life -= dt;
                if (p.userData.vel) {
                    p.position.addScaledVector(p.userData.vel, dt);
                    p.userData.vel.y -= 9.8 * dt;
                }
                if (p.userData.life <= 0) particleGroup.remove(p);
            }

            for (let i = projectileGroup.children.length - 1; i >= 0; i--) {
                const proj = projectileGroup.children[i];
                if (proj.userData.vel) proj.position.addScaledVector(proj.userData.vel, dt);
                if (proj.position.x > TRACK_LENGTH + 5 || proj.position.x < -5) {
                    projectileGroup.remove(proj);
                    continue;
                }
                racers.forEach(r => {
                    if (r.finished || r.invulnTimer > 0) return;
                    if (Math.abs(proj.position.x - r.x) < 1.5 && Math.abs(proj.position.y - (r.y + 1)) < 2) {
                        if (proj.userData.type === 'glove' || proj.userData.type === 'saw') {
                            r.stunTimer = 1.5;
                            r.invulnTimer = 2.1;
                            r.x -= 5;
                            projectileGroup.remove(proj);
                            spawnSpark(proj.position.x, proj.position.y, 0);
                            screenShake = 0.5;
                            hitStop = 0.07;
                            playHit();
                            const v = new THREE.Vector3(proj.position.x, proj.position.y, 0).project(camera);
                            spawnImpactPop((v.x * 0.5 + 0.5) * window.innerWidth, (-v.y * 0.5 + 0.5) * window.innerHeight, ['BAM!','ZAP!','POW!','OOF!'][Math.floor(Math.random()*4)]);
                        } else if (proj.userData.type === 'mine') {
                            r.stunTimer = 1.5;
                            r.invulnTimer = 2.1;
                            r.vy = 10;
                            r.isGrounded = false;
                            projectileGroup.remove(proj);
                            spawnSpark(proj.position.x, proj.position.y, 0);
                            screenShake = 0.7;
                            hitStop = 0.1;
                            playHit();
                            const v = new THREE.Vector3(proj.position.x, proj.position.y, 0).project(camera);
                            spawnImpactPop((v.x * 0.5 + 0.5) * window.innerWidth, (-v.y * 0.5 + 0.5) * window.innerHeight, ['BAM!','ZAP!','POW!','OOF!'][Math.floor(Math.random()*4)]);
                        }
                    }
                });
            }

            // Rolling boulders
            obstacleGroup.children.forEach(obs => {
                if (obs.userData.rolling) {
                    obs.position.x += obs.userData.rollDir * 4 * dt;
                    obs.rotation.x += dt * 2;
                    if (obs.position.x < 0 || obs.position.x > TRACK_LENGTH) obs.userData.rollDir *= -1;
                    racers.forEach(r => {
                        if (Math.abs(obs.position.x - r.x) < 1.5 && Math.abs(obs.position.z - r.zOffset) < 2
                            && !r.finished && r.invulnTimer <= 0) {
                            r.stunTimer = 1.2;
                            r.invulnTimer = 2.0;   // MUST outlast the stun, or it re-fires forever
                            r.vy = 8;
                            r.isGrounded = false;
                            screenShake = 0.4;
                            playHit();
                            const v = new THREE.Vector3(obs.position.x, groundY(obs.position.x) + 1, 0).project(camera);
                            spawnImpactPop((v.x * 0.5 + 0.5) * window.innerWidth, (-v.y * 0.5 + 0.5) * window.innerHeight, 'OOF!');
                        }
                    });
                }
            });

            if (phase === 'racing') {
                raceTime += dt;
                handlePlayerInput(dt);
                racers.forEach(r => {
                    if (!r.isPlayer) updateAI(r, dt);
                    updateRacerPhysics(r, dt);
                });

                playerPlace = 1 + racers.filter(r => r.x > player.x && !r.finished).length;

                obstacleGroup.children.forEach(obs => {
                    if (Math.abs(obs.position.x - player.x) < 1.2 && Math.abs(obs.position.z) < 2
                        && player.y < groundY(player.x) + 1.5 && player.invulnTimer <= 0) {
                        const type = obs.userData.type;
                        if (type === 'rock' || type === 'log' || type === 'spike') {
                            if (player.isGrounded) {
                                player.stunTimer = 1;
                                player.invulnTimer = 1.7;
                                playHit();
                                spawnSpark(player.x, player.y + 1, 0);
                                const v = new THREE.Vector3(player.x, player.y + 1, 0).project(camera);
                                spawnImpactPop((v.x * 0.5 + 0.5) * window.innerWidth, (-v.y * 0.5 + 0.5) * window.innerHeight, 'OOF!');
                            }
                        } else if (type === 'branch' || type === 'pipe') {
                            if (!player.isSliding) {
                                player.stunTimer = 1;
                                player.invulnTimer = 1.7;
                                playHit();
                                spawnSpark(player.x, player.y + 2, 0);
                                const v = new THREE.Vector3(player.x, player.y + 2, 0).project(camera);
                                spawnImpactPop((v.x * 0.5 + 0.5) * window.innerWidth, (-v.y * 0.5 + 0.5) * window.innerHeight, 'OOF!');
                            }
                        } else if (type === 'mud') {
                            player.mudTimer = 1.2;
                        } else if (type === 'mushroom') {
                            if (player.isGrounded) {
                                player.vy = 14;
                                player.isGrounded = false;
                                player.canDoubleJump = true;
                                playJump();
                            }
                        } else if (type === 'gap') {
                            if (player.isGrounded && Math.abs(player.x - obs.position.x) < 1.5) {
                                player.vy = 9;
                                player.isGrounded = false;
                                player.canDoubleJump = true;
                            }
                        }
                    }
                });

                crateGroup.children.forEach(crate => {
                    if (Math.abs(crate.position.x - player.x) < 1.2 && !item) {
                        item = randomItem();
                        player.item = item;
                        crateGroup.remove(crate);
                        playItem();
                        updateItemSlot();
                    }
                });

                racers.forEach(r => {
                    if (r !== player && Math.abs(r.x - player.x) < 1.5 && Math.abs(r.y - player.y) < 1) {
                        if (r.x > player.x) player.x -= 1 * dt;
                        else player.x += 1 * dt;
                    }
                });

                updateHUD();
            } else if (phase === 'countdown') {
                updateCountdown(dt);
                racers.forEach(r => {
                    r.x += r.speed * dt * 0.1;
                    r.mesh.position.x = r.x;
                });
            }

            cloudGroup.children.forEach(c => c.position.x += dt * 0.5);

            updateCamera();

            // DOM name tags are projected from world space every frame. When racers bunch
            // (start line, rubber-banding, pile-ups) the projected anchors collide and the
            // badges cover each other. Place them in racer order and lift any badge that
            // would overlap one already placed this frame. Costs O(n^2) with n=4 -> at most
            // 16 comparisons, and reads no layout: badge sizes are cached on first show
            // (the text is static, so the size never changes).
            tagRects.length = 0;
            racers.forEach((r, i) => {
                const el = nameTagEls[i];
                if (phase !== 'racing' && phase !== 'countdown') { el.style.display = 'none'; return; }
                const pos = r.mesh.position.clone();
                pos.y += 3.7 * (r.mesh.scale.y || 1);
                pos.project(camera);
                if (pos.z > 1) { el.style.display = 'none'; return; }
                const x = (pos.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-pos.y * 0.5 + 0.5) * window.innerHeight;
                if (x < -80 || x > window.innerWidth + 80) { el.style.display = 'none'; return; }
                el.style.display = 'block';
                if (!el._hw) { el._hw = (el.offsetWidth || 44) / 2 + 2; el._h = (el.offsetHeight || 20) + 4; }
                const hw = el._hw, h = el._h;
                let lift = 0;
                for (let guard = 0; guard < racers.length; guard++) {
                    let hit = false;
                    for (let k = 0; k < tagRects.length; k++) {
                        const t = tagRects[k];
                        if (Math.abs(x - t.x) < hw + t.hw && (y - lift - h) < t.y && (y - lift) > t.y - t.h) { hit = true; break; }
                    }
                    if (!hit) break;
                    lift += h;
                }
                el.style.left = x + 'px';
                el.style.top = (y - lift) + 'px';
                if (lift > 0) { el.style.setProperty('--stem', lift + 'px'); el.classList.add('lifted'); }
                else { el.classList.remove('lifted'); }
                tagRects.push({ x: x, y: y - lift, hw: hw, h: h });
            });

            renderer.render(scene, camera);
        }

        // --- UI Events ---
        document.getElementById('playBtn').addEventListener('click', () => {
            initAudio();
            document.getElementById('titleScreen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('timer').style.display = 'block';
            document.getElementById('itemSlot').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'none';
            racers.forEach((r, i) => {
                r.x = 7 - i;
                r.y = groundY(r.x);
                r.vy = 0;
                r.finished = false;
                r.finishTime = 0;
                r.stunTimer = 0;
                r.invulnTimer = 0;
                r.item = null;
                r.baseSpeed = BASE_SPEED * (0.94 + Math.random() * 0.12) * (0.92 + r.skill * 0.18);
                r.rubber = 0;
                r.speed = r.baseSpeed;
                r.mudTimer = 0;
                r.mesh.position.set(r.x, r.y, r.zOffset);
            });
            player.speed = PLAYER_SPEED;
            player.baseSpeed = PLAYER_SPEED;
            player.mudTimer = 0;
            player.item = null;
            item = null;
            stunTimer = 0;
            invulnTimer = 0;
            raceTime = 0;
            finished = false;
            playerPlace = 1;
            updateItemSlot();
