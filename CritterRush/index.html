            startCountdown();
        });

        document.querySelectorAll('.charBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.charBtn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedChar = btn.dataset.char;
                const colors = { fox: 0xff6b35, rabbit: 0x9b59b6, cat: 0x2ecc71, bear: 0x8b4513 };
                player.mesh.children.forEach(child => {
                    if (child.material && child.material.color) {
                        child.material.color.setHex(colors[selectedChar] || 0xff6b35);
                    }
                });
            });
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('playBtn').click();
        });

        document.getElementById('muteBtn').addEventListener('click', () => {
            muted = !muted;
            document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
        });

        document.getElementById('itemSlot').addEventListener('click', () => {
            if (item) useItem(player);
        });

        document.getElementById('touchJump').addEventListener('touchstart', (e) => { e.preventDefault(); keys['Space'] = true; });
        document.getElementById('touchJump').addEventListener('touchend', (e) => { e.preventDefault(); keys['Space'] = false; });
        document.getElementById('touchSlide').addEventListener('touchstart', (e) => { e.preventDefault(); keys['KeyS'] = true; });
        document.getElementById('touchSlide').addEventListener('touchend', (e) => { e.preventDefault(); keys['KeyS'] = false; });
        document.getElementById('touchItem').addEventListener('touchstart', (e) => { e.preventDefault(); if (item) useItem(player); });

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') {
                jumpBuffer = 0.1;
                e.preventDefault();
            }
            if (phase === 'finished' && (e.code === 'Space' || e.code === 'Enter')) {
                document.getElementById('restartBtn').click();
            }
            if (e.code === 'Escape') {
                muted = !muted;
                document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
            }
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

        window.__DEBUG = {
            get scene() { return scene },
            get camera() { return camera },
            get renderer() { return renderer },
            get state() {
                return {
                    phase, raceTime, playerX: player.x, playerPlace, finished,
                    trackLength: TRACK_LENGTH, playerSpeed: player.speed, playerStun: player.stunTimer,
                    racers: racers.map(r => ({
                        name: r.name, x: r.x, speed: r.speed, stunned: r.stunTimer > 0, item: r.item, isPlayer: r.isPlayer
                    })),
                    obstacles: obstacleGroup.children.length,
                    crates: crateGroup.children.length,
                    projectiles: projectileGroup.children.length
                };
            },
            /* ---- daily-seed debug (DeepcutMine convention): prove the track is reproducible ---- */
            seedInfo() { return { urlSeed: URLSEED, seed: _seedVal }; },
            worldHash() {
                let h = 2166136261 >>> 0;
                const mix = x => { h ^= ((Math.round(x * 100) | 0) >>> 0); h = Math.imul(h, 16777619) >>> 0; };
                for (let i = 0; i < _worldSig.length; i++) mix(_worldSig[i]);
                return h;
            }
        };
    

    var SC_CFG={title:'CRITTER RUSH',sub:'Race to the finish \u00b7 dodge the pack',
      bg:'#0d2440',panel:'#15395c',accent:'#ffd700',ink:'#ffffff',dim:'#9ec6e8',
      gold:'#ff7a1a',file:'critterrush'};
    function scKick(){ var p=document.getElementById('position'); return 'FINISHED '+scText(p?p.textContent:''); }
    function scTtl(){ var t=document.getElementById('resultTitle'); return t?scText(t.textContent):'RACE OVER'; }
    function scStatRows(){
      var out=[],i;
      var t=document.getElementById('timer');
      if(t) out.push(['Time',scText(t.textContent)+'s']);
      var bt=null; try{ bt=localStorage.getItem('critterBest'); }catch(e){}
      if(bt!==null&&bt!==''){ var bv=parseFloat(bt);
        out.push(['Best time',(isFinite(bv)?bv.toFixed(1):bt)+'s']); }
      var ch=document.querySelector('.charBtn.selected');
      if(ch) out.push(['Character',scText(ch.getAttribute('data-char')||ch.getAttribute('aria-label')).toUpperCase()]);
      var pl=document.querySelectorAll('#resultPlaces .place');
      for(i=0;i<pl.length;i++){
        var s=scText(pl[i].textContent), m=s.match(/^(\d+)\.\s*(.+?)\s+-\s+(.+)$/);
        if(m) out.push(['P'+m[1]+' '+m[2].toUpperCase(),m[3]]);
        else if(s) out.push(['Racer '+(i+1),s]);
      }
      return out;
    }

    /* -- share card ------------------------------------------------------
       Additive: composites a plain 880x520 PNG from the SAME live DOM the
       result screen is already showing, so the card can never disagree with
       the run that produced it. Canvas 2D + toBlob only - no library, no
       network, no external font, no new localStorage key. */
    function scText(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim(); }
    function scNewBest(){
      if(SC_CFG.bestSel){ var e=document.querySelector(SC_CFG.bestSel);
        return !!e && /BEST/.test(e.textContent); }
      var n=document.getElementById('newbest');
      return !!n && getComputedStyle(n).display!=='none';
    }
    function scFont(g,weight,size,text,maxW,family){
      g.font=weight+' '+size+'px '+family;
      while(size>8&&g.measureText(text).width>maxW){ size-=1; g.font=weight+' '+size+'px '+family; }
      return size;
    }
    function scFmt(n){ return isFinite(+n)?(+n).toLocaleString('en-US'):String(n); }
    function shareCard(){
      try{
        var W=880,H=520,c=document.createElement('canvas');c.width=W;c.height=H;
        var g=c.getContext('2d'),C=SC_CFG;
        var DF="'Arial Black','Archivo Black',Impact,sans-serif";
        var TX="'Segoe UI',-apple-system,Roboto,Arial,sans-serif";
        var MO="ui-monospace,Consolas,'Courier New',monospace";
        var kick=scText(scKick())||'Run over';
        var ttl=scText(scTtl())||'Run Over';
        var nb=scNewBest();
        var rows=scStatRows();

        g.fillStyle=C.bg; g.fillRect(0,0,W,H);
        g.fillStyle=C.panel; g.fillRect(0,0,W,104);
        g.fillStyle=C.accent; g.fillRect(0,0,10,H);
        g.fillStyle=C.accent; g.fillRect(0,104,W,4);

        scFont(g,800,34,C.title,W-320,DF);
        g.fillStyle=C.accent; g.fillText(C.title,42,54);
        scFont(g,600,15,C.sub,W-320,TX);
        g.fillStyle=C.dim; g.fillText(C.sub,42,84);
        g.textAlign='right';
        g.font='700 13px '+DF; g.fillStyle=C.dim; g.fillText('SHARE CARD',W-42,54);
        g.textAlign='left';

        if(nb){
          g.textAlign='right';
          scFont(g,800,18,'\u2605 NEW BEST \u2605',240,DF);
          g.fillStyle=C.gold; g.fillText('\u2605 NEW BEST \u2605',W-42,166);
          g.textAlign='left';
        }
        scFont(g,700,20,kick,nb?540:760,DF);
        g.fillStyle=C.accent; g.fillText(kick,42,166);

        scFont(g,800,52,ttl,W-84,DF);
        g.fillStyle=C.ink; g.fillText(ttl,42,240);

        /* stats grid: two columns.  rowH is solved so the LAST value baseline
           plus its descenders always clears the 44px footer - the clipping bug
           found on the previous batch's 4-row-of-8 card. */
        var n=Math.min(rows.length,8);
        var nr=Math.max(1,Math.ceil(n/2));
        var footTop=H-44;
        var rowH=Math.min(48,Math.floor((footTop-8-30-300)/Math.max(1,nr-1)));
        if(!isFinite(rowH)||rowH>48)rowH=48;
        if(rowH<36)rowH=36;
        for(var i=0;i<n;i++){
          var col=i%2, rw=(i-col)/2;
          var x=42+col*418, y=300+rw*rowH;
          g.font='700 12px '+MO; g.fillStyle=C.dim;
          g.fillText(scText(rows[i][0]).toUpperCase(),x,y);
          scFont(g,800,22,String(rows[i][1]),386,MO);
          g.fillStyle=C.ink; g.fillText(String(rows[i][1]),x,y+24);
        }

        g.fillStyle=C.panel; g.fillRect(0,H-44,W,44);
        g.fillStyle=C.accent; g.fillRect(0,H-44,W,3);
        g.font='600 13px '+TX; g.fillStyle=C.dim;
        g.fillText(new Date().toLocaleDateString(),42,H-16);
        g.textAlign='right'; g.font='700 13px '+DF; g.fillStyle=C.accent;
        g.fillText('PROSTON WORKS \u00b7 '+C.title,W-42,H-16);
        g.textAlign='left';

        c.toBlob(function(b){
          if(!b)return;
          var u=URL.createObjectURL(b),a=document.createElement('a');
          a.href=u; a.download=C.file+'-card.png';
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(function(){URL.revokeObjectURL(u);},2000);
        },'image/png');
      }catch(e){}
    }
    window.__shareCard=shareCard;
    (function(){ var b=document.getElementById('btnShare');
      if(b)b.addEventListener('click',shareCard); })();
    </script>
