  while (spots.flat().length < 620 && tries++ < 20000) { const x = -70 + rng() * 96, z = -95 + rng() * 110; if (!free(x, z)) continue; const hill = H(x, z) > 4; if (!hill && rng() < 0.72 && x > -22) continue; const conif = hill || x < -30; const k = conif ? (rng() < 0.6 ? 4 : rng() < 0.6 ? 5 : rng() < 0.5 ? 0 : 3) : [0, 1, 2, 3, 6][Math.floor(rng() * 5)]; spots[k].push(place(x, z, rng() * 6.28, 0.8 + rng() * 0.6)); }
  for (let i = 0; i < 6; i++) for (let j = 0; j < 2; j++) spots[1].push(place(-2 + i * 3.6, 16.5 + j * 2.4, rng() * 6.28, 0.7 + rng() * 0.15));                      // front orchard row
  species.forEach((s, i) => { if (spots[i].length) instances(T[i], spots[i], { jitter: 0.32, hue: 0.06 }); }); info.trees = spots.flat().length;
  const scat = async (name, o, n, area, sc = [0.8, 1.3]) => { const p = await L(name, o), m = []; let t = 0; while (m.length < n && t++ < n * 30) { const x = area[0] + rng() * (area[1] - area[0]), z = area[2] + rng() * (area[3] - area[2]); if (!free(x, z) || H(x, z) < 0.5) continue; m.push(place(x, z, rng() * 6.28, sc[0] + rng() * (sc[1] - sc[0]))); } instances(p, m, { jitter: 0.3, hue: 0.05, castShadow: false }); return m.length; };
  info.bushes += await scat('plant_bushLarge', { h: 1.2 }, 90, [-40, 30, -40, 22]) + await scat('plant_bushDetailed', { h: 1.0 }, 80, [-40, 30, -40, 22]) + await scat('plant_bush', { h: 0.8 }, 60, [-40, 30, -40, 22]);
  await scat('flower_redA', { h: 0.5, key: 'fr' }, 90, [-26, 26, -12, 20], [0.8, 1.4]); await scat('flower_yellowA', { h: 0.5, key: 'fy' }, 90, [-26, 26, -12, 20], [0.8, 1.4]); await scat('flower_purpleA', { h: 0.5, key: 'fp' }, 70, [-26, 26, -12, 20], [0.8, 1.4]);
  await scat('grass_large', { h: 0.5 }, 260, [-30, 30, -24, 22], [0.9, 1.6]); await scat('rock_largeA', { h: 1.0 }, 14, [-40, 26, -30, 10], [0.7, 1.7]); await scat('rock_smallA', { h: 0.5 }, 24, [-40, 26, -30, 10], [0.7, 1.5]);
  /* crop rows: rows follow the furrows in the ground shader (every 0.91 m along z), plants every 0.5 m along x */
  const crops = { wheat: await L('crops_wheatStageB', { h: 0.95, key: 'wheat' }), corn: await L('crops_cornStageD', { h: 1.9, key: 'corn' }), pumpkin: await L('crop_pumpkin', { h: 0.55, key: 'pumpkin' }), melon: await L('crop_melon', { h: 0.55, key: 'melon' }), turnip: await L('crop_turnip', { h: 0.5, key: 'turnip' }) };
  for (const f of FIELDS) { const kinds = f.kind === 'veg' ? ['pumpkin', 'melon', 'turnip'] : [f.kind], mats = kinds.map(() => []); const row0 = Math.ceil((f.z0 + 0.5) / 0.91) * 0.91; let r = 0;
    for (let z = row0; z < f.z1 - 0.3; z += 0.91, r++) for (let x = f.x0 + 0.5; x < f.x1 - 0.3; x += f.kind === 'corn' ? 0.55 : f.kind === 'veg' ? 1.0 : 0.42) mats[f.kind === 'veg' ? r % 3 : 0].push(place(x + (rng() - 0.5) * 0.12, z + (rng() - 0.5) * 0.08, rng() * 6.28, 0.9 + rng() * 0.3));
    kinds.forEach((k, i) => { info.crops += mats[i].length; instances(crops[k], mats[i], { jitter: 0.35, hue: 0.03, castShadow: f.kind !== 'wheat' }); }); }
  /* fences around the fields and yard */
  const fence = await L('fence_planks', { w: 1.0, key: 'fence' }), fm = []; for (let x = -25; x < 23; x += 1.0) { fm.push(place(x, 2.2, 0, 1)); fm.push(place(x, 14.2, 0, 1)); } for (let z = 2.2; z < 14; z += 1.0) { fm.push(place(-25.5, z, Math.PI / 2, 1)); fm.push(place(23.5, z, Math.PI / 2, 1)); } instances(fence, fm, { jitter: 0.1, castShadow: true });
}

/* ---------- Camera, frame loop, stats ---------- */
const CAMS = [{ p: [25, 25, 31], t: [1, 1.5, -13], fov: 47 }, { p: [30, 19, 38], t: [-2, 3, -18], fov: 38 }];
const cam = CAMS[+opt('cam', 0) % 2];
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 0.9 ? cam.fov : cam.fov * 0.62; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let T = STILL ? 4 : 0, last = performance.now(), running = true, frames = 0;
function frame(now) {
  if (!running) return; requestAnimationFrame(frame); const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!STILL) T += dt;
  waterMat.uniforms.uT.value = T; skyMat.uniforms.uT.value = T; const a = STILL ? 0 : Math.sin(T * 0.15) * 0.06; camera.position.set(cam.p[0] + a * 30, cam.p[1], cam.p[2]); camera.lookAt(cam.t[0], cam.t[1], cam.t[2]);
  renderer.render(scene, camera); if (++frames === 3 && window.__built) publish();
}
function publish() { const i = renderer.info, g = renderer.getContext(); window.__stats = { calls: i.render.calls, triangles: i.render.triangles, geometries: i.memory.geometries, textures: i.memory.textures, programs: i.programs.length, dpr, canvas: [canvas.width, canvas.height], tone: TMKEY, shadow: SHADOW, foliage: FOLIAGE, loadMs: Math.round(performance.now() - T0), texMBest: +(TEXB.n / 1048576).toFixed(1), info, shaderErrors, renderer: 'n/a' }; window.__ready = true; }
window.__draws = () => { const g = renderer.getContext(), names = ['drawElements', 'drawArrays', 'drawElementsInstanced', 'drawArraysInstanced'], orig = {}; let n = 0; names.forEach(k => { orig[k] = g[k]; g[k] = function () { n++; return orig[k].apply(this, arguments); }; }); renderer.render(scene, camera); names.forEach(k => (g[k] = orig[k])); return n; };
window.__frameStats = () => { renderer.render(scene, camera); const g = renderer.getContext(), w = canvas.width, h = canvas.height, b = new Uint8Array(w * h * 4); g.readPixels(0, 0, w, h, g.RGBA, g.UNSIGNED_BYTE, b);
  let n = 0, L = 0, S = 0, dark = 0, white = 0, gr = 0; for (let y = 0; y < h; y += 6) for (let x = 0; x < w; x += 6) { const k = (y * w + x) * 4, r = b[k] / 255, gg = b[k + 1] / 255, bl = b[k + 2] / 255, mx = Math.max(r, gg, bl), mn = Math.min(r, gg, bl); n++; L += 0.2126 * r + 0.7152 * gg + 0.0722 * bl; S += mx ? (mx - mn) / mx : 0; if (mx < 0.1) dark++; if (mn > 0.97) white++; if (gg > r * 1.08 && gg > bl * 1.15) gr++; }
  return { meanLuma: +(L / n).toFixed(3), meanSat: +(S / n).toFixed(3), darkShare: +(dark / n).toFixed(3), whiteShare: +(white / n).toFixed(3), greenShare: +(gr / n).toFixed(3) }; };
window.__horizon = () => { const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize(); const p = camera.position.clone().addScaledVector(fwd, 5000); p.y = camera.position.y; p.project(camera); const saved = scene.children.map(c => [c, c.visible]); scene.children.forEach(c => { if (c !== sky) c.visible = false; });
  renderer.render(scene, camera); const g = renderer.getContext(), b = new Uint8Array(4); g.readPixels(Math.round((p.x + 1) / 2 * (canvas.width - 1)), Math.round((p.y + 1) / 2 * (canvas.height - 1)), 1, 1, g.RGBA, g.UNSIGNED_BYTE, b); saved.forEach(([c, v]) => (c.visible = v));
  const f = HORIZON.getHex(THREE.SRGBColorSpace); return { sky: Array.from(b.slice(0, 3)), fog: [(f >> 16) & 255, (f >> 8) & 255, f & 255] }; };
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); running = false; }); canvas.addEventListener('webglcontextrestored', () => { running = true; last = performance.now(); requestAnimationFrame(frame); });
document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running) { last = performance.now(); requestAnimationFrame(frame); } });

/* ---------- 9. UI icons rendered from the game's own crop models (offscreen render target -> <img>) ---------- */
async function icons() {
  const rt = new THREE.WebGLRenderTarget(160, 160, { samples: 4 }); rt.texture.colorSpace = THREE.SRGBColorSpace; const sc = new THREE.Scene(), ca = new THREE.PerspectiveCamera(28, 1, 0.1, 50), out = {};
  sc.add(new THREE.HemisphereLight('#ffffff', '#8a7a5a', 1.6)); const d = new THREE.DirectionalLight('#fff0d0', 2.6); d.position.set(3, 5, 4); sc.add(d);
  const list = [['wheat', 'crops_wheatStageB', 'Wheat', '12'], ['corn', 'crops_cornStageD', 'Corn', '20'], ['pumpkin', 'crop_pumpkin', 'Pumpkin', '35'], ['carrot', 'crop_carrot', 'Carrot', '15'], ['melon', 'crop_melon', 'Melon', '40'], ['turnip', 'crop_turnip', 'Turnip', '18']];
  const cards = document.getElementById('cards'); const cv = document.createElement('canvas'); cv.width = cv.height = 160; const cx = cv.getContext('2d'), buf = new Uint8Array(160 * 160 * 4);
  for (const [k, file, label, price] of list) { const parts = await kit(file, { h: 1, key: 'ic_' + k }), g = new THREE.Group(); parts.forEach(p => { const m = new THREE.Mesh(p.geometry, p.material.clone()); m.material.vertexColors = false; m.material.onBeforeCompile = () => {}; g.add(m); }); g.rotation.y = -0.5; sc.add(g);
    const bb = new THREE.Box3().setFromObject(g), c = bb.getCenter(new THREE.Vector3()), r = bb.getSize(new THREE.Vector3()).length(); ca.position.set(c.x + r * 0.8, c.y + r * 0.7, c.z + r * 1.5); ca.lookAt(c);

  renderer.setClearColor(0x000000, 1); rt.dispose(); window.__icons = list.length;
}

await build(); window.__built = true; if (UI === 'sheet') await icons().catch(e => console.warn('icons', e.message)); requestAnimationFrame(frame);
