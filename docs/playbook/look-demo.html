{ const list = [], cols = ['#e9b93a', '#f4cf55', '#dba62e']; for (let r = 0; r < 12; r++) for (let c = 0; c < 34; c++) list.push([-4.8 + c * 0.25 + (r % 2) * 0.1, 0.02, 3.9 + r * 0.42 + (nz(c, r) - 0.5) * 0.06, nz(r, c) * 6, 0.85 + nz(c * 3, r * 3) * 0.35]);

    if (FOOT.some(([fx, fz, fr]) => Math.hypot(x - fx, z - fz) < fr + 0.4) || Math.abs(z - (2.5 + Math.sin(x * 0.35) * 1.4)) < 1.2 && x > -12 && x < 12 || (x > -5 && x < 5 && z > 3.5 && z < 9.8)) continue; if (r < 22) list.push([x, 0.01, z, Math.random() * 6.28, 0.7 + Math.random() * 0.8]); else if (Math.random() < 0.35) list.push([x, Math.max(0, THREE.MathUtils.smoothstep(Math.hypot(x, z), 20, 46) * (nz(x * 0.05, z * 0.05) * 9 - 2)), z, Math.random() * 6.28, 1.1]); }
  const gm = inst(clump(0.5), bladeMat(0.5, 0.66), list, ['#6cb83a', '#88cc48', '#5aa63a', '#9bd852']); gm.castShadow = gm.receiveShadow = false; }

/* ---------- 10. Water: fragment-only ripples + sparkle + foam ring; includes the tone-map and fog chunks ---------- */
const water = new THREE.Mesh(new THREE.CircleGeometry(3.9, 48), new THREE.ShaderMaterial({ transparent: true, depthWrite: false, fog: true,
  uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uTime: WIND.uTime, uA: { value: new THREE.Color(PAL.water1) }, uB: { value: new THREE.Color(PAL.water2) } }]),

water.rotation.x = -Math.PI / 2; water.position.set(7, 0.04, 4); water.renderOrder = 2; scene.add(water);

/* ---------- 11. Particles from one sprite atlas: one draw call, four shapes ---------- */
const atlas = (() => { const s = 128, cv = Object.assign(document.createElement('canvas'), { width: s, height: s }), x = cv.getContext('2d'); x.fillStyle = '#fff';
  x.beginPath(); x.arc(32, 32, 24, 0, 6.283); x.fill(); const g = x.createRadialGradient(96, 32, 0, 96, 32, 28); g.addColorStop(0, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(64, 0, 64, 64); x.fillStyle = '#fff';
  x.beginPath(); for (let i = 0; i < 8; i++) { const a = i * 0.7854, r = i % 2 ? 9 : 27; x.lineTo(32 + Math.cos(a) * r, 96 + Math.sin(a) * r); } x.fill();

const psr = renderer.getContext().getParameter(renderer.getContext().ALIASED_POINT_SIZE_RANGE), N = 140, pp = new Float32Array(N * 3), pc = new Float32Array(N), ph = new Float32Array(N);
for (let i = 0; i < N; i++) { pp.set([-4 + Math.random() * 9, 0.4 + Math.random() * 2.2, 3.5 + Math.random() * 5], i * 3); pc[i] = i % 4; ph[i] = Math.random() * 6.28; }
const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pp, 3)); pg.setAttribute('aCell', new THREE.BufferAttribute(pc, 1)); pg.setAttribute('aPh', new THREE.BufferAttribute(ph, 1));
const parts = new THREE.Points(pg, new THREE.ShaderMaterial({ transparent: true, depthWrite: false, fog: true,
  uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uTime: WIND.uTime, uTex: { value: atlas }, uPx: { value: dpr }, uMax: { value: Math.min(psr[1], 96) } }]),
  vertexShader: `attribute float aCell, aPh; uniform float uTime, uPx, uMax; varying float vCell; varying float vA;
    #include <fog_pars_vertex>
    void main(){ vec3 p = position; p.y += mod(uTime*0.35 + aPh, 2.6) ; p.x += sin(uTime*0.8 + aPh*3.0)*0.5; vCell = aCell; vA = sin(3.14159*mod(uTime*0.35 + aPh, 2.6)/2.6);
      vec4 mvPosition = modelViewMatrix*vec4(p,1.0); gl_Position = projectionMatrix*mvPosition; gl_PointSize = min(uMax, 0.55*uPx*300.0/(-mvPosition.z));
      #include <fog_vertex>

  fragmentShader: `uniform sampler2D uTex; varying float vCell; varying float vA;

    void main(){ float col = mod(vCell,2.0), row = floor(vCell/2.0); vec2 pc = gl_PointCoord; vec4 t = texture2D(uTex, vec2((col+pc.x)*0.5, 1.0-(row+pc.y)*0.5));

      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      #include <fog_fragment>
    }` }));
parts.frustumCulled = false; scene.add(parts);

/* ---------- 12. Cheap glow: additive halo sprite for the sun and soft cloud puffs (toneMapped:false keeps white white) ---------- */
const soft = (stops) => { const s = 128, cv = Object.assign(document.createElement('canvas'), { width: s, height: s }), x = cv.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64); stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, s, s); const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t; };
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: soft([[0, 'rgba(255,244,200,.95)'], [0.25, 'rgba(255,230,150,.35)'], [1, 'rgba(255,220,120,0)']]), blending: THREE.AdditiveBlending, depthWrite: false, fog: false, toneMapped: false }));
halo.position.copy(sky.material.uniforms.uSun.value).multiplyScalar(250); halo.scale.setScalar(120); scene.add(halo);
const puff = soft([[0, 'rgba(255,255,255,1)'], [0.6, 'rgba(255,255,255,.85)'], [1, 'rgba(255,255,255,0)']]), clouds = [];
[[-70, 46, -120], [40, 55, -140], [110, 40, -90], [-120, 60, -40]].forEach(([x, y, z], i) => { for (let k = 0; k < 4; k++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: puff, depthWrite: false, fog: false, toneMapped: false, opacity: 0.95 })); s.position.set(x + k * 14 - 20, y + (k % 2) * 3, z); s.scale.set(34 - k * 3, 14, 1); scene.add(s); clouds.push(s); } });

/* ---------- Frame loop, resize, context loss ---------- */
let lastT = performance.now(), T = STILL ? 3.2 : 0, running = true, frames = 0;
function resize() { const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); OU.uRes.value.set(renderer.domElement.width, renderer.domElement.height); OU.uPx.value = 2.2 * dpr; camera.aspect = w / h; camera.fov = w / h < 0.8 ? 46 : 38; camera.updateProjectionMatrix(); }

const CAMS = [[0.55, 27, 11], [1.9, 24, 9], [-0.6, 30, 13], [3.4, 26, 10]], ci = +opt('cam', 0) % 4;

  let n = 0, L = 0, S = 0, dark = 0, white = 0; for (let y = 0; y < h; y += 6) for (let x = 0; x < w; x += 6) { const k = (y * w + x) * 4, r = b[k] / 255, g = b[k + 1] / 255, bl = b[k + 2] / 255, mx = Math.max(r, g, bl), mn = Math.min(r, g, bl); n++; L += 0.2126 * r + 0.7152 * g + 0.0722 * bl; S += mx ? (mx - mn) / mx : 0; if (mx < 0.12) dark++; if (mn > 0.97) white++; }
  return { meanLuma: +(L / n).toFixed(3), meanSat: +(S / n).toFixed(3), darkShare: +(dark / n).toFixed(3), whiteShare: +(white / n).toFixed(3) }; };
window.__strip = (nx, y0, y1, n) => { renderer.render(scene, camera); const gl = renderer.getContext(), out = [], b = new Uint8Array(4); for (let i = 0; i < n; i++) { const ny = y0 + (y1 - y0) * i / (n - 1); gl.readPixels(Math.round(nx * (canvas.width - 1)), Math.round((1 - ny) * (canvas.height - 1)), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b); out.push([ny, b[0], b[1], b[2]]); } return out; };
window.__draws = () => { const gl = renderer.getContext(), names = ['drawElements', 'drawArrays', 'drawElementsInstanced', 'drawArraysInstanced'], orig = {}; let n = 0;
  names.forEach(k => { orig[k] = gl[k]; gl[k] = function () { n++; return orig[k].apply(this, arguments); }; }); renderer.render(scene, camera); names.forEach(k => (gl[k] = orig[k])); return n; };
window.__horizon = () => { const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize(); const p = camera.position.clone().addScaledVector(fwd, 5000); p.y = camera.position.y; p.project(camera);
  const saved = scene.children.map(c => [c, c.visible]); scene.children.forEach(c => { if (c !== sky) c.visible = false; }); const px = window.__pixel((p.x + 1) / 2, 1 - (p.y + 1) / 2); saved.forEach(([c, v]) => (c.visible = v));
  const f = new THREE.Color(horizon).getHex(THREE.SRGBColorSpace), fog = [(f >> 16) & 255, (f >> 8) & 255, f & 255]; return { sky: px, fog, maxDelta: Math.max(...px.map((v, i) => Math.abs(v - fog[i]))) }; };
window.__renderNow = () => renderer.render(scene, camera);
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); running = false; document.getElementById('lost').style.display = 'grid'; window.__ctx = 'lost'; });
canvas.addEventListener('webglcontextrestored', () => { window.__ctx = 'restored'; document.getElementById('lost').style.display = 'none'; running = true; lastT = performance.now(); requestAnimationFrame(frame); });
document.getElementById('lost').addEventListener('click', () => document.getElementById('lost').style.display = 'none');
window.__lose = () => { const x = renderer.getContext().getExtension('WEBGL_lose_context'); if (!x) return false; window.__lc = x; x.loseContext(); return true; };
window.__restore = () => { window.__lc && window.__lc.restoreContext(); };
document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running) { lastT = performance.now(); requestAnimationFrame(frame); } });

/* HUD taps use the FEEL kit: squash the button, fly coins to the counter, pop a number */
const go = document.getElementById('go'), coinN = document.getElementById('coinN'); let coins = 1240;
go.addEventListener('click', () => { const r = go.getBoundingClientRect(), n = 6, sp = new Feel.Spring(); sp.punch(-0.18); let t0 = performance.now();
  (function s(now) { const x = sp.update(Math.min(0.033, (now - t0) / 1000)); t0 = now; const q = Feel.squashScale(x); go.style.transform = `scale(${q.sx.toFixed(3)},${q.sy.toFixed(3)})`; if (Math.abs(sp.x) > 0.002) requestAnimationFrame(s); else go.style.transform = ''; })(t0);
  Feel.Haptics.tap(10); Feel.popNumber(document.body, r.left + r.width / 2, r.top - 10, '+' + n * 5, { size: 34, color: '#ffe36b' });
  Feel.flyCoins(document.body, { x: r.left + r.width / 2, y: r.top }, document.getElementById('coins'), n, { onLand: () => { coins += 5; coinN.textContent = coins.toLocaleString('en-US'); document.getElementById('coins').animate([{ transform: 'scale(1.18)' }, { transform: 'scale(1)' }], 140); } }); });
if (opt('lose', '0') === '1') setTimeout(() => { window.__lose(); setTimeout(window.__restore, 600); }, 1200);
requestAnimationFrame(frame);
</script>
