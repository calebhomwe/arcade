<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../assets/arcade-sdk.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snap Jigsaw - Daily Puzzle Challenge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            overflow: hidden;
            touch-action: none;
            font-family: 'Arial Black', sans-serif;
            color: #fff;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
        }
        [hidden] { display: none !important; }
        /* screens drawn in the Foundation UIKit look: navy panels, white borders, green / orange / blue buttons */
        .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; overflow: auto; }
        .screen.dim { background: rgba(0,0,0,0.7); }
        .panel { width: min(440px, 100%); background: #2a2a4e; border: 4px solid #4a4a8e; border-radius: 20px; padding: 20px; text-align: center; margin: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
        .panel.clear { background: rgba(26,26,46,.72); }
        h1 { color: #FFD700; font-size: clamp(34px, 9vw, 52px); line-height: 1; letter-spacing: 1px; text-shadow: 0 4px 0 #6b5a00, 0 10px 30px rgba(0,0,0,.6); }
        h2 { color: #FFD700; font-size: 30px; }
        .sub { color: #cfd6ff; font-family: Arial, sans-serif; font-weight: 700; font-size: 14px; margin: 8px 0 16px; }
        .btn { display: block; width: 100%; min-height: 48px; margin: 8px 0; border: 3px solid #fff; border-radius: 10px; background: #4CAF50; color: #fff; font: 20px 'Arial Black', sans-serif; cursor: pointer; }
        .btn.o { background: #FF9800; }
        .btn.b { background: #2196F3; }
        .btn.g { background: #1a1a2e; border-color: #4a4a8e; color: #cfd6ff; font-size: 16px; }
        .btn:focus-visible, .chip:focus-visible, .lv:focus-visible, #bar button:focus-visible { outline: 3px solid #FFD700; outline-offset: 2px; }
        .row { display: flex; gap: 8px; }
        .row > * { flex: 1; }
        .chip { min-height: 44px; border: 3px solid #4a4a8e; border-radius: 10px; background: #1a1a2e; color: #cfd6ff; font: 14px 'Arial Black', sans-serif; cursor: pointer; }
        .chip.on { background: #FFD700; border-color: #fff; color: #1a1a2e; }
        .label { color: #8f96c8; font-family: Arial, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 2px; margin: 14px 0 6px; text-align: left; }
        .stats { color: #cfd6ff; font-family: Arial, sans-serif; font-weight: 700; font-size: 13px; margin-top: 12px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .lv { min-height: 64px; border: 3px solid #fff; border-radius: 10px; background: #2196F3; color: #fff; font: 18px 'Arial Black', sans-serif; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .lv small { font-size: 12px; color: #FFD700; letter-spacing: 1px; }
        .lv.done { background: #4CAF50; }
        .lv:disabled { background: #1a1a2e; border-color: #4a4a8e; color: #5d6390; cursor: not-allowed; }
        .stars { color: #FFD700; font-size: 44px; letter-spacing: 6px; margin: 4px 0; }
        .res { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
        .res div { background: #1a1a2e; border: 2px solid #4a4a8e; border-radius: 10px; padding: 8px 4px; }
        .res b { display: block; font-size: 20px; }
        .res span { font-family: Arial, sans-serif; font-weight: 700; font-size: 12px; color: #8f96c8; letter-spacing: 1px; }
        .note { font-family: Arial, sans-serif; font-weight: 700; font-size: 13px; color: #cfd6ff; margin: 6px 0; }
        #bar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 10px; z-index: 5; }
        #bar button { min-width: 120px; min-height: 48px; border: 3px solid #fff; border-radius: 10px; font: 16px 'Arial Black', sans-serif; color: #fff; cursor: pointer; background: #FF9800; }
        #bar #undoBtn { background: #2196F3; }
        #bar button:disabled { background: #1a1a2e; border-color: #4a4a8e; color: #5d6390; cursor: default; }
        #codesOn { position: fixed; left: 12px; top: 58px; z-index: 6; background: #FF9800; color: #fff; border: 2px solid #fff; border-radius: 8px; padding: 4px 8px; font-size: 12px; letter-spacing: 1px; }
        #toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 6; max-width: calc(100vw - 32px); background: #2a2a4e; border: 3px solid #FFD700; border-radius: 12px; padding: 10px 14px; font: 700 14px Arial, sans-serif; color: #fff; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s; }
        #toast.on { opacity: 1; }
        #coach { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
        #coach .spot { position: fixed; border: 4px solid #FFD700; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(0,0,0,.55); transition: all .25s; }
        #coach .panel { position: fixed; left: 50%; transform: translateX(-50%); width: min(420px, calc(100vw - 32px)); pointer-events: auto; padding: 14px 16px; }
        #coach .k { color: #FF9800; font-size: 13px; letter-spacing: 2px; }
        #coach p { font: 700 16px/1.4 Arial, sans-serif; margin: 6px 0 10px; }
        #coach .btn { font-size: 16px; min-height: 44px; margin: 0; }
        @media (prefers-reduced-motion: reduce) { #coach .spot, #toast { transition: none; } }
    </style>
</head>
<body>
    <div id="loading">Loading...</div>
    <canvas id="gameCanvas"></canvas>
    <div id="codesOn" hidden>CODES ON</div>
    <div id="bar" hidden><button id="hintBtn" type="button">HINT</button><button id="undoBtn" type="button">UNDO</button></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <div id="title" class="screen" hidden><div class="panel clear">
        <h1>SNAP<br>JIGSAW</h1>
        <p class="sub">Daily Puzzle Challenge</p>
        <button class="btn" id="playBtn" type="button">PLAY</button>
        <button class="btn o" id="dailyBtn" type="button">DAILY PUZZLE</button>
        <div class="row"><button class="btn b" id="levelsBtn" type="button">LEVELS</button><button class="btn g" id="howBtn" type="button">HOW TO PLAY</button></div>
        <div class="label">DIFFICULTY</div>
        <div class="row" id="diffRow" role="group" aria-label="Difficulty">
            <button class="chip" data-diff="easy" type="button">EASY 3x3</button><button class="chip" data-diff="normal" type="button">NORMAL 4x4</button><button class="chip" data-diff="hard" type="button">HARD 5x5</button>
        </div>
        <div class="stats" id="titleStats"></div>
    </div></div>

    <div id="levels" class="screen dim" hidden><div class="panel">
        <h2>LEVELS</h2>
        <p class="sub" id="levelsSub"></p>
        <div class="grid" id="levelGrid"></div>
        <button class="btn g" id="levelsBack" type="button">BACK</button>
    </div></div>

    <div id="done" class="screen dim" hidden><div class="panel">
        <h2 id="doneTitle">PUZZLE COMPLETE!</h2>
        <div class="stars" id="doneStars"></div>
        <div class="res"><div><b id="doneMoves">0</b><span>MOVES</span></div><div><b id="doneTime">0:00</b><span>TIME</span></div><div><b id="doneScore">0</b><span>SCORE</span></div></div>
        <p class="note" id="doneNote"></p>
        <button class="btn" id="nextBtn" type="button">NEXT LEVEL</button>
        <div class="row"><button class="btn o" id="againBtn" type="button">PLAY AGAIN</button><button class="btn b" id="doneLevels" type="button">LEVELS</button></div>
    </div></div>

    <div id="coach" hidden><div class="spot"></div><div class="panel">
        <div class="k" id="coachK"></div><p id="coachT"></p>
        <div class="row"><button class="btn g" id="coachSkip" type="button">SKIP</button><button class="btn" id="coachGo" type="button">NEXT</button></div>
    </div></div>

    <!-- Foundation Layer -->
    <script src="foundation/Foundation.js"></script>

    <script>
    (function () {
    'use strict';
    /* ======================================================================
       SNAP JIGSAW. Every level is a picture painted in code and cut into a
       3x3, 4x4 or 5x5 grid. Drag each piece onto its spot: the faint picture on
       the board shows where it belongs. A right piece locks with a combo; a
       wrong one sits in its cell until you move it. Hint, Undo, twelve levels
       and a daily puzzle.
       ====================================================================== */
    const F = Foundation;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const $ = id => document.getElementById(id);
    const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    const sdk = (fn, a) => { try { if (window.ArcadeSDK) ArcadeSDK[fn](a); } catch (e) {} };
    const cheated = () => { try { return !!(window.ArcadeSDK && ArcadeSDK.cheated); } catch (e) { return false; } };

    /* ---------- save: one key ---------- */
    const SKEY = 'snapjigsaw_v1';
    let save = { diff: 'normal', levels: {}, daily: {}, tut: 0 };
    try { const o = JSON.parse(localStorage.getItem(SKEY)); if (o && typeof o === 'object') save = Object.assign(save, o); } catch (e) {}
    const persist = () => { try { localStorage.setItem(SKEY, JSON.stringify(save)); } catch (e) {} };

    const DIFFS = { easy: { n: 'EASY', g: 3 }, normal: { n: 'NORMAL', g: 4 }, hard: { n: 'HARD', g: 5 } };
    const PALETTES = {
        default: ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E9', '#F8B500', '#FF6F61', '#6B5B95', '#88B04B', '#F7CAC9', '#92A8D1'],
        nature: ['#2E7D32', '#66BB6A', '#81C784', '#A5D6A7', '#C8E6C9', '#1B5E20', '#388E3C', '#4CAF50', '#8BC34A', '#CDDC39', '#DCEDC8', '#F1F8E9', '#558B2F', '#689F38', '#7CB342', '#9CCC65'],
        ocean: ['#0D47A1', '#1565C0', '#1976D2', '#1E88E5', '#2196F3', '#42A5F5', '#64B5F6', '#90CAF9', '#BBDEFB', '#E3F2FD', '#0277BD', '#0288D1', '#039BE5', '#03A9F4', '#00BCD4', '#4DD0E1'],
        sunset: ['#FF5722', '#FF7043', '#FF8A65', '#FFAB91', '#FFCCBC', '#FBE9E7', '#D84315', '#E64A19', '#F4511E', '#FF5722', '#FF6E40', '#FF8A65', '#FFAB91', '#FFCCBC', '#FBE9E7', '#BF360C']
    };
    const LEVELS = [
        ['Candy Dusk', 'default'], ['Green Valley', 'nature'], ['Blue Harbour', 'ocean'], ['Ember Sky', 'sunset'],
        ['Night Carnival', 'default'], ['Pine Ridge', 'nature'], ['Coral Bay', 'ocean'], ['Desert Glow', 'sunset'],
        ['Berry Hills', 'default'], ['Fern Hollow', 'nature'], ['Tide Pools', 'ocean'], ['Last Light', 'sunset']
    ].map((l, i) => ({ id: i, name: l[0], theme: l[1], seed: 7919 * (i + 3) }));

    function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
    const daySeed = () => { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
    const levelKey = (id) => save.diff + ':' + id;
    const fmtTime = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
    const unlocked = i => i === 0 || CH.all || ['easy', 'normal', 'hard'].some(d => save.levels[d + ':' + (i - 1)]);   // clear a level at any difficulty to open the next
    function dailyStreak() {
        let n = 0; const d = new Date();
        for (;;) { const k = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); if (save.daily[k]) { n++; d.setDate(d.getDate() - 1); } else break; }
        return n;
    }

    /* ---------- the pictures: painted in code, one per level (and one per day) ---------- */
    function paintPicture(g, S, theme, seed) {
        const R = mulberry32(seed), P = PALETTES[theme] || PALETTES.default, pick = () => P[(R() * P.length) | 0];
        const sky = g.createLinearGradient(0, 0, 0, S);
        const skies = { default: ['#2b1b4f', '#FF6F61', '#FFEAA7'], nature: ['#1565C0', '#85C1E9', '#DCEDC8'], ocean: ['#0D47A1', '#42A5F5', '#E3F2FD'], sunset: ['#3a0f2e', '#E64A19', '#FFCCBC'] }[theme];
        sky.addColorStop(0, skies[0]); sky.addColorStop(0.55, skies[1]); sky.addColorStop(1, skies[2]);
        g.fillStyle = sky; g.fillRect(0, 0, S, S);
        // stars or specks across the sky so every sky piece has its own marks
        for (let i = 0; i < 70; i++) { g.fillStyle = 'rgba(255,255,255,' + (0.25 + R() * 0.55) + ')'; const r = 0.6 + R() * 2.2; g.beginPath(); g.arc(R() * S, R() * S * 0.5, r * S / 400, 0, 7); g.fill(); }
        // sun with rings
        const sx = S * (0.2 + R() * 0.6), sy = S * (0.18 + R() * 0.16), sr = S * (0.08 + R() * 0.05);
        for (let k = 4; k >= 1; k--) { g.fillStyle = 'rgba(255,240,180,' + (0.08 * k) + ')'; g.beginPath(); g.arc(sx, sy, sr * (1 + k * 0.45), 0, 7); g.fill(); }
        g.fillStyle = theme === 'ocean' ? '#FFF59D' : '#FFD700'; g.beginPath(); g.arc(sx, sy, sr, 0, 7); g.fill();
        // clouds
        for (let i = 0; i < 4; i++) {
            const cx = R() * S, cy = S * (0.08 + R() * 0.3), cw = S * (0.1 + R() * 0.12);
            g.fillStyle = 'rgba(255,255,255,0.75)';
            for (let j = 0; j < 4; j++) { g.beginPath(); g.ellipse(cx + (j - 1.5) * cw * 0.45, cy + (j % 2) * cw * 0.12, cw * 0.4, cw * 0.26, 0, 0, 7); g.fill(); }
        }
        // three ridges, far to near
        const ridge = (base, amp, col, f) => {
            g.fillStyle = col; g.beginPath(); g.moveTo(0, S);
            const a = R() * 6, b = R() * 6;
            for (let x = 0; x <= S; x += S / 60) g.lineTo(x, base + Math.sin(x / S * f + a) * amp + Math.sin(x / S * f * 2.3 + b) * amp * 0.4);
            g.lineTo(S, S); g.closePath(); g.fill();
        };
        if (theme === 'ocean') {
            ridge(S * 0.5, S * 0.03, '#1565C0', 5);
            for (let i = 0; i < 9; i++) { const y = S * (0.56 + i * 0.05); g.strokeStyle = i % 2 ? 'rgba(255,255,255,.55)' : pick(); g.lineWidth = S * 0.012; g.beginPath(); for (let x = 0; x <= S; x += S / 50) { const yy = y + Math.sin(x / S * 14 + i) * S * 0.01; x ? g.lineTo(x, yy) : g.moveTo(x, yy); } g.stroke(); }
            // a sailboat
            const bx = S * (0.25 + R() * 0.5), by = S * 0.6;
            g.fillStyle = '#6B5B95'; g.beginPath(); g.moveTo(bx - S * 0.1, by); g.lineTo(bx + S * 0.1, by); g.lineTo(bx + S * 0.07, by + S * 0.04); g.lineTo(bx - S * 0.07, by + S * 0.04); g.closePath(); g.fill();
            g.fillStyle = '#fff'; g.beginPath(); g.moveTo(bx, by - S * 0.17); g.lineTo(bx, by - S * 0.01); g.lineTo(bx + S * 0.08, by - S * 0.01); g.closePath(); g.fill();
            g.fillStyle = '#FF6F61'; g.beginPath(); g.moveTo(bx - S * 0.01, by - S * 0.14); g.lineTo(bx - S * 0.01, by - S * 0.02); g.lineTo(bx - S * 0.07, by - S * 0.02); g.closePath(); g.fill();
            // sand bar
            ridge(S * 0.9, S * 0.03, '#FFE0B2', 3);
        } else {
            ridge(S * 0.48, S * 0.06, theme === 'sunset' ? '#BF360C' : theme === 'nature' ? '#558B2F' : '#6B5B95', 4);
            ridge(S * 0.62, S * 0.05, theme === 'sunset' ? '#D84315' : theme === 'nature' ? '#388E3C' : '#BB8FCE', 5);
            ridge(S * 0.8, S * 0.05, theme === 'sunset' ? '#FF8A65' : theme === 'nature' ? '#1B5E20' : '#88B04B', 3);
        }
        if (theme === 'nature') { // pines
            for (let i = 0; i < 14; i++) { const tx = R() * S, ty = S * (0.62 + R() * 0.3), th = S * (0.08 + R() * 0.08);
                g.fillStyle = '#4e342e'; g.fillRect(tx - th * 0.06, ty, th * 0.12, th * 0.25);
                g.fillStyle = pick(); g.beginPath(); g.moveTo(tx, ty - th); g.lineTo(tx + th * 0.35, ty + th * 0.05); g.lineTo(tx - th * 0.35, ty + th * 0.05); g.closePath(); g.fill(); }
        } else if (theme === 'default') { // balloons
            for (let i = 0; i < 9; i++) { const bx = R() * S, by = S * (0.3 + R() * 0.45), br = S * (0.03 + R() * 0.03);
                g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = S * 0.003; g.beginPath(); g.moveTo(bx, by + br); g.lineTo(bx + br * 0.4, by + br * 3); g.stroke();
                g.fillStyle = pick(); g.beginPath(); g.ellipse(bx, by, br * 0.85, br, 0, 0, 7); g.fill();
                g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.arc(bx - br * 0.3, by - br * 0.35, br * 0.22, 0, 7); g.fill(); }
        } else if (theme === 'sunset') { // cacti and birds
            for (let i = 0; i < 6; i++) { const cx = R() * S, cy = S * (0.72 + R() * 0.2), ch = S * (0.08 + R() * 0.07), cw = ch * 0.18;
                g.fillStyle = '#3E2723'; g.fillRect(cx - cw / 2, cy - ch, cw, ch); g.fillRect(cx - cw * 2, cy - ch * 0.6, cw * 1.5, cw * 0.7); g.fillRect(cx - cw * 2, cy - ch * 0.9, cw * 0.7, ch * 0.35);
                g.fillRect(cx + cw / 2, cy - ch * 0.45, cw * 1.4, cw * 0.7); g.fillRect(cx + cw * 1.2, cy - ch * 0.75, cw * 0.7, ch * 0.33); }
            g.strokeStyle = '#3E2723'; g.lineWidth = S * 0.006;
            for (let i = 0; i < 7; i++) { const bx = R() * S, by = S * (0.1 + R() * 0.3), bw = S * 0.025; g.beginPath(); g.moveTo(bx - bw, by); g.quadraticCurveTo(bx - bw * 0.4, by - bw * 0.6, bx, by); g.quadraticCurveTo(bx + bw * 0.4, by - bw * 0.6, bx + bw, by); g.stroke(); }
        }
        // flowers along the front edge
        for (let i = 0; i < 26; i++) { const fx = R() * S, fy = S * (0.86 + R() * 0.12), fr = S * (0.008 + R() * 0.01); g.fillStyle = pick(); g.beginPath(); g.arc(fx, fy, fr, 0, 7); g.fill(); }
    }

    /* ---------- layout ---------- */
    let W = 0, H = 0, DPR = 1;
    const L = { board: { x: 0, y: 0, s: 100 }, tray: { x: 0, y: 0, w: 100, h: 100 } };
    function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2); W = window.innerWidth; H = window.innerHeight;
        canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
        canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
        layout();
    }
    function layout() {
        const top = 64, bottom = 76;
        if (W >= H * 1.05) {
            const s = Math.floor(Math.min(H - top - bottom - 8, W * 0.5));
            L.board = { x: Math.round(Math.max(16, W * 0.27 - s / 2)), y: Math.round(top + (H - top - bottom - s) / 2), s };
            const tx = L.board.x + s + 24; L.tray = { x: tx, y: top, w: W - tx - 16, h: H - top - bottom };
        } else {
            const s = Math.floor(Math.min(W - 24, (H - top - bottom) * 0.55));
            L.board = { x: Math.round((W - s) / 2), y: top, s };
            const ty = top + s + 12; L.tray = { x: 12, y: ty, w: W - 24, h: H - bottom - ty };
        }
        if (game) { buildPic(); layoutTray(); }
    }

    /* ---------- game state ---------- */
    let mode = 'title';            // title | levels | play | done
    let game = null;
    const CH = { peek: false, magnet: false, all: false, party: false };
    let pic = null;                // offscreen canvas with the current picture at board size x DPR
    function buildPic() {
        const S = Math.max(64, Math.round(L.board.s * DPR));
        pic = document.createElement('canvas'); pic.width = pic.height = S;
        paintPicture(pic.getContext('2d'), S, game.theme, game.seed);
        game.cell = L.board.s / game.g;
    }
    function startLevel(spec, resume) {
        hideScreens(); coachEnd();
        const g = resume ? resume.g : DIFFS[save.diff].g, n = g * g;
        game = { spec, name: spec.name, theme: spec.theme, seed: spec.seed, daily: !!spec.daily, g, n, cell: 1,
            pieces: [], cells: new Array(n).fill(null), moves: 0, score: 0, combo: 0, undo: [], t0: performance.now(), tEnd: 0,
            done: false, hint: null, sel: -1, cursor: 0, lastAct: performance.now(), drag: null };
        const R = mulberry32(spec.seed ^ (g * 131) ^ (Date.now() & 0xffff));
        const order = Array.from({ length: n }, (_, i) => i);
        for (let i = n - 1; i > 0; i--) { const j = (R() * (i + 1)) | 0; [order[i], order[j]] = [order[j], order[i]]; }
        for (let i = 0; i < n; i++) game.pieces.push({ id: i, slot: order.indexOf(i), cell: null, locked: false, x: 0, y: 0, sc: 1, pat: ['stripes', 'dots', 'gradient', 'crosshatch'][i % 4] });
        if (resume) {                                   // put an unfinished puzzle back exactly as it was left
            resume.p.forEach((q, i) => { const p = game.pieces[i]; p.slot = q[0]; p.cell = q[1]; p.locked = !!q[2]; if (p.cell !== null) game.cells[p.cell] = p.id; });

        sdk('state', { scene: 'title' });
    }
    function paintDiff() { document.querySelectorAll('#diffRow .chip').forEach(b => { const on = b.dataset.diff === save.diff; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); }); }
    document.querySelectorAll('#diffRow .chip').forEach(b => b.onclick = () => { save.diff = b.dataset.diff; persist(); showTitle(); });
    function showLevels() {
        coachEnd(); hideScreens(); mode = 'levels'; $('bar').hidden = true;
        $('levelsSub').textContent = DIFFS[save.diff].n + ' (' + DIFFS[save.diff].g + 'x' + DIFFS[save.diff].g + ')  ·  clear a level to unlock the next';
        const grid = $('levelGrid'); grid.innerHTML = '';
        LEVELS.forEach((l, i) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'lv'; const r = save.levels[levelKey(i)];
            const open = unlocked(i); b.disabled = !open; if (r) b.classList.add('done');
            b.innerHTML = '<span>' + (i + 1) + '</span><small>' + (r ? '★'.repeat(r.stars) + '☆'.repeat(3 - r.stars) : open ? 'NEW' : 'LOCKED') + '</small>';
            b.setAttribute('aria-label', 'Level ' + (i + 1) + ' ' + l.name + (open ? '' : ', locked'));
            b.onclick = () => startLevel(l); grid.appendChild(b); });
        $('levels').hidden = false; $('levelsBack').focus();
    }
    function playNext() { const c = resumable(); if (c) { startLevel(c.spec.daily ? c.spec : LEVELS[c.spec.id] || c.spec, c); return; } let i = LEVELS.findIndex((l, j) => unlocked(j) && !save.levels[levelKey(j)]); if (i < 0) i = LEVELS.length - 1; startLevel(LEVELS[i]); }
    function playDaily() { const s = daySeed(); const d = new Date(); startLevel({ id: -1, daily: true, name: 'Daily ' + d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }), theme: ['default', 'nature', 'ocean', 'sunset'][s % 4], seed: s }); }
    function replay() { if (game) startLevel(game.spec); else playNext(); }
    $('playBtn').onclick = playNext; $('dailyBtn').onclick = playDaily; $('levelsBtn').onclick = showLevels; $('levelsBack').onclick = showTitle;
    $('howBtn').onclick = () => { playNext(); coachStart(); };
    $('nextBtn').onclick = () => { const i = nextLevel(); if (i !== null) startLevel(LEVELS[i]); };
    $('againBtn').onclick = replay; $('doneLevels').onclick = showLevels;
    $('hintBtn').onclick = () => { wakeAudio(); toast(hint()); sdk('event', 'hint'); };
    $('undoBtn').onclick = () => { wakeAudio(); undo(); };

    /* ---------- first-run coach: teaches the drag by doing it ---------- */
    let COACH = null;
    const STEPS = [
        { k: '1 / 3 · THE BOARD', t: 'The faint picture on the board shows where every piece belongs.', rect: () => ({ x: L.board.x, y: L.board.y, w: L.board.s, h: L.board.s }) },
        { k: '2 / 3 · TRY IT', t: 'Drag the glowing piece onto the glowing spot. A right piece locks in and starts a combo.', rect: () => ({ x: L.board.x, y: L.board.y, w: L.board.s, h: L.board.s }), setup: () => { const p = game.pieces[0]; game.hint = { pid: p.id, cell: p.id, t: performance.now() + 1e9 }; }, done: () => game.pieces[0].locked },
        { k: '3 / 3 · HINT AND UNDO', t: 'Stuck? HINT lights up a piece and its spot. UNDO takes back your last move. Fewer moves earn more stars.', rect: () => { const r = $('bar').getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; } }
    ];
    function coachStart() { if (mode !== 'play' || !game) playNext(); COACH = { i: 0, t: performance.now() }; $('coach').hidden = false; coachPaint(); sdk('event', 'tutorial-start'); }
    function coachPaint() {
        if (!COACH) return; const st = STEPS[COACH.i]; if (st.setup) st.setup();
        const r = st.rect(), sp = document.querySelector('#coach .spot'), pn = document.querySelector('#coach .panel');
        sp.style.left = (r.x - 8) + 'px'; sp.style.top = (r.y - 8) + 'px'; sp.style.width = (r.w + 16) + 'px'; sp.style.height = (r.h + 16) + 'px';
        sp.style.boxShadow = st.done ? 'none' : '';
        $('coachK').textContent = st.k; $('coachT').textContent = st.t;
        $('coachGo').textContent = COACH.i === STEPS.length - 1 ? 'PLAY' : 'NEXT';
        const below = r.y + r.h / 2 < H * 0.5;
        pn.style.top = below ? Math.min(H - 170, r.y + r.h + 16) + 'px' : 'auto'; pn.style.bottom = below ? 'auto' : (H - r.y + 16) + 'px';
        if (W >= H * 1.05 && COACH.i < 2) { pn.style.left = Math.min(W - 230, L.tray.x + L.tray.w / 2) + 'px'; pn.style.top = '80px'; pn.style.bottom = 'auto'; } else pn.style.left = '50%';
    }
    function coachNext() { if (!COACH) return; if (STEPS[COACH.i].done && game) game.hint = null; COACH.i++; if (COACH.i >= STEPS.length) coachEnd(true); else coachPaint(); }
    // reading the coach is not puzzle time
    function coachEnd(done) { if (!COACH) return; if (game && !game.done) game.t0 += performance.now() - COACH.t; COACH = null; $('coach').hidden = true; if (game && game.hint && game.hint.t > performance.now()) game.hint = null; save.tut = 1; persist(); if (done) sdk('event', 'tutorial-done'); }
    $('coachGo').onclick = coachNext; $('coachSkip').onclick = () => coachEnd();
    setInterval(() => { if (COACH && STEPS[COACH.i].done && game && STEPS[COACH.i].done()) coachNext(); }, 250);

    /* ---------- codes ---------- */
    const CODES = { PEEKABOO: 'The picture on the board shows at full strength', MAGNET: 'Drop a piece anywhere on the board and it flies to its own spot',
        ALLLEVELS: 'Every level is unlocked', RAINBOW: 'Party mode: rainbow pieces and star bursts on every snap' };
    function code(c) {
        if (!CODES[c]) return { ok: false };
        if (c === 'PEEKABOO') CH.peek = true; else if (c === 'MAGNET') CH.magnet = true; else if (c === 'ALLLEVELS') { CH.all = true; if (mode === 'levels') showLevels(); } else CH.party = true;
        $('codesOn').hidden = false; toast('Code on: ' + CODES[c]);
        return { ok: true, message: CODES[c] };
    }

    /* ---------- boot ---------- */
    window.addEventListener('resize', () => { resize(); if (COACH) coachPaint(); });
    F.JuiceKit.init(canvas);
    resize();
    document.getElementById('loading').style.display = 'none';
    showTitle();
    requestAnimationFrame(frame);
    if (window.ArcadeSDK) ArcadeSDK.init({
        onRestart: replay,
        onExit: showTitle,
        onTutorial: coachStart,
        onHint: hint,
        onCheat: code
    });
    window.__snap = { state: () => game ? { mode, moves: game.moves, placed: game.pieces.filter(p => p.locked).length, n: game.n, done: game.done, score: game.score } : { mode },
        solveAllBut: (k) => { game.pieces.forEach(p => { if (p.id >= (k || 0) && !p.locked) place(p, p.id); }); },
        piece: id => ({ x: game.pieces[id].x, y: game.pieces[id].y }), cell: i => cellCenter(i) };
    })();
    </script>
</body>
</html>
