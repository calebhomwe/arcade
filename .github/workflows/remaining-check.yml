name: Remaining game repairs
on:
  push:
    branches: [gameplay/remaining-repairs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        case: [city-builder-phone, city-builder-desktop, swellrider-desktop]
    env:
      CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix qa/harness
      - run: cd qa/harness && npx playwright install --with-deps chromium
      - run: python3 -m http.server 3000 > /tmp/server.log 2>&1 &
      - run: node qa/harness/remaining.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-${{ matrix.case }}
          path: qa/remaining-results
          retention-days: 30
