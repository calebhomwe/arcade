name: Tower and snowboard gameplay
on:
  push:
    branches: [gameplay/genre-repair]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        case: [tower-desktop, tower-phone, snow-desktop, snow-phone]
    env:
      CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix qa/harness
      - run: cd qa/harness && npx playwright install --with-deps chromium
      - run: python3 -m http.server 3000 > /tmp/server.log 2>&1 &
      - run: node --loader ./qa/harness/three-loader.mjs qa/harness/snowphysics.mjs
      - run: node qa/harness/genre.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genre-gameplay-${{ matrix.case }}
          path: qa/genre-results
          retention-days: 30
