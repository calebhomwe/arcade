name: Every-game browser harness
on:
  push:
    branches: ['claude/web-games-list-j09h6p', main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix qa/harness
      - run: cd qa/harness && npx playwright install --with-deps chromium
      - name: Start site
        run: python3 -m http.server 3000 > /tmp/arcade-server.log 2>&1 &
      - name: Exercise every game on desktop and phone
        run: node qa/harness/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-playtest
          path: qa/results
          retention-days: 14
