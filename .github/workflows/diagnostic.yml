name: Focused harness diagnostics
on:
  push:
    branches: ['claude/web-games-list-j09h6p']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix qa/harness
      - run: cd qa/harness && npx playwright install --with-deps chromium
      - run: python3 -m http.server 3000 > /tmp/arcade-server.log 2>&1 &
      - run: node qa/harness/run.mjs
        env:
          GAME_IDS: high-nest,market-merge,math-miner,maths-kart,kingdom-defense,hub-game-2048,sky-maze-runner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-playtest
          path: qa/results
