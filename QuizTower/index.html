<!DOCTYPE html>

<style>
  html,body{margin:0;padding:0;background:#0b0e13;color:#e8e2d0;font-family:system-ui,Segoe UI,sans-serif;height:100%;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100vh}
  canvas{background:#141a22;box-shadow:0 0 40px #000a;max-width:100vw;max-height:100vh;touch-action:manipulation}

  #grown{display:none;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100vw - 24px));

<body>
<div id="wrap"><canvas id="c" width="960" height="640"></canvas></div>
<div id="rotate" role="dialog" aria-label="Turn your phone"><div class="ph" aria-hidden="true"></div>
  <h2>Turn your phone sideways</h2><p>The battlefield needs the width: sideways, every tower and answer is big enough to tap.</p>
  <button class="qbtn dim" id="anyway">PLAY UPRIGHT ANYWAY</button></div>
<div id="hintBox" class="qpanel" role="status" aria-live="polite"></div>
<div id="coach" class="qpanel" role="status" aria-live="polite"><div style="flex:1"><small id="coachStep"></small><span id="coachText"></span></div>
  <button class="qbtn dim" id="coachSkip">SKIP</button></div>
<div id="grown" class="qpanel" role="dialog" aria-label="For grown-ups"><h2>For grown-ups</h2>
  <div class="lk-p" style="color:#8a94a8">What was practised, how accurate it was, and what to practise next.</div>
  <div id="grownBody"></div><div style="text-align:center;margin-top:10px"><button class="qbtn" id="grownBack">BACK</button></div></div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   QUIZ TOWER DEFENSE — knowledge-powered lane tower defense.
   Single file. Canvas 2D. Zero network. All art procedural.
   Question core (tiered math + hints, spelling word bank with sentence clues)
   extracted from Spell & Maths Galaxy.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ─────────────────────────── utils ─────────────────────────── */
const CVS = document.getElementById('c');
const CTX = CVS.getContext('2d');
const W = 960, H = 640;   /* the board's own units; the backing store is sized for the screen in fit() */
const TAU = Math.PI * 2;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd = Math.random;
function rint(a,b){return a + Math.floor(rnd() * (b - a + 1));}
function pick(arr){return arr[Math.floor(rnd() * arr.length)];}
function shuf(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function dist(ax,ay,bx,by){return Math.hypot(bx-ax,by-ay);}

/* seeded RNG per map (the "3 map paths (seeded)" contract) */
function mapRng(seed){return mulberry32(seed*7919+13);}

/* ═══════════ LEARNING KIT — age bands, teaching hints, a report for grown-ups ═══════════
   Hints teach the rule or the next step; they never hand over the answer.
   Every answer is logged against the skill it practised, so a grown-up can read
   what was practised, how accurate it was and what to practise next. */
const LEARN=(function(){
  const BANDS=[
    {id:'5-7', label:'Ages 5–7',  math:[1,2], word:[1,2]},
    {id:'7-9', label:'Ages 7–9',  math:[2,3], word:[2,3]},
    {id:'9-11',label:'Ages 9–11', math:[3,4], word:[3,5]}];
  const SPELL=['','Spelling short words','Spelling everyday words','Spelling longer words',
               'Spelling tricky words','Spelling advanced words'];
  const TIPS={
    'Adding within 20':'Start at the bigger number and count on, or make a ten first (8 + 5 = 8 + 2 + 3).',
    'Adding bigger numbers':'Add the tens, then the ones, then put the two parts together.',
    'Taking away within 20':'Count up from the smaller number to the bigger one on a number line.',
    'Taking away bigger numbers':'Take away the tens first, then the ones.',
    'Times tables to 9 × 9':'Skip-count out loud (3, 6, 9, 12…) and learn one table at a time.',
    'Times tables to 12 × 12':'Practise the 6, 7, 8 and 12 times tables; use 10 × then adjust.',
    'Dividing into equal groups':'Turn it round: 24 ÷ 6 means 6 × ? = 24.',
    'Multiply before adding':'In a two-step sum, do the × part first, then the +.',
    'Fractions of amounts':'Divide by the bottom number, then multiply by the top number.',
    'Percentages of amounts':'10% is ÷ 10, 50% is a half, 25% is a quarter.',
    'Number bonds':'Learn the pairs that make 10 by heart, then use them for 20 and 100.',
    'Checking sums (true or false)':'Work the sum out first, then compare it with the one shown.'};
  const SPELL_TIP='Say the word slowly, look at it, cover it, write it, then check it.';
  const VOW='AEIOU';
  const TEAMS={SH:'sh',CH:'ch',TH:'th',WH:'w',PH:'f',CK:'k',NG:'ng'}, SILENT={KN:'n',WR:'r'};
  const clampN=(v,a,b)=>v<a?a:v>b?b:v;

  /* ---- what a math prompt practises, and how to teach it ---- */
  function parseMath(prompt,note){
    const p=String(prompt||'').replace(/\s*=\s*\?\s*$/,'').replace(/-/g,'−').trim();
    let m;
    if((m=p.match(/^(\d+) \+ (\d+) × (\d+)$/)))return{k:'two',a:+m[1],b:+m[2],c:+m[3]};
    if((m=p.match(/^(\d+)\/(\d+) of (\d+)$/)))return{k:'frac',n:+m[1],d:+m[2],t:+m[3]};
    if((m=p.match(/^(\d+)% of (\d+)$/)))return{k:'pct',p:+m[1],t:+m[2]};
    if((m=p.match(/^(\d+) \+ \?(?: = (\d+))?$/))){
      const t=m[2]?+m[2]:+(String(note||'').match(/(\d+)/)||[0,0])[1];
      return{k:'bond',a:+m[1],t:t};}
    if((m=p.match(/^(.+) = (\d+)$/))){const inner=parseMath(m[1]);if(inner)return{k:'tf',q:inner,s:+m[2],text:m[1]};}
    if((m=p.match(/^(\d+) ([+−×÷]) (\d+)$/)))return{k:m[2],a:+m[1],b:+m[3]};
    return null;
  }
  function mathSkill(prompt,note){
    const q=parseMath(prompt,note); if(!q)return 'Mental maths';
    if(q.k==='+')return q.a+q.b<=20?'Adding within 20':'Adding bigger numbers';
    if(q.k==='−')return q.a<=20?'Taking away within 20':'Taking away bigger numbers';
    if(q.k==='×')return (q.a<=9&&q.b<=9)?'Times tables to 9 × 9':'Times tables to 12 × 12';
    if(q.k==='÷')return 'Dividing into equal groups';
    if(q.k==='two')return 'Multiply before adding';
    if(q.k==='frac')return 'Fractions of amounts';
    if(q.k==='pct')return 'Percentages of amounts';
    if(q.k==='bond')return 'Number bonds';
    return 'Checking sums (true or false)';
  }
  function skip(n,times){const s=[];for(let i=1;i<=Math.min(3,times-1);i++)s.push(n*i);return s.join(', ')+'…';}
  function mathHint(prompt,note){
    const q=parseMath(prompt,note);
    if(!q)return 'Read the question twice, then work it out one step at a time.';
    const big=Math.max(q.a,q.b),small=Math.min(q.a,q.b);
    switch(q.k){
      case '+':
        if(q.a+q.b<=20){
          if(big<10&&big+small>10)return `Make a ten: ${big} needs ${10-big} more to reach 10. Take ${10-big} from the ${small}, then add what is left on to 10.`;
          return `Number line: start at ${big} and hop ${small} to the right. Count the hops out loud.`;}
        if(small<10){const up=Math.ceil((big+1)/10)*10-big;
          return small>up?`Start at ${big}. Hop ${up} to reach ${big+up}, then hop on the other ${small-up}.`
                         :`Start at ${big} and count on ${small} more, one hop at a time.`;}
        return `Split into tens and ones: add ${Math.floor(q.a/10)*10} + ${Math.floor(q.b/10)*10} first, then ${q.a%10} + ${q.b%10}, then put them together.`;
      case '−':
        if(q.a<=20)return `Number line: start at ${q.b} and count up to ${q.a}. How many hops did you make?`;
        if(q.b<10){const down=q.a%10;
          return down&&q.b>down?`Count back from ${q.a}: hop back ${down} to reach ${q.a-down}, then hop back the other ${q.b-down}.`
                               :`Count back ${q.b} from ${q.a}, one hop at a time.`;}
        if(q.b%10===0)return `Take away ${q.b/10} tens: count back from ${q.a} in tens.`;
        return `Take away the tens first: ${q.a} − ${Math.floor(q.b/10)*10}. Then take away the ${q.b%10} ones that are left.`;
      case '×':
        if(q.a===10||q.b===10)return `Times 10: put a zero on the end of the other number.`;
        if(q.a===2||q.b===2)return `Times 2 is doubling: add ${q.a===2?q.b:q.a} to itself.`;
        if(q.a===5||q.b===5)return `Times 5 is half of times 10: work out ${q.a===5?q.b:q.a} × 10, then halve it.`;
        if(q.a===9||q.b===9){const o=q.a===9?q.b:q.a;return `Times 9: work out ${o} × 10, then take away one ${o}.`;}
        return `${q.a} × ${q.b} is ${q.b} groups of ${q.a}. Skip-count by ${q.a}: ${skip(q.a,q.b)} and stop after ${q.b} jumps.`;
      case '÷':
        return `How many groups of ${q.b} make ${q.a}? Think ${q.b} × ? = ${q.a}, or skip-count by ${q.b} until you reach ${q.a}.`;
      case 'two':
        return `Multiply first: work out ${q.b} × ${q.c}, then add ${q.a} to that.`;
      case 'frac':
        return q.n===1?`Split ${q.t} into ${q.d} equal groups. One group is the answer.`
                      :`Split ${q.t} into ${q.d} equal groups, then take ${q.n} of the groups.`;
      case 'pct':
        if(q.p===50)return `50% means half. What is half of ${q.t}?`;
        if(q.p===25)return `25% is a quarter: halve ${q.t}, then halve it again.`;
        if(q.p===75)return `75% is three quarters: find a quarter of ${q.t}, then take three of them.`;
        if(q.p===10)return `10% means one tenth: share ${q.t} into 10 equal parts (${q.t} ÷ 10).`;
        return `${q.p}% is ${q.p/10} lots of 10%. First find 10% of ${q.t} (that is ${q.t} ÷ 10), then multiply by ${q.p/10}.`;
      case 'bond':
        return q.t===10||q.t===20?`Count up from ${q.a} to ${q.t} on your fingers or a number line.`
                                 :`Count up from ${q.a} to the next ten, then on in tens to ${q.t}.`;
      case 'tf':
        return `Work out ${q.text} yourself first, then check: is it really ${q.s}?`;
    }
    return '';
  }

  /* ---- spelling: the first letter, the length, then sound-by-sound nudges ---- */
  function spellHint(word,idx,clue){
    const W=String(word).toUpperCase(), n=W.length; idx=clampN(idx|0,0,n-1);
    const c=W[idx], prev=W[idx-1]||'', so=W.slice(0,idx), tail=clue?` Clue: “${String(clue).replace('~','___')}”`:'';
    if(idx===0)return `It starts with the letter ${c} and has ${n} letters. Say the word slowly and listen to each sound.`+tail;
    const pair=prev+c;
    if(TEAMS[pair])return `After “${so}”, ${prev} teams up with the next letter to make one sound: /${TEAMS[pair]}/.`;
    if(SILENT[pair])return `The ${prev} is silent here: the sound you hear is /${SILENT[pair]}/.`;
    if(prev==='Q')return `Rule: the letter Q nearly always has the same vowel straight after it, and together they say /kw/.`;
    if(c===prev)return `After “${so}”, the same letter comes again: this word has a double letter here.`;
    if(c==='E'&&idx===n-1)return `Last letter: it is a silent e at the end. It makes the vowel before it say its name.`;
    if(VOW.includes(c)&&VOW.includes(prev))return `After “${so}”, another vowel joins in: two vowels team up to make one sound here.`;
    if(VOW.includes(c)||(c==='Y'&&idx===n-1))return `After “${so}” comes a vowel sound (a, e, i, o, u${c==='Y'?' or y':''}). Say “${so.toLowerCase()}…” slowly: which vowel do you hear?`;
    return `After “${so}” comes a consonant. Say “${so.toLowerCase()}…” slowly and listen for the next sound. ${n-idx} letter${n-idx>1?'s':''} to go.`;
  }

  /* ---- the record ---- */
  function create(key){
    let R={bands:{},skills:{},missWords:[],sessions:0,answered:0,correct:0,since:new Date().toISOString().slice(0,10)};
    try{const s=JSON.parse(localStorage.getItem(key));if(s&&typeof s==='object')R=Object.assign(R,s);}catch(e){}
    let S={skills:{},answered:0,correct:0,missWords:[]};   /* this session */
    const save=()=>{try{localStorage.setItem(key,JSON.stringify(R));}catch(e){}};
    const bump=(o,skill,ok)=>{const s=o[skill]||(o[skill]={r:0,w:0});ok?s.r++:s.w++;};
    const api={
      BANDS,
      band(){return BANDS.find(b=>b.id===R.band)||null;},
      bandIndex(){const i=BANDS.findIndex(b=>b.id===R.band);return i<0?1:i;},
      setBand(id){R.band=id;save();},
      /* a tier inside the band: the band's easiest tier plus the ramp, capped at the band's hardest */
      tier(kind,ramp){const b=BANDS[api.bandIndex()],r=kind==='word'?b.word:b.math;return clampN(r[0]+(ramp|0),r[0],r[1]);},
      startSession(){S={skills:{},answered:0,correct:0,missWords:[]};R.sessions++;save();},
      note(skill,ok,word){
        bump(R.skills,skill,ok);bump(S.skills,skill,ok);
        R.answered++;S.answered++;if(ok){R.correct++;S.correct++;}
        if(word&&!ok){const w=String(word).toLowerCase();
          if(!S.missWords.includes(w))S.missWords.push(w);
          R.missWords=[w].concat(R.missWords.filter(x=>x!==w)).slice(0,12);}
        if(word&&ok)R.missWords=R.missWords.filter(x=>x!==String(word).toLowerCase());
        save();
      },
      noteMath(prompt,ok,note){api.note(mathSkill(prompt,note),ok);},
      noteSpell(level,ok,word){api.note(SPELL[clampN(level|0,1,5)],ok,word);},
      session(){return S;},
      /* the grown-up report: {lines:[...], next:'...'} for this session and all time */
      report(scope){
        const src=scope==='session'?S:R, rows=Object.keys(src.skills).map(k=>{const s=src.skills[k];
          return{skill:k,n:s.r+s.w,acc:Math.round(100*s.r/Math.max(1,s.r+s.w))};}).sort((a,b)=>b.n-a.n);
        const acc=Math.round(100*src.correct/Math.max(1,src.answered));
        let weak=rows.filter(r=>r.n>=3).sort((a,b)=>a.acc-b.acc)[0]||rows.slice().sort((a,b)=>a.acc-b.acc)[0];
        let next;
        if(!rows.length)next='Play a round to start the record.';
        else if(weak&&weak.acc<85)next=`${weak.skill} (${weak.acc}% right). ${TIPS[weak.skill]||SPELL_TIP}`;
        else{const bi=api.bandIndex();
          next=bi<BANDS.length-1&&src.answered>=10?`Everything practised is 85% or better: try ${BANDS[bi+1].label} next.`
                                                   :'Keep going at this level: accuracy is strong.';}
        const words=(scope==='session'?S.missWords:R.missWords).slice(0,8);
        return{rows,acc,answered:src.answered,correct:src.correct,next,words,
               sessions:R.sessions,since:R.since,band:BANDS[api.bandIndex()].label};
      },
      /* plain HTML, styled by each game */
      reportHTML(scope){
        const r=api.report(scope), esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
        if(!r.answered)return `<p class="lk-p">No answers yet${scope==='session'?' this round':''}. Play a round and the report fills in.</p>`;
        return `<p class="lk-p"><b>${r.answered}</b> answer${r.answered>1?'s':''}, <b>${r.acc}%</b> right`+
          (scope==='session'?'':` · ${r.sessions} round${r.sessions>1?'s':''} since ${esc(r.since)} · level ${esc(r.band)}`)+`</p>`+
          `<table class="lk-t">${r.rows.slice(0,8).map(x=>`<tr><td>${esc(x.skill)}</td><td>${x.n}</td><td>${x.acc}%</td></tr>`).join('')}</table>`+
          (r.words.length?`<p class="lk-p">Words to practise: <b>${r.words.map(esc).join(', ')}</b></p>`:'')+
          `<p class="lk-p lk-next">Practise next: ${esc(r.next)}</p>`;
      },
      mathSkill,mathHint,spellHint,SPELL,
    };
    return api;
  }
  return{create,mathSkill,mathHint,spellHint,BANDS};
})();
const LK=LEARN.create('qt_learn');
const RM=matchMedia('(prefers-reduced-motion: reduce)');   /* no castle shake, no sputter flicker */

/* ═══════════ QUESTION CORE (extracted from SpellMathsGalaxy) ═══════════ */

   format: [word, 'sentence with ~ where the word goes'] */

    ['frog','a green ~ jumps and croaks'],['bird','a ~ has feathers and wings'],

    ['tree','a ~ has leaves and branches'],['duck','the ~ says quack'],['ship','a ~ crosses the sea'],
    ['milk','the cat drank ~'],['book','she read a ~ at night'],['king','the ~ wore a golden crown'],
    ['road','the ~ goes over the hill'],['snow','cold white ~ fell all night'],['bear','the big ~ slept all winter'] ],
 2:[ ['garden','flowers grow in the ~'],['bridge','the train crossed the ~'],
    ['monkey','a ~ climbs and swings'],['orange','an ~ is a round citrus fruit'],
    ['purple','~ is red mixed with blue'],['school','you learn at ~'],
    ['pencil','you write with a ~'],['tiger','a ~ is a big striped cat'],

    ['engine','the ~ makes the ship move'],['flower','a ~ opens in the sun'],

 3:[ ['beautiful','the sunset was ~'],['adventure','a long risky ~'],
    ['telescope','a ~ makes far things near'],['dangerous','a ~ road hugs the cliff'],
    ['elephant','the grey ~ has a trunk'],['gravity','~ pulls you down'],
    ['giraffe','the ~ has a very long neck'],['hospital','the sick are cared for in a ~'],
    ['horizon','the sun sinks below the ~'],['lightning','~ is a bright crack in a storm'],
    ['umbrella','an ~ keeps the rain off'],['volcano','the ~ erupted at dawn'],

 4:[ ['accomplish','you can ~ anything with practice'],['believe','always ~ in yourself'],

const word = lv => { const w = pick(WORDS[clamp(lv,1,5)]); return {t:w[0], h:w[1]}; };
function clueSentence(w){
  return w.h.replace('~','_____');
}
/* one-line teaching hints, shown after a miss */
function hintFor(op,a,b){
  switch(op){
    case '+': return 'start at '+a+', count on '+b+' more';
    case '−': return 'count up from '+b+' to '+a;
    case '×': return b+' groups of '+a+' — or '+a+' groups of '+b;
    case '÷': return 'how many '+b+'s make '+a+'?';
    default: return '';
  }
}
function opts(ans,spread,min,max,n){
  const want=n+1, s=new Set([String(ans)]); let g=0;
  const a0=Number(ans);
  while(s.size<want&&g++<400){const v=a0+rint(-spread,spread); if(v!==a0&&v>=min&&v<=max)s.add(String(v));}
  let b=1; while(s.size<want){ if(a0+b<=max)s.add(String(a0+b)); if(s.size<want&&a0-b>=min)s.add(String(a0-b)); b++; }
  return shuf([...s]);
}
/* tiered arithmetic generators — tiers 1..4 (from SpellMathsGalaxy qQuick) */
function qMath(d){
  let a,b,op,ans,sp,mn,mx,hint='';
  if(d===1){op=Math.random()<.5?'+':'−';a=rint(1,10);b=rint(1,10);if(op==='−'&&b>a){const t=a;a=b;b=t;}
            ans=op==='+'?a+b:a-b;sp=4;mn=0;mx=20;}
  else if(d===2){const r=Math.random();
    if(r<.34){op='+';a=rint(5,30);b=rint(5,30);ans=a+b;sp=7;mn=0;mx=64;}
    else if(r<.68){op='−';a=rint(10,45);b=rint(1,a);ans=a-b;sp=7;mn=0;mx=45;}
    else{op='×';a=rint(2,9);b=rint(2,9);ans=a*b;sp=8;mn=0;mx=90;}}
  else if(d===3){const r=Math.random();
    if(r<.25){op='+';a=rint(25,99);b=rint(25,99);ans=a+b;sp=14;mn=0;mx=200;}
    else if(r<.5){op='−';a=rint(40,99);b=rint(10,a);ans=a-b;sp=14;mn=0;mx=99;}
    else if(r<.78){op='×';a=rint(3,12);b=rint(3,12);ans=a*b;sp=12;mn=0;mx=150;}
    else{op='÷';b=rint(2,9);ans=rint(2,12);a=b*ans;sp=6;mn=0;mx=20;}}
  else{ /* tier 4: two-step, fractions of a quantity, percentages */
    const r=Math.random();
    if(r<.4){const b1=rint(2,9),b2=rint(2,9); a=rint(3,18); ans=a+b1*b2;
      hint=b1+' × '+b2+' = '+(b1*b2)+', then '+a+' + '+(b1*b2);
      return{prompt:a+' + '+b1+' × '+b2,note:'multiply first, then add',hint,
             answer:String(ans),options:opts(ans,15,0,Math.max(120,ans+20),3)};}
    if(r<.7){const den=pick([2,3,4,5]); const num=pick([1,1,1,2,3].filter(n=>n<den));
      const T=den*rint(3,12); ans=T/den*num;
      hint='divide '+T+' by '+den+' (bottom), then times by '+num+' (top)';
      return{prompt:num+'/'+den+' of '+T,note:'take the fraction of the whole',hint,
             answer:String(ans),options:opts(ans,Math.max(4,Math.round(ans*.3)),0,ans*2+6,3)};}
    const p=pick([10,20,25,50,75]), T=pick([20,40,60,80,100,200]);
    ans=T/100*p;
    hint=p+'% of '+T+' = '+T+' ÷ 100 × '+p;
    return{prompt:p+'% of '+T,note:'take the percentage of the whole',hint,
           answer:String(ans),options:opts(ans,Math.max(6,Math.round(ans*.35)),0,ans*2+10,3)};
  }
  hint=hintFor(op,a,b);
  return{prompt:a+' '+op+' '+b,note:'',hint,answer:String(ans),options:opts(ans,sp,mn,mx,3)};
}
/* spelling question: clue sentence + 4 word pedestals */
function qSpell(d){
  const w=word(clamp(d,1,5));
  const pool=[]; const bank=WORDS[clamp(d,1,5)];
  let guard=0;
  while(pool.length<3&&guard++<200){const c=pick(bank)[0]; if(c!==w.t&&pool.indexOf(c)<0)pool.push(c);}
  const options=shuf([w.t].concat(pool));
  return{prompt:clueSentence(w),note:'complete the sentence',
         hint:'starts with "'+w.t[0].toUpperCase()+'" — '+w.t.length+' letters',
         answer:w.t,options};
}
function makeQuestion(mode,tier){
  const q = mode==='math' ? qMath(clamp(tier,1,4)) : qSpell(clamp(tier,1,5));
  q.answerIndex = q.options.indexOf(q.answer);
  if(q.answerIndex<0){q.options[0]=q.answer;q.answerIndex=0;}
  return q;
}

/* ═══════════ layout / maps ═══════════ */
const CELL=48, COLS=16, ROWS=10, FX=0, FY=64, FW=COLS*CELL, FH=ROWS*CELL;
const PANEL_X=FW, PANEL_W=W-FW;                 /* right sidebar 768..960 */
const CMD_Y=FY+FH, CMD_H=H-CMD_Y;               /* command strip 544..640 */

/* 3 seeded winding maps: waypoint corners (grid col,row), castle at the end.
   A seeded RNG jitters the fixed lanes so each map's exact polyline is
   deterministic per seed. */
const MAPS=[
 {name:'Ridge Run',   wps:[[0,1],[6,1],[6,4],[11,4],[11,7],[2,7],[2,9],[15,9]], seed:11},
 {name:'Snake Vale',  wps:[[0,8],[4,8],[4,2],[8,2],[8,7],[12,7],[12,1],[15,1]], seed:22},
 {name:'Kings Bend',  wps:[[0,5],[3,5],[3,1],[7,1],[7,8],[11,8],[11,3],[15,3]], seed:33},
];
let pathPts=[], pathLen=0, cumL=[], pathCells=new Set(), castleXY={x:0,y:0};

function buildPath(mapIdx){
  const m=MAPS[mapIdx], r=mapRng(m.seed);
  const corners = m.wps.map(function(wp){return {x:FX+(wp[0]+.5)*CELL, y:FY+(wp[1]+.5)*CELL};});
  const pts=[corners[0]];
  for(let i=1;i<corners.length;i++){
    const a=corners[i-1], b=corners[i];
    const len=dist(a.x,a.y,b.x,b.y), steps=Math.max(2,Math.round(len/24));
    const nx=-(b.y-a.y)/len, ny=(b.x-a.x)/len;
    for(let s=1;s<steps;s++){
      const t=s/steps, j=(r()-.5)*20;
      pts.push({x:lerp(a.x,b.x,t)+nx*j, y:lerp(a.y,b.y,t)+ny*j});
    }
    pts.push(b);
  }
  let L=0; const cum=[0];
  for(let i=1;i<pts.length;i++){L+=dist(pts[i-1].x,pts[i-1].y,pts[i].x,pts[i].y);cum.push(L);}
  pathPts=pts; pathLen=L; cumL=cum;
  const last=pts[pts.length-1]; castleXY={x:last.x,y:last.y};
  pathCells=new Set();
  for(let d=0; d<=L; d+=12){
    const p=pointAt(d);
    const cx=Math.floor((p.x-FX)/CELL), cy=Math.floor((p.y-FY)/CELL);
    if(cx>=0&&cx<COLS&&cy>=0&&cy<ROWS) pathCells.add(cx+','+cy);
  }
  const base=Array.from(pathCells);
  for(const k of base){const parts=k.split(',');const cx=+parts[0],cy=+parts[1];
    const ring=[[1,0],[-1,0],[0,1],[0,-1]];
    for(const dxy of ring)pathCells.add((cx+dxy[0])+','+(cy+dxy[1]));}
}
function pointAt(d){
  d=clamp(d,0,pathLen);
  let lo=0,hi=cumL.length-1;
  while(lo<hi){const mid=(lo+hi)>>1; if(cumL[mid]<d)lo=mid+1;else hi=mid;}
  const i=Math.max(1,lo);
  const a=pathPts[i-1],b=pathPts[i];
  const seg=cumL[i]-cumL[i-1]||1, t=(d-cumL[i-1])/seg;
  return {x:lerp(a.x,b.x,t), y:lerp(a.y,b.y,t)};
}

/* ─────────────────────────── towers ─────────────────────────── */
function cellFree(cx,cy){
  if(cx<0||cx>=COLS||cy<0||cy>=ROWS)return false;
  if(pathCells.has(cx+','+cy))return false;
  return !G.towers.some(function(t){return t.type!=='answer'&&t.cx===cx&&t.cy===cy;});
}
function placeTower(cx,cy,type){
  const def=TOWERS[type];
  if(!def)return false;
  if(type==='answer')return false;
  if(!cellFree(cx,cy))return false;
  if(G.gold<def.cost)return false;
  G.gold-=def.cost;
  G.towers.push({type:type,cx:cx,cy:cy,x:FX+(cx+.5)*CELL,y:FY+(cy+.5)*CELL,level:0,cd:0});
  burst(FX+(cx+.5)*CELL,FY+(cy+.5)*CELL,def.color,10);
  return true;
}
function placeAnswerTurret(pedId){
  const p=G.pedestals[pedId];
  if(!p||p.armed||p.turret)return false;
  if(G.gold<TOWERS.answer.cost)return false;
  G.gold-=TOWERS.answer.cost;
  p.armed=true;
  p.turret={type:'answer',cx:p.cx,cy:p.cy,x:p.x,y:p.y,level:0,cd:0,pedId:pedId};
  G.towers.push(p.turret);
  burst(p.x,p.y,'#b48ce0',12);
  return true;
}
function upgradeTower(t){
  if(!t||t.type==='answer'||t.level>=2)return false;
  const cost=UPGRADE_COST[t.level];
  if(G.gold<cost)return false;
  G.gold-=cost; t.level++;

  flash(TOWERS[t.type].name+' upgraded to level '+(t.level+1),'#fff2c0');
  return true;
}
function sellTower(t){
  if(!t||t.type==='answer')return false;
  let spent=TOWERS[t.type].cost;
  for(let i=0;i<t.level;i++)spent+=UPGRADE_COST[i];
  const refund=Math.floor(spent*.6);
  G.gold+=refund;
  G.towers=G.towers.filter(function(o){return o!==t;});
  if(G.selTower===t)G.selTower=null;
  flash('+'+refund+' gold refunded','#e0b34d');
  return true;
}

/* ─────────────────────────── update ─────────────────────────── */
function update(dt){
  G.time+=dt; G.frames++;
  if(G.hintTimer>0)G.hintTimer-=dt;
  if(G.screenShake>0)G.screenShake=Math.max(0,G.screenShake-dt*30);
  updateFx(dt);
  if(G.phase!=='playing')return;

  if(G.waveActive){
    G.waveT+=dt;
    while(G.spawnQueue.length&&G.spawnQueue[0].t<=G.waveT){
      spawnEnemy(G.spawnQueue.shift().type);
    }
    for(const e of G.enemies){
      const sl=e.slow>0?.45:1;
      if(e.slow>0)e.slow-=dt;
      e.d+=e.speed*sl*dt;
      if(e.d>=pathLen){
        e.dead=true;
        hurtCastle(e.dmg);
        burst(castleXY.x,castleXY.y,'#e05a4a',14);
      }
    }
    G.enemies=G.enemies.filter(function(e){return !e.dead;});
    G.golemAlive=G.enemies.some(function(e){return e.golem;});

    const fiMul=fireIntervalMul(), dm=dmgMul();
    for(const t of G.towers){
      if(t.type==='answer')continue;
      t.cd-=dt;
      if(t.cd>0)continue;
      const def=TOWERS[t.type];
      let best=null,bd=-1;
      for(const e of G.enemies){
        const ep=pointAt(e.d);
        if(dist(t.x,t.y,ep.x,ep.y)<=def.range[t.level]&&e.d>bd){bd=e.d;best=e;}
      }
      if(best){
        t.cd=def.rate[t.level]*fiMul;
        const bp=pointAt(best.d);
        const ang=Math.atan2(bp.y-t.y,bp.x-t.x);
        G.bullets.push({x:t.x,y:t.y-10,ax:bp.x,ay:bp.y,tx:best,ang:ang,
          speed:t.type==='cannon'?300:420, dmg:def.dmg[t.level]*dm,
          kind:t.type, splash:def.splash?def.splash[t.level]:0,
          slow:def.slow||0, life:2, hit:false});
        G.shots++;
        puff(t.x+Math.cos(ang)*14,t.y-10+Math.sin(ang)*14,'rgba(170,170,170,0.5)',4);
      }
    }
    for(const b of G.bullets){
      b.life-=dt;
      if(b.tx&&!b.tx.dead){const tp=pointAt(b.tx.d);b.ax=tp.x;b.ay=tp.y;}
      const dx=b.ax-b.x, dy=b.ay-b.y;
      const dd=Math.hypot(dx,dy)||1;
      const step=b.speed*dt;
      if(dd<=step+6){
        b.hit=true;
        if(b.splash){
          for(const e of G.enemies){
            const ep=pointAt(e.d);
            if(dist(b.x,b.y,ep.x,ep.y)<=b.splash)damageEnemy(e,b.dmg*.7+(e===b.tx?b.dmg*.3:0));
          }
          ring(b.x,b.y,b.splash,'#e8a05a');
        }else if(b.tx&&!b.tx.dead){
          damageEnemy(b.tx,b.dmg);
          if(b.slow)b.tx.slow=b.slow;
          puff(b.x,b.y,b.kind==='frost'?'#bfe8ff':'#e8d0a0',5);
        }
      }else{
        b.x+=dx/dd*step; b.y+=dy/dd*step;
        b.ang=Math.atan2(dy,dx);
      }
    }
    G.bullets=G.bullets.filter(function(b){return !b.hit&&b.life>0;});
    G.enemies=G.enemies.filter(function(e){return !e.dead;});
    if(!G.spawnQueue.length&&!G.enemies.length)waveCleared();
  }
}

function burst(x,y,color,n){for(let i=0;i<n;i++){const a=rnd()*TAU,s=30+rnd()*90;
  G.particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+rnd()*.5,color:color,r:1.5+rnd()*2.5});}}
function puff(x,y,color,n){for(let i=0;i<n;i++){const a=rnd()*TAU,s=10+rnd()*30;
  G.particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-10,life:.25+rnd()*.3,color:color,r:1+rnd()*2});}}
function ring(x,y,r,color){G.particles.push({x:x,y:y,vx:0,vy:0,life:.35,color:color,ring:true,r:6,rmax:r});}
function updateFx(dt){
  for(const p of G.particles){p.life-=dt;p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;if(p.ring)p.r=lerp(p.r,p.rmax,dt*10);}
  G.particles=G.particles.filter(function(p){return p.life>0;});
  for(const t of G.texts){t.t-=dt;t.y+=t.vy*dt;}
  G.texts=G.texts.filter(function(t){return t.t>0;});
}

  CTX.fillStyle='#1a2436';rr(x,y,w,h,8);CTX.fill();

  CTX.fillStyle=on?'#ffd76a':'#6a7488';CTX.font='bold 16px system-ui';CTX.textAlign='center';
  CTX.fillText('HINT (H)',x+w/2,y+34);CTX.textAlign='left';
  if(on)hit('hint',x,y,w,h,showHint);
}
function drawCommand(){
  CTX.fillStyle='#0e1420';CTX.fillRect(0,CMD_Y,FW,CMD_H);
  if(G.phase!=='playing'||!G.question){
    CTX.fillStyle='#5a6478';CTX.font='14px system-ui';
    CTX.fillText(G.wave===0?'Press START to open wave 1 — its Command Panel question will appear here.'
      :'Between waves: build, upgrade, or press START.',16,CMD_Y+26);
    if(G.hintTimer>0&&G.hintMsg){
      CTX.fillStyle='#cbb99b';CTX.font='italic 14px system-ui';
      CTX.fillText('hint: '+G.hintMsg,16,CMD_Y+48);
    }
    return;
  }
  CTX.fillStyle='#ffd76a';CTX.font='bold 13px system-ui';
  CTX.fillText('COMMAND PANEL — answer to power the towers:',14,CMD_Y+20);
  CTX.fillStyle='#fff';CTX.font='bold 20px system-ui';
  CTX.fillText(G.question.prompt,14,CMD_Y+44);
  if(G.question.note){CTX.fillStyle='#8a94a8';CTX.font='12px system-ui';
    CTX.fillText(G.question.note,14,CMD_Y+60);}
  const bw=178,bh=30,gap=6,x0=14;
  for(let i=0;i<4;i++){
    const bx=x0+i*(bw+gap), by=CMD_Y+66;
    if(G.answered){
      const right=i===G.question.answerIndex;
      CTX.fillStyle=right?'#3a7d4f':'#5a3430';rr(bx,by,bw,bh,6);CTX.fill();
    }else{
      CTX.fillStyle='#1f2a3d';rr(bx,by,bw,bh,6);CTX.fill();
      CTX.strokeStyle='#3a4a66';CTX.lineWidth=1.5;CTX.stroke();
      hit('cmd_'+i,bx,by,bw,bh,function(){answerPanel(i);});
    }
    CTX.fillStyle=G.answered?(i===G.question.answerIndex?'#c8f0d0':'#e0b0a8'):'#e8e2d0';
    CTX.font='bold 13px system-ui';
    const label=String.fromCharCode(65+i)+') '+G.question.options[i];
    CTX.fillText(label.length>27?label.slice(0,26)+'…':label,bx+8,by+20);
  }
  if(G.hintTimer>0&&G.hintMsg){
    CTX.fillStyle='#cbb99b';CTX.font='italic 13px system-ui';
    CTX.fillText('hint: '+G.hintMsg,14,CMD_Y+30);
  }
}
function drawShop(){
  CTX.fillStyle='rgba(6,10,16,.85)';CTX.fillRect(0,0,W,H);
  CTX.textAlign='center';
  CTX.fillStyle='#8fe8a0';CTX.font='bold 30px system-ui';
  CTX.fillText('WAVE '+G.wave+' CLEARED — ARMORY',W/2,140);
  CTX.fillStyle='#c8d0e0';CTX.font='16px system-ui';
  CTX.fillText('spend gold before the next wave',W/2,172);
  CTX.textAlign='left';
  SHOP.forEach(function(s,i){
    const x=W/2-260,y=210+i*90,w=520,h=74;
    CTX.fillStyle='#16202e';rr(x,y,w,h,10);CTX.fill();
    CTX.strokeStyle='#2a3a4c';CTX.lineWidth=2;CTX.stroke();
    CTX.fillStyle='#e8e2d0';CTX.font='bold 18px system-ui';
    CTX.fillText(s.name,x+18,y+30);
    CTX.fillStyle='#8a94a8';CTX.font='14px system-ui';
    CTX.fillText(s.desc,x+18,y+54);
    CTX.fillStyle=G.gold>=s.cost?'#ffd76a':'#7a5a4a';CTX.font='bold 18px system-ui';
    CTX.fillText('◎'+s.cost,x+w-90,y+44);
    hit('shop_'+s.id,x,y,w,h,function(){buy(s.id);});
  });
  const x=W/2-140,y=500,w=280,h=64;
  CTX.fillStyle='#3a7d4f';rr(x,y,w,h,12);CTX.fill();
  CTX.strokeStyle='#8fe8a0';CTX.lineWidth=2;CTX.stroke();
  CTX.fillStyle='#fff';CTX.font='bold 22px system-ui';CTX.textAlign='center';
  CTX.fillText('NEXT WAVE',W/2,y+40);
  hit('shop_close',x,y,w,h,function(){closeShop();});
  CTX.textAlign='left';
}
function drawEnd(){
  CTX.fillStyle='rgba(6,10,16,.9)';CTX.fillRect(0,0,W,H);
  CTX.textAlign='center';
  const won=G.phase==='victory';
  CTX.fillStyle=won?'#ffd76a':'#e05a4a';
  CTX.font='bold 48px system-ui';
  CTX.fillText(won?'VICTORY!':'GAME OVER',W/2,200);
  CTX.fillStyle='#e8e2d0';CTX.font='22px system-ui';
  CTX.fillText(G.endMsg,W/2,248);
  CTX.fillText('waves survived '+Math.min(G.wave,WAVE_COUNT)+'/'+WAVE_COUNT+'   ·   kills '+G.kills,W/2,286);
  if(won){
    for(let i=0;i<3;i++){
      star(W/2-70+i*70,340,26,i<G.stars?'#ffd76a':'#39435a');
    }
  }
  const m=meta();
  CTX.fillStyle='#8a94a8';CTX.font='16px system-ui';
  CTX.fillText('career: '+m.wins+' wins / '+m.matches+' matches',W/2,396);
  const rp=LK.report('session');
  if(rp.answered){CTX.fillStyle='#c8d0e0';CTX.font='15px system-ui';
    CTX.fillText('this game: '+rp.answered+' answers, '+rp.acc+'% right — details under FOR GROWN-UPS',W/2,428);}
  const x=W/2-160,y=460,w=320,h=62;
  CTX.fillStyle='#3a5a7d';rr(x,y,w,h,12);CTX.fill();
  CTX.strokeStyle='#8fb8e0';CTX.lineWidth=2;CTX.stroke();
  CTX.fillStyle='#fff';CTX.font='bold 22px system-ui';
  CTX.fillText('PLAY AGAIN',W/2,y+39);
  hit('end_again',x,y,w,h,function(){startGame(G.mode,G.map);});
  const mx=W/2-160,my=540,mw=320,mh=48;
  CTX.fillStyle='#1a2436';rr(mx,my,mw,mh,10);CTX.fill();
  CTX.fillStyle='#c8d0e0';CTX.font='bold 16px system-ui';
  CTX.fillText('BACK TO MENU',W/2,my+30);
  hit('end_menu',mx,my,mw,mh,function(){G.phase='menu';});
  const gx=W/2-160,gy=598,gw=320,gh=40;
  CTX.fillStyle='#1a2436';rr(gx,gy,gw,gh,10);CTX.fill();
  CTX.strokeStyle='#39435a';CTX.lineWidth=2;CTX.stroke();
  CTX.fillStyle='#c8d0e0';CTX.font='bold 15px system-ui';
  CTX.fillText('FOR GROWN-UPS',W/2,gy+26);
  hit('end_grown',gx,gy,gw,gh,openGrown);
  CTX.textAlign='left';
}
function star(x,y,r,color){
  CTX.fillStyle=color;CTX.beginPath();
  for(let i=0;i<10;i++){
    const a=-Math.PI/2+i*Math.PI/5, rad=i%2?r*.45:r;
    CTX.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);
  }
  CTX.closePath();CTX.fill();
}

/* ─────────────────────────── input ─────────────────────────── */
/* scale the fixed-resolution canvas up to fill the window (clicks already map via getBoundingClientRect) */
let SCALE=1;
function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H), d=Math.min(devicePixelRatio||1,2);
  CVS.style.width=(W*s)+'px';CVS.style.height=(H*s)+'px';
  /* crisp: backing store = CSS size x min(devicePixelRatio, 2) */
  const bw=Math.round(W*s*d), bh=Math.round(H*s*d);
  if(CVS.width!==bw||CVS.height!==bh){CVS.width=bw;CVS.height=bh;}
  SCALE=bw/W;
}
addEventListener('resize',fit);fit();

const mouse={x:0,y:0};
CVS.addEventListener('mousemove',function(e){
  const r=CVS.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*(W/r.width);
  mouse.y=(e.clientY-r.top)*(H/r.height);
  G.hoverCell=[Math.floor((mouse.x-FX)/CELL),Math.floor((mouse.y-FY)/CELL)];
});
CVS.addEventListener('click',function(e){
  const r=CVS.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*(W/r.width); mouse.y=(e.clientY-r.top)*(H/r.height);
  for(const h of hits){
    if(mouse.x>=h.x&&mouse.x<h.x+h.w&&mouse.y>=h.y&&mouse.y<h.y+h.h){h.fn();return;}
  }
  if(G.phase==='playing'){
    const cx=Math.floor((mouse.x-FX)/CELL), cy=Math.floor((mouse.y-FY)/CELL);
    if(cx>=0&&cx<COLS&&cy>=0&&cy<ROWS){
      const ped=G.pedestals.find(function(p){return p.cx===cx&&p.cy===cy;});
      if(ped&&G.selected==='answer'){placeAnswerTurret(ped.id);return;}
      const t=G.towers.find(function(t){return t.type!=='answer'&&t.cx===cx&&t.cy===cy;});
      if(t){G.selTower=t;G.selected=null;return;}
      if(G.selected&&G.selected!=='answer'){
        const ok=placeTower(cx,cy,G.selected);
        if(!ok&&G.gold<TOWERS[G.selected].cost)flash('not enough gold','#e07a6a');
      }
    }
  }
});


/* ═══════════ arcade glue: hints, grown-up report, first-run coach ═══════════ */
function sdkState(o){try{window.ArcadeSDK&&ArcadeSDK.state(o);}catch(e){}}
/* a hint that teaches the rule in play, never names the answer */
function currentHint(){
  if(G.phase==='menu')return 'Pick an age band and a mode, then DEFEND THE CASTLE.';
  if(G.phase==='shop')return 'Repair if your hearts are low; a Focus Token turns one wrong answer into an overcharge.';
  if(G.phase==='gameover'||G.phase==='victory')return 'PLAY AGAIN on the same map, or try another map from the menu.';
  const q=G.question;
  if(q&&!G.answered&&G.waveActive){
    if(G.mode==='math')return LK.mathHint(q.prompt,q.note);
    const n=q.answer.length;
    return 'Read the sentence out loud with each word in the gap: only one makes sense. The missing word has '+n+' letters.';
  }
  if(G.golemAlive&&G.pedestals.some(function(p){return !p.armed;}))
    return 'A Quiz Golem is marching: choose Answer Turret, then tap the pedestal (A to D) that matches the right answer to double its loot.';
  if(!G.waveActive)return G.towers.some(function(t){return t.type!=='answer';})
    ?'Upgrade towers near the bends of the path, then press START.':'Choose Arrow on the right, then tap a grass square beside the path. Press START when ready.';
  return 'Frost towers slow runners; cannons splash groups at the bends.';
}
let hintLeft=0;
function showHint(){
  const t=currentHint(), el=document.getElementById('hintBox');
  el.innerHTML='<b>HINT</b> — '+t; el.classList.add('show'); hintLeft=9;
  const r=CVS.getBoundingClientRect(), h=el.offsetHeight;
  /* above the command panel, so the question and its answers stay in view */
  el.style.top=Math.max(8,r.top+(CMD_Y-8)*r.height/H-h)+'px';
  return t;
}
function hintTick(dt){if(hintLeft>0){hintLeft-=dt;if(hintLeft<=0||G.phase==='menu')document.getElementById('hintBox').classList.remove('show');}}
addEventListener('keydown',function(e){
  if(e.key==='h'||e.key==='H'){showHint();return;}
  if(document.getElementById('grown').classList.contains('show')){if(e.key==='Enter')closeGrown();return;}
  /* the menu, the armory and the end screen work from the keyboard too */
  if(G.phase==='menu'){
    if(e.key==='Enter'){e.preventDefault();startGame(G.mode,G.map);}
    else if(e.key==='1')G.mode='math';
    else if(e.key==='2')G.mode='spell';
    else if(e.key==='m'||e.key==='M')G.map=(G.map+1)%MAPS.length;
    else if(e.key==='b'||e.key==='B')LK.setBand(LK.BANDS[(LK.bandIndex()+1)%LK.BANDS.length].id);
    else if(e.key==='g'||e.key==='G')openGrown();
    else if(e.key==='t'||e.key==='T')coachStart();
  }else if(G.phase==='shop'){
    if(e.key==='Enter'){e.preventDefault();closeShop();}
    else if(e.key==='1')buy('repair');else if(e.key==='2')buy('focus');else if(e.key==='3')buy('bricks');
  }else if(G.phase==='gameover'||G.phase==='victory'){
    if(e.key==='Enter'){e.preventDefault();startGame(G.mode,G.map);}
  }else if(G.phase==='playing'){
    if(e.key===' '&&!G.waveActive){e.preventDefault();startWave();}
    else if(G.question&&!G.answered&&G.waveActive&&e.key>='1'&&e.key<='4')answerPanel(+e.key-1);
  }
});
function openGrown(){
  const end=G.phase==='gameover'||G.phase==='victory';
  document.getElementById('grownBody').innerHTML=LK.reportHTML(end?'session':'all')+
    (end?'<p class="lk-p" style="color:#8a94a8">All-time report: FOR GROWN-UPS on the menu.</p>':'');
  document.getElementById('grown').classList.add('show');document.getElementById('grownBack').focus();
}
function closeGrown(){document.getElementById('grown').classList.remove('show');}
document.getElementById('grownBack').addEventListener('click',closeGrown);
document.getElementById('anyway').addEventListener('click',function(){document.body.classList.add('anyway');});

/* first-run coach: learn by doing; skippable, replayable */
const COACH=[
  {t:'Choose <b>Arrow</b> on the right, then tap a grass square beside the path to build it.',done:function(){return G.towers.some(function(t){return t.type!=='answer';});}},
  {t:'Press <b>START</b> (top bar) to send wave 1.',done:function(){return G.wave>=1;}},
  {t:'Answer the <b>Command Panel</b> question at the bottom: right = OVERCHARGE, wrong = SPUTTER. Stuck? <b>HINT</b>.',done:function(){return G.answered||G.wave>=2;}},
  {t:'Purple <b>?</b> golems take extra hits: arm the pedestal with the right answer to double their loot.',done:function(){return G.phase==='shop'||coachT>9;}},
];
let coachIx=-1,coachT=0;
function coachPaint(){
  const el=document.getElementById('coach');
  if(coachIx<0||coachIx>=COACH.length||G.phase==='menu'){el.classList.remove('show');return;}
  document.getElementById('coachStep').textContent='HOW TO DEFEND · '+(coachIx+1)+' OF '+COACH.length;
  document.getElementById('coachText').innerHTML=COACH[coachIx].t;
  el.classList.add('show');
  const r=CVS.getBoundingClientRect(),h=el.offsetHeight;
  el.style.top=(r.top>=h+16?r.top-h-8:r.top+70*r.height/H)+'px';
}
function coachStart(){if(G.phase!=='playing')startGame(G.mode,G.map);coachIx=0;coachT=0;coachPaint();}
function coachEnd(){coachIx=-1;coachPaint();try{localStorage.setItem('qt_tut','1');}catch(e){}try{window.ArcadeSDK&&ArcadeSDK.event('tutorial-done');}catch(e){}}
function coachTick(dt){
  if(coachIx<0)return;
  if(G.phase==='menu'||G.phase==='gameover'||G.phase==='victory'){coachIx=-1;coachPaint();return;}
  if(coachIx===COACH.length-1)coachT+=dt;
  const was=coachIx;
  while(coachIx<COACH.length&&COACH[coachIx].done()){coachIx++;coachT=0;}
  if(coachIx>=COACH.length)coachEnd();else if(was!==coachIx)coachPaint();
}
document.getElementById('coachSkip').addEventListener('click',coachEnd);
addEventListener('resize',function(){if(coachIx>=0)coachPaint();});
const _startGame=startGame;
startGame=function(mode,mapIdx){_startGame(mode,mapIdx);let seen=false;try{seen=localStorage.getItem('qt_tut')==='1';}catch(e){}if(!seen&&coachIx<0){coachIx=0;coachT=0;coachPaint();}};
let lastPhase='';
function watchPhase(){if(G.phase===lastPhase)return;lastPhase=G.phase;if(G.phase==='menu'){closeGrown();sdkState({scene:'title'});}}

if(window.ArcadeSDK)ArcadeSDK.init({
  pauseButton:'tr',
  onRestart:function(){closeGrown();startGame(G.mode,G.map);},
  onExit:function(){closeGrown();coachIx=-1;coachPaint();G.phase='menu';},
  onTutorial:coachStart,
  onHint:function(){return showHint();},
});

/* ─────────────────────────── debug hook ─────────────────────────── */
window.__tower_debug={
  wipe:function(){try{localStorage.removeItem(META_KEY);}catch(e){}},
  meta:function(){return meta();},
  start:function(mode,mapIdx){startGame(mode||'math',mapIdx===undefined?0:mapIdx);},
  startWave:function(){startWave();},
  state:function(){
    return {
      phase:G.phase, mode:G.mode, map:G.map, wave:G.wave,
      hp:G.hp, maxHp:G.maxHp, gold:Math.floor(G.gold),
      towers:G.towers.length, enemies:G.enemies.length,
      enemiesData:G.enemies.map(function(e){return {type:e.type,hp:e.hp,prog:e.d/pathLen};}),
      power:G.power, fireIntervalMul:fireIntervalMul(), dmgMul:dmgMul(),
      question:G.question?{prompt:G.question.prompt,options:G.question.options,
                           answerIndex:G.question.answerIndex}:null,
      answered:G.answered, hint:G.hintMsg,
      pedestals:G.pedestals.map(function(p){return {armed:p.armed,correct:p.correct,option:p.option};}),
      golemAlive:G.golemAlive, lastGolemLoot:G.lastGolemLoot,
      shots:G.shots, kills:G.kills, waveActive:G.waveActive,
      shopOpen:G.phase==='shop', stars:G.stars, focusToken:G.focusToken,
      time:G.time, fps:G.fps,
      selType:G.selected, selTowerLevel:G.selTower?G.selTower.level:null,
      mapName:MAPS[G.map]?MAPS[G.map].name:'',
    };
  },
  placeTower:function(cx,cy,type){return placeTower(cx,cy,type);},
  placeAnswer:function(pedId){return placeAnswerTurret(pedId);},
  answer:function(i){answerPanel(i);},
  buy:function(id){return buy(id);},
  closeShop:function(){closeShop();},
  upgradeSel:function(){return G.selTower?upgradeTower(G.selTower):false;},
  selectTowerAt:function(cx,cy){
    const t=G.towers.find(function(t){return t.type!=='answer'&&t.cx===cx&&t.cy===cy;});
    G.selTower=t||null; return !!t;},
  sellSel:function(){return sellTower(G.selTower);},
  killAll:function(){killAll();},
  hurtCastle:function(n){hurtCastle(n);},
  teleportEnemy:function(idx,prog){
    const e=G.enemies[idx]; if(!e)return false;
    e.d=clamp(prog,0,.9999)*pathLen; return true;},
  damageEnemy:function(idx,n){const e=G.enemies[idx];if(!e)return false;
    damageEnemy(e,n);G.enemies=G.enemies.filter(function(x){return !x.dead;});return true;},
  setGold:function(n){G.gold=n;},
};

/* ─────────────────────────── main loop ─────────────────────────── */
buildPath(0);
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  update(dt);
  draw();
  coachTick(dt); hintTick(dt); watchPhase();
  G.fpsT+=dt;
  if(G.fpsT>=.5){G.fps=Math.round(G.frames/G.fpsT);G.frames=0;G.fpsT=0;}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
