<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../assets/arcade-sdk.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c1410">
<link rel="icon" href="data:,">
<title>Quiz Tower Defense</title>
<style>
  @font-face{font-family:"Fredoka";src:url("../assets/fonts/fredoka.woff2") format("woff2");font-weight:300 700;font-display:swap}
  @font-face{font-family:"Nunito";src:url("../assets/fonts/nunito.woff2") format("woff2");font-weight:400 900;font-display:swap}
/*@kidlookcss*/
/* KL css: the same surfaces as the canvas kit, for DOM panels: parchment, wood with gold trim, navy glass, glossy buttons */
:root{--kl-ink:#4a2d12;--kl-ink2:#7a5428;--kl-cream:#fff3d2;--kl-gold:#ffe7a0;--kl-goldd:#b8781a;--kl-font:"Fredoka","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;
  --kl-grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='4'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
.kl-parch,.kl-wood,.kl-glass{position:relative;font-family:var(--kl-font)}
.kl-parch::before,.kl-wood::before,.kl-glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background-image:var(--kl-grain);mix-blend-mode:overlay;opacity:.32}
.kl-parch{background:linear-gradient(180deg,#f9edcb,#efdaa9 55%,#e0c68e);border:1px solid #b88a4a;border-radius:18px;color:var(--kl-ink);
  box-shadow:0 10px 26px rgba(30,14,4,.5),inset 0 0 0 2px rgba(255,255,255,.35),inset 0 0 36px rgba(130,88,34,.42)}
.kl-wood{background:repeating-linear-gradient(180deg,rgba(255,224,176,.05) 0 1px,rgba(20,8,2,.07) 1px 3px),linear-gradient(180deg,#a2703f,#77492a 45%,#54301a);border-radius:16px;color:var(--kl-cream);
  box-shadow:inset 0 0 0 2px #e2b040,inset 0 0 0 3px #6b430a,inset 0 3px 0 4px rgba(255,236,200,.12),0 8px 20px rgba(0,0,0,.5)}
.kl-glass{background:linear-gradient(180deg,#2a4674,#132546 55%,#0b1730);border:1px solid rgba(190,215,255,.32);border-radius:16px;color:var(--kl-gold);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 18px rgba(0,0,0,.5)}
.kl-btn{font-family:var(--kl-font);font-weight:700;cursor:pointer;color:#4a2c08;border:1px solid #6b430a;border-radius:15px;padding:0 18px;min-height:48px;letter-spacing:.2px;
  background:linear-gradient(180deg,#ffe89a,#e8b338 52%,#a8721a);text-shadow:0 1px 0 rgba(255,246,214,.75);
  box-shadow:0 4px 0 #6b430a,0 8px 14px rgba(20,8,2,.45),inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 0 rgba(120,70,8,.35);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.kl-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6b430a,0 3px 8px rgba(20,8,2,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.kl-btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.kl-btn.green{color:#f4ffe8;border-color:#1d4a19;background:linear-gradient(180deg,#b7ec8c,#58ad46 52%,#2f7229);text-shadow:0 1px 1px rgba(20,60,16,.8);box-shadow:0 4px 0 #1d4a19,0 8px 14px rgba(20,8,2,.45),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(20,60,16,.35)}
.kl-btn.blue{color:#eef8ff;border-color:#173d6b;background:linear-gradient(180deg,#a6d6f8,#4a8fd0 52%,#2760a0);text-shadow:0 1px 1px rgba(10,30,70,.8);box-shadow:0 4px 0 #173d6b,0 8px 14px rgba(20,8,2,.45),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(10,30,70,.35)}
.kl-btn.coral{color:#fff4ee;border-color:#5e1d0f;background:linear-gradient(180deg,#f8b39a,#d9603f 52%,#9a3520);text-shadow:0 1px 1px rgba(70,16,6,.8);box-shadow:0 4px 0 #5e1d0f,0 8px 14px rgba(20,8,2,.45),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(70,16,6,.35)}
.kl-btn.wood{color:var(--kl-cream);border-color:#341e0b;background:linear-gradient(180deg,#b98657,#8a5a30 52%,#5a3719);text-shadow:0 1px 1px rgba(30,14,4,.8);box-shadow:0 4px 0 #341e0b,0 8px 14px rgba(20,8,2,.45),inset 0 1px 0 rgba(255,236,200,.4),inset 0 -2px 0 rgba(30,14,4,.4)}
.kl-btn.cream{border-color:#7a5a2a;background:linear-gradient(180deg,#fffaf0,#f0e2c4 52%,#d4b988);box-shadow:0 4px 0 #7a5a2a,0 8px 14px rgba(20,8,2,.4),inset 0 1px 0 #fff,inset 0 -2px 0 rgba(120,80,30,.25)}
.kl-btn.plum{color:#fbf2ff;border-color:#3b2260;background:linear-gradient(180deg,#d8b8f0,#9a64c8 52%,#623e92);text-shadow:0 1px 1px rgba(40,16,70,.8);box-shadow:0 4px 0 #3b2260,0 8px 14px rgba(20,8,2,.45),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(40,16,70,.35)}
.kl-btn:disabled,.kl-btn[disabled]{filter:grayscale(.7) brightness(.8);cursor:default;transform:none}
.kl-title{font-family:var(--kl-font);font-weight:700;background:linear-gradient(180deg,#fff4b0,#f0c040 55%,#c08a20);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 0 rgba(30,6,12,.75)) drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.kl-trough{height:12px;border-radius:8px;background:rgba(110,70,26,.32);box-shadow:inset 0 2px 3px rgba(60,30,8,.45);overflow:hidden}
.kl-trough>i{display:block;height:100%;border-radius:8px;background:linear-gradient(180deg,#b6ea86,#58ad46 60%,#3f8f3a);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.kl-trough.gold>i{background:linear-gradient(180deg,#ffe28a,#e8b338 60%,#c08a20)}
/*@end*/

  html,body{margin:0;padding:0;height:100%;background:#140e0a;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center;font-family:"Nunito","Fredoka",system-ui,sans-serif}
  canvas{display:block;background:#140e0a;touch-action:none}
  #coach,#grown{position:fixed;z-index:12;font:15px/1.45 "Fredoka",system-ui,sans-serif}
  #coach{display:none;left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 24px));padding:10px 12px;gap:10px;align-items:center;box-sizing:border-box}
  #coach.show{display:flex}
  #coach b{color:#ffd76a}
  #coach .st{font-size:12px;color:#c9b98a;letter-spacing:1px}
  #coach .kl-btn{min-height:44px;padding:0 14px}
  #grown{display:none;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;padding:16px 18px;box-sizing:border-box;color:var(--kl-ink)}
  #grown.show{display:block}
  /* DOM progression strip: keep level, stars, maps and the daily goal readable over the canvas */
  #qtprog{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:9;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
    font:700 13px Fredoka,system-ui,sans-serif;pointer-events:none;max-width:calc(100vw - 16px)}
  #qtprog span{background:rgba(24,14,8,.82);border:1px solid rgba(230,200,140,.45);border-radius:14px;padding:3px 10px;color:#ffe7a0;white-space:nowrap}
  #grown h2{margin:0 0 4px;color:#a03a10;font-size:22px}
  .lk-p{margin:6px 0;color:var(--kl-ink2);font-size:14px;font-weight:700}
  .lk-p b{color:var(--kl-ink)}
  .lk-next{color:#2f6d2a}
  .lk-t{width:100%;border-collapse:collapse;font-size:14px;color:var(--kl-ink)}
  .lk-t td{padding:4px;border-bottom:1px solid rgba(110,70,26,.25)}
  .lk-t td+td{text-align:right;width:56px;color:var(--kl-ink2)}
</style>
</head>
<body>
<canvas id="cv" width="1100" height="640"></canvas>
<div id="qtprog" aria-hidden="true"></div>
<div id="coach" class="kl-glass" role="status" aria-live="polite"><div style="flex:1"><div class="st" id="coachStep"></div><div id="coachText"></div></div>
  <button class="kl-btn cream" id="coachSkip">Skip</button></div>
<div id="grown" class="kl-parch" role="dialog" aria-label="For grown-ups"><h2>For grown-ups</h2>
  <div class="lk-p">what was practised, how accurate it was, and what to practise next</div>
  <div id="grownBody"></div><div style="text-align:center;margin-top:10px"><button class="kl-btn cream" id="grownBack">Back</button></div></div>
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   QUIZ TOWER DEFENSE: a lane tower defence where knowledge powers the towers.
   Answer the question to overcharge every tower; build on the glowing pads; golems carry
   collectible cards; five maps unlock with stars; a daily goal and a streak keep it fresh.
   Single file, Canvas 2D, zero network. All art is drawn in code with the warm "rich look"
   kit (KL): stone, wood, gold, parchment and torch-and-sun light.
   The question core (tiered maths + teaching hints, spelling with sentence clues) is
   extracted from Spell & Maths Galaxy and reused unchanged.
   ═══════════════════════════════════════════════════════════════════════ */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=1100;const H=640;   /* the view is 640 tall and as wide as the screen allows (1100..1400), so a phone held sideways is filled */
let SCALE=1,TMIN=14;
const TAU=Math.PI*2;
function fit(){
  const ar=innerWidth/Math.max(1,innerHeight);
  W=Math.round(clamp(H*ar,1100,1400));
  const s=Math.min(innerWidth/W,innerHeight/H);
  let d=Math.min(devicePixelRatio||1,2);
  /* never ask a huge screen for a huge backing store: cap it at about 2.7 million pixels */
  const px=W*s*d*(H*s*d);if(px>2.7e6)d*=Math.sqrt(2.7e6/px);
  cv.style.width=Math.round(W*s)+'px';cv.style.height=Math.round(H*s)+'px';
  const bw=Math.round(W*s*d),bh=Math.round(H*s*d);
  if(cv.width!==bw||cv.height!==bh){cv.width=bw;cv.height=bh;}
  SCALE=bw/W;
  TMIN=Math.min(30,Math.ceil(14/Math.max(.3,s)));   /* no text smaller than 14 CSS px, whatever the phone's scale */
  if(typeof KL!=='undefined')KL.dpr(SCALE);
  if(typeof resetSprites==='function')resetSprites();
  if(typeof layout==='function')layout();
}
const SDK=window.ArcadeSDK||null;
/* the arcade SDK can reject a sound it fails to decode: a rejected promise must never be an error page */
window.addEventListener('unhandledrejection',e=>{try{if(e.reason&&/decod|encoding/i.test(String(e.reason.message||e.reason.name||e.reason)))e.preventDefault();}catch(_){}});
const kitSfx=(n,o)=>{try{if(SDK&&SDK.sfx)SDK.sfx(n,o||{});}catch(e){}};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dayBefore=iso=>{const [y,m,d]=iso.split('-').map(Number);const t=new Date(y,m-1,d-1);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};

/*@kidlook*/
/* KL: a small canvas "rich look" kit. Warm light, layered depth, real-feeling surfaces (wood, parchment, gold, navy glass),
   built from gradients and seeded noise, cached as sprites so a phone draws them with drawImage. No outlines-as-style. */
const KL=(function(){
  'use strict';
  const TAU=Math.PI*2, K={}, cache=new Map();
  /* a sprite cache with a ceiling: sizes that vary (bars, panels) can never grow it without limit */
  const _cset=cache.set;cache.set=function(k,v){if(this.size>=240)this.delete(this.keys().next().value);return _cset.call(this,k,v);};
  let DPR=1;
  K.cache=cache;
  K.dpr=function(d){if(d!==undefined&&d!==DPR){DPR=d;cache.clear();grainT=null;}return DPR;};
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  K.clamp=clamp;
  K.rng=function(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296;};};
  /* ---- colour ---- */
  function h2r(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
  function r2h(r,g,b){const f=v=>('0'+Math.round(clamp(v,0,255)).toString(16)).slice(-2);return'#'+f(r)+f(g)+f(b);}
  K.mix=function(a,b,t){const A=h2r(a),B=h2r(b);return r2h(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);};
  K.lit=function(h,a){return K.mix(h,'#fff3d6',a);};      /* light goes warm */
  K.dark=function(h,a){return K.mix(h,'#241a4a',a);};     /* shadow goes cool and violet, never grey */
  K.rgba=function(h,a){const c=h2r(h);return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';};
  K.make=function(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*DPR));c.height=Math.max(1,Math.round(h*DPR));const g=c.getContext('2d');g.scale(DPR,DPR);return{c,g,w,h};};
  function rp(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
  K.rp=rp;
  /* ---- grain: one small noise tile, laid over surfaces with a blend mode ---- */
  let grainT=null;
  function grainTile(){
    if(grainT)return grainT;const s=96,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d'),id=g.createImageData(s,s),R=K.rng(11);
    for(let i=0;i<s*s;i++){const v=128+(R()-.5)*110+(R()<.03?(R()-.5)*90:0);id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=255;}
    g.putImageData(id,0,0);grainT=c;return c;
  }
  K.grain=function(g,x,y,w,h,alpha,mode){g.save();g.globalCompositeOperation=mode||'overlay';g.globalAlpha=alpha;g.fillStyle=g.createPattern(grainTile(),'repeat');g.fillRect(x,y,w,h);g.restore();};
  /* ---- surfaces ---- */
  K.wood=function(g,x,y,w,h,base,seed){
    base=base||'#7b4b27';const R=K.rng(seed||3);
    const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,K.lit(base,.16));gr.addColorStop(.45,base);gr.addColorStop(1,K.dark(base,.32));g.fillStyle=gr;g.fillRect(x,y,w,h);
    g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
    const n=Math.max(10,Math.round(h/2.6));
    for(let i=0;i<n;i++){const yy=y+R()*h,amp=.6+R()*2.2,ph=R()*6,f=.006+R()*.02;
      g.strokeStyle=R()<.55?'rgba(38,18,6,'+(.05+R()*.15)+')':'rgba(255,214,160,'+(.03+R()*.08)+')';g.lineWidth=.5+R()*1.5;g.beginPath();
      for(let xx=0;xx<=w;xx+=10){const yv=yy+Math.sin(xx*f+ph)*amp;xx?g.lineTo(x+xx,yv):g.moveTo(x,yv);}g.stroke();}
    const knots=Math.round(w/200);
    for(let k=0;k<knots;k++){const kx=x+R()*w,ky=y+h*(.25+R()*.5),kr=3+R()*5;const kg=g.createRadialGradient(kx,ky,0,kx,ky,kr*2);kg.addColorStop(0,K.rgba('#2a1206',.55));kg.addColorStop(.5,K.rgba('#3a1c0a',.25));kg.addColorStop(1,K.rgba('#3a1c0a',0));g.fillStyle=kg;g.beginPath();g.ellipse(kx,ky,kr*2.4,kr*1.1,0,0,TAU);g.fill();}
    g.restore();K.grain(g,x,y,w,h,.16,'overlay');
  };
  K.parch=function(g,x,y,w,h,seed,tone){
    const R=K.rng(seed||5);tone=tone||'#f1e0b8';
    const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,K.lit(tone,.32));gr.addColorStop(1,K.dark(tone,.08));g.fillStyle=gr;g.fillRect(x,y,w,h);
    g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
    for(let i=0;i<Math.round(w*h/2600);i++){const sx=x+R()*w,sy=y+R()*h,sr=8+R()*26,sg=g.createRadialGradient(sx,sy,0,sx,sy,sr);sg.addColorStop(0,'rgba(150,105,45,'+(.04+R()*.07)+')');sg.addColorStop(1,'rgba(150,105,45,0)');g.fillStyle=sg;g.beginPath();g.arc(sx,sy,sr,0,TAU);g.fill();}
    for(let i=0;i<Math.round(w*h/900);i++){const fx=x+R()*w,fy=y+R()*h,a=R()*TAU,l=3+R()*9;g.strokeStyle=R()<.5?'rgba(120,80,30,.07)':'rgba(255,250,230,.12)';g.lineWidth=.6;g.beginPath();g.moveTo(fx,fy);g.lineTo(fx+Math.cos(a)*l,fy+Math.sin(a)*l);g.stroke();}
    const e=Math.min(22,Math.min(w,h)*.22),edge=(x0,y0,x1,y1,rx,ry,rw,rh)=>{const eg=g.createLinearGradient(x0,y0,x1,y1);eg.addColorStop(0,'rgba(110,68,22,.38)');eg.addColorStop(1,'rgba(110,68,22,0)');g.fillStyle=eg;g.fillRect(rx,ry,rw,rh);};
    edge(x,0,x+e,0,x,y,e,h);edge(x+w,0,x+w-e,0,x+w-e,y,e,h);edge(0,y,0,y+e,x,y,w,e);edge(0,y+h,0,y+h-e,x,y+h-e,w,e);
    g.restore();K.grain(g,x,y,w,h,.22,'multiply');
  };
  K.glass=function(g,x,y,w,h){
    const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'#26406a');gr.addColorStop(.55,'#122444');gr.addColorStop(1,'#0b1730');g.fillStyle=gr;g.fillRect(x,y,w,h);
    const gl=g.createLinearGradient(0,y,0,y+h*.5);gl.addColorStop(0,'rgba(190,215,255,.28)');gl.addColorStop(1,'rgba(190,215,255,0)');g.fillStyle=gl;g.fillRect(x,y,w,h*.5);
    K.grain(g,x,y,w,h,.10,'overlay');
  };
  /* a panel: rounded, lit from above-left, with a soft drop shadow. kind: parch | wood | plank | glass */
  K.panel=function(kind,w,h,o){
    o=o||{};const r=o.r!=null?o.r:Math.min(20,h*.22),pad=o.shadow===false?3:16,key='P|'+kind+'|'+Math.round(w)+'|'+Math.round(h)+'|'+r+'|'+(o.tone||'')+'|'+(o.gold?1:0)+'|'+DPR;
    const hit=cache.get(key);if(hit)return hit;
    const m=K.make(w+pad*2,h+pad*2),g=m.g;g.translate(pad,pad);
    if(o.shadow!==false){g.save();g.shadowColor='rgba(28,14,6,.5)';g.shadowBlur=14;g.shadowOffsetY=6;g.fillStyle='#000';rp(g,0,0,w,h,r);g.fill();g.restore();}
    g.save();rp(g,0,0,w,h,r);g.clip();
    if(kind==='parch')K.parch(g,0,0,w,h,w+h,o.tone);
    else if(kind==='wood')K.wood(g,0,0,w,h,o.tone||'#7b4b27',w*3+h);
    else if(kind==='plank')K.wood(g,0,0,w,h,o.tone||'#a8703c',w+h*7);
    else K.glass(g,0,0,w,h);
    /* bevel: light on the top-left edge, shade on the bottom-right */
    const bv=g.createLinearGradient(0,0,0,h);bv.addColorStop(0,'rgba(255,240,205,.34)');bv.addColorStop(.06,'rgba(255,240,205,0)');bv.addColorStop(.92,'rgba(20,8,2,0)');bv.addColorStop(1,'rgba(20,8,2,.34)');g.fillStyle=bv;g.fillRect(0,0,w,h);
    g.restore();
    /* trim */
    if(o.gold||kind==='glass'||kind==='wood'){
      const tg=g.createLinearGradient(0,0,w,h);tg.addColorStop(0,'#fff0b0');tg.addColorStop(.35,'#e2b040');tg.addColorStop(.7,'#a8741c');tg.addColorStop(1,'#f2cf6a');
      g.lineWidth=kind==='glass'?2:2.6;g.strokeStyle=tg;rp(g,1.4,1.4,w-2.8,h-2.8,r);g.stroke();
      g.lineWidth=1;g.strokeStyle='rgba(60,30,6,.55)';rp(g,.3,.3,w-.6,h-.6,r);g.stroke();
    }else{g.lineWidth=1.4;g.strokeStyle=kind==='parch'?'rgba(122,80,30,.65)':'rgba(30,14,4,.6)';rp(g,.7,.7,w-1.4,h-1.4,r);g.stroke();}
    const s={c:m.c,pad,w,h};cache.set(key,s);return s;
  };
  K.drawPanel=function(g,kind,x,y,w,h,o){const s=K.panel(kind,w,h,o);g.drawImage(s.c,x-s.pad,y-s.pad,w+s.pad*2,h+s.pad*2);};
  /* a glossy button. tone: gold | green | blue | coral | wood | cream */

let rnd = Math.random;
function rint(a,b){return a + Math.floor(rnd() * (b - a + 1));}
function pick(arr){return arr[Math.floor(rnd() * arr.length)];}
function shuf(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function dist(ax,ay,bx,by){return Math.hypot(bx-ax,by-ay);}

function mapRng(seed){return mulberry32(seed*7919+13);}

/* ═══════════ LEARNING KIT — age bands, teaching hints, a report for grown-ups ═══════════

   Every answer is logged against the skill it practised, so a grown-up can read

const LEARN=(function(){
  const BANDS=[

    'Multiply before adding':'In a two-step sum, do the × part first, then the +.',

                         :`Start at ${big} and count on ${small} more, one hop at a time.`;}

        if(q.b<10){const down=q.a%10;

        if(q.a===2||q.b===2)return `Times 2 is doubling: add ${q.a===2?q.b:q.a} to itself.`;
        if(q.a===5||q.b===5)return `Times 5 is half of times 10: work out ${q.a===5?q.b:q.a} × 10, then halve it.`;
        if(q.a===9||q.b===9){const o=q.a===9?q.b:q.a;return `Times 9: work out ${o} × 10, then take away one ${o}.`;}

      case '÷':
        return `How many groups of ${q.b} make ${q.a}? Think ${q.b} × ? = ${q.a}, or skip-count by ${q.b} until you reach ${q.a}.`;
      case 'two':

      case 'frac':

        if(q.p===25)return `25% is a quarter: halve ${q.t}, then halve it again.`;
        if(q.p===75)return `75% is three quarters: find a quarter of ${q.t}, then take three of them.`;
        if(q.p===10)return `10% means one tenth: share ${q.t} into 10 equal parts (${q.t} ÷ 10).`;

                                 :`Count up from ${q.a} to the next ten, then on in tens to ${q.t}.`;

  function spellHint(word,idx,clue){
    const W=String(word).toUpperCase(), n=W.length; idx=clampN(idx|0,0,n-1);

    if(idx===0)return `It starts with the letter ${c} and has ${n} letters. Say the word slowly and listen to each sound.`+tail;
    const pair=prev+c;
    if(TEAMS[pair])return `After “${so}”, ${prev} teams up with the next letter to make one sound: /${TEAMS[pair]}/.`;
    if(SILENT[pair])return `The ${prev} is silent here: the sound you hear is /${SILENT[pair]}/.`;
    if(prev==='Q')return `Rule: the letter Q nearly always has the same vowel straight after it, and together they say /kw/.`;
    if(c===prev)return `After “${so}”, the same letter comes again: this word has a double letter here.`;
    if(c==='E'&&idx===n-1)return `Last letter: it is a silent e at the end. It makes the vowel before it say its name.`;
    if(VOW.includes(c)&&VOW.includes(prev))return `After “${so}”, another vowel joins in: two vowels team up to make one sound here.`;

  }

      bandIndex(){const i=BANDS.findIndex(b=>b.id===R.band);return i<0?0:i;},
      setBand(id){R.band=id;save();},
      /* a tier inside the band: the band's easiest tier plus the ramp, capped at the band's hardest */
      tier(kind,ramp){const b=BANDS[api.bandIndex()],r=kind==='word'?b.word:b.math;return clampN(r[0]+(ramp|0),r[0],r[1]);},
      startSession(){S={skills:{},answered:0,correct:0,missWords:[]};R.sessions++;save();},

  else if(d===3){const r=Math.random();
    if(r<.25){op='+';a=rint(25,99);b=rint(25,99);ans=a+b;sp=14;mn=0;mx=200;}
    else if(r<.5){op='−';a=rint(40,99);b=rint(10,a);ans=a-b;sp=14;mn=0;mx=99;}
    else if(r<.78){op='×';a=rint(3,12);b=rint(3,12);ans=a*b;sp=12;mn=0;mx=150;}
    else{op='÷';b=rint(2,9);ans=rint(2,12);a=b*ans;sp=6;mn=0;mx=20;}}
  else{ /* tier 4: two-step, fractions of a quantity, percentages */
    const r=Math.random();
    if(r<.4){const b1=rint(2,9),b2=rint(2,9); a=rint(3,18); ans=a+b1*b2;
      hint=b1+' × '+b2+' = '+(b1*b2)+', then '+a+' + '+(b1*b2);
      return{prompt:a+' + '+b1+' × '+b2,note:'multiply first, then add',hint,
             answer:String(ans),options:opts(ans,15,0,Math.max(120,ans+20),3)};}
    if(r<.7){const den=pick([2,3,4,5]); const num=pick([1,1,1,2,3].filter(n=>n<den));
      const T=den*rint(3,12); ans=T/den*num;
      hint='divide '+T+' by '+den+' (bottom), then times by '+num+' (top)';
      return{prompt:num+'/'+den+' of '+T,note:'take the fraction of the whole',hint,
             answer:String(ans),options:opts(ans,Math.max(4,Math.round(ans*.3)),0,ans*2+6,3)};}
    const p=pick([10,20,25,50,75]), T=pick([20,40,60,80,100,200]);
    ans=T/100*p;
    hint=p+'% of '+T+' = '+T+' ÷ 100 × '+p;
    return{prompt:p+'% of '+T,note:'take the percentage of the whole',hint,
           answer:String(ans),options:opts(ans,Math.max(6,Math.round(ans*.35)),0,ans*2+10,3)};
  }
  hint=hintFor(op,a,b);
  return{prompt:a+' '+op+' '+b,note:'',hint,answer:String(ans),options:opts(ans,sp,mn,mx,3)};
}
/* spelling question: clue sentence + 4 word pedestals */
function qSpell(d){
  const w=word(clamp(d,1,5));
  const pool=[]; const bank=WORDS[clamp(d,1,5)];
  let guard=0;
  while(pool.length<3&&guard++<200){const c=pick(bank)[0]; if(c!==w.t&&pool.indexOf(c)<0)pool.push(c);}
  const options=shuf([w.t].concat(pool));
  return{prompt:clueSentence(w),note:'complete the sentence',
         hint:'starts with "'+w.t[0].toUpperCase()+'" — '+w.t.length+' letters',
         answer:w.t,options};
}
function makeQuestion(mode,tier){
  const q = mode==='math' ? qMath(clamp(tier,1,4)) : qSpell(clamp(tier,1,5));
  q.answerIndex = q.options.indexOf(q.answer);
  if(q.answerIndex<0){q.options[0]=q.answer;q.answerIndex=0;}
  return q;
}

const CELL=48, COLS=16, ROWS=10, FX=8, FY=64, FW=COLS*CELL, FH=ROWS*CELL;
const CMD_Y=FY+FH;                          /* the strip under the field: 544..640 */
let PX=FX+FW+8, PW=W-PX-8;                  /* the right panel: question, towers, upgrade, hint */

/* five seeded winding maps: waypoint corners (grid col,row), the castle at the end. Stars unlock them. */
const MAPS=[
 {name:'Ridge Run',   wps:[[0,1],[6,1],[6,4],[11,4],[11,7],[2,7],[2,9],[15,9]], seed:11, theme:0},
 {name:'Snake Vale',  wps:[[0,8],[4,8],[4,2],[8,2],[8,7],[12,7],[12,1],[15,1]], seed:22, theme:1},
 {name:'Kings Bend',  wps:[[0,5],[3,5],[3,1],[7,1],[7,8],[11,8],[11,3],[15,3]], seed:33, theme:2},
 {name:'Twin Bridges',wps:[[0,1],[3,1],[3,8],[7,8],[7,1],[11,1],[11,8],[15,8]], seed:44, theme:3},
 {name:'Golem Pass',  wps:[[0,5],[2,5],[2,1],[6,1],[6,7],[9,7],[9,2],[13,2],[13,9],[15,9]], seed:55, theme:4},
];
const UNLOCK=[0,2,5,8,12];                  /* stars needed to open each map (both modes count) */
let pathPts=[], pathLen=0, cumL=[], pathCells=new Set(), castleXY={x:0,y:0}, pathMap=-1;

function buildPath(mapIdx){
  const m=MAPS[mapIdx], r=mapRng(m.seed);
  const corners = m.wps.map(function(wp){return {x:FX+(wp[0]+.5)*CELL, y:FY+(wp[1]+.5)*CELL};});
  const pts=[corners[0]];
  for(let i=1;i<corners.length;i++){
    const a=corners[i-1], b=corners[i];
    const len=dist(a.x,a.y,b.x,b.y), steps=Math.max(2,Math.round(len/24));
    const nx=-(b.y-a.y)/len, ny=(b.x-a.x)/len;
    for(let s=1;s<steps;s++){
      const t=s/steps, j=(r()-.5)*20;
      pts.push({x:lerp(a.x,b.x,t)+nx*j, y:lerp(a.y,b.y,t)+ny*j});
    }
    pts.push(b);
  }
  let L=0; const cum=[0];
  for(let i=1;i<pts.length;i++){L+=dist(pts[i-1].x,pts[i-1].y,pts[i].x,pts[i].y);cum.push(L);}
  pathPts=pts; pathLen=L; cumL=cum; pathMap=mapIdx;
  const last=pts[pts.length-1]; castleXY={x:last.x,y:last.y};
  pathCells=new Set();
  for(let d=0; d<=L; d+=12){
    const p=pointAt(d);
    const cx=Math.floor((p.x-FX)/CELL), cy=Math.floor((p.y-FY)/CELL);
    if(cx>=0&&cx<COLS&&cy>=0&&cy<ROWS) pathCells.add(cx+','+cy);
  }
  const base=Array.from(pathCells);
  for(const k of base){const parts=k.split(',');const cx=+parts[0],cy=+parts[1];
    const ring=[[1,0],[-1,0],[0,1],[0,-1]];
    for(const dxy of ring)pathCells.add((cx+dxy[0])+','+(cy+dxy[1]));}
  computeSpots();
}
function pointAt(d){
  d=clamp(d,0,pathLen);
  let lo=0,hi=cumL.length-1;
  while(lo<hi){const mid=(lo+hi)>>1; if(cumL[mid]<d)lo=mid+1;else hi=mid;}
  const i=Math.max(1,lo);
  const a=pathPts[i-1],b=pathPts[i];
  const seg=cumL[i]-cumL[i-1]||1, t=(d-cumL[i-1])/seg;
  return {x:lerp(a.x,b.x,t), y:lerp(a.y,b.y,t)};
}

/* build pads and answer pedestals: chosen by how much of the path a tower on that square could reach.
   Big glowing pads, spaced far apart, so a thumb never has to aim at a 29 pixel square. */
let PADS=[], PED_CELLS=[];
function computeSpots(){
  const samples=[];for(let d=0;d<=pathLen;d+=14)samples.push(pointAt(d));
  const cand=[];
  for(let cy=0;cy<ROWS;cy++)for(let cx=0;cx<COLS;cx++){
    if(pathCells.has(cx+','+cy))continue;
    const x=FX+(cx+.5)*CELL,y=FY+(cy+.5)*CELL;let sc=0;
    for(const p of samples)if(dist(x,y,p.x,p.y)<=125)sc++;
    cand.push({cx,cy,x,y,sc});
  }
  /* pedestals first: four quiet squares on the right, a couple of rows apart, that reach little of the path */
  PED_CELLS=[];
  const right=cand.filter(c=>c.cx>=11).sort((a,b)=>(b.cx-a.cx)||(a.sc-b.sc));
  for(const c of right){
    if(PED_CELLS.length>=4)break;
    if(PED_CELLS.every(p=>Math.abs(p[1]-c.cy)>=2||Math.abs(p[0]-c.cx)>=2))PED_CELLS.push([c.cx,c.cy]);
  }
  for(const c of cand.sort((a,b)=>b.cx-a.cx)){if(PED_CELLS.length>=4)break;if(!PED_CELLS.some(p=>p[0]===c.cx&&p[1]===c.cy)&&PED_CELLS.every(p=>dist(FX+(p[0]+.5)*CELL,FY+(p[1]+.5)*CELL,c.x,c.y)>=96))PED_CELLS.push([c.cx,c.cy]);}
  PED_CELLS.sort((a,b)=>a[1]-b[1]);
  const pedXY=PED_CELLS.map(p=>({x:FX+(p[0]+.5)*CELL,y:FY+(p[1]+.5)*CELL}));
  PADS=[];
  const order=cand.filter(c=>c.sc>=8&&!PED_CELLS.some(p=>p[0]===c.cx&&p[1]===c.cy)).sort((a,b)=>b.sc-a.sc);
  for(const c of order){
    if(PADS.length>=16)break;
    if(PADS.some(p=>dist(p.x,p.y,c.x,c.y)<92))continue;
    if(pedXY.some(p=>dist(p.x,p.y,c.x,c.y)<70))continue;
    PADS.push({cx:c.cx,cy:c.cy,x:c.x,y:c.y,sc:c.sc});
  }
  PADS.sort((a,b)=>(a.cx-b.cx)||(a.cy-b.cy));
}
function padNear(x,y,r){
  let best=null,bd=r||62;
  for(const p of PADS){const d=dist(p.x,p.y,x,y);if(d<bd){bd=d;best=p;}}
  return best;
}
function towerNear(x,y,r){
  let best=null,bd=r||56;
  for(const t of G.towers){if(t.type==='answer')continue;const d=dist(t.x,t.y-8,x,y);if(d<bd){bd=d;best=t;}}
  return best;
}

  G.power=p;
}
function fireIntervalMul(){return G.power==='overcharge'?.45:G.power==='sputter'?1.7:1;}
function dmgMul(){return G.power==='overcharge'?1.5:G.power==='sputter'?.7:1;}

/* ─────────────────────────── towers ─────────────────────────── */
function cellFree(cx,cy){
  if(cx<0||cx>=COLS||cy<0||cy>=ROWS)return false;
  if(pathCells.has(cx+','+cy))return false;
  return !G.towers.some(function(t){return t.type!=='answer'&&t.cx===cx&&t.cy===cy;});
}
function placeTower(cx,cy,type){
  const def=TOWERS[type];
  if(!def)return false;
  if(type==='answer')return false;
  if(!cellFree(cx,cy))return false;
  if(G.gold<def.cost)return false;
  G.gold-=def.cost;
  const t={type:type,cx:cx,cy:cy,x:FX+(cx+.5)*CELL,y:FY+(cy+.5)*CELL,level:0,cd:0,pop:0,aim:0};
  G.towers.push(t);
  burstAt(t.x,t.y,def.color,12);ringAt(t.x,t.y,44,def.color);
  AU.build();
  return true;
}
function placeAnswerTurret(pedId){
  const p=G.pedestals[pedId];
  if(!p||p.armed||p.turret)return false;
  if(G.gold<TOWERS.answer.cost)return false;
  G.gold-=TOWERS.answer.cost;
  p.armed=true;
  p.turret={type:'answer',cx:p.cx,cy:p.cy,x:p.x,y:p.y,level:0,cd:0,pedId:pedId};
  G.towers.push(p.turret);
  burstAt(p.x,p.y,'#b48ce0',14);
  AU.build();
  return true;
}
function upgradeTower(t){
  if(!t||t.type==='answer'||t.level>=2)return false;
  const cost=UPGRADE_COST[t.level];
  if(G.gold<cost)return false;
  G.gold-=cost; t.level++;t.pop=.5;
  burstAt(t.x,t.y,'#fff2c0',16);ringAt(t.x,t.y,50,'#fff2c0');
  toast(TOWERS[t.type].name+' is now level '+(t.level+1)+'!','#fff2c0');
  AU.coin();
  return true;
}
function sellTower(t){
  if(!t||t.type==='answer')return false;
  let spent=TOWERS[t.type].cost;
  for(let i=0;i<t.level;i++)spent+=UPGRADE_COST[i];
  const refund=Math.floor(spent*.6);
  G.gold+=refund;
  G.towers=G.towers.filter(function(o){return o!==t;});
  if(G.selTower===t)G.selTower=null;
  toast('Sold for '+refund+' gold','#e0b34d');
  return true;
}

/* ─────────────────────────── enemies / waves ─────────────────────────── */
function pickGolemCard(){
  const m=meta(),missing=CARDS.map((_,i)=>i).filter(i=>m.cards.indexOf(i)<0);
  return missing.length?pick(missing):Math.floor(Math.random()*CARDS.length);
}
function spawnEnemy(type){
  const w=G.wave,hm=G.diff.hp*hpMulMap(),sm=G.diff.spd;
  if(type==='golem'){
    const hp=Math.round((110+24*w)*hm),card=pickGolemCard();
    G.enemies.push({type:'golem',hp:hp,maxHp:hp,speed:26*sm,dmg:20,loot:30+5*w,d:0,slow:0,r:19,golem:true,dead:false,card:card,ph:Math.random()*6,hit:0});
    G.golemAlive=true; G.golemSpawned=true;
    toast('A '+CARDS[card].n+' marches in!','#d8b8f0');AU.boom();
  }else{
    const hp=Math.round((26+9*w)*hm);
    G.enemies.push({type:'runner',hp:hp,maxHp:hp,speed:(42+2.4*w)*sm,dmg:10,loot:8+Math.floor(w/2),d:0,slow:0,r:13,golem:false,dead:false,ph:Math.random()*6,hit:0,tint:Math.floor(Math.random()*3)});
  }
}
function damageEnemy(e,amount){
  if(e.dead)return;
  e.hp-=amount;e.hit=.12;
  if(e.hp<=0){
    e.dead=true; G.kills++;
    let loot=e.loot;
    const pos=pointAt(e.d);
    if(e.golem){
      const armedCorrect=G.pedestals.some(function(p){return p.armed&&p.correct;});
      const base=e.loot;
      if(armedCorrect)loot*=2;
      G.lastGolemLoot={base:base,actual:loot,doubled:armedCorrect};
      toast(armedCorrect?'Loot doubled! +'+loot+' gold':'Golem down! +'+loot+' gold','#ffe7a0');
      collectCard(e.card);
      burstAt(pos.x,pos.y,CARDS[e.card].a,20);
    }
    G.gold+=loot;
    burstAt(pos.x,pos.y, e.golem?'#d8b8f0':'#f0a080', e.golem?18:8);
    floatText(pos.x,pos.y-14,'+'+loot,'#ffe7a0');
    AU.pop();
  }
}
function collectCard(idx){
  const m=meta();
  if(m.cards.indexOf(idx)<0){
    m.cards.push(idx);saveMeta(m);G.newCards.push(idx);G.gotCard=idx;G.cardFlash=3.2;AU.card();
    toast('New card: '+CARDS[idx].n+'!','#d8b8f0');
  }
}
function hurtCastle(n){
  G.hp-=n; if(!RM.matches)G.screenShake=10;
  AU.boom();
  if(G.hp<=0){G.hp=0;endGame(false);}
}
function endGame(won){
  if(G.phase==='victory'||G.phase==='gameover')return;
  const m=meta();
  if(won){
    G.phase='victory';
    const base=G.hp>=G.maxHp*.8?3 : G.hp>=G.maxHp*.5?2 : 1;
    G.stars=Math.max(1,base-G.retries);
    G.endMsg='The castle stands!';
    const before=totalStars(m),k=G.mode+'_'+G.map;
    m.wins++;
    m.best[k]=Math.max(m.best[k]||0,G.stars);
    const after=totalStars(m);
    for(let i=0;i<MAPS.length;i++)if(before<UNLOCK[i]&&after>=UNLOCK[i])G.unlockedMap=i;
    saveMeta(m);AU.win();
  }else{
    G.phase='gameover'; G.stars=0;
    G.endMsg='The wall crumbled!';
    saveMeta(m);AU.lose();
  }
  sdkState({scene:'over',score:Math.min(G.wave,G.waveCount),outcome:won?G.stars+' stars':'wall crumbled',stars:won?G.stars:0});
}
/* a fallen wall is never the end: try the same wave again with what you had, a little repaired */
function retryWave(){
  const s=G.snap;if(!s){startGame(G.mode,G.map);return;}
  G.towers=s.towers.map(t=>({type:t.type,cx:t.cx,cy:t.cy,x:FX+(t.cx+.5)*CELL,y:FY+(t.cy+.5)*CELL,level:t.level,cd:0,pop:.4,aim:0}));
  G.wave=s.wave;G.gold=s.gold+30;G.maxHp=s.maxHp;G.hp=Math.max(s.hp,Math.round(s.maxHp*.65));G.focusToken=s.focus;
  G.enemies=[];G.bullets=[];G.spawnQueue=[];G.waveActive=false;G.question=null;G.answered=false;G.pedestals=[];G.golemAlive=false;
  G.power='normal';G.chosen=-1;G.selTower=null;G.hintMsg='';G.hintTimer=0;G.retries++;G.phase='playing';G.screenShake=0;
  toast('Try wave '+(G.wave+1)+' again. You can do it!','#ffe7a0');
  sdkState({scene:'play'});
}
function killAll(){
  G.spawnQueue=[];
  for(const e of G.enemies){e.hp=0;damageEnemy(e,0.01);}
  G.enemies=G.enemies.filter(function(e){return !e.dead;});
}
function waveCleared(){
  G.waveActive=false;
  const bonus=30+10*G.wave;
  G.gold+=bonus;
  G.question=null;
  G.pedestals=[];
  toast('Wave '+G.wave+' clear! +'+bonus+' gold','#b8f0a0');
  if(G.wave>=G.waveCount){endGame(true);return;}
  G.phase='shop';
}

/* ─────────────────────────── armory ─────────────────────────── */
const SHOP=[
  {id:'repair', name:'Repair castle',  desc:'+10 hearts', cost:50},
  {id:'focus',  name:'Lucky Charm',    desc:'a wrong answer still overcharges once', cost:60},
  {id:'bricks', name:'Strong walls',   desc:'+10 hearts, for good', cost:80},
];
function buy(id){
  const it=SHOP.find(function(s){return s.id===id;});
  if(!it||G.gold<it.cost)return false;
  if(id==='repair'){ if(G.hp>=G.maxHp)return false; G.hp=clamp(G.hp+10,0,G.maxHp); }
  else if(id==='focus'){ if(G.focusToken)return false; G.focusToken=true; }
  else if(id==='bricks'){ G.maxHp+=10; G.hp=clamp(G.hp+10,0,G.maxHp); }
  G.gold-=it.cost;
  toast(it.name+'!','#b8f0a0');AU.coin();
  return true;
}
function closeShop(){ G.phase='playing'; }

/* ─────────────────────────── update ─────────────────────────── */
const MAXP=180;
function update(dt){
  G.time+=dt; G.frames++;
  if(G.hintTimer>0)G.hintTimer-=dt;
  if(G.cardFlash>0)G.cardFlash-=dt;
  if(G.screenShake>0)G.screenShake=Math.max(0,G.screenShake-dt*30);
  updateFx(dt);
  if(G.phase!=='playing')return;
  for(const t of G.towers){if(t.pop>0)t.pop-=dt;}

  if(G.waveActive){
    G.waveT+=dt;
    while(G.spawnQueue.length&&G.spawnQueue[0].t<=G.waveT){
      spawnEnemy(G.spawnQueue.shift().type);
    }
    for(const e of G.enemies){
      const sl=e.slow>0?.45:1;
      if(e.slow>0)e.slow-=dt;
      if(e.hit>0)e.hit-=dt;
      e.d+=e.speed*sl*dt;
      if(e.d>=pathLen){
        e.dead=true;
        hurtCastle(e.dmg);
        burstAt(castleXY.x,castleXY.y,'#e05a4a',14);
        if(G.phase!=='playing')return;
      }
    }
    G.enemies=G.enemies.filter(function(e){return !e.dead;});
    G.golemAlive=G.enemies.some(function(e){return e.golem;});

    const fiMul=fireIntervalMul(), dm=dmgMul();
    for(const t of G.towers){
      if(t.type==='answer')continue;
      t.cd-=dt;
      if(t.cd>0)continue;
      const def=TOWERS[t.type];
      let best=null,bd=-1;
      for(const e of G.enemies){
        const ep=pointAt(e.d);
        if(dist(t.x,t.y,ep.x,ep.y)<=def.range[t.level]&&e.d>bd){bd=e.d;best=e;}
      }
      if(best){
        t.cd=def.rate[t.level]*fiMul;
        const bp=pointAt(best.d);
        const ang=Math.atan2(bp.y-t.y,bp.x-t.x);
        t.aim=ang;
        if(G.bullets.length<80){
          G.bullets.push({x:t.x,y:t.y-24,ax:bp.x,ay:bp.y,tx:best,ang:ang,
            speed:t.type==='cannon'?300:420, dmg:def.dmg[t.level]*dm,
            kind:t.type, splash:def.splash?def.splash[t.level]:0,
            slow:def.slow||0, life:2, hit:false});
        }
        G.shots++;
        if(G.shots%2===0)AU.shot(t.type);
        puffAt(t.x+Math.cos(ang)*14,t.y-24+Math.sin(ang)*14,'rgba(230,220,200,0.55)',3);
      }
    }
    for(const b of G.bullets){
      b.life-=dt;
      if(b.tx&&!b.tx.dead){const tp=pointAt(b.tx.d);b.ax=tp.x;b.ay=tp.y;}
      const dx=b.ax-b.x, dy=b.ay-b.y;
      const dd=Math.hypot(dx,dy)||1;
      const step=b.speed*dt;
      if(dd<=step+6){
        b.hit=true;
        if(b.splash){
          for(const e of G.enemies){
            const ep=pointAt(e.d);
            if(dist(b.x,b.y,ep.x,ep.y)<=b.splash)damageEnemy(e,b.dmg*.7+(e===b.tx?b.dmg*.3:0));
          }
          ringAt(b.x,b.y,b.splash,'#f0b070');puffAt(b.x,b.y,'#e8c890',6);AU.boom();
        }else if(b.tx&&!b.tx.dead){
          damageEnemy(b.tx,b.dmg);
          if(b.slow)b.tx.slow=b.slow;
          puffAt(b.x,b.y,b.kind==='frost'?'#cfefff':'#f2dcae',4);
        }
      }else{
        b.x+=dx/dd*step; b.y+=dy/dd*step;
        b.ang=Math.atan2(dy,dx);
      }
    }
    G.bullets=G.bullets.filter(function(b){return !b.hit&&b.life>0;});
    G.enemies=G.enemies.filter(function(e){return !e.dead;});
    if(!G.spawnQueue.length&&!G.enemies.length)waveCleared();
  }
}

/* ─────────────────────────── fx (all bounded) ─────────────────────────── */
function toast(msg,color){const l=G.toasts[G.toasts.length-1];if(l&&l.msg===msg){l.t=2.6;return;}G.toasts.push({msg:msg,color:color||'#ffe7a0',t:2.6});if(G.toasts.length>2)G.toasts.shift();}
function floatText(x,y,msg,color){if(G.texts.length>14)G.texts.shift();G.texts.push({x:x,y:y,msg:msg,color:color,t:1.1});}
function burstAt(x,y,color,n){for(let i=0;i<n&&G.particles.length<MAXP;i++){const a=Math.random()*TAU,s=30+Math.random()*100;
  G.particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*.5,color:color,r:1.8+Math.random()*2.6});}}
function puffAt(x,y,color,n){for(let i=0;i<n&&G.particles.length<MAXP;i++){const a=Math.random()*TAU,s=10+Math.random()*30;
  G.particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-10,life:.25+Math.random()*.3,color:color,r:1.4+Math.random()*2});}}
function ringAt(x,y,r,color){if(G.particles.length<MAXP)G.particles.push({x:x,y:y,vx:0,vy:0,life:.35,color:color,ring:true,r:6,rmax:r});}
function updateFx(dt){
  for(const p of G.particles){p.life-=dt;p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;if(p.ring)p.r=lerp(p.r,p.rmax,dt*10);}
  G.particles=G.particles.filter(function(p){return p.life>0;});
  for(const t of G.texts){t.t-=dt;t.y-=26*dt;}
  G.texts=G.texts.filter(function(t){return t.t>0;});
  for(const t of G.toasts)t.t-=dt;
  G.toasts=G.toasts.filter(function(t){return t.t>0;});
}


/* ═══════════ art: everything is baked once with the KL kit, then drawn with drawImage ═══════════ */
let SP=new Map();
function resetSprites(){SP=new Map();}
function baked(key,w,h,fn){
  let s=SP.get(key);
  if(!s){const m=KL.make(w,h);fn(m.g,w,h);s={c:m.c,w:w,h:h};SP.set(key,s);if(SP.size>110)SP.delete(SP.keys().next().value);}
  return s;
}
const blit=(s,x,y,sc)=>{sc=sc||1;ctx.drawImage(s.c,x,y,s.w*sc,s.h*sc);};

 {name:'Autumn', g0:'#a8a83e',g1:'#7c8a32',trees:['#d9822b','#eaa83c','#b85a24','#cdb63a'],flowers:['#ffb347','#ff7350','#ffe08a'],path:'#b88850',pathE:'#6d4a2a',rocks:.14},
 {name:'Snow',   g0:'#eef4fa',g1:'#c2d4e6',trees:['#2f5a4a'],flowers:['#ffffff','#cfe8ff'],path:'#b09884',pathE:'#75604e',pine:true,rocks:.12},
 {name:'Lake',   g0:'#7ab84e',g1:'#56964a',trees:['#4f9a3a','#68b24c','#3f8630'],flowers:['#ffd85a','#ffffff','#ff9ab0'],path:'#b48a52',pathE:'#6f5030',rocks:.08,water:true},
 {name:'Canyon', g0:'#d8b276',g1:'#b48850',trees:['#7f9a3a','#a6b04a'],flowers:['#e88040','#f0d060'],path:'#8f6540',pathE:'#523620',rocks:.5},

    /* the top bar and the bottom strip are a little darker, like a beam */

/* a wooden frame with a gold inner line around the battlefield */
function frameSprite(){
  return baked('frame',FW+24,FH+24,(g)=>{
    g.save();g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=12;g.shadowOffsetY=4;KL.rp(g,6,6,FW+12,FH+12,16);g.lineWidth=12;g.strokeStyle='#5a3418';g.stroke();g.restore();

function rockBlob(g,x,y,s,base,R){
  g.save();g.fillStyle='rgba(28,24,60,.22)';g.beginPath();g.ellipse(x+s*.2,y+s*.06,s*.6,s*.16,0,0,TAU);g.fill();
  const n=8,pts=[];for(let i=0;i<n;i++){const a=i/n*TAU,rr=s*(.42+R()*.14);pts.push([x+Math.cos(a)*rr*1.15,y-s*.28+Math.sin(a)*rr*.7]);}
  g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();
  const gr=g.createRadialGradient(x-s*.2,y-s*.5,s*.05,x,y-s*.25,s*.75);gr.addColorStop(0,KL.lit(base,.45));gr.addColorStop(.55,base);gr.addColorStop(1,KL.dark(base,.5));g.fillStyle=gr;g.fill();
  g.strokeStyle=KL.rgba(KL.dark(base,.6),.4);g.lineWidth=1;g.stroke();g.restore();
}
function bushAt(g,x,y,s,pal,R){
  g.save();g.fillStyle='rgba(28,24,60,.2)';g.beginPath();g.ellipse(x+s*.15,y+s*.04,s*.55,s*.12,0,0,TAU);g.fill();
  for(let i=0;i<7;i++){const px=x+(R()-.5)*s*.8,py=y-s*.22-R()*s*.22,r=s*(.2+R()*.12),c=pal[Math.floor(R()*pal.length)];
    const gr=g.createRadialGradient(px-r*.3,py-r*.4,r*.1,px,py,r);gr.addColorStop(0,KL.lit(c,.34));gr.addColorStop(.6,c);gr.addColorStop(1,KL.dark(c,.4));g.fillStyle=gr;g.beginPath();g.arc(px,py,r,0,TAU);g.fill();}
  g.restore();
}

/* the battlefield, baked once per map: grass with light and grain, a dirt road with pebbles, trees, rocks, ponds */
function fieldSprite(){
  const mi=pathMap,mp=MAPS[mi],th=THEMES[mp.theme];
  return baked('field|'+mi,FW,FH,(g)=>{
    g.save();KL.rp(g,0,0,FW,FH,12);g.clip();
    const gr=g.createLinearGradient(0,0,FW*.6,FH);gr.addColorStop(0,th.g0);gr.addColorStop(1,th.g1);g.fillStyle=gr;g.fillRect(0,0,FW,FH);
    const R=KL.rng(mp.seed*31+7);
    for(let i=0;i<50;i++){const x=R()*FW,y=R()*FH,r=30+R()*80,c=R()<.5?KL.lit(th.g0,.3):KL.dark(th.g1,.3);const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,KL.rgba(c,.3));rg.addColorStop(1,KL.rgba(c,0));g.fillStyle=rg;g.fillRect(x-r,y-r,r*2,r*2);}
    g.fillStyle='rgba(255,255,255,.035)';for(let i=0;i<FW;i+=96)g.fillRect(i,0,48,FH);
    g.save();g.translate(-FX,-FY);
    const pedXY=PED_CELLS.map(p=>({x:FX+(p[0]+.5)*CELL,y:FY+(p[1]+.5)*CELL}));
    const nearSpot=(x,y,r)=>PADS.some(p=>dist(p.x,p.y,x,y)<r)||pedXY.some(p=>dist(p.x,p.y,x,y)<r);
    /* ponds (Lake map): pale water with a bright rim */
    if(th.water){
      const spots=[];
      for(let cy=1;cy<ROWS-1;cy++)for(let cx=0;cx<COLS-1;cx++){
        let ok=true;for(let dy=0;dy<2&&ok;dy++)for(let dx=0;dx<2&&ok;dx++)if(pathCells.has((cx+dx)+','+(cy+dy)))ok=false;
        const x=FX+(cx+1)*CELL,y=FY+(cy+1)*CELL;if(ok&&!nearSpot(x,y,62)&&!spots.some(s=>dist(s.x,s.y,x,y)<210))spots.push({x,y});}
      for(const s of spots.slice(0,2)){
        g.save();g.translate(s.x,s.y);g.beginPath();g.ellipse(0,0,52,32,0,0,TAU);

    stroke(58,'#1c1006',.10);stroke(52,'#1c1006',.12);stroke(47,'#1c1006',.16);

    /* meadow flowers and tufts on the free ground */
    K_flowersFree(g,th,R,nearSpot);

    const items=[];
    for(let cy=0;cy<ROWS;cy++)for(let cx=0;cx<COLS;cx++){

  try{
    const r=cv.getBoundingClientRect(),x=(cx-r.left)*W/r.width,y=(cy-r.top)*H/r.height;

    if(G.phase==='playing')fieldTap(x,y);
  }catch(err){/* a lost tap must never come from an audio or draw hiccup */}
  AU.init();   // wake audio after the tap has been routed: input must not depend on sound
}
let lastTapT=0;
cv.addEventListener('pointerdown',e=>{lastTapT=performance.now();canvasTap(e.clientX,e.clientY);});
/* engines that deliver touch without a synthesised pointer event: route those too, de-duplicated */
cv.addEventListener('touchstart',e=>{if(performance.now()-lastTapT>350){lastTapT=performance.now();const t=e.changedTouches[0];if(t)canvasTap(t.clientX,t.clientY);}},{passive:true});
cv.addEventListener('click',e=>{if(performance.now()-lastTapT>350){lastTapT=performance.now();canvasTap(e.clientX,e.clientY);}});
function fieldTap(x,y){
  if(x<FX||x>FX+FW||y<FY||y>FY+FH)return;
  if(G.selected==='answer'){
    let best=null,bd=56;for(const p of G.pedestals){const d=dist(p.x,p.y-20,x,y);if(d<bd){bd=d;best=p;}}
    if(best){if(best.locked||best.armed){toast(best.armed?'That rune is already armed':'Too late for that one','#ffe7a0');}else if(!placeAnswerTurret(best.id))toast('Not enough gold yet','#ffb0a0');return;}
  }
  const pad=padNear(x,y,68);
  if(pad){
    const occ=G.towers.find(t=>t.type!=='answer'&&t.cx===pad.cx&&t.cy===pad.cy);
    if(occ){G.selTower=occ;kitSfx('button',{volume:.3});return;}
    if(G.selected&&G.selected!=='answer'){
      if(!placeTower(pad.cx,pad.cy,G.selected)&&G.gold<TOWERS[G.selected].cost)toast('Not enough gold yet. Gold comes from beating gloops.','#ffb0a0');
      else G.selTower=null;
    }else toast('Pick Arrow, Cannon or Frost first','#ffe7a0');
    return;
  }
  const t=towerNear(x,y,52);
  G.selTower=t||null;
}

/* ═══════════ arcade glue: hints, grown-up report, first-run coach ═══════════ */
function sdkState(o){try{window.ArcadeSDK&&ArcadeSDK.state(o);}catch(e){}}
/* a hint that teaches the rule in play, never names the answer */
function currentHint(){
  if(G.phase==='menu'||G.phase==='cards')return 'Pick Maths or Spelling, pick an open map, then tap Defend the castle.';
  if(G.phase==='shop')return 'Repair if your hearts are low. A Lucky Charm turns one wrong answer into an overcharge.';
  if(G.phase==='gameover')return 'Try the wave again. Your towers and gold are kept, and your castle is a little repaired.';
  if(G.phase==='victory')return 'Play again for more stars. Stars open new maps.';
  const q=G.question;
  if(q&&!G.answered&&G.waveActive){
    if(G.mode==='math')return LK.mathHint(q.prompt,q.note);
    const n=q.answer.length;
    return 'Read the sentence out loud with each word in the gap: only one makes sense. The missing word has '+n+' letters.';
  }
  if(G.golemAlive&&G.pedestals.some(function(p){return !p.armed;}))
    return 'A golem is marching. Choose Rune Turret, then tap the stone with the right answer to double its loot.';
  if(!G.waveActive)return G.towers.some(function(t){return t.type!=='answer';})
    ?'Upgrade towers near the bends of the road, then tap Start wave.':'Choose Arrow, then tap a glowing pad next to the road. Then tap Start wave.';
  return 'Frost towers slow gloops down. Cannons hit groups at the bends.';
}
function showHint(){const t=currentHint();G.hintShow=t;G.hintTimer=9;return t;}
addEventListener('keydown',function(e){
  if(e.key==='h'||e.key==='H'){showHint();return;}
  if(document.getElementById('grown').classList.contains('show')){if(e.key==='Enter')closeGrown();return;}
  AU.init();
  if(G.phase==='menu'){
    if(e.key==='Enter'){e.preventDefault();if(totalStars(mc())>=UNLOCK[G.menuMap])startGame(G.mode,G.menuMap);}
    else if(e.key==='1')G.mode='math';
    else if(e.key==='2')G.mode='spell';
    else if(e.key==='m'||e.key==='M'){for(let k=1;k<=MAPS.length;k++){const i=(G.menuMap+k)%MAPS.length;if(totalStars(mc())>=UNLOCK[i]){G.menuMap=i;break;}}}
    else if(e.key==='b'||e.key==='B')LK.setBand(LK.BANDS[(LK.bandIndex()+1)%LK.BANDS.length].id);
    else if(e.key==='g'||e.key==='G')openGrown();
    else if(e.key==='t'||e.key==='T')coachStart();
  }else if(G.phase==='cards'){if(e.key==='Enter'||e.key==='Escape')G.phase='menu';}
  else if(G.phase==='shop'){
    if(e.key==='Enter'){e.preventDefault();closeShop();}
    else if(e.key==='1')buy('repair');else if(e.key==='2')buy('focus');else if(e.key==='3')buy('bricks');
  }else if(G.phase==='gameover'){if(e.key==='Enter'){e.preventDefault();retryWave();}}
  else if(G.phase==='victory'){if(e.key==='Enter'){e.preventDefault();startGame(G.mode,G.map);}}
  else if(G.phase==='playing'){
    if((e.key===' '||e.key==='Enter')&&!G.waveActive){e.preventDefault();startWave();}
    else if(G.question&&!G.answered&&G.waveActive&&e.key>='1'&&e.key<='4')answerPanel(+e.key-1);
  }
});
function openGrown(){
  const end=G.phase==='gameover'||G.phase==='victory';
  document.getElementById('grownBody').innerHTML=LK.reportHTML(end?'session':'all')+
    (end?'<p class="lk-p">All-time report: For grown-ups on the menu.</p>':'');
  document.getElementById('grown').classList.add('show');document.getElementById('grownBack').focus();
}
function closeGrown(){document.getElementById('grown').classList.remove('show');}
document.getElementById('grownBack').addEventListener('click',closeGrown);

/* first-run coach: learn by doing; skippable, replayable */
const COACH=[
  {t:'Tap a glowing pad on the map to build a tower.',done:function(){return G.towers.some(function(t){return t.type!=='answer';});}},
  {t:'Now tap Start wave!',done:function(){return G.wave>=1;}},
  {t:'Answer the question on the right. Right answers overcharge your towers. Stuck? Tap Hint.',done:function(){return G.answered||G.wave>=2;}},
  {t:'Purple golems carry cards and loot. A Rune Turret on the right answer stone doubles the loot.',done:function(){return G.phase==='shop'||coachT>9;}},
];
let coachIx=-1,coachT=0;
function coachStart(){if(G.phase!=='playing')startGame(G.mode,G.menuMap);coachIx=0;coachT=0;}
function coachEnd(){coachIx=-1;try{localStorage.setItem('qt_tut','1');}catch(e){}try{window.ArcadeSDK&&ArcadeSDK.event('tutorial-done');}catch(e){}}
function coachTick(dt){
  if(coachIx<0)return;
  if(G.phase==='menu'||G.phase==='cards'||G.phase==='gameover'||G.phase==='victory'){coachIx=-1;return;}
  if(coachIx===COACH.length-1)coachT+=dt;
  while(coachIx<COACH.length&&COACH[coachIx].done()){coachIx++;coachT=0;}
  if(coachIx>=COACH.length)coachEnd();
}
const _startGame=startGame;
startGame=function(mode,mapIdx){_startGame(mode,mapIdx);let seen=false;try{seen=localStorage.getItem('qt_tut')==='1';}catch(e){}if(!seen&&coachIx<0){coachIx=0;coachT=0;}};
let lastPhase='';
function watchPhase(){
  paintProg();
  if(G.phase===lastPhase)return;lastPhase=G.phase;
  if(G.phase==='menu'||G.phase==='cards'){closeGrown();sdkState({scene:'title',level:1+Math.floor(totalStars(mc())/3),stars:totalStars(mc())});}
}
const touchUI=matchMedia('(pointer: coarse)').matches;
paintProg();

if(window.ArcadeSDK)ArcadeSDK.init({orientation:'landscape',
  pauseButton:'tr',
  onRestart:function(){closeGrown();startGame(G.mode,G.map);},
  onExit:function(){closeGrown();coachIx=-1;G.phase='menu';},
  onTutorial:coachStart,
  onHint:function(){return showHint();},
});

/* ─────────────────────────── debug hook (drives tools/playtest.py) ─────────────────────────── */
window.__tower_debug={
  wipe:function(){try{localStorage.removeItem(META_KEY);}catch(e){}_mc=null;},
  meta:function(){return meta();},
  start:function(mode,mapIdx){startGame(mode||'math',mapIdx===undefined?0:mapIdx);},
  startWave:function(){startWave();},
  state:function(){
    return {
      phase:G.phase, mode:G.mode, map:G.map, wave:G.wave,
      hp:G.hp, maxHp:G.maxHp, gold:Math.floor(G.gold),
      towers:G.towers.length, enemies:G.enemies.length,
      enemiesData:G.enemies.map(function(e){return {type:e.type,hp:e.hp,prog:e.d/pathLen};}),
      power:G.power, fireIntervalMul:fireIntervalMul(), dmgMul:dmgMul(),
      question:G.question?{prompt:G.question.prompt,options:G.question.options,
                           answerIndex:G.question.answerIndex}:null,
      answered:G.answered, hint:G.hintMsg,
      pedestals:G.pedestals.map(function(p){return {armed:p.armed,correct:p.correct,option:p.option};}),
      golemAlive:G.golemAlive, lastGolemLoot:G.lastGolemLoot,
      shots:G.shots, kills:G.kills, waveActive:G.waveActive,
      shopOpen:G.phase==='shop', stars:G.stars, focusToken:G.focusToken,
      time:G.time, fps:G.fps,
      selType:G.selected, selTowerLevel:G.selTower?G.selTower.level:null,
      mapName:MAPS[G.map]?MAPS[G.map].name:'',
      waveCount:G.waveCount, retries:G.retries, W:W, particles:G.particles.length,
      pads:PADS.map(function(p){return {cx:p.cx,cy:p.cy,x:p.x,y:p.y};}),
      hits:hits.map(function(h){return {id:h.id,x:Math.round(h.x),y:Math.round(h.y),w:Math.round(h.w),h:Math.round(h.h)};}),
      cards:meta().cards.length,unlockedMap:G.unlockedMap,
    };
  },
  placeTower:function(cx,cy,type){return placeTower(cx,cy,type);},
  placeAnswer:function(pedId){return placeAnswerTurret(pedId);},
  answer:function(i){answerPanel(i);},
  buy:function(id){return buy(id);},
  closeShop:function(){closeShop();},
  upgradeSel:function(){return G.selTower?upgradeTower(G.selTower):false;},
  selectTowerAt:function(cx,cy){
    const t=G.towers.find(function(t){return t.type!=='answer'&&t.cx===cx&&t.cy===cy;});
    G.selTower=t||null; return !!t;},
  sellSel:function(){return sellTower(G.selTower);},
  killAll:function(){killAll();},
  hurtCastle:function(n){hurtCastle(n);},
  teleportEnemy:function(idx,prog){
    const e=G.enemies[idx]; if(!e)return false;
    e.d=clamp(prog,0,.9999)*pathLen; return true;},
  damageEnemy:function(idx,n){const e=G.enemies[idx];if(!e)return false;
    damageEnemy(e,n);G.enemies=G.enemies.filter(function(x){return !x.dead;});return true;},
  setGold:function(n){G.gold=n;},
  retry:function(){retryWave();},
  toMenu:function(){G.phase='menu';},
  setStars:function(n){const m=meta();m.best={math_0:Math.min(3,n),math_1:Math.min(3,Math.max(0,n-3)),math_2:Math.min(3,Math.max(0,n-6)),math_3:Math.min(3,Math.max(0,n-9)),math_4:Math.min(3,Math.max(0,n-12))};saveMeta(m);},
  giveCards:function(n){const m=meta();m.cards=CARDS.map((_,i)=>i).slice(0,n);saveMeta(m);},
  openCards:function(){G.phase='cards';},
  win:function(){G.hp=Math.max(G.hp,G.maxHp);G.wave=G.waveCount;endGame(true);},
  setMenuMap:function(i){G.menuMap=i;},
};

/* ─────────────────────────── main loop ─────────────────────────── */
addEventListener('resize',fit);addEventListener('orientationchange',function(){setTimeout(fit,120);});
G.menuMap=0;G.menuNote='';G.menuNoteT=0;G.hintShow='';G.waveTotal=0;
buildPath(0);
fit();
watchPhase();
let last=performance.now(),errOnce=false;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  try{
    if(G.menuNoteT>0)G.menuNoteT-=dt;
    update(dt);
    draw();
    coachTick(dt); watchPhase();
    G.fpsT+=dt;
    if(G.fpsT>=.5){G.fps=Math.round(G.frames/G.fpsT);G.frames=0;G.fpsT=0;}
  }catch(err){if(!errOnce){errOnce=true;try{console.error('Quiz Tower frame error: '+(err&&err.stack||err));}catch(e){}}}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
try{document.fonts&&document.fonts.load('700 20px Fredoka');}catch(e){}

</script>
