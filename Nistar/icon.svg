<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#162660"/>
      <stop offset="40%" stop-color="#0f1e4a"/>
      <stop offset="100%" stop-color="#04071a"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="32%" r="38%">
      <stop offset="0%" stop-color="#ffe040" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#d060ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4dbbff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray1" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fff0a0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4dbbff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a0"/>
      <stop offset="50%" stop-color="#ffe040"/>
      <stop offset="100%" stop-color="#d060ff"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background (iOS-friendly mask) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- God-ray shafts -->
  <polygon points="200,40 312,40 296,500 216,500" fill="url(#ray1)" opacity="0.30"/>
  <polygon points="120,40 192,40 168,460 144,460" fill="url(#ray1)" opacity="0.18"/>
  <polygon points="320,40 392,40 368,460 344,460" fill="url(#ray1)" opacity="0.18"/>

  <!-- Halo -->
  <circle cx="256" cy="200" r="180" fill="url(#halo)"/>

  <!-- Stained-glass arch panels (4 thin verticals = the 4 lanes) -->
  <g opacity="0.55">
    <rect x="64"  y="80" width="80" height="380" rx="40" fill="#4dbbff" opacity="0.16"/>
    <rect x="160" y="80" width="80" height="380" rx="40" fill="#d466ff" opacity="0.16"/>
    <rect x="272" y="80" width="80" height="380" rx="40" fill="#ffcc00" opacity="0.16"/>
    <rect x="368" y="80" width="80" height="380" rx="40" fill="#ff5aa8" opacity="0.16"/>
  </g>

  <!-- Central cross -->
  <g transform="translate(256,260)">
    <rect x="-12" y="-110" width="24" height="220" rx="6" fill="url(#cross)"/>
    <rect x="-70" y="-32"  width="140" height="24" rx="6" fill="url(#cross)"/>
  </g>

  <!-- Stars -->
  <g fill="#fff0a0">
    <circle cx="100" cy="120" r="3" opacity="0.85"/>
    <circle cx="420" cy="110" r="2.5" opacity="0.85"/>
    <circle cx="80"  cy="380" r="2.5" opacity="0.65"/>
    <circle cx="440" cy="400" r="3" opacity="0.85"/>
    <circle cx="256" cy="80"  r="3.5" opacity="1"/>
  </g>

  <!-- Outer ring glow -->
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="#ffe040" stroke-opacity="0.18" stroke-width="3"/>
</svg>
