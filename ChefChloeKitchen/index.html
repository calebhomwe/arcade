<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6E9">
<title>Chef Chloe: Viral Kitchen</title>
<!--
  ============================================================================
  CHEF CHLOE: VIRAL KITCHEN  —  single-file mobile cooking game
  ----------------------------------------------------------------------------
  100% original. No third-party names/characters/assets/sounds. All art is
  drawn procedurally (SVG / canvas / CSS). All audio is synthesized live with
  the Web Audio API. Zero external requests. Runs offline by opening this file.

  ARCHITECTURE OVERVIEW (search for the banner comments):
    [SAVE]        localStorage save system (coins, gems, stars, unlocks, ...)
    [HAPTICS]     platform-safe haptics abstraction (never throws)
    [AUDIO]       layered Web Audio engine (ADSR, noise, reverb, limiter, duck)
    [JUICE]       unified Juice Event bus + data-driven Juice Table
    [PARTICLES]   pooled particle + floating-number system
    [CHLOE]       procedural mascot (SVG) with expression + thumbs-up
    [VERBS]       data-driven technique-VERB engine (chop/whisk/crack/...)
    [RECIPES]     RECIPE DATA REGISTRY + schema (add a recipe = add one object)
    [RUSH]        Rush Mode service (combos, café upgrades)
    [STATE]       state machine + all screens
  ============================================================================
-->
<style>
  :root{
    --cream:#FFF6E9; --peach:#FFE3C7; --pink:#FF5D8F; --coral:#FF7A59;
    --mint:#3DD6B0; --yellow:#FFC93C; --purple:#7C5CFF; --cocoa:#4A2C2A;
    --card:#FFFFFF; --shadow:rgba(74,44,42,.18);
    --r:22px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; touch-action:manipulation;}
  :focus-visible{outline:3px solid var(--purple); outline-offset:2px;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden; background:#2a1f2a;}
  body{
    font-family:"Baloo 2","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
    font-weight:800; color:var(--cocoa);
  }
  #app{
    position:fixed; inset:0; margin:auto;
    /* Plays in BOTH portrait and landscape. Height always fills the viewport
       (exactly like normal portrait did before) — width is what adapts: it
       fills too in portrait, and only pillarboxes down to a comfortable
       phone-like shape when the viewport is short/wide (landscape). The
       55.73vh figure is simply 520/933 expressed as a percentage of height. */
    height:100%;
    width:min(520px, 100vw, 55.73vh);
    background:linear-gradient(160deg,var(--cream),var(--peach));
    overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,.4);
  }
  .screen{position:absolute; inset:0; display:none; flex-direction:column; overflow:hidden;}
  .screen.active{display:flex;}
  .fx-layer{position:absolute; inset:0; pointer-events:none; z-index:900;}
  #particleCanvas{position:absolute; inset:0; pointer-events:none; z-index:850;}

  /* ---- reusable buttons ---- */
  .btn{
    border:none; border-radius:var(--r); padding:16px 22px; font-family:inherit;
    font-weight:800; font-size:19px; color:#fff; background:var(--pink);
    box-shadow:0 6px 0 rgba(0,0,0,.12), 0 8px 16px var(--shadow);
    cursor:pointer; position:relative; transition:transform .08s;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{transform:translateY(3px) scale(.97); box-shadow:0 3px 0 rgba(0,0,0,.12);}
  .btn.mint{background:var(--mint);} .btn.coral{background:var(--coral);}
  .btn.yellow{background:var(--yellow); color:var(--cocoa);} .btn.purple{background:var(--purple);}
  .btn.ghost{background:#fff; color:var(--cocoa); box-shadow:0 4px 0 rgba(0,0,0,.08), 0 6px 12px var(--shadow);}
  .btn.sm{padding:10px 16px; font-size:15px; border-radius:16px; min-height:44px;}
  .btn.big{width:100%; padding:20px; font-size:22px;}
  .btn:disabled{opacity:.5; cursor:default;}

  .topbar{display:flex; align-items:center; gap:8px; padding:12px 14px; padding-top:max(12px,env(safe-area-inset-top));}
  .chip{background:#fff; border-radius:20px; padding:7px 14px; font-size:15px; display:flex; align-items:center; gap:6px;
        box-shadow:0 3px 8px var(--shadow);}
  .spacer{flex:1}
  .iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:#fff;box-shadow:0 3px 8px var(--shadow);
           font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .iconbtn:active{transform:scale(.92)}

  .title{font-size:30px; text-align:center; margin:6px 0; text-shadow:0 2px 0 #fff;}
  .sub{font-size:15px; font-weight:700; opacity:.75; text-align:center;}
  .scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px 16px 24px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .card{background:var(--card); border-radius:var(--r); padding:14px; box-shadow:0 6px 16px var(--shadow);
        position:relative; cursor:pointer; transition:transform .1s;}
  .card:active{transform:scale(.96)}
  .card .emoji{font-size:40px; line-height:1}
  .card .cname{font-size:16px; margin-top:6px}
  .card .meta{font-size:12px; font-weight:700; opacity:.7; margin-top:2px}
  .locked{filter:grayscale(.7) brightness(.9); opacity:.7}
  .lockbadge{position:absolute; top:8px; right:10px; font-size:20px}
  .starsrow{color:var(--yellow); font-size:15px; margin-top:4px; letter-spacing:1px}

  /* Chloe container */
  .chloe-wrap{display:flex; justify-content:center; align-items:center;}
  .chloe-wrap svg{width:100%; height:100%; overflow:visible;}

  /* boot */
  #screen-boot .bootbox{margin:auto; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px;}
  .bigtitle{font-size:40px; line-height:1.05; background:linear-gradient(90deg,var(--pink),var(--coral),var(--purple));
            -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none;}

  /* cook stage */
  .cookhead{display:flex; align-items:center; gap:10px; padding:10px 14px;}
  .stepbar{flex:1; height:14px; background:#fff; border-radius:10px; overflow:hidden; box-shadow:inset 0 2px 4px rgba(0,0,0,.1)}
  .stepbar > i{display:block; height:100%; width:0; border-radius:10px; background:linear-gradient(90deg,var(--mint),var(--yellow)); transition:width .3s}
  .stage{flex:1; position:relative; margin:6px 12px; border-radius:26px; overflow:hidden;
         background:radial-gradient(circle at 50% 30%,#fff,#ffeede); box-shadow:inset 0 0 0 4px #fff, 0 8px 20px var(--shadow);}
  .verbcanvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none;}
  .prompt{position:absolute; top:10px; left:0; right:0; text-align:center; font-size:19px; pointer-events:none; z-index:5;
          text-shadow:0 2px 0 #fff;}
  .chloecorner{position:absolute; bottom:8px; right:8px; width:96px; height:96px; z-index:6; pointer-events:none;}
  .speech{position:absolute; bottom:96px; right:8px; background:#fff; border-radius:16px; padding:8px 12px; font-size:14px;
          max-width:190px; box-shadow:0 4px 10px var(--shadow); z-index:6;}
  .speech:after{content:""; position:absolute; bottom:-8px; right:24px; border:8px solid transparent; border-top-color:#fff; border-bottom:0;}

  /* results */
  .platewrap{width:220px; height:220px; margin:10px auto; position:relative;}
  .bigstars{display:flex; justify-content:center; gap:6px; font-size:44px; margin:6px;}
  .bigstars span{opacity:.25; transform:scale(.6); transition:all .4s cubic-bezier(.34,1.56,.64,1)}
  .bigstars span.on{opacity:1; transform:scale(1); color:var(--yellow); text-shadow:0 3px 0 #e0a800}
  .scorenum{font-size:54px; text-align:center; color:var(--coral)}
  .banner{font-size:34px; text-align:center; letter-spacing:1px;
          background:linear-gradient(90deg,var(--pink),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent;}

  /* rush */
  .rushtop{display:flex; gap:8px; align-items:center; padding:8px 12px; flex-wrap:wrap}
  .customers{display:flex; gap:8px; padding:6px 12px; overflow-x:auto; overflow-y:visible; min-height:168px}
  .cust{min-width:128px; background:#fff; border-radius:18px; padding:8px; box-shadow:0 4px 10px var(--shadow); position:relative; text-align:center}
  .cust .face{font-size:34px}
  .cust .order{font-size:12px; font-weight:800; margin-top:2px}
  .patience{height:8px; border-radius:6px; background:#eee; margin-top:6px; overflow:hidden}
  .patience > i{display:block; height:100%; background:var(--mint)}
  .needlist{display:flex; gap:4px; justify-content:center; margin-top:6px; flex-wrap:wrap}
  .needchip{font-size:16px; background:#f3ede4; border-radius:10px; width:26px; height:26px; display:flex; align-items:center; justify-content:center; position:relative; opacity:.55; transition:all .15s}
  .needchip.got{background:var(--mint); opacity:1; box-shadow:0 0 0 2px rgba(61,214,176,.35)}
  .needchip.got::after{content:"✓"; position:absolute; top:-4px; right:-4px; background:#fff; color:var(--mint); font-size:10px; font-weight:900; border-radius:50%; width:13px; height:13px; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .tierpick{background:#fff; border-radius:20px; padding:14px; margin-bottom:12px; box-shadow:0 5px 14px var(--shadow); cursor:pointer; border:3px solid transparent; text-align:left}
  .tierpick.sel{border-color:var(--mint); background:#f2fbf8}
  .tierpick .tname{font-size:17px; font-weight:900}
  .tierpick .tdesc{font-size:13px; font-weight:700; opacity:.7; margin-top:2px}
  .stations{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:8px 12px}
  .station{background:#fff; border-radius:16px; padding:10px 4px; text-align:center; box-shadow:0 4px 10px var(--shadow); cursor:pointer; font-size:13px; min-height:52px}
  .station .se{font-size:28px}
  .tray{display:flex; gap:6px; flex-wrap:wrap; min-height:56px; padding:8px 12px; align-items:center}
  .traychip{background:var(--yellow); color:var(--cocoa); border-radius:14px; padding:10px 12px; font-size:14px; box-shadow:0 3px 6px var(--shadow); cursor:pointer; min-height:44px; display:inline-flex; align-items:center}
  .combo{position:absolute; top:60px; left:0; right:0; text-align:center; font-size:30px; pointer-events:none; z-index:20;
         color:var(--coral); opacity:0}

  /* shop / list rows */
  .row{background:#fff; border-radius:18px; padding:14px; margin-bottom:12px; box-shadow:0 5px 14px var(--shadow); display:flex; align-items:center; gap:12px}
  .row .rt{flex:1} .row .rname{font-size:17px} .row .rdesc{font-size:13px; font-weight:700; opacity:.7}
  .owned{color:var(--mint)}

  /* settings sliders */
  .setrow{display:flex; align-items:center; gap:12px; background:#fff; border-radius:16px; padding:12px 14px; margin-bottom:10px; box-shadow:0 4px 10px var(--shadow)}
  .setrow label{flex:1; font-size:15px}
  input[type=range]{-webkit-appearance:none; appearance:none; height:8px; border-radius:6px; background:#eee; width:130px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:var(--pink); box-shadow:0 2px 5px var(--shadow); cursor:pointer}
  input[type=range]::-moz-range-thumb{width:24px; height:24px; border:none; border-radius:50%; background:var(--pink); cursor:pointer}
  .toggle{width:56px; height:32px; border-radius:20px; background:#ddd; position:relative; cursor:pointer; transition:background .2s; flex:none}
  .toggle.on{background:var(--mint)}
  .toggle i{position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; transition:left .2s; box-shadow:0 2px 4px rgba(0,0,0,.2)}
  .toggle.on i{left:27px}

  /* map worlds */
  .world{background:#fff; border-radius:24px; padding:16px; margin-bottom:14px; box-shadow:0 6px 16px var(--shadow); display:flex; gap:14px; align-items:center; cursor:pointer}
  .world .wemoji{font-size:44px}
  .world .wt{flex:1}
  .world .wname{font-size:19px}
  .world .wprog{font-size:13px; font-weight:700; opacity:.7}

  /* modal */
  .modal{position:absolute; inset:0; background:rgba(74,44,42,.45); z-index:1000; display:none; align-items:center; justify-content:center; padding:24px}
  .modal.show{display:flex}
  .modalbox{background:#fff; border-radius:24px; padding:22px; max-width:340px; width:100%; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.4);
            animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{from{transform:scale(.7); opacity:0} to{transform:scale(1); opacity:1}}
  .modalbox h3{font-size:23px; margin:6px 0}
  .modalbox p{font-weight:700; font-size:15px; opacity:.8; margin:8px 0 16px}

  /* home hub big buttons */
  .hub{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:12px 16px}
  .hubbtn{border:none; border-radius:24px; padding:22px 10px; color:#fff; font-family:inherit; font-weight:800; font-size:19px;
          box-shadow:0 6px 0 rgba(0,0,0,.12), 0 10px 20px var(--shadow); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px}
  .hubbtn:active{transform:translateY(3px)}
  .hubbtn .he{font-size:34px}

  .toast{position:absolute; bottom:24px; left:50%; transform:translateX(-50%); background:var(--cocoa); color:#fff; padding:12px 20px;
         border-radius:20px; font-size:15px; z-index:1200; opacity:0; transition:opacity .3s, transform .3s; pointer-events:none; text-align:center; max-width:80%}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px)}

  .flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:880; transition:opacity .06s}
  .reduced #particleCanvas{opacity:.85}
  .reduced .modalbox{animation:none}
  .reduced .bigstars span{transition:opacity .2s}
  .reduced .banner{transition:opacity .2s}
  .reduced .toast{transition:opacity .2s}
  .reduced .combo{transition:opacity .2s}
  @media (prefers-reduced-motion: reduce){
    .modalbox{animation:none}
    .bigstars span,.toast,.stepbar>i,.toggle i,.toggle,.btn,.card,.combo,.banner{transition:none}
    .flash{display:none}
  }
  /* Landscape and portrait are both fully playable — see #app sizing above.
     #rotateHint is kept in the DOM (unused) so nothing else needs to change. */
  #rotateHint{display:none;}
  .daycal{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:10px 0}
  .dayc{background:#fff; border-radius:16px; padding:10px 4px; text-align:center; font-size:13px; box-shadow:0 4px 8px var(--shadow); position:relative}
  .dayc.claimed{background:var(--mint); color:#fff}
  .dayc.today{outline:3px solid var(--yellow)}
  .dayc .amt{font-size:18px; margin-top:2px}
  .hint{font-size:13px; font-weight:700; opacity:.7; text-align:center; margin:6px}
  .section-title{font-size:20px; margin:12px 4px 6px}
</style>
</head>
<body>
<div id="app">
  <canvas id="particleCanvas"></canvas>
  <div class="fx-layer" id="fxLayer"></div>
  <div class="flash" id="flash"></div>

  <!-- BOOT -->
  <section class="screen" id="screen-boot">
    <div class="bootbox">
      <div class="chloe-wrap" id="bootChloe" style="width:180px;height:200px"></div>
      <div class="bigtitle">Chef Chloe</div>
      <div class="title" style="margin-top:-6px">Viral Kitchen</div>
      <div class="sub">Tap to start cooking!</div>
      <button class="btn big yellow" id="bootStart" style="margin-top:14px; width:220px">Let's Cook! 👍</button>
    </div>
  </section>

  <section class="screen" id="screen-home"></section>
  <section class="screen" id="screen-map"></section>
  <section class="screen" id="screen-select"></section>
  <section class="screen" id="screen-cook"></section>
  <section class="screen" id="screen-results"></section>
  <section class="screen" id="screen-rush"></section>
  <section class="screen" id="screen-shop"></section>
  <section class="screen" id="screen-wardrobe"></section>
  <section class="screen" id="screen-cookbook"></section>
  <section class="screen" id="screen-settings"></section>
  <section class="screen" id="screen-daily"></section>

  <div class="modal" id="modal"><div class="modalbox" id="modalBox"></div></div>
  <div class="toast" id="toast"></div>
</div>
<div id="rotateHint"><div style="font-size:52px">🔄</div><div>Please rotate to portrait<br>to keep cooking!</div></div>

<script>
"use strict";
/* ==========================================================================
   Small utility helpers
   ========================================================================== */
const $  = (s,r)=>(r||document).querySelector(s);
const $$ = (s,r)=>Array.prototype.slice.call((r||document).querySelectorAll(s));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>{ if(a===undefined)a=1; if(b===undefined)b=0; return b+Math.random()*(a-b); };
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const now=()=>performance.now();
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function appRect(){ return document.getElementById("app").getBoundingClientRect(); }

/* ==========================================================================
   [SAVE] localStorage save system
   ========================================================================== */
const SAVE_KEY="chefChloeViralKitchen_v1";
const DefaultSave={
  coins:120, gems:6, stars:{}, best:{},
  unlocked:{dubai_chocolate_bar:true, tanghulu:true, choc_strawberries:true},
  learned:{}, owned:{}, fullKitchen:false,
  cosmetic:{outfit:"classic", glasses:"pink", apron:"strawberry"},
  cafe:{level:1, speed:1, stations:3, decor:0, tier:"beginner"},
  daily:{lastClaim:"", streak:0},
  trending:{date:"", recipeId:"", best:0},
  settings:{music:.6, sfx:.9, asmr:.85, asmrOn:true, haptics:true, hapticIntensity:.8, reducedMotion:false, cozy:false, muted:false},
  seenBoot:false
};
let S=loadSave();
function loadSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DefaultSave));
    return deepMerge(JSON.parse(JSON.stringify(DefaultSave)),JSON.parse(raw));
  }catch(e){ return JSON.parse(JSON.stringify(DefaultSave)); }
}
function deepMerge(base,over){
  if(over==null) return base;
  for(const k in over){
    if(over[k]&&typeof over[k]==="object"&&!Array.isArray(over[k])&&typeof base[k]==="object"&&base[k]!=null){
      deepMerge(base[k],over[k]);
    }else base[k]=over[k];
  }
  return base;
}
let _saveT=0;
function save(){ clearTimeout(_saveT); _saveT=setTimeout(()=>{ try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){} },120); }

/* ==========================================================================
   [HAPTICS] platform-safe abstraction — NEVER throws where unsupported.
   ----------------------------------------------------------------------------
   Web build backs these with navigator.vibrate() (Android/dev). On iOS Safari
   navigator.vibrate is absent -> every call is a safe no-op.

   NATIVE / CAPACITOR WRAPPER MAPPING (documented for the App-Store build):
     Haptics.transient(intensity, sharpness)
        -> iOS Core Haptics CHHapticEvent(.hapticTransient) with
           CHHapticEventParameter(.hapticIntensity,intensity) and (.hapticSharpness,sharpness),
           played on a shared CHHapticEngine. Simple taps may use UIImpactFeedbackGenerator
           (light/medium/heavy chosen from intensity).
     Haptics.continuous({intensity,sharpness,duration})
        -> CHHapticEvent(.hapticContinuous,duration:...) with a parameter curve so the
           haptic intensity follows the SAME envelope value as the audio layer.
     Haptics.pattern('CRACK'|'CELEBRATE'|'OOPS'|...)
        -> a prebuilt AHAP pattern (or CHHapticPattern) per named event, fired frame-locked
           with the Juice Event's sound + visuals.
     @capacitor/haptics covers simple impact/notification cases; a small native Core Haptics
     bridge covers custom transient+sharpness and AHAP patterns.
   Graceful tiers: iPhone(Core Haptics) -> iPad/unsupported(UIFeedback or none)
                   -> Android(vibrate patterns) -> desktop/web(visual+audio only).
   ========================================================================== */
const Haptics=(function(){
  const canVibrate = typeof navigator!=="undefined" && typeof navigator.vibrate==="function";
  let _lastContinuous=0;
  function on(){ return S.settings.haptics; }
  function scaledPattern(pat){
    const k=clamp(S.settings.hapticIntensity,0,1);
    return pat.map((v,i)=> i%2===0 ? Math.max(1,Math.round(v*(.4+.6*k))) : v );
  }
  function vibe(pat){
    if(!on()||!canVibrate) return;
    try{ navigator.vibrate(scaledPattern(Array.isArray(pat)?pat:[pat])); }catch(e){/* never throw */}
  }
  return {
    supported:canVibrate,
    transient(intensity,sharpness){ if(intensity===undefined)intensity=.7; vibe([Math.round(8+intensity*30)]); },
    continuous(env){ env=env||{}; const t=(typeof performance!=="undefined"?performance.now():Date.now());
      if(t-_lastContinuous<60) return; _lastContinuous=t;
      vibe([Math.round((env.duration||.2)*300*(env.intensity||.5)+10)]); },
    pattern(name){
      const P={
        CRACK:[26,18,10], SMASH:[40,20,26,14,30], TICK:[10],
        CELEBRATE:[16,40,16,40,26], COMBO:[8,20,10], OOPS:[10,60,10],
        POUR:[60], SIZZLE:[120], STAR:[14,30,14,30,22], COIN:[9]
      };
      vibe(P[name]||[12]);
    }
  };
})();

/* ==========================================================================
   [AUDIO] Layered Web Audio engine
   ----------------------------------------------------------------------------
   Path per SFX: sources -> per-layer ADSR gain -> [dry + reverb send]
                 -> category bus (sfx/asmr/music) -> compressor -> limiter -> out.
   ADSR envelopes, filtered-noise layers, algorithmic reverb send, master
   compressor+limiter, music side-chain ducking under big SFX, per-trigger
   pitch/gain randomization (anti machine-gun).

   PRODUCTION UPGRADE PATH: in the native / App-Store build swap this live
   synthesis for base64-embedded or engine-loaded professionally-recorded Foley
   and adaptive-audio middleware (FMOD / Wwise) — the SAME Juice Event bus
   drives it, just higher-fidelity assets.
   ========================================================================== */
const Audio2=(function(){
  let ctx=null, master, comp, limiter, revNode, revGain;
  let busMusic, busSfx, busAsmr;
  let musicPlaying=false, ready=false, noiseBuf=null;
  let musicEnergy=0, musicTimer=null, step=0, duckUntil=0;

  function init(){
    if(ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC){ ready=false; return; }
    try{ ctx=new AC(); }catch(e){ ready=false; return; }
    master=ctx.createGain(); master.gain.value=0.9;
    comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.knee.value=24; comp.ratio.value=3.4; comp.attack.value=.004; comp.release.value=.18;
    limiter=ctx.createDynamicsCompressor();

    comp.connect(limiter).connect(master).connect(ctx.destination);
    noiseBuf=makeNoise(1.2);
    ready=true;
    applyMix();

  }
  function makeNoise(sec){
    const n=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0);

    const n=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(2,n,ctx.sampleRate);
    for(let c=0;c<2;c++){ const d=b.getChannelData(c);

  }
  function applyMix(){
    if(!ready) return;
    const s=S.settings, m=s.muted?0:1;
    master.gain.value=0.9*m;

    if(ctx.currentTime>=duckUntil){

  function duck(amount,time){
    amount=amount||.5; time=time||.28;
    if(!ready||!musicPlaying) return;
    const g=busMusic.gain, t=ctx.currentTime, base=S.settings.music*0.55;

  function voice(o){

    node.connect(g);
    out.connect(bus);
    if(o.reverb){ const rs=ctx.createGain(); rs.gain.value=o.reverb; out.connect(rs); rs.connect(revNode); }
    const peak=(o.gain||.5)*rand(1.06,.9);
    const A=o.a!=null?o.a:.005, D=o.d!=null?o.d:.05, Sl=o.s!=null?o.s:0, R=o.r!=null?o.r:.12, dur=o.dur||.2;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(peak,t+A);
    g.gain.linearRampToValueAtTime(Math.max(.0001,peak*(Sl||.0001)),t+A+D);
    g.gain.setValueAtTime(Math.max(.0001,peak*(Sl||.0001)),t+Math.max(A+D,dur));
    g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(A+D,dur)+R);
    src.start(t);
    src.stop(t+Math.max(A+D,dur)+R+.05);
  }
  const SND={
    chop(pan){ voice({type:"square",freq:1400,gain:.28,a:.001,d:.03,r:.03,dur:.04,pitchVar:2,pan,cat:"asmr"});
               voice({type:"sine",freq:230,gain:.4,a:.001,d:.08,r:.06,dur:.09,pitchVar:1.5,pan});
               voice({noise:true,filter:"highpass",cutoff:3500,gain:.18,a:.001,d:.04,r:.03,dur:.05,pan,reverb:.15,cat:"asmr"}); },
    crack(pan){ voice({noise:true,filter:"highpass",cutoff:2600,gain:.6,a:.0005,d:.02,r:.06,dur:.05,pan,reverb:.25});
                voice({type:"triangle",freq:2100,glide:1500,gain:.34,a:.0008,d:.12,r:.18,dur:.18,pan,reverb:.4,cat:"asmr"});
                voice({type:"sine",freq:120,glide:60,gain:.55,a:.001,d:.1,r:.16,dur:.16,pan});
                voice({noise:true,filter:"bandpass",cutoff:1800,q:2,gain:.2,a:.03,d:.15,r:.2,dur:.2,delay:.04,pan,cat:"asmr"}); },
    smash(pan){ voice({type:"sine",freq:90,glide:45,gain:.7,a:.001,d:.14,r:.2,dur:.2,pan});
                voice({noise:true,filter:"lowpass",cutoff:900,sweep:200,gain:.4,a:.002,d:.18,r:.22,dur:.24,pan,reverb:.2,cat:"asmr"});
                voice({type:"square",freq:180,gain:.16,a:.001,d:.05,r:.05,dur:.06,pan}); },
    whisk(pan){ voice({noise:true,filter:"bandpass",cutoff:2600,q:1.5,gain:.14,a:.02,d:.08,s:.3,r:.1,dur:.14,pan,reverb:.18,cat:"asmr",pitchVar:1}); },
    pour(pan){ voice({noise:true,filter:"bandpass",cutoff:900,q:3,gain:.16,a:.04,d:.2,s:.5,r:.2,dur:.5,sweep:1400,pan,reverb:.2,cat:"asmr"});
               voice({type:"sine",freq:520,glide:680,gain:.1,a:.05,d:.3,r:.2,dur:.45,pan}); },
    sizzle(pan){ voice({noise:true,filter:"highpass",cutoff:2400,gain:.16,a:.08,d:.3,s:.6,r:.4,dur:.7,pan,reverb:.22,cat:"asmr"}); },
    squish(pan){ voice({type:"sine",freq:300,glide:160,gain:.34,a:.006,d:.12,r:.12,dur:.16,pan,pitchVar:2,cat:"asmr"});
                 voice({noise:true,filter:"lowpass",cutoff:700,gain:.1,a:.01,d:.1,r:.1,dur:.14,pan}); },
    drip(pan){ voice({type:"sine",freq:900,glide:400,gain:.24,a:.001,d:.06,r:.1,dur:.12,pan,pitchVar:2,cat:"asmr"}); },
    sprinkle(pan){ for(let i=0;i<5;i++) voice({type:"triangle",freq:rand(2600,1600),gain:.08,a:.001,d:.03,r:.03,dur:.04,delay:i*.03,pan,cat:"asmr"}); },
    pop(pan){ voice({type:"sine",freq:700,glide:1300,gain:.3,a:.001,d:.05,r:.05,dur:.07,pan,pitchVar:2,cat:"asmr"}); },
    fizz(pan){ voice({noise:true,filter:"highpass",cutoff:4000,gain:.1,a:.04,d:.4,s:.5,r:.4,dur:.8,pan,cat:"asmr"}); },
    ding(pan,semi){ semi=semi||0; voice({type:"sine",freq:880*Math.pow(2,semi/12),gain:.32,a:.001,d:.18,r:.35,dur:.3,pan,reverb:.35});
                    voice({type:"sine",freq:1760*Math.pow(2,semi/12),gain:.12,a:.001,d:.1,r:.2,dur:.2,pan,reverb:.3}); },
    tick(){ voice({type:"square",freq:1200,gain:.14,a:.001,d:.02,r:.02,dur:.03,pitchVar:2}); },
    coin(pan){ voice({type:"square",freq:1180,gain:.16,a:.001,d:.04,r:.05,dur:.05,pan,pitchVar:1});
               voice({type:"square",freq:1760,gain:.12,a:.001,d:.05,r:.06,dur:.06,delay:.05,pan}); },
    star(){ [0,4,7,12].forEach((s,i)=>voice({type:"triangle",freq:660*Math.pow(2,s/12),gain:.2,a:.002,d:.15,r:.3,dur:.25,delay:i*.06,reverb:.4})); },
    whoosh(pan){ voice({noise:true,filter:"bandpass",cutoff:1200,sweep:2600,q:1,gain:.2,a:.02,d:.14,r:.1,dur:.2,pan,cat:"asmr"}); },
    oops(){ voice({type:"sine",freq:420,glide:300,gain:.2,a:.005,d:.14,r:.12,dur:.2}); voice({type:"sine",freq:330,glide:250,gain:.16,a:.01,d:.16,r:.12,dur:.22,delay:.08}); },
    ui(){ voice({type:"triangle",freq:660,gain:.14,a:.001,d:.05,r:.05,dur:.06,pitchVar:1}); },
    fanfare(){ [0,4,7,12,16].forEach((s,i)=>voice({type:"triangle",freq:523*Math.pow(2,s/12),gain:.2,a:.003,d:.2,r:.3,dur:.3,delay:i*.09,reverb:.45})); }
  };
  function startMusic(){ if(!ready||musicPlaying||S.settings.muted) return; musicPlaying=true; step=0; scheduleLoop(); }
  function stopMusic(){ musicPlaying=false; clearTimeout(musicTimer); musicTimer=null; }
  function scheduleLoop(){
    if(!ready||!musicPlaying) return;
    const bpm=96, beat=60/bpm, scale=[0,2,4,7,9], root=220;
    const chords=[[0,4,7],[-3,0,4],[-5,-1,2],[-1,2,7]];
    const bar=step%4;
    chords[bar].forEach(iv=>voice({type:"triangle",freq:root*Math.pow(2,iv/12),gain:.05+musicEnergy*.03,a:.15,d:.4,s:.4,r:.6,dur:beat*3.4,cat:"music",reverb:.5}));
    const notes=2+Math.round(musicEnergy*4);
    for(let i=0;i<notes;i++){ const iv=pick(scale)+12;
      voice({type:"sine",freq:root*Math.pow(2,iv/12),gain:.06+musicEnergy*.04,a:.01,d:.2,r:.2,dur:.28,delay:i*(beat*4/notes),cat:"music",reverb:.4}); }

  }

  function suspend(){ stopMusic(); if(ctx&&ctx.state==="running"){ try{ctx.suspend();}catch(e){} } }
  function wake(){ if(ctx&&ctx.state==="suspended"){ try{ctx.resume();}catch(e){} } if(ready&&!S.settings.muted&&!musicPlaying) startMusic(); }
  return {
    init, resume, applyMix, duck, setEnergy, startMusic, stopMusic, suspend, wake,
    play(name,opts){ if(!ready) return; try{ if(SND[name]) SND[name]((opts&&opts.pan)||0,(opts&&opts.semi)||0); }catch(e){} },
    get ready(){ return ready; }
  };
})();

/* ==========================================================================
   [PARTICLES] pooled particle + floating number system (canvas)
   ========================================================================== */
const Particles=(function(){
  const cvs=document.getElementById("particleCanvas"), ctx=cvs.getContext("2d");
  let W=0,H=0,dpr=1;
  const pool=[]; const active=[];
  const MAX=260;
  function resize(){
    const app=appRect();
    dpr=Math.min(2,window.devicePixelRatio||1);
    W=app.width; H=app.height;
    cvs.width=W*dpr; cvs.height=H*dpr; cvs.style.width=W+"px"; cvs.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function get(){ return pool.pop()||{}; }
  function cap(){ return S.settings.reducedMotion?60:MAX; }
  function spawn(o){
    if(active.length>=cap()) return;
    const p=get();
    p.x=o.x; p.y=o.y; p.vx=o.vx||0; p.vy=o.vy||0; p.g=o.g||0; p.life=o.life||.8; p.age=0;
    p.size=o.size||6; p.color=o.color||"#fff"; p.shape=o.shape||"circle";
    p.spin=o.spin||0; p.rot=o.rot||0; p.fade=o.fade!==false; p.text=o.text||null; p.drag=o.drag||1;
    active.push(p);
  }
  function burst(x,y,opts){
    opts=opts||{};
    let n=opts.n||14;
    if(S.settings.reducedMotion && opts.reduced!==false) n=Math.min(n,6);
    for(let i=0;i<n;i++){
      const a=rand(Math.PI*2), sp=rand(opts.speed||260,60);
      spawn({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(opts.up||60),g:opts.g!=null?opts.g:520,
        life:rand(opts.life||1.0,.5),size:rand(opts.size||9,4),
        color:opts.colors?pick(opts.colors):(opts.color||"#FFC93C"),
        shape:opts.shape||pick(["circle","square","star"]),spin:rand(8,-8),drag:opts.drag||1});
    }
  }
  function shards(x,y,color){
    const n=S.settings.reducedMotion?8:18;
    for(let i=0;i<n;i++){ const a=rand(Math.PI*2),sp=rand(360,120);
      spawn({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,g:900,life:rand(1.1,.6),size:rand(12,5),
        color:color||"#7a4a2a",shape:"shard",spin:rand(14,-14),drag:.99}); }
  }
  function floatText(x,y,text,color){
    spawn({x,y,vx:rand(30,-30),vy:-120,g:120,life:1.1,size:26,color:color||"#FF7A59",shape:"text",text,fade:true,drag:.94});
  }
  function confetti(){
    const cols=["#FF5D8F","#FF7A59","#3DD6B0","#FFC93C","#7C5CFF"];
    const n=S.settings.reducedMotion?18:44;
    for(let i=0;i<n;i++) spawn({x:rand(W,0),y:-20,vx:rand(60,-60),vy:rand(120,40),g:260,life:rand(2.4,1.4),
      size:rand(11,6),color:pick(cols),shape:pick(["square","circle"]),spin:rand(10,-10),drag:1});
  }
  function drawStar(cx,cy,r,rot){
    ctx.beginPath();
    for(let i=0;i<5;i++){ const a=rot+i*Math.PI*2/5-Math.PI/2;
      ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
      const a2=a+Math.PI/5; ctx.lineTo(cx+Math.cos(a2)*r*.45,cy+Math.sin(a2)*r*.45); }
    ctx.closePath();
  }
  function update(dt){
    ctx.clearRect(0,0,W,H);
    for(let i=active.length-1;i>=0;i--){
      const p=active[i]; p.age+=dt;
      if(p.age>=p.life){ active.splice(i,1); pool.push(p); continue; }
      p.vy+=p.g*dt; p.vx*=p.drag; p.vy*=p.drag; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.spin*dt;
      const k=p.fade?(1-p.age/p.life):1;
      ctx.globalAlpha=clamp(k,0,1);
      ctx.fillStyle=p.color;
      if(p.shape==="text"){
        ctx.font="800 "+p.size+"px 'Baloo 2', Nunito, sans-serif";
        ctx.textAlign="center"; ctx.lineWidth=4; ctx.strokeStyle="#fff";
        ctx.strokeText(p.text,p.x,p.y); ctx.fillText(p.text,p.x,p.y);
      }else if(p.shape==="star"){
        drawStar(p.x,p.y,p.size,p.rot); ctx.fill();
      }else if(p.shape==="square"||p.shape==="shard"){
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        if(p.shape==="shard"){ ctx.beginPath(); ctx.moveTo(0,-p.size); ctx.lineTo(p.size*.7,p.size*.6); ctx.lineTo(-p.size*.6,p.size*.5); ctx.closePath(); ctx.fill(); }
        else ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
        ctx.restore();
      }else{
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      }
    }
    ctx.globalAlpha=1;
  }
  return {resize,update,burst,shards,floatText,confetti,spawn, get count(){return active.length;}};
})();

/* ==========================================================================
   Screen-shake + slow-mo + flash controllers
   ========================================================================== */
const FX=(function(){
  const app=document.getElementById("app"), flash=document.getElementById("flash");
  let shake=0, slow=1, slowUntil=0;
  function screenShake(mag){ if(mag===undefined)mag=8; if(S.settings.reducedMotion) mag*=.35; shake=Math.max(shake,mag); }
  function slowMo(scale,ms){ slow=scale||.35; slowUntil=now()+(ms||150); }
  function doFlash(a,color){ if(a===undefined)a=.7; if(S.settings.reducedMotion)a*=.5; flash.style.background=color||"#fff"; flash.style.opacity=a;
    setTimeout(()=>flash.style.opacity=0,60); }
  function timeScale(){ if(now()>slowUntil) slow=1; return slow; }
  function apply(){
    if(shake>.4){ const dx=rand(shake,-shake), dy=rand(shake,-shake); app.style.transform="translate("+dx+"px,"+dy+"px)"; shake*=.86; }
    else { shake=0; app.style.transform=""; }
  }
  return {screenShake,slowMo,doFlash,timeScale,apply};
})();

      +'<circle cx="100" cy="96" r="46" fill="url(#skin_'+uid+')" stroke="#4A2C2A" stroke-width="3"/>'
      +'<path d="M56 78 Q60 44 100 42 Q140 44 144 78 Q140 62 100 60 Q60 62 56 78Z" fill="#3A2418"/>'
      +'<circle cx="80" cy="54" r="12" fill="#3A2418"/><circle cx="100" cy="48" r="13" fill="#3A2418"/><circle cx="120" cy="54" r="12" fill="#3A2418"/>'
      +'<circle cx="100" cy="47" r="5" fill="#FFC93C"/>'
      +'<circle cx="70" cy="110" r="11" fill="url(#cheek_'+uid+')"/><circle cx="130" cy="110" r="11" fill="url(#cheek_'+uid+')"/>'
      +eyes(expr)
      +'<g fill="none" stroke="#4A2C2A" stroke-width="3">'

  function draw(container,o){ if(!container) return; container.innerHTML=render(o); }

/* ==========================================================================
   [JUICE] Unified Juice Event bus + data-driven Juice Table
   ----------------------------------------------------------------------------
   Juice.fire('CRACK',{x,y}) triggers VISUAL + AUDIO + HAPTIC on the same frame.
   Coordinates x,y are relative to the #app box. `pan` derives from x.
   ========================================================================== */
const Juice=(function(){
  function panFor(x){ const w=appRect().width||400; return clamp((x/w)*2-1,-1,1); }
  const T={
    CRACK:(e)=>{ FX.doFlash(.85); FX.screenShake(16); FX.slowMo(.28,170);
      Particles.shards(e.x,e.y,e.color||"#6b3f22"); Particles.burst(e.x,e.y,{n:20,colors:["#fff","#C9A15A","#6b3f22"],speed:340,size:10});
      Audio2.play("crack",{pan:panFor(e.x)}); Audio2.duck(.6,.3); Haptics.pattern("CRACK"); },
    SMASH:(e)=>{ FX.doFlash(.6); FX.screenShake(14); FX.slowMo(.4,140);
      Particles.burst(e.x,e.y,{n:16,colors:["#FFC93C","#FF7A59","#fff"],speed:300,size:11});
      Audio2.play("smash",{pan:panFor(e.x)}); Audio2.duck(.5,.28); Haptics.pattern("SMASH"); },
    PERFECT_CHOP:(e)=>{ Particles.burst(e.x,e.y,{n:8,colors:["#fff","#FFC93C"],speed:180,size:7,g:400});
      Particles.floatText(e.x,e.y-18,"+"+(e.pts||10),"#3DD6B0"); Audio2.play("chop",{pan:panFor(e.x)}); Haptics.transient(.55,.85); },
    CHOP:(e)=>{ Particles.burst(e.x,e.y,{n:5,colors:["#fff","#eebb88"],speed:150,size:6}); Audio2.play("chop",{pan:panFor(e.x)}); Haptics.transient(.4,.8); },
    WHISK:(e)=>{ if(Math.random()<.5)Particles.burst(e.x,e.y,{n:3,colors:["#fff"],speed:80,size:5,life:.4,reduced:false}); Audio2.play("whisk",{pan:panFor(e.x)}); Haptics.continuous({duration:.1,intensity:.35}); },
    POUR:(e)=>{ Particles.spawn({x:e.x,y:e.y,vx:rand(10,-10),vy:120,g:200,life:.5,size:5,color:e.color||"#FFB0C4",shape:"circle"}); Audio2.play("pour",{pan:panFor(e.x)}); Haptics.continuous({duration:.16,intensity:.3}); },
    SIZZLE:(e)=>{ if(Math.random()<.4)Particles.spawn({x:e.x+rand(20,-20),y:e.y,vx:rand(20,-20),vy:-60,g:-40,life:1,size:6,color:"rgba(255,255,255,.6)",shape:"circle"}); Audio2.play("sizzle",{pan:panFor(e.x)}); Haptics.continuous({duration:.1,intensity:.25}); },
    PIPE:(e)=>{ Particles.spawn({x:e.x,y:e.y,vx:0,vy:0,g:0,life:.6,size:5,color:e.color||"#fff",shape:"circle"}); Audio2.play("squish",{pan:panFor(e.x)}); Haptics.transient(.3,.4); },
    KNEAD:(e)=>{ Audio2.play("squish",{pan:panFor(e.x)}); Haptics.transient(.4,.3); Particles.burst(e.x,e.y,{n:3,colors:["#fff","#f0d0a0"],speed:80,size:6}); },
    DIP:(e)=>{ Particles.burst(e.x,e.y,{n:8,colors:[e.color||"#8a4a2a","#fff"],speed:140,size:7,up:20}); Audio2.play("drip",{pan:panFor(e.x)}); Haptics.transient(.4,.5); },
    SPRINKLE:(e)=>{ Particles.burst(e.x,e.y,{n:10,colors:["#FF5D8F","#3DD6B0","#FFC93C","#7C5CFF"],speed:120,size:5,g:500}); Audio2.play("sprinkle",{pan:panFor(e.x)}); Haptics.transient(.25,.7); },
    FLIP:(e)=>{ FX.slowMo(.5,120); Audio2.play("whoosh",{pan:panFor(e.x)}); Audio2.play("sizzle",{pan:panFor(e.x)}); Haptics.transient(.5,.5); },
    STACK:(e)=>{ Particles.burst(e.x,e.y,{n:6,colors:["#fff","#FFC93C"],speed:120,size:7}); Audio2.play("squish",{pan:panFor(e.x)}); Haptics.transient(.5,.6); },
    POP:(e)=>{ Particles.burst(e.x,e.y,{n:6,colors:["#4A2C2A","#fff"],speed:160,size:6}); Audio2.play("pop",{pan:panFor(e.x)}); Haptics.transient(.4,.7); },
    COMBO_UP:(e)=>{ Audio2.play("ding",{semi:clamp(e.combo||1,0,14)}); Haptics.pattern("COMBO"); Particles.floatText(e.x||200,e.y||120,"x"+(e.combo||1),"#FF7A59"); },
    COIN:(e)=>{ if(e.amt) Particles.floatText(e.x||200,e.y||120,"+"+(e.amt||1),"#FFC93C"); Audio2.play("coin"); Haptics.pattern("COIN"); },
    STAR_AWARDED:(e)=>{ Audio2.play("star"); Haptics.pattern("STAR"); Particles.burst(e.x||200,e.y||150,{n:12,colors:["#FFC93C","#fff"],shape:"star",speed:200,size:12}); },
    STEP_DONE:(e)=>{ FX.doFlash(.3,"#FFF6E9"); Audio2.play("ui"); Haptics.transient(.4,.6); Particles.burst(e.x||200,e.y||200,{n:8,colors:["#3DD6B0","#fff"],speed:150,size:7}); },
    OOPS:()=>{ Audio2.play("oops"); Haptics.pattern("OOPS"); },
    CELEBRATE:()=>{ Particles.confetti(); Audio2.play("fanfare"); Audio2.duck(.4,.5); Haptics.pattern("CELEBRATE"); FX.doFlash(.4); },
    UI_TAP:()=>{ Audio2.play("ui"); Haptics.transient(.2,.5); },
    FIZZ:(e)=>{ Audio2.play("fizz",{pan:panFor(e.x||0)}); Haptics.continuous({duration:.2,intensity:.2}); }
  };
  function fire(name,e){ e=e||{}; const fn=T[name]; if(fn){ try{fn(e);}catch(err){} } }
  return {fire, TABLE:T};
})();

/* ==========================================================================
   [VERBS] Data-driven technique-VERB engine
   ----------------------------------------------------------------------------
   Each verb is a mini-game rendered into the cook stage canvas. Signature:
     verbFn(stage, params, done)
       stage  = { canvas, ctx, w, h, prompt(text), chloe(expr,line) }
       params = author-supplied numbers/colors from the recipe step
       done({score:0..1}) = call when the step is complete
   Every verb gives INSTANT visual+audio+haptic confirmation via Juice.fire.
   ========================================================================== */
const Verbs=(function(){
  function pointer(stage,ev){
    const r=stage.canvas.getBoundingClientRect();
    const t=ev.touches&&ev.touches[0]?ev.touches[0]:ev;
    return {x:(t.clientX-r.left), y:(t.clientY-r.top), gx:t.clientX-appRect().left, gy:t.clientY-appRect().top};
  }
  function bind(stage,handlers){
    const c=stage.canvas; const wrap={};
    const map={down:["pointerdown"],move:["pointermove"],up:["pointerup","pointercancel"]};
    for(const key in map){
      map[key].forEach(evt=>{
        const h=e=>{ e.preventDefault(); if(handlers[key]) handlers[key](pointer(stage,e),e); };
        wrap[evt]=h; c.addEventListener(evt,h,{passive:false});
      });
    }
    stage._unbind=()=>{ for(const evt in wrap) c.removeEventListener(evt,wrap[evt]); };
  }
  function roundRect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function meter(ctx,w,h,v){
    const gx=w*.2,gy=h*.9,gw=w*.6;
    ctx.fillStyle="rgba(255,255,255,.7)"; roundRect(ctx,gx,gy,gw,12,8); ctx.fill();
    ctx.fillStyle="#3DD6B0"; roundRect(ctx,gx,gy,gw*clamp(v,0,1),12,8); ctx.fill();
  }
  function hx(c){ c=c.replace("#",""); if(c.length===3)c=c.split("").map(x=>x+x).join(""); return [parseInt(c.substr(0,2),16),parseInt(c.substr(2,2),16),parseInt(c.substr(4,2),16)]; }
  function blend(a,b,t){ const A=hx(a),B=hx(b); return "rgb("+Math.round(lerp(A[0],B[0],t))+","+Math.round(lerp(A[1],B[1],t))+","+Math.round(lerp(A[2],B[2],t))+")"; }
  function makePath(shape,stage){
    const pts=[],w=stage.w,h=stage.h;
    if(shape==="bar"){ for(let i=0;i<=24;i++){ const t=i/24; pts.push({x:w*.2+w*.6*t,y:h*.46}); }
      for(let i=1;i<=24;i++){ const t=i/24; pts.push({x:w*.2+w*.6*t,y:h*.56}); } }
    else if(shape==="heart"){ for(let i=0;i<=40;i++){ const a=i/40*Math.PI*2; const x=16*Math.pow(Math.sin(a),3);
      const y=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a); pts.push({x:w/2+x*(w*.012),y:h*.5-y*(h*.02)}); } }
    else { for(let i=0;i<=30;i++){ const a=i/30*Math.PI*2; pts.push({x:w/2+Math.cos(a)*w*.2,y:h*.5+Math.sin(a)*h*.16}); } }
    return pts;
  }
  function end(stage,done,score){
    if(stage._done) return; stage._done=true;
    if(stage._unbind) stage._unbind(); if(stage._cleanup) stage._cleanup();
    Juice.fire("STEP_DONE",{x:stage.w/2,y:stage.h/2});
    stage.chloe(score>.75?"yum":"idle",score>.75?"Yum, perfect!":"Good job!");
    setTimeout(()=>done({score:clamp(score,0,1)}),380);
  }

  /* ---------- CHOP / SLICE ---------- */
  function chop(stage,p,done){
    const cuts=p.cuts||5; let made=0, quality=0, raf;
    const targets=[]; for(let i=0;i<cuts;i++) targets.push({x:(i+1)/(cuts+1),done:false});
    const crust=p.crust||"#F3C67A", inside=p.inside||"#FFF3D6";
    const pieces=[]; // little cross-section chunks that pop out and roll, Toca-Boca style
    stage.prompt("Swipe across each dotted line! 🔪"); stage.chloe("focus","Nice and steady…");
    let startY=null;
    function spawnPiece(t){
      const x=stage.w*(.12+.76*t.x), speckCount=3+Math.floor(rand(3,0));
      pieces.push({ x, y:stage.h*.5, vx:rand(70,-70), vy:-rand(120,60), rot:0, vr:rand(6,-6),
        r:stage.h*.055, life:1, speck:Array.from({length:speckCount},()=>({dx:rand(.6,-.6),dy:rand(.5,-.5)})) });
    }
    function render(){
      const ctx=stage.ctx,w=stage.w,h=stage.h; ctx.clearRect(0,0,w,h);
      // the log: crust outside, pale cross-section tone peeking at the ends
      ctx.fillStyle=crust; roundRect(ctx,w*.12,h*.4,w*.76,h*.2,26); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.35)"; roundRect(ctx,w*.12,h*.4,w*.76,h*.06,26); ctx.fill();
      ctx.fillStyle=inside; ctx.beginPath(); ctx.ellipse(w*.12+6,h*.5,10,h*.09,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=inside; ctx.beginPath(); ctx.ellipse(w*.88-6,h*.5,10,h*.09,0,0,Math.PI*2); ctx.fill();
      targets.forEach(t=>{
        const tx=w*(.12+.76*t.x);
        if(t.done){
          // an opened cut: a small gap revealing the cross-section on both faces
          ctx.fillStyle=inside; ctx.beginPath(); ctx.ellipse(tx-7,h*.5,9,h*.085,0,0,Math.PI*2); ctx.fill();
          ctx.fillStyle=inside; ctx.beginPath(); ctx.ellipse(tx+7,h*.5,9,h*.085,0,0,Math.PI*2); ctx.fill();
          for(let i=0;i<3;i++){ ctx.fillStyle="rgba(150,100,50,.4)"; ctx.beginPath();
            ctx.arc(tx-7+rand(6,-6),h*.5+rand(h*.06,-h*.06),1.6,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(tx+7+rand(6,-6),h*.5+rand(h*.06,-h*.06),1.6,0,Math.PI*2); ctx.fill(); }
          ctx.strokeStyle="rgba(74,44,42,.3)"; ctx.lineWidth=2;
          ctx.beginPath(); ctx.moveTo(tx-7,h*.4); ctx.lineTo(tx-7,h*.6); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(tx+7,h*.4); ctx.lineTo(tx+7,h*.6); ctx.stroke();
        } else {
          ctx.strokeStyle="rgba(74,44,42,.35)"; ctx.lineWidth=3; ctx.setLineDash([8,8]);
          ctx.beginPath(); ctx.moveTo(tx,h*.36); ctx.lineTo(tx,h*.64); ctx.stroke(); ctx.setLineDash([]);
        }
      });
      // little chopped chunks that pop out and roll/settle
      pieces.forEach(pc=>{
        ctx.save(); ctx.globalAlpha=clamp(pc.life,0,1); ctx.translate(pc.x,pc.y); ctx.rotate(pc.rot);
        ctx.fillStyle=crust; ctx.beginPath(); ctx.arc(0,0,pc.r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=inside; ctx.beginPath(); ctx.arc(0,0,pc.r*.72,0,Math.PI*2); ctx.fill();
        pc.speck.forEach(s=>{ ctx.fillStyle="rgba(150,100,50,.5)"; ctx.beginPath(); ctx.arc(s.dx*pc.r,s.dy*pc.r,1.4,0,Math.PI*2); ctx.fill(); });
        ctx.restore();
      });
    }
    function tick(){
      let alive=false;
      for(let i=pieces.length-1;i>=0;i--){ const pc=pieces[i];
        pc.vy+=9; pc.x+=pc.vx/60; pc.y+=pc.vy/60; pc.rot+=pc.vr/60; pc.vx*=.985;
        if(pc.y>stage.h*.62){ pc.y=stage.h*.62; pc.vy*=-.35; pc.vx*=.7; pc.vr*=.7; if(Math.abs(pc.vy)<20) pc.life-=1/60/.6; }
        if(pc.life<=0) pieces.splice(i,1); else alive=true;
      }
      render();
      raf=requestAnimationFrame(tick);
    }
    let startX=null, moved=false;
    function cut(t,pt,straight){ t.done=true; made++; quality+=.5+straight*.5;
      spawnPiece(t);
      Juice.fire("PERFECT_CHOP",{x:pt.gx,y:pt.gy,pts:10}); render();
      if(made>=cuts) end(stage,done,clamp(quality/cuts,0,1)); }
    bind(stage,{
      down:(pt)=>{ startY=pt.y; startX=pt.x; moved=false; },
      move:(pt)=>{
        if(startY==null) return;
        // "moved" fires on horizontal OR vertical travel — a real swipe across the vertical
        // dashed lines is primarily horizontal, matching the on-screen "swipe across" prompt.
        if(Math.abs(pt.x-startX)>stage.w*.04 || Math.abs(pt.y-startY)>stage.h*.06) moved=true;
        targets.forEach(t=>{ if(t.done)return; const tx=stage.w*(.12+.76*t.x);
          if(moved && Math.abs(pt.x-tx)<stage.w*.06){
            const straight=1-clamp(Math.abs(pt.x-tx)/(stage.w*.06),0,1);
            cut(t,pt,straight);
          }});
      },
      up:(pt)=>{
        // Tap-to-cut fallback for motor accessibility: a tap over an undone line registers with reduced quality.
        if(startY!=null && !moved){
          for(const t of targets){ if(t.done) continue; const tx=stage.w*(.12+.76*t.x);
            if(Math.abs(pt.x-tx)<stage.w*.08){ cut(t,pt,.4); break; } }
        }
        startY=null; startX=null;
      }
    });
    render(); tick(); stage._cleanup=()=>cancelAnimationFrame(raf);
  }

  /* ---------- WHISK / MIX / STIR ---------- */
  function whisk(stage,p,done){
    const need=p.revs||4; let ang=0,last=null,fill=0; const color1="#FFE8B0",color2=p.color||"#FF9EC4";
    stage.prompt("Stir in circles to mix! 🥣"); stage.chloe("focus","Round and round!");
    const cx=()=>stage.w/2, cy=()=>stage.h*.5, R=()=>Math.min(stage.w,stage.h)*.28;
    function render(){
      const ctx=stage.ctx,w=stage.w,h=stage.h; ctx.clearRect(0,0,w,h);
      ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(cx(),cy(),R()+22,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=blend(color1,color2,clamp(fill,0,1)); ctx.beginPath(); ctx.arc(cx(),cy(),R(),0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=6; ctx.beginPath();
      for(let a=0;a<Math.PI*4;a+=.2){ const rr=R()*(a/(Math.PI*4)); const x=cx()+Math.cos(a+ang)*rr, y=cy()+Math.sin(a+ang)*rr; a===0?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.stroke();
      meter(ctx,w,h,fill);
    }
    bind(stage,{
      move:(pt)=>{
        const a=Math.atan2(pt.y-cy(),pt.x-cx());
        if(last!=null){ let d=a-last; if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2;
          if(Math.abs(d)>.02){ ang+=d; fill=clamp(fill+Math.abs(d)/(Math.PI*2*need),0,1); if(Math.random()<.3)Juice.fire("WHISK",{x:pt.gx,y:pt.gy}); } }
        last=a; render();
        if(fill>=1) end(stage,done,1);
      },
      up:()=>{ last=null; }
    });
    render();
  }

  /* ---------- POUR / FILL ---------- */
  function pour(stage,p,done){
    const target=p.target||.8, tol=p.tol||.08; let level=0, pouring=false, raf;
    stage.prompt("Hold to pour — stop at the line! 🫗"); stage.chloe("focus","Careful, don't overflow!");
    function render(){
      const ctx=stage.ctx,w=stage.w,h=stage.h; ctx.clearRect(0,0,w,h);
      const gx=w*.3,gy=h*.2,gw=w*.4,gh=h*.6;
      ctx.fillStyle="#fff"; roundRect(ctx,gx,gy,gw,gh,20); ctx.fill();
      const lh=gh*clamp(level,0,1);
      ctx.fillStyle=p.color||"#FFB0C4"; roundRect(ctx,gx+4,gy+gh-lh,gw-8,lh,16); ctx.fill();
      const ty=gy+gh-gh*target;
      const inTol=Math.abs(level-target)<tol;
      ctx.strokeStyle=inTol?"#3DD6B0":"#FF7A59"; ctx.lineWidth=4; ctx.setLineDash(inTol?[]:[10,6]);
      ctx.beginPath(); ctx.moveTo(gx-10,ty); ctx.lineTo(gx+gw+10,ty); ctx.stroke(); ctx.setLineDash([]);
      // colorblind-safe redundant cue: check glyph when in tolerance, arrow otherwise
      ctx.fillStyle=inTol?"#3DD6B0":"#FF7A59"; ctx.font="800 22px 'Baloo 2',Nunito,sans-serif"; ctx.textAlign="left";
      ctx.fillText(inTol?"✓":(level<target?"↑":"↓"),gx+gw+16,ty+8);
      if(pouring){ ctx.fillStyle="rgba(255,176,196,.7)"; ctx.fillRect(gx+gw/2-6,gy-10,12,gh-lh+10); }
    }
    function tick(){ if(pouring){ level=clamp(level+.012,0,1.2); if(level>=1.15)pouring=false; render(); if(Math.random()<.2)Juice.fire("POUR",{x:stage.w/2,y:stage.h/2}); } raf=requestAnimationFrame(tick); }
    bind(stage,{
      down:()=>{ pouring=true; Juice.fire("POUR",{x:stage.w/2,y:stage.h/2}); },
      up:()=>{ pouring=false; let sc=clamp(1-Math.abs(level-target)/.4,0,1); if(Math.abs(level-target)<tol){ sc=1; FX.doFlash(.25,"#3DD6B0"); } end(stage,done,sc); }
    });
    render(); tick(); stage._cleanup=()=>cancelAnimationFrame(raf);
  }

  /* ---------- MELT / SIZZLE / HEAT — a real stovetop scene ---------- */
  function heat(stage,p,done){
    const dur=p.dur||3.2, lo=p.lo||.45, hi=p.hi||.75; let t0=null,val=0,inZone=0,total=0,held=false,heatv=0,raf,started=false;
    const steam=[]; let steamT=0, releasedBigPuff=false;
    stage.prompt("Hold the flame in the sweet spot! 🔥"); stage.chloe("focus","Keep it cozy warm…");
    function render(){
      const ctx=stage.ctx,w=stage.w,h=stage.h; ctx.clearRect(0,0,w,h);
      const panCx=w/2, panCy=h*.4, panRx=w*.27, panRy=h*.13;
      // countertop + burner ring
      ctx.fillStyle="#3a3238"; ctx.fillRect(0,h*.56,w,h*.44);
      ctx.fillStyle="#2b2529"; ctx.beginPath(); ctx.ellipse(panCx,h*.63,panRx*1.15,h*.05,0,0,Math.PI*2); ctx.fill();
      // flame licks — height/color track the live heat value `val`
      const flameH=h*.05+val*h*.11, flicker=Math.sin(now()/60)*3;
      for(let i=-2;i<=2;i++){
        const fx=panCx+i*w*.045, fh=flameH*(1-Math.abs(i)*.18)+flicker*(i%2?1:-1);
        const fg=ctx.createLinearGradient(0,h*.63,0,h*.63-fh);
        fg.addColorStop(0,"#FFC93C"); fg.addColorStop(.6,"#FF7A2E"); fg.addColorStop(1,"#FF5D2E");
        ctx.fillStyle=fg; ctx.beginPath();
        ctx.moveTo(fx-7,h*.63); ctx.quadraticCurveTo(fx-9,h*.63-fh*.6,fx,h*.63-fh); ctx.quadraticCurveTo(fx+9,h*.63-fh*.6,fx+7,h*.63); ctx.fill();
      }
      // pan body (metal shading + handle)
      ctx.fillStyle="#8a8f99"; ctx.fillRect(panCx+panRx*.75,panCy-6,w*.16,12);
      ctx.fillStyle="#c8ccd2"; ctx.fillRect(panCx+panRx*.75,panCy-6,w*.16,4);
      const pg=ctx.createRadialGradient(panCx,panCy-panRy*.4,4,panCx,panCy,panRx);
      pg.addColorStop(0,"#e8ebef"); pg.addColorStop(.55,"#aeb4bd"); pg.addColorStop(1,"#7d838d");
      ctx.fillStyle=pg; ctx.beginPath(); ctx.ellipse(panCx,panCy,panRx,panRy,0,0,Math.PI*2); ctx.fill();
      // contents — color shifts raw -> cooked -> browned as heatv rises
      const contentsColor=heatv>1.05?blend(p.color||"#C97A3A","#3a2416",clamp((heatv-1.05)/.25,0,1)):blend("#FFE0A0",p.color||"#C97A3A",clamp(heatv/1.05,0,1));
      ctx.fillStyle=contentsColor; ctx.beginPath(); ctx.ellipse(panCx,panCy,panRx*.82,panRy*.78,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.25)"; ctx.beginPath(); ctx.ellipse(panCx-panRx*.3,panCy-panRy*.35,panRx*.22,panRy*.16,0,0,Math.PI*2); ctx.fill();
      // gentle bubbling while properly in the zone
      const inZoneNow2=val>=lo&&val<=hi;
      if(inZoneNow2){ for(let i=0;i<3;i++){ const bx=panCx+Math.sin(now()/300+i*2)*panRx*.5, by=panCy+Math.cos(now()/260+i)*panRy*.4;
        ctx.fillStyle="rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(bx,by,2+Math.sin(now()/150+i)*1.5,0,Math.PI*2); ctx.fill(); } }
      // ambient steam wisps drifting up off the pan
      steam.forEach(s=>{ ctx.globalAlpha=clamp(s.life,0,1)*.5; ctx.fillStyle="#fff";
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); });
      ctx.globalAlpha=1;
      // pan rim highlight on top so steam reads as coming from inside
      ctx.strokeStyle="rgba(255,255,255,.4)"; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(panCx,panCy,panRx,panRy,0,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
      // compact thermometer: ice -> sweet-spot -> flame, with the live dot
      const gx=w*.2,gy=h*.82,gw=w*.6,gh=16;
      ctx.fillStyle="rgba(255,255,255,.7)"; roundRect(ctx,gx,gy,gw,gh,8); ctx.fill();
      ctx.fillStyle="#B6F0DE"; roundRect(ctx,gx+gw*lo,gy,gw*(hi-lo),gh,8); ctx.fill();
      ctx.font="16px sans-serif"; ctx.textAlign="center"; ctx.fillText("🧊",gx-2,gy+13); ctx.fillText("🔥",gx+gw+2,gy+13);
      const state=val>hi?"HOT":val<lo?"COLD":"OK";
      ctx.fillStyle=val>hi?"#FF5D8F":val<lo?"#8FD3FF":"#3DD6B0";
      ctx.beginPath(); ctx.arc(gx+gw*clamp(val,0,1),gy+gh/2,13,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="#fff"; ctx.lineWidth=2.5; ctx.stroke();
      // colorblind-safe redundant label
      ctx.font="800 18px 'Baloo 2',Nunito,sans-serif"; ctx.textAlign="center";
      ctx.fillStyle=state==="OK"?"#2b9d7f":state==="HOT"?"#c33864":"#3d7fb0";
      ctx.fillText(state,w/2,gy-10);
    }
    function tick(){
      val=clamp(val+(held?.010:-.012),0,1);
      heatv=clamp(heatv+(val>=lo&&val<=hi?.008:val>hi?.02:-.004),0,1.3);
      const inZoneNow=val>=lo&&val<=hi;
      if(inZoneNow) started=true;
      // Only start grading once the pan first reaches the zone, so the ramp-up frames don't dilute the score.
      if(started){ total++; if(inZoneNow){ inZone++; if(Math.random()<.35)Juice.fire("SIZZLE",{x:stage.w/2,y:stage.h*.4}); } }
      // The first time it hits temperature, release one big steam puff — like lifting a lid.
      if(started && !releasedBigPuff){ releasedBigPuff=true;
        for(let i=0;i<10;i++) steam.push({x:stage.w/2+rand(20,-20),y:stage.h*.36,r:rand(10,5),life:1.3,vy:rand(-38,-22)});
        Juice.fire("SIZZLE",{x:stage.w/2,y:stage.h*.4}); }
      // thin continuous wisps while cooking properly
      steamT-=1/60; if(inZoneNow && steamT<=0){ steamT=rand(.5,.25);
        steam.push({x:stage.w/2+rand(16,-16),y:stage.h*.36,r:rand(6,3),life:1,vy:rand(-30,-18)}); }
      for(let i=steam.length-1;i>=0;i--){ const s=steam[i]; s.y+=s.vy/60; s.x+=Math.sin(now()/200+i)*.3; s.life-=1/60/1.1; if(s.life<=0) steam.splice(i,1); }
      render();
      // The dur-second grading clock only starts on the player's first touch, so nobody
      // can silently lose the whole step to page/reaction latency before they've acted.
      if(t0!=null && (now()-t0)/1000>=dur){ const sc=clamp(inZone/Math.max(1,total)*(heatv>1.1?.6:1),0,1); end(stage,done,sc); return; }
      raf=requestAnimationFrame(tick);
    }
    bind(stage,{ down:()=>{ held=true; if(t0==null) t0=now(); }, up:()=>held=false });
    render(); tick(); stage._cleanup=()=>cancelAnimationFrame(raf);
  }

  /* ---------- PIPE / DRIZZLE / DECORATE ---------- */
  function pipe(stage,p,done){
    const path=makePath(p.shape||"bar",stage); const covered=new Array(path.length).fill(false); let cov=0;
    const DONE_AT=.94; let active=false;
    stage.prompt("Trace the WHOLE shape to pipe it all! 🧁"); stage.chloe("focus","Fill it in!");
    function render(){
      const ctx=stage.ctx,w=stage.w,h=stage.h; ctx.clearRect(0,0,w,h);
      ctx.strokeStyle="rgba(74,44,42,.25)"; ctx.lineWidth=18; ctx.lineCap="round"; ctx.beginPath();
      path.forEach((pt,i)=> i?ctx.lineTo(pt.x,pt.y):ctx.moveTo(pt.x,pt.y)); ctx.stroke();
      ctx.strokeStyle=p.color||"#6b8e23"; ctx.lineWidth=16; ctx.beginPath(); let drew=false;
      path.forEach((pt,i)=>{ if(covered[i]){ if(!drew){ctx.moveTo(pt.x,pt.y);drew=true;} else ctx.lineTo(pt.x,pt.y);} else drew=false; }); ctx.stroke();
      meter(ctx,w,h,cov/path.length);
    }
    bind(stage,{
      // Gate coverage on an actual press-and-drag (not just mouse hover) so
      // touch and mouse behave the same way.
      down:()=>{ active=true; },
      up:()=>{ active=false; },
      move:(pt)=>{
        if(!active) return;
        path.forEach((pp,i)=>{ if(!covered[i] && Math.hypot(pp.x-pt.x,pp.y-pt.y)<26){ covered[i]=true; cov++;
          if(cov%3===0)Juice.fire("PIPE",{x:pt.gx,y:pt.gy,color:p.color}); }});
        render();
        // Require near-total coverage before finishing, so the step never ends
        // while the player can still see obvious gaps left to trace.
        if(cov>=path.length*DONE_AT) end(stage,done,clamp(cov/path.length/DONE_AT,0,1));
      }
    });
    render();
  }

  /* ---------- ROLL / KNEAD / SHAPE ---------- */
  function knead(stage,p,done){
    const need=p.presses||6; let n=0, squash=0, raf;
    stage.prompt("Press & roll the dough! 👐"); stage.chloe("focus","Squish squish!");
    function render(){
      const ctx=stage.ctx,w=stage.w,h=stage.h; ctx.clearRect(0,0,w,h);
      const sq=1+squash*.3, sy=1-squash*.25;
      ctx.fillStyle="#F3E1C0"; ctx.beginPath(); ctx.ellipse(w/2,h*.5,w*.2*sq,h*.16*sy,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.5)"; ctx.beginPath(); ctx.ellipse(w/2-14,h*.5-14,14,8,0,0,Math.PI*2); ctx.fill();
      meter(ctx,w,h,n/need);
    }
    function relax(){ squash*=.85; render(); raf=requestAnimationFrame(relax); }
    bind(stage,{
      down:(pt)=>{ n++; squash=1; Juice.fire("KNEAD",{x:pt.gx,y:pt.gy}); render();
        if(n>=need) end(stage,done,1); }
    });
    render(); relax(); stage._cleanup=()=>cancelAnimationFrame(raf);
  }

  /* ---------- DIP / COAT ---------- */
  function dip(stage,p,done){
    let y=stage.h*.3, dragging=false, coat=0;
    stage.prompt("Drag the treat into the coating, then lift! 🍓"); stage.chloe("focus","Dip it good!");
    const bowlY=()=>stage.h*.66;
    function render(){
      const ctx=stage.ctx,w=stage.w,h=stage.h; ctx.clearRect(0,0,w,h);
      ctx.fillStyle=p.color||"#5A3A2A"; ctx.beginPath(); ctx.ellipse(w/2,bowlY(),w*.26,h*.1,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.25)"; ctx.beginPath(); ctx.ellipse(w/2-20,bowlY()-8,30,10,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=coat>.3?(p.color||"#5A3A2A"):(p.item||"#FF5D8F");
      ctx.beginPath(); ctx.moveTo(w/2,y-26); ctx.bezierCurveTo(w/2-24,y-26,w/2-22,y+22,w/2,y+30);
      ctx.bezierCurveTo(w/2+22,y+22,w/2+24,y-26,w/2,y-26); ctx.fill();
      if(coat>.3){ ctx.fillStyle="rgba(255,255,255,.3)"; ctx.beginPath(); ctx.ellipse(w/2-6,y-6,6,10,0,0,Math.PI*2); ctx.fill(); }
      meter(ctx,w,h,coat);
    }
    bind(stage,{
      down:()=>{ dragging=true; },
      move:(pt)=>{ if(!dragging)return; y=clamp(pt.y,stage.h*.2,bowlY());
        if(y>bowlY()-20){ coat=clamp(coat+.04,0,1); if(Math.random()<.3)Juice.fire("DIP",{x:pt.gx,y:pt.gy,color:p.color}); }
        render(); },
      up:()=>{ dragging=false;
        if(coat>0){ let t=0; const dr=setInterval(()=>{ if(stage._done){ clearInterval(dr); return; }
            y=lerp(y,stage.h*.3,.2); render();
            if(Math.random()<.3)Particles.spawn({x:stage.w/2,y:y+30,vx:0,vy:60,g:400,life:.6,size:5,color:p.color||"#5A3A2A"});
            if(++t>10){ clearInterval(dr); end(stage,done,clamp(coat,0,1)); } },40);
          stage._dipTimer=dr;
        } else { Juice.fire("OOPS",{}); stage.prompt("Dunk it fully in the coating! 🍫"); stage.chloe("focus","A little more coating!"); render(); }
      }
    });
    stage._cleanup=()=>{ if(stage._dipTimer) clearInterval(stage._dipTimer); };
    render();
  }

  /* ---------- SPRINKLE / SEASON ---------- */
  function sprinkle(stage,p,done){
    const need=p.shakes||8; let n=0; const dots=[];
    stage.prompt("Tap-tap to sprinkle toppings! ✨"); stage.chloe("yum","Make it pretty!");
    function render(){
      const ctx=stage.ctx,w=stage.w,h=stage.h; ctx.clearRect(0,0,w,h);
      ctx.fillStyle=p.base||"#FFFFFF"; ctx.beginPath(); ctx.arc(w/2,h*.55,Math.min(w,h)*.26,0,Math.PI*2); ctx.fill();
      dots.forEach(d=>{ ctx.fillStyle=d.c; ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.fill(); });
      meter(ctx,w,h,n/need);
    }
    bind(stage,{
      down:(pt)=>{ n++; const cols=p.colors||["#FF5D8F","#3DD6B0","#FFC93C","#7C5CFF"];
        for(let i=0;i<8;i++){ const a=rand(Math.PI*2),rr=rand(Math.min(stage.w,stage.h)*.24,0);
          dots.push({x:stage.w/2+Math.cos(a)*rr,y:stage.h*.55+Math.sin(a)*rr,r:rand(5,2),c:pick(cols)}); }
        Juice.fire("SPRINKLE",{x:pt.gx,y:pt.gy}); render();
        if(n>=need) end(stage,done,1); }
    });
    render();
  }

  /* ---------- FLIP ---------- */
  function flip(stage,p,done){
    let phase=0, marker=0, dir=1, flipped=false, raf, st=now(), sy=null, t0=now();
    stage.prompt("Swipe UP (or tap the sweet spot) to flip! 🥞"); stage.chloe("focus","Wait for it…");
    function render(){
      const ctx=stage.ctx,w=stage.w,h=stage.h; ctx.clearRect(0,0,w,h);
      ctx.fillStyle="#333"; ctx.beginPath(); ctx.ellipse(w/2,h*.6,w*.26,h*.1,0,0,Math.PI*2); ctx.fill();
      ctx.save(); ctx.translate(w/2,h*.55-phase*140); ctx.scale(1,Math.cos(phase*Math.PI*2));
      ctx.fillStyle=p.color||"#E0A040"; ctx.beginPath(); ctx.ellipse(0,0,w*.16,h*.06,0,0,Math.PI*2); ctx.fill(); ctx.restore();
      const gx=w*.2,gy=h*.82,gw=w*.6;
      ctx.fillStyle="#eee"; roundRect(ctx,gx,gy,gw,14,8); ctx.fill();
      ctx.fillStyle="#B6F0DE"; ctx.fillRect(gx+gw*.42,gy,gw*.16,14);
      ctx.fillStyle="#FF7A59"; ctx.beginPath(); ctx.arc(gx+gw*marker,gy+7,11,0,Math.PI*2); ctx.fill();
    }
    function doFlip(gx,gy){ if(flipped) return; flipped=true; st=now(); FX.slowMo(.5,150); Juice.fire("FLIP",{x:gx||stage.w/2,y:gy||stage.h/2}); }
    function tick(){
      if(!flipped){ marker+=dir*.012; if(marker>1){marker=1;dir=-1;} if(marker<0){marker=0;dir=1;} render();
        // guaranteed-progress fallback: never let the player get stuck waiting for a perfect swipe
        if(now()-t0>7000) doFlip();
        raf=requestAnimationFrame(tick); }
      else { phase=clamp((now()-st)/500,0,1); render(); if(phase>=1){ end(stage,done,clamp(1-Math.abs(marker-.5)/.5,0,1)); return; } raf=requestAnimationFrame(tick); }
    }
    bind(stage,{
      down:(pt)=>{ sy=pt.y; },
      up:(pt)=>{
        // Accept a qualifying upward swipe OR a tap near the sweet-spot (motor-accessible fallback).
        const swipedUp = sy!=null && sy-pt.y>stage.h*.06;
        const tapNearCenter = sy!=null && Math.abs(sy-pt.y)<stage.h*.06 && Math.abs(marker-.5)<.18;
        if((swipedUp||tapNearCenter) && !flipped) doFlip(pt.gx,pt.gy);
        sy=null;
      }
    });
    render(); tick(); stage._cleanup=()=>cancelAnimationFrame(raf);
  }

  /* ---------- CRACK / SMASH — the money moment (rapid-tap mash) ---------- */
  function crackSmash(stage,p,done){
    const isSmash=p.mode==="smash"; let charge=0, cracked=false, raf, taps=0, lastTapT=now(), punch=0;
    const TAP_GAIN=.15, DECAY_PER_SEC=.22;
    stage.prompt(isSmash?"TAP FAST to SMASH it! 💥👆👆":"TAP FAST to CRACK it! 🔨👆👆");
    stage.chloe("excited",isSmash?"Tap tap tap — smash it!":"Tap tap tap — crack it!");
    function render(){
      const ctx=stage.ctx,w=stage.w,h=stage.h; ctx.clearRect(0,0,w,h);
      const cx=w/2,cy=h*.5;
      if(!cracked){
        const wob=1+punch*.08;
        ctx.save(); ctx.translate(cx,cy); ctx.scale(wob,1/wob);
        if(isSmash){ ctx.fillStyle="#8A4A2A"; roundRect(ctx,-w*.2,-h*.09,w*.4,h*.18,40); ctx.fill();
          ctx.fillStyle="#A85A34"; roundRect(ctx,-w*.2,-h*.09,w*.4,h*.06,40); ctx.fill(); }
        else {
          const g=ctx.createLinearGradient(-w*.22,0,w*.22,0); g.addColorStop(0,p.color||"#5A3A2A"); g.addColorStop(.5,p.color2||"#7A4A32"); g.addColorStop(1,p.color||"#5A3A2A");
          ctx.fillStyle=g; roundRect(ctx,-w*.22,-h*.12,w*.44,h*.24,22); ctx.fill();
          ctx.strokeStyle="rgba(0,0,0,.2)"; ctx.lineWidth=3;
          for(let i=1;i<3;i++){ ctx.beginPath(); ctx.moveTo(-w*.22+w*.44*i/3,-h*.12); ctx.lineTo(-w*.22+w*.44*i/3,h*.12); ctx.stroke(); }
          ctx.beginPath(); ctx.moveTo(-w*.22,0); ctx.lineTo(w*.22,0); ctx.stroke();
          ctx.fillStyle="rgba(255,255,255,.22)"; roundRect(ctx,-w*.2,-h*.1,w*.4,h*.05,10); ctx.fill();
          for(let i=0;i<8;i++){ ctx.fillStyle="#8FB03A"; ctx.beginPath(); ctx.arc(rand(w*.18,-w*.18),rand(h*.09,-h*.09),rand(4,2),0,Math.PI*2); ctx.fill(); }
        }
        ctx.restore();
        ctx.strokeStyle="#FF7A59"; ctx.lineWidth=8; ctx.beginPath(); ctx.arc(cx,cy,Math.min(w,h)*.34,-Math.PI/2,-Math.PI/2+charge*Math.PI*2); ctx.stroke();
        ctx.font="800 26px 'Baloo 2',Nunito,sans-serif"; ctx.textAlign="center"; ctx.fillStyle="#4A2C2A";
        ctx.fillText("👆 x"+taps,cx,cy+Math.min(w,h)*.34+40);
      } else {
        ctx.fillStyle=isSmash?"#C98A4A":(p.inside||"#9BBF4A");
        roundRect(ctx,cx-w*.2,cy-h*.1,w*.19,h*.2,14); ctx.fill();
        roundRect(ctx,cx+w*.01,cy-h*.1,w*.19,h*.2,14); ctx.fill();
        ctx.fillStyle="rgba(255,255,255,.2)"; roundRect(ctx,cx-w*.2,cy-h*.1,w*.4,h*.05,10); ctx.fill();
      }
    }
    function doCrack(){
      if(cracked) return; cracked=true;
      // Faster mashing (fewer taps to fill the ring) earns a better score.
      const sc=clamp(1-(taps-7)*.05,.55,1);
      Juice.fire(isSmash?"SMASH":"CRACK",{x:stage.w/2,y:stage.h/2,color:isSmash?"#8A4A2A":"#5A3A2A"});
      stage.chloe("yum","OOOH the CRACK! 🤤"); render();
      setTimeout(()=>end(stage,done,sc),650);
    }
    function tick(){
      if(!cracked){
        const dt=Math.min((now()-lastTapT)/1000,.05);
        punch=Math.max(0,punch-dt*6);
        render();
      }
      if(!cracked) raf=requestAnimationFrame(tick);
    }
    bind(stage,{
      down:()=>{
        if(cracked) return;
        lastTapT=now(); taps++; punch=1;
        charge=clamp(charge+TAP_GAIN,0,1);
        Juice.fire("UI_TAP",{});
        if(charge>=1) doCrack();
      }
    });
    // Continuous gentle decay so a single hold-and-wait can't finish it — it
    // takes genuine rapid, repeated tapping to fill the ring.
    const decayTimer=setInterval(()=>{ if(!cracked) charge=clamp(charge-DECAY_PER_SEC*.05,0,1); },50);
    render(); tick(); stage._cleanup=()=>{ cancelAnimationFrame(raf); clearInterval(decayTimer); };
  }

  /* ---------- ASSEMBLE / STACK / PLATE ---------- */
  function assemble(stage,p,done){
    const layers=p.layers||["🥯","🧀","🥩"]; let placed=0;
    stage.prompt("Tap to stack each layer! 🍔"); stage.chloe("focus","Build it up!");
    const stackY=()=>stage.h*.72;
    function render(){
      const ctx=stage.ctx,w=stage.w,h=stage.h; ctx.clearRect(0,0,w,h);
      ctx.font=(Math.min(w,h)*.16)+"px serif"; ctx.textAlign="center";
      ctx.fillStyle="#fff"; ctx.beginPath(); ctx.ellipse(w/2,stackY()+14,w*.28,h*.05,0,0,Math.PI*2); ctx.fill();
      for(let i=0;i<placed;i++) ctx.fillText(layers[i], w/2, stackY()-i*(h*.09));
      if(placed<layers.length){ ctx.globalAlpha=.4+Math.sin(now()/300)*.2; ctx.fillText(layers[placed], w/2, stage.h*.25); ctx.globalAlpha=1; }
    }
    let raf; function anim(){ render(); raf=requestAnimationFrame(anim); }
    bind(stage,{
      down:(pt)=>{ if(placed<layers.length){ placed++; Juice.fire("STACK",{x:pt.gx,y:pt.gy}); if(placed>=layers.length) end(stage,done,1); } }
    });
    anim(); stage._cleanup=()=>cancelAnimationFrame(raf);
  }

  /* ---------- POP (boba / soda) ---------- */
  function popfizz(stage,p,done){
    const need=p.taps||6; let n=0; const pearls=[];
    for(let i=0;i<need;i++) pearls.push({x:rand(.65,.35),y:rand(.7,.4),popped:false});
    stage.prompt("Tap to pop the pearls! 🧋"); stage.chloe("yum","Pop pop pop!");
    function render(){
      const ctx=stage.ctx,w=stage.w,h=stage.h; ctx.clearRect(0,0,w,h);
      ctx.fillStyle="#E8C9A0"; roundRect(ctx,w*.3,h*.2,w*.4,h*.6,24); ctx.fill();
      pearls.forEach(pl=>{ if(!pl.popped){ ctx.fillStyle="#4A2C2A"; ctx.beginPath(); ctx.arc(w*pl.x,h*pl.y,12,0,Math.PI*2); ctx.fill(); } });
    }
    bind(stage,{
      down:(pt)=>{ pearls.forEach(pl=>{ if(!pl.popped && Math.hypot(stage.w*pl.x-pt.x,stage.h*pl.y-pt.y)<28){ pl.popped=true; n++;
        Juice.fire("POP",{x:pt.gx,y:pt.gy}); } }); render();
        if(n>=need) end(stage,done,1); }
    });
    render();
  }

  const REGISTRY={ chop, slice:chop, whisk, mix:whisk, stir:whisk, pour, fill:pour,
    heat, melt:heat, sizzle:heat, pipe, drizzle:pipe, decorate:pipe, knead, roll:knead, shape:knead,
    dip, coat:dip, sprinkle, season:sprinkle, flip, crack:(s,p,d)=>crackSmash(s,p,d),
    smash:(s,p,d)=>crackSmash(s,Object.assign({mode:"smash"},p),d),
    assemble, stack:assemble, plate:assemble, pop:popfizz, fizz:popfizz };

  return {REGISTRY};
})();

/* ==========================================================================
   [RECIPES] RECIPE DATA REGISTRY + SCHEMA
   ----------------------------------------------------------------------------
   Adding a recipe = pushing ONE object into RECIPES. Schema (field-by-field):
     id        : string   unique key (used in save/unlocks/stars/best)
     name      : string   display name (original, generic dish names only)
     emoji     : string   icon shown on cards / cookbook
     category  : "Dessert" | "Meal" | "Drink"
     world     : world id (see WORLDS)
     difficulty: "Easy" | "Medium" | "Hard"
     hero      : boolean  marquee recipe (bigger reward, featured star badge)
     free      : boolean  playable without the Full Kitchen unlock
     desc      : string   short flavor text / Chloe intro line
     plate     : { bg, emoji, sparkle } — plate-reveal presentation
     signature : string   Juice event name of its money beat (e.g. "CRACK")
     rushComponents: [string]  quick station names used in Rush Mode assembly
     steps     : [ { verb, label, params } ]  ORDERED technique-verb chain, where
         verb   = one of Verbs.REGISTRY keys (see verbApi),
         label  = UI caption for the step,
         params = object of numbers/colors the verb reads (see verbApi).
   The reference recipe (dubai_chocolate_bar) is the copy-me example.
   ========================================================================== */
const RECIPES=[
  {

/* ==========================================================================
   COOK MODE runner — walks a recipe's ordered technique chain
   ========================================================================== */
let cookSession=null, activeStage=null;
function startCook(id){
  const recipe=RECIPE_BY_ID[id]; if(!recipe) return;
  cookSession={ recipe, stepIndex:0, scores:[] };
  go("cook");
}
Screens.cook={
  render(){
    const s=document.getElementById("screen-cook");
    const r=cookSession.recipe;
    s.innerHTML='<div class="cookhead">'
      +'<button class="iconbtn" id="cookBack">‹</button>'
      +'<div class="stepbar"><i id="cookProg"></i></div>'
      +'<div class="chip">'+r.emoji+' <span style="font-size:13px">'+esc(r.name)+'</span></div>'
      +'</div>'
      +'<div class="stage" id="cookStage">'
      +'<div class="prompt" id="cookPrompt"></div>'
      +'<canvas class="verbcanvas" id="verbCanvas"></canvas>'
      +'<div class="speech" id="cookSpeech" style="display:none"></div>'
      +'<div class="chloecorner" id="cookChloe"></div>'
      +'</div>';
    document.getElementById("cookBack").addEventListener("click",()=>{ Juice.fire("UI_TAP"); abortCook(); go("select",{world:r.world}); });
    requestAnimationFrame(()=>runStep());
  }
};
function cleanupStage(){ if(activeStage){ if(activeStage._unbind)activeStage._unbind(); if(activeStage._cleanup)activeStage._cleanup(); activeStage=null; } }
function abortCook(){ if(cookSession) cookSession.aborted=true; cleanupStage(); }
function runStep(){
  cleanupStage();
  const sess=cookSession, r=sess.recipe;
  if(sess.stepIndex>=r.steps.length){ finishCook(); return; }
  const step=r.steps[sess.stepIndex];
  const canvas=document.getElementById("verbCanvas");
  const rect=document.getElementById("cookStage").getBoundingClientRect();
  canvas.width=rect.width; canvas.height=rect.height;
  const ctx=canvas.getContext("2d");
  document.getElementById("cookProg").style.width=((sess.stepIndex)/r.steps.length*100)+"%";
  const stage={
    canvas, ctx, w:rect.width, h:rect.height,
    prompt(t){ document.getElementById("cookPrompt").innerHTML=t; },
    chloe(expr,line){ Chloe.draw(document.getElementById("cookChloe"),{expr}); const sp=document.getElementById("cookSpeech");
      if(line){ sp.style.display="block"; sp.textContent=line; } else sp.style.display="none"; }
  };
  activeStage=stage;
  const verbFn=Verbs.REGISTRY[step.verb];
  if(!verbFn){ sess.scores.push(.8); sess.stepIndex++; runStep(); return; }
  Chloe.draw(document.getElementById("cookChloe"),{expr:"idle"});
  verbFn(stage, step.params||{}, (result)=>{
    if(sess.aborted) return;
    sess.scores.push(result.score);
    sess.stepIndex++;
    const prog=document.getElementById("cookProg"); if(prog) prog.style.width=((sess.stepIndex)/r.steps.length*100)+"%";
    if(currentScreen==="cook") runStep();
  });
}
function finishCook(){
  cleanupStage();
  const sess=cookSession, r=sess.recipe;
  const avg=sess.scores.reduce((a,b)=>a+b,0)/Math.max(1,sess.scores.length);
  const score=Math.round(avg*100);
  const stars=score>=85?3:score>=65?2:1;
  S.learned[r.id]=true;
  S.unlocked[r.id]=true;
  S.stars[r.id]=Math.max(S.stars[r.id]||0,stars);
  S.best[r.id]=Math.max(S.best[r.id]||0,score);
  if(r.id===getTrending()) S.trending.best=Math.max(S.trending.best||0,score);
  const coins=20+stars*15+(r.hero?15:0);
  S.coins+=coins;
  save();
  go("results",{recipe:r,score,stars,coins});
}
