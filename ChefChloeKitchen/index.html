  Fold:"🥣",Cut:"🔪",Berries:"🍓",Cream:"🥛",Swirl:"🌀",Patty:"🥩",Buns:"🍞",Sauce:"🥫",Braise:"🍲",Crisp:"🔥",
  Garnish:"🌿",Boil:"♨️",Pull:"🧀",Veg:"🥬",Dough:"🍞",Pleat:"🥟",Fry:"🍳",Steam:"♨️",Dredge:"🥣",Steep:"🍵",
  Milk:"🥛",Shake:"🥤",Muddle:"🥄",Ice:"🧊",Fizz:"🫧",Sift:"❄️",Art:"🎨",Whisk:"🥣"};
function buildStations(){
  const comps=[]; rush.pool.forEach(r=>(r.rushComponents||[]).forEach(c=>{ if(comps.indexOf(c)<0)comps.push(c); }));
  const list=comps.slice(0,S.cafe.stations*3);
  rush.stationSet=new Set(list);
  // Only customers whose every needed component has a station can spawn — guarantees every order is serveable.
  rush.servable=rush.pool.filter(r=>(r.rushComponents||[]).every(c=>rush.stationSet.has(c)));
  if(rush.servable.length===0) rush.servable=rush.pool.slice();
  document.getElementById("rushStations").innerHTML=list.map(c=>'<div class="station" data-comp="'+c+'"><div class="se">'+(STATION_EMOJI[c]||"🍴")+'</div>'+c+'</div>').join("");
  $$("#rushStations .station").forEach(st=>st.addEventListener("click",()=>prepComponent(st.getAttribute("data-comp"),st)));
}
function prepComponent(comp,elm){
  rush.tray.push(comp);
  const r=elm.getBoundingClientRect(), ax=appRect();
  Juice.fire("STACK",{x:r.left+r.width/2-ax.left,y:r.top+r.height/2-ax.top});
  elm.style.transform="scale(.9)"; setTimeout(()=>elm.style.transform="",100);
  renderTray(); refreshNeedChips();
}
function renderTray(){
  const t=document.getElementById("rushTray"); if(!t) return;
  t.innerHTML=rush.tray.length?rush.tray.map((c,i)=>'<div class="traychip" data-i="'+i+'">'+c+' ✕</div>').join(""):'<span class="hint">Tap stations to prep components…</span>';
  $$("#rushTray .traychip").forEach(tc=>tc.addEventListener("click",()=>{ rush.tray.splice(+tc.getAttribute("data-i"),1); renderTray(); refreshNeedChips(); }));
}
function spawnCustomer(){
  const recipe=pick(rush.servable&&rush.servable.length?rush.servable:rush.pool);
  rush.customers.push({ id:Math.random().toString(36).slice(2), recipe, patience:1,
    needed:(recipe.rushComponents||["Serve"]).slice(0), face:pick(["😀","😋","🥰","😎","🤗","😻","🧒","👧","👦","🧑"]) });
  renderCustomers();
}
function neededChipsHTML(cu){
  // Shows exactly what this order still needs, checked off live against the tray —
  // so the player is never guessing what to prep.
  const trayCopy=rush.tray.slice();
  return '<div class="needlist">'+cu.needed.map(n=>{
    const i=trayCopy.indexOf(n); const got=i>=0; if(got) trayCopy.splice(i,1);
    return '<div class="needchip'+(got?' got':'')+'" title="'+esc(n)+'">'+(STATION_EMOJI[n]||"🍴")+'</div>';
  }).join("")+'</div>';
}
function renderCustomers(){
  const c=document.getElementById("rushCustomers"); if(!c) return;
  c.innerHTML=rush.customers.map(cu=>'<div class="cust" data-id="'+cu.id+'">'
    +'<div class="face">'+cu.face+'</div>'
    +'<div style="font-size:22px">'+cu.recipe.emoji+'</div>'
    +'<div class="order">'+esc(cu.recipe.name)+'</div>'
    +neededChipsHTML(cu)
    +'<div class="patience"><i style="width:'+Math.round(cu.patience*100)+'%;background:'+(cu.patience>.4?'#3DD6B0':'#FF7A59')+'"></i></div>'
    +'<div class="pnum" style="font-size:11px;font-weight:800;margin-top:2px;color:'+(cu.patience>.4?'#2b9d7f':'#c33864')+'">'+(cu.patience>.4?'🙂':'😣')+' '+Math.round(cu.patience*100)+'%</div>'
    +'</div>').join("");
  $$("#rushCustomers .cust").forEach(cd=>cd.addEventListener("click",()=>tryServe(cd.getAttribute("data-id"),cd)));
}
function refreshNeedChips(){
  // Cheap re-sync (no listener churn) so checkmarks update the instant the tray changes.
  const c=document.getElementById("rushCustomers"); if(!c) return;
  $$(".cust",c).forEach(cd=>{ const cu=rush.customers.find(x=>x.id===cd.getAttribute("data-id")); if(!cu) return;
    const nl=cd.querySelector(".needlist"); if(nl) nl.outerHTML=neededChipsHTML(cu); });
}
function tryServe(id,cd){
  const idx=rush.customers.findIndex(c=>c.id===id); if(idx<0) return;
  const cu=rush.customers[idx];
  const trayCopy=rush.tray.slice();
  const ok=cu.needed.every(n=>{ const i=trayCopy.indexOf(n); if(i>=0){ trayCopy.splice(i,1); return true; } return false; });
  const rect=cd.getBoundingClientRect(), ax=appRect();
  const px=rect.left+rect.width/2-ax.left, py=rect.top+rect.height/2-ax.top;
  if(ok){
    cu.needed.forEach(n=>{ const i=rush.tray.indexOf(n); if(i>=0)rush.tray.splice(i,1); });
    rush.combo++;
    const gain=8+Math.round(rush.combo*2)+(cu.recipe.hero?6:0)+(cu.patience>.5?4:0)+(S.cafe.decor||0);
    rush.coins+=gain; rush.servedCount++;
    Juice.fire("COMBO_UP",{combo:rush.combo,x:px,y:py});
    Juice.fire("COIN",{amt:gain,x:px,y:py});
    for(let i=0;i<5;i++)Particles.spawn({x:px,y:py,vx:rand(80,-80),vy:rand(-180,-60),g:200,life:1,size:14,color:"#FF5D8F",shape:"star"});
    showCombo();
    Audio2.setEnergy(clamp(rush.combo/12,0,1));
    rush.customers.splice(idx,1);
    renderCustomers(); renderTray();
    const rc=document.getElementById("rushCoins"); if(rc)rc.textContent=rush.coins;
    const rsv=document.getElementById("rushServed"); if(rsv)rsv.textContent=rush.servedCount;
    if(rush.servedCount>=rush.goal) endRush(true);
  }else{
    rush.combo=0; Audio2.setEnergy(0);
    Juice.fire("OOPS",{}); toast("Need: "+cu.needed.join(", "));
    cd.style.transform="translateX(-4px)"; setTimeout(()=>cd.style.transform="translateX(4px)",60); setTimeout(()=>cd.style.transform="",120);
  }
}
function showCombo(){
  if(rush.combo<2) return;
  const el=document.getElementById("rushCombo"); if(!el) return;
  el.textContent="COMBO x"+rush.combo+" 🔥";
  el.style.transition="none"; el.style.opacity="1"; el.style.transform="scale(1.4)";
  requestAnimationFrame(()=>{ el.style.transition="all .5s cubic-bezier(.34,1.56,.64,1)"; el.style.transform="scale(1)"; el.style.opacity="0"; });
}
function rushFrame(){
  if(!rush||!rush.running){ return; }
  const t=now(), dt=Math.min((t-rushLast)/1000,.05); rushLast=t;
  rush.time-=dt;
  rush.spawnT-=dt;
  if(rush.spawnT<=0 && rush.customers.length<rush.tier.maxCust){ spawnCustomer(); rush.spawnT=rand(3.4,1.8); }
  let dropped=false;
  for(let i=rush.customers.length-1;i>=0;i--){
    const cu=rush.customers[i];
    if(!S.settings.cozy) cu.patience-=rush.patienceRate*dt;
    if(cu.patience<=0){ rush.customers.splice(i,1); rush.combo=0; Audio2.setEnergy(0); Juice.fire("OOPS",{}); dropped=true; }
  }
  updatePatienceBars(dropped);
  const tEl=document.getElementById("rushTime"); if(tEl) tEl.textContent=Math.max(0,Math.ceil(rush.time));
  if(rush.time<=0){ endRush(rush.servedCount>=rush.goal); return; }
  rushRaf=requestAnimationFrame(rushFrame);
}
function updatePatienceBars(dropped){
  if(dropped){ renderCustomers(); return; }
  $$("#rushCustomers .cust").forEach(b=>{ const cu=rush.customers.find(c=>c.id===b.getAttribute("data-id"));
    if(cu){ const i=b.querySelector(".patience > i"); if(i){ i.style.width=Math.round(cu.patience*100)+"%"; i.style.background=cu.patience>.4?"#3DD6B0":"#FF7A59"; }
      const pn=b.querySelector(".pnum"); if(pn){ pn.textContent=(cu.patience>.4?'🙂':'😣')+' '+Math.round(cu.patience*100)+'%'; pn.style.color=cu.patience>.4?'#2b9d7f':'#c33864'; } }
  });
}
function endRush(won){
  if(!rush) return; rush.running=false; cancelAnimationFrame(rushRaf);
  const earned=rush.coins; S.coins+=earned;
  if(won) S.cafe.level++;
  save(); renderTopChips();
  if(won) Juice.fire("CELEBRATE");
  modal('<div style="font-size:44px">'+(won?"🎉":"⏰")+'</div>'
    +'<h3>'+(won?"Day Complete!":"Time's Up!")+'</h3>'
    +'<p>You served <b>'+rush.servedCount+'</b> customers'+(won?' and unlocked Day '+S.cafe.level+'!':'')+'.<br>Earned <b>🪙 '+earned+'</b> coins.</p>'
    +'<button class="btn big coral" id="rushUpg">Café Upgrades</button>'
    +'<button class="btn mint sm" id="rushAgain" style="margin-top:8px">Serve Again</button>'
    +'<button class="btn ghost sm" id="rushHome" style="margin-top:8px">Home</button>');
  document.getElementById("rushUpg").onclick=()=>{ closeModal(); openCafeUpgrades(); };
  document.getElementById("rushAgain").onclick=()=>{ closeModal(); go("rush"); };
  document.getElementById("rushHome").onclick=()=>{ closeModal(); go("home"); };
}
function openCafeUpgrades(){
  const ups=[
    {k:"speed",name:"Faster Equipment",desc:"Customers stay patient longer",cost:80,emoji:"⚡",cur:()=>Math.round((S.cafe.speed-1)/.2)+1,inc:()=>{S.cafe.speed=Math.min(2,S.cafe.speed+.2);}},
    {k:"stations",name:"Extra Station",desc:"More prep stations",cost:120,emoji:"🍳",cur:()=>S.cafe.stations,inc:()=>{S.cafe.stations=Math.min(6,S.cafe.stations+1);}},
    {k:"decor",name:"Cozy Décor",desc:"Happier customers, bigger tips",cost:100,emoji:"🪴",cur:()=>S.cafe.decor+1,inc:()=>{S.cafe.decor++;}}
  ];
  function isMaxed(k){ return (k==="speed"&&S.cafe.speed>=2)||(k==="stations"&&S.cafe.stations>=6); }
  const rows=ups.map(u=>'<div class="row"><div style="font-size:30px">'+u.emoji+'</div>'
    +'<div class="rt"><div class="rname">'+u.name+' <span style="opacity:.6;font-size:13px">Lv '+u.cur()+'</span></div><div class="rdesc">'+u.desc+'</div></div>'
    +(isMaxed(u.k)?'<span class="owned">Maxed ✓</span>':'<button class="btn yellow sm" data-up="'+u.k+'">🪙 '+u.cost+'</button>')+'</div>').join("");
  const sc=document.getElementById("screen-shop");
  currentScreen="shop"; $$(".screen").forEach(s=>s.classList.remove("active")); sc.classList.add("active");
  sc.innerHTML=topBar("Café Upgrades",true)+'<div class="scroll">'+rows+'<div class="hint">Upgrades make each service day easier and tastier!</div></div>';
  sc.querySelector("[data-back]").addEventListener("click",()=>go("home"));
  $$("#screen-shop [data-up]").forEach(b=>b.addEventListener("click",()=>{
    const u=ups.find(x=>x.k===b.getAttribute("data-up"));
    if(isMaxed(u.k)){ toast("Already maxed!"); return; }
    if(S.coins>=u.cost){ S.coins-=u.cost; u.inc(); save(); renderTopChips(); toast(u.name+" upgraded!"); Juice.fire("STEP_DONE",{}); openCafeUpgrades(); }
    else toast("Not enough coins!");

}

    const cd=document.getElementById("claimDaily");
    if(cd) cd.onclick=()=>{

      const yd=new Date(); yd.setDate(yd.getDate()-1); const yStr=yd.getFullYear()+"-"+(yd.getMonth()+1)+"-"+yd.getDate();

      const amt=rewards[S.daily.streak%rewards.length]; S.daily.streak++; S.daily.lastClaim=todayStr();
      S.coins+=amt;
      // Gems are a real reward now: earn 1 gem each daily claim, +2 bonus on a full 8-day cycle.
      const gemGain=1+((S.daily.streak%rewards.length===0)?2:0); S.gems+=gemGain;
      save(); renderTopChips();
      Juice.fire("CELEBRATE"); Juice.fire("COIN",{amt,x:appRect().width/2,y:appRect().height/2}); toast("+"+amt+" coins, +"+gemGain+" 💎!"); Screens.daily.render();
    };
    document.getElementById("playTrending").onclick=()=>{ const id=getTrending(); if(isUnlocked(id))startCook(id); else offerUnlock(id); };
  }
};

/* ---------------- SETTINGS ---------------- */
Screens.settings={
  render(){
    const s=document.getElementById("screen-settings"), st=S.settings;
    function slider(id,label,val){ return '<div class="setrow"><label>'+label+'</label><input type="range" min="0" max="1" step="0.05" value="'+val+'" data-slider="'+id+'"></div>'; }
    function toggle(id,label,on){ return '<div class="setrow"><label>'+label+'</label><div class="toggle '+(on?'on':'')+'" data-toggle="'+id+'"><i></i></div></div>'; }
    s.innerHTML=topBar("Settings",true)+'<div class="scroll">'
      +'<div class="section-title">🔊 Audio</div>'
      +slider("music","Music",st.music)
      +slider("sfx","UI & Coins",st.sfx)
      +slider("asmr","Cooking Sounds",st.asmr)
      +toggle("asmrOn","Cooking Sounds On",st.asmrOn)
      +toggle("muted","Mute Everything",st.muted)
      +'<div class="section-title">📳 Haptics</div>'
      +toggle("haptics","Haptics / Vibration"+(Haptics.supported?"":" (unsupported here)"),st.haptics)
      +slider("hapticIntensity","Haptic Intensity",st.hapticIntensity)
      +'<div class="section-title">♿ Accessibility</div>'
      +toggle("reducedMotion","Reduced Motion",st.reducedMotion)
      +toggle("cozy","Cozy Mode (no time pressure)",st.cozy)
      +'<div class="hint">Cozy Mode removes all timers in Café Rush. Reduced Motion tones down shake &amp; particles. All of Chloe\'s lines have on-screen text.</div>'
      +'<button class="btn ghost sm" id="resetSave" style="margin:16px auto;display:block">Reset All Progress</button>'
      +'</div>';
    s.querySelector("[data-back]").setAttribute("data-back","home");
    let _lastUiTick=0;
    $$("[data-slider]",s).forEach(sl=>sl.addEventListener("input",()=>{
      S.settings[sl.getAttribute("data-slider")]=parseFloat(sl.value); Audio2.applyMix(); save();
      const t=now(); if(t-_lastUiTick>120){ _lastUiTick=t; Audio2.play("ui"); }
    }));
    $$("[data-toggle]",s).forEach(tg=>tg.addEventListener("click",()=>{
      const k=tg.getAttribute("data-toggle"); S.settings[k]=!S.settings[k];
      tg.classList.toggle("on",S.settings[k]);
      if(k==="reducedMotion") document.body.classList.toggle("reduced",S.settings[k]);
      Audio2.applyMix(); save(); Juice.fire("UI_TAP");
    }));
    document.getElementById("resetSave").onclick=()=>{ modal('<div style="font-size:40px">🗑️</div><h3>Reset Progress?</h3>'
      +'<p>This erases all coins, stars, and unlocks. Can\'t be undone.</p>'
      +'<button class="btn big coral" id="rsYes">Yes, reset</button><button class="btn ghost sm" id="rsNo" style="margin-top:8px">Cancel</button>');
      document.getElementById("rsYes").onclick=()=>{ localStorage.removeItem(SAVE_KEY); S=JSON.parse(JSON.stringify(DefaultSave)); closeModal(); Audio2.applyMix(); document.body.classList.toggle("reduced",S.settings.reducedMotion); go("home"); toast("Progress reset."); };
      document.getElementById("rsNo").onclick=closeModal;
    };
  }
};

/* ==========================================================================
   Master requestAnimationFrame loop — particles, shake, slow-mo
   ========================================================================== */
let lastT=now();
function loop(){
  const t=now(); let dt=(t-lastT)/1000; lastT=t;
  dt=Math.min(dt,.05)*FX.timeScale();
  Particles.update(dt);
  FX.apply();
  requestAnimationFrame(loop);
}

/* ==========================================================================
   Boot-up wiring
   ========================================================================== */
function boot(){
  Particles.resize();
  // Honor the OS-level reduced-motion preference on first launch (no saved preference yet).
  try{
    if(localStorage.getItem(SAVE_KEY)===null && window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){
      S.settings.reducedMotion=true;
    }
  }catch(e){}
  document.body.classList.toggle("reduced",S.settings.reducedMotion);
  document.addEventListener("touchmove",e=>{ if(e.touches.length>1) e.preventDefault(); },{passive:false});
  let lastTouch=0;
  document.addEventListener("touchend",e=>{ const n=Date.now(); if(n-lastTouch<300) e.preventDefault(); lastTouch=n; },{passive:false});
  const kick=()=>{ Audio2.init(); Audio2.resume(); Audio2.applyMix(); };
  window.addEventListener("pointerdown",kick,{once:true});
  window.addEventListener("touchstart",kick,{once:true});
  // Pause/stop synthesis when the app is hidden so music doesn't keep scheduling in the background.
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) Audio2.suspend(); else Audio2.wake(); });
  go("boot");
  requestAnimationFrame(loop);
}
window.addEventListener("load",boot);
window.addEventListener("resize",()=>Particles.resize());
</script>
