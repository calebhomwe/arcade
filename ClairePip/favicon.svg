<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Claire &amp; Pip puppy favicon">
  <rect x="1" y="1" width="30" height="30" rx="8" fill="#ff9ec4"/>
  <!-- ears -->
  <ellipse cx="9" cy="14" rx="4" ry="6.5" fill="#c2884f" transform="rotate(-16 9 14)"/>
  <ellipse cx="23" cy="14" rx="4" ry="6.5" fill="#c2884f" transform="rotate(16 23 14)"/>
  <!-- head -->
  <circle cx="16" cy="16" r="10" fill="#e7a86b"/>
  <!-- snout -->
  <ellipse cx="16" cy="19.5" rx="6" ry="5" fill="#fff3e6"/>
  <!-- eyes -->
  <circle cx="12.5" cy="15" r="1.6" fill="#4a352f"/>
  <circle cx="19.5" cy="15" r="1.6" fill="#4a352f"/>
  <!-- nose -->
  <ellipse cx="16" cy="18.5" rx="1.9" ry="1.5" fill="#5a3a36"/>
  <!-- smile -->
  <path d="M13 20.5 Q16 22.5 19 20.5" fill="none" stroke="#5a3a36" stroke-width="1.2" stroke-linecap="round"/>
</svg>
