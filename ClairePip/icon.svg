<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Claire &amp; Pip puppy icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9ec"/>
      <stop offset="1" stop-color="#ff9ec4"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1bd84"/>
      <stop offset="1" stop-color="#e7a86b"/>
    </linearGradient>
  </defs>

  <!-- soft pink rounded-square background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <!-- puppy face -->
  <g>
    <!-- ears -->
    <ellipse cx="150" cy="220" rx="56" ry="92" fill="#c2884f" transform="rotate(-16 150 220)"/>
    <ellipse cx="362" cy="220" rx="56" ry="92" fill="#c2884f" transform="rotate(16 362 220)"/>

    <!-- head -->
    <circle cx="256" cy="258" r="150" fill="url(#fur)"/>

    <!-- snout patch -->
    <ellipse cx="256" cy="312" rx="92" ry="74" fill="#fff3e6"/>

    <!-- eyes -->
    <circle cx="206" cy="246" r="20" fill="#4a352f"/>
    <circle cx="306" cy="246" r="20" fill="#4a352f"/>
    <circle cx="200" cy="240" r="7" fill="#ffffff"/>
    <circle cx="300" cy="240" r="7" fill="#ffffff"/>

    <!-- cheeks -->
    <ellipse cx="172" cy="300" rx="22" ry="14" fill="#ff9ec4" opacity="0.7"/>
    <ellipse cx="340" cy="300" rx="22" ry="14" fill="#ff9ec4" opacity="0.7"/>

    <!-- nose -->
    <ellipse cx="256" cy="300" rx="26" ry="20" fill="#5a3a36"/>
    <ellipse cx="248" cy="293" rx="8" ry="5" fill="#ffffff" opacity="0.55"/>

    <!-- smile + tongue -->
    <path d="M222 332 Q256 360 290 332" fill="none" stroke="#5a3a36" stroke-width="9" stroke-linecap="round"/>
    <path d="M242 350 q14 22 28 0 Z" fill="#ff6fa5"/>

    <!-- collar -->
    <rect x="180" y="392" width="152" height="22" rx="11" fill="#ff6fa5"/>
    <circle cx="256" cy="403" r="16" fill="#ffd45e"/>
    <path d="M256 396 l4 8 l-8 0 z" fill="#f7b733"/>
  </g>
</svg>
